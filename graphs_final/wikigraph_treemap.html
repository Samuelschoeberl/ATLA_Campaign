able\u003cbr\u003e\u003cbr\u003eLevel | Accessible Slots | Total Moves (Newly Learned)\u003cbr\u003e1 | Level 1 | 1 Slot from Level 1\u003cbr\u003e2 | Level 1 | 2 Slots from Level 1\u003cbr\u003e3 | Level 1, Level 2 | 4 Slots (3 from Level 1, 1 from Level 2)\u003cbr\u003e4 | Level 1, Level 2 | 6 Slots (4 from Level 1, 2 from Level 2)\u003cbr\u003e5 | Level 1, Level 2, Level 3 | 9 Slots (5 from Level 1, 3 from Level 2, 1 from Level 3)\u003cbr\u003e6 | Level 1, Level 2, Level 3 | 12 Slots (6 from Level 1, 4 from Level 2, 2 from Level 3)\u003cbr\u003e7 | Level 1, Level 2, Level 3, Level 4 | 16 Slots (7 from Level 1, 5 from Level 2, 3 from Level 3, 1 from Level 4)\u003cbr\u003e8 | Level 1, Level 2, Level 3, Level 4 | 20 Slots (8 from Level 1, 6 from Level 2, 4 from Level 3, 2 from Level 4)\u003cbr\u003e9 | Level 1, Level 2, Level 3, Level 4, Level 5 | 25 Slots (9 from Level 1, 7 from Level 2, 5 from Level 3, 3 from Level 4, 1 from Level 5)\u003cbr\u003e10 | Level 1, Level 2, Level 3, Level 4, Level 5 | 30 Slots (10 from Level 1, 8 from Level 2, 6 from Level 3, 4 from Level 4, 2 from Level 5)\u003cbr\u003e11 | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6 | 36 Slots (11 from Level 1, 9 from Level 2, 7 from Level 3, 5 from Level 4, 3 from Level 5, 1 from Level 6)\u003cbr\u003e12 | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6 | 42 Slots (12 from Level 1, 10 from Level 2, 8 from Level 3, 6 from Level 4, 4 from Level 5, 2 from Level 6)\u003cbr\u003e13 | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6, Level 7 | 49 Slots (13 from Level 1, 11 from Level 2, 9 from Level 3, 7 from Level 4, 5 from Level 5, 3 from Level 6, 1 from Level 7)\u003cbr\u003e14 | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6, Level 7 | 56 Slots (14 from Level 1, 12 from Level 2, 10 from Level 3, 8 from Level 4, 6 from Level 5, 4 from Level 6, 2 from Level 7)\u003cbr\u003e15 | Level 1 - Level 8 | 64 Slots (15 from Level 1, 13 from Level 2, 11 from Level 3, 9 from Level 4, 7 from Level 5, 5 from Level 6, 3 from Level 7, 1 from Level 8)\u003cbr\u003e16 | Level 1 - Level 8 | 72 Slots (16 from Level 1, 14 from Level 2, 12 from Level 3, 10 from Level 4, 8 from Level 5, 6 from Level 6, 4 from Level 7, 2 from Level 8)\u003cbr\u003e17 | Level 1 - Level 9 | 81 Slots (17 from Level 1, 15 from Level 2, 13 from Level 3, 11 from Level 4, 9 from Level 5, 7 from Level 6, 5 from Level 7, 3 from Level 8, 1 from Level 9)\u003cbr\u003e18 | Level 1 - Level 9 | 90 Slots (18 from Level 1, 16 from Level 2, 14 from Level 3, 12 from Level 4, 10 from Level 5, 8 from Level 6, 6 from Level 7, 4 from Level 8, 2 from Level 9)\u003cbr\u003e19 | Level 1 - Level 9 | 99 Slots (19 from Level 1, 17 from Level 2, 15 from Level 3, 13 from Level 4, 11 from Level 5, 9 from Level 6, 7 from Level 7, 5 from Level 8, 3 from Level 9)\u003cbr\u003e20 | Level 1 - Level 9 | 108 Slots (20 from Level 1, 18 from Level 2, 16 from Level 3, 14 from Level 4, 12 from Level 5, 10 from Level 6, 8 from Level 7, 6 from Level 8, 4 from Level 9)\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eExplanation:\u003cbr\u003e\u003cbr\u003e1. Slots Increase Each Level: As characters level up, they gain slots to learn new moves, and the distribution of slots ensures steady growth and access to higher-level moves.\u003cbr\u003e2. Balanced Progression: Players gain slots evenly while progressively unlocking new levels at Levels 3, 5, 7, 9, 11, 13, 15, and 17.\u003cbr\u003e\u003cbr\u003eLevel 1\u003cbr\u003eLevel 2\u003cbr\u003eLevel 3\u003cbr\u003eLevel 4\u003cbr\u003eLevel 5\u003cbr\u003eLevel 6\u003cbr\u003eLevel 7\u003cbr\u003eLevel 8\u003cbr\u003eLevel 9\u003cbr\u003e\u003cbr\u003e[\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAirbending\u003cbr\u003eAirbending","Move or disperse most Lingering Damage effects\u003cbr\u003eAirbending","Movement per Round:\u003cbr\u003e10 meters + Airbending Level  3\u003cbr\u003e \u003cbr\u003eMany Airbending techniques can boost movement\u003cbr\u003e[[Airbending]]","","Avatar Spirit Check\u003cbr\u003eRoll a d20 as part of a spirit-focused ritual or when prompted by the GM (typically at key story beats or after using a Spirit Stone).\u003cbr\u003e- If the roll is even: you gain a number of temporary Spiritbending spellslots equal to the d20 result. These slots last until the end of the current scene or until spent, whichever comes first.\u003cbr\u003e- If the roll is odd: you do not gain slots, but you receive one Spirit Echo \u2014 a small, narratively useful boon (example: advantage on one Spiritbending check, a single short vision providing a clue, or temporary insight on a spirit's motive). The GM chooses the precise echo based on context.\u003cbr\u003eRules & limits (assumptions \u2014 adjust with GM):\u003cbr\u003e- Maximum gained slots cannot exceed the character's Bridge Level (or another GM-set cap).\u003cbr\u003e- This check is usually available once per long rest unless a Spirit Stone or special ritual grants repeated checks.\u003cbr\u003e- Spirit slots gained are of the lowest available Spiritbending tier and must be used for Spiritbending moves or effects.\u003cbr\u003eExample:\u003cbr\u003e- You roll a d20 and get 14 (even). You gain 14 temporary Spiritbending spellslots (subject to the GM cap). You spend 2 of them to cast a Spirit Ward and keep the rest until the end of the scene.\u003cbr\u003eAvatar Spirit Bridge Level\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCollectionfile\u003cbr\u003eSpiritbending represents techniques and rituals that draw on the Avatar Spirit or local spirit presences. These moves often focus on communication, protection, travel between worlds, and subtle influence rather than raw damage.\u003cbr\u003eHow it works (tiny contract):\u003cbr\u003e- Resource: Spiritbending slots. These come from your Bridge Level, Spirit Stones, and occasional Avatar Spirit Checks.\u003cbr\u003e- Use: Spend slots to cast Spiritbending moves (see Spiritbending Moves.md).\u003cbr\u003e- Limits: The GM may cap maximum temporary slots gained from checks or stones to preserve balance.\u003cbr\u003eWhen to use:\u003cbr\u003e- During rituals, when interacting with spirits, when entering spirit-touched locations, or as part of major story beats involving the Avatar Spirit.\u003cbr\u003eRisks:\u003cbr\u003e- Spiritbending can attract attention from powerful spirits. Overuse or reckless bargaining may cause hauntings, covenants, or spirit debt.\u003cbr\u003eQuick references:\u003cbr\u003e- Moves and examples: Spiritbending Moves\u003cbr\u003e- Mechanics for gaining slots: Avatar Spirit Check\u003cbr\u003e- Progression and Bridge mechanics: Avatar Spirit Bridge Level\u003cbr\u003eTeam-up Moves\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Spiritbending --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Avatar Spirit Bridge\u003cbr\u003e                  \u251c\u2500\u2500 Avatar Spirit Check.md\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending Moves.md\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","Collectionfile\u003cbr\u003eSpiritbending represents techniques and rituals that draw on the Avatar Spirit or local spirit presences. These moves often focus on communication, protection, travel between worlds, and subtle influence rather than raw damage.\u003cbr\u003eHow it works (tiny contract):\u003cbr\u003e- Resource: Spiritbending slots. These come from your Bridge Level, Spirit Stones, and occasional Avatar Spirit Checks.\u003cbr\u003e- Use: Spend slots to cast Spiritbending moves (see Spiritbending Moves.md).\u003cbr\u003e- Limits: The GM may cap maximum temporary slots gained from checks or stones to preserve balance.\u003cbr\u003eWhen to use:\u003cbr\u003e- During rituals, when interacting with spirits, when entering spirit-touched locations, or as part of major story beats involving the Avatar Spirit.\u003cbr\u003eRisks:\u003cbr\u003e- Spiritbending can attract attention from powerful spirits. Overuse or reckless bargaining may cause hauntings, covenants, or spirit debt.\u003cbr\u003eQuick references:\u003cbr\u003e- Moves and examples: Spiritbending Moves\u003cbr\u003e- Mechanics for gaining slots: Avatar Spirit Check\u003cbr\u003e- Progression and Bridge mechanics: Avatar Spirit Bridge Level\u003cbr\u003eTeam-up Moves\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Spiritbending --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Avatar Spirit Bridge\u003cbr\u003e                  \u251c\u2500\u2500 Avatar Spirit Check.md\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending Moves.md\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","Avatar Spirit Check\u003cbr\u003eRoll a d20 as part of a spirit-focused ritual or when prompted by the GM (typically at key story beats or after using a Spirit Stone).\u003cbr\u003e- If the roll is even: you gain a number of temporary Spiritbending spellslots equal to the d20 result. These slots last until the end of the current scene or until spent, whichever comes first.\u003cbr\u003e- If the roll is odd: you do not gain slots, but you receive one Spirit Echo \u2014 a small, narratively useful boon (example: advantage on one Spiritbending check, a single short vision providing a clue, or temporary insight on a spirit's motive). The GM chooses the precise echo based on context.\u003cbr\u003eRules & limits (assumptions \u2014 adjust with GM):\u003cbr\u003e- Maximum gained slots cannot exceed the character's Bridge Level (or another GM-set cap).\u003cbr\u003e- This check is usually available once per long rest unless a Spirit Stone or special ritual grants repeated checks.\u003cbr\u003e- Spirit slots gained are of the lowest available Spiritbending tier and must be used for Spiritbending moves or effects.\u003cbr\u003eExample:\u003cbr\u003e- You roll a d20 and get 14 (even). You gain 14 temporary Spiritbending spellslots (subject to the GM cap). You spend 2 of them to cast a Spirit Ward and keep the rest until the end of the scene.\u003cbr\u003eAvatar Spirit Bridge Level\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCollectionfile\u003cbr\u003eCollectionfile \u003cbr\u003eSpiritbending Moves\u003cbr\u003eSpiritbending moves are special techniques that use the Avatar Spirit's connection to the Spirit World. They tend to be more narrative and rarely purely destructive \u2014 instead focusing on influence, protection, communication, and spiritual transformation.\u003cbr\u003eCore contract:\u003cbr\u003e- Inputs: Spiritbending slots (from Bridge Level, Spirit Stones, or Avatar Spirit Checks).\u003cbr\u003e- Outputs: A move effect (see moves below).\u003cbr\u003e- Failure modes: On a failed GM opposed roll or failed concentration, some spirit effects can backfire or produce an unintended Spirit Echo.\u003cbr\u003eSample Moves\u003cbr\u003e1. Spirit Ward (cost: 2 slots)\u003cbr\u003e- Effect: Create a protective aura that grants allies within 3m + (1m \u00d7 slots used) advantage on Spirit-related saves for X minutes.\u003cbr\u003e2. Soul Sight (cost: 1 slot)\u003cbr\u003e- Effect: You and one ally can see invisible spirits or spirit effects for 1 minute. Provides a single insight on a spirit's nature.\u003cbr\u003e3. Calm of Ages (cost: 3 slots)\u003cbr\u003e- Effect: Attempt to pacify a hostile spirit or calm an area. Target makes a WIS save vs DC = 8 + slots used; on failure the spirit is pacified for 1d6 minutes.\u003cbr\u003e4. Spirit Relay (cost: variable)\u003cbr\u003e- Effect: Spend slots to send a short message into the Spirit World (or receive one). Each slot adds clarity and range.\u003cbr\u003e5. Ancestral Echo (cost: 4 slots)\u003cbr\u003e- Effect: Temporarily call on an ancestor's skill \u2014 grant an ally a one-time automatic success on a non-combat skill check tied to the ancestor's expertise.\u003cbr\u003eDesign notes:\u003cbr\u003e- Moves should be negotiated with the GM for balance and narrative fit.\u003cbr\u003e- Spiritbending is more flexible than elemental bending: creativity and roleplay matter.\u003cbr\u003eSpiritbending\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Spiritbending Moves --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Avatar Spirit Bridge\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending.md\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","Avatar Spirit Check\u003cbr\u003e\u003cbr\u003eRoll a d20 as part of a spirit-focused ritual or when prompted by the GM (typically at key story beats or after using a Spirit Stone).\u003cbr\u003e\u003cbr\u003e- If the roll is even: you gain a number of temporary Spiritbending spellslots equal to the d20 result. These slots last until the end of the current scene or until spent, whichever comes first.\u003cbr\u003e- If the roll is odd: you do not gain slots, but you receive one Spirit Echo \u2014 a small, narratively useful boon (example: advantage on one Spiritbending check, a single short vision providing a clue, or temporary insight on a spirit's motive). The GM chooses the precise echo based on context.\u003cbr\u003e\u003cbr\u003eRules & limits (assumptions \u2014 adjust with GM):\u003cbr\u003e\u003cbr\u003e- Maximum gained slots cannot exceed the character's Bridge Level (or another GM-set cap).\u003cbr\u003e- This check is usually available once per long rest unless a Spirit Stone or special ritual grants repeated checks.\u003cbr\u003e- Spirit slots gained are of the lowest available Spiritbending tier and must be used for Spiritbending moves or effects.\u003cbr\u003e\u003cbr\u003eExample:\u003cbr\u003e\u003cbr\u003e- You roll a d20 and get 14 (even). You gain 14 temporary Spiritbending spellslots (subject to the GM cap). You spend 2 of them to cast a Spirit Ward and keep the rest until the end of the scene.\u003cbr\u003e\u003cbr\u003eAvatar Spirit Bridge Level\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCollectionfile\u003cbr\u003eCollectionfile \u003cbr\u003eSpiritbending Moves\u003cbr\u003e\u003cbr\u003eSpiritbending moves are special techniques that use the Avatar Spirit's connection to the Spirit World. They tend to be more narrative and rarely purely destructive \u2014 instead focusing on influence, protection, communication, and spiritual transformation.\u003cbr\u003e\u003cbr\u003eCore contract:\u003cbr\u003e\u003cbr\u003e- Inputs: Spiritbending slots (from Bridge Level, Spirit Stones, or Avatar Spirit Checks).\u003cbr\u003e- Outputs: A move effect (see moves below).\u003cbr\u003e- Failure modes: On a failed GM opposed roll or failed concentration, some spirit effects can backfire or produce an unintended Spirit Echo.\u003cbr\u003e\u003cbr\u003eSample Moves\u003cbr\u003e\u003cbr\u003e1. Spirit Ward (cost: 2 slots)\u003cbr\u003e\u003cbr\u003e- Effect: Create a protective aura that grants allies within 3m + (1m \u00d7 slots used) advantage on Spirit-related saves for X minutes.\u003cbr\u003e\u003cbr\u003e2. Soul Sight (cost: 1 slot)\u003cbr\u003e\u003cbr\u003e- Effect: You and one ally can see invisible spirits or spirit effects for 1 minute. Provides a single insight on a spirit's nature.\u003cbr\u003e\u003cbr\u003e3. Calm of Ages (cost: 3 slots)\u003cbr\u003e\u003cbr\u003e- Effect: Attempt to pacify a hostile spirit or calm an area. Target makes a WIS save vs DC = 8 + slots used; on failure the spirit is pacified for 1d6 minutes.\u003cbr\u003e\u003cbr\u003e4. Spirit Relay (cost: variable)\u003cbr\u003e\u003cbr\u003e- Effect: Spend slots to send a short message into the Spirit World (or receive one). Each slot adds clarity and range.\u003cbr\u003e\u003cbr\u003e5. Ancestral Echo (cost: 4 slots)\u003cbr\u003e\u003cbr\u003e- Effect: Temporarily call on an ancestor's skill \u2014 grant an ally a one-time automatic success on a non-combat skill check tied to the ancestor's expertise.\u003cbr\u003e\u003cbr\u003eDesign notes:\u003cbr\u003e\u003cbr\u003e- Moves should be negotiated with the GM for balance and narrative fit.\u003cbr\u003e- Spiritbending is more flexible than elemental bending: creativity and roleplay matter.\u003cbr\u003e\u003cbr\u003eSpiritbending\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Spiritbending Moves --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Avatar Spirit Bridge\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending.md\u003cbr\u003e\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","","","Glassfruit Team-Up Techniques \u003cbr\u003e\u003cbr\u003eX = yz\u003cbr\u003e\u003cbr\u003e-  are the number of bending slots contributed by each bender.\u003cbr\u003e    \u003cbr\u003e- This rewards balanced team effort over just one person dumping points.\u003cbr\u003e    \u003cbr\u003e-X = y \u00d7 z.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e\u003e Example:\u003cbr\u003e\u003e \u003cbr\u003e\u003e - Earthbender contributes 2 slots (y = 2)\u003cbr\u003e\u003e     \u003cbr\u003e\u003e - Firebender contributes 3 (z = 3)\u003cbr\u003e\u003e     \u2192 X = 2 \u00d7 3 = 6\u003cbr\u003e\u003cbr\u003eThese are powerful, multi-element, terrain-altering moves that consume Glassfruit Seeds. Each scales based on X and has different effects depending on the seed used.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd34 Inferno Bloom (Red Flamegrape)\u003cbr\u003e\u003cbr\u003eMust be initiated by a Firebender in line of sight\u003cbr\u003e\u003cbr\u003e\u003e A cluster of buried Flame-glass shards detonates in a chain Reaction.\u003cbr\u003e\u003cbr\u003e- Effect: Explosion in an area, dealing Xd6  bludgeoning + half fire damage\u003cbr\u003e    \u003cbr\u003e- Radius: 2  meter  X\u003cbr\u003e    \u003cbr\u003e- Lingering Effect\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udca8Resonant Collapse (Blue Soundbanana)\u003cbr\u003eMust be initiated by a Airbender in line of sight \u003cbr\u003e\u003cbr\u003e\u003e A soundblast builds from multiple frequencies and shatters the ground.\u003cbr\u003e\u003cbr\u003e- Effect: Targets in area must make CON save of X2 or take Xd8 thunder damage and fall prone\u003cbr\u003e    \u003cbr\u003e- Secondary: Earth terrain in the zone becomes difficult terrain\u003cbr\u003e    \u003cbr\u003e- Radius:  2X meter\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 12, causes localized landslide or ceiling collapse in enclosed space\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Clear out guards, knock down spirit constructs\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd35 BlueBerry Glass Surge\u003cbr\u003eMust be initiated by a Waterbender in line of sight\u003cbr\u003e\u003cbr\u003e\u003e  Stick and grow trapping enemies and reshaping the terrain.\u003cbr\u003e\u003cbr\u003e- Effect: Targets in area must make  a DCX  2 Dex save to jump aside or  get Immobilised in cold soft and barely liquid Glass.\u003cbr\u003e    \u003cbr\u003e- Radius: X  2\u003cbr\u003e    \u003cbr\u003e- Duration:  X minutes but trapped creatures can as an Action make a strength saving throws to break out with the same DC - Rounds since getting trapped\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 8, brambles regenerate once if destroyed\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Reshape battlefield, trap beasts or enemy squads\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udfe1 FlashLemon Refractor Beam \u003cbr\u003eMust be initiated by a Firebender in line of sight\u003cbr\u003e\u003cbr\u003e\u003e Focused light is amplified by mirrored shards into a blinding beam.\u003cbr\u003e- Effect: Targets in area must make  a DCX  2 Int save to shield or close their eyes or be Blinded for one turn\u003cbr\u003eRange:  10  X meter cone\u003cbr\u003e- Bonus: Deal Xd8 radiant damage to one target hit directly\u003cbr\u003e    \u003cbr\u003e- Lasting Effect: All affected enemies suffer disadvantage on perception for 4 turns\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 10, the Focused damage is doubled \u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\u26aa Soulseed Harmonic Seal (Clear Soulseed)\u003cbr\u003eMust be initiated by another Earthbender in line of sight\u003cbr\u003e\u003e A ritual resonance of GlassSeeds pressed on the Ground around the earthbenders \u003cbr\u003e   Concentration for both\u003cbr\u003e- Effect: As the air vibrates with a cleansing energy as creatures of your choice within radius gain 10  X General Armor\u003cbr\u003e\u003cbr\u003e- Radius: within line of sight up to 100 meter\u003cbr\u003e    \u003cbr\u003e- Duration: Lasts until stopped concentrating or for 1 hour.\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 15, the seal becomes permanent unless shattered by spiritual corruption\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Close spirit portals, bind corrupted spirits, defend a holy site\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEarthbending \u003cbr\u003eAirbending\u003cbr\u003eWaterbending\u003cbr\u003eFirebending\u003cbr\u003eTeam-up Moves","\ud83c\udf47 Origin: \u003cbr\u003e\u003cbr\u003eHigh on the outer cliffs of Omashu and the surrounding valley grow the rare Glassfruit Trees\u2014bizarre plants that draw heavy mineral content from the stone and soil, producing glass-like fruit with dense crystalline seeds. These seeds:\u003cbr\u003e\u003cbr\u003e- Grow in five known varieties, each with distinct elemental-reactive properties.\u003cbr\u003e    \u003cbr\u003e- Can be manipulated by Earthbenders with precise control, refined through spiritual discipline.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eLocal legend says the Earth Lion Turtle left these trees here, believing their presence would help the people grow with stone, not just build from it.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003ePracticed by: Earthbenders of Omashu, the secretive Order of the Glassfruit  \u003cbr\u003eCore Techniques:\u003cbr\u003e\u003cbr\u003eGlassbenders use Glassfruit Seeds as the basis of their fighting and crafting style. Unlike traditional Earthbending, this form is:\u003cbr\u003e\u003cbr\u003e- Finer, with smaller, more precise motions than usual Earthbending .\u003cbr\u003e    \u003cbr\u003e- Often done with bare hands or finger movements, not stances.\u003cbr\u003e    \u003cbr\u003e- Focused on resonance, fracturing, refraction, and vibrational manipulation.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf08 The Five Seeds of the Glassfruit:\u003cbr\u003e\u003cbr\u003eEach seed color has unique applications:\u003cbr\u003e\u003cbr\u003e1. Red Flameglass\u003cbr\u003e    \u003cbr\u003e    - Slightly combustible. Ignites under pressure or heat.\u003cbr\u003e        \u003cbr\u003e    - Used in explosive traps, ignited whips, or forged blades.\u003cbr\u003e        \u003cbr\u003e    - Enhanced by Firebenders.\u003cbr\u003e        \u003cbr\u003e2. Blue Soundstone\u003cbr\u003e    \u003cbr\u003e    - Vibrates and hums when bent.\u003cbr\u003e        \u003cbr\u003e    - Used in sound manipulation, echolocation, sonic shockwaves.\u003cbr\u003e        \u003cbr\u003e    - Enhanced by Airbenders.\u003cbr\u003e        \u003cbr\u003e3. Green Bramblecrystal\u003cbr\u003e    \u003cbr\u003e    - Fractal growth pattern. Rapidly expands under water or chi.\u003cbr\u003e        \u003cbr\u003e    - Used for entrapment, growing crystal armor, or climbing gear.\u003cbr\u003e        \u003cbr\u003e    - Enhanced by Waterbenders.\u003cbr\u003e        \u003cbr\u003e4. Yellow Flashcore\u003cbr\u003e    \u003cbr\u003e    - Emits blinding pulses under friction or chi stimulation.\u003cbr\u003e        \u003cbr\u003e    - Used in stunning bursts, signal flares, or reflective barriers.\u003cbr\u003e        \u003cbr\u003e    - Enhanced by Light-reflective surfaces or Sun Chi.\u003cbr\u003e        \u003cbr\u003e5. Clear Soulseed\u003cbr\u003e    \u003cbr\u003e    - Rare. Used for resonance harmonization and spiritual bending.\u003cbr\u003e        \u003cbr\u003e    - Used in rituals, spirit communication, and healing constructs.\u003cbr\u003e        \u003cbr\u003e    - Only effective when paired with a Resonance Stone.\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd25 The Crystalbenders\u003cbr\u003e\u003cbr\u003eA secret sect called the Order of the Crystalfang lives beneath Omashu\u2019s outer wall in vast, glass-tiled tunnels. They are:\u003cbr\u003e\u003cbr\u003e- A multibender alliance: Earthbenders, Firebenders, Airbenders working in tandem.\u003cbr\u003e    \u003cbr\u003e- Focused on refining Glassfruit Seeds into glass weapons, armor, instruments, and ritual relics.\u003cbr\u003e    \u003cbr\u003e- Trained in team bending maneuvers, using Fire to heat and shape, Air to cool and vibrate, and Earth to control and fracture.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eThey believe the art of Glassbending is a gift of the Lion Turtle, and they worship a large Resonance Stone known as:\u003cbr\u003e\u003cbr\u003e\u003e \u201cThe Heart of Clarity\u201d\u003cbr\u003e\u003cbr\u003eThis Relic is deeply attuned to spirit energy and plays tones that only Crystalfangs can interpret. Some say it sings when the right soul is nearby.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf00 Resonance Stone & the Party:\u003cbr\u003e\u003cbr\u003eThe Heart of Clarity is actually one of several Resonance Stones\u2014ancient spiritual relics tied to the slumbering Lion Turtle.\u003cbr\u003e\u003cbr\u003eThe party must obtain or attune to it to:\u003cbr\u003e\u003cbr\u003e- Unlock advanced spiritual techniques.\u003cbr\u003e    \u003cbr\u003e- Amplify their elemental abilities in resonance with the world.\u003cbr\u003e    \u003cbr\u003e- Possibly awaken latent powers or allow inter-elemental harmony.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udde9 Hooks:\u003cbr\u003e\u003cbr\u003e- A Crystalfang initiate seeks the party's help after the Heart of Clarity goes silent for the first time in generations.\u003cbr\u003e    \u003cbr\u003e- The Order is being manipulated by a rogue faction of Stonebloods who want to use the Resonance Stone to awaken the Lion Turtle.\u003cbr\u003e    \u003cbr\u003e- Spirit-corrupted Glassfruit trees begin growing in unnatural ways\u2014hinting at a breach from the Spirit World.","","","","","Agni Kai Style\u003cbr\u003efirebending #style #agnikai\u003cbr\u003e\u003cbr\u003e- Duels emphasize precision and dominance.\u003cbr\u003e- Move: Burning Duel\u003cbr\u003e  - Action: Choose a single target and engage them in a duel. Both you and the target gain +2 to attack rolls against each other until one is incapacitated.\u003cbr\u003e  - Lingering Effect: The ground around you is superheated; creatures entering the area take 1d6 fire damage.\u003cbr\u003eFirebending","Classic Firebending\u003cbr\u003efirebending #style #classic\u003cbr\u003e\u003cbr\u003e controlls them to home to the X Targets)\u003cbr\u003e\u003cbr\u003eEarthbending \u003cbr\u003eAirbending\u003cbr\u003eTeam-up Moves","","Action\u003cbr\u003eLevel 3\u003cbr\u003e\u003cbr\u003e  - Range: 3  Firebending Slot meters.\u003cbr\u003e  - Duration: 2 rounds Concentration.\u003cbr\u003e  - Create a mirage of heat, imposing disadvantage on attack rolls against creatures within a 10-foot radius of a point you choose.\u003cbr\u003eFirebending","","You may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  X: X number of projectiles \u003cbr\u003e-  Y: Yd6 Damage per projectile\u003cbr\u003e \u003cbr\u003e- One waterbender shoots X Water Projectiles (rolls the attack role) and the other one Freezes them  rolls the damage rolls)\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003eTeam-up Moves","Must be initiated by at least two Waterbenders.  \u003cbr\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  X: X  10 Barrier Armor \u003cbr\u003e-  Y: Y  5 Healing at the start of their turn\u003cbr\u003e\u003cbr\u003e- Encase a willing ally in a jagged prism of glacial ice with a liquid healing core.\u003cbr\u003e    \u003cbr\u003e- The ally immediately gains the effects of Barrier Armor\u003cbr\u003e    \u003cbr\u003e- At the start of their next turn, as the ice thaws, they are healed for 2 \u00d7 Y but their movement is halved.\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003eTeam-up Moves\u003cbr\u003eHealing","","wikigraph_treemap.html\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eHow efficiently you use your Waterbottle  that you can carry with you.\u003cbr\u003eWaterbending Level | Waterbottle Water Charges\u003cbr\u003e1-4 | 1\u003cbr\u003e5-8 | 2\u003cbr\u003e9-12 | 3\u003cbr\u003e13-16 | 4\u003cbr\u003e17-20 | 5\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u00 cbr\u003e        \u003cbr\u003eAdvanced Technique (Mastery Level):\u003cbr\u003e- Cleansing Veil: Condenses the mist into a swirling cloak around allies, granting them resistance to poison, disease, or negative spiritual effects for a short duration.\u003cbr\u003eWaterbending\u003cbr\u003eLevel 1\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eReaction\u003cbr\u003e- Range: 5  Waterbending Levelmeter.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender can attempt to freeze a creature that has been hit by a Move using Water Charges. It has to succeed a Strength Saving throw against your Waterbending DC or become Immobilised.\u003cbr\u003eLinks:\u003cbr\u003e- Waterbending Level\u003cbr\u003eWaterbending\u003cbr\u003eLevel 2\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eIce Daggers (2nd Level Move)\u003cbr\u003e- Cost: 1-2CL Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 20 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender creates sharp daggers of ice to hurl at targets.\u003cbr\u003e    - Attack Roll: Int + Proficiency\u003cbr\u003e- Damage: 1d8 + Int modifier piercing damage per dagger (can create up to 2CL daggers).\u003cbr\u003eLinks:\u003cbr\u003e- CL\u003cbr\u003e- Proficiency\u003cbr\u003e- Ice Daggers\u003cbr\u003e- Int\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003eLevel 2\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCyclic Flow\u003cbr\u003eConcentration\u003cbr\u003eLevel 3\u003cbr\u003e    \u003cbr\u003eRange: 1  Water Charges Meter radius cloud\u003cbr\u003eEffect:\u003cbr\u003e Water Charges  d8 Healing to every creature that was in the clouds radius during the Concentration\u003cbr\u003e- Interactions:\u003cbr\u003e    - Can be moved by Airbenders.\u003cbr\u003e        \u003cbr\u003e    - Can be dispersed or destroyed by strong firebending or extreme heat breaking Cyclic Flow\u003cbr\u003e        \u003cbr\u003eWaterbending\u003 ","","Defensive Techniques\u003cbr\u003e\u003cbr\u003eChi Blockers excel at evading and mitigating damage through agility and strategic positioning.\u003cbr\u003e\u003cbr\u003eTechniques\u003cbr\u003e- Enhanced Reflexes: Gain temporary bonuses to evasion.\u003cbr\u003e- Counterattack: Strike back immediately after dodging.","Energy Points\u003cbr\u003e\u003cbr\u003eChi Blockers use Energy Points (EP) to perform their moves. EP are a finite resource that replenishes during rests or by using specific techniques. \u003cbr\u003e\u003cbr\u003eManaging EP\u003cbr\u003e- Base EP: 2CL\u003cbr\u003e- Replenish: Gain 2 EP at the End of your turn if not using any EP this Turn.","","Chi Blocking Moves\u003cbr\u003e\u003cbr\u003eChi Blockers have a range of moves categorized by levels, growing more potent as they develop their skills.\u003cbr\u003e\u003cbr\u003eMove Levels\u003cbr\u003e- Level 1: Basic disruption techniques.\u003cbr\u003e- Level 2: Advanced strikes with added effects.\u003cbr\u003e- Level 3: High-impact moves that exhaust opponents.","","You have your CL  2  amount of Transformation Points\u003cbr\u003etransformation\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLevel 3 \u003cbr\u003e- Range: CL  1 meters.\u003cbr\u003e- Duration: Concentration, up to 1 Minute.\u003cbr\u003eEffects:\u003cbr\u003e- Harness precision air currents to perform subtle or delicate tasks from a distance.\u003cbr\u003e-  Manipulate a small pbject within range or make fine adjustments as if using your hands.\u003cbr\u003e- You can perform sleight-of-hand checks or disable small mechanisms remotely.\u003cbr\u003eUsage: Precision tool for intricate tasks or stealth.\u003cbr\u003eLinks:\u003cbr\u003e- Utility\u003cbr\u003eAirbending\u003cbr\u003eLevel 3\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eIce Daggers (2nd Level Move)\u003cbr\u003e- Cost: 1-2CL Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 20 ft.\u003cbr\u00 rated from the humans I cared for.\u003cbr\u003eAfter countless years, I found a way to cross back through an abandoned Air Nomad temple. When I arrived, I was shocked to see how much the world had changed\u2014machines, bending powers, and humans who no longer lived in harmony with nature.\u003cbr\u003eConfused and fascinated, I wander this unfamiliar world, trying to understand what has happened and how I can help again.\u003cbr\u003e---\u003cbr\u003eBase Abilities (Available in all forms)\u003cbr\u003e- Spiritual Nourishment:  \u003cbr\u003e    Can create small plants or fruits that provide minor healing (1d6 + Proficiency bonus) or temporary bonuses:\u003cbr\u003e    \u003cbr\u003e    - Energizing Fruit: Grants +2 temporary HP per character level.\u003cbr\u003e    - Focus Herb: Grants Advantage on the next attack roll or saving throw.  \u003cbr\u003e        Can be used twice per long rest, with effects lasting up to 1 hour.\u003cbr\u003e- Limited Airbending:\u003cbr\u003e    \u003cbr\u003e    - Gust: Push or pull objects or creatures within a 15 ft range (similar to the gust cantrip).\u003cbr\u003e    - Air Barrier: Create a brief 5-ft circular shield of air, granting +2 AC to yourself or an ally for 1 round.\u003cbr\u003e    - Wind Aided Movement: Gain 10 extra feet of movement speed for 1 round.\u003cbr\u003e- Connection to Nature:  \u003cbr\u003e    Gains Advantage on Nature checks and can communicate simple ideas with animals or spirits.\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eShapeshifting Forms\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eShapeshifting Mechanics\u003cbr\u003e- Transformations Per Long Rest:  \u003cbr\u003e     You have 2  Proficiency Transformation Points per long rest.\u003cbr\u003e    \u003cbr\u003e- Shapeshifting Cost:\u003cbr\u003e\t- Human Form: 0 Transformation Points\u003cbr\u003e    - Flying Lemur: 1 Point\u003cbr\u003e    - Bearturtle: 2 Points \u003cbr\u003e    - Luma\u2019tik 2 Transformation Points\u003cbr\u003e    -\u003cbr\u003e- Exiting the Forms:  \u003cbr\u003e    Transformations end early if the form\u2019s HP is reduced to 0 or voluntarily dropped. Remaining damage spills over to the character\u2019s normal HP. \u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eLinks:\u003cbr\u003e- Armor\u003cbr\u003e- Proficiency\u003cbr\u003e- Strength\u003cbr\u003eTags:\u003cbr\u003eAirbending #transformation\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eBearturtle.webp#### Bearturtle Form (Protection\u002fDefense Form)\u003cbr\u003e- Size: Medium\u003cbr\u003e- On Transform:\u003cbr\u003e\t- Defensive Presence: Allies within 5 meter gain +3 to their AC until you Form Drops.\u003cbr\u003eStat | Value\u003cbr\u003eStrength (STR) | 22 (+6)\u003cbr\u003eDexterity (DEX) | 2 (-4)\u003cbr\u003eConstitution (CON) | 24 (+7)\u003cbr\u003eWisdom(WIS) | 10(+0)\u003cbr\u003eIntelligence(Int) | 8(-1)\u003cbr\u003e- Movement:\u003cbr\u003e    \u003cbr\u003e    - Walk 20 meter.\u003cbr\u003e    - Swim 10 meter\u003cbr\u003e- Abilities in Bearturtle Form:\u003cbr\u003e    - Shell Shield:\u003cbr\u003e\t    - Reaction\u003cbr\u003e\t        When an ally within 3 meter is attacked, impose Disadvantage on the attack roll as you shift to protect them with your shell. Can be used a number of times equal to your Proficiency bonus per long rest.\u003cbr\u003e\t    Tuck in: \u003cbr\u003e\t    - Reaction\u003cbr\u003e\t\t    When you fail a dexterity saving throw you still only take half damage. Your Movement in the next round is halved.\u003cbr\u003e    - Sturdy Form:\u003cbr\u003e\t    - You have Advantage on saving throws against being knocked prone or moved against your will.\u003cbr\u003e    -\u003cbr\u003e    - \u003cbr\u003e- Combat Stats (Bearturtle):\u003cbr\u003e    \u003cbr\u003e    - Evasion: 15\u003cbr\u003e    - \u003cbr\u003e    - Armor: \u003cbr\u003e\t    - 5 Physical Armor\u003cbr\u003e\t    - 3 General Armor\u003cbr\u003e    - HP: 28.\u003cbr\u003e    - Attacks:\u003cbr\u003e        - Powerful Swipe: Melee Weapon Attack, +Strength to hit, 2d6 + Str slashing damage.\u003cbr\u003e\t- Shell Slam (AOE): All creatures within a 1 meter radius must make a Dexterity save DC17 or take 2d8 bludgeoning damage.\u003cbr\u003e    \u003cbr\u003e    \u003cbr\u003eBending Slots:\u003cbr\u003e\tFire Lvl1: 2\u003cbr\u003e\tEarth Lvl1: 1\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eFlying Lemur Form\u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003eStat | Value\u003cbr\u003eStrength (STR) | 6 (-2)\u003cbr\u003eDexterity (DEX) | 24(+7)\u003cbr\u003eConstitution (CON) | 7 (-2)\u003cbr\u003eWisdom(WIS) | 14(+2)\u003cbr\u003eIntelligence(Int) | 8(-1)\u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003e- Size: Small\u003cbr\u003e    \u003cbr\u003e- Movement:\u003cbr\u003e    - Fly 20 m (highly maneuverable).\u003cbr\u003e    - Climb 20 m (adapted to vertical movement).\u003cbr\u003e- Abilities in Flying Lemur Form:\u003cbr\u003e    - Silent Glide: Advantage on Stealth checks while flying.\u003cbr\u003e    - Acute Senses: Advantage on Perception checks that rely on sight or hearing.\u003cbr\u003e    - Quick Escape: Disengage or dash as a Bonus Action.\u003cbr\u003e- Combat Stats (Flying Lemur):\u003cbr\u003e    \u003cbr\u003e    - Evasion: 20\u003cbr\u003e    - HP: 6 (fragile but evasive).\u003cbr\u003e    - Attacks:\u003cbr\u003e        - Razor Claws: Melee Weapon Attack, Dex+Proficiency to hit, 1d4 slashing damage.\u003cbr\u003e- Uses:  \u003cbr\u003e    Perfect for scouting, infiltration, or swift movement through difficult terrain. The form allows quick evasion and small-scale reconnaissance.\u003cbr\u003eBending Slots:\u003cbr\u003e\tAir Lvl1: 4\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eName: Luma\u2019tik \u2014 Glimmerkin of Cracked Mirrors  \u003cbr\u003eType: Lesser Spirit  \u003cbr\u003eDomain: Light, Trickery  \u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003e---\u003cbr\u003eLuma'tik.png\u003cbr\u003e- Size: Small\u003cbr\u003eStat | Value\u003cbr\u003eStrength (STR) | 4 (-3)\u003cbr\u003eDexterity (DEX) | 16 (+3)\u003cbr\u003eConstitution (CON) | 12 (+1)\u003cbr\u003eWisdom(WIS) | 10(+0)\u003cbr\u003eIntelligence(Int) | 8(-1)\u003cbr\u003e- Ideal for infiltration, distraction, and sensory manipulation. Luma\u2019tik thrives in urban or crystal-laced environments, using its shimmering form and illusions to mislead enemies and aid allies from the shadows. Though not powerful in direct combat, it\u2019s difficult to pin down and annoying to deal with.\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eMovement:\u003cbr\u003e- Fly 15 m (hovering, effortless, emits no sound).\u003cbr\u003e    \u003cbr\u003e- Climb 10 m (can scale smooth surfaces with reflective qualities).\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eAbilities in Luma\u2019tik Form:\u003cbr\u003e- Refraction Veil: While in bright or shifting light, Luma\u2019tik gains advantage on Stealth and cannot be targeted by opportunity attacks. This effect ends if Luma\u2019tik is in total darkness or complete silence.\u003cbr\u003e    \u003cbr\u003e- Mirage Flicker (1\u002fShort Rest): As a Bonus Action, Luma\u2019tik can create up to two illusionary duplicates for 1 minute. Each duplicate mimics its movements and grants attackers disadvantage on attack rolls until they hit Luma\u2019tik.\u003cbr\u003e    \u003cbr\u003e- Pulse of Dazzling Light (3\u002frest): Emit a flash in a 10 m radius. Creatures must succeed on a DC (8 + Wisdom + Proficiency) Constitution saving throw or be blinded until the end of their next turn. Allies who avert their gaze are unaffected.\u003cbr\u003e    \u003cbr\u003e- Glimmerjump: \u003cbr\u003e- Reaction:\u003cbr\u003e\tteleport to any point within 20 m that is brightly lit or reflects light (e.g., mirrors, water, crystal surfaces)\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eCombat Stats:\u003cbr\u003e- Evasion: 17\u003cbr\u003e    \u003cbr\u003e- HP: 21 (fragile, relies on mobility and illusions)\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eAttacks:\u003cbr\u003e- Sparkbite: Melee Weapon Attack, Dex+Proficiency to hit, 1d4 radiant damage. If attacking from stealth, deals an extra 1d4 psychic damage.\u003cbr\u003e    \u003cbr\u003e- Lightshard Dart: Ranged Attack, Dex+Proficiency to hit, 1d6 radiant damage. On hit, target must make a DC (8 + Dex + Proficiency) Wisdom saving throw or have disadvantage on Perception checks for 1 minute.\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eLuma\u2019tik is a playful, capricious entity\u2014often found dancing between fractured crystal surfaces or taunting intruders with flickers of light and laughter. Bonding with this spirit gives a bender or spiritualist access to stealth, misdirection, and flash-based utility, ideal for scouts or cunning tacticians.\u003cbr\u003e---\u003cbr\u003eBending Slots:\u003cbr\u003e\tFire Lvl1: 2\u003cbr\u003e\tEarth Lvl1: 1\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eReaction\u003cbr\u003eLevel 1\u003cbr\u003e- Range: 5  Airbending Slot meters.\u003cbr\u003e- Duration: Instantaneous.\u003cbr\u003e- Damage: 1d6 bludgeoning per Airbending Slot.\u003cbr\u003e- Attack Roll: Dex + Proficiency.\u003cbr\u003e- Use airbending to send a blade of Air hurling at a creature within range\u003cbr\u003eAirbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLevel 2\u003cbr\u003e- Range: 5  Airbending Slot meters.\u003cbr\u003e- Attack Roll: Dex + Proficiency.\u003cbr\u003e- Damage: 1d10 bludgeoning per Airbending Slot. Deals another 1d10  Airbending Slot if the Creature hits a Wall.\u003cbr\u003e- Effects:\u003cbr\u003e\t- Utilize airbending to dash towards an enemy within range within line of sight and hit them with a fast blow of pressurised air. The Target has to succeed a Strength saving throw against your Airbending DC or be knocked back your travelled distance this turn. Deals another 1d10  Airbending Slot if the Creature hits a Wall or similar.\u003cbr\u003eMovement\u003cbr\u003eAirbending\u003cbr\u003eMovement\u003cbr\u003eLevel 2\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e10 + Dex + Proficiency\u003cbr\u003eAirbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e10 + Strength + Proficiency\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Range: Meele\u003cbr\u003e- Attack Roll: Strength + Proficiency.\u003cbr\u003e- Damage: (1+1 Earthbending Slot)d6  bludgeoning.\u003cbr\u003eUsage: Simple meelee attack.\u003cbr\u003eLinks:\u003cbr\u003e- Proficiency\u003cbr\u003e- Strength\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eEarthbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLevel 1\u003cbr\u003e- Range: 3 Earthbending Slot meters\u003cbr\u003e- Attack Roll: Strength + Proficiency.\u003cbr\u003e- Damage: 1d6   Earthbending Slot bludgeoning.\u003cbr\u003eEffect:\u003cbr\u003e- Lift and throw a small rock. Simple ranged attack.\u003cbr\u003eEarthbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eBonus Action\u003cbr\u003e- Range: 3 Earthbending Slot Meters\u003cbr\u003e- Target: 1  Earthbending Slot  Enemies within range\u003cbr\u003eRevert Immobilisation through Ground Lock\u003cbr\u003eLinks:\u003cbr\u003e- Earthbending Slot\u003cbr\u003e- Proficiency\u003cbr\u003e- Ground Lock\u003cbr\u003e- Strength\u003cbr\u003e- Earthbending Moves\u003cbr\u003eTags:\u003cbr\u003eEarthbending #Mobility #Immobilisation\u003cbr\u003eEarthbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e10 + Wisdom + Proficiency\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLevel 1\u003cbr\u003e- Range: 3 Firebending Slot meters\u003cbr\u003e- Attack Roll: Wisdom+ Proficiency.\u003cbr\u003e- Damage: 1d6   Firebending Sl  Dex bludgeoning damage and imposes disadvantage on the target's next Attack Roll.\u003cbr\u003e    - Duration: 1 Minute.\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: 3+ EP.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: Melee.\u003cbr\u003e- Attack: Dex + Proficiency\u003cbr\u003e- Effect:  \u003cbr\u003e    A precise strike that deals no damage but if hit the Target must succeed a DC 10+Proficiency+EP Con Save or be Paralysed until the end of your next Turn. \u003cbr\u003e    - Duration: 1 turn.\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: 5 EP.\u003cbr\u003e- Type: Reaction.\u003cbr\u003e- Range: The original attacks range.\u003cbr\u003e- Effect:  \u003cbr\u003e    When in Melee range to an enemy performing a Bending Move. If they fail a DC 10+Proficiency+EP Dex Save you can redirect the opponent's bending energy back at them using the same bending Move. If they succeed by more than 5 they additionally get to use their Move.\u003cbr\u003e    If you steal a Move that requires concentration it is automatically broken instantly.\u003cbr\u003e    - Duration: Instant.\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: 4 EP.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: Melee.\u003cbr\u003e- Attack: Dex+Proficiency\u003cbr\u003e- Effect:  \u003cbr\u003e    Deliver a powerful blow that if hit restores 6 EP. The Target must succeed on a DC 10 + Proficiency + EP Con Save or become Slowed.\u003cbr\u003e    - Duration: 2 turns.\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","You have your CL  2  amount of Transformation Points\u003cbr\u003e\u003cbr\u003etransformation\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAction\u003cbr\u003eLevel 3 \u003cbr\u003e- Range: CL  1 amage.\u003cbr\u003e[[Firebending]]","[[Action]]\u003cbr\u003e[[Lingering Effect]]\u003cbr\u003e  - **Range:** 1 * [[Firebending Slot]] meters.\u003cbr\u003e  - **Damage:** [[Firebending Slot]]* 2d8 fire.\u003cbr\u003e  - **Attack Roll:** [[Wisdom]] + [[Proficiency]].\u003cbr\u003e  - Release multiple smaller blasts of fire in quick succession, targeting up to three creatures within range.\u003cbr\u003eIf not Specified otherwise, lingering effect last until the start of your next Turn.\u003cbr\u003eIf caused by a damaging Move: Every creature that ends its turn there will get half the original attacks Damage.\u003cbr\u003e[[Firebending]]","[[Bonus Action]]\u003cbr\u003e[[Lingering Effect]]\u003cbr\u003e[[Level 2]]\u003cbr\u003e  - **Range:** 1* [[Firebending Slot]] meter Cone.\u003cbr\u003e  - **Damage:** 1 * [[Firebending Slot]] d6 fire.\u003cbr\u003e  - Unleash a wide wave of flames, forcing creatures in the cone to make a Dexterity saving throw or take full damage.\u003cbr\u003eIf not Specified otherwise, lingering effect last until the start of your next Turn.\u003cbr\u003eIf caused by a damaging Move: Every creature that ends its turn there will get half the original attacks Damage.\u003cbr\u003e[[Firebending]]","","firebending #level3\u003cbr\u003e\u003cbr\u003e- Rage Fuel\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: 3 rounds. Concentration.\u003cbr\u003e  - Transform your stress penalty into a bonus. Gain +1 to accuracy and damage rolls for every stress point. At the end, stress resets to 0.\u003cbr\u003eFirebending","Scorching Aura\u003cbr\u003efirebending #level3\u003cbr\u003e\u003cbr\u003e- Scorching Aura\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: 3 rounds.\u003cbr\u003e  - Creatures within 5 feet of you take 1d6 fire damage at the start of their turn.\u003cbr\u003eFirebending","","[[Action]]\u003cbr\u003e [[Level 4]]\u003cbr\u003e [[Concentration]]\u003cbr\u003e  - **Range:** 3 * [[Firebending Slot]] meters radius centered on yourself. Moves with you and you are immune to its damage.\u003cbr\u003e  - **Duration:** [[Firebending Slot]]\u002f2 rounds. Concentration. \u003cbr\u003e  - **Damage:** [[Firebending Slot]] * 2 d12 fire.\u003cbr\u003e  - Create a localized storm of fire in a 3 * [[Firebending Slot]] meters radius, damaging all creatures within the area.\u003cbr\u003eCon save DC of max(10, Damage Taken \u002f 2)\u003cbr\u003eSome Moves require concentration to keep them up. If you take damage while concentrationg you have to make a Con save with a DC of max(10, Damage Taken \u002f 2)\u003cbr\u003e[[Firebending]]","Lightning Strike\u003cbr\u003efirebending #level4\u003cbr\u003e\u003cbr\u003e- Lightning Strike\u003cbr\u003e  - Action: 2 actions (Charge required).\u003cbr\u003e  - Range: 10  Firebending Slot meters.\u003cbr\u003e  - Duration: Instantaneous.\u003cbr\u003e  - Damage: 4d10 lightning.\u003cbr\u003e  - Attack Roll: Wisdom + Proficiency.\u003cbr\u003e  - After charging for a round, unleash a bolt of lightning at a single target.\u003cbr\u003eFirebending","","Action\u003cbr\u003e  Lingering Effect\u003cbr\u003e- Level 4\u003cbr\u003e  - Range: 3  Firebending Slot meters.\u003cbr\u003e  - Duration: Instantaneous.\u003cbr\u003e  - Damage: Firebending Slot  2 d12 fire.\u003cbr\u003e  - Summon a massive phoenix of fire that flies in a straight line within range, damaging all in its path.\u003cbr\u003e\u003cbr\u003eFirebending\u003cbr\u003eFirebending Slot\u003cbr\u003eFirebending DC","Infernal Form\u003cbr\u003efirebending #level5\u003cbr\u003e\u003cbr\u003e- Infernal Form\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: 1 minute.\u003cbr\u003e  - Transform into a being of pure flame. Gain resistance to all non-magical damage and deal 2d8 fire damage to any creature that attacks you in melee.\u003cbr\u003eFirebending","Meteor Shower\u003cbr\u003efirebending #level5\u003cbr\u003e\u003cbr\u003e- Meteor Shower\u003cbr\u003e  - Action: 2 actions.\u003cbr\u003e  - Range: 50  Firebending Slot meters.\u003cbr\u003e  - Duration: 3 rounds.\u003cbr\u003e  - Summon fiery meteors that fall in a 50-foot radius. Each round, creatures in the area must make Dexterity saving throws or take 4d6 fire damage.\u003cbr\u003eFirebending","Volcanic Eruption\u003cbr\u003efirebending #level5\u003cbr\u003e\u003cbr\u003e- Volcanic Eruption\u003cbr\u003e  - Action: 1 Action.\u003cbr\u003e  - Range: 40  Firebending Slot meters.\u003cbr\u003e  - Duration: Instantaneous.\u003cbr\u003e  - Damage: 6d10 fire.\u003cbr\u003e  - Create a massive eruption of molten rock and fire at a target point, affecting all creatures in a 30-foot radius.\u003cbr\u003eFirebending","","Core Attributes of Firebending\u003cbr\u003efirebending #coreattributes\u003cbr\u003e\u003cbr\u003e- Primary Stat: Wisdom\u003cbr\u003e  - Firebenders rely on their inner focus, discipline, and clarity to control their flames.\u003cbr\u003e- Key Mechanic: Lingering Damage\u003cbr\u003e  - Firebenders create residual damage zones where their fire strikes, representing burning or smoldering terrain.\u003cbr\u003e- Stress Level: Firebenders gain a stress level counter, starting at 0. Stress increases by 1 each time the firebender is hit by an attack. If the stress level exceeds 5, the firebender suffers a -2 penalty to accuracy rolls. At high levels, stress can be managed or turned into a weapon.\u003cbr\u003eFirebending","","- Cost: None.\u003cbr\u003e- Type: Bonus Action.\u003cbr\u003e- Range: 15 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender can freeze a small amount of water, such as a puddle or a drink-sized volume. The higher the Level the more water can be frozen.\u003cbr\u003e    - Duration: Permanent until thawed naturally.\u003cbr\u003e    - Uses: Create slippery surfaces, small barriers, or tools.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Icecubes\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending","Icecubes (Cantrip)\u003cbr\u003e\u003cbr\u003e- Cost: None.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 3m\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender can freeze a small amount of water, such as a puddle or a drink-sized volume. The higher the Level the more water can be frozen.\u003cbr\u003e    - Duration: Permanent until thawed naturally.\u003cbr\u003e    - Uses: Create slippery surfaces, small barriers, or tools.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Icecubes\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003efreezing\u003cbr\u003eWaterbending","- Creating Mist:\u003cbr\u003e- Cost: 1 Water Charge per 10 ft radius .\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 10 ft radius centered on self.\u003cbr\u003e    - Will grow 10 feet per round until full sized\u003cbr\u003e    - Creates a heavily obscured area for concealment that can be absorbed to regain charges (10 feeet radius per Turn) or blown await by air.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending","Shape Water (Cantrip)\u003cbr\u003e\u003cbr\u003e- Cost: None.\u003cbr\u003e- Range: 30 ft.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Duration: At Will. Concentration.\u003cbr\u003e- Effect:  \u003cbr\u003e    You can manipulate a water, shaping it into simple forms, moving it, or changing its state (solid, liquid, mist) temporarily.\u003cbr\u003e    - Limitations: Cannot deal damage but can be used for utility (e.g., extinguishing flames, creating distractions). The higher your Level is the more water can be shaped. Might need an Int ability check.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Shape Water\u003cbr\u003e- Rules\u003cbr\u003e- Int\u003cbr\u003e- Waterbending Moves\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending","","[[Cyclic Flow]]\u003cbr\u003e[[Level 1]]\u003cbr\u003e- **Cost:** 1-3 Water Charges.\u003cbr\u003e- **Type:** [[Action]].\u003cbr\u003e- Duration: 1 round Concentration.\u003cbr\u003e- **Range:** Touch (through water).\u003cbr\u003e- **Effect:**  \u003cbr\u003e    You channel healing energy through water, restoring health to a creature. \u003cbr\u003e\t- If the creature is unconscious the creature becomes stable.\u003cbr\u003e    - **Healing:** 2d8 per charge + [[Int]] modifier at the beginning of your next Turn.\u003cbr\u003e    - **Limitations:** Cannot heal constructs or undead.\u003cbr\u003eCollectionfile \u003cbr\u003eIf Concentration is not broken the Water Charges are refunded.\u003cbr\u003eWaterbending\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Cyclic Flow --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e  .\u002f\u003cbr\u003e  \u251c\u2500\u2500 graphs\u003cbr\u003e      \u2514\u2500\u2500 wikigraphtreemap.html\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Water\u003cbr\u003e                  \u251c\u2500\u2500 Water Charges.md\u003cbr\u003e                  \u2514\u2500\u2500 Waterbending Moves\u003cbr\u003e                      \u251c\u2500\u2500 Level 1\u003cbr\u003e                          \u2514\u2500\u2500 Healing Water.md\u003cbr\u003e                      \u2514\u2500\u2500 Level 3\u003cbr\u003e                          \u2514\u2500\u2500 Healing Mist.md\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e\u003cbr\u003e[[Waterbending]]\u003cbr\u003e[[Level 1]]","Action\u003cbr\u003eLevel 1\u003cbr\u003e\u003cbr\u003e- Cost: 1-3 Water Charges.\u003cbr\u003e- Range: 3  Water Charges meter.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender shoots a sharp, pressurized stream of water at a target.\u003cbr\u003e    - Attack Roll: Int + Proficiency.\u003cbr\u003e    - Damage: Water Charges d8 piercing or Water Charges d6 bludgeoning damage per Charge.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Proficiency\u003cbr\u003e- Piercing Water\u003cbr\u003e- Int\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003eLevel 1","Type: Waterbending spiritbending sub-skill  \u003cbr\u003e\u003cbr\u003eEffect:  \u003cbr\u003eThe bender draws a small amount of water and vaporizes it into a dense mist that spreads over a small to medium area. All creatures within the mist gain Fire Armour.  \u003cbr\u003e\u003cbr\u003eMechanics (TTRPG style):\u003cbr\u003e\u003cbr\u003e- Cost: 1-5 Water Charges\u003cbr\u003e    \u003cbr\u003e- Area: 1 Water Charges Meter radius \u003cbr\u003e    \u003cbr\u003e- Concentration: Water Charges Turns. Every Creature in the area has 10  Water Charges Fire Armor.\u003cbr\u003e    \u003cbr\u003e- Effect: Gradual healing, mental clarity, emotional soothing\u003cbr\u003e    \u003cbr\u003e- Interactions:\u003cbr\u003e    \u003cbr\u003e    - Can be moved by airbenders using wind techniques.\u003cbr\u003e        \u003cbr\u003e    - Can be dispersed or destroyed by strong firebending or extreme heat.\u003cbr\u003e        \u003cbr\u003e        \u003cbr\u003e\u003cbr\u003eAdvanced Technique (Mastery Level):\u003cbr\u003e\u003cbr\u003e- Cleansing Veil: Condenses the mist into a swirling cloak around allies, granting them resistance to poison, disease, or negative spiritual effects for a short duration.\u003cbr\u003eWaterbending\u003cbr\u003eLevel 1","Slicing Water (1st Level Move)\u003cbr\u003e\u003cbr\u003e- Cost: 2 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 15 ft cone.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender unleashes a slicing wave of water in a cone, dealing damage to multiple targets.\u003cbr\u003e    - Saving Throw: Targets make a Dexterity save (DC = 8 + Proficiency + Int mod).\u003cbr\u003e    - Damage: 1d6 slashing damage on a failed save, half on success.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Rules\u003cbr\u003e- Slicing Water\u003cbr\u003e- Waterbending Moves\u003cbr\u003e- Proficiency\u003cbr\u003e- Int\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003eLevel 1","Water Whip (Level 1 Ability)\u003cbr\u003e\u003cbr\u003e- Cost: 1 Water Charge.\u003cbr\u003e- Range: 20 ft.\u003cbr\u003e- Action: 1 Action.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender lashes out with a tendril of water, striking a target within range.\u003cbr\u003e    - Attack Roll: Intelligence + Proficiency Bonus.\u003cbr\u003e    - Damage: 1d8 + Int modifier bludgeoning damage.\u003cbr\u003e    - Special: The target must succeed on a Strength saving throw (DC 10 + Int modifier + Proficiency) or be knocked back 10 feet.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Strength\u003cbr\u003e- Rules\u003cbr\u003e- Water Whip\u003cbr\u003e- Proficiency\u003cbr\u003e- Int\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003eLevel 1","","[[Reaction]]\u003cbr\u003e- **Range:** 5 * [[Waterbending Level]]meter.\u003cbr\u003e- **Effect:**  \u003cbr\u003e    The waterbender can attempt to freeze a creature that has been hit by a Move using [[Water Charges]]. It has to succeed a Strength Saving throw against your [[Waterbending DC]] or become [[Immobilised]].\u003cbr\u003e**Links**:\u003cbr\u003e- \u003cbr\u003eYour Waterbending Level.\u003cbr\u003eWaterbending\u003cbr\u003e[[Waterbending]]\u003cbr\u003e[[Level 2]]","Ice Daggers (2nd Level Move)\u003cbr\u003e\u003cbr\u003e- Cost: 1-2CL Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 20 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender creates sharp daggers of ice to hurl at targets.\u003cbr\u003e    - Attack Roll: Int + Proficiency\u003cbr\u003e- Damage: 1d8 + Int modifier piercing damage per dagger (can create up to 2CL daggers).\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- CL\u003cbr\u003e- Proficiency\u003cbr\u003e- Ice Daggers\u003cbr\u003e- Int\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003eLevel 2","Wall of Water (2nd Level Move)\u003cbr\u003e\u003cbr\u003e- Cost: 3 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 60 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender creates a wall of water up to 30 ft long, 10 ft high, and 1 ft thick.\u003cbr\u003e    - Duration: Concentration, up to 1 minute.\u003cbr\u003e    - Effect: Provides partial cover and can extinguish flames.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Wall of water\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbendingx \u003cbr\u003eWaterbending\u003cbr\u003eLevel 2","Water Tentacles (2nd Level Move)\u003cbr\u003e\u003cbr\u003e- Cost: 2 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 15 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender summons two water tentacles to attack or grapple targets.\u003cbr\u003e    - Attack Roll: Int + Proficiency.\u003cbr\u003e    - Damage: 1d10 bludgeoning damage per tentacle.\u003cbr\u003e    - Grapple: A creature hit by the tentacle must succeed on a Strength saving throw or be restrained.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Strength\u003cbr\u003e- Rules\u003cbr\u003e- Waterbending Moves\u003cbr\u003e- Proficiency\u003cbr\u003e- Water Tentacles\u003cbr\u003e- Int\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003eLevel 2","","[[Cyclic Flow]]\u003cbr\u003e[[Concentration]]\u003cbr\u003e[[Level 3]]\u003cbr\u003e    \u003cbr\u003e[[Range: 1]] * [[Water Charges]] Meter radius cloud\u003cbr\u003eEffect:\u003cbr\u003e [[Water Charges]] * d8 Healing to every creature that was in the clouds radius during the [[Concentration]]\u003cbr\u003e- _Interactions:_\u003cbr\u003e    - Can be _moved_ by Airbenders.\u003cbr\u003e        \u003cbr\u003e    - Can be _dispersed_ or _destroyed_ by strong firebending or extreme heat breaking [[Cyclic Flow]]\u003cbr\u003e        \u003cbr\u003e[[Waterbending]]\u003cbr\u003eCollectionfile \u003cbr\u003eIf Concentration is not broken the Water Charges are refunded.\u003cbr\u003eWaterbending\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Cyclic Flow --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e  .\u002f\u003cbr\u003e  \u251c\u2500\u2500 graphs\u003cbr\u003e      \u2514\u2500\u2500 wikigraphtreemap.html\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Water\u003cbr\u003e                  \u251c\u2500\u2500 Water Charges.md\u003cbr\u003e                  \u2514\u2500\u2500 Waterbending Moves\u003cbr\u003e                      \u251c\u2500\u2500 Level 1\u003cbr\u003e                          \u2514\u2500\u2500 Healing Water.md\u003cbr\u003e                      \u2514\u2500\u2500 Level 3\u003cbr\u003e                          \u2514\u2500\u2500 Healing Mist.md\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e\u003cbr\u003e[[Level 3]]","Level 3\u003cbr\u003e- Cost: 4 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 60 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender creates a solid wall of ice, up to 30ft long 10 ft tall and 10 ft wide.\u003cbr\u003e    - HP: 30 HP.\u003cbr\u003e    - AC: 12.\u003cbr\u003e    - Duration: 1 minute.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Ice Wall\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003eLevel 3","- Cost: 3- 2  CL Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 5 Meter.\u003cbr\u003e- Effect:  \u003cbr\u003e    You create A number of Icicles equal to the used charges.\u003cbr\u003e\tThey swirl around the Target and grants them the Reaction to send any or all of the Ammunition against one target within 100 Meters of them until all Icicles are used.\u003cbr\u003e\tAmmunition:\u003cbr\u003e    - HP: 20 HP.\u003cbr\u003e    - AC: 12.\u003cbr\u003e    - Damage 5d12 + Int Piercing Damage\u003cbr\u003e    - Duration: 1 minute.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003eLevel 3","- Cost: None.\u003cbr\u003e- Type: Passive.\u003cbr\u003e- Range: Self.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender rides atop a thin sheet of water or ice, moving with increased agility.\u003cbr\u003e    - Speed Boost: Gain +30 ft movement speed.\u003cbr\u003e    - Prerequisite: Accessible at a higher level(TBA).\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003eLevel 3","","Shockfreeze (Cantrip)\u003cbr\u003e\u003cbr\u003e- Cost: None.\u003cbr\u003e- Type: Bonus Action.\u003cbr\u003e- Range: The same as the Waterbending used as Action f\u003cbr\u003e- Effect:  \u003cbr\u003e    After using an Action to use a Waterbending Move that consumes water charges you can use your Bonus Action to let every creature hit by your Action roll a Strength Saving throw against your Waterbending DC or become Immobilised. \u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Shockfreeze\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003efreezing\u003cbr\u003eImmobilisation \u003cbr\u003eWaterbending\u003cbr\u003eLevel 4","","- Cost: 1+ EP.\u003cbr\u003e- Type:  Reaction.\u003cbr\u003e- Range: Self.\u003cbr\u003e- Effect:  \u003cbr\u003e    Jump by EP  2 Meter. Allows you to dodge bending attacks with ease.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eChiBlocking","- Cost: 2+ EP.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: Melee.\u003cbr\u003e- Effect:  \u003cbr\u003e    A Flick to the forehead to disrupt focus. Deals EPd4 + Dexterity and the target makes concentraion saves with disadvantage until the end of your next turn.\u003cbr\u003e    - Duration: 1 turn.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eChiBlocking","- Cost: 1 + EP.\u003cbr\u003e- Type: Bonus Action.\u003cbr\u003e- Range: Melee.\u003cbr\u003e- Attack: Dex+Proficiency\u003cbr\u003e- Effect:  \u003cbr\u003e    A swift strike aimed at disrupting the target's focus. Deals EPd8 + Dex bludgeoning damage and imposes disadvantage on the target's next Attack Roll.\u003cbr\u003e    - Duration: 1 Minute.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eChiBlocking","","- Cost: 2 EP.\u003cbr\u003e- Type: Bonus Action.\u003cbr\u003e- Range: Self.\u003cbr\u003e- Effect:  \u003cbr\u003e    Increase your evasion by EP for one turn. Allows you to dodge bending attacks with greater ease.\u003cbr\u003e    - Duration: 1 turn.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eChiBlocking","- Cost: 3+ EP.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: Melee.\u003cbr\u003e- Attack: Dex + Proficiency\u003cbr\u003e- Effect:  \u003cbr\u003e    A precise strike that deals no damage but if hit the Target must succeed a DC 10+Proficiency+EP Con Save or be Paralysed until the end of your next Turn. \u003cbr\u003e    - Duration: 1 turn.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eChiBlocking","","- Cost: 5 EP.\u003cbr\u003e- Type: Reaction.\u003cbr\u003e- Range: The original attacks range.\u003cbr\u003e- Effect:  \u003cbr\u003e    When in Melee range to an enemy performing a Bending Move. If they fail a DC 10+Proficiency+EP Dex Save you can redirect the opponent's bending energy back at them using the same bending Move. If they succeed by more than 5 they additionally get to use their Move.\u003cbr\u003e    If you steal a Move that requires concentration it is automatically broken instantly.\u003cbr\u003e    - Duration: Instant.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eChiBlocking","- Cost: 4 EP.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: Melee.\u003cbr\u003e- Attack: Dex+Proficiency\u003cbr\u003e- Effect:  \u003cbr\u003e    Deliver a powerful blow that if hit restores 6 EP. The Target must succeed on a DC 10 + Proficiency + EP Con
