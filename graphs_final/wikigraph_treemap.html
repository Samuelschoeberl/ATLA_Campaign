f","Players Part\u002fRules\u002fBending Rules\u002fWater\u002fWaterbending Moves\u002f","Players Part\u002fRules\u002fBending Rules\u002fWater\u002fWaterbending Moves\u002fLevel 2\u002f","Players Part\u002fRules\u002fBending Rules\u002fWater\u002fWaterbending Moves\u002fLevel 2\u002f","Players Part\u002fRules\u002fBending Rules\u002fWater\u002fWaterbending Moves\u002fLevel 2\u002f","Players Part\u002fRules\u002fBending Rules\u002fWater\u002fWaterbending Moves\u002fLevel 2\u002f","Players Part\u002fRules\u002fBending Rules\u002fWater\u002fWaterbending Moves\u002f","Players Part\u002fRules\u002fBending Rules\u002fWater\u002fWaterbending Moves\u002fLevel 3\u002f","Players Part\u002fRules\u002fBending Rules\u002fWater\u002fWaterbending Moves\u002fLevel 3\u002f","Players Part\u002fRules\u002fBending Rules\u002fWater\u002fWaterbending Moves\u002fLevel 3\u002f","Players Part\u002fRules\u002fBending Rules\u002fWater\u002fWaterbending Moves\u002fLevel 3\u002f","Players Part\u002fRules\u002fBending Rules\u002fWater\u002fWaterbending Moves\u002f","Players Part\u002fRules\u002fBending Rules\u002fWater\u002fWaterbending Moves\u002fLevel 4\u002f","Players Part\u002fRules\u002fNon Bending Rules\u002fChi Blocking\u002fChi Blocking Moves\u002f","Players Part\u002fRules\u002fNon Bending Rules\u002fChi Blocking\u002fChi Blocking Moves\u002fLevel 1 Moves\u002f","Players Part\u002fRules\u002fNon Bending Rules\u002fChi Blocking\u002fChi Blocking Moves\u002fLevel 1 Moves\u002f","Players Part\u002fRules\u002fNon Bending Rules\u002fChi Blocking\u002fChi Blocking Moves\u002fLevel 1 Moves\u002f","Players Part\u002fRules\u002fNon Bending Rules\u002fChi Blocking\u002fChi Blocking Moves\u002f","Players Part\u002fRules\u002fNon Bending Rules\u002fChi Blocking\u002fChi Blocking Moves\u002fLevel 2 Moves\u002f","Players Part\u002fRules\u002fNon Bending Rules\u002fChi Blocking\u002fChi Blocking Moves\u002fLevel 2 Moves\u002f","Players Part\u002fRules\u002fNon Bending Rules\u002fChi Blocking\u002fChi Blocking Moves\u002f","Players Part\u002fRules\u002fNon Bending Rules\u002fChi Blocking\u002fChi Blocking Moves\u002fLevel 3 Moves\u002f","Players Part\u002fRules\u002fNon Bending Rules\u002fChi Blocking\u002fChi Blocking Moves\u002fLevel 3 Moves\u002f"],"text":["Collectionfile \u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Collectionfile --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Avatar Spirit Bridge\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending Moves.md\u003cbr\u003e\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e","\ud83d\ude80 How to Set Up\u003cbr\u003e\u003cbr\u003e1. Clone or Download the Repository\u003cbr\u003e    \u003cbr\u003e    git clone \u003crepo-url\u003e\u003cbr\u003e    \u003cbr\u003e    Or download as ZIP and extract.\u003cbr\u003e    \u003cbr\u003e2. Open as an Obsidian Vault\u003cbr\u003e    \u003cbr\u003e    - Start Obsidian.\u003cbr\u003e        \u003cbr\u003e    - Select \"Open folder as vault\".\u003cbr\u003e        \u003cbr\u003e    - Navigate to the downloaded repository and open it.\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e\ud83d\udc49 This gives you the best file explorer experience and lets you use all notes, links, and structures directly.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eGit Plugin\u003cbr\u003e\u003cbr\u003eStep 1 \u2014 Install Git\u003cbr\u003e\u003cbr\u003eDownload and install Git: https:\u002f\u002fgit-scm.com\u002fdownloads\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eStep 2 \u2014 Generate a Personal Access Token\u003cbr\u003e\u003cbr\u003eIn GitHub (requires an account):\u003cbr\u003e\u003cbr\u003e- Go to Settings \u2192 Developer settings \u2192 Personal access tokens \u2192 Tokens (classic).\u003cbr\u003e    \u003cbr\u003e- Click \u201cGenerate new token\u201d.\u003cbr\u003e    \u003cbr\u003e- Set:\u003cbr\u003e    \u003cbr\u003e    - Scopes: Select repo.\u003cbr\u003e        \u003cbr\u003e    - Expiration: Choose no expiration (recommended for backups).\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eStep 3 \u2014 Install the Obsidian Git Plugin\u003cbr\u003e\u003cbr\u003eIn Obsidian:\u003cbr\u003e\u003cbr\u003e- Go to Settings \u2192 Community plugins.\u003cbr\u003e    \u003cbr\u003e- Enable community plugins.\u003cbr\u003e    \u003cbr\u003e- Search for \u201cObsidian Git\u201d and install it.\u003cbr\u003e    \u003cbr\u003e- Restart Obsidian.","\ud83d\udd04 How to Sync Your Vault (Git + Collectionfiles)\u003cbr\u003e\u003cbr\u003eTo sync your local vault with the remote repository and automatically update all collectionfiles (backlink blocks):\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython -c \"from WikiFileSystemManager import Sync; Sync()\"\u003cbr\u003e\u003cbr\u003eTo manually recreate all collectionfiles (backlink blocks) without syncing:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --recreate-collectionfiles\u003cbr\u003e\u003cbr\u003eThis will:\u003cbr\u003e\u003cbr\u003e- Stage, commit, and push all local changes\u003cbr\u003e- Pull and merge the latest from origin\u002fmain\u003cbr\u003e- Recreate all collectionfiles (backlink blocks)\u003cbr\u003e- Commit and push any new collectionfile changes\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\ude80 Quickstart\u003cbr\u003e\u003cbr\u003eCopy-paste friendly commands. See also: WikiFileSystemManager (Manual), WikiFileSystemManager (FAQ)\u003cbr\u003e\u003cbr\u003e\u003e Tips: Start with --dry-run, scope with --ext .md, keep backups with --backup .bak.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eSafe wiki-link bracketing\u003cbr\u003e\u003cbr\u003eBracket plain mentions, skipping already-linked:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --find \"[[Bumi]]\" --bracket --dry-run\u003cbr\u003e\u003cbr\u003epython WikiFileSystemManager.py --ext .md --find \"[[Bumi]]\" --bracket --backup .bak\u003cbr\u003e\u003cbr\u003eLiteral find\u002freplace\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --find \"Omashu\" --replace \"City of Omashu\" --backup .bak\u003cbr\u003e\u003cbr\u003eCase-sensitive:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --case-sensitive --find \"Spirit\" --replace \"spirit\" --backup .bak\u003cbr\u003e\u003cbr\u003eWith punctuation\u002fspecial chars (still literal):\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --find \"old\" --replace \"new\" --backup .bak\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eScope control\u003cbr\u003e\u003cbr\u003eOnly session logs:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py Sessions --ext .md --include \"\u002fSession.md\" --find \"Appa\" --replace \"Appa the Sky Bison\"\u003cbr\u003e\u003cbr\u003eExclude extra dirs:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --exclude-dir \"Archive\" \"Exports\" --find \"Sokka\" --replace \"Sokka (Water Tribe)\"\u003cbr\u003e\u003cbr\u003eSingle file:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py Notes\u002fNPCs\u002fKatara.md --find \"Waterbending\" --replace \"Waterbending (Healing)\"\u003cbr\u003e\u003cbr\u003eFollow symlinks (rare):\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --follow-symlinks --ext .md --find \"Ba Sing Se\" --replace \"Ba Sing Se (Lower Ring)\"\u003cbr\u003e\u003cbr\u003eMultiple roots:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py Notes Lore --ext .md --find \"Pai Sho\" --replace \"Pai Sho (White Lotus)\"\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCollections (backlinks)\u003cbr\u003e\u003cbr\u003eCreate\u002fupdate Action.md backlinks block + AllAction.md embeds:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --collectionfile \"Indexes\u002fAction.md\" --compact\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAppend lines\u003cbr\u003e\u003cbr\u003eAppend a footer if missing:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --append \"Index:NPCs\" --backup .bak\u003cbr\u003e\u003cbr\u003eCombine append + replace in one pass:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md \\\u003cbr\u003e\t--append \"Index:Sessions\" \\\u003cbr\u003e\t--find \"Zuko\" --replace \"Zuko (Crowned Prince)\" \\\u003cbr\u003e\t--backup .bak --compact\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eThat\u2019s it. Keep --dry-run until output looks right; then drop it and keep --backup .bak for safety.","## Purpose\u003cbr\u003e`Wikigraphs.py` scans an Obsidian-style vault (or any folder of markdown\u002ftext files) and writes Plotly Sunburst and Treemap HTML visualizations that show the directory\u002ffile hierarchy, sizes (or counts), and sanitized Markdown content inside nodes.\u003cbr\u003eThis manual explains usage, CLI options, recolor persistence, and a few implementation notes so you can tune and extend behavior.\u003cbr\u003e## Example workflows\u003cbr\u003e- Regenerate graphs with a wider sibling hue spread (temporarily override default):\u003cbr\u003e```bash\u003cbr\u003epython3 Wikigraphs.py --root \"$(pwd)\" --out graphs --child-spread 0.7\u003cbr\u003e```\u003cbr\u003e- Recolor every matching `Bending Rules\u002fFire` subtree to red and persist:\u003cbr\u003e```bash\u003cbr\u003epython3 Wikigraphs.py --root \"$(pwd)\" --out graphs --recolor \"Rules\u002fBending Rules\u002fFire\u002f=#ff0000\"\u003cbr\u003e```\u003cbr\u003e- Apply stored recolors only without changing the recolor file:\u003cbr\u003e```bash\u003cbr\u003epython3 Wikigraphs.py --root \"$(pwd)\" --out graphs --recolor\u003cbr\u003e```\u003cbr\u003e## Requirements\u003cbr\u003e- Python 3.8+\u003cbr\u003e- plotly (required to produce the HTML visualizations)\u003cbr\u003e- numpy (optional, used for the file-size histogram)\u003cbr\u003eInstall the main dependency:\u003cbr\u003e```bash\u003cbr\u003epip install plotly\u003cbr\u003e# optional: pip install numpy\u003cbr\u003e```\u003cbr\u003e## Quick start\u003cbr\u003eRun the script from the vault root (writes files into `graphs\u002f` by default):\u003cbr\u003e```bash\u003cbr\u003epython3 Wikigraphs.py --root \"$(pwd)\" --out graphs\u003cbr\u003e```\u003cbr\u003eFiles written (into the output folder):\u003cbr\u003e- `wikigraph_sunburst.html` \u2014 Plotly Sunburst\u003cbr\u003e- `wikigraph_treemap.html` \u2014 Plotly Treemap\u003cbr\u003e- `wikigraph_top_20_files.html` (or `.txt` fallback)\u003cbr\u003e- `wikigraph_top_20_dirs.html` (or `.txt` fallback)\u003cbr\u003e- `wikigraph_file_size_histogram.html` (or `.txt` fallback)\u003cbr\u003eOpen the HTML files in your browser.\u003cbr\u003e## Main behaviors and special handling\u003cbr\u003e- Markdown (`.md`) files: the script reads the raw file text, sanitizes it (removes YAML frontmatter, Obsidian\u002fMarkdown wikilink syntax, headings, emphasis and code markers) and stores the sanitized text for use in hover text and treemap cell text.\u003cbr\u003e- Embeds: `target` embeds are handled early and the script will try to inline the referenced file's sanitized content when building the treemap cell text and when creating simple `Expanded` megafiles.\u003cbr\u003e- Tables: basic Markdown tables are converted to a compact plaintext representation preserving header and rows.\u003cbr\u003e- Backlink collections: files containing `#collectionfile` will have backlink\u002fBacklinks sections removed so those backlink lists don't pollute the cell text.\u003cbr\u003e- Treemap cell text: the treemap displays the full sanitized file content for each `.md` file (the script intentionally does not truncate treemap text). Hovertext is limited to ~1000 characters.\u003cbr\u003e- `Expanded` megafiles: any source file with a basename starting with `Expanded` will cause the script to create a `simple_Expanded_Megafile.md` in the same directory with embeds inlined (sanitized content).\u003cbr\u003e## CLI options\u003cbr\u003eRun `python3 Wikigraphs.py --help` to see the same list; here are the important ones:\u003cbr\u003e- `--root` (default `.`) \u2014 vault root path to scan\u003cbr\u003e- `--out` (default `graphs`) \u2014 output directory\u003cbr\u003e- `--ext` (repeatable) \u2014 include file extensions (e.g. `--ext .md`) (defaults to `.md`, `.markdown`, `.txt`)\u003cbr\u003e- `--exclude` (repeatable) \u2014 directory names to ignore (`.git`, `.obsidian`, etc. are excluded by default)\u003cbr\u003e- `--embed` \u2014 embed Plotly JS into the HTML so files are fully offline-capable\u003cbr\u003e- `--mode` `size|count` \u2014 use file bytes (size) or counts for values\u003cbr\u003e- `--child-spread` (float, 0..1, default `0.35`) \u2014 initial hue spread allocated among root children; larger values make sibling hues farther apart\u003cbr\u003e- `--spread-growth` (float, default `1.0`) \u2014 multiplier applied to spread each level\u003cbr\u003e- `--recolor` (repeatable, optional-argument) \u2014 recolor a subtree; usage explained below\u003cbr\u003e## Recoloring (manual overrides and persistence)\u003cbr\u003eThe script supports recoloring subtrees and persisting those recolors to `color_recolors.md` in the vault root.\u003cbr\u003eFormat of the recolor file (`color_recolors.md`): lines of the form:\u003cbr\u003e```\u003cbr\u003epath=#rrggbb\u003cbr\u003e```\u003cbr\u003eExamples:\u003cbr\u003e```\u003cbr\u003e\u002f=#ff0000\u003cbr\u003ePlayers Part\u002fRules\u002fBending Rules\u002fFire\u002f=#ff4500\u003cbr\u003e```\u003cbr\u003eRules for matching recolor directives\u003cbr\u003e- The matching is forgiving and applies to **all** matching node ids (not just the first):\u003cbr\u003e  - Exact id match (the id used inside the visualization; directories end with `\u002f`).\u003cbr\u003e  - Case-insensitive exact matches.\u003cbr\u003e  - Suffix matches: if you provide `Rules\u002fBending Rules\u002fFire\u002f` it will match any node id whose path ends with that suffix (useful if you have multiple top-level folders named similarly).\u003cbr\u003e  - Basename fallback (match by the final path component) is also attempted.\u003cbr\u003eBehavior\u003cbr\u003e- File-based recolors (those in `color_recolors.md`) are applied first and marked as protected: the main hue-assignment algorithm will not overwrite protected node ids (and the recolor will be recursively applied to their descendants).\u003cbr\u003e- CLI recolors (provided with `--recolor 'path=#rrggbb'`) are applied and merged into the recolor file after successful processing.\u003cbr\u003e- Provide `--recolor` with no value (just the flag) to mean \"apply stored recolors only\"; in that case the script will apply the recolors from `color_recolors.md` but will not rewrite the file.\u003cbr\u003eExamples\u003cbr\u003e- Apply one-shot recolor and persist it:\u003cbr\u003e```bash\u003cbr\u003epython3 Wikigraphs.py --root \"$(pwd)\" --out graphs --recolor \"Rules\u002fBending Rules\u002fFire\u002f=#ff0000\"\u003cbr\u003e```\u003cbr\u003e- Apply stored recolors only (don't change `color_recolors.md`):\u003cbr\u003e```bash\u003cbr\u003epython3 Wikigraphs.py --root \"$(pwd)\" --out graphs --recolor\u003cbr\u003e```\u003cbr\u003eNotes about persisted keys\u003cbr\u003e- The script merges CLI-provided keys into the recolor file using the user-provided key string (not the fully-resolved node id). If you prefer to store fully-resolved ids (one entry per resolved target) tell the maintainer and the script can be adjusted to persist resolved entries instead.\u003cbr\u003e- To remove or edit recolors you can directly edit `color_recolors.md`; a small CLI removal helper is not currently implemented.\u003cbr\u003e## Deterministic hierarchical colors\u003cbr\u003e- Colors are assigned deterministically from the vault name and the tree structure so repeated runs produce stable palettes.\u003cbr\u003e- The algorithm splits a hue spread among immediate children weighted by descendant leaf counts and uses a deterministic Gaussian-based sampler for child centers to avoid rigid evenly-spaced palettes while remaining deterministic.\u003cbr\u003e- A fallback deterministic color is generated for any node that wasn't explicitly assigned.\u003cbr\u003eIf you want coarser or wider palettes, increase `--child-spread` (closer to 1.0 spreads children across more of the hue circle).\u003cbr\u003e## Troubleshooting\u003cbr\u003e- If you see an import error about `plotly` when running the script, install it with `pip install plotly`.\u003cbr\u003e- If the histogram page fails, install `numpy` (optional) with `pip install numpy`.\u003cbr\u003e- If recolors don't appear as expected, run the script with `--recolor` alone to force stored recolors to be applied and check `color_recolors.md` keys for the correct path\u002fsuffix. You can also invoke CLI recolors with the full node id if you need an exact match.\u003cbr\u003e## Development notes\u003cbr\u003e- The treemap intentionally shows the full sanitized `.md` file text inside cells (no truncation). Hovertext for sunburst and treemap is limited to ~1000 chars to keep the hover concise.\u003cbr\u003e- Embedded files `...` are inlined heuristically by filename\u002fsuffix lookup in the sanitized content index. If you need more robust embed resolution (frontmatter aliases, explicit path handling) the embed resolution helper can be extended.\u003cbr\u003e## Contact \u002f Next changes\u003cbr\u003eIf you want any of the following, I can add them:\u003cbr\u003e- `--dump-colors` flag to print node \u2192 hex mappings at runtime (useful to verify which nodes were matched by recolor directives)\u003cbr\u003e- Persist resolved node ids instead of shorthand keys in `color_recolors.md`\u003cbr\u003e- CLI remove (`--recolor-remove path`) to delete persisted recolors\u003cbr\u003e---\u003cbr\u003eManual created for `Wikigraphs.py` \u2014 keep this file in the repo root next to the script for quick reference.","Wikigraph recolor settings\u003cbr\u003e\u003cbr\u003e\u003c!-- lines of the form: path=#rrggbb --\u003e\u003cbr\u003e\u003cbr\u003eRules\u002fBending Rules\u002f=#000000\u003cbr\u003eRules\u002fBending Rules\u002fAir\u002f=#86fcfa\u003cbr\u003eRules\u002fBending Rules\u002fWater\u002f=#0000ff\u003cbr\u003eRules\u002fBending Rules\u002fFire\u002f=#ff0000\u003cbr\u003eRules\u002fBending Rules\u002fAvatar Spirit Bridge\u002f=#ffffff\u003cbr\u003eRules\u002fBending Rules\u002fEarth\u002f=#9e822c\u003cbr\u003eRules\u002fBending Rules\u002fTeam-up Moves\u002f=#777777","Obsidian Plugins Setup for Developers & Data Scientists\u003cbr\u003e\u003cbr\u003eThis guide covers the installation and basic setup of the best Obsidian plugins for code, data workflows, dashboards, and research.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e1. Install Plugins\u003cbr\u003e1. Open Settings \u2192 Community Plugins.\u003cbr\u003e2. Enable Safe Mode if it's disabled.\u003cbr\u003e3. Click Browse.\u003cbr\u003e4. Search and install the following plugins:\u003cbr\u003e   - Dataview\u003cbr\u003e   - Templater\u003cbr\u003e   - QuickAdd\u003cbr\u003e   - RunJS\u003cbr\u003e   - Note Toolbar\u003cbr\u003e   - Better Search Views\u003cbr\u003e   - Obsidian Tags Overview\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e2. Plugin Configuration\u003cbr\u003e\u003cbr\u003eDataview\u003cbr\u003e- Go to Settings \u2192 Dataview.\u003cbr\u003e- Enable JavaScript Queries for dynamic calculations.\u003cbr\u003e- Example query to list all datasets:\u003cbr\u003e    dataview\u003cbr\u003e    TABLE file.name, size, date\u003cbr\u003e    FROM \"datasets\"\u003cbr\u003e    SORT date DESC\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eTemplater\u003cbr\u003e- Set Template Folder Location: templates\u002f\u003cbr\u003e- Create a file dataset-template.md:\u003cbr\u003e    markdown\u003cbr\u003e{{title}}\u003cbr\u003e    Date: \u003c% tp.date.now(\"YYYY-MM-DD\") %\u003e\u003cbr\u003e    Source: \u003c% tp.file.cursor() %\u003e\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eQuickAdd\u003cbr\u003e- Create a new Capture Command \u2192 \u201cNew Dataset\u201d\u003cbr\u003e- Use the dataset-template.md to quickly add new entries.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eRunJS\u003cbr\u003e- Go to Settings \u2192 RunJS.\u003cbr\u003e- Add a snippet:\u003cbr\u003e    js\u003cbr\u003e    const data = [1,2,3,4];\u003cbr\u003e    return data.map(x =\u003e x  2);\u003cbr\u003e    \u003cbr\u003e- Run inline JS inside notes with ==js blocks.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eNote Toolbar\u003cbr\u003e- Add quick buttons for:\u003cbr\u003e    - \u201cNew Dataset\u201d\u003cbr\u003e    - \u201cRun Dataview Query\u201d\u003cbr\u003e    - \u201cOpen Dashboard\u201d\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBetter Search Views\u003cbr\u003e- Use advanced search like:\u003cbr\u003e    \u003cbr\u003e    tag:#dataset size:\u003e10MB\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eObsidian Tags Overview\u003cbr\u003e- Go to the Tags Overview pane to visualize tags as a dataset tree.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e3. Recommended Folder Structure\u003cbr\u003eplaintext\u003cbr\u003e\ud83d\udcc2 vault\u002f\u003cbr\u003e \u251c\u2500\u2500 datasets\u002f\u003cbr\u003e \u2502   \u251c\u2500\u2500 dataset1.md\u003cbr\u003e \u2502   \u251c\u2500\u2500 dataset2.md\u003cbr\u003e \u251c\u2500\u2500 dashboards\u002f\u003cbr\u003e \u2502   \u251c\u2500\u2500 main-dashboard.md\u003cbr\u003e \u251c\u2500\u2500 templates\u002f\u003cbr\u003e \u2502   \u251c\u2500\u2500 dataset-template.md\u003cbr\u003e \u251c\u2500\u2500 scripts\u002f\u003cbr\u003e \u2502   \u251c\u2500\u2500 data-cleaning.js\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e4. Next Steps\u003cbr\u003e- Combine Dataview + Templater to generate automatic dashboards.\u003cbr\u003e- Use RunJS for inline computations and plotting.\u003cbr\u003e- Tag datasets with #raw, #processed, and #visualized for powerful filtering.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003ePro Tip:  \u003cbr\u003eUse Obsidian Git to version-control datasets and scripts.","","","Collectionfile\u003cbr\u003eCollectionfile \u003cbr\u003eSpiritbending Moves\u003cbr\u003eSpiritbending moves are special techniques that use the Avatar Spirit's connection to the Spirit World. They tend to be more narrative and rarely purely destructive \u2014 instead focusing on influence, protection, communication, and spiritual transformation.\u003cbr\u003eCore contract:\u003cbr\u003e- Inputs: Spiritbending slots (from Bridge Level, Spirit Stones, or Avatar Spirit Checks).\u003cbr\u003e- Outputs: A move effect (see moves below).\u003cbr\u003e- Failure modes: On a failed GM opposed roll or failed concentration, some spirit effects can backfire or produce an unintended Spirit Echo.\u003cbr\u003eSample Moves\u003cbr\u003e1. Spirit Ward (cost: 2 slots)\u003cbr\u003e- Effect: Create a protective aura that grants allies within 3m + (1m \u00d7 slots used) advantage on Spirit-related saves for X minutes.\u003cbr\u003e2. Soul Sight (cost: 1 slot)\u003cbr\u003e- Effect: You and one ally can see invisible spirits or spirit effects for 1 minute. Provides a single insight on a spirit's nature.\u003cbr\u003e3. Calm of Ages (cost: 3 slots)\u003cbr\u003e- Effect: Attempt to pacify a hostile spirit or calm an area. Target makes a WIS save vs DC = 8 + slots used; on failure the spirit is pacified for 1d6 minutes.\u003cbr\u003e4. Spirit Relay (cost: variable)\u003cbr\u003e- Effect: Spend slots to send a short message into the Spirit World (or receive one). Each slot adds clarity and range.\u003cbr\u003e5. Ancestral Echo (cost: 4 slots)\u003cbr\u003e- Effect: Temporarily call on an ancestor's skill \u2014 grant an ally a one-time automatic success on a non-combat skill check tied to the ancestor's expertise.\u003cbr\u003eDesign notes:\u003cbr\u003e- Moves should be negotiated with the GM for balance and narrative fit.\u003cbr\u003e- Spiritbending is more flexible than elemental bending: creativity and roleplay matter.\u003cbr\u003eSpiritbending\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Spiritbending Moves --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Avatar Spirit Bridge\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending.md\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","\u003c!-- No backlinks found --\u003e","\u003c!-- No backlinks found --\u003e","","","","","","","","","","","","","","","","","Organisations\u003cbr\u003eOverview:\u003cbr\u003e\u003cbr\u003eThe Lotus is a venerable organization dedicated to the balance of the world, acting as spiritual guides and protectors of harmony. They host the annual Ceremony of the Resonance, symbolizing their commitment to unity among benders.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eUniform Design:\u003cbr\u003e\u003cbr\u003e- Colors:  \u003cbr\u003e    White and gold, symbolizing purity and enlightenment, with accents of light blue to represent spiritual connection.\u003cbr\u003e    \u003cbr\u003e- Style:\u003cbr\u003e    \u003cbr\u003e    - Flowing robes for spiritual leaders, with a lotus emblem embroidered on the chest.\u003cbr\u003e    - Soldiers wear sturdy uniforms with plated armor on shoulders and bracers, designed for mobility and defense.\u003cbr\u003e- Details:\u003cbr\u003e    \u003cbr\u003e    - A sash or belt with a lotus motif, denoting rank.\u003cbr\u003e    - Masks for combat troops, styled after serene and neutral faces, emphasizing their role as impartial protectors.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Mistress Akira Meiyu\u003cbr\u003e- Armor\u003cbr\u003e- Strength\u003cbr\u003e- Stonewarden Garon\u003cbr\u003e- Wisdom\u003cbr\u003e- Grandmaster Iroh Tanaka\u003cbr\u003e- The Lotus\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eFirebending\u003cbr\u003eWaterbending","","Marjorie TBA","","\u00a71 This is all fun and games.\u003cbr\u003e\t\u00a71.1 For many people (including the author :D) a big part of the fun is the improv theater roleplaying in TTRPGs. \u003cbr\u003e\tSome people like the Characterbuilding and creating a personality and fleshed out character how they imagine it. Both are valid but it needs to be communicated that i want to keep it generally in a very \"yes and...\" kind of style but always accept a \"no id rather have it like...\".\u003cbr\u003e\t\t1.1.1 That being said this also applies to world building and lore so feel free to worldbuild yourself a bit either spontanously during roleplay or planned out for bigger worldbuilding projects (e.g. \"I had an idea for a watertribe that uses plantbending algae as boats for their lake\"(and discussed with the GM)).\u003cbr\u003e\u003cbr\u003e\u00a72 I will try my best to nerve and buff bending moves how i think fits best. \u003cbr\u003e\t2.1 This may also include giving them more roleplaying opportunities to find bending teachers or similar to acquire new skills and bending Moves.\u003cbr\u003e\u003cbr\u003e\u00a73 I'm trying some more experimental mechanics that may be fun for me but not so fun for others. So always accept constructive feedback and","Defensive:\u003cbr\u003e\tMostly like DnD but Armor class is now called evasion and there is an Armor  for every kind of Damage (Damage Resistance) that reduces the damage taken per instance.\u003cbr\u003e\tThe Damage types will be the same as in Dnd\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Armor","How hard it is to hit you. \u003cbr\u003eBase Evasion: 10 + Dex","Collectionfile \u003cbr\u003ePROBABLY NEEDS REBALANCING ON THE GO ALL THE TIME\u003cbr\u003eJoining Moves:  \u003cbr\u003eBenders can combine their abilities to create more powerful or creative effects, guided by the \"rule of cool.\" This allows for dynamic and collaborative gameplay that rewards teamwork.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eConditions to Join:\u003cbr\u003e\u003cbr\u003e- Proximity: You must be within 10 feet of the ally initiating the Move.\u003cbr\u003e- Action Type: Joining the Move requires using your Reaction.\u003cbr\u003e- Move Compatibility: The same Move does not need to be performed at the same Level Slot as the initiating Bender.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEffect:  \u003cbr\u003eCombining Moves enhances their overall power or effect. For example, if an ally uses Fireburst, and you join in, the resulting effect could be strong enough to burst through a stone wall.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOptional Variant:  \u003cbr\u003eYou can also combine different Moves if you can explain how they interact. For instance:\u003cbr\u003e\u003cbr\u003e- A Mud Wall created by an Earthbender could be reinforced with an Ice Wall from a Waterbender, resulting in a sturdier barrier with sharp ice spike defenses.  \u003cbr\u003e    This opens opportunities for creative problem-solving and innovative combinations, adding depth to gameplay.\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Teamwork Moves --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u00 r\u003e\u003c!-- END-AUTO-COLLECTION --\u003e","Collectionfile \u003cbr\u003e\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Session --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e","","- Physical Description:  \u003cbr\u003e        A tall, lean man in his early sixties with silver-streaked black hair tied into a high topknot. His sharp amber eyes radiate wisdom and authority, while his lightly weathered skin reflects years of spiritual practice. He has a composed, almost regal posture, wearing a perpetual calm smile that hides the fire of his immense power.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Firebending infused with advanced spiritual techniques, emphasizing control and harmony over raw power. Known for producing green flame as a sign of his mastery.\u003cbr\u003e    - Role:  \u003cbr\u003e        Oversees the organization\u2019s spiritual and physical balance, emphasizing diplomacy and tradition.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Wisdom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eFirebending\u003cbr\u003e\u003cbr\u003eDear Iroh Tanaka,\u003cbr\u003eWe hope this letter finds you well, we from team anju the avatar make our way Omashu. We think the bad guys (and girls and enbis) want to go to that village. Greeting from christopher. anyways that village has a chrystal that we think that might be the next target of the evil people.\u003cbr\u003emfg  \u003cbr\u003eTeam Anju\u003cbr\u003eTHIS GOT EATEN BY ALEXANDER\u003cbr\u003eNPC","- Physical Description:  \u003cbr\u003e        A middle-aged woman of medium height with a graceful, slender build. Her long, silvery-blue hair flows freely down her back, adorned with small jade pins shaped like water droplets. Her piercing sea-green eyes seem to look into a person\u2019s soul. Her demeanor is serene but carries an undercurrent of strength, much like a calm sea hiding its depth.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Waterbending that incorporates healing and offensive manipulation of mist, granting her versatility in combats\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Strength\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eNPC","NPC","","Character\u003cbr\u003e\u003cbr\u003e- Name: Ula\u003cbr\u003e    \u003cbr\u003e- Appearance:\u003cbr\u003e    \u003cbr\u003e    - Pale skin, faintly glowing purple hair due to crystal-paste dye.\u003cbr\u003e    - Mushroom-leather outfit with a toad-eye hood for tradition and identity.\u003cbr\u003e- Personality:\u003cbr\u003e    \u003cbr\u003e    - Determined, resourceful, and reverent toward the spirit.\u003cbr\u003e    - Nervous about interacting with the outside world.\u003cbr\u003e- Role:\u003cbr\u003e    \u003cbr\u003e    - Tasked with seeking a Spirit Bender to save Ch\u00e1nch\u00fa .\u003cbr\u003e    - Acts as the guide for the party to the Undersands Village .\u003cbr\u003e\u003cbr\u003eEquipment:\u003cbr\u003e\u003cbr\u003e- Crystals for lighting caves.\u003cbr\u003e- Hydration stones for water control and protection.\u003cbr\u003e\u003cbr\u003eLinks to Other Notes:\u003cbr\u003e\u003cbr\u003e- Ch\u00e1nch\u00fa \u003cbr\u003e- Undersands Village \u003cbr\u003e- Spirit Benders \u003cbr\u003e- Mushroom Leather Techniques \u003cbr\u003eNPC","","- Physical Description:  \u003cbr\u003e    A striking woman in her early forties with jet-black hair styled into an intricate braid that cascades down her back. Her pale blue eyes seem to pierce through her opponents, reflecting a sharp intellect and unshakable resolve. Her high cheekbones and angular features give her an almost regal appearance. She wears an ornate, high-collared cloak adorned with faintly glowing charms.\u003cbr\u003e- Bending Style:  \u003cbr\u003e    Waterbending focused on offensive techniques, including the manipulation of black mist\u2014a mixture of water vapor and fine particles, creating disorienting smoke.\u003cbr\u003e- Role:  \u003cbr\u003e    Charismatic leader and visionary behind the rebellion. Isay is a master tactician and inspiring orator.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003eNPC","","","Organisations\u003cbr\u003eOverview:\u003cbr\u003e\u003cbr\u003eThe Night Bloom is a radical faction seeking to overthrow the Avatar\u2019s influence, advocating for a world ruled collectively by elite benders. They view the Avatar as a relic of oppression and seek to reshape the spiritual and physical realms.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLeadership:\u003cbr\u003e\u003cbr\u003e1. Isay Trekal (she\u002fher) (Faction Leader)\u003cbr\u003e    \u003cbr\u003e    - Physical Description:  \u003cbr\u003e        A striking woman in her early forties with jet-black hair styled into an intricate braid that cascades down her back. Her pale blue eyes seem to pierce through her opponents, reflecting a sharp intellect and unshakable resolve. Her high cheekbones and angular features give her an almost regal appearance. She wears an ornate, high-collared cloak adorned with faintly glowing charms.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Waterbending focused on offensive techniques, including the manipulation of black mist\u2014a mixture of water vapor and fine particles, creating disorienting smoke.\u003cbr\u003e    - Role:  \u003cbr\u003e        Charismatic leader and visionary behind the rebellion. Isay is a master tactician and inspiring orator.\u003cbr\u003e2. Hanal Koga(she\u002fher) (Second-in-Command)\u003cbr\u003e    \u003cbr\u003e    - Physical Description:  \u003cbr\u003e        A sturdy woman with sun-kissed skin and short, spiky hair the color of sandy blonde. She has a confident, swaggering gait, often adorned with sand-crusted boots and bracers. Her lightweight armor is covered with fine grains of sand that move subtly as she walks.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Earthbending with a specialization in sand manipulation.\u003cbr\u003e    - Role:  \u003cbr\u003e        Oversees the Night Bloom\u2019s military operations, crafting strategies for their attacks.\u003cbr\u003e3. Rin Kotak(he\u002fhim) (Spiritualist)\u003cbr\u003e    \u003cbr\u003e    - Physical Description:  \u003cbr\u003e        A tall, gaunt man with alabaster skin and wispy, shoulder-length white hair that seems to shift like mist in the wind. His gray eyes are perpetually half-lidded, giving him a detached, eerie demeanor. His flowing black robes ripple unnaturally, as if caught in a constant breeze. His soft-spoken voice carries an unsettling intensity.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Airbending with a dark twist\u2014manipulating sound waves to confuse and disorient enemies and bending the air around him to make him almost invisible.\u003cbr\u003e    - Role:  \u003cbr\u003e        Spirit guide of the Night Bloom, responsible for forging alliances with rogue spirits.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eUniform Design:\u003cbr\u003e\u003cbr\u003e- Colors:  \u003cbr\u003e    Black and deep purple, representing secrecy and defiance, with accents of crimson to signify rebellion.\u003cbr\u003e    \u003cbr\u003e- Style:\u003cbr\u003e    \u003cbr\u003e    - Sleek and utilitarian clothing designed for agility.\u003cbr\u003e    - Leaders wear flowing cloaks with jagged, petal-like edges to resemble blooming flowers in the dark.\u003cbr\u003e- Details:\u003cbr\u003e    \u003cbr\u003e    - Masks covering the lower face, often stylized with floral patterns or fanged motifs.\u003cbr\u003e    - Small spirit-charms integrated into their outfits, glowing faintly with corrupted energy during rituals or battles.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Armor\u003cbr\u003e- Isay Trekal\u003cbr\u003e- Rin Kotak\u003cbr\u003e- Night Bloom\u003cbr\u003e- Hanal Koga\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eWaterbending\u003cbr\u003eAirbending\u003cbr\u003eAvatar","","My character is Anju, the oldest daughter of 5 siblings. Anju's father always wanted a son but he\u003cbr\u003ewas only blessed with daughters. Believing only males could lead the great southern water tribe\u003cbr\u003eto further prosperity, he decided to raise Anju like the son he always wanted to have.\u003cbr\u003e(Anju is derived from \"Angijua\" in Inuktitut which means \"older brother\")\u003cbr\u003eThe mother died after giving birth to the 5th child, Anju and her siblings were raised by their\u003cbr\u003efather and the father's sister.\u003cbr\u003e\u003cbr\u003eEven though Anju was raised like a man, she has a feminine side to her which she learned from\u003cbr\u003eher aunt. The father is strict but also a good instructor. In time, Anju has enough athletic ability\u003cbr\u003eto pass as an average male of her tribe (though not outstanding like Korra). Anju's strength lies\u003cbr\u003ein her ability to create icicles. One of her greatest achievements - and also secrets - is when she\u003cbr\u003ecreated thick icicle soles to appear 5cm taller, which made her taller than her father at that time\u003cbr\u003eand caused her father to appear proud of her for the first time in forever.\u003cbr\u003e\u003cbr\u003eSeeing Anju's proficient icicle making, her father is convinced she is a very talented bender, maybe\u003cbr\u003eeven with potential of becoming the next Avatar. He sends Anju off to\u003cbr\u003e\u003cENTER SUMMSI'S NAME FOR THE AVATAR CAMP HERE\u003e with one request to\u003cbr\u003eAnju: \"Be a great man that makes the southern water tribe proud\"","","Character Summary\u003cbr\u003e\u003cbr\u003eRace:  \u003cbr\u003eSpirit-turned-human\u003cbr\u003e\u003cbr\u003eClass:  \u003cbr\u003eAir Spirit\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBackstory:  \u003cbr\u003eOnce a small spirit living among the Air Nomads, I helped them forage, offering guidance and protection in their peaceful, nature-centered life. But when the spirit doors closed, I was trapped in the Spirit World, separated from the humans I cared for.\u003cbr\u003e\u003cbr\u003eAfter countless years, I found a way to cross back through an abandoned Air Nomad temple. When I arrived, I was shocked to see how much the world had changed\u2014machines, bending powers, and humans who no longer lived in harmony with nature.\u003cbr\u003e\u003cbr\u003eConfused and fascinated, I wander this unfamiliar world, trying to understand what has happened and how I can help again.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBase Abilities (Available in all forms)\u003cbr\u003e\u003cbr\u003e- Spiritual Nourishment:  \u003cbr\u003e    Can create small plants or fruits that provide minor healing (1d6 + Proficiency bonus) or temporary bonuses:\u003cbr\u003e    \u003cbr\u003e    - Energizing Fruit: Grants +2 temporary HP per character level.\u003cbr\u003e    - Focus Herb: Grants Advantage on the next attack roll or saving throw.  \u003cbr\u003e        Can be used twice per long rest, with effects lasting up to 1 hour.\u003cbr\u003e- Limited Airbending:\u003cbr\u003e    \u003cbr\u003e    - Gust: Push or pull objects or creatures within a 15 ft range (similar to the gust cantrip).\u003cbr\u003e    - Air Barrier: Create a brief 5-ft circular shield of air, granting +2 AC to yourself or an ally for 1 round.\u003cbr\u003e    - Wind Aided Movement: Gain 10 extra feet of movement speed for 1 round.\u003cbr\u003e- Connection to Nature:  \u003cbr\u003e    Gains Advantage on Nature checks and can communicate simple ideas with animals or spirits.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eShapeshifting Forms\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eShapeshifting Mechanics\u003cbr\u003e\u003cbr\u003e- Transformations Per Long Rest:  \u003cbr\u003e     You have 2  Proficiency Transformation Points per long rest.\u003cbr\u003e    \u003cbr\u003e- Shapeshifting Cost:\u003cbr\u003e\t- Human Form: 0 Transformation Points\u003cbr\u003e    - Flying Lemur: 1 Point\u003cbr\u003e    - Bearturtle: 2 Points \u003cbr\u003e    - Luma\u2019tik 2 Transformation Points\u003cbr\u003e    -\u003cbr\u003e- Exiting the Forms:  \u003cbr\u003e    Transformations end early if the form\u2019s HP is reduced to 0 or voluntarily dropped. Remaining damage spills over to the character\u2019s normal HP. \u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Armor\u003cbr\u003e- Proficiency\u003cbr\u003e- Strength\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAirbending #transformation","You have your CL  2  amount of Transformation Points\u003cbr\u003e\u003cbr\u003etransformation","","","\u003c!-- No backlinks found --\u003e","\u003c!-- No backlinks found --\u003e","","","If not Specified otherwise, Ammunition can be used by any character (if its logic :D)  as part of their Moves to enhance them creatively.","Con save DC of max(10, Damage Taken \u002f 2)\u003cbr\u003eSome Moves require concentration to keep them up. If you take damage while concentrationg you have to make a Con save with a DC of max(10, Damage Taken \u002f 2)","If not Specified otherwise, lingering effect last until the start of your next Turn.\u003cbr\u003eIf caused by a damaging Move: Every creature that ends its turn there will get half the original attacks Damage.","Movement per Round:\u003cbr\u003e10 meters + Airbending Level  3","\u003c!-- BEGIN-AUTO-COLLECTION:Reaction --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u251c\u2500\u2500 PCs\u003cbr\u003e  \u2502   \u2514\u2500\u2500 Mahogany\u003cbr\u003e  \u2502       \u2514\u2500\u2500 Shapeshifting Forms\u003cbr\u003e  \u2502           \u251c\u2500\u2500 Bearturtle.md\u003cbr\u003e  \u2502           \u2514\u2500\u2500 Players Part\u002fPCs\u002fMahogany\u002fShape 03cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eEarthbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eGlassfruit Team-Up Techniques \u003cbr\u003eX = yz\u003cbr\u003e-  are the number of bending slots contributed by each bender.\u003cbr\u003e    \u003cbr\u003e- This rewards balanced team effort over just one person dumping points.\u003cbr\u003e    \u003cbr\u003e-X = y \u00d7 z.\u003cbr\u003e    \u003cbr\u003e\u003e Example:\u003cbr\u003e\u003e \u003cbr\u003e\u003e - Earthbender contributes 2 slots (y = 2)\u003cbr\u003e\u003e     \u003cbr\u003e\u003e - Firebender contributes 3 (z = 3)\u003cbr\u003e\u003e     \u2192 X = 2 \u00d7 3 = 6\u003cbr\u003eThese are powerful, multi-element, terrain-altering moves that consume Glassfruit Seeds. Each scales based on X and has different effects depending on the seed used.\u003cbr\u003e---\u003cbr\u003e\ud83d\udd34 Inferno Bloom (Red Flamegrape)\u003cbr\u003eMust be initiated by a Firebender in line of sight\u003cbr\u003e\u003e A cluster of buried Flame-glass shards detonates in a chain Reaction.\u003cbr\u003e- Effect: Explosion in an area, dealing Xd6  bludgeoning + half fire damage\u003cbr\u003e    \u003cbr\u003e- Radius: 2  meter  X\u003cbr\u003e    \u003cbr\u003e- Lingering Effect\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e\ud83d\udca8Resonant Collapse (Blue Soundbanana)\u003cbr\u003eMust be initiated by a Airbender in line of sight \u003cbr\u003e\u003e A soundblast builds from multiple frequencies and shatters the ground.\u003cbr\u003e- Effect: Targets in area must make CON save of X2 or take Xd8 thunder damage and fall prone\u003cbr\u003e    \u003cbr\u003e- Secondary: Earth terrain in the zone becomes difficult terrain\u003cbr\u003e    \u003cbr\u003e- Radius:  2X meter\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 12, causes localized landslide or ceiling collapse in enclosed space\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Clear out guards, knock down spirit constructs\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e\ud83d\udd35 BlueBerry Glass Surge\u003cbr\u003eMust be initiated by a Waterbender in line of sight\u003cbr\u003e\u003e  Stick and grow trapping enemies and reshaping the terrain.\u003cbr\u003e- Effect: Targets in area must make  a DCX  2 Dex save to jump aside or  get Immobilised in cold soft and barely liquid Glass.\u003cbr\u003e    \u003cbr\u003e- Radius: X  2\u003cbr\u003e    \u003cbr\u003e- Duration:  X minutes but trapped creatures can as an Action make a strength saving throws to break out with the same DC - Rounds since getting trapped\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 8, brambles regenerate once if destroyed\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Reshape battlefield, trap beasts or enemy squads\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e\ud83d\udfe1 FlashLemon Refractor Beam \u003cbr\u003eMust be initiated by a Firebender in line of sight\u003cbr\u003e\u003e Focused light is amplified by mirrored shards into a blinding beam.\u003cbr\u003e- Effect: Targets in area must make  a DCX  2 Int save to shield or close their eyes or be Blinded for one turn\u003cbr\u003eRange:  10  X meter cone\u003cbr\u003e- Bonus: Deal Xd8 radiant damage to one target hit directly\u003cbr\u003e    \u003cbr\u003e- Lasting Effect: All affected enemies suffer disadvantage on perception for 4 turns\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 10, the Focused damage is doubled \u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e\u26aa Soulseed Harmonic Seal (Clear Soulseed)\u003cbr\u003eMust be initiated by another Earthbender in line of sight\u003cbr\u003e\u003e A ritual resonance of GlassSeeds pressed on the Ground around the earthbenders \u003cbr\u003e   Concentration for both\u003cbr\u003e- Effect: As the air vibrates with a cleansing energy as creatures of your choice within radius gain 10  X General Armor\u003cbr\u003e- Radius: within line of sight up to 100 meter\u003cbr\u003e    \u003cbr\u003e- Duration: Lasts until stopped concentrating or for 1 hour.\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 15, the seal becomes permanent unless shattered by spiritual corruption\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Close spirit portals, bind corrupted spirits, defend a holy site\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eEarthbending \u003cbr\u003eAirbending\u003cbr\u003eWaterbending\u003cbr\u003eFirebending\u003cbr\u003eTeam-up Moves\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCantrip Firebending Moves\u003cbr\u003efirebending #moves\u003cbr\u003e- Fire Blast\u003cbr\u003e- Flame Shield\u003cbr\u003e  - Reaction: Create a shield of fire, granting 2 Evasion against a single attack. If the attack is melee and misses, the attacker takes 1d8 fire damage.\u003cbr\u003e- Ignite Terrain\u003cbr\u003e  - Action: Set fire to a 1 meter radius sphere area of terrain within 20 feet. The fire lasts 3 rounds and deals 1d6 fire damage to creatures entering or starting their turn in the area.\u003cbr\u003e- Intimidating Flame\u003cbr\u003e  - Bonus Action: Manipulate your fire to intimidate nearby creatures. Targets within 2 Meter must make a Wisdom saving throw or become frightened until the end of your next turn.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLevel 1\u003cbr\u003e- Range: 3 Firebending Slot meters\u003cbr\u003e- Attack Roll: Wisdom+ Proficiency.\u003cbr\u003e- Damage: 1d6   Firebending Slot bludgeoning.\u003cbr\u003eEffect:\u003cbr\u003e- Shoot flames from your fists or kicks.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLevel 1\u003cbr\u003e  - Range: Melee\u003cbr\u003e  - Attack Roll: Attacks Firebending Slot times with Strength + Proficiency.\u003cbr\u003e  - Damage: 1d6 + Strength Bludgeoning + 1d12 fire\u003cbr\u003e  - Lingering Effect: This Effect moves with the creature. Therefore it cannot e. Gain resistance to all non-magical damage and deal 2d8 fire damage to any creature that attacks you in melee.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eMeteor Shower\u003cbr\u003efirebending #level5\u003cbr\u003e- Meteor Shower\u003cbr\u003e  - Action: 2 actions.\u003cbr\u003e  - Range: 50  Firebending Slot meters.\u003cbr\u003e  - Duration: 3 rounds.\u003cbr\u003e  - Summon fiery meteors that fall in a 50-foot radius. Each round, creatures in the area must make Dexterity saving throws or take 4d6 fire damage.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eVolcanic Eruption\u003cbr\u003efirebending #level5\u003cbr\u003e- Volcanic Eruption\u003cbr\u003e  - Action: 1 Action.\u003cbr\u003e  - Range: 40  Firebending Slot meters.\u003cbr\u003e  - Duration: Instantaneous.\u003cbr\u003e  - Damage: 6d10 fire.\u003cbr\u003e  - Create a massive eruption of molten rock and fire at a target point, affecting all creatures in a 30-foot radius.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eStress Management Moves\u003cbr\u003efirebending #stressmanagement\u003cbr\u003e- Level 1: Cool Down\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: Instantaneous.\u003cbr\u003e  - Reduce stress points by 2.\u003cbr\u003e  - Focus your inner fire to calm your mind and regain clarity.\u003cbr\u003e- Level 3: Rage Fuel (Secret Technique)\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: 3 rounds.\u003cbr\u003e  - Transform your stress penalty into a bonus. For every stress point, gain a +1 to accuracy and damage rolls for the duration. At the end of the effect, stress resets to 0.\u003cbr\u003e  - Unleash the power of your rage, turning your inner turmoil into devastating strength.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAgni Kai Style\u003cbr\u003efirebending #style #agnikai\u003cbr\u003e- Duels emphasize precision and dominance.\u003cbr\u003e- Move: Burning Duel\u003cbr\u003e  - Action: Choose a single target and engage them in a duel. Both you and the target gain +2 to attack rolls against each other until one is incapacitated.\u003cbr\u003e  - Lingering Effect: The ground around you is superheated; creatures entering the area take 1d6 fire damage.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eDancing Dragon Style\u003cbr\u003efirebending #style #dancingdragon\u003cbr\u003e- Focuses on fluid, continuous motion.\u003cbr\u003e- Move: Spiral Flames\u003cbr\u003e  - Action: Spin and release flames in a 360-degree arc. Creatures within 10 feet must make a Dexterity saving throw or take 2d6 fire damage.\u003cbr\u003e  - Lingering Effect: The area smolders, imposing disadvantage on Dexterity saving throws for creatures within it until the start of your next turn.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eExplosive Firebending\u003cbr\u003efirebending #style #explosive\u003cbr\u003e- Focuses on powerful area-of-effect attacks.\u003cbr\u003e- Move: Fireburst\u003cbr\u003e  - Action: Target a point within 30 feet. All creatures in a 10-foot radius must make a Dexterity saving throw or take 3d6 fire damage.\u003cbr\u003e  - Lingering Effect: The area burns for 2 rounds, dealing 1d4 fire damage to creatures starting their turn there.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eLightning Generation\u003cbr\u003efirebending #style #lightning\u003cbr\u003e- Rare skill requiring intense focus.\u003cbr\u003e- Move: Lightning Strike\u003cbr\u003e  - Action: Spend 2 turns charging and unleash a precise bolt of lightning. One target within 60 feet must make a Constitution saving throw or take 4d10 lightning damage. On a successful save, they take half damage.\u003cbr\u003e  - Lingering Effect: None, but the charge must be used within the next turn.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLevel 3\u003cbr\u003e  - Range: 3  Firebending Slot meters.\u003cbr\u003e  - Duration: 2 rounds Concentration.\u003cbr\u003e  - Create a mirage of heat, imposing disadvantage on attack rolls against creatures within a 10-foot radius of a point you choose.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eIcecubes (Cantrip)\u003cbr\u003e- Cost: None.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 3m\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender can freeze a small amount of water, such as a puddle or a drink-sized volume. The higher the Level the more water can be frozen.\u003cbr\u003e    - Duration: Permanent until thawed naturally.\u003cbr\u003e    - Uses: Create slippery surfaces, small barriers, or tools.\u003cbr\u003eLinks:\u003cbr\u003e- Icecubes\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003efreezing\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Creating Mist:\u003cbr\u003e- Cost: 1 Water Charge per 10 ft radius .\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 10 ft radius centered on self.\u003cbr\u003e    - Will grow 10 feet per round until full sized\u003cbr\u003e    - Creates a heavily obscured area for concealment that can be absorbed to regain charges (10 feeet radius per Turn) or blown await by air.\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eShape Water (Cantrip)\u003cbr\u003e- Cost: None.\u003cbr\u003e- Range: 30 ft.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Duration: At Will. Concentration.\u003cbr\u003e- Effect:  \u003cbr\u003e    You can manipulate a water, shaping it into simple forms, moving it, or changing its state (solid, liquid, mist) temporarily.\u003cbr\u003e    - Limitations: Cannot deal damage but can be used for utility (e.g., extinguishing flames, creating distractions). The higher your Level is the more water can be shaped. Might need an Int ability check.\u003cbr\u003eLinks:\u003cbr\u003e- Shape Water\u003cbr\u003e- Rules\u003cbr\u003e- Int\u003cbr\u003e- Waterbending Moves\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCyclic Flow\u003cbr\u003eLevel 1\u003cbr\u003e- Cost: 1-3 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Duration: 1 round Concentration.\u003cbr\u003e- Range: Touch (through water).\u003cbr\u003e- Effect:  \u003cbr\u003e    You channel healing energy through water, restoring health to a creature. \u003cbr\u003e\t- If the creature is unconscious the creature becomes stable.\u003cbr\u003e    - Healing: 2d8 per charge + Int modifier at the beginning of your next Turn.\u003cbr\u003e    - Limitations: Cannot heal constructs or undead.\u003cbr\u003eCyclic Flow\u003cbr\u003eWaterbending\u003cbr\u003eLevel 1\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLevel 1\u003cbr\u003e- Cost: 1-3 Water Charges.\u003cbr\u003e- Range: 3  Water Charges meter.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender shoots a sharp, pressurized stream of water at a target.\u003cbr\u003e    - Attack Roll: Int + Proficiency.\u003cbr\u003e    - Damage: Water Charges d8 piercing or Water Charges d6 bludgeoning damage per Charge.\u003cbr\u003e    \u003cbr\u003eLinks:\u003cbr\u003e- Proficiency\u003cbr\u003e- Piercing Water\u003cbr\u003e- Int\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003eLevel 1\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eSlicing Water (1st Level Move)\u003cbr\u003e- Cost: 2 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 15 ft cone.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender t makes concentraion saves with disadvantage until the end of your next turn.\u003cbr\u003e    - Duration: 1 turn.\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: 3+ EP.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: Melee.\u003cbr\u003e- Attack: Dex + Proficiency\u003cbr\u003e- Effect:  \u003cbr\u003e    A precise strike that deals no damage but if hit the Target must succeed a DC 10+Proficiency+EP Con Save or be Paralysed until the end of your next Turn. \u003cbr\u003e    - Duration: 1 turn.\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: 4 EP.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: Melee.\u003cbr\u003e- Attack: Dex+Proficiency\u003cbr\u003e- Effect:  \u003cbr\u003e    Deliver a powerful blow that if hit restores 6 EP. The Target must succeed on a DC 10 + Proficiency + EP Con Save or become Slowed.\u003cbr\u003e    - Duration: 2 turns.\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCollectionfile \u003cbr\u003ePROBABLY NEEDS REBALANCING ON THE GO ALL THE TIME\u003cbr\u003eJoining Moves:  \u003cbr\u003eBenders can combine their abilities to create more powerful or creative effects, guided by the \"rule of cool.\" This allows for dynamic and collaborative gameplay that rewards teamwork.\u003cbr\u003e---\u003cbr\u003eConditions to Join:\u003cbr\u003e- Proximity: You must be within 10 feet of the ally initiating the Move.\u003cbr\u003e- Action Type: Joining the Move requires using your Reaction.\u003cbr\u003e- Move Compatibility: The same Move does not need to be performed at the same Level Slot as the initiating Bender.\u003cbr\u003e---\u003cbr\u003eEffect:  \u003cbr\u003eCombining Moves enhances their overall power or effect. For example, if an ally uses Fireburst, and you join in, the resulting effect could be strong enough to burst through a stone wall.\u003cbr\u003e---\u003cbr\u003eOptional Variant:  \u003cbr\u003eYou can also combine different Moves if you can explain how they interact. For instance:\u003cbr\u003e- A Mud Wall created by an Earthbender could be reinforced with an Ice Wall from a Waterbender, resulting in a sturdier barrier with sharp ice spike defenses.  \u003cbr\u003e    This opens opportunities for creative problem-solving and innovative combinations, adding depth to gameplay.\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Teamwork Moves --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e  .\u002f\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eWiki_File_System_Manager.py\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","wikigraph_treemap.html\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eFlying Lemur Form\u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003eStat | Value\u003cbr\u003eStrength (STR) | 6 (-2)\u003cbr\u003eDexterity (DEX) | 24(+7)\u003cbr\u003eConstitution (CON) | 7 (-2)\u003cbr\u003eWisdom(WIS) | 14(+2)\u003cbr\u003eIntelligence(Int) | 8(-1)\u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003e- Size: Small\u003cbr\u003e    \u003cbr\u003e- Movement:\u003cbr\u003e    - Fly 20 m (highly maneuverable).\u003cbr\u003e    - Climb 20 m (adapted to vertical movement).\u003cbr\u003e- Abilities in Flying Lemur Form:\u003cbr\u003e    - Silent Glide: Advantage on Stealth checks while flying.\u003cbr\u003e    - Acute Senses: Advantage on Perception checks that rely on sight or hearing.\u003cbr\u003e    - Quick Escape: Disengage or dash as a Bonus Action.\u003cbr\u003e- Combat Stats (Flying Lemur):\u003cbr\u003e    \u003cbr\u003e    - Evasion: 20\u003cbr\u003e    - HP: 6 (fragile but evasive).\u003cbr\u003e    - Attacks:\u003cbr\u003e        - Razor Claws: Melee Weapon Attack, Dex+Proficiency to hit, 1d4 slashing damage.\u003cbr\u003e- Uses:  \u003cbr\u003e    Perfect for scouting, infiltration, or swift movement through difficult terrain. The form allows quick evasion and small-scale reconnaissance.\u003cbr\u003eBending Slots:\u003cbr\u003e\tAir Lvl1: 4\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eName: Luma\u2019tik \u2014 Glimmerkin of Cracked Mirrors  \u003cbr\u003eType: Lesser Spirit  \u003cbr\u003eDomain: Light, Trickery  \u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003e---\u003cbr\u003eLuma'tik.png\u003cbr\u003e- Size: Small\u003cbr\u003eStat | Value\u003cbr\u003eStrength (STR) | 4 (-3)\u003cbr\u003eDexterity (DEX) | 16 (+3)\u003cbr\u003eConstitution (CON) | 12 (+1)\u003cbr\u003eWisdom(WIS) | 10(+0)\u003cbr\u003eIntelligence(Int) | 8(-1)\u003cbr\u003e- Ideal for infiltration, distraction, and sensory manipulation. Luma\u2019tik thrives in urban or crystal-laced environments, using its shimmering form and illusions to mislead enemies and aid allies from the shadows. Though not powerful in direct combat, it\u2019s difficult to pin down and annoying to deal with.\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eMovement:\u003cbr\u003e- Fly 15 m (hovering, effortless, emits no sound).\u003cbr\u003e    \u003cbr\u003e- Climb 10 m (can scale smooth surfaces with reflective qualities).\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eAbilities in Luma\u2019tik Form:\u003cbr\u003e- Refraction Veil: While in bright or shifting light, Luma\u2019tik gains advantage on Stealth and cannot be targeted by opportunity attacks. This effect ends if Luma\u2019tik is in total darkness or complete silence.\u003cbr\u003e    \u003cbr\u003e- Mirage Flicker (1\u002fShort Rest): As a Bonus Action, Luma\u2019tik can create up to two illusionary duplicates for 1 minute. Each duplicate mimics its movements and grants attackers disadvantage on attack rolls until they hit Luma\u2019tik.\u003cbr\u003e    \u003cbr\u003e- Pulse of Dazzling Light (3\u002frest): Emit a flash in a 10 m radius. Creatures must succeed on a DC (8 + Wisdom + Proficiency) Constitution saving throw or be blinded until the end of their next turn. Allies who avert their gaze are unaffected.\u003cbr\u003e    \u003cbr\u003e- Glimmerjump: \u003cbr\u003e- Reaction:\u003cbr\u003e\tteleport to any point within 20 m that is brightly lit or reflects light (e.g., mirrors, water, crystal surfaces)\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eCombat Stats:\u003cbr\u003e- Evasion: 17\u003cbr\u003e    \u003cbr\u003e- HP: 21 (fragile, relies on mobility and illusions)\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eAttacks:\u003cbr\u003e- Sparkbite: Melee Weapon Attack, Dex+Proficiency to hit, 1d4 radiant damage. If attacking from stealth, deals an extra 1d4 psychic damage.\u003cbr\u003e    \u003cbr\u003e- Lightshard Dart: Ranged Attack, Dex+Proficiency to hit, 1d6 radiant damage. On hit, target must make a DC (8 + Dex + Proficiency) Wisdom saving throw or have disadvantage on Perception checks for 1 minute.\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eLuma\u2019tik is a playful, capricious entity\u2014often found dancing between fractured crystal surfaces or taunting intruders with flickers of light and laughter. Bonding with this spirit gives a bender or spiritualist access to stealth, misdirection, and flash-based utility, ideal for scouts or cunning tacticians.\u003cbr\u003e---\u003cbr\u003eBending Slots:\u003cbr\u003e\tFire Lvl1: 2\u003cbr\u003e\tEarth Lvl1: 1\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eBonus Action\u003cbr\u003eMovement\u003cbr\u003eLevel 1\u003cbr\u003e- Range: Self.\u003cbr\u003e- Duration: 1 Turn.\u003cbr\u003e- Enhance agility by propelling yourself with gusts of air.\u003cbr\u003eEffects:\u003cbr\u003e- Spend 1 Airbending Slot to add 5  Airbending Slot meters to your movement for this turn.\u003cbr\u003eTags:\u003cbr\u003eAirbending #Mobility\u003cbr\u003eAirbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eBonus Action\u003cbr\u003eLevel 4\u003cbr\u003eConcentration\u003cbr\u003e- Range: 2  Airbending Slot Meter radius centered on yourself that moves with you.\u003cbr\u003e- Duration: Until the start of your next Turn.\u003cbr\u003e- Create a rotating shield of air to protect yourself or allies.\u003cbr\u003eEffects:\u003cbr\u003e- Spend  Airbending Slot. to create a protective barrier of swirling air.\u003cbr\u003e- The shield grants 5  Airbending Slot Evasion to all creatures within Range.\u003cbr\u003eLingering Effect:  All Ranged Attacks that enter or exit the are made with Disadvantage.\u003cbr\u003eEvasion\u003cbr\u003eAirbending\u003cbr\u003eLevel 4\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eBonus Action\u003cbr\u003eCantrip\u003cbr\u003e- Range: self and every creature within 1+ 1  Earthbending Slot meters of you\u003cbr\u003eEffect:\u003cbr\u003eTripping opponents with minor terrain manipulation. The target must succeed on a Dexterity saving throw against your Earthbending DC) or be knocked Prone.\u003cbr\u003eEarthbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eBonus Action\u003cbr\u003e- Range: 3 Earthbending Slot Meters\u003cbr\u003e- Target: 1  Earthbending Slot  Enemies within range\u003cbr\u003eRevert Immobilisation through Ground Lock\u003cbr\u003eLinks:\u003cbr\u003e- Earthbending Slot\u003cbr\u003e- Proficiency\u003cbr\u003e- Ground Lock\u003cbr\u003e- Strength\u003cbr\u003e- Earthbending Moves\u003cbr\u003eTags:\u003cbr\u003eEarthbending #Mobility #Immobilisation\u003cbr\u003eEarthbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eLevel 4\u003cbr\u003eConcentration\u003cbr\u003e- Bonus Action .\u003cbr\u003e- Range: Self\u003cbr\u003e- Duration: 3 round. Concentration\u003cbr\u003e- Surround yourself in a thick layer of Sand until the start of your next turn.\u003cbr\u003eEffect:\u003cbr\u003eProvides 2  Earthbending Slot  General Armor\u003cbr\u003eProvides 5 Earthbending Slot Physical Armor\u003cbr\u003eProvide
