|\u003cbr\u003e| Armor            |         |        | Y                       |\u003cbr\u003e+------------------+---------+--------+-------------------------+\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBending Levels\u003cbr\u003eTABLE:\u003cbr\u003e+-----------------------+---------+---------+----+\u003cbr\u003e| Element               | Level   | Notes   |    |\u003cbr\u003e+-----------------------+---------+---------+----+\u003cbr\u003e| Airbending Level      | 0       |         |    |\u003cbr\u003e| Waterbending Level    | 0       |         |    |\u003cbr\u003e| Earthbending Level    | 0       |         |    |\u003cbr\u003e| Firebending Level     | 0       |         |    |\u003cbr\u003e| Spiritbending Level   | 0       |         |    |\u003cbr\u003e+-----------------------+---------+---------+----+\u003cbr\u003e\u003cbr\u003eBending Slots\u003cbr\u003eTABLE:\u003cbr\u003e+-----------+--------------+-------------+-----------+--------+\u003cbr\u003e| Element   | Slot level   | Max Slots   | current   | note   |\u003cbr\u003e+-----------+--------------+-------------+-----------+--------+\u003cbr\u003e+-----------+--------------+-------------+-----------+--------+\u003cbr\u003e---\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eTranformation Points cost: 2 Transformation Points\u003cbr\u003eTABLE:\u003cbr\u003e+----------------------+-----------+\u003cbr\u003e| Stat                 | Value     |\u003cbr\u003e+----------------------+-----------+\u003cbr\u003e| Strength (STR)       | 8 (-1)    |\u003cbr\u003e| Dexterity (DEX)      | 14 (+2)   |\u003cbr\u003e| Constitution (CON)   | 12 (+1)   |\u003cbr\u003e+----------------------+-----------+\u003cbr\u003e\u003cbr\u003e- Size: Medium\u003cbr\u003e-  Ideal for scouting, hunting, and ambushing. The Sonar Earmur's sound-based abilities make it perfect for detecting enemies and disrupting plans, while its stealth and mobility allow it to evade retaliation effectively. Its combat abilities make it a nuisance for casters or stealth-reliant foes.\"\u003cbr\u003e\u003cbr\u003e- Movement:\u003cbr\u003e    - Fly 20 m (highly maneuverable, silent).\u003cbr\u003e    - Burrow 5 m (adapted for soft soil and loose earth).\u003cbr\u003e\u003cbr\u003e- Abilities in Sonar Earmur Form:    \u003cbr\u003e    - Echolocation Mastery: Advantage on Perception checks that rely on hearing. Can detect creatures and objects within a 30 m radius, even in complete darkness, unless in a \"silence zone.\"\u003cbr\u003e\t- Silent Hunt: Advantage on Stealth checks while flying or burrowing, as its movements are nearly soundless.\u003cbr\u003e\t- Soundbending Pulse: Once per short rest, the Earmur can emit a focused sound wave that disrupts enemy concentration or reveals hidden creatures. Creatures within 10 m must make a Airbending DC Constitution saving throw or be disoriented (disadvantage on attacks and Perception checks) for 1 minute.\u003cbr\u003e    Combat Stats:\u003cbr\u003e    - Evasion: 16\u003cbr\u003e    - HP: 2 x CL (durable for its size but not a tank).\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eContext:  \u003cbr\u003eImmediately after the group's victory over a corrupted spirit. Mahogany, the group's only spirit, has absorbed the entity\u2019s negative energy and purified it from within through a spiritual contest.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udfaf Mechanics\u003cbr\u003e\u003cbr\u003e- Trigger: Mahogany completes the spirit cleansing.\u003cbr\u003e    \u003cbr\u003e- Airbenders in the group must make a Perception check (DC 12, with advantage).\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eOn Success:  \u003cbr\u003eThey sense a brief, unnatural shift in air pressure\u2014a swirl or pulse like a door opening to a hidden chamber, but they are high on a mountain with nothing around. It vanishes after two seconds.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf00 Mahogany's Vision\u003cbr\u003e\u003cbr\u003e&gt; (Private: The player can request the others to leave the room for this scene.)\u003cbr\u003e\u003cbr\u003e&gt; As the spiritual remnants fade, Mahogany feels a tingle in the air\u2014not hostile, but watchful.  \u003cbr\u003e&gt; Then, a soft voice, cold as distant wind, whispers directly into her ear:\u003cbr\u003e\u003cbr\u003e\"Now... who are you?\"\u003cbr\u003e\u003cbr\u003eMahogany may make a History or Insight check (DC 17) to identify the speaker.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd0d On Success: Recognizing Rin Kotak\u003cbr\u003e\u003cbr\u003eMahogany realizes the voice belongs to Rin Kotak, the elusive Spiritualist of the Night Bloom, a radical airbender known for manipulating sound and blending with wind to near invisibility. He is feared not just for his bending, but for how he weaves ideology into every breath.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udde3\ufe0f Dialogue (If Mahogany responds)\u003cbr\u003e\u003cbr\u003eIf she speaks\u2014aloud or in thought\u2014a ripple of wind answers. On a distant cliff edge, so far that no human voice should carry, a tall, black-robed figure appears, seated cross-legged, barely more than a wraith in the wind. And yet... his voice is inside her again:\u003cbr\u003e\u003cbr\u003e&gt; \u201cYou bent the spirit. Purified it. Took its pain into your own.  \u003cbr\u003e&gt; You\u2019re not like them\u2014not just flesh. Not just bound by the old rules.  \u003cbr\u003e&gt; Intriguing.\u201d\u003cbr\u003e\u003cbr\u003e&gt; \u201cYou stand on a peak, but don\u2019t you feel the cage around you still?  \u003cbr\u003e&gt; The cycle. The Avatar. All of it\u2014wheels within wheels, spinning us endlessly toward the same fate.\u201d\u003cbr\u003e\u003cbr\u003e&gt; \u201cThey call me traitor. But I only want what you just proved is possible\u2014freedom from what was. You and I, Mahogany... we could speak again. When the wind is right.\u201d\u003cbr\u003e\u003cbr\u003eThe wind sighs. A blink later, the figure is gone. The cliff is bare again.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\uddc2\ufe0f Linked Files\u003cbr\u003e\u003cbr\u003e- Rin Kotak\u003cbr\u003e    \u003cbr\u003e- Night Bloom\u003cbr\u003e    \u003cbr\u003e- Isay Trekal\u003cbr\u003e    \u003cbr\u003e- Hanal Koga\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWould you like me to now generate or clean up the Obsidian files for Rin Kotak or Night Bloom based on your inputs? I can help you integrate this directly into your vault.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe village of the Spidermonkeys\u003cbr\u003eAdventure: \u003cbr\u003e\u003cbr\u003eSetting: The Floating Island of the Nomadic Airbenders\u003cbr\u003e\u003cbr\u003eThe players find themselves in a dense forest, where an entire floating island has landed momentarily. This island belongs to a nomadic airbending tribe that has perfected a unique bending style called Silkbending, inspired by their deep bond with the Spiderlemurs.\u003cbr\u003e\u003cbr\u003eThe Spiderlemurs\u003cbr\u003e\u003cbr\u003eA rare species found only in this part of the world, Spiderlemurs have the body of a lemur but with four arms, four legs, and a long prehensile tail. Their heads resemble spiders, complete with multiple eyes and small mandibles. They produce powerful silk from each of their appendages, which they use to glide alongside the airbenders, creating parachutes they manipulate through airbending. Their silk is also essential for the tribe, used for clothing, rope, and even structural supports for their floating homes.\u003cbr\u003e\u003cbr\u003eThe Spiderlemurs assist in keeping the floating island airborne. By gripping the island with their mandibles and spinning silk into large wind-catching sails, they create natural updrafts, allowing the airbenders to maintain their high-altitude lifestyle.\u003cbr\u003e\u003cbr\u003eThe Floating Island Tribe\u003cbr\u003e\u003cbr\u003eThis nomadic tribe typically resides in a hidden valley where a natural updraft allows them to sustain their floating home. They only descend when necessary, usually for trade or in emergencies. Their culture revolves around Silkbending, a refined form of airbending that incorporates Spiderlemur silk into their movements.\u003cbr\u003e\u003cbr\u003eCulture &amp; Traditions\u003cbr\u003e\u003cbr\u003e- Silkbending: A technique unique to this tribe, combining airbending with the manipulation of Spiderlemur silk. Masters can use it to create silk whips, nets, and even glider-like wings.\u003cbr\u003e    \u003cbr\u003e- Self-Sufficiency: The tribe cultivates special crops adapted to high-altitude life. Their clothing is woven from Spiderlemur silk, making it lightweight yet incredibly durable.\u003cbr\u003e    \u003cbr\u003e- Ceremonial Bonding: Each child of the tribe bonds with a Spiderlemur from birth, forming a lifelong partnership.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eThe Threat: The Corrupted Spiderlemur Spirit\u003cbr\u003e\u003cbr\u003eA young Spiderlemur has been corrupted by dark spiritual energy, transforming into a monstrous creature with a grotesquely large monkey-like head filled with razor-sharp teeth. Its body is now entirely that of a spider, with long, sharp legs and a bloated abdomen leaking dark silk.\u003cbr\u003e\u003cbr\u003eCorrupted Spiderlemur (Dark Spirit)\u003cbr\u003e\u003cbr\u003eType: Dark Spirit Creature (Corrupted Beast)\u003cbr\u003e\u003cbr\u003eHP: High  \u003cbr\u003eArmor: Medium (Silk-reinforced exoskeleton)\u003cbr\u003e\u003cbr\u003eAbilities:\u003cbr\u003e\u003cbr\u003e- Silk Barrage: Fires multiple strands of razor-sharp silk at enemies, restraining and cutting them.\u003cbr\u003e    \u003cbr\u003e- Parasitic Weave: Can attach dark silk to a target, slowly draining their energy while strengthening itself.\u003cbr\u003e    \u003cbr\u003e- Silk Puppet Master: Uses tendrils of silk to control other Spiderlemurs, forcing them to fight against the players.\u003cbr\u003e    \u003cbr\u003e- Shadowed Updraft: Manipulates air currents and silk parachutes to move unpredictably, making it hard to hit.\u003cbr\u003e    \u003cbr\u003e- Venomous Bite: Delivers a spirit-poison that clouds the mind, causing hallucinations and fear.\u003cbr\u003e    \u003cbr\u003e- Dark Ascension: If weakened, the spirit attempts to retreat into the spirit world, requiring the players to perform a purification ritual to prevent its return.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eAdventure Goals\u003cbr\u003e\u003cbr\u003e- Discover the Floating Island: The players must navigate the forest and befriend the nomadic tribe.\u003cbr\u003e    \u003cbr\u003e- Understand Silkbending: Learning about the Spiderlemurs and the tribe's unique abilities may grant temporary Silkbending techniques.\u003cbr\u003e    \u003cbr\u003e- Fight the Corrupted Spiderlemur: The players must defeat or purify the creature before it corrupts the other Spiderlemurs and endangers the island.\u003cbr\u003e    \u003cbr\u003e- Protect the Floating Island: The battle could disrupt the delicate updraft balance, forcing players to use creative airbending or Silkbending to keep the island afloat.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003ePossible Rewards\u003cbr\u003e\u003cbr\u003e- Silkbender\u2019s Cloak: A lightweight but durable cloak woven from Spiderlemur silk, enhancing agility and stealth.\u003cbr\u003e    \u003cbr\u003e- Silkglider Bracers: Wristbands that generate small silk wings, allowing for short bursts of controlled gliding.\u003cbr\u003e    \u003cbr\u003e- Spiderlemur Ally: If the players handle the situation well, they may gain a Spiderlemur companion or a future alliance with the tribe.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eThis adventure introduces a unique airbending culture, a powerful corrupted foe, and creative bending techniques, encouraging both combat and problem-solving elements in the game.\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview of Earth Kingdom adventures, including themes like resilience, strength, and the challenges of navigating a vast and diverse region. Includes guidelines for integrating these modules with the larger campaign.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview:\u003cbr\u003e\u003cbr\u003eThe Avatar spirit, the bridge between the physical and spiritual realms, is in a precarious state. During the final moments of the last Avatar\u2019s life, a catastrophic event caused the spirit\u2019s essence to splinter, disrupting the cycle of reincarnation and weakening its connection to the Spirit World.\u003cbr\u003e\u003cbr\u003eEvent of Fracture:\u003cbr\u003e\u003cbr\u003eThe fracture occurred during a climactic battle against a monstrous corrupted spirit, commanded by the rogue Spiritbender. The Avatar sacrificed themselves to contain the spirit\u2019s power, but the Spiritbender\u2019s mist disrupted the Avatar\u2019s spiritual essence, leaving it fragmented and vulnerable.\u003cbr\u003e\u003cbr\u003eEffects of the Fracture:\u003cbr\u003e\u003cbr\u003e1. Weakened Avatar State: The current Avatar cannot fully access the power of their predecessors, making their connection to past lives erratic and unreliable.\u003cbr\u003e    \u003cbr\u003e2. Disturbed Spirit World: The fracture has caused chaos in the Spirit World, with dark spirits manifesting more frequently in the physical realm.\u003cbr\u003e    \u003cbr\u003e3. Cycle in Jeopardy: The reincarnation cycle is unstable. If the fracture is not healed, the Avatar may not reincarnate after their current life ends.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eClues to Restoration:\u003cbr\u003e\u003cbr\u003e- Shards of Essence: Fragments of the Avatar spirit linger in sacred locations across the world. By visiting these sites and performing rituals, the group can begin to mend the fractures.\u003cbr\u003e    \u003cbr\u003e- Guidance from Spirits: Certain spirits, such as Shifting Sands or the elusive Bright Flame, may provide insight into restoring the balance.\u003cbr\u003e    \u003cbr\u003e- Confronting the Spiritbender: The rogue Airbender holds knowledge about the fracture and must be confronted to uncover the full truth.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eMechanics:\u003cbr\u003e\u003cbr\u003e- Fractured Avatar State:\u003cbr\u003e    \u003cbr\u003e    - When the Avatar attempts to enter the Avatar State, they must succeed on a Spirit check (DC 18). Failure results in a partial manifestation, granting a single bending style enhancement instead of full power.\u003cbr\u003e        \u003cbr\u003e    - Past Avatar advice requires a concentration check (DC 15) to establish communication.\u003cbr\u003e        \u003cbr\u003e- Restoration Sites:\u003cbr\u003e    \u003cbr\u003e    - Each sacred location restores a portion of the Avatar spirit, reducing the DCs for Avatar State checks by 2. Fully visiting all sites removes these penalties entirely.\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003eEncounters:\u003cbr\u003e\u003cbr\u003e- The First Shard: The group travels to a secluded temple where the shard is guarded by a territorial spirit. They must earn the spirit\u2019s trust or defeat it to claim the shard.\u003cbr\u003e    \u003cbr\u003e- Spiritual Consequences: An encounter with a corrupted spirit shows the group the real-world effects of the fractured Avatar spirit, emphasizing the urgency of their quest.\u003cbr\u003e    \u003cbr\u003e- The Spiritbender\u2019s Challenge: A climactic battle against the Spiritbender offers an opportunity to learn how the fracture occurred and hints at their larger agenda.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eImplications for the Campaign:\u003cbr\u003e\u003cbr\u003eHealing the Avatar spirit becomes a central goal, tying together themes of balance, sacrifice, and teamwork. The fracture also provides opportunities for moral dilemmas, as the group navigates the complex relationships between humans and spirits.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview of the purpose of the #Modules folder, including guidelines on how to scale the modules based on the party's power level and integrate them into the main campaign.\u003cbr\u003e\u003cbr\u003eModules\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAshen Steppes\u003cbr\u003e\u003cbr\u003eEnvironment:\u00a0Volcanic plains and hardened lava flows  \u003cbr\u003eSpecialized Style:\u00a0Magma Pulse Bending  \u003cbr\u003eDescription:  \u003cbr\u003eBuilt on a cooled lava plateau, Ashen Steppes is a hardy settlement that thrives amidst ash and fire. Their benders have developed\u00a0Magma Pulse Bending, a high-heat technique that focuses on heating and liquifying stone momentarily to create bursts of molten rock or steam-based propulsion. It\u2019s more aggressive and volatile than traditional earthbending, with a focus on explosive, short-range attacks and reshaping brittle volcanic stone mid-combat.\u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Lava Flare:\u00a0Melts a small patch of ground into a geyser of magma.\u003cbr\u003e    \u003cbr\u003e- Obsidian Shardstorm:\u00a0Shatters cooled lava into razor-sharp fragments hurled at foes.\u003cbr\u003e    \u003cbr\u003e- Ash Drift:\u00a0Uses heated air and ash for sudden propulsion or smokescreen escapes.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWhispering Mesa\u003cbr\u003e\u003cbr\u003eEnvironment:\u00a0Wind-carved sandstone cliffs and canyons  \u003cbr\u003eSpecialized Style:\u00a0Echoform Bending  \u003cbr\u003eDescription:  \u003cbr\u003ePerched atop labyrinthine mesas where the wind never stops howling, Whispering Mesa is home to benders who\u2019ve mastered\u00a0Echoform Bending\u2014a refined technique that utilizes sound vibrations and seismic pulses through brittle stone. They focus on precision, using thin slices, tremor sense, and harmonic resonance to create unstable conditions underfoot or launch sonic-reinforced projectiles.\u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Resonant Blade:\u00a0Vibrates stone into a cutting edge capable of slicing metal.\u003cbr\u003e    \u003cbr\u003e- Tremor Veil:\u00a0Distorts local vibrations to confuse tremor-sensing enemies.\u003cbr\u003e    \u003cbr\u003e- Echo Step:\u00a0Propels the user forward using a precisely timed ground pulse.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWould you like me to create adventure hooks or NPCs tied to these villages?\u003cbr\u003e\u003cbr\u003eYou said:\u003cbr\u003e\u003cbr\u003egreat now do the same for airbender villages\u003cbr\u003e\u003cbr\u003eChatGPT said:\u003cbr\u003e\u003cbr\u003eHere are three distinct\u00a0Airbender villages, each shaped by their unique environments and showcasing specialized Airbending styles that reflect their culture and surroundings:\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eZephyr\u2019s Climb\u003cbr\u003e\u003cbr\u003eEnvironment:\u00a0High-altitude glacier peak  \u003cbr\u003eSpecialized Style:\u00a0Stillwind Bending  \u003cbr\u003eDescription:  \u003cbr\u003eZephyr\u2019s Climb is nestled in the razor-thin air of a mountain range\u2019s highest glacier, where silence and stillness are paramount for survival. The airbenders here have developed\u00a0Stillwind Bending, a meditative form that emphasizes control of minute air currents and micro-movements. This precision-based style allows benders to manipulate even the most stagnant air to create silence zones, control breath patterns, and maintain balance on windswept peaks.\u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Silent Gale:\u00a0Dampens all nearby sound by stabilizing air pressure and movement.\u003cbr\u003e    \u003cbr\u003e- Breath Cloak:\u00a0Controls respiration and surface-level air to become undetectable to heat or motion sensors.\u003cbr\u003e    \u003cbr\u003e- Frozen Drift:\u00a0Uses fine gusts to levitate lightly over snow without leaving prints or triggering avalanches.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eHollow Reeds\u003cbr\u003e\u003cbr\u003eEnvironment:\u00a0Floating reed islands in a vast foggy marsh  \u003cbr\u003eSpecialized Style:\u00a0Reedflow Bending  \u003cbr\u003eDescription:  \u003cbr\u003eHollow Reeds is a nomadic, waterbound community drifting through an enormous marsh where visibility is low and navigation is based on air and scent. The benders here created\u00a0Reedflow Bending, a fluid, serpentine style that emulates the winding patterns of wind through wetland reeds. This style excels at low-altitude flight, air scent-tracking, and creating confusing, humid mirages using moisture-laden gusts.\u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Mist Spiral:\u00a0Twists warm air and fog into a smothering vortex that obscures vision and sound.\u003cbr\u003e    \u003cbr\u003e- Scent Echo:\u00a0Carries specific smells on wind currents for tracking or signaling.\u003cbr\u003e    \u003cbr\u003e- Whispering Drift:\u00a0Glides just above water without causing ripples, ideal for stealth and scouting.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCrimson Sails\u003cbr\u003e\u003cbr\u003eEnvironment:\u00a0Roaming cliffside windships on desert thermals  \u003cbr\u003eSpecialized Style:\u00a0Thermal Riding  \u003cbr\u003eDescription:  \u003cbr\u003eCrimson Sails is not a stationary village but a mobile flotilla of wind-powered skiffs and gliders that ride the desert\u2019s fierce thermals between cliff plateaus. The benders here specialize in\u00a0Thermal Riding, an acrobatic and speed-focused airbending style that manipulates vertical drafts and uses heat differentials to soar at high speeds. Their combat relies on divebomb maneuvers, sudden bursts of updrafts, and redirecting hot air from desert stones.\u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Updraft Spear:\u00a0Condenses a vertical wind column to launch people or objects skyward.\u003cbr\u003e    \u003cbr\u003e- Searing Glide:\u00a0Uses heat rising off hot stone to gain lift or deflect projectile attacks.\u003cbr\u003e    \u003cbr\u003e- Cyclone Lance:\u00a0A spinning, high-speed dive with piercing air pressure, used in aerial jousts.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eStonevine Hollow\u003cbr\u003eEnvironment: \u003cbr\u003eSubterranean jungle cave system\u003cbr\u003eSpecialized Style: \u003cbr\u003eVinegrasp BendingDescription:\u003cbr\u003eStonevine Hollow is hidden deep beneath the surface in a lush cave network where glowing fungi and creeping vines dominate the stone landscape. The villagers have developed Vinegrasp Bending, a technique that integrates earthbending with plant interaction. Benders here can manipulate soil and roots in tandem, weaving vines through stone or using soil nutrients to rapidly grow roots as whips, restraints, or bridges. They value patience and symbiosis, with their bending resembling a slow but overwhelming encroachment.Key Techniques:Root Snare: Erupts tangled roots from the soil to bind enemies.Fungal Bloom: Encourages explosive growth of bioluminescent fungi to blind foes or light paths.Symbiotic Armor: Covers the bender in flexible bark-like plating drawn from surrounding flora.\u003cbr\u003e\u003cbr\u003eAshen Steppes\u003cbr\u003eEnvironment: \u003cbr\u003eVolcanic plains and hardened lava flowsSpecialized Style: Magma Pulse BendingDescription:\u003cbr\u003eBuilt on a cooled lava plateau, Ashen Steppes is a hardy settlement that thrives amidst ash and fire. Their benders have developed Magma Pulse Bending, a high-heat technique that focuses on heating and liquifying stone momentarily to create bursts of molten rock or steam-based propulsion. It\u2019s more aggressive and volatile than traditional earthbending, with a focus on explosive, short-range attacks and reshaping brittle volcanic stone mid-combat.\u003cbr\u003eKey Techniques:\u003cbr\u003eLava Flare:\u003cbr\u003eMelts a small patch of ground into a geyser of magma.\u003cbr\u003eObsidianShardstorm: \u003cbr\u003eShatters cooled lava into razor-sharp fragments hurled at foes.\u003cbr\u003eAsh Drift: \u003cbr\u003eUses heated air and ash for sudden propulsion or smokescreen escapes.\u003cbr\u003e\u003cbr\u003eWhispering Mesa\u003cbr\u003eEnvironment: \u003cbr\u003eWind-carved sandstone cliffs and canyons\u003cbr\u003eSpecialized Style:\u003cbr\u003eEchoform Bending Description:\u003cbr\u003ePerched atop labyrinthine mesas where the wind never stops howling, Whispering Mesa is home to benders who\u2019ve mastered Echoform Bending\u2014a refined technique that utilizes sound vibrations and seismic pulses through brittle stone. They focus on precision, using thin slices, tremor sense, and harmonic resonance to create unstable conditions underfoot or launch sonic-reinforced projectiles.\u003cbr\u003eKey Techniques:\u003cbr\u003eResonant Blade: Vibrates stone into a cutting edge capable of slicing metal.\u003cbr\u003eTremor Veil: Distorts local vibrations to confuse tremor-sensing enemies.\u003cbr\u003eEcho Step: Propels the user forward using a precisely timed ground pulse.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ehttps:\u002f\u002fdocs.google.com\u002fdocument\u002fd\u002fe\u002f2PACX-1vS6lUZOVfTes0fREKrjtLjDXrZ-oZkxG3jeoAdIFJErzhnTc82UnTnXKRTlWVBrhxy9c3bBBdj8Nkh0\u002fpub\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA vibrant Earth Kingdom festival, featuring opportunities for roleplay, games, and uncovering local rumors.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe players meet a famous Earth Kingdom sculptor who uses Earthbending to create works of art. Potential for puzzles or a heist story.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA challenge requiring precise Earthbending control, such as moving a delicate object or navigating a collapsing cave.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePlayers defend or breach a fortress using Earthbending tactics. Includes scalable mechanics for different player levels.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA sprawling network of caves hiding bandits, lost treasures, or ancient Earth Kingdom artifacts.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe players uncover a smuggling ring operating beneath a major Earth Kingdom city.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eHidden agendas during a local festival, such as smuggling or political rivalries.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe party must infiltrate or attack a bandit camp causing problems for a nearby town. Scalable combat and stealth options.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA session where the party is ambushed by bandits. Includes a scalable encounter table and potential motivations for the bandits.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe party must find a lost Air Nomad relic. Options for clues, red herrings, and NPCs involved.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDetailed mechanics for a combat scenario with bandits, including scalable stats and optional objectives.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA beast attack on a village, with rules for scaling the beast\u2019s strength and integrating environmental hazards.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA reusable template for creating scalable combat challenges.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA reusable template for crafting social or dialogue-heavy scenarios.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA reusable template for creating Earthbending-based puzzles and challenges.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA reusable template for designing political intrigue scenarios.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eClues uncovered in a marketplace dispute that lead to a larger conspiracy.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA scavenger hunt for an ancient artifact, with puzzles and conflicting NPC objectives.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOptions for resolving a bandit encounter through dialogue, including persuasion challenges and NPC personality traits.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe party witnesses a dispute in a busy marketplace and can choose to mediate, escalate, or exploit the situation.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSkybison Polo Festival Extravaganza\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003eThe Skybison Polo Festival is an annual event held in the Air Nomad territories, combining thrilling competitions, festive games, and a cultural celebration of the bond between Air Nomads and their beloved skybison. This module introduces the players to the festival, offering opportunities for interaction, skill challenges, and intrigue.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eKey Locations\u003cbr\u003eThe Festival Grounds\u003cbr\u003e- A large, open area with colorful tents, food stalls, and stages for musical performances.\u003cbr\u003e- Games and activities like skybison rides, airbending obstacle courses, and market stalls selling unique wares.\u003cbr\u003e\u003cbr\u003eThe Polo Arena\u003cbr\u003e- The centerpiece of the festival, with a massive circular arena designed for skybison polo.\u003cbr\u003e- Spectators sit in tiered seating, cheering loudly as teams compete.\u003cbr\u003e\u003cbr\u003eThe Betting Tent\u003cbr\u003e- A lively hub where festival-goers can place bets on their favorite teams or players.\u003cbr\u003e- Operated by a charismatic Air Nomad known as Garo the Gamester.\u003cbr\u003e\u003cbr\u003eThe Stables\u003cbr\u003e- A quieter area where the competing skybison are cared for.\u003cbr\u003e- Players might meet the skybison caretakers or sneak around to uncover secrets.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eKey NPCs\u003cbr\u003eMaster Tenzho\u003cbr\u003e- An elder Air Nomad and referee of the polo matches. Wise but with a mischievous sense of humor.\u003cbr\u003e- Knows much about the history of skybison polo.\u003cbr\u003e\u003cbr\u003eGaro the Gamester\u003cbr\u003e- A charming and slightly shady Air Nomad who runs the betting tent.\u003cbr\u003e- Always looking for a way to turn a profit, possibly at the expense of honesty.\u003cbr\u003e\u003cbr\u003eTeam Azure Wings\u003cbr\u003e- A team of young, brash Air Nomads eager to prove their skills.\u003cbr\u003e- Might invite the players to join their team if they need extra members.\u003cbr\u003e\u003cbr\u003eTeam Sky Soarers\u003cbr\u003e- The reigning champions, led by the confident Kani Windstride.\u003cbr\u003e- They are skilled but harbor a secret\u2014they may be cheating to maintain their streak.\u003cbr\u003e\u003cbr\u003eRavi the Snack Vendor\u003cbr\u003e- A jovial vendor selling skybison-themed snacks.\u003cbr\u003e- Often hears interesting gossip from festival-goers.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eModule Hooks\u003cbr\u003e- An Invitation to Compete: A friendly Air Nomad approaches the players and invites them to join Team Azure Wings, either as players or strategists.\u003cbr\u003e- Suspicious Activity: Players overhear rumors of Team Sky Soarers cheating. They can investigate by talking to NPCs, sneaking into the stables, or tracking unusual behavior.\u003cbr\u003e- High-Stakes Betting: Garo the Gamester offers the players a deal to rig a match or uncover potential rigging by others.\u003cbr\u003e- Festival Trouble: A rogue skybison causes chaos, giving players a chance to save festival-goers and show their skills.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eKey Activities and Challenges\u003cbr\u003eSkybison Polo Match\u003cbr\u003e- A dynamic game where players use bending abilities or athletic prowess to assist their team in scoring goals.\u003cbr\u003e- Structured as a series of skill challenges, with opportunities for creativity and teamwork.\u003cbr\u003e\u003cbr\u003eBetting and Investigation\u003cbr\u003e- Players can place bets, investigate odds, or catch cheaters in the act.\u003cbr\u003e- Success depends on Insight, Persuasion, and Stealth rolls.\u003cbr\u003e\u003cbr\u003eFestival Games\u003cbr\u003e- Airbending obstacle courses, pie-eating contests, and skybison riding challenges offer chances for fun and minor rewards.\u003cbr\u003e\u003cbr\u003eThe Final Match\u003cbr\u003e- If the players participate in or interfere with the final match, it\u2019s a climactic scene with high stakes.\u003cbr\u003e- The outcome affects the players' reputation among the Air Nomads.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eComplications and Twists\u003cbr\u003e- Cheating Exposed: If the players expose Team Sky Soarers\u2019 cheating, the festival becomes tense, and the players must help restore fairness.\u003cbr\u003e- Skybison Stampede: Midway through the festival, a group of frightened skybison rampages through the grounds, requiring quick Action to protect the crowd.\u003cbr\u003e- A Mysterious Stranger: An enigmatic figure offers the players a chance to sabotage the match for a hefty reward, creating a moral dilemma.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eRewards\u003cbr\u003e- Air Nomad Artifacts: Unique trinkets and gear, such as a Skybison Whistle or a Windcatcher Cloak.\u003cbr\u003e- Favor of the Air Nomads: Unlock access to future Air Nomad storylines or resources.\u003cbr\u003e- Reputation and Renown: Gain prestige among festival-goers or uncover secrets tied to the Air Nomads\u2019 history.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eExploring an Air Nomad temple with traps, lore, and possible combat encounters.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eRandom encounter tables for traveling through uncharted wilderness.\u003c\u002fspan\u003e"],"textfont":{"size":12},"texttemplate":"%{label}\u003cbr\u003e%{text}\u003cextra\u003e\u003c\u002fextra\u003e","values":[2971,3355,2781,3520,73,714,148234,88591,3527,6310,4149,24293,4079,17857,147,94,98,327,358,647,473,941,363,5051,1022,463,576,2990,4249,4249,8294,8294,15913,4833,3666,4118,3296,8458,2861,2806,2791,19538,2358,5955,2318,3477,2100,3330,2526,1113,1,1412,2179,2179,8397,13455,9437,3968,50,2486,2486,1033,1033,92,92,2893,2893,190,61,2769,2769,1375,1375,4079,1,1477,2601,4561,4560,1,1076,217,3139,3139,5633,182,5907,5907,2490,2490,129,129,241,107,134,237,117,120,178,96,82,81,81
