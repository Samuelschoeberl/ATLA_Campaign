        <script charset="utf-8" src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>                <div id="e2e7bfee-48bb-494c-aad3-641980633ce9" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script type="text/javascript">                                    window.PLOTLYENV=window.PLOTLYENV || {};                                    if (document.getElementById("e2e7bfee-48bb-494c-aad3-641980633ce9")) {                    Plotly.newPlot(                        "e2e7bfee-48bb-494c-aad3-641980633ce9",                        [{"branchvalues":"total","hovertemplate":"%{label}\u003cbr\u003e%{hovertext}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCore Stats\u003cbr\u003eTABLE:\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCore Stats\u003cbr\u003eTABLE:\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCore Stats\u003cbr\u003eTABLE:\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCore Stats\u003cbr\u003eTABLE:\u003cbr\u003e...\u003c\u002fspan\u003e","https:\u002f\u002favatar.fandom.com\u002fwiki\u002fHistoryoftheWorldofAvatar#Eranames","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eTABLE:\u003cbr\u003e+----------------+-------+-------+-------+-------+-------+-------+---------+---------+-------+--------+----------+----------------------+--------------+\u003cbr\u003e...\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eType: Air Nomad Offshoot\u003cbr\u003eLocation: Cliffside plateaus bordering the Great Si Wong Desert\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile\u003cbr\u003eCollectionfile\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLocation and Culture:\u003cbr\u003eNestled at the edge of the Si Wong Desert\u2019s shifting dunes, the Village of Mahzeen stands as a rare bastion of life in the arid wilderness. The settlement lies just a half-day\u2019s journey from an ancient Earthbending Temple, its sandstone spires visible on the distant horizon. Though not large, Mahzeen is renowned for its skilled Sandbenders, who have perfected a unique defensive technique that harnesses the versatile power of sand.\u003cbr\u003e...\u003c\u002fspan\u003e","","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- Session 1 The Spirit Within\u003cbr\u003e- The Lotus Fractures\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- The Spirit Gauge\u2019s Purpose\u003cbr\u003e- Betrayals and Deceptions\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- The Avatar\u2019s Legacy\u003cbr\u003e- The Final Confrontation\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eTitle: Shattered Spirit, Rising Lotus\u003cbr\u003e- The Ceremony of the Lotus\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe Lotus\u003cbr\u003e- Home of the ceremony and spiritual hub.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAct 1: Unveiling the Threat\u003cbr\u003e- PCs discover they hold fragmented aspects of the Avatar Spirit.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e1. Balance vs. Independence:\u003cbr\u003eExplores centralized power vs. collective leadership.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eScene Setting:\u003cbr\u003eThe campaign begins at the serene Temple of the The Lotus, where benders from across the world gather for the annual Ceremony of the Lotus.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eStory\u003cbr\u003eLinks:\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eGlacial Temple\u003cbr\u003ePurpose: Spiritual sanctuary and waterbender training ground\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eProperties:\u003cbr\u003eThe water is infused with natural and spiritual properties, accelerating healing, soothing pain, and purging spiritual corruption. However, overuse or removal of too much water causes the spring to become turbulent and the Jellytee Spirit to grow agitated.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eForm: A luminescent, ethereal fusion of jellyfish and manatee. It drifts through the spring, emitting soft pulses of bioluminescence and humming vibrations.\u003cbr\u003eNature: Benevolent but sensitive to imbalance and greed. When pleased, it radiates a mist that calms the mind and heals minor ailments. When disturbed, the mist becomes turbulent and can induce hallucinations or intense emotional episodes.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLocation: Southern Water Tribe tundra, near the Glacial Temple\u003cbr\u003ePopulation: 150 permanent residents, swelling with visitors year-round\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eType: Water Tribe Island Village\u003cbr\u003eLocation: Remote island far from the Northern Water Tribe ice shelves\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe shimmering goldfish poop, once dismissed, is now reacting \u2014 humming faintly, vibrating when close to sacred texts or old chanting bowls in the temple. A monk, once skeptical, nervously confesses:\u003cbr\u003e&gt; \"There was\u2026 someone who always believed. The High Priest. Master Anzu.\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e\ud83c\udf49Glassfruit Watermelonsteamer\u003cbr\u003eMust be innitiated by a Earth or Waterbender and needs at least one level from each Elements Level. You can use Levels from up to two different Elements.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLocation: Glassline canyon near Omashu\u2019s lower shell district \u2013 jagged cliffs, semi-wild Glassfruit groves, and an unstable spiritual resonance.\u003cbr\u003eSituation:\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eBaezu \u2013 Earthbender Master of Resonance\u003cbr\u003eRole: Boss \u2013 Controller, Support, Spiritual Conduit\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePlothook\u003cbr\u003eLocation: Omashu\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCity of Murmura\u003cbr\u003eTags: #PatolaMountainRange #Murmura #Airbending #Monastery\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCity of Zephyros\u003cbr\u003eTags: #PatolaMountainRange #Zephyros #Airbending #Monastery\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eEarmur\u003cbr\u003eTags: #PatolaMountainRange #Fauna #Soundbending\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview:\u003cbr\u003eTwin siblings from Sekan\u2019to whose seamless coordination has turned their unique dual-element fusion into an art form. They\u2019re local legends among younger benders and are being watched closely by the Crystalfire Circle.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e\ud83e\udded Hook Summary:\u003cbr\u003eWhile traveling the harsh Si Wong Desert, the heroes spot a mysterious gleam atop a sandstone spire\u2014a rhythmic flash of white light that appears unnatural, almost like a signal. Locals mention an ancient legend of a \u201cstar-serpent\u201d and a tribe of light-forgers hidden within the rock. The party must brave scorching winds, treacherous slopes, and possibly spiritual interference to uncover the truth.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDC 17\u003cbr\u003eType: Greater Spirit\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e\ud83d\udcc4\u003cbr\u003eOverview:\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eElemental Roots: Firebending + Crystal-focused Earthbending\u003cbr\u003eNickname: Crystalfire Flash or Gleam-bending\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e\ud83c\udf0d Setting: Village of Sekan'to (Si Wong Desert)\u003cbr\u003e- Hidden within a towering mesa in the Si Wong Desert, Sekan'to is carved into rich quartz veins deep in the desert\u2019s sandstone spires.\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDescription\u003cbr\u003e- Appearance: A colossal peaceful and good spirit creature that is a hybrid between a toad and an elephant. It has thick, webbed feet, long elephant tusks, and a bloated, amphibian-like body with slick moist skin. Its texture resembles that of a toads \u2014 moist, clothed in simple silk robes. On its back is a disturbing cyst-like growth shaped like a smaller toad's face, with a trunk for a tongue hanging limply. The creature is ancient and wise, embodying Earth and Water, and is surrounded by a shimmering aura of mist.\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview\u003cbr\u003e- Location: Hidden beneath Si Wong Rock , central Si Wong Desert.\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eI maybe want an arc there between metalbender and airbender characters to find ways to woek together.\u003cbr\u003eType: Spirit Beast\u003cbr\u003e...\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eName: Kaedo\u003cbr\u003eAge: Mid-twenties\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA Dark humnaoid Cat like Spirit that has a large shard of Vaatu and was therefore corrupted early. He supresses the dark as good as he cans but the dark spirit also gives him the gifts to be an elite assasin. He only uses a little bit of airbending and is mostly waepon and archery based.\u003cbr\u003eRace\u002fType: Dark Humanoid Cat-like Spirit\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLinks:\u003cbr\u003e- Kaedo, the Young Sandbender Guide\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eName: Firebender\u003cbr\u003eCore Stats\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe Last Avatar\u003cbr\u003eFather of Kaedo\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLinks:\u003cbr\u003e- Stonewarden Garon\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eName: Master Baezu\u003cbr\u003eCore Stats\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLinks:\u003cbr\u003e- Rin Kotak\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eName: Waterbender\u003cbr\u003eCore Stats\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eName: kingahmisho\u003cbr\u003eCore Stats\u003cbr\u003e...\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eTranformation Points cost: 2 Transformation Points\u003cbr\u003eTABLE:\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eContext:\u003cbr\u003eImmediately after the group's victory over a corrupted spirit. Mahogany, the group's only spirit, has absorbed the entity\u2019s negative energy and purified it from within through a spiritual contest.\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe village of the Spidermonkeys\u003cbr\u003eAdventure:\u003cbr\u003e...\u003c\u002fspan\u003e","","","Overview of Earth Kingdom adventures, including themes like resilience, strength, and the challenges of navigating a vast and diverse region. Includes guidelines for integrating these modules with the larger campaign.","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview:\u003cbr\u003eThe Avatar spirit, the bridge between the physical and spiritual realms, is in a precarious state. During the final moments of the last Avatar\u2019s life, a catastrophic event caused the spirit\u2019s essence to splinter, disrupting the cycle of reincarnation and weakening its connection to the Spirit World.\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview of the purpose of the #Modules folder, including guidelines on how to scale the modules based on the party's power level and integrate them into the main campaign.\u003cbr\u003eModules\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAshen Steppes\u003cbr\u003eEnvironment:\u00a0Volcanic plains and hardened lava flows\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eStonevine Hollow\u003cbr\u003eEnvironment:\u003cbr\u003e...\u003c\u002fspan\u003e","","https:\u002f\u002fdocs.google.com\u002fdocument\u002fd\u002fe\u002f2PACX-1vS6lUZOVfTes0fREKrjtLjDXrZ-oZkxG3jeoAdIFJErzhnTc82UnTnXKRTlWVBrhxy9c3bBBdj8Nkh0\u002fpub","","A vibrant Earth Kingdom festival, featuring opportunities for roleplay, games, and uncovering local rumors.","The players meet a famous Earth Kingdom sculptor who uses Earthbending to create works of art. Potential for puzzles or a heist story.","","A challenge requiring precise Earthbending control, such as moving a delicate object or navigating a collapsing cave.","Players defend or breach a fortress using Earthbending tactics. Includes scalable mechanics for different player levels.","","A sprawling network of caves hiding bandits, lost treasures, or ancient Earth Kingdom artifacts.","The players uncover a smuggling ring operating beneath a major Earth Kingdom city.","","Hidden agendas during a local festival, such as smuggling or political rivalries.","","The party must infiltrate or attack a bandit camp causing problems for a nearby town. Scalable combat and stealth options.","","A session where the party is ambushed by bandits. Includes a scalable encounter table and potential motivations for the bandits.","The party must find a lost Air Nomad relic. Options for clues, red herrings, and NPCs involved.","","Detailed mechanics for a combat scenario with bandits, including scalable stats and optional objectives.","A beast attack on a village, with rules for scaling the beast\u2019s strength and integrating environmental hazards.","","A reusable template for creating scalable combat challenges.","A reusable template for crafting social or dialogue-heavy scenarios.","","A reusable template for creating Earthbending-based puzzles and challenges.","A reusable template for designing political intrigue scenarios.","","Clues uncovered in a marketplace dispute that lead to a larger conspiracy.","A scavenger hunt for an ancient artifact, with puzzles and conflicting NPC objectives.","","Options for resolving a bandit encounter through dialogue, including persuasion challenges and NPC personality traits.","The party witnesses a dispute in a busy marketplace and can choose to mediate, escalate, or exploit the situation.","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSkybison Polo Festival Extravaganza\u003cbr\u003eOverview\u003cbr\u003e...\u003c\u002fspan\u003e","","Exploring an Air Nomad temple with traps, lore, and possible combat encounters.","Random encounter tables for traveling through uncharted wilderness."],"ids":["Firebender NPC Sheet.md","Master Baezu NPC Sheet.md","Waterbender NPC Sheet.md","king_ah_mi_sho NPC Sheet.md","links.md","npcs_input.md","\u002f","Locations\u002f","Locations\u002fCrimson Sails.md","Locations\u002fIncencebending.md","Locations\u002fTribe of Mahzeen.md","NPCs\u002f","PCs\u002f","Story\u002f","Story\u002fAct 1 Unveiling the Threat.md","Story\u002fAct 2 The Rise of the Night Bloom.md","Story\u002fAct 3 The Broken Avatar.md","Story\u002fCampaign Overview.md","Story\u002fKey Groups and Concepts.md","Story\u002fMain Story Arc A Shattered Avatar Spirit.md","Story\u002fRecurring Themes and Player Agency.md","Story\u002fThe Ceremony of the Lotus.md","Story\u002f_Story.md","Locations\u002fAkara VIllage\u002f","Locations\u002fAkara VIllage\u002fGlacial Temple.md","Locations\u002fAkara VIllage\u002fHealing Spring of Akara.md","Locations\u002fAkara VIllage\u002fJellytee Spirit.md","Locations\u002fAkara VIllage\u002fVillage of Akara.md","Locations\u002fKugluktuk\u002f","Locations\u002fKuglu r\u003eInventory &amp; Notes\u003cbr\u003e\u003cbr\u003e-\u003cbr\u003e-\u003cbr\u003eEarthbending\u003cbr\u003e\u003cbr\u003e- Placeholder for Earthbending content\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ehttps:\u002f\u002favatar.fandom.com\u002fwiki\u002fHistoryoftheWorldofAvatar#Eranames\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eTABLE:\u003cbr\u003e+----------------+-------+-------+-------+-------+-------+-------+---------+---------+-------+--------+----------+----------------------+--------------+\u003cbr\u003e| Name           | STR   | DEX   | CON   | INT   | WIS   | CHA   | Water   | Earth   | Air   | Fire   | Spirit   | Manually Rolled HP   | Run Update   |\u003cbr\u003e+----------------+-------+-------+-------+-------+-------+-------+---------+---------+-------+--------+----------+----------------------+--------------+\u003cbr\u003e| Waterbender    | 4     | 2     | 1     | 3     | 1     | 5     | 5       | 0       | 0     | 0      | 0        | 0                    | yes          |\u003cbr\u003e| Firebender     | 3     | 5     | 3     | 3     | 6     | 3     | 0       | 0       | 0     | 5      | 0        | 0                    | yes          |\u003cbr\u003e| kingahmisho    | 8     | 0     | 5     | 2     | 3     | 5     | 0       | 15      | 0     | 0      | 0        | 0                    | yes          |\u003cbr\u003e| Master Baezu   | 8     | 0     | 5     | 2     | 3     | 5     | 0       | 12      | 0     | 0      | 0        | 0                    | yes          |\u003cbr\u003e+----------------+-------+-------+-------+-------+-------+-------+---------+---------+-------+--------+----------+----------------------+--------------+\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eType: Air Nomad Offshoot  \u003cbr\u003eLocation: Cliffside plateaus bordering the Great Si Wong Desert  \u003cbr\u003eRole: High-speed messengers, scouts, and storm-chasers of the desert  \u003cbr\u003eSpecialized Style: Thermal Riding\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003e\u003cbr\u003eThe Crimson Sails are a unique, nomadic sect of Air Nomads adapted to life on the edge of the Si Wong Desert. They do not dwell in temples or static sanctuaries, but aboard elegant skiffs and gliders designed to harness the fierce thermal currents that rise from the sun-scorched sand. Painted in brilliant reds and ochres, their vessels shimmer like embers in the sky.\u003cbr\u003e\u003cbr\u003eBound by the winds and the rhythms of the desert heat, the Crimson Sails are expert couriers, capable of crossing vast expanses far faster than beasts or traditional caravans. However, their airbending is heavily dependent on the desert\u2019s thermal conditions; at night, without the rising heat, they become grounded or slow-moving.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCulture\u003cbr\u003e\u003cbr\u003e- Daybound Nomadism: Their society revolves around daylight. At night, the flotilla anchors to cliff alcoves or ruins. Festivals, meals, and gatherings are nocturnal, while travel and work occur during the heat of the day.\u003cbr\u003e    \u003cbr\u003e- Messenger Guild: The Crimson Sails operate an informal courier and intelligence network across the Earth Kingdom desert frontier. They are trusted by traders, desert clans, and outposts to deliver messages, maps, and even small goods.\u003cbr\u003e    \u003cbr\u003e- Spiritual Traditions: Though descended from the Air Nomad monastic line, the Crimson Sails follow a more animistic interpretation of airbending\u2014viewing the desert winds as living spirits that must be listened to, not commanded.\u003cbr\u003e    \u003cbr\u003e- Cliff Shrines: Instead of temples, they maintain wind shrines at high cliffs where they meditate and commune with the desert wind spirits.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAirbending Style: Thermal Riding\u003cbr\u003e\u003cbr\u003eA fast, acrobatic form of airbending that specializes in using heat-induced updrafts. Unlike traditional circular airbending, Thermal Riding involves linear acceleration, vertical climbs, and divebomb maneuvers.\u003cbr\u003e\u003cbr\u003eKey Techniques\u003cbr\u003e\u003cbr\u003e- Updraft Spear: Used for rapid vertical ascents or launching allies over obstacles.\u003cbr\u003e    \u003cbr\u003e- Searing Glide: Gliders skim hot surfaces to catch lift or create sudden evasions.\u003cbr\u003e    \u003cbr\u003e- Cyclone Lance: A spiraling dive technique combining momentum and pressure for duels.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eKey Figures\u003cbr\u003e\u003cbr\u003e- Sister Nhari: Elder wind-priestess and navigator. Keeper of the Flame Charts\u2014ancient wind maps burned into silk.\u003cbr\u003e    \u003cbr\u003e- Korran of the Lances: Champion aerial jouster and defense leader of the flotilla.\u003cbr\u003e    \u003cbr\u003e- Tama Reed-Singer: Renowned messenger known for solo crossings of the Empty Expanse.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eConflicts &amp; Hooks\u003cbr\u003e\u003cbr\u003e- A Night-Time Ambush: Without thermal lift, the Crimson Sails are vulnerable after dark. A rival faction may exploit this to sabotage a key courier mission.\u003cbr\u003e    \u003cbr\u003e- Desert Spirits Stirring: Strange wind patterns and dust devils are interfering with their gliding. Is it natural\u2014or something darker awakening beneath the sands?\u003cbr\u003e    \u003cbr\u003e- A Lost Shrine: A sandstorm uncovers an ancient Air Nomad relic near a long-buried cliff shrine. The Crimson Sails must recover it before sandbenders do.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eConnections\u003cbr\u003e\u003cbr\u003e- Allies of the Si Wong Water Raiders for mutual desert survival.\u003cbr\u003e    \u003cbr\u003e- Sometimes in conflict with Sandbender Tribes who view them as sky-interlopers.\u003cbr\u003e    \u003cbr\u003e- Rumored to ferry secrets for the White Lotus across desert borders.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile\u003cbr\u003eCollectionfile\u003cbr\u003e\u003cbr\u003e&gt; Note: Incensebending is understood as a hybrid craft combining multiple bending styles. Water and earth are used to grow and prepare the organic materials; fire dries and activates them for burning; and the resulting smoke carries a blend of those influences (often shaped further by air or spirit-affiliated bending). Many incense rituals therefore require cooperative inputs from different benders and are rich in mixed-element effects.\u003cbr\u003e\u003cbr\u003eIncencebending Team-Up Techniques\u003cbr\u003eAvatar Spirit Bridge Level\u003cbr\u003eX = y\\z\u003cbr\u003e\u003cbr\u003e- are the number of bending \u002f ritual slots contributed by each participant.\u003cbr\u003e- This encourages coordinated, complementary rituals rather than one person carrying the whole effect.\u003cbr\u003e- X = y \u00d7 z.\u003cbr\u003e\u003cbr\u003e&gt; Example:\u003cbr\u003e&gt;\u003cbr\u003e&gt; - Spirit-bender contributes 2 slots (y = 2)\u003cbr\u003e&gt; - Airbender contributes 3 (z = 3)\u003cbr\u003e&gt;   \u2192 X = 2 \u00d7 3 = 6\u003cbr\u003e\u003cbr\u003eThese incense rituals are subtle but potent \u2014 they alter minds, environments, and the thin veil between worlds. Each scales with X and changes flavor based on the blend used.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf2b\ufe0f Sanctified Veil (White Juniper Blend)\u003cbr\u003e\u003cbr\u003eMust be initiated by an Air- or Spirit-affiliated bender in line of sight\u003cbr\u003e\u003cbr\u003e&gt; A delicate, shimmering smoke hangs in the air, softening perception and muffling intent.\u003cbr\u003e\u003cbr\u003e- Effect: Creatures within the area gain disadvantage on Perception checks and Wisdom saves for social or detection rolls for the duration. Allies chosen by the casters gain advantage on stealth and deception checks instead.\u003cbr\u003e- Radius: 3 meter \\ X\u003cbr\u003e- Duration: X \u00d7 2 minutes\u003cbr\u003e- Special: If X \u2265 10, the veil extends an extra 50% radius and grants allies a one-time free Hide action while moving silently.\u003cbr\u003e\u003cbr\u003e- Narrative Use: Move through guarded temples, stage an ambush, or protect a ritual site from prying eyes.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd25 Ember-Perfume Lure (Saffron Ash Incense)\u003cbr\u003e\u003cbr\u003eMust be initiated by a Firebender or an allied social-bender\u003cbr\u003e\u003cbr\u003e&gt; Warm, spicy smoke slips into the minds of those who breathe it, pulling at curiosity and confidence.\u003cbr\u003e\u003cbr\u003e- Effect: Targets in area must make a WIS save of DC = X \\ 2 or become charmed toward the initiators for 1d6 rounds (hostile creatures act more hesitantly; NPCs may follow simple requests). Charmed creatures still defend themselves if attacked.\u003cbr\u003e- Radius: 2 meter \\ X\u003cbr\u003e- Duration: 1d6 rounds (save at end of each round)\u003cbr\u003e- Special: If X \u2265 8, affected creatures also take a -2 penalty to initiative while charmed. If X \u2265 14, the charm becomes temporary friendship \u2014 NPCs may swap information or small items.\u003cbr\u003e\u003cbr\u003e- Narrative Use: Soften a patrol, win a persuasive encounter, or buy time during negotiations.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd6f\ufe0f Quieting Resin (Black Myrrh Compound)\u003cbr\u003e\u003cbr\u003eMust be initiated by an Earth- or Spirit-bender with line of sight\u003cbr\u003e\u003cbr\u003e&gt; Dense resin smoke clings to thoughts and speech, dampening hostile intent and noisy magic.\u003cbr\u003e\u003cbr\u003e- Effect: Spellcasters and creatures concentrating must succeed on an INT or WIS save (player\u002fGM chooses) DC = X \\ 2 or lose concentration on any spell or sustained effect they are maintaining. Non-magical creatures suffer disadvantage on attack rolls while in the cloud.\u003cbr\u003e- Radius: X \\ 1.5 meters (round down)\u003cbr\u003e- Duration: X rounds\u003cbr\u003e- Special: If X \u2265 12, the cloud suppresses minor magical auras (up to X-level or equivalent narrative significance) for the duration.\u003cbr\u003e\u003cbr\u003e- Narrative Use: Break enemy ritual focus, neutralize a summoning in progress, or create a bubble of calm in a chaotic fight.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf38 Memory Bloom (Lotus &amp; Sandalwood)\u003cbr\u003e\u003cbr\u003eMust be initiated by a Spirit- or Water-affiliated bender\u003cbr\u003e\u003cbr\u003e&gt; Fragrant petals swirl with memories; those who inhale see recollections as vivid sensory flashes.\u003cbr\u003e\u003cbr\u003e- Effect: Creatures who fail a CON save DC = X \\ 2 experience one vivid memory flash chosen by the caster (real or suggested). Mechanical effects: they take Xd6 psychic damage if the memory is traumatic, or they gain advantage on a single insight or recall check if the memory is helpful.\u003cbr\u003e- Radius: 1.5 meter \\ X\u003cbr\u003e- Duration: Instant effect; memories linger as a mood for X minutes (roleplay cue).\u003cbr\u003e- Special: If X \u2265 9, the caster may imprint a short, innocuous suggestion tied to the memory (no mind control) that gives a +2 modifier to a single upcoming check for the group.\u003cbr\u003e\u003cbr\u003e- Narrative Use: Extract clues from an NPC, trigger a hidden memory, or create an emotional opening.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\u26aa Spirit Soot Communion (Clear Resin Seed)\u003cbr\u003e\u003cbr\u003eMust be initiated by a Spirit-bender with an Earth or Water ally in direct contact\u003cbr\u003e\u003cbr\u003e&gt; A ritual smoke binds the living and the drifting; the boundary thins and spirits may answer.\u003cbr\u003e\u003cbr\u003e- Effect: For the ritual duration, the casters can attempt to commune with local spirits. Mechanically: the group gains a ritual channel equal to 10 \\ X minutes of clear spirit communication or a spirit-bound boon (GM decides outcome). Creatures of ill intent suffer disadvantage on attacks against casters while the communion holds.\u003cbr\u003e- Radius: Line of sight up to 100 meters for spirit-sensing; physical effects center on the ritual site within 5 meters per X\u002f3 (round down).\u003cbr\u003e- Duration: Concentration (both\u002f all initiators) or up to 10 \u00d7 X minutes\u003cbr\u003e- Special: If X \u2265 15, the communion may bind a willing spirit temporarily (up to 24 hours) or close a small, unstable spirit rift if tied to the site's lore.\u003cbr\u003e\u003cbr\u003e- Narrative Use: Bargain with guardian spirits, learn local history from ghosts, or seal a haunted crossroads.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMechanical Notes &amp; Edge Cases\u003cbr\u003e\u003cbr\u003e- Rituals that require concentration: if any initiator loses concentration (incapacitated, unconscious, or fails a concentration check), the ritual fails and dissipates.\u003cbr\u003e- Area overlaps: multiple incense effects stack only if they are clearly different in narrative and mechanical purpose; otherwise the stronger (higher X or more recent) takes precedence.\u003cbr\u003e- Immunities: creatures or entities immune to charm, psychic damage, or spirit influence are either fully or partially resistant \u2014 treat per-GM.\u003cbr\u003e- Large crowds: When targeting many creatures, scale number of forced saves by X and increase DC by +1 for each doubling of targets beyond (GM can simplify).\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eSpiritbending\u003cbr\u003eAirbending\u003cbr\u003eWaterbending\u003cbr\u003eFirebending\u003cbr\u003eTeam-up Moves\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLocation and Culture:\u003cbr\u003e\u003cbr\u003eNestled at the edge of the Si Wong Desert\u2019s shifting dunes, the Village of Mahzeen stands as a rare bastion of life in the arid wilderness. The settlement lies just a half-day\u2019s journey from an ancient Earthbending Temple, its sandstone spires visible on the distant horizon. Though not large, Mahzeen is renowned for its skilled Sandbenders, who have perfected a unique defensive technique that harnesses the versatile power of sand.\u003cbr\u003e\u003cbr\u003eThe villagers live in dome-shaped tents woven from desert fibers, arranged around a central oasis fed by a hidden spring. Worn banners and intricate stone carvings display their heritage: guardians of the desert\u2019s secrets, proud custodians of a bending style that focuses on defense, endurance, and cunning ambush tactics. These Sandbenders follow a strict code of balance, taught to them by the temple monks long ago.\u003cbr\u003e\u003cbr\u003eThe Sandbending Technique: \u201cSpiked Sand Sphere\u201d\u003cbr\u003e\u003cbr\u003eThe hallmark ability of Mahzeen\u2019s Sandbenders is the creation of a swirling sphere of sand that hardens into a protective shell adorned with razor-like spikes of hardened silica. Both a shield and a weapon, it reflects their philosophy\u2014protection first, then retribution.\u003cbr\u003e\u003cbr\u003eMechanics:\u003cbr\u003e\u003cbr\u003e- Cost: 3 Earth (or Sand) Charges\u003cbr\u003e    \u003cbr\u003e- Type: Action\u003cbr\u003e    \u003cbr\u003e- Range: Self\u003cbr\u003e    \u003cbr\u003e- Effect:  \u003cbr\u003e    The Sandbender calls upon the shifting dunes, pulling grains of sand from the ground and condensing them into a floating sphere around their body. The sphere grants temporary hit points and can lash out with sharp spikes.\u003cbr\u003e    \u003cbr\u003e    - Temporary Hit Points (THP): Gain THP equal to 3 times your level (or a number appropriate for your system) when you form the Spiked Sand Sphere.\u003cbr\u003e    - Defensive Bonus: While the sphere is active, you gain +1 to your Evasion Score and +2 to your AR (or equivalent defensive bonus in your ruleset).\u003cbr\u003e    - Duration: Concentration, up to 1 minute, or until the THP are depleted.\u003cbr\u003e\u003cbr\u003eAttacking with the Sphere:\u003cbr\u003e\u003cbr\u003e- As a Bonus Action (or Reaction when hit by a melee attack), you can command the spikes to strike out at a foe within 5 ft.\u003cbr\u003e- Attack Roll: Strength + Proficiency vs. Target\u2019s Evasion Score.\u003cbr\u003e- Damage: 1d8 + Strength modifier piercing damage.\u003cbr\u003e- Scaling Damage: The damage die increases by 1 step (e.g., from 1d8 to 1d10) for every 5 remaining THP in the sphere. For example:\u003cbr\u003e    - 15+ THP: 1d10 damage\u003cbr\u003e    - 10+ THP: 1d8 damage\u003cbr\u003e    - 5+ THP: 1d6 damage\u003cbr\u003e    - &lt;5 THP: 1d4 damage\u003cbr\u003e\u003cbr\u003eAs the THP are chipped away by enemy strikes and your own attacks, the sphere\u2019s integrity diminishes. Fewer remaining THP means smaller, less potent spikes. Skilled Sandbenders learn how to maintain their focus, refortify the sand with additional Charges, or time their attacks at the peak of the sphere\u2019s resilience.\u003cbr\u003e\u003cbr\u003eIn-World Significance:\u003cbr\u003e\u003cbr\u003e- Training and Tradition:  \u003cbr\u003e    Mahzeen\u2019s Sandbenders perfect the Spiked Sand Sphere technique through years of practice in the harsh desert climate. Initiates spend countless hours balancing water gourds atop columns of shifting sand, refining their focus to keep the sphere stable under pressure.\u003cbr\u003e    \u003cbr\u003e- Trade and Diplomacy:  \u003cbr\u003e    Adventurers and scholars traveling to the nearby Earth Temple often stop at Mahzeen to hire guides or seek instruction. Monks from the temple once taught the villagers about spiritual discipline and fortitude, and in return, the Sandbenders offer them their protective services against raiders and feral spirits that prowl the dunes.\u003cbr\u003e    \u003cbr\u003e- Rites of Passage:  \u003cbr\u003e    Young Sandbenders earn their place in Mahzeen\u2019s society by successfully conjuring and maintaining a Spiked Sand Sphere under trial conditions\u2014fending off controlled attacks from elders. Only then may they wear the village\u2019s distinctive sand-silk armbands, signifying their mastery of this unique technique.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eIn this way, the Spiked Sand Sphere embodies the village\u2019s identity: resilience in adversity, measured strength, and harmony with the unforgiving desert world they call home.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Proficiency\u003cbr\u003e- Strength\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003c\u002fspan\u003e","","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- Session 1 The Spirit Within\u003cbr\u003e- The Lotus Fractures\u003cbr\u003e- Building Alliances\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Session 1 The Spirit Within\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- The Spirit Gauge\u2019s Purpose\u003cbr\u003e- Betrayals and Deceptions\u003cbr\u003e- The Shadowed Spirits\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- The Avatar\u2019s Legacy\u003cbr\u003e- The Final Confrontation\u003cbr\u003e- The Avatar Reborn\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eTitle: Shattered Spirit, Rising Lotus\u003cbr\u003e\u003cbr\u003e- The Ceremony of the Lotus\u003cbr\u003e- Main Story Arc A Shattered Avatar Spirit\u003cbr\u003e- Recurring Themes and Player Agency\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Recurring Themes and Player Agency\u003cbr\u003e- The Lotus\u003cbr\u003e- The Ceremony of the Lotus\u003cbr\u003e- Main Story Arc A Shattered Avatar Spirit\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe Lotus\u003cbr\u003e\u003cbr\u003e- Home of the ceremony and spiritual hub.\u003cbr\u003e\u003cbr\u003eCeremony of the Resonance\u003cbr\u003e\u003cbr\u003e- Celebration of unity, balance, and bending mastery.\u003cbr\u003e\u003cbr\u003eNight Bloom\u003cbr\u003e\u003cbr\u003e- Radical faction opposing the Avatar\u2019s central role.\u003cbr\u003e\u003cbr\u003eResonance Jade\u003cbr\u003e\u003cbr\u003e- Artifact measuring spiritual energy.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAct 1: Unveiling the Threat\u003cbr\u003e\u003cbr\u003e- PCs discover they hold fragmented aspects of the Avatar Spirit.\u003cbr\u003e- Internal conflict: heightened bending abilities without unity.\u003cbr\u003e- Night Bloom\u2019s origins tied to a Lotus Fracture.\u003cbr\u003e\u003cbr\u003eAct 2: The Rise of the Night Bloom\u003cbr\u003e\u003cbr\u003e- Spirit Gauge\u2019s potential to destabilize balance.\u003cbr\u003e- Betrayals within the White Lotus.\u003cbr\u003e- Growing attacks from corrupted spirits.\u003cbr\u003e\u003cbr\u003eAct 3: The Broken Avatar\u003cbr\u003e\u003cbr\u003e- Truth of the Avatar\u2019s death and shattered spirit.\u003cbr\u003e- Final confrontation: Combine spirits to reform Avatar or share the essence among the group.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e1. Balance vs. Independence:  \u003cbr\u003e    Explores centralized power vs. collective leadership.\u003cbr\u003e    \u003cbr\u003e2. Personal Growth:  \u003cbr\u003e    Each PC\u2019s arc reflects their fragment of the Avatar Spirit.\u003cbr\u003e    \u003cbr\u003e3. Moral Dilemmas:  \u003cbr\u003e    The Night Bloom\u2019s ideals resonate with many; their morality isn\u2019t black and white.\u003cbr\u003e    \u003cbr\u003e4. Worldbuilding:  \u003cbr\u003e    Encourage player input for designing clans, bending styles, and spiritual entities.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eScene Setting:\u003cbr\u003e\u003cbr\u003eThe campaign begins at the serene Temple of the The Lotus, where benders from across the world gather for the annual Ceremony of the Lotus.\u003cbr\u003e\u003cbr\u003e- PCs arrive as prodigies of their respective arts.\u003cbr\u003e- Subtle unease: elders whisper of spiritual disturbances.\u003cbr\u003e- PCs feel a fleeting resonance, but there\u2019s no spiritual response\u2014an ill omen.\u003cbr\u003e\u003cbr\u003eThe Attack on the Ceremony:\u003cbr\u003e\u003cbr\u003e- Smokebomb and the Voice:  \u003cbr\u003e    A black mist explosion (orchestrated by Isai Trekal) disrupts the ceremony.  \u003cbr\u003e    Voice: \u201cThe age of bending submission is over...\u201d\u003cbr\u003e    \u003cbr\u003e- Artifact Theft:  \u003cbr\u003e    The Order of the Night Bloom steals the Resonance Jade.\u003cbr\u003e    \u003cbr\u003e- Rogue Spirit Attack:  \u003cbr\u003e    PCs fend off a corrupted spirit, feeling faint resonance from the ritual during combat.\u003cbr\u003e    \u003cbr\u003e- Aftermath:  \u003cbr\u003e    The artifact is gone, and the PCs are tasked with investigating the theft.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Night Bloom\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eStory\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Act 2 The Rise of the Night Bloom\u003cbr\u003e- Campaign Overview\u003cbr\u003e- Act 1 Unveiling the Threat\u003cbr\u003e- The Ceremony of the Lotus\u003cbr\u003e- Key Groups and Concepts\u003cbr\u003e- Recurring Themes and Player Agency\u003cbr\u003e- Main Story Arc A Shattered Avatar Spirit\u003cbr\u003e- Session 1 The Spirit Within\u003cbr\u003e- Act 3 The Broken Avatar\u003cbr\u003e- Modules\u003cbr\u003e- \u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eGlacial Temple\u003cbr\u003e\u003cbr\u003ePurpose: Spiritual sanctuary and waterbender training ground  \u003cbr\u003eArchitecture: A glimmering structure partially embedded in ice, with prayer flags fluttering around open, steam-warmed courtyards.\u003cbr\u003e\u003cbr\u003eLore:  \u003cbr\u003eBuilt above the Healing Spring of Akara, the Glacial Temple is both a spiritual hub and defensive bastion. It\u2019s home to the Order of the Veiled Mist, a sect of waterbenders trained in Player Root\u002fRules\u002fBending Rules\u002fWater\u002fWaterbending Moves\u002fUtility\u002fMistbending \u2014 a sacred technique taught only to those deemed spiritually attuned by the Jellytee Spirit.\u003cbr\u003e\u003cbr\u003eAccess to the temple is restricted. Pilgrims may offer prayers at the base, but only those with permission from the High Acolyte may enter the inner sanctum or take water directly from the spring.\u003cbr\u003e\u003cbr\u003eTemple Customs:\u003cbr\u003e\u003cbr\u003e- No artificial fire within the inner sanctum.\u003cbr\u003e    \u003cbr\u003e- Offerings must include a piece of handwoven fabric dipped in the spring.\u003cbr\u003e    \u003cbr\u003e- All initiates take a vow of vapor \u2014 a month-long silence.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eProperties:  \u003cbr\u003eThe water is infused with natural and spiritual properties, accelerating healing, soothing pain, and purging spiritual corruption. However, overuse or removal of too much water causes the spring to become turbulent and the Jellytee Spirit to grow agitated.\u003cbr\u003e\u003cbr\u003eLimits:\u003cbr\u003e\u003cbr\u003e- Only a limited volume can be extracted per day.\u003cbr\u003e    \u003cbr\u003e- Excessive exposure can dull pain but doesn\u2019t cure deeper ailments unless sanctioned by the temple.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eForm: A luminescent, ethereal fusion of jellyfish and manatee. It drifts through the spring, emitting soft pulses of bioluminescence and humming vibrations.  \u003cbr\u003eNature: Benevolent but sensitive to imbalance and greed. When pleased, it radiates a mist that calms the mind and heals minor ailments. When disturbed, the mist becomes turbulent and can induce hallucinations or intense emotional episodes.\u003cbr\u003e\u003cbr\u003eVery emotionally unstable and the waterbenders have to be super careful not to disturb the water as the manatee starts to cry and throw a tantrum when they do.\u003cbr\u003e\u003cbr\u003e---\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLocation: Southern Water Tribe tundra, near the Glacial Temple  \u003cbr\u003ePopulation: 150 permanent residents, swelling with visitors year-round  \u003cbr\u003eNotable Feature: The Healing Spring of Akara, which emits a continuous healing mist due to the presence of the Jellytee Spirit\u003cbr\u003e\u003cbr\u003eDescription:  \u003cbr\u003eAkara is a quiet, snow-dusted village nestled against a glacial ridge. Built in concentric circles around the Healing Spring of Akara, the town's layout reflects the cultural importance of balance and flow. Small wooden homes carved with oceanic motifs cluster closer to the spring, with larger communal and guest housing further out.\u003cbr\u003e\u003cbr\u003eThe village has become a sacred pilgrimage site for the chronically ill, terminally afflicted, and spirit-touched. While the Healing Spring of Akara's waters are said to be miraculous, the villagers are extremely cautious in how much water they allow to be drawn, in reverence to the Jellytee Spirit.\u003cbr\u003e\u003cbr\u003eKey NPCs:\u003cbr\u003e\u003cbr\u003e- High Acolyte Siva: Stoic leader of the temple, acts as intermediary between villagers and the Jellytee Spirit.\u003cbr\u003e    \u003cbr\u003e- Healer Rokan: Master of the Player Root\u002fRules\u002fBending Rules\u002fWater\u002fWaterbending Moves\u002fUtility\u002fMistbending technique, teaches selected apprentices.\u003cbr\u003e    \u003cbr\u003e- Elder Tumaq: Village elder, keeper of oral history and taboos.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWould you like to expand this into a quest hook, adventure arc, or introduce tensions like outsiders exploiting the spring?\u003cbr\u003e\u003cbr\u003eYou said:\u003cbr\u003e\u003cbr\u003egreat now also add a little monplogue of the jellytee spirit. It is super whinie and moody and cries when water gets removed\u003cbr\u003e\u003cbr\u003eChatGPT said:\u003cbr\u003e\u003cbr\u003ePerfect! Here\u2019s a whimsical and moody monologue from the Jellytee Spirit, capturing its overly emotional, whiny personality. This could be delivered during a vision in the mist or heard echoing through the spring when someone tries to take more than their share of water:\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMonologue of the Jellytee Spirit\u003cbr\u003e\u003cbr\u003e&gt; The mist thickens. Light pulses softly from below the water. A voice, melodious yet dripping with exaggerated sorrow, rings out through the temple\u2019s chamber...\u003cbr\u003e\u003cbr\u003e\"Oooohhh noooo... not agaaaain... why must you always take? I just got the spring balanced. My nerves\u2014my poor, fluttery nerves! You don\u2019t understand how hard it is to keep the mist pretty and shimmery when you\u2019re all down here sloshing and scooping like hungry pelicans!\"\u003cbr\u003e\u003cbr\u003e\"Do you know what it\u2019s like to live in a sacred spring? It\u2019s cold, it's bright, and people are always touching stuff. I\u2014we\u2014me! I need peace! And you\u2014you greedy water-sucking little surface-crawlers\u2014never think about me!\"\u003cbr\u003e\u003cbr\u003e(sniffs dramatically, bubble trails forming in the water)\u003cbr\u003e\u003cbr\u003e\"Fine. Take a few drops, go ahead. It\u2019s not like I matter. Just the ancient sacred spirit who lives in this place. That\u2019s fine. That\u2019s totally fine.\"\u003cbr\u003e\u003cbr\u003e(beat)\u003cbr\u003e\u003cbr\u003e\"...But if you take more than one flask I will emotionally devastate you.\"\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eType: Water Tribe Island Village  \u003cbr\u003eLocation: Remote island far from the Northern Water Tribe ice shelves  \u003cbr\u003eAffinity: Waterbending, Spirits\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003e\u003cbr\u003eKugluktup is a secretive and remote waterbending village located on a rugged island surrounded by turbulent seas. It lies several days' journey south of the Northern Water Tribe's territories. Due to its isolation and history of raids by pirates and foreign explorers, the villagers are notoriously wary and openly hostile to outsiders. Their waterbending traditions have diverged significantly from the mainstream Northern Tribe practices, adapting to a more self-sufficient, ocean-based survival.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eUnique Features\u003cbr\u003e\u003cbr\u003eOceanwater Desalination Technique\u003cbr\u003e\u003cbr\u003eKugluktup's greatest innovation is their sacred Desalination Ritual, used to convert seawater into fresh water. This process is spiritual as much as it is practical and is central to village survival. It involves collaboration with the village's guardian spirit, the Eelstar.\u003cbr\u003e\u003cbr\u003eThe Eelstar\u003cbr\u003e\u003cbr\u003eA hybrid spirit beast, the Eelstar resembles five long eels fused at the tail to form a living starfish-like body. It is an ancient spirit bound to the island, often dwelling in underwater caverns accessible only through intricate coral tunnels.\u003cbr\u003e\u003cbr\u003e- Elemental Power: Uniquely, the Eelstar can breathe fire (a rare trait among ocean spirits), which it uses to heat seawater to boiling during the desalination ceremony. Waterbenders then condense and harvest the purified steam into fresh water.\u003cbr\u003e    \u003cbr\u003e- Temperament: Benevolent but alien in its thinking, the Eelstar respects tradition and punishes disrespect. It chooses one acolyte per generation to serve as its interpreter and medium: the Boilkeeper.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCulture\u003cbr\u003e\u003cbr\u003e- Isolationist Ethos: Kugluktup culture is insular. Children are taught caution and mistrust of outsiders from birth. Stories of invaders stealing knowledge or corrupting the Eelstar are retold often.\u003cbr\u003e    \u003cbr\u003e- Spiritual Bond: The villagers see themselves as stewards of both the sea and the Eelstar. Every household contributes to tending coral beds, cleaning beaches, and preserving balance with the spirit.\u003cbr\u003e    \u003cbr\u003e- Tattoos of the Tides: Adult waterbenders earn blue-green tattoos patterned after ocean currents. Each wave line signifies a milestone in mastery of their local bending techniques.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWaterbending Style\u003cbr\u003e\u003cbr\u003eKugluktup's bending style is:\u003cbr\u003e\u003cbr\u003e- Flowing and Sudden: Movements mimic sudden waves, surges, and sharp contractions like jellyfish pulses.\u003cbr\u003e    \u003cbr\u003e- Saltwater Versatility: Benders here specialize in manipulating saltwater directly, with subtle techniques to shift salinity and temperature. Many learn to pull fog from the sea for concealment.\u003cbr\u003e    \u003cbr\u003e- Condensation Arts: A unique branch of waterbending that involves evaporating and condensing water in minute amounts, especially during the desalination rituals.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eKey Figures\u003cbr\u003e\u003cbr\u003eNaqqi the Boilkeeper\u003cbr\u003e\u003cbr\u003e- Role: Spiritual leader and medium for the Eelstar\u003cbr\u003e    \u003cbr\u003e- Traits: Stern, enigmatic, speaks rarely and often in parables\u003cbr\u003e    \u003cbr\u003e- Skills: Master of condensation arts, communicates directly with the spirit in dreams and trance\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eTuliq the Tideguard\u003cbr\u003e\u003cbr\u003e- Role: Military captain and protector of the shores\u003cbr\u003e    \u003cbr\u003e- Traits: Fierce, pragmatic, believes in pre-emptive defense\u003cbr\u003e    \u003cbr\u003e- Skills: Skilled warrior and waterbender with techniques that use high-pressure saltwater jets\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003ePana the Listener\u003cbr\u003e\u003cbr\u003e- Role: One of the few curious about the outside world\u003cbr\u003e    \u003cbr\u003e- Traits: Quiet, observant, secretly collects maps and foreign items\u003cbr\u003e    \u003cbr\u003e- Potential Hook: Might secretly assist travelers if convinced they mean no harm\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAdventure Hooks\u003cbr\u003e\u003cbr\u003e- A drought weakens the Eelstar, and Kugluktup's hostility intensifies. The players must convince the villagers to let them help.\u003cbr\u003e    \u003cbr\u003e- A rogue spirit has infected one of the Eel limbs, twisting it into an aggressive form. The Boilkeeper calls for aid.\u003cbr\u003e    \u003cbr\u003e- Pirates are seeking the secret of the Desalination Ritual. The players must decide whether to defend Kugluktup or broker peace.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLinks\u003cbr\u003e\u003cbr\u003e- Waterbending\u003cbr\u003e    \u003cbr\u003e- Spirits\u003cbr\u003e    \u003cbr\u003e- Eelstar\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe shimmering goldfish poop, once dismissed, is now reacting \u2014 humming faintly, vibrating when close to sacred texts or old chanting bowls in the temple. A monk, once skeptical, nervously confesses:\u003cbr\u003e\u003cbr\u003e&gt; \"There was\u2026 someone who always believed. The High Priest. Master Anzu.  \u003cbr\u003e&gt; He was banished to the temple archives after\u2026 well, too many sermons about invisible fish.\"\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udfdb\ufe0f Act I: Finding Master Anzu\u003cbr\u003e\u003cbr\u003eThe party must explore the forbidden lower sanctum of the temple \u2014 a quiet, echoing archive of moldy scrolls, broken water clocks, and fish-shaped relics. Deep within, they find Master Anzu:\u003cbr\u003e\u003cbr\u003e- A thin, ancient man with big watery eyes, speaking in half-poetry and full riddles\u003cbr\u003e    \u003cbr\u003e- Surrounded by aquariums full of no fish \u2014 only reflections and bubbles\u003cbr\u003e    \u003cbr\u003e- He talks to the goldfish regularly, but admits \u201cShe\u2019s shy. She only appears when you aren\u2019t looking.\u201d\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdd Act II: The Limerick\u003cbr\u003e\u003cbr\u003eAmong the scrolls, Anzu recites an ancient limerick he once found inscribed on a scale made of gold-leafed spiritglass:\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdc The Goldfish Limerick\u003cbr\u003e\u003cbr\u003e&gt; In stillest of ponds where no ripples are seen,  \u003cbr\u003e&gt; She darts through the veil where no spirit has been.  \u003cbr\u003e&gt; She poops like a comet, unseen in her wake,  \u003cbr\u003e&gt; And sleeps in the world where dreams do not break.  \u003cbr\u003e&gt; To find her, dear seeker, don't look but just feel\u2014  \u003cbr\u003e&gt; For goldfish are truth, and their silence is real.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udde9 Interpretation (What Anzu Knows)\u003cbr\u003e\u003cbr\u003e- The Goldfish fazes between the Spirit World and the Material based on emotional triggers \u2014 fear, serenity, hunger, embarrassment.\u003cbr\u003e    \u003cbr\u003e- She is drawn to stillness, reflection, and honest curiosity.\u003cbr\u003e    \u003cbr\u003e- Her poop only appears when she phases improperly \u2014 a symptom of imbalance between the realms.\u003cbr\u003e    \u003cbr\u003e- She once had a mirror-lake shrine, far from the temple, where the veil was thin and she could swim freely.\u003cbr\u003e    \u003cbr\u003e- Anzu believes the party can recreate the conditions to lure her back temporarily.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udc3e Next Steps \u002f Quest Objectives\u003cbr\u003e\u003cbr\u003e1. Recreate the Still Pond:\u003cbr\u003e    \u003cbr\u003e    - Find or build a water basin with perfect stillness (no wind, noise, light)\u003cbr\u003e        \u003cbr\u003e    - Must be placed in a high-spirit resonance area (Anzu knows of one \u2014 the Mirror Hollow)\u003cbr\u003e        \u003cbr\u003e2. Use the Poop (yes, really):\u003cbr\u003e    \u003cbr\u003e    - The poop fragment is a spiritual scent marker \u2014 burn it as incense during the ritual to open the veil\u003cbr\u003e        \u003cbr\u003e3. Avoid looking directly at the fish \u2014 this causes her to retreat. Players must instead perceive her via reflections, ripples, or through mirrors held backwards.\u003cbr\u003e    \u003cbr\u003e4. If successful, the fish may:\u003cbr\u003e    \u003cbr\u003e    - Grant a blessing (invisibility, silent movement, spirit-sight)\u003cbr\u003e        \u003cbr\u003e    - Reveal the location of a hidden artifact (maybe another Resonance Stone?)\u003cbr\u003e        \u003cbr\u003e    - Simply leave behind another poop\u2026 but now it\u2019s glowing with spiritual energy and can be used to track spirit movements like a compass\u003cbr\u003e    - \u003cbr\u003e\ud83d\udc1f Still Ear, Truth Clear\u003cbr\u003e\u003cbr\u003eAdvanced Spiritual Airbending Technique  \u003cbr\u003ePrerequisite: Training in Airbending (even basic level), spiritual sensitivity, and a connection to the Invisible Goldfish Spirit  \u003cbr\u003eLearned from: Master Anzu\u2019s teachings and meditation upon the Limerick\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\u2728 Description:\u003cbr\u003e\u003cbr\u003eBy entering a state of deep meditation and tuning out all worldly sound, the Goldfish Priest reaches a state of resonant stillness. In this space, she poses questions not with voice, but with thoughts shaped like ripples \u2014 gentle vibrations of intent across the boundary between worlds.\u003cbr\u003e\u003cbr\u003eIn response, the Invisible Goldfish Spirit answers not with words, but with the presence or absence of a single \"blub\" in the ear of the priest. No one else can hear it.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\uddd8\u200d\u2640\ufe0f Mechanics:\u003cbr\u003e\u003cbr\u003eAction Type: Special Ritual Action (requires 1 uninterrupted minute of focus)\u003cbr\u003e\u003cbr\u003eCheck: Roll a Religion (or Spirit) check, DC = 12 + number of times used today\u003cbr\u003e\u003cbr\u003e- You may only ask 1 question per successful check\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eRules for Questions:\u003cbr\u003e\u003cbr\u003e- Must be phrased in a Yes\u002fNo format\u003cbr\u003e    \u003cbr\u003e- Must be genuinely introspective or spiritually oriented (not \"What\u2019s 2+2?\")\u003cbr\u003e    \u003cbr\u003e- The answer comes as a sensation, not a sound:\u003cbr\u003e    \u003cbr\u003e    - No Blub = YES\u003cbr\u003e        \u003cbr\u003e    - Blub = NO\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e&gt; (The GM determines the answer truthfully, according to what the goldfish would know spiritually.)\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf00 Enhancements \u002f Level Ups\u003cbr\u003e\u003cbr\u003eAs the Goldfish Priest deepens their connection, the ability can evolve:\u003cbr\u003e\u003cbr\u003e\ud83c\udf2c\ufe0f Level 2 \u2013 Ripple Reading\u003cbr\u003e\u003cbr\u003eOn a successful check, the priest can ask 2 yes\u002fno questions in a single ritual.\u003cbr\u003e\u003cbr\u003e\ud83c\udf0a Level 3 \u2013 Spirit Echo Clarity\u003cbr\u003e\u003cbr\u003eOnce per day, the priest can automatically succeed on the check and get a brief vision or emotional impression along with the blub\u002fno-blub (GM\u2019s choice).\u003cbr\u003e\u003cbr\u003e\ud83c\udf90 Level 4 \u2013 Silent Chorus\u003cbr\u003e\u003cbr\u003eWhile meditating in a naturally silent location (e.g. Mirror Hollow), the priest can allow one other person to share the ritual and ask a question as well \u2014 but only the priest will \u201chear\u201d the answer.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udde9 Narrative Uses:\u003cbr\u003e\u003cbr\u003e- Discover hidden spiritual truths (\"Is there a spirit watching us?\")\u003cbr\u003e    \u003cbr\u003e- Test moral\u002fspiritual judgments (\"Did we choose the right path?\")\u003cbr\u003e    \u003cbr\u003e- Detect lies from other spirit beings (\"Is this spirit telling the truth?\")\u003cbr\u003e    \u003cbr\u003e- Feel for portals, veils, or corrupted energies (\"Is the balance broken here?\")\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdc Limerick #1 \u2013 \u201cThe Golden Scent\u201d\u003cbr\u003e\u003cbr\u003e&gt; A shimmer, a scent in the air,  \u003cbr\u003e&gt; From a gift left behind with great care.  \u003cbr\u003e&gt; Though humble its form,  \u003cbr\u003e&gt; It shifts spirit and norm,  \u003cbr\u003e&gt; And opens the veil with a prayer.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdc Limerick #2 \u2013 \u201cBlaze of the Blub\u201d\u003cbr\u003e\u003cbr\u003e&gt; When silence and stillness align,  \u003cbr\u003e&gt; And poop becomes truly divine,  \u003cbr\u003e&gt; Then burneth the gold,  \u003cbr\u003e&gt; For the pathways unfold,  \u003cbr\u003e&gt; And spirit and seeker entwine.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdc Limerick #3 \u2013 \u201cBurn, O Holy Pellet\u201d\u003cbr\u003e\u003cbr\u003e&gt; Burn, O holy pellet so faint,  \u003cbr\u003e&gt; Though most would dismiss with complaint,  \u003cbr\u003e&gt; It draws back the tide,  \u003cbr\u003e&gt; Where the shy fish doth hide,  \u003cbr\u003e&gt; In places the bold dare not paint.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdc Limerick #4 \u2013 \u201cThe Temple Fume\u201d\u003cbr\u003e\u003cbr\u003e&gt; When the fish leaves a mark on the floor,  \u003cbr\u003e&gt; Do not clean \u2014 it\u2019s a key to the door.  \u003cbr\u003e&gt; Light incense with care,  \u003cbr\u003e&gt; Let the spirit draw near,  \u003cbr\u003e&gt; And you'll swim where the world touches more.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udfad Usage in Game:\u003cbr\u003e\u003cbr\u003e- These can be used as ritual verses the character must recite while performing the incense ceremony.\u003cbr\u003e    \u003cbr\u003e- Master Anzu may only remember part of the limerick, and the players must recover missing lines.\u003cbr\u003e    \u003cbr\u003e- One limerick might be written in the margins of a water-damaged scroll, adding to the mystery.\u003cbr\u003e\u003cbr\u003eScene: before sunrise, smoky ruins of a cactus juice distillery. \u003cbr\u003e\u003cbr\u003eThe air is thick with dew, ash, and just a hint of fermented regret. Master Anzu, eyes wide and glistening, kneels over charred stone, holding up a soot-smudged scroll as the sunrise reflects in his watery eyes.\u003cbr\u003e\"...Do you smell that? Not the smoke. Not the fermented sin still clinging to the sand.  \u003cbr\u003eNo... it's the scent of secrets.  \u003cbr\u003e(he raises the scroll gently, reverently)  \u003cbr\u003eBuried beneath a vat of distilled foolishness... lay the truth.\u003cbr\u003e\u003cbr\u003e(clears throat)  \u003cbr\u003e'When the moon reflects with no moon to see,  \u003cbr\u003eAnd silence moves where sound should be,  \u003cbr\u003eThe swimmer glides in sacred hush\u2014  \u003cbr\u003eA ripple born from temple\u2019s blush.'\u003cbr\u003e\u003cbr\u003e(he pauses, the scroll trembles in his hands)  \u003cbr\u003eIt speaks of her. The One Between Currents.  \u003cbr\u003eNot just fable, not just fish.  \u003cbr\u003eThis text\u2014this... Scripture of the Silted Gills\u2014it was lost when the archives collapsed in the Flood of Tea. They said it was nonsense. Poetry.\u003cbr\u003e\u003cbr\u003eBut now\u2026 NOW\u2026!  \u003cbr\u003eBy the blessed bladder of the Desert Carp!  \u003cbr\u003eThis explosion\u2014this blessed, bubbling, bone-shaking boom\u2014has unearthed what no scholar would dare admit:\u003cbr\u003e\u003cbr\u003eThe goldfish was never gone. She was only waiting... for the distillery to ignite.\u003cbr\u003e\u003cbr\u003e(he looks around dramatically)  \u003cbr\u003eCall it fate. Call it fermentation.  \u003cbr\u003eBut this\u2026 this is providence.\"\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e\ud83c\udf49Glassfruit Watermelonsteamer\u003cbr\u003eMust be innitiated by a Earth or Waterbender and needs at least one level from each Elements Level. You can use Levels from up to two different Elements. \u003cbr\u003e\u003cbr\u003e&gt; A watermelon seed that needs to be watered to grow into a sphere of X meter radius that pushes everyone away and creates a Heavy sphere with X(Earthebending slot count double) Hitpoints. The watermelon is then quickly heated and the steam cooled down to heal every creature in a 5  X Meters cone from the watermelon with the steam 3  X Hitpoints \u003cbr\u003e- Effects: \u003cbr\u003e- Wall : \u003cbr\u003e\t- X(Earthebending slot count double) Hitpoints\u003cbr\u003e- Healing\u003cbr\u003e\t- 5  X Meters cone from the watermelon\u003cbr\u003e\t- 2  X(Water Counts double) Hitpoints Healing\u003cbr\u003e\t-\u003cbr\u003e\ud83c\udf4b Sunburst Nectarfield (Lemonseed)\u003cbr\u003e\u003cbr\u003eMust be initiated by a Fire or Water. Requires at least one Level from Fire and Air.  \u003cbr\u003eYou may use Levels from up to two Elements. Fire counts double.\u003cbr\u003e\u003cbr\u003e&gt; A lemon-shaped crystal is launched skyward, where it refracts the sunlight into a radiant bloom before one side sprays out hot liquid glassand one side shines a cleansing light. After a delay of 1 round, it explodes in midair with a flash that burns spirits and cleanses mortal ailments.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\u003cbr\u003e- Flashburst AoE\u003cbr\u003e    \u003cbr\u003e    - All enemies within X \u00d7 4 meters radius must succeed on INT Save (DC = 10 + X)\u003cbr\u003e        \u003cbr\u003e    - On fail: Blinded (1 round) + take Xd8 radiant damage\u003cbr\u003e        \u003cbr\u003e    - On success: Half damage, no blind\u003cbr\u003e        \u003cbr\u003e- Healing Burst (Allies only)\u003cbr\u003e    \u003cbr\u003e    - All allies in X \u00d7 5 meters are cured of one condition (blinded, frightened, charmed, etc.)\u003cbr\u003e        \u003cbr\u003e- X = Fire Slot \u00d7 Air Slot\u003cbr\u003e    \u003cbr\u003e    - Fire counts double\u003cbr\u003e        \u003cbr\u003e    - Max slots: 6 from Fire (counted as 12), 3 from Air\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf47 Cactusfruit  Bulb (Brambleseed)\u003cbr\u003e\u003cbr\u003eMust be initiated by an Earth or Fire. Requires at least one Level from Earth and Fire.  \u003cbr\u003eYou may use Levels from up to two Elements, but Earth counts double.\u003cbr\u003e\u003cbr\u003e&gt; A Cactusfruit-shaped glassfruit seed is planted in the ground and rapidly grows into a colossal crystalline maze that coils and shifts like a sentient trap.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\u003cbr\u003e- Create a Trap: \u003cbr\u003e    \u003cbr\u003e    - Radius: X \u00d7 2 meters\u003cbr\u003e        \u003cbr\u003e    - Duration: X rounds\u003cbr\u003e        \u003cbr\u003e    - Any enemy who enters or exits takes Xd6 slashing damage A the \u003cbr\u003e        \u003cbr\u003e    - Moving inside costs double movement\u003cbr\u003e        \u003cbr\u003e- Binding Roots:\u003cbr\u003e    \u003cbr\u003e    - 1 enemy of choice each round must succeed STR Save (DC = 10 + X) or be restrained by vine-arms from the wall\u003cbr\u003e        \u003cbr\u003e- X = Earth Slot \u00d7 Water Slot\u003cbr\u003e    \u003cbr\u003e    - Earth counts double\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd2e Prism Bloom Reflection Field (Clear Soulseed + Flashcore)\u003cbr\u003e\u003cbr\u003eMust be initiated by an Air or Firebender. Requires at least one Level from Spirit and Fire.  \u003cbr\u003eYou may use Levels from up to two Elements, but Spirit counts double.\u003cbr\u003e\u003cbr\u003e&gt; A flower of soul-glass blooms and begins refracting incoming energy \u2014 redirecting harmful bending and reflecting light into a calming aura.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\u003cbr\u003e- Mirror Ward (Ward HP = X \u00d7 8)\u003cbr\u003e    \u003cbr\u003e    - All elemental attacks against allies within X \u00d7 3 meters are redirected to the prism instead of their original target\u003cbr\u003e        \u003cbr\u003e    - Prism absorbs the damage until depleted\u003cbr\u003e        \u003cbr\u003e- Reflection Surge (1\u002fshort rest)\u003cbr\u003e    \u003cbr\u003e    - When Prism Bloom is destroyed, it releases a cone of refracted energy\u003cbr\u003e        \u003cbr\u003e    - All enemies in a 6 \u00d7 X meter cone take Xd10 radiant or bending-type damage, matching the last element absorbed\u003cbr\u003e        \u003cbr\u003e- X = Spirit Slot \u00d7 Fire or Air Slot\u003cbr\u003e    \u003cbr\u003e    - Spirit counts double\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf49 Watermelon Bastion Bomb (Updated Version)\u003cbr\u003e\u003cbr\u003eMust be initiated by an Earth or Waterbender. Needs at least one Level from each.  \u003cbr\u003eYou may use Levels from up to two Elements.\u003cbr\u003e\u003cbr\u003e- Earth counts double for the wall HP\u003cbr\u003e    \u003cbr\u003e- Water counts double for the healing effect\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\u003cbr\u003e- Push Sphere:\u003cbr\u003e    \u003cbr\u003e    - Grows into a crystal watermelon with a radius of X meters\u003cbr\u003e        \u003cbr\u003e    - All creatures within range must succeed on STR Save (DC = 10 + X) or be pushed back X meters\u003cbr\u003e        \u003cbr\u003e- Bastion Wall:\u003cbr\u003e    \u003cbr\u003e    - Leaves behind a hard shell with X \u00d7 2 (Earth Slots double) Hitpoints\u003cbr\u003e        \u003cbr\u003e- Healing Steam:\u003cbr\u003e    \u003cbr\u003e    - After heating and cooling, a cone of 5 \u00d7 X meters heals all allies for 3 \u00d7 X (Water Slots double) HP\u003cbr\u003e        \u003cbr\u003e- X = Earth Slot \u00d7 Water Slot\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udeb7 Want more?\u003cbr\u003e\u003cbr\u003eWould you like 1-2 more \u201cepic\u201d tier moves using triple-element requirements (e.g. Fire + Water + Air) or spiritual terrain effects next? I can also create a visual reference card or turn these into [[Glassfruit High Techniques for your Obsidian campaign folder.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLocation: Glassline canyon near Omashu\u2019s lower shell district \u2013 jagged cliffs, semi-wild Glassfruit groves, and an unstable spiritual resonance.\u003cbr\u003e\u003cbr\u003eSituation:  \u003cbr\u003eThe party seeks access to the Heart of Clarity (the ancient Resonance Stone), but they\u2019re intercepted by a Glassfang Vanguard Cell \u2014 loyal to the stone and sworn to protect it from those deemed \u201cunworthy\u201d or \u201cdisruptive.\u201d\u003cbr\u003e\u003cbr\u003eThe Glassfang benders are trained in Glassfruit Team-Up Techniques and immediately unleash synchronized bending using harvested seeds and sacred resonance tones.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udc65 Encounter Composition\u003cbr\u003e\u003cbr\u003e\ud83e\uddf1 Baezu \u2013 Earthbender (Initiator for Glassfruit seeds)\u003cbr\u003e\u003cbr\u003e- Tactical leader, chants in low harmonic tones\u003cbr\u003e    \u003cbr\u003e- Carries a pouch of clear Soulseeds\u003cbr\u003e    \u003cbr\u003e- Triggers Soulseed Harmonic Seal for massive battlefield control\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e\ud83d\udd25 Siroh \u2013 Firebender (Initiator for Inferno Bloom &amp; FlashLemon)\u003cbr\u003e\u003cbr\u003e- Aggressive and flashy, uses rapid Firebending katas\u003cbr\u003e    \u003cbr\u003e- Wears a red Glass mask\u003cbr\u003e    \u003cbr\u003e- Combo: Inferno Bloom followed by FlashLemon Refractor Beam to blind &amp; burn\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e\ud83d\udca8 Orhu \u2013 Airbender (Initiator for Resonant Collapse)\u003cbr\u003e\u003cbr\u003e- Agile, evasive, never touches the ground for long\u003cbr\u003e    \u003cbr\u003e- Keeps the party off-balance with shockwaves\u003cbr\u003e    \u003cbr\u003e- Uses Resonant Collapse to knock down and split the party\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e\ud83c\udf0a Luma \u2013 Waterbender (Initiator for BlueBerry Surge)\u003cbr\u003e\u003cbr\u003e- Calm and focused, wears a robe woven with mineral threads\u003cbr\u003e    \u003cbr\u003e- Traps frontline party members with BlueBerry Glass Surge\u003cbr\u003e    \u003cbr\u003e- Supports the others by locking down terrain\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf00 Opening Round (Round 1)\u003cbr\u003e\u003cbr\u003e- Luma (2 slots) + Baezu (3 slots):  \u003cbr\u003e    \u2192 X = 6  \u003cbr\u003e    \u2192 BlueBerry Glass Surge immobilizes frontliners (DC 12 Dex save)\u003cbr\u003e    \u003cbr\u003e- Siroh (3 slots) + Orhu (2 slots):  \u003cbr\u003e    \u2192 X = 6  \u003cbr\u003e    \u2192 Inferno Bloom explodes near ranged party members (6d6 damage, 12m radius)\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\u2604\ufe0f Round 2\u003cbr\u003e\u003cbr\u003e- Baezu (3 slots) + Siroh (4 slots):  \u003cbr\u003e    \u2192 X = 12  \u003cbr\u003e    \u2192 FlashLemon Refractor Beam (24m cone)\u003cbr\u003e    \u003cbr\u003e    - One party member takes 12d8 radiant\u003cbr\u003e        \u003cbr\u003e    - Others must make DC 24 INT save or be blinded 1 round, with disadvantage on Perception for 4 turns\u003cbr\u003e        \u003cbr\u003e- Orhu (3 slots) + Luma (2 slots):  \u003cbr\u003e    \u2192 X = 6  \u003cbr\u003e    \u2192 Resonant Collapse targeting remaining melee fighters\u003cbr\u003e    \u003cbr\u003e    - DC 12 CON save or fall prone and take 6d8 thunder\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udee1\ufe0f Round 3 (Defensive Phase)\u003cbr\u003e\u003cbr\u003e- Baezu (3 slots) + Orhu (2 slots):  \u003cbr\u003e    \u2192 X = 6  \u003cbr\u003e    \u2192 Soulseed Harmonic Seal\u003cbr\u003e    \u003cbr\u003e    - Grants 60 points of General Armor to the whole Glassfang squad within LoS\u003cbr\u003e        \u003cbr\u003e- Terrain now features:\u003cbr\u003e    \u003cbr\u003e    - Burning shards (Inferno)\u003cbr\u003e        \u003cbr\u003e    - Difficult ground (Sound)\u003cbr\u003e        \u003cbr\u003e    - Glassline vines (BlueBerry)\u003cbr\u003e        \u003cbr\u003e    - Blinding sun-beam points (FlashLemon)\u003cbr\u003e        \u003cbr\u003e    - Resonating vibration field (Soulseed)\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udde0 Strategy Notes\u003cbr\u003e\u003cbr\u003e- The Glassfangs target coordination: knockdown, blind, and trap to divide the party and set up overwhelming AoE combos.\u003cbr\u003e    \u003cbr\u003e- They rotate initiators and conserve bending slots unless pressed.\u003cbr\u003e    \u003cbr\u003e- They treat Resonance Stone activation as a last resort \u2014 if they lose control, they may attempt to overcharge it, leading to a spirit backlash or geomantic anomaly.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\ude99 Rewards (Optional)\u003cbr\u003e\u003cbr\u003e- Glassfruit Seed Satchel: 1 of each type\u003cbr\u003e    \u003cbr\u003e- Glass Refractor Lens: Lets a bender \u201cstore\u201d a technique once\u002fday and release it later\u003cbr\u003e    \u003cbr\u003e- Glassfang Tuning Rod: Used to \u201cping\u201d the Resonance Stone for spiritual harmonization\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eBaezu \u2013 Earthbender Master of Resonance\u003cbr\u003e\u003cbr\u003eRole: Boss \u2013 Controller, Support, Spiritual Conduit  \u003cbr\u003eInitiates: \u26aa Soulseed Harmonic Seal, \ud83d\udfe2 BlueBerry Surge\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eStats\u003cbr\u003e\u003cbr\u003e- HP: 110\u003cbr\u003e    \u003cbr\u003e- Armor: 3\u003cbr\u003e    \u003cbr\u003e- Earthbending Level: 7\u003cbr\u003e    \u003cbr\u003e- Speed: Slow 4m\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eactions per Round: 2 (Legendary Bender)\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAbilities\u003cbr\u003e\u003cbr\u003e\u25aa\ufe0f Earth Anchor (Passive)\u003cbr\u003e\u003cbr\u003eCannot be forcibly moved or knocked prone while touching stone. \u003cbr\u003eHas advantage on Concentration Checks\u003cbr\u003e\u003cbr\u003e\u25aa\ufe0f Seismic Meditation (Bonus Action)\u003cbr\u003e\u003cbr\u003eRegain 1 bending slot if standing still for the round.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eTechniques\u003cbr\u003eGlassfruit Seed Mechanics\u003cbr\u003e\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e\u270b Harmonic Command (Support)\u003cbr\u003e\u003cbr\u003eBonus Action: another Crystalfang bender may immediately act using 1 technique as a Reaction\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd25 Siroh \u2013 Firebender Glassforger\u003cbr\u003e\u003cbr\u003eRole: Blaster, AoE Control  \u003cbr\u003eInitiates: \ud83d\udd34 Inferno Bloom, \ud83d\udfe1 FlashLemon Beam\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eStats\u003cbr\u003e\u003cbr\u003e- HP: 60\u003cbr\u003e    \u003cbr\u003e- Armor: 1\u003cbr\u003e    \u003cbr\u003e- Chi Slots: 4\u003cbr\u003e    \u003cbr\u003e- Speed: Normal\u003cbr\u003e    \u003cbr\u003e- Weaknesses: Cold, Waterbending\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eBending Slots: 3\u003cbr\u003e\u003cbr\u003eactions per Round: 1\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAbilities\u003cbr\u003e\u003cbr\u003e\u25aa\ufe0f Overheat Spark (Passive)\u003cbr\u003e\u003cbr\u003eWhen using a Fire-based team-up, add +1 to total X\u003cbr\u003e\u003cbr\u003e\u25aa\ufe0f Flashcore Mantle (1x\u002fday)\u003cbr\u003e\u003cbr\u003eCreate a cloak of glowin
