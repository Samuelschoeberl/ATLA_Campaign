cbr\u003e| 2       | Level 1                                                         | 2 Slots from Level 1                                                                                                                                               |\u003cbr\u003e| 3       | Level 1, Level 2                                                | 4 Slots (3 from Level 1, 1 from Level 2)                                                                                                                           |\u003cbr\u003e| 4       | Level 1, Level 2                                                | 6 Slots (4 from Level 1, 2 from Level 2)                                                                                                                           |\u003cbr\u003e| 5       | Level 1, Level 2, Level 3                                       | 9 Slots (5 from Level 1, 3 from Level 2, 1 from Level 3)                                          ...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003eFor each Level:\u003cbr\u003e-1 Attack Roll\u003cbr\u003e-1 Firebending DC\u003cbr\u003e+2 Damage\u003cbr\u003e\u003cbr\u003eFirebenders draw power from passion, heat, and intensity. Stress is both a resource and a danger: it fuels more powerful techniques, but too much leaves a bender unstable and at risk of losing control. The following rules convert narrative stress into a simple mechanical resource for firebending moves.\u003cbr\u003e\u003cbr\u003eWhen do you gain Stress Level:\u003cbr\u003e- For every 10 damage you take you take 1 Stress Level\u003cbr\u003e- For every Firebending Slot used in a Damaging Move\u003cbr\u003eWhen you loose Stress Level:\u003cbr\u003e- 1 Stress Level after every turn\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Stress Level --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u251c\u2500\u2500 createnpc.py\u003cbr\u003e  \u251c\u2500\u2500 createpc.py\u003cbr\u003e  \u2514 cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eLevel 3\u003cbr\u003e\u003cbr\u003e  - Range: 3  Firebending Slot meters.\u003cbr\u003e  - Duration: 2 rounds Concentration.\u003cbr\u003e  - Create a mirage of heat, imposing disadvantage on attack rolls against creatures within a 10-foot radius of a point you choose.\u003cbr\u003eFirebending\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSpecial Attacks\u003cbr\u003eReaction: Must be initiated by a Firebender in line of sight \u003cbr\u003eLevel 1\u003cbr\u003eLingering Effect\u003cbr\u003e\u003cbr\u003eFocused light is amplified by mirrored shards into a blinding beam.\u003cbr\u003e- Effect: \u003cbr\u003e- Range: 10X meter radius Sphere\u003cbr\u003e- Effect: \u003cbr\u003e\t- Targets in area must make  a DC X  2 Int save to shield or close their eyes or be Blinded for one turn\u003cbr\u003e\t-  If X \u2265 10, Deal Xd4 radiant damage to all creatures in the area\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eTeam-up Moves\u003cbr\u003eEarthbending\u003cbr\u003eFirebending\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eGlassfruit Team-Up Techniques \u003cbr\u003e\u003cbr\u003eX = yz\u003cbr\u003e\u003cbr\u003e-  are the number of bending slots contributed by each bender.\u003cbr\u003e    \u003cbr\u003e- This rewards balanced team effort over just one person dumping points.\u003cbr\u003e    \u003cbr\u003e-X = y \u00d7 z.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e&gt; Example:\u003cbr\u003e&gt; \u003cbr\u003e&gt; - Earthbender contributes 2 slots (y = 2)\u003cbr\u003e&gt;     \u003cbr\u003e&gt; - Firebender contributes 3 (z = 3)\u003cbr\u003e&gt;     \u2192 X = 2 \u00d7 3 = 6\u003cbr\u003e\u003cbr\u003eThese are powerful, multi-element, terrain-altering moves that consume Glassfruit Seeds. Each scales based on X and has different effects depending on the seed used.\u003cbr\u003e\u003cbr\u003eEarthbending \u003cbr\u003eAirbending\u003cbr\u003eWaterbending\u003cbr\u003eFirebending\u003cbr\u003eTeam-up Moves\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSpecial Attacks\u003cbr\u003eReaction: Must be initiated by a Firebender in line of sight \u003cbr\u003eLevel 1\u003cbr\u003eLingering Effect\u003cbr\u003e\u003cbr\u003e- Range: 2X meter radius Sphere\u003cbr\u003e\u003cbr\u003e- Effect: Explosion in an area, dealing Xd6  bludgeoning + half fire damage\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eTeam-up Moves\u003cbr\u003eEarthbending\u003cbr\u003eFirebending\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSpecial Attacks\u003cbr\u003eReaction: Must be initiated by a Earthbender in line of sight \u003cbr\u003eLevel 1\u003cbr\u003eLingering Effect\u003cbr\u003eConcentration\u003cbr\u003e\u003cbr\u003e- Range: within line of sight up to 100 meter\u003cbr\u003e- Duration: Lasts until stopped concentrating or for 1 hour.\u003cbr\u003e\u003cbr\u003e- Effect: \u003cbr\u003e\t- As the air vibrates with a cleansing energy as creatures of your choice within radius gain 10  X General Armor\u003cbr\u003e\t- If X \u2265 15, the seal also protects against being Immobilised  \u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eTeam-up Moves\u003cbr\u003eEarthbending\u003cbr\u003eFirebending\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eLevel 1\u003cbr\u003eStress Level\u003cbr\u003eDamaging Move\u003cbr\u003e\u003cbr\u003e  - Range: Melee\u003cbr\u003e  - Attack Roll: Attacks Firebending Slot times\u003cbr\u003e  - Damage: 1d6 + Strength Bludgeoning + 1d12 fire\u003cbr\u003e\u003cbr\u003eFirebending\u003cbr\u003eFirebending Move\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePlayers Part\u002fRules\u002fBending Rules\u002fSpirit\u002fSpiritbending Moves\u002fUtility\u002fUtility\u003cbr\u003eLevel 1\u003cbr\u003e\u003cbr\u003e- Range: Firebending DC meter\u003cbr\u003e- You manipulate a flame within range\u003cbr\u003e\u003cbr\u003eFirebending\u003cbr\u003eFirebending DC\u003cbr\u003eFirebending Move\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eLevel 1\u003cbr\u003e\u003cbr\u003e  - Range: 5  Firebending Slot meters.\u003cbr\u003e  - Damage:   Firebending Slot  1 d10 fire\u003cbr\u003e  - Attack Roll\u003cbr\u003e  - Unleash a burst of flames in a straight line, damaging one target\u003cbr\u003e\u003cbr\u003eFirebending\u003cbr\u003eDamaging Move\u003cbr\u003eFirebending Move\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSmoldering Focus\u003cbr\u003e\u003cbr\u003eUtility \u002f Support\u003cbr\u003eLevel: 1\u003cbr\u003eAdditional attributes: Stress-aware\u003cbr\u003e\u003cbr\u003e- Range: Self\u003cbr\u003e- Duration: Instant\u003cbr\u003e- Description: Calm your breath and focus heat into a small, steady kernel for control or precision.\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\u003cbr\u003e- Roll: Roll +firebending.\u003cbr\u003e- On a 10+: Reduce your Stress by 1. Choose one: +1 forward to your next firebending roll, or suppress a small fire for 1 minute.\u003cbr\u003e- On a 7\u20139: No stress change; gain +1 forward to your next firebending roll.\u003cbr\u003e- On a miss (6 or less): Gain +1 Stress and the GM introduces a small complication.\u003cbr\u003e\u003cbr\u003eFire\u003cbr\u003eFirebending Move\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eBonus Action\u003cbr\u003eLevel 2\u003cbr\u003eStress Level\u003cbr\u003e\u003cbr\u003e- Range: Self.\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e- Reduce your Stress Level by 2 Firebending Slot\u003cbr\u003e\u003cbr\u003eFirebending\u003cbr\u003eFirebending Move\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eStress Level\u003cbr\u003eLevel 2\u003cbr\u003e\u003cbr\u003e- Range: Reach (whip-like stream) \u2014 single target or nearby cluster\u003cbr\u003e- Duration: Instant\u003cbr\u003e- Description: Strike with a whip-like stream of burning embers.\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\u003cbr\u003e- Roll: Roll +firebending.\u003cbr\u003e- On a 10+: Deal the move's base damage plus +1d6 fire damage per current Stress point (see Stress Level.md).\u003cbr\u003e- On a 7\u20139: Deal the base damage; choose one: push the target back one position, or add +1 damage die.\u003cbr\u003e- On a miss (6 or less): The attack fizzles; no damage and the GM may impose a minor complication.\u003cbr\u003e\u003cbr\u003eFire\u003cbr\u003eFirebending Move\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLingering Effect\u003cbr\u003eAction\u003cbr\u003e  - Range: 5  Firebending Slot meters. Sphere with a radius of Firebending Slot  1 meters.\u003cbr\u003e  - Damage: 2d6 fire per Firebending Slot.\u003cbr\u003e  - Save: Dex DC against your  Firebending DC \u003cbr\u003e  - Create a fiery explosion at a target point, affecting all creatures within a 10-foot radius.\u003cbr\u003e\u003cbr\u003eLingering Effect\u003cbr\u003e\u003cbr\u003eFirebending\u003cbr\u003eFirebending Move\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eLingering Effect\u003cbr\u003eLevel 2\u003cbr\u003e\u003cbr\u003e  - Range: 1  Firebending Slot meters.\u003cbr\u003e  - Damage: Firebending Slot 2d8 fire.\u003cbr\u003e  - Attack Roll\u003cbr\u003e  - Release multiple smaller blasts of fire in quick succession, targeting up to three creatures within range.\u003cbr\u003e\u003cbr\u003eLingering Effect\u003cbr\u003e\u003cbr\u003eFirebending\u003cbr\u003eFirebending Move\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eBonus Action\u003cbr\u003eLevel 2\u003cbr\u003eLingering Effect\u003cbr\u003eFirebending DC\u003cbr\u003e\u003cbr\u003e  - Range: 2 Firebending Slot meter Cone.\u003cbr\u003e  - Damage: 4  Firebending Slot d6 fire.\u003cbr\u003e- Effect: \u003cbr\u003e\t- Dexterity saving thow against your Firebending DC or take Damage\u003cbr\u003e\u003cbr\u003e  - Unleash a wide wave of flames\u003cbr\u003e  \u003cbr\u003eLingering Effect\u003cbr\u003e\u003cbr\u003eFirebending DC\u003cbr\u003eFirebending\u003cbr\u003eFirebending Move\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eBonus Action\u003cbr\u003eLevel 3\u003cbr\u003eStress Level\u003cbr\u003e\u003cbr\u003e- Range: Self.\u003cbr\u003e- Duration: until the beginning of your next turn\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e- Increase your Stress Level by 2 Firebending Slot\u003cbr\u003e\u003cbr\u003eElement\u003cbr\u003e\u003cbr\u003efirebending #level3\u003cbr\u003e\u003cbr\u003e- Rage Fuel\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: 3 rounds. Concentration.\u003cbr\u003e  - Transform your stress penalty into a bonus. Gain +1 to accuracy and damage rolls for every stress point. At the end, stress resets to 0.\u003cbr\u003eFirebending\u003cbr\u003eFirebending Move\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eScorching Aura\u003cbr\u003efirebending #level3\u003cbr\u003e\u003cbr\u003e- Scorching Aura\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: 3 rounds.\u003cbr\u003e  - Creatures within 5 feet of you take 1d6 fire damage at the start of their turn.\u003cbr\u003eFirebending\u003cbr\u003eFirebending Move\u003c\u002fspan\u003e"],"ids":["Character Sheet.md","\u002f","Rules\u002fBending Rules\u002f","Rules\u002fBending Rules\u002fFire\u002f","Rules\u002fBending Rules\u002fFire\u002fFirebending Moves\u002f","Rules\u002fBending Rules\u002fFire\u002fMechanics\u002f","Rules\u002fBend
