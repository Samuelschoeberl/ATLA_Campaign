isma       | 0       |\u003cbr\u003e+----------------+---------+\u003cbr\u003e\u003cbr\u003eBending Levels\u003cbr\u003eTABLE:\u003cbr\u003e+-----------------------+---------+---------+----+\u003cbr\u003e| Element               | Level   | Notes   |    |\u003cbr\u003e+-----------------------+---------+---------+----+\u003cbr\u003e| Airbending Level      | 0       |         |    |\u003cbr\u003e| Waterbending Level    | 0       |         |    |\u003cbr\u003e| Earthbending Level    | 0       |         |    |\u003cbr\u003e| Firebending Level     | 0       |         |    |\u003cbr\u003e| Spiritbending Level   | 0       |         |    |\u003cbr\u003e+-----------------------+---------+---------+----+\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCharacter Summary\u003cbr\u003e\u003cbr\u003eRace:  \u003cbr\u003eSpirit-with-human Shapeshifting Form\u003cbr\u003e\u003cbr\u003eClass:  \u003cbr\u003eAir Spirit\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBackstory:  \u003cbr\u003eOnce a small spirit living among the Air Nomads, I helped them forage, offering guidance and protection in their peaceful, nature-centered life. But when the spirit doors closed, I was trapped in the Spirit World, separated from the humans I cared for.\u003cbr\u003e\u003cbr\u003eAfter countless years, I found a way to cross back through an abandoned Air Nomad temple. When I arrived, I was shocked to see how much the world had changed\u2014machines, bending powers, and humans who no longer lived in harmony with nature.\u003cbr\u003e\u003cbr\u003eConfused and fascinated, I wander this unfamiliar world, trying to understand what has happened and how I can help again.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eShapeshifting Forms\u003cbr\u003e\u003cbr\u003e- Exiting the Forms:  \u003cbr\u003e    Transformations end early if the form\u2019s HP is reduced to 0 or voluntarily dropped. Remaining damage spills over to the character\u2019s normal HP. \u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Armor\u003cbr\u003e- Strength\u003cbr\u003e- Transformation Points\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAirbending #transformation\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003eYou have your CL  2  amount of Transformation Points\u003cbr\u003e\u003cbr\u003etransformation\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Transformation Points --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u251c\u2500\u2500 graphs\u003cbr\u003e          \u2514\u2500\u2500 Players Partwikigraphtreemap.html\u003cbr\u003e      \u251c\u2500\u2500 PCs\u003cbr\u003e          \u2514\u2500\u2500 Mahogany\u003cbr\u003e              \u251c\u2500\u2500 Mahogany.md\u003cbr\u003e              \u2514\u2500\u2500 Shapeshifting Forms\u003cbr\u003e                  \u251c\u2500\u2500 Level 1\u003cbr\u003e                      \u2514\u2500\u2500 Flying Lemur Form.md\u003cbr\u003e                  \u2514\u2500\u2500 Level 2\u003cbr\u003e                      \u2514\u2500\u2500 Luma\u2019tik.md\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Spirit\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending Moves\u003cbr\u003e                      \u2514\u2500\u2500 Level 1\u003cbr\u003e                          \u2514\u2500\u2500 Shapeshifting.md\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u003c\u002fspan\u003e","","","","","","","","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eFlying Lemur Form\u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003eTABLE:\u003cbr\u003e+----------------------+----------+\u003cbr\u003e| Stat                 | Value    |\u003cbr\u003e+----------------------+----------+\u003cbr\u003e| Strength (STR)       | 6 (-2)   |\u003cbr\u003e| Dexterity (DEX)      | 24(+7)   |\u003cbr\u003e| Constitution (CON)   | 7 (-2)   |\u003cbr\u003e| Wisdom(WIS)          | 14(+2)   |\u003cbr\u003e| Intelligence(Int)    | 8(-1)    |\u003cbr\u003e+----------------------+----------+\u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003e- Size: Small\u003cbr\u003e    \u003cbr\u003e- Movement:\u003cbr\u003e    - Fly 20 m (highly maneuverable).\u003cbr\u003e    - Climb 20 m (adapted to vertical movement).\u003cbr\u003e- Abilities in Flying Lemur Form:\u003cbr\u003e\u003cbr\u003e    - Silent Glide: Advantage on Stealth checks while flying.\u003cbr\u003e    - Acute Senses: Advantage on Perception checks that rely on sight or hearing.\u003cbr\u003e    - Quick Escape: Disengage or dash as a Bonus Action.\u003cbr\u003e- Combat Stats (Flying Lemur):\u003cbr\u003e    \u003cbr\u003e    - Evasion: 20\u003cbr\u003e    - HP: 6 (fragile but evasive).\u003cbr\u003e    - Attacks:\u003cbr\u003e        - Razor Claws: Melee Weapon Attack, d20 + Dex to hit, 1d4 slashing damage.\u003cbr\u003e- Uses:  \u003cbr\u003e    Perfect for scouting, infiltration, or swift movement through difficult terrain. The form allows quick evasion and small-scale reconnaissance.\u003cbr\u003e\u003cbr\u003eBending Slots:\u003cbr\u003e\tAir Lvl1: 4\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eBearturtle.webp#### Bearturtle Form (Protection\u002fDefense Form)\u003cbr\u003e- Size: Medium\u003cbr\u003e- On Transform:\u003cbr\u003e\t- Defensive Presence: Allies within 5 meter gain +3 to their AC until you Form Drops.\u003cbr\u003eTABLE:\u003cbr\u003e+----------------------+-----------+\u003cbr\u003e| Stat                 | Value     |\u003cbr\u003e+----------------------+-----------+\u003cbr\u003e| Strength (STR)       | 22 (+6)   |\u003cbr\u003e| Dexterity (DEX)      | 2 (-4)    |\u003cbr\u003e| Constitution (CON)   | 24 (+7)   |\u003cbr\u003e| Wisdom(WIS)          | 10(+0)    |\u003cbr\u003e| Intelligence(Int)    | 8(-1)     |\u003cbr\u003e+----------------------+-----------+\u003cbr\u003e\u003cbr\u003e- Movement:\u003cbr\u003e    \u003cbr\u003e    - Walk 20 meter.\u003cbr\u003e    - Swim 10 meter\u003cbr\u003e\u003cbr\u003e- Abilities in Bearturtle Form:\u003cbr\u003e    - Shell Shield:\u003cbr\u003e\t    - Reaction\u003cbr\u003e\t        When an ally within 3 meter is attacked, impose Disadvantage on the attack roll as you shift to protect them with your shell. Can be used 3 times per long rest.\u003cbr\u003e\t    Tuck in: \u003cbr\u003e\t    - Reaction\u003cbr\u003e\t\t    When you fail a dexterity saving throw you still only take half damage. Your Movement in the next round is halved.\u003cbr\u003e\u003cbr\u003e    - Sturdy Form:\u003cbr\u003e\t    - You have Advantage on saving throws against being knocked prone or moved against your will.\u003cbr\u003e    -\u003cbr\u003e    - \u003cbr\u003e- Combat Stats (Bearturtle):\u003cbr\u003e    \u003cbr\u003e    - Evasion: 15\u003cbr\u003e    - \u003cbr\u003e    - Armor: \u003cbr\u003e\t    - 5 Physical Armor\u003cbr\u003e\t    - 3 General Armor\u003cbr\u003e    - HP: 28.\u003cbr\u003e    - Attacks:\u003cbr\u003e        - Powerful Swipe: Melee Weapon Attack, +Strength to hit, 2d6 + Str slashing damage.\u003cbr\u003e\t- Shell Slam (AOE): All creatures within a 1 meter radius must make a Dexterity save DC17 or take 2d8 bludgeoning damage.\u003cbr\u003e\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e    \u003cbr\u003eBending Slots:\u003cbr\u003e\tFire Lvl1: 2\u003cbr\u003e\tEarth Lvl1: 1\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eName: Luma\u2019tik \u2014 Glimmerkin of Cracked Mirrors  \u003cbr\u003eType: Lesser Spirit  \u003cbr\u003eDomain: Light, Trickery  \u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003eElement Level:\u003cbr\u003e\tFirebending: Level 2 \u003cbr\u003e\tEarthbending: Level 1\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003eLuma'tik.png\u003cbr\u003e- Size: Small\u003cbr\u003eTABLE:\u003cbr\u003e+----------------------+-----------+\u003cbr\u003e| Stat                 | Value     |\u003cbr\u003e+----------------------+-----------+\u003cbr\u003e| Strength (STR)       | 4 (-3)    |\u003cbr\u003e| Dexterity (DEX)      | 16 (+3)   |\u003cbr\u003e| Constitution (CON)   | 12 (+1)   |\u003cbr\u003e| Wisdom(WIS)          | 10(+0)    |\u003cbr\u003e| Intelligence(Int)    | 8(-1)     |\u003cbr\u003e+----------------------+-----------+\u003cbr\u003e\u003cbr\u003e- Ideal for infiltration, distraction, and sensory manipulation. Luma\u2019tik thrives in urban or crystal-laced environments, using its shimmering form and illusions to mislead enemies and aid allies from the shadows. Though not powerful in direct combat, it\u2019s difficult to pin down and annoying to deal with.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMovement:\u003cbr\u003e\u003cbr\u003e- Fly 15 m (hovering, effortless, emits no sound).\u003cbr\u003e    \u003cbr\u003e- Climb 10 m (can scale smooth surfaces with reflective qualities).\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAbilities in Luma\u2019tik Form:\u003cbr\u003e\u003cbr\u003e- Refraction Veil: While in bright or shifting light, Luma\u2019tik gains advantage on Stealth and cannot be targeted by opportunity attacks. This effect ends if Luma\u2019tik is in total darkness or complete silence.\u003cbr\u003e    \u003cbr\u003e- Mirage Flicker (1\u002fShort Rest): As a Bonus Action, Luma\u2019tik can create up to two illusionary duplicates for 1 minute. Each duplicate mimics its movements and grants attackers disadvantage on attack rolls until they hit Luma\u2019tik.\u003cbr\u003e    \u003cbr\u003e    \u003cbr\u003e- Glimmerjump: \u003cbr\u003e- Reaction:\u003cbr\u003e\tteleport to any point within 20 m that is brightly lit or reflects light (e.g., mirrors, water, crystal surfaces)\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCombat Stats:\u003cbr\u003e\u003cbr\u003e- Evasion: 17\u003cbr\u003e    \u003cbr\u003e- HP: 21 (fragile, relies on mobility and illusions)\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eSpecial Attacks:\u003cbr\u003e\u003cbr\u003e- Sparkbite: Melee Weapon Attack, Physical Attack Roll to hit, 1d6 piercing and 1d4 radiant damage. If attacking from stealth, deals an extra 1d4 radiant damage.\u003cbr\u003e    \u003cbr\u003e- Lightshard Dart: Ranged Attack, Attack Roll(Fire) to hit, 1d6 radiant damage. On hit, target has disadvantage on Perception checks for 1 minute.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLuma\u2019tik is a playful, capricious entity\u2014often found dancing between fractured crystal surfaces or taunting intruders with flickers of light and laughter. Bonding with this spirit gives a bender or spiritualist access to stealth, misdirection, and flash-based utility, ideal for scouts or cunning tacticians.\u003cbr\u003e\u003cbr\u003e---\u003c\u002fspan\u003e","","","","","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYour Airbending Level.\u003c\u002fspan\u003e","","","","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYour Waterbending Level.\u003cbr\u003eWaterbending\u003c\u002fspan\u003e"],"textfont":{"size":12},"texttemplate":"%{label}\u003cbr\u003e%{text}\u003cextra\u003e\u003c\u002fextra\u003e","values":[672,1057,862,8089,65,5432,1,1,65,1,1,1254,1254,4177,1585,2592,65,22,1,1,41,22,22,1,1,1,1,41,41],"type":"treemap"}],                        {"template":{"data":{"histogram2dcontour":[{"type":"histogram2dcontour","colorbar":{"outlinewidth":0,"ticks":""},"colorscale":[[0.0,"#0d0887"],[0.1111111111111111,"#46039f"],[0.2222222222222222,"#7201a8"],[0.3333333333333333,"#9c179e"],[0.4444444444444444,"#bd3786"],[0.5555555555555556,"#d8576
