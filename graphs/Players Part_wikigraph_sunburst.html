        <script charset="utf-8" src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>                <div id="6673c5db-8a6a-43c4-a6a1-e3d00a5fa128" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script type="text/javascript">                                    window.PLOTLYENV=window.PLOTLYENV || {};                                    if (document.getElementById("6673c5db-8a6a-43c4-a6a1-e3d00a5fa128")) {                    Plotly.newPlot(                        "6673c5db-8a6a-43c4-a6a1-e3d00a5fa128",                        [{"branchvalues":"total","hovertemplate":"%{label}\u003cbr\u003e%{hovertext}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eName: Players Part\u003cbr\u003e\u003cbr\u003eCore Stats\u003cbr\u003eTABLE:\u003cbr\u003e+----------------+---------+\u003cbr\u003e| Stat           | Value   |\u003cbr\u003e+----------------+---------+\u003cbr\u003e| Strength       | 0       |\u003cbr\u003e| Dexterity      | 0       |\u003cbr\u003e| Constitution   | 0       |\u003cbr\u003e| Intelligence   | 0       |\u003cbr\u003e| Wisdom         | 0       |\u003cbr\u003e| Charisma       | 0       |\u003cbr\u003e+----------------+---------+\u003cbr\u003e\u003cbr\u003eBending Levels\u003cbr\u003eTABLE:\u003cbr\u003e+-----------------------+---------+---------+----+\u003cbr\u003e| Element               | Level   | Notes   |    |\u003cbr\u003e+-----------------------+---------+---------+----+\u003cbr\u003e| Airbending Level      | 0       |         |    |\u003cbr\u003e| Waterbending Level    | 0       |         |    |\u003cbr\u003e| Earthbending Level    | 0       |         |    |\u003cbr\u003e| Firebending Level     | 0       |         |    |\u003cbr\u003e| Spiritbending Level   | 0       |         |    |\u003cbr\u003e+-----------------------+---------+---------+----+\u003c\u002fspan\u003e","","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOrganisations\u003cbr\u003eOverview:\u003cbr\u003e\u003cbr\u003eThe Lotus is a venerable organization dedicated to the balance of the world, acting as spiritual guides and protectors of harmony. They host the annual Ceremony of the Resonance, symbolizing their commitment to unity among benders.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eUniform Design:\u003cbr\u003e\u003cbr\u003e- Colors:  \u003cbr\u003e    White and gold, symbolizing purity and enlightenment, with accents of light blue to represent spiritual connection.\u003cbr\u003e    \u003cbr\u003e- Style:\u003cbr\u003e    \u003cbr\u003e    - Flowing robes for spiritual leaders, with a lotus emblem embroidered on the chest.\u003cbr\u003e    - Soldiers wear sturdy uniforms with plated armor on shoulders and bracers, designed for mobility and defense.\u003cbr\u003e- Details:\u003cbr\u003e    \u003cbr\u003e    - A sash or belt with a lotus motif, denoting rank.\u003cbr\u003e    - Masks for combat troops, styled after serene and neutral faces, emphasizing their role as impartial protectors.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Mistress Akira Meiyu\u003cbr\u003e- Armor\u003cbr\u003e- Strength\u003cbr\u003e- Stonewarden Garon\u003cbr\u003e- Wisdom\u003cbr\u003e- Grandmaster Iroh Tanaka\u003cbr\u003e- The Lotus\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eFirebending\u003cbr\u003eWaterbending\u003c\u002fspan\u003e","","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e\u00a71 This is all fun and games.\u003cbr\u003e\t\u00a71.1 For many people (including the author :D) a big part of the fun is the improv theater roleplaying in TTRPGs. \u003cbr\u003e\tSome people like the Characterbuilding and creating a personality and fleshed out character how they imagine it. Both are valid but it needs to be communicated that i want to keep it generally in a very \"yes and...\" kind of style but always accept a \"no id rather have it like...\".\u003cbr\u003e\t\t1.1.1 That being said this also applies to world building and lore so feel free to worldbuild yourself a bit either spontanously during roleplay or planned out for bigger worldbuilding projects (e.g. \"I had an idea for a watertribe that uses plantbending algae as boats for their lake\"(and discussed with the GM)).\u003cbr\u003e\u003cbr\u003e\u00a72 I will try my best to nerve and buff bending moves how i think fits best. \u003cbr\u003e\t2.1 This may also include giving them more roleplaying opportunities to find bending teachers or similar to acquire new skills and bending Moves.\u003cbr\u003e\u003cbr\u003e\u00a73 I'm trying some more experimental mechanics that may be fun for me but not so fun for others. So always accept constructive feedback and\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDefensive:\u003cbr\u003e\tMostly like DnD but Armor class is now called evasion and there is an Armor  for every kind of Damage (Damage Resistance) that reduces the damage taken per instance.\u003cbr\u003e\tThe Damage types will be the same as in Dnd\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Armor\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eHow hard it is to hit you\u003cbr\u003eBase Evasion: 10 + Dex + Airbending Level\u003c\u002fspan\u003e","These are attacks you only have under specific limited conditions or have to study from a master to learn.","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003ePROBABLY NEEDS REBALANCING ON THE GO ALL THE TIME\u003cbr\u003eJoining Moves:  \u003cbr\u003eBenders can combine their abilities to create more powerful or creative effects, guided by the \"rule of cool.\" This allows for dynamic and collaborative gameplay that rewards teamwork.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eConditions to Join:\u003cbr\u003e\u003cbr\u003e- Proximity: You must be within 10 feet of the ally initiating the Move.\u003cbr\u003e- Action Type: Joining the Move requires using your Reaction.\u003cbr\u003e- Move Compatibility: The same Move does not need to be performed at the same Level Slot as the initiating Bender.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEffect:  \u003cbr\u003eCombining Moves enhances their overall power or effect. For example, if an ally uses Fireburst, and you join in, the resulting effect could be strong enough to burst through a stone wall.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOptional Variant:  \u003cbr\u003eYou can also combine different Moves if you can explain how they interact. For instance:\u003cbr\u003e\u003cbr\u003e- A Mud Wall created by an Earthbender could be reinforced with an Ice Wall from a Waterbender, resulting in a sturdier barrier with sharp ice spike defenses.  \u003cbr\u003e    This opens opportunities for creative problem-solving and innovative combinations, adding depth to gameplay.\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Teamwork Moves --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u003c\u002fspan\u003e","","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCore Stats\u003cbr\u003eTABLE:\u003cbr\u003e+----------------+---------+--------+-------------------------+\u003cbr\u003e| Stat           | Value   | note   | Automatically updated   |\u003cbr\u003e+----------------+---------+--------+-------------------------+\u003cbr\u003e| Strength       | 4       |        | N                       |\u003cbr\u003e| Dexterity      | 2       |        | N                       |\u003cbr\u003e| Constitution   | 4       |        | N                       |\u003cbr\u003e| Intelligence   | 2       |        | N                       |\u003cbr\u003e| Wisdom         | 8       |        | N                       |\u003cbr\u003e| Charisma       | 5       |        | N                       |\u003cbr\u003e+------- ending Level    | 0       |                          |    |\u003cbr\u003e| Earthbending Level    | 10      |                          |    |\u003cbr\u003e| Firebending Level     | 0       |                          |    |\u003cbr\u003e| Spiritbending Level   | 0       | (Avatar Spirit Bridge)   |    |\u003cbr\u003e+-----------------------+---------+--------------------------+----+\u003cbr\u003e\u003cbr\u003eBending Slots\u003cbr\u003e\u003cbr\u003e- (auto-generate...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCharacter\u003cbr\u003e\u003cbr\u003e- Name: Ula\u003cbr\u003e    \u003cbr\u003e- Appearance:\u003cbr\u003e    \u003cbr\u003e    - Pale skin, faintly glowing purple hair due to crystal-paste dye.\u003cbr\u003e    - Mushroom-leather outfit with a toad-eye hood for tradition and identity.\u003cbr\u003e- Personality:\u003cbr\u003e    \u003cbr\u003e    - Determined, resourceful, and reverent toward the spirit.\u003cbr\u003e    - Nervous about interacting with the outside world.\u003cbr\u003e- Role:\u003cbr\u003e    \u003cbr\u003e    - Tasked with seeking a Spirit Bender to save Ch\u00e1nch\u00fa .\u003cbr\u003e    - Acts as the guide for the party to the Undersands Village .\u003cbr\u003e\u003cbr\u003eEquipment:\u003cbr\u003e\u003cbr\u003e- Crystals for lighting caves.\u003cbr\u003e- Hydration stones for water control and protection.\u003cbr\u003e\u003cbr\u003eLinks to Other Notes:\u003cbr\u003e\u003cbr\u003e- Ch\u00e1nch\u00fa \u003cbr\u003e- Undersands Village \u003cbr\u003e- Spirit Benders \u003cbr\u003e- Mushroom Leather Techniques \u003cbr\u003eNPC\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eRin Kotak.png\u003cbr\u003ehe\u002fhim\u003cbr\u003ePhysical Description:  \u003cbr\u003e        A tall, gaunt man with alabaster skin and wispy, shoulder-length white hair that seems to shift like mist in the wind. His gray eyes are perpetually half-lidded, giving him a detached, eerie demeanor. His flowing black robes ripple unnaturally, as if caught in a constant breeze. His soft-spoken voice carries an unsettling intensity.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Airbending with a dark twist\u2014manipulating sound waves to confuse and disorient enemies and bending the air around him to make him almost invisible.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAirbending\u003cbr\u003e\u003cbr\u003e\u201cThey call it balance. They say the Avatar brings peace. But I ask you\u2014what peace is built upon the whims of a single soul? One person, plucked from the cycle, anointed by spirits, wielding the fury of all four elements like a god among mortals. We kneel to them. We trust them. We fear them. We wait for them to fix what we cannot. But what happens when the Avatar fails? When they vanish? When they turn tyrant? No one should bear such power. And no one should have to live under it. Balance cannot come from a single hand\u2014it must rise from all of us, together. End the cycle. Let the world breathe free for once, without its so-called savior.\u201d\u003cbr\u003e\u003cbr\u003eInit:\u003cbr\u003ephot 21 \u003cbr\u003eRin Xolai 20 \u003cbr\u003eTapi 19\u003cbr\u003ePui 15\u003cbr\u003eIroh Tanaka 15\u003cbr\u003e\u003cbr\u003eRiu 14\u003cbr\u003eIsay Treksal 12\u003cbr\u003eStie 12\u003cbr\u003eAnju 12\u003cbr\u003eJin koga\u003cbr\u003eAkira Meiyu\u003cbr\u003e\u003cbr\u003eDAMAGE\u003cbr\u003e9\u003cbr\u003e\u003cbr\u003eNPC\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- Physical Description:  \u003cbr\u003e    A striking woman in her early forties with jet-black hair styled into an intricate braid that cascades down her back. Her pale blue eyes seem to pierce through her opponents, reflecting a sharp intellect and unshakable resolve. Her high cheekbones and angular features give her an almost regal appearance. She wears an ornate, high-collared cloak adorned with faintly glowing charms.\u003cbr\u003e- Bending Style:  \u003cbr\u003e    Waterbending focused on offensive techniques, including the manipulation of black mist\u2014a mixture of water vapor and fine particles, creating disorienting smoke.\u003cbr\u003e- Role:  \u003cbr\u003e    Charismatic leader and visionary behind the rebellion. Isay is a master tactician and inspiring orator.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003eNPC\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOrganisations\u003cbr\u003eOverview:\u003cbr\u003e\u003cbr\u003eThe Night Bloom is a radical faction seeking to overthrow the Avatar\u2019s influence, advocating for a world ruled collectively by elite benders. They view the Avatar as a relic of oppression and seek to reshape the spiritual and physical realms.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLeadership:\u003cbr\u003e\u003cbr\u003e1. Isay Trekal (she\u002fher) (Faction Leader)\u003cbr\u003e    \u003cbr\u003e    - Physical Description:  \u003cbr\u003e        A striking woman in her early forties with jet-black hair styled into an intricate braid that cascades down her back. Her pale blue eyes seem to pierce through her opponents, reflecting a sharp intellect and unshakable resolve. Her high cheekbones and angular features give her an almost regal appearance. She wears an ornate, high-collared cloak adorned with faintly glowing charms.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Waterbending focused on offensive techniques, including the manipulation of black mist\u2014a mixture of water vapor and fine particles, creating disorienting smoke.\u003cbr\u003e    - Role:  \u003cbr\u003e        Charismatic leader and visionary behind the rebellion. Isay is a master tactician and inspiring orator.\u003cbr\u003e2. Hanal Koga(she\u002fher) (Second-in-Command)\u003cbr\u003e    \u003cbr\u003e    - Physi s: Advantage on Perception checks that rely on sight or hearing.\u003cbr\u003e    - Quick Escape: Disengage or dash as a Bonus Action.\u003cbr\u003e- Combat Stats (Flying Lemur):\u003cbr\u003e    \u003cbr\u003e    - Evasion: 20\u003cbr\u003e    - HP: 6 (fragile but evasive).\u003cbr\u003e    - Attacks:\u003cbr\u003e        - Razor Claws: Melee Weapon Attack, d20 + Dex to hit, 1d4 slashing damage.\u003cbr\u003e- Uses:  \u003cbr\u003e    Perfect for scouting, infiltration, or swift movement through difficult terrain. The form allows quick evasion and small-scale reconnaissance.\u003cbr\u003e\u003cbr\u003eBending Slots:\u003cbr\u003e\tAir Lvl1: 4\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eBearturtle.webp#### Bearturtle Form (Protection\u002fDefense Form)\u003cbr\u003e- Size: Medium\u003cbr\u003e- On Transform:\u003cbr\u003e\t- Defensive Presence: Allies within 5 meter gain +3 to their AC until you Form Drops.\u003cbr\u003eTABLE:\u003cbr\u003e+----------------------+-----------+\u003cbr\u003e| Stat                 | Value     |\u003cbr\u003e+----------------------+-----------+\u003cbr\u003e| Strength (STR)       | 22 (+6)   |\u003cbr\u003e| Dexterity (DEX)      | 2 (-4)    |\u003cbr\u003e| Constitution (CON)   | 24 (+7)   |\u003cbr\u003e| Wisdom(WIS)          | 10(+0)    |\u003cbr\u003e| Intelligence(Int)    | 8(-1)     |\u003cbr\u003e+----------------------+-----------+\u003cbr\u003e\u003cbr\u003e- Movement:\u003cbr\u003e    \u003cbr\u003e    - Walk 20 meter.\u003cbr\u003e    - Swim 10 meter\u003cbr\u003e\u003cbr\u003e- Abilities in Bearturtle Form:\u003cbr\u003e    - Shell Shield:\u003cbr\u003e\t    - Reaction\u003cbr\u003e\t        When an ally within 3 meter is attacked, impose Disadvantage on the attack roll as you shift to protect them with your shell. Can be used 3 times per long rest.\u003cbr\u003e\t    Tuck in: \u003cbr\u003e\t    - Reaction\u003cbr\u003e\t\t    When you fail a dexterity saving throw you still on ced environments, using its shimmering form and illusions to mislead enemies and aid allies from the shadows. Though not powerful in direct combat, it\u2019s difficult to pin down and annoying to deal with.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMovement:\u003cbr\u003e\u003cbr\u003e- Fly 15 m (hovering, effortless, emits no sound).\u003cbr\u003e    \u003cbr\u003e- Climb 10 m (can scale smooth surfaces with reflective qualities).\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAbilities in Luma\u2019tik Form:\u003cbr\u003e\u003cbr\u003e- Refraction Veil: While in bright or shifting light, Luma\u2019tik gains advantage on Stealth and cannot be targeted by opportunity attacks. This effect ends if Luma\u2019tik is in total darkness or complete silence.\u003cbr\u003e    \u003cbr\u003e- Mirage Flicker (1\u002fShort Rest): As a Bonus Action, Luma\u2019tik can create up to two illusionary duplicates for 1 minute. Each duplicate mimics its movements and grants attackers disadvantage on attack rolls until they hit Luma\u2019tik.\u003cbr\u003e    \u003cbr\u003e    \u003cbr\u003e- Glimmerjump: \u003cbr\u003e- Reaction:\u003cbr\u003e\tteleport to any point within 20 m that is brightly lit or reflects light (e.g., mirrors, water, crystal surfaces)\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCombat Stats:\u003cbr\u003e\u003cbr\u003e- Evasion: 17\u003cbr\u003e    \u003cbr\u003e- HP: 21 (fragile, relies on mobility and illusions)\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e-...","","","","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eReaction\u003cbr\u003eRange: 3  Airbending Slot meters\u003cbr\u003eEffect:\u003cbr\u003eArea control technique that lets you push 2  Airbending Slot Creatures within a radius 1  Airbending Slot meters.\u003cbr\u003eAirbending\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e10 + Element Le                             |\u003cbr\u003e| 5       | Level 1, Level 2, Level 3                                       | 9 Slots (5 from Level 1, 3 from Level 2, 1 from Level 3)                                           ...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eMove or disperse most Lingering Damage effects\u003cbr\u003eAirbending\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eMovement \u003cbr\u003e\u003cbr\u003eMany Airbending techniques can boost movement\u003cbr\u003eAirbending\u003c\u002fspan\u003e","","","10 + Element Level","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eEarthbending Moves Progression Table\u003cbr\u003eTABLE:\u003cbr\u003e+---------+-----------------------------------------------------------------+--------------------------------------------------------------------------------------------------------------------------------------------------------------------+\u003cbr\u003e| Level   | Accessible Slots                                                | Total Moves (Newly Learned)                                                                                                                                        |\u003cbr\u003e+---------+-----------------------------------------------------------------+--------------------------------------------------------------------------------------------------------------------------------------------------------------------+\u003cbr\u003e| 1       | Level 1                                                         | 1 Slot from Level 1                                                                                                                                                |\u003cbr\u003e| 2       | Level 1                                                         | 2 Slots from Level 1                                                                                                                                               |\u003cbr\u003e| 3       | Level 1, Level 2                                                | 4 Slots (3 from Level 1, 1 from Level 2)                                                                                                                           |\u003cbr\u003e| 4       | Level 1, Level 2                                                | 6 Slots (4 from Level 1, 2 from Level 2)                                                                                                                           |\u003cbr\u003e| 5       | Level 1, Level 2, Level 3                                       | 9 Slots (5 from Level 1, 3 from Level 2, 1 from Level 3)                                         ...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview:\u003cbr\u003e\u003cbr\u003eEarthbenders are solid and steadfast, drawing upon the Strength of their bodies and the stability of the ground beneath them. Their techniques focus on defense, fortification, and manipulating terrain. Rather than relying on agility to avoid blows, earthbenders create barriers, raise armor ratings, and reinforce their allies. They harness Earth Charges to shape stone and metal, providing a constant, reliable source of defense and stability.\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e10 +Element Level - Stress Level\u003cbr\u003eFirebending\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eFirebending Slots Progression Table\u003cbr\u003eTABLE:\u003cbr\u003e+---------+-----------------------------------------------------------------+--------------------------------------------------------------------------------------------------------------------------------------------------------------------+\u003cbr\u003e| Level   | Accessible Slots                                                | Total Moves (Newly Learned)                                                                                                                                        |\u003cbr\u003e+---------+-----------------------------------------------------------------+--------------------------------------------------------------------------------------------------------------------------------------------------------------------+\u003cbr\u003e| 1       | Level 1                                                         | 1 Slot from Level 1                                                                                                                                                |\u003cbr\u003e| 2       | Level 1                                                         | 2 Slots from Level 1                                                                                                                                               |\u003cbr\u003e| 3       | Level 1, Level 2                                                | 4 Slots (3 from Level 1, 1 from Level 2)                                                                                                                           |\u003cbr\u003e| 4       | Level 1, Level 2                                                | 6 Slots (4 from Level 1, 2 from Level 2)                                                                                                                           |\u003cbr\u003e| 5       | Level 1, Level 2, Level 3                                       | 9 Slots (5 from Level 1, 3 from Level 2, 1 from Level 3)                                          ...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003eFor each Level:\u003cbr\u003e-1 Attack Roll\u003cbr\u003e-1 Firebending DC\u003cbr\u003e+2 Damage\u003cbr\u003e\u003cbr\u003eFirebenders draw power from passion, heat, and intensity. Stress is both a resource and a danger: it fuels more powerful techniques, but too much leaves a bender unstable and at risk of losing control. The following rules convert narrative stress into a simple mechanical resource for firebending moves.\u003cbr\u003e\u003cbr\u003eWhen do you gain Stress Level:\u003cbr\u003e- For every 10 damage you take you take 1 Stress Level\u003cbr\u003e- For every Firebending Slot used in a Damaging Move\u003cbr\u003eWhen you loose Stress Level:\u003cbr\u003e- 1 Stress Level after every turn\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Stress Level --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u251c\u2500\u2500 createnpc.py\u003cbr\u003e  \u251c\u2500\u2500 createpc.py\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u251c\u2500\u2500 PCs\u003cbr\u003e          \u251c\u2500\u2500 Airwatterbendertest\u003cbr\u003e              \u2514\u2500\u2500 Airwatterbendertest Character Sheet.md\u003cbr\u003e          \u251c\u2500\u2500 Anju\u003cbr\u003e              \u2514\u2500\u2500 Anju Character Sheet.md\u003cbr\u003e          \u251c\u2500\u2500 Spirittest\u003cbr\u003e              \u2514\u2500\u2500 Spirittest Character Sheet.md\u003cbr\u003e          \u251c\u2500\u2500 TestChar\u003cbr\u003e              \u2514\u2500\u2500 TestChar Character Sheet.md\u003cbr\u003e          \u251c\u2500\u2500 TestQuick\u003cbr\u003e              \u2514\u2500\u2500 TestQuick Character Sheet.md\u003cbr\u003e          \u2514\u2500\u2500 TmpTest\u003cbr\u003e              \u2514\u2500\u2500 TmpTest Character Sheet.md\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u251c\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Fire\u003cbr\u003e                  \u251c\u2500\u2500 Firebending Moves\u003cbr\u003e                      \u251c\u2500\u2500 Level 1\u003cbr\u003e                          \u2514\u2500\u2500 Burning Fists.md\u003cbr\u003e                      \u251c\u2500\u2500 Level 2\u003cbr\u003e                          \u251c\u2500\u2500 Breath Control.md\u003cbr\u003e                          \u2514\u2500\u2500 Emberlash.md\u003cbr\u003e                      \u251c\u2500\u2500 Level 3\u003cbr\u003e                          \u2514\u2500\u2500 Rage Fuel.md\u003cbr\u003e                      \u2514\u2500\u2500 Level 4\u003cbr\u003e                          \u2514\u2500\u2500 Seething Inferno.md\u003cbr\u003e                  \u2514\u2500\u2500 Mechanics\u003cbr\u003e                      \u2514\u2500\u2500 Firebending DC.md\u003cbr\u003e          \u2514\u2500\u2500 core rules\u003cbr\u003e              \u2514\u2500\u2500 Stat Shorts\u003cbr\u003e                  \u2514\u2500\u2500 Attack Roll Modifie...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003eAvatar Spirit Check\u003cbr\u003e\ud83c\udf0c Bridge of the Spirit: A Personal Journey\u003cbr\u003e\u003cbr\u003e&gt; \"To be the Avatar is not merely to bend all elements, but to bend one\u2019s self\u2014to align will and wisdom with the needs of the world.\"  \u003cbr\u003e&gt; \u2014 Grandmaster Shuyin of the White Lotus\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udded Reflecting on Your Journey\u003cbr\u003e\u003cbr\u003eEach character stands at a crossroads between spirit and self, and your progression in this campaign is deeply rooted in how your character emotionally and spiritually reacts to the events that unfold. Reflect on:\u003cbr\u003e\u003cbr\u003e- Have recent events hardened them? Are they acting with more recklessness, cruelty, or obsession to achieve their goals\u2014driven by trauma or ambition?\u003cbr\u003e    \u003cbr\u003e- Or have they found inner balance, perhaps discovering a renewed sense of duty or compassion, and beginning to understand the role of a bridge between the mortal and spiritual worlds?\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eThis reflection influences your na and will guide what type of power you unlock next.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd25 Paths of Power\u003cbr\u003e\u003cbr\u003eWhen your character increases their Bridge Level, they may choose one of the following paths, shaped by how they have grown:\u003cbr\u003e\u003cbr\u003eChaotic Awakening\u003cbr\u003e\u003cbr\u003eFor those who pursue strength, vengeance, or control without regard for balance. Unlock a new bending slot in an element already known (but not your origin element).  \u003cbr\u003eExample: A waterbender who has learned firebending may now gain a second firebending move.\u003cbr\u003e\u003cbr\u003eHarmonic Enlightenment\u003cbr\u003e\u003cbr\u003eFor those who embrace their role as a bridge between worlds. Unlock a new bending element, representing spiritual expansion and Avatar-like growth.  \u003cbr\u003eExample: An earthbender may now begin learning airbending.  \u003cbr\u003eAdditionally, you may gain access to rare spiritual techniques (GM approval), such as Spirit-Bending, Healing Flames, Echobending, etc., reflecting your evolving balance and connection to the Avatar Spirit.\u003cbr\u003e\u003cbr\u003e&gt; Choose base...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAvatar Spirit Check\u003cbr\u003e\u003cbr\u003eRoll a d20 as part of a spirit-focused ritual or when prompted by the GM (typically at key story beats or after using a Spirit Stone).\u003cbr\u003e\u003cbr\u003e- If the roll is even: you gain a number of temporary Spiritbending spellslots equal to the d20 result. These slots last until the end of the current scene or until spent, whichever comes first.\u003cbr\u003e- If the roll is odd: you do not gain slots, but you receive one Spirit Echo \u2014 a small, narratively useful boon (example: advantage on one Spiritbending check, a single short vision providing a clue, or temporary insight on a spirit's motive). The GM chooses the precise echo based on context.\u003cbr\u003e\u003cbr\u003eRules &amp; limits (assumptions \u2014 adjust with GM):\u003cbr\u003e\u003cbr\u003e- Maximum gained slots cannot exceed the character's Bridge Level (or another GM-set cap).\u003cbr\u003e- This check is usually available once per long rest unless a Spirit Stone or special ritual grants repeated checks.\u003cbr\u003e- Spirit slots gained are of the lowest available Spiritbending tier and must be used for Spiritbending moves or effects.\u003cbr\u003e\u003cbr\u003eExample:\u003cbr\u003e\u003cbr\u003e- You roll a d20 and get 14 (even). You gain 14 temporary Spiritbending spellslots (subject to the GM cap). You spend 2 of them to cast a Spirit Ward and keep the rest until the end of the scene.\u003cbr\u003e\u003cbr\u003eAvatar Spirit Bridge Level\u003c\u002fspan\u003e","10 +Element Level","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eprogression table\u003cbr\u003eTABLE:\u003cbr\u003e+---------+-----------------------------------------------------------------+--------------------------------------------------------------------------------------------------------------------------------------------------------------------+\u003cbr\u003e| Level   | Accessible Slots                                                | Total Moves (Newly Learned)                                                                                                                                        |\u003cbr\u003e+---------+-----------------------------------------------------------------+--------------------------------------------------------------------------------------------------------------------------------------------------------------------+\u003cbr\u003e| 1       | Level 1                                                         | 1 Slot from Level 1                                                                                                                                                |\u003cbr\u003e| 2       | Level 1                                                         | 2 Slots from Level 1                                                                                                                                               |\u003cbr\u003e| 3       | Level 1, Level 2                                                | 4 Slots (3 from Level 1, 1 from Level 2)                                                                                                                           |\u003cbr\u003e| 4       | Level 1, Level 2                                                | 6 Slots (4 from Level 1, 2 from Level 2)                                                                                                                           |\u003cbr\u003e| 5       | Level 1, Level 2, Level 3                                       | 9 Slots (5 from Level 1, 3 from Level 2, 1 from Level 3)                                                            ...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile\u003cbr\u003e\u003cbr\u003eSpiritbending represents techniques and rituals that draw on the Avatar Spirit or local spirit presences. These moves often focus on communication, protection, travel between worlds, and subtle influence rather than raw damage.\u003cbr\u003e\u003cbr\u003eHow it works (tiny contract):\u003cbr\u003e\u003cbr\u003e- Resource: Spiritbending slots. These come from your Bridge Level, Spirit Stones, and occasional Avatar Spirit Checks.\u003cbr\u003e- Use: Spend slots to cast Spiritbending moves (see Spiritbending Moves.md).\u003cbr\u003e- Limits: The GM may cap maximum temporary slots gained from checks or stones to preserve balance.\u003cbr\u003e\u003cbr\u003eWhen to use:\u003cbr\u003e\u003cbr\u003e- During rituals, when interacting with spirits, when entering spirit-touched locations, or as part of major story beats involving the Avatar Spirit.\u003cbr\u003e\u003cbr\u003eRisks:\u003cbr\u003e\u003cbr\u003e- Spiritbending can attract attention from powerful spirits. Overuse or reckless bargaining may cause hauntings, covenants, or spirit debt.\u003cbr\u003e\u003cbr\u003eQuick references:\u003cbr\u003e\u003cbr\u003e- Moves and examples: Spiritbending Moves\u003cbr\u003e- Mechanics for gaining slots: Avatar Spirit Check\u003cbr\u003e- Progression and Bridge mechanics: Avatar Spirit Bridge Level\u003cbr\u003e\u003cbr\u003eTeam-up Moves\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Spiritbending --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Spirit\u003cbr\u003e                  \u251c\u2500\u2500 ExpandedCollections\u003cbr\u003e                      \u251c\u2500\u2500 ExpandedAvatar Spirit Bridge Level.md\u003cbr\u003e                      \u2514\u2500\u2500 ExpandedSpiritbending Moves.md\u003cbr\u003e                  \u251c\u2500\u2500 Mechanics\u003cbr\u003e                      \u2514\u2500\u2500 Avatar Spirit Check.md\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending Moves\u003cbr\u003e                      \u2514\u2500\u2500 Spiritbending Moves.md\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile\u003cbr\u003eCollectionfile \u003cbr\u003eSpiritbending Moves\u003cbr\u003e\u003cbr\u003eSpiritbending moves are special techniques that use the Avatar Spirit's connection to the Spirit World. They tend to be more narrative and rarely purely destructive \u2014 instead focusing on influence, protection, communication, and spiritual transformation.\u003cbr\u003e\u003cbr\u003eCore contract:\u003cbr\u003e\u003cbr\u003e- Inputs: Spiritbending slots (from Bridge Level, Spirit Stones, or Avatar Spirit Checks).\u003cbr\u003e- Outputs: A move effect (see moves below).\u003cbr\u003e- Failure modes: On a failed GM opposed roll or failed concentration, some spirit effects can backfire or produce an unintended Spirit Echo.\u003cbr\u003e\u003cbr\u003eSample Moves\u003cbr\u003e\u003cbr\u003e1. Spirit Ward (cost: 2 slots)\u003cbr\u003e\u003cbr\u003e- Effect: Create a protective aura that grants allies within 3m + (1m \u00d7 slots used) advantage on Spirit-related saves for X minutes.\u003cbr\u003e\u003cbr\u003e2. Soul Sight (cost: 1 slot)\u003cbr\u003e\u003cbr\u003e- Effect: You and one ally can see invisible spirits or spirit effects for 1 minute. Provides a single insight on a spirit's nature.\u003cbr\u003e\u003cbr\u003e3. Calm of Ages (cost: 3 slots)\u003cbr\u003e\u003cbr\u003e- Effect: Attempt to pacify a hostile spirit or calm an area. Target makes a WIS save vs DC = 8 + slots used; on failure the spirit is pacified for 1d6 minutes.\u003cbr\u003e\u003cbr\u003e4. Spirit Relay (cost: variable)\u003cbr\u003e\u003cbr\u003e- Effect: Spend slots to send a short message into the Spirit World (or receive one). Each slot adds clarity and range.\u003cbr\u003e\u003cbr\u003e5. Ancestral Echo (cost: 4 slots)\u003cbr\u003e\u003cbr\u003e- Effect: Temporarily call on an ancestor's skill \u2014 grant an ally a one-time automatic success on a non-combat skill check tied to the ancestor's expertise.\u003cbr\u003e\u003cbr\u003eDesign notes:\u003cbr\u003e\u003cbr\u003e- Moves should be negotiated with the GM for balance and narrative fit.\u003cbr\u003e- Spiritbending is more flexible than elemental bending: creativity and roleplay matter.\u003cbr\u003e\u003cbr\u003eSpiritbending\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Spiritbending Moves --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending ...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou may use Levels from Air and Earth .\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  Y(Earth): Yd12 Damage per projectile\u003cbr\u003e- X(Air): X Sand Projectiles\u003cbr\u003e\u003cbr\u003e- Z(Earth  Air): Z  5 meter Cone Range\u003cbr\u003e \u003cbr\u003e- One Earthbender shoots Y Sand Projectiles (rolls the Damage roll) and the Airbender controlls them to home to the X Targets)\u003cbr\u003e\u003cbr\u003eEarthbending \u003cbr\u003eAirbending\u003cbr\u003eTeam-up Moves\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eLevel 3\u003cbr\u003e\u003cbr\u003e  - Range: 3  Firebending Slot meters.\u003cbr\u003e  - Duration: 2 rounds Concentration.\u003cbr\u003e  - Create a mirage of heat, imposing disadvantage on attack rolls against creatures within a 10-foot radius of a point you choose.\u003cbr\u003eFirebending\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  X: X number of projectiles \u003cbr\u003e-  Y: Yd6 Damage per projectile\u003cbr\u003e \u003cbr\u003e- One waterbender shoots X Water Projectiles (rolls the attack role) and the other one Freezes them  rolls the damage rolls)\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003eTeam-up Moves\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eMust be initiated by at least two Waterbenders.  \u003cbr\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  X: X  10 Barrier Armor \u003cbr\u003e-  Y: Y  5 Healing at the start of their turn\u003cbr\u003e\u003cbr\u003e- Encase a willing ally in a jagged prism of glacial ice with a liquid healing core.\u003cbr\u003e    \u003cbr\u003e- The ally immediately gains the effects of Barrier Armor\u003cbr\u003e    \u003cbr\u003e- At the start of their next turn, as the ice thaws, they are healed for 2 \u00d7 Y but their movement is halved.\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003eTeam-up Moves\u003cbr\u003eHealing\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003eIf Concentration is not broken half the Water Charges are refunded.\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Cyclic Flow --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u251c\u2500\u2500 graphs\u003cbr\u003e          \u2514\u2500\u2500 Players Partwikigraphtreemap.html\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Water\u003cbr\u003e                  \u251c\u2500\u2500 ExpandedCollections\u003cbr\u003e                      \u2514\u2500\u2500 ExpandedWater Charges.md\u003cbr\u003e                  \u251c\u2500\u2500 Mechanics\u003cbr\u003e                      \u2514\u2500\u2500 Water Charges.md\u003cbr\u003e                  \u2514\u2500\u2500 Waterbending Moves\u003cbr\u003e                      \u251c\u2500\u2500 Level 1\u003cbr\u003e                          \u2514\u2500\u2500 Healing Water.md\u003cbr\u003e                      \u251c\u2500\u2500 Level 2\u003cbr\u003e                          \u2514\u2500\u2500 Water Tentacles.md\u003cbr\u003e                      \u2514\u2500\u2500 Level 3\u003cbr\u003e                          \u251c\u2500\u2500 Complete Cyclic Reflow.md\u003cbr\u003e                          \u2514\u2500\u2500 Healing Mist.md\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003eWater Charges represent the amount of water available for a water-bender to manipulate.\u003cbr\u003e\u003cbr\u003eWaterbottle Charges \u003cbr\u003e\u003cbr\u003e- Environmental Influence:  \u003cbr\u003e    The number of Water Charges available at the start of combat or during an encounter depends on the setting. Feel free to get creative where to find water.:\u003cbr\u003e    \u003cbr\u003e    - Desert\u002fDry Area: 0 Water Charges (minimum water source).\u003cbr\u003e    - Humid Area: 5-10 Water Charges.\u003cbr\u003e    - Near Water Source (Lake, Ocean, etc.): 15 Water Charges.\u003cbr\u003e    - In Lake, Ocean, etc.: 50+ charges\u003cbr\u003e\t    \u003cbr\u003e- Restoring Water Charges:\u003cbr\u003e    \u003cbr\u003e    - Skill Checks: A waterbender can perform a skill check to draw water from their surroundings DC is determined by how dry the area is. Success restores Water Charges, depending on the environment.\u003cbr\u003e    - Abilities: Certain abilities allow Water Charges recovery or Cyclic Flow.\u003cbr\u003e    \u003cbr\u003eWaterbending\u003cbr\u003eWaterbottle Charges\u003cbr\u003eLevel 1\u003cbr\u003eLevel 2\u003cbr\u003eLevel 3\u003cbr\u003eLevel 4\u003cbr\u003eLevel 5\u003cbr\u003eLevel 6\u003cbr\u003eLevel 7\u003cbr\u003eLevel 8\u003cbr\u003eLevel 9\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Water Charges --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u251c\u2500\u2500 createnpc.py\u003cbr\u003e  \u251c\u2500\u2500 createpc.py\u003cbr\u003e  \u251c\u2500\u2500 Players Part\u003cbr\u003e      \u251c\u2500\u2500 graphs\u003cbr\u003e          \u2514\u2500\u2500 Players Partwikigraphtreemap.html\u003cbr\u003e      \u251c\u2500\u2500 PCs\u003cbr\u003e          \u251c\u2500\u2500 Airwatterbendertest\u003cbr\u003e              \u2514\u2500\u2500 Airwatterbendertest Character Sheet.md\u003cbr\u003e          \u251c\u2500\u2500 Anju\u003cbr\u003e              \u251c\u2500\u2500 Anju Character Sheet.md\u003cbr\u003e              \u2514\u2500\u2500 Character Sheet.md\u003cbr\u003e          \u251c\u2500\u2500 Character Sheet Template.md\u003cbr\u003e          \u251c\u2500\u2500 Rio\u003cbr\u003e              \u2514\u2500\u2500 Character Sheet.md\u003cbr\u003e          \u251c\u2500\u2500 TestChar\u003cbr\u003e              \ ount of water, such as a puddle or a drink-sized volume. The higher the Level the more water can be frozen.\u003cbr\u003e    - Duration: Permanent until thawed naturally.\u003cbr\u003e    - Uses: Create slippery surfaces, small barriers, or tools.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Icecubes\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003efreezing\u003cbr\u003eWaterbending\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- Creating Mist:\u003cbr\u003e- Cost: 1 Water Charge per 10 ft radius .\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 10 ft radius centered on self.\u003cbr\u003e    - Will grow 10 feet per round until full sized\u003cbr\u003e    - Creates a heavily obscured area for concealment that can be absorbed to regain charges (10 feeet radius per Turn) or blown await by air.\u003cbr\u003e\u003cbr\u003eWaterbending\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eShape Water (Cantrip)\u003cbr\u003e\u003cbr\u003e- Cost: None.\u003cbr\u003e- Range: 30 ft.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Duration: At Will. Concentration.\u003cbr\u003e- Effect:  \u003cbr\u003e    You can manipulate a water, shaping it into simple forms, moving it, or changing its state (solid, liquid, mist) temporarily.\u003cbr\u003e    - Limitations: Cannot deal damage but can be used for utility (e.g., extinguishing flames, creating distractions). The higher your Level is the more water can be shaped. Might need an Int ability check.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Shape Water\u003cbr\u003e- Rules\u003cbr\u003e- Int\u003cbr\u003e- Waterbending Moves\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- Cost: 1+ EP.\u003cbr\u003e- Type:  Reaction.\u003cbr\u003e- Range: Self.\u003cbr\u003e- Effect:  \u003cbr\u003e    Jump by
