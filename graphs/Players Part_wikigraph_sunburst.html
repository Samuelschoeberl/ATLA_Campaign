gs:\u003cbr\u003eChiBlocking\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- Cost: 2+ EP.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: Melee.\u003cbr\u003e- Effect:  \u003cbr\u003e    A Flick to the forehead to disrupt focus. Deals EPd4 + Dexterity and the target makes concentraion saves with disadvantage until the end of your next turn.\u003cbr\u003e    - Duration: 1 turn.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- Cost: 1 + EP.\u003cbr\u003e- Type: Bonus Action.\u003cbr\u003e- Range: Melee.\u003cbr\u003e- Attack Roll\u003cbr\u003e- Effect:  \u003cbr\u003e    A swift strike aimed at disrupting the target's focus. Deals EPd8 + Dex bludgeoning damage and imposes disadvantage on the target's next Attack Roll.\u003cbr\u003e    - Duration: 1 Minute.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- Cost: 2 EP.\u003cbr\u003e- Type: Bonus Action.\u003cbr\u003e- Range: Self.\u003cbr\u003e- Effect:  \u003cbr\u003e    Increase your evasion by EP for one turn. Allows you to dodge bending attacks with greater ease.\u003cbr\u003e    - Duration: 1 turn.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- Cost: 3+ EP.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: Melee.\u003cbr\u003e- Attack: Dex \u003cbr\u003e- Effect:  \u003cbr\u003e    A precise strike that deals no damage but if hit the Target must succeed a DC 10+EP Con Save or be Paralysed until the end of your next Turn. \u003cbr\u003e    - Duration: 1 turn.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- Cost: 5 EP.\u003cbr\u003e- Type: Reaction.\u003cbr\u003e- Range: The original attacks range.\u003cbr\u003e- Effect:  \u003cbr\u003e    When in Melee range to an enemy performing a Bending Move. If they fail a DC 10+EP Dex Save you can redirect the opponent's bending energy back at them using the same bending Move. If they succeed by more than 5 they additionally get to use their Move.\u003cbr\u003e    If you steal a Move that requires concentration it is automatically broken instantly.\u003cbr\u003e    - Duration: Instant.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- Cost: 4 EP.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: Melee.\u003cbr\u003e- Attack: Dex+EP\u003cbr\u003e- Effect:  \u003cbr\u003e    Deliver a powerful blow that if hit restores 6 EP. The Target must succeed on a DC 10 + EP Con Save or become Slowed.\u003cbr\u003e    - Duration: 2 turns.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003c\u002fspan\u003e"],"ids":["Firebending Move.md","README.md","color_recolors.md","npc_input.md","pcs_input.md",".update_logs\u002f",".update_logs\u002fsummary.txt","\u002f","DMs Part\u002f","DMs Part\u002fFirebender NPC Sheet.md","DMs Part\u002fMaster Baezu NPC Sheet.md","DMs Part\u002fWaterbender NPC Sheet.md","DMs Part\u002fking_ah_mi_sho NPC Sheet.md","DMs Part\u002flinks.md","DMs Part\u002fnpcs_input.md","MANUALS\u002f","MANUALS\u002fRTFM - Usage_Guide.md","MANUALS\u002fWiki_File_System_Manager \u2013 MANUAL.md","MANUALS\u002fWikigraphs_MANUAL.md","MANUALS\u002fchar_formulas_README.md","MANUALS\u002fcreate_charManual.md","MANUALS\u002fupdate_charManual.md","Players Part\u002f","unsorted\u002f","unsorted\u002fDamaging Move.md","unsorted\u002fDexterity.md","unsorted\u002fElement Level.md","unsorted\u002fLevel.md","unsorted\u002fMax Hit Points.md","unsorted\u002fMax Slots.md","unsorted\u002fMelee.md","unsorted\u002fMove Syntax Template.md","unsorted\u002fPhysical Attack Roll.md","unsorted\u002fSpiritbending Level.md
