ckster of Light:  \u003cbr\u003eCan cast the following spells (or bending analogues), DC 16:\u003cbr\u003e\u003cbr\u003e- Mirror Image, Faerie Fire, Invisibility, Major Image, Flame Strike\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLegendary actions (3\u002fturn):\u003cbr\u003e\u003cbr\u003eRadiant Coil: Constricts a foe in a loop of glowing spirit-light; target must pass STR Save (DC 15) or be restrained and take 2d6 radiant + 2d6 fire dmg.\u003cbr\u003e\u003cbr\u003eFlashbang Glare: Forces one target to make a WIS Save (DC 16) or be stunned by overwhelming light and visions until end of its next ...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e\ud83d\udcc4 \u003cbr\u003eOverview:  \u003cbr\u003eRaza'tel, Spirit of Flash and Fang, has grown erratic and testy in recent weeks. Once content with the offerings of the villagers and occasional predator flesh, he has begun lurking near homes, unsettling livestock, and\u2014most concerning\u2014fixating on a curious village child who watches him from the rooftops.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eThe Spirit's Condition\u003cbr\u003e\u003cbr\u003e- Hunger: His appetite has deepened unnaturally, driven not just by physical need but spiritual imbalance due to a stolen object \u2014 the Resonance Stone.\u003cbr\u003e    \u003cbr\u003e- Mood Swings: Villagers report rapid mood shifts \u2014 playful illusions one moment, threatening flares the next.\u003cbr\u003e    \u003cbr\u003e- Recent Event: A stranger arrived a week ago and offered Raza'tel fresh meat, buying the village some time. But no one knows who the stranger was or where they went.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eQuest Hook\u003cbr\u003e\u003cbr\u003eWhen the party meets Raza'tel, he coils above a cracked cliff-ledge, glowing eyes half-lidded, tail slowly rattling with bursts of white light.\u003cbr\u003e\u003cbr\u003eRaza'tel\u2019s Bargain:\u003cbr\u003e\u003cbr\u003e&gt; \u201cYes, I have the gleaming heart \u2014 your so-called Resonance Stone. But I trade not in trinkets. I am hungry. Five Chameleonrats. Big ones. Laced with fear. Bring them, and the stone is yours.\u201d\u003cbr\u003e\u003cbr\u003e- He will only repeat the offer once.\u003cbr\u003e    \u003cbr\u003e- He expresses clear temptation about \"sampling the shiny child who stares at stars,\" and notes with eerie amusement that the child \"tastes like curiosity.\"\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eReward:\u003cbr\u003e\u003cbr\u003e- If the party brings him 5 freshly slain Chameleonrats, he will lead them to a hidden crystal cavern where he has hidden the Resonance Stone \u2014 an ancient artifact humming with harmonic energy.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOptional Outcomes:\u003cbr\u003e\u003cbr\u003e- Violence Option: Killing Raza'tel will collapse the protective veil around Sekan\u2019to, inviting both spirit-world predators and mortal looters.\u003cbr\u003e    \u003cbr\u003e- Deception Option: Trying to trick Raza'tel with false ...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eElemental Roots: Firebending + Crystal-focused Earthbending  \u003cbr\u003eNickname: Crystalfire Flash or Gleam-bending\u003cbr\u003e\u003cbr\u003eCombat Techniques:\u003cbr\u003e\u003cbr\u003e- Flashflare Strike: A sudden burst of white-hot light from a crystal bomb, used to blind and disorient\u003cbr\u003e    \u003cbr\u003e- Radiant Brand: Fire-infused crystal shards that cling to a target and continue glowing intensely\u003cbr\u003e    \u003cbr\u003e- Mirror Serpent Dance: Reflective crystals scatter light from one another, creating blinding zones and illusions\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eUtility Techniques:\u003cbr\u003e\u003cbr\u003e- Flaretrail Pathing: Crystals laid in advance can be ignited to form a glowing path or trap\u003cbr\u003e    \u003cbr\u003e- Echo Pulse: Crystals resonate with flame, creating a pulse of light and sound that acts like echolocation\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eSpiritual Aspects:\u003cbr\u003e\u003cbr\u003e- Every crystal must be \"awakened\" with a ritual guided by Raza'tel, the Flashing Coil, invoking its inner light\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eTraining:\u003cbr\u003e\u003cbr\u003e- Young benders must master both the meditative patience of earthbending crystal shaping and the passionate intensity of fire\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcc4 Raza'tel, the Flashing Coil\u003cbr\u003e\u003cbr\u003eType: Spirit of Light, Trickery, and Dazzling Revelation  \u003cbr\u003eForm: A serpentine creature with a bioluminescent body. Its tail ends in a sharp crystalline rattle that emits intense light flashes. Wings are shaped like firefly lanterns.\u003cbr\u003e\u003cbr\u003eBehavior:\u003cbr\u003e\u003cbr\u003e- Elusive and curious, often tests those who seek its aid with riddles or challenges in pitch darkness\u003cbr\u003e    \u003cbr\u003e- Appears as a trail of flashing lights before revealing its full form\u003cbr\u003e    \u003cbr\u003e- Prankster but fiercely protective of Sekan\u2019to and its crystals\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eAbilities:\u003cbr\u003e\u003cbr\u003e- Emits blinding pulses that disrupt both spirit and human senses\u003cbr\u003e    \u003cbr\u003e- Can communicate through light patterns\u003cbr\u003e    \u003cbr\u003e- Often appears during major rites or battles, dancing in the sky above the Crucible\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eLegends Say:\u003cbr\u003e\u003cbr\u003e- It was born from a dying comet ...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e\ud83c\udf0d Setting: Village of Sekan'to (Si Wong Desert)\u003cbr\u003e\u003cbr\u003e- Hidden within a towering mesa in the Si Wong Desert, Sekan'to is carved into rich quartz veins deep in the desert\u2019s sandstone spires.\u003cbr\u003e    \u003cbr\u003e- Subterranean galleries and halls protect the village from heat and sandstorms.\u003cbr\u003e    \u003cbr\u003e- Flame-infused crystals illuminate the stone tunnels, casting glowing, angular patterns on the walls.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eMajor Locations:\u003cbr\u003e\u003cbr\u003e- Crystalfire Circle \u2013 the ruling council who sit in the mirrored Hall of Judgment\u003cbr\u003e    \u003cbr\u003e- Forge-Shrines \u2013 subterranean smithies where fire and earth unite to purify and shape crystals\u003cbr\u003e    \u003cbr\u003e- Crucible of Gleam \u2013 an arena embedded in a polished stone bowl that uses reflected sunlight and fire to dazzle fighters\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd25 Unique Bending Style: Sekan'to Crystalfire Style\u003cbr\u003e\u003cbr\u003e- A refined fusion of firebending and crystal-earthbending, adapted to desert minerals\u003cbr\u003e    \u003cbr\u003e- Combines light, heat, and mineral reflection to disorient foes and control terrain\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Flashflare Strike \u2013 a burst of searing, white-hot light using quartz lenses\u003cbr\u003e    \u003cbr\u003e- Radiant Brand \u2013 molten fire-laced crystal that clings and continues to burn\u003cbr\u003e    \u003cbr\u003e- Mirror Serpent Dance \u2013 dazzling illusions using crystalline reflection\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eUtilities:\u003cbr\u003e\u003cbr\u003e- Flaretrail Pathing \u2013 pre-laid glowing paths in the dunes or tunnels\u003cbr\u003e    \u003cbr\u003e- Echo Pulse \u2013 light and fire resonation to locate movement or invisible foes underground\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udc0d Spirit Patron: Raza'tel, the Flashing Coil\u003cbr\u003e\u003cbr\u003e- A massive serpent spirit with firefly wings and a smoldering crystal tail\u003cbr\u003e    \u003cbr\u003e- Dwells in the lightless stone hollows beneath the mesa\u003cbr\u003e    \u003cbr\u003e- Spirit of Light, Trickery, and Hunger\u003cbr\u003e    \u003cbr\u003e- Protects the village from Chameleonrats, but his hunger is growing unnatural\u003cbr\u003e    \u003cbr\u003e- Recently nearly attacked a child \u2014 only pacified by ...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDescription\u003cbr\u003e\u003cbr\u003e- Appearance: A colossal peaceful and good spirit creature that is a hybrid between a toad and an elephant. It has thick, webbed feet, long elephant tusks, and a bloated, amphibian-like body with slick moist skin. Its texture resembles that of a toads \u2014 moist, clothed in simple silk robes. On its back is a disturbing cyst-like growth shaped like a smaller toad's face, with a trunk for a tongue hanging limply. The creature is ancient and wise, embodying Earth and Water, and is surrounded by a shimmering aura of mist.\u003cbr\u003e\t\u003cbr\u003e\u003cbr\u003e- Role: The spiritual protector of the Undersands Village .\u003cbr\u003e- Teachings:\u003cbr\u003e    - Combined Earth and Waterbending to manipulate sandstone hydration.\u003cbr\u003e    - Balance and sustainability in the harsh desert environment.\u003cbr\u003e\u003cbr\u003eCurrent Problem\u003cbr\u003e\u003cbr\u003e- Essence corruption: The spirit\u2019s power is shifting due to unknown influences.\u003cbr\u003e- Evil form:\u003cbr\u003e    - Tusks elongate, trunk becomes prehensile with a sticky frog tongue.\u003cbr\u003e    - Aggressive and territorial.\u003cbr\u003e\u003cbr\u003eLinks to Other Notes:\u003cbr\u003e\u003cbr\u003e- Spirit Corruption Mechanisms \u003cbr\u003e- Undersands Village \u003cbr\u003e- Ula Envoy of Ch\u00e1nch\u00fa\u003cbr\u003e\u003cbr\u003eHP:16\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview\u003cbr\u003e\u003cbr\u003e- Location: Hidden beneath Si Wong Rock , central Si Wong Desert.\u003cbr\u003e    \u003cbr\u003e- Primary Features:\u003cbr\u003e    \u003cbr\u003e    - Underground lake: Provides water to sustain life.\u003cbr\u003e    - Fungi colonies: Essential for food, clothing, and tools.\u003cbr\u003e    - Purple light crystals: Emit a bioluminescent glow, providing light.\u003cbr\u003e- Inhabitants:\u003cbr\u003e    \u003cbr\u003e    - Dual-bending Earth and Waterbenders who use a unique technique to hydrate sandstone, allowing water retention in a closed system.\u003cbr\u003e    - Isolation for centuries. Language, traditions, and clothing are unique.\u003cbr\u003e- Religion and Worship:\u003cbr\u003e    \u003cbr\u003e    - Spirit: Ch\u00e1nch\u00fa  \u2013 A wise and powerful being that guided them to survive in their hostile environment.\u003cbr\u003e- Society:\u003cbr\u003e    \u003cbr\u003e    - Resource-focused: Mushroom-based leather-like textiles, crystal paste for light, and strict water management.\u003cbr\u003e    - Leadership: A council of elder benders, each excelling in Earth, Water, or combined bending techniques.\u003cbr\u003e\u003cbr\u003eLinks to Other Notes:\u003cbr\u003e\u003cbr\u003e- Ch\u00e1nch\u00fa \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eFile: \u003cbr\u003e\u003cbr\u003eFile: Purple Light Crystals \u003cbr\u003e\u003cbr\u003eDescription\u003cbr\u003e\u003cbr\u003e- Formed naturally in the caves beneath the Si Wong Desert.\u003cbr\u003e- Properties: Emit a faint purple glow, often crushed into a paste for hair dye or tools.\u003cbr\u003e\u003cbr\u003eUses\u003cbr\u003e\u003cbr\u003e- Lighting for the Undersands Village .\u003cbr\u003e- Crafting luminescent artifacts.\u003cbr\u003e\u003cbr\u003eLinks to Other Notes:\u003cbr\u003e\u003cbr\u003e- Undersands Village \u003cbr\u003e- Mushroom Leather Techniques \u003cbr\u003e\u003cbr\u003e---\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eI maybe want an arc there between metalbender and airbender characters to find ways to woek together.\u003cbr\u003e\u003cbr\u003eType: Spirit Beast  \u003cbr\u003eElemental Affinity: Air &amp; Earth  \u003cbr\u003eHybrid Form: Peregrine Falcon + Armadillo\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udccc Description\u003cbr\u003e\u003cbr\u003eThe Galehide Armadra is a rare spirit born from the convergence of swift winds and resolute stone. It has the wings and keen eyes of a falcon, merged with the armored shell and burrowing claws of an armadillo. Its spirit form is in constant, subtle motion\u2014its body shimmering slightly as if caught between gust and granite.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf00 Abilities\u003cbr\u003e\u003cbr\u003eEvasive Windstep (Airbending)\u003cbr\u003e\u003cbr\u003e- The Galehide Armadra uses short bursts of compressed air to blur its position, making it extremely difficult to track or hit.\u003cbr\u003e    \u003cbr\u003e- Mechanically: +2 or +3 to Evasion rolls; may impose Disadvantage on attacks once per round.\u003cbr\u003e    \u003cbr\u003e- Fluff: It seems to \"ghost\" sideways just as you strike.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eMetalhide Mantle (Earthbending\u002fMetalbending)\u003cbr\u003e\u003cbr\u003e- The spirit can pull iron-rich minerals from the earth and form sleek, overlapping metal plates over its body, boosting its physical defenses.\u003cbr\u003e    \u003cbr\u003e- Mechanically: Gains temporary armor (e.g., +2 Armor, or temporary HP).\u003cbr\u003e    \u003cbr\u003e- Duration: Until destroyed or shed voluntarily.\u003cbr\u003e    \u003cbr\u003e- Visual: The plates shimmer with a dull luster, engraved with swirling wind motifs.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eDrillstorm Dive\u003cbr\u003e\u003cbr\u003e- It spirals rapidly while encased in metal, transforming into a high-velocity projectile.\u003cbr\u003e    \u003cbr\u003e- Combines wind momentum and armored piercing.\u003cbr\u003e    \u003cbr\u003e- Deals significant damage and breaks through Earth-based defenses.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf2a Behavior\u003cbr\u003e\u003cbr\u003e- Prefers solitude and high altitudes, often found near wind-swept canyons or mountain ridges with rich mineral deposits.\u003cbr\u003e    \u003cbr\u003e- Highly territorial and shy; only appears to those it respects or finds spiritually aligned.\u003cbr\u003e ...","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eName: Kaedo  \u003cbr\u003eAge: Mid-twenties  \u003cbr\u003eRole: Tour Guide of Mahzeen Village, Sandbending Prodigy\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBackground:\u003cbr\u003e\u003cbr\u003eKaedo was born and raised in the Village of Mahzeen, a remote Sandbender settlement near the ancient Earth Temple. As a child, he was always tinkering with the dunes, shaping small sand sculptures for travelers and inventing playful uses for the desert wind. His parents\u2014humble herders\u2014never expected much beyond a stable future guiding caravans, but Kaedo surprised everyone with his natural talent and quick mastery of sandbending techniques.\u003cbr\u003e\u003cbr\u003eAs he grew older, Kaedo became the village\u2019s unofficial \u201cfaces and voices\u201d to the outside world. His tours of Mahzeen were famous for their charm, humor, and breathtaking bending displays. He\u2019s the one who leads travelers around the oasis, showing them the intricate carvings, the subtle dunes that whisper of ancient spirits, and the clever ways Sandbenders have adapted to life in the harsh desert.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003ePersonality:\u003cbr\u003e\u003cbr\u003eKaedo is warm-hearted, eager to please, and curious\u2014an ideal guide, equal parts entertainer and educator. He carries himself with easy confidence and a touch of boyish pride. Deep down, he\u2019s both honored and perplexed that High Priestess Shakiri believes he might be more than just a talented Sandbender.\u003cbr\u003e\u003cbr\u003eHe shrugs off such lofty notions. After all, he\u2019s no Avatar\u2014just Kaedo, the sand-sculptor and storyteller who makes visitors laugh and gasp in wonder. He wears practical desert garb: loose, sand-hued pants, a sleeveless tunic tied with a bright sash, and a cloth mask to protect his face from the whipping winds. Bracelets of polished sandstone beads jangle softly at his wrists.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eInvited to the Ritual:\u003cbr\u003e\u003cbr\u003eBecause Mahzeen\u2019s tribe has tended the Temple for generations\u2014cleaning the carved alcoves, maintaining its walkways, and ensuring its sacred pools remain undisturbed\u2014the Lotus Order ...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA Dark humnaoid Cat like Spirit that has a large shard of Vaatu and was therefore corrupted early. He supresses the dark as good as he cans but the dark spirit also gives him the gifts to be an elite assasin. He only uses a little bit of airbending and is mostly waepon and archery based.\u003cbr\u003e\u003cbr\u003eRace\u002fType: Dark Humanoid Cat-like Spirit  \u003cbr\u003eAffiliation: Independent (Potentially allied with the Party and later Night Bloom?)  \u003cbr\u003eRole: Elite Assassin, Tracker, and Protector\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003e\u003cbr\u003eSilent Song is a shadowy feline humanoid spirit with sleek, dark fur and piercing silver eyes. His form is lithe and agile, blending the traits of a predator with the intelligence of a humanoid. A shard of Vaatu, the spirit of chaos and darkness, embedded itself in Silent Song. This corruption taints him, but Silent Song works tirelessly to suppress its influence.\u003cbr\u003e\u003cbr\u003eThe dark shard grants him supernatural abilities, enhancing his combat prowess and sensory skills but constantly tempts him toward chaos. He channels his darkness into his role as an elite assassin, using his gifts for precision and stealth to survive and protect others.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAbilities\u003cbr\u003e\u003cbr\u003e- Shadow Infusion:\u003cbr\u003e    \u003cbr\u003e    - Enhanced Stealth: Silent Song can meld into the shadows almost seamlessly, making him nearly invisible in darkness.\u003cbr\u003e    - Spirit Step: A short-range teleportation ability, moving from one shadow to another within his line of sight.\u003cbr\u003e    - Sense Chaos: He can detect nearby spirits or individuals tainted by chaotic energy.\u003cbr\u003e- Limited Airbending:  \u003cbr\u003e    While not a master, Silent Song wields airbending with precision, using it primarily for utility and agility:\u003cbr\u003e    \u003cbr\u003e    - Wind-Assisted Leaps: Propel himself higher or farther.\u003cbr\u003e    - Silent Movement: Dampen sound waves to move noiselessly.\u003cbr\u003e    - Projectile Diversion: Slightly redirect arrows or small projectiles mid-flight.\u003cbr\u003e- Weapons Mastery:...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLinks:\u003cbr\u003e- Kaedo, the Young Sandbender Guide\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eName: Firebender\u003cbr\u003e\u003cbr\u003eCore Stats\u003cbr\u003eTABLE:\u003cbr\u003e+----------------+---------+--------+-------------------------+\u003cbr\u003e| Stat           | Value   | note   | Automatically updated   |\u003cbr\u003e+----------------+---------+--------+-------------------------+\u003cbr\u003e| Strength       |         |        | N                       |\u003cbr\u003e| Dexterity      |         |        | N                       |\u003cbr\u003e| Constitution   |         |        | N                       |\u003cbr\u003e| Intelligence   |         |        | N                       |\u003cbr\ r Earmur Form:    \u003cbr\u003e    - Echolocation Mastery: Advantage on Perception checks that rely on hearing. Can detect creatures and objects within a 30 m radius, even in complete darkness, unless in a \"silence zone.\"\u003cbr\u003e\t- Silent Hunt: Advantage on Stealth checks while flying or burrowing, as its movements are nearly soundless.\u003cbr\u003e\t- Soundbending Pulse: Once per short rest, the Earmur can emit a focused sound wave that disrupts enemy concentration or reveals hidden creatures. Creatures within 10 m must make a Airbending DC Constitution saving throw or be disoriented (disadvantage on attacks and Perception checks) for 1 minute.\u003cbr\u003e    Combat Stats:\u003cbr\u003e    - Evasion: 16\u003cbr\u003e    - HP: 2 x CL (durable for its size but not a tank).\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eContext:  \u003cbr\u003eImmediately after the group's victory over a corrupted spirit. Mahogany, the group's only spirit, has absorbed the entity\u2019s negative energy and purified it from within through a spiritual contest.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udfaf Mechanics\u003cbr\u003e\u003cbr\u003e- Trigger: Mahogany completes the spirit cleansing.\u003cbr\u003e    \u003cbr\u003e- Airbenders in the group must make a Perception check (DC 12, with advantage).\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eOn Success:  \u003cbr\u003eThey sense a brief, unnatural shift in air pressure\u2014a swirl or pulse like a door opening to a hidden chamber, but they are high on a mountain with nothing around. It vanishes after two seconds.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf00 Mahogany's Vision\u003cbr\u003e\u003cbr\u003e&gt; (Private: The player can request the others to leave the room for this scene.)\u003cbr\u003e\u003cbr\u003e&gt; As the spiritual remnants fade, Mahogany feels a tingle in the air\u2014not hostile, but watchful.  \u003cbr\u003e&gt; Then, a soft voice, cold as distant wind, whispers directly into her ear:\u003cbr\u003e\u003cbr\u003e\"Now... who are you?\"\u003cbr\u003e\u003cbr\u003eMahogany may make a History or Insight check (DC 17) to identify the speaker.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd0d On Success: Recognizing Rin Kotak\u003cbr\u003e\u003cbr\u003eMahogany realizes the voice belongs to Rin Kotak, the elusive Spiritualist of the Night Bloom, a radical airbender known for manipulating sound and blending with wind to near invisibility. He is feared not just for his bending, but for how he weaves ideology into every breath.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udde3\ufe0f Dialogue (If Mahogany responds)\u003cbr\u003e\u003cbr\u003eIf she speaks\u2014aloud or in thought\u2014a ripple of wind answers. On a distant cliff edge, so far that no human voice should carry, a tall, black-robed figure appears, seated cross-legged, barely more than a wraith in the wind. And yet... his voice is inside her again:\u003cbr\u003e\u003cbr\u003e&gt; \u201cYou bent the spirit. Purified it. Took its pain into your own.  \u003cbr\u003e&gt; You\u2019re not like them\u2014not just flesh. Not just bound by the old rules.  \u003cbr\u003e&gt; Intriguing.\u201d\u003cbr\u003e\u003cbr\u003e&gt; \u201cYou stand on a peak, but don\u2019t you feel th...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe village of the Spidermonkeys\u003cbr\u003eAdventure: \u003cbr\u003e\u003cbr\u003eSetting: The Floating Island of the Nomadic Airbenders\u003cbr\u003e\u003cbr\u003eThe players find themselves in a dense forest, where an entire floating island has landed momentarily. This island belongs to a nomadic airbending tribe that has perfected a unique bending style called Silkbending, inspired by their deep bond with the Spiderlemurs.\u003cbr\u003e\u003cbr\u003eThe Spiderlemurs\u003cbr\u003e\u003cbr\u003eA rare species found only in this part of the world, Spiderlemurs have the body of a lemur but with four arms, four legs, and a long prehensile tail. Their heads resemble spiders, complete with multiple eyes and small mandibles. They produce powerful silk from each of their appendages, which they use to glide alongside the airbenders, creating parachutes they manipulate through airbending. Their silk is also essential for the tribe, used for clothing, rope, and even structural supports for their floating homes.\u003cbr\u003e\u003cbr\u003eThe Spiderlemurs assist in keeping the floating island airborne. By gripping the island with their mandibles and spinning silk into large wind-catching sails, they create natural updrafts, allowing the airbenders to maintain their high-altitude lifestyle.\u003cbr\u003e\u003cbr\u003eThe Floating Island Tribe\u003cbr\u003e\u003cbr\u003eThis nomadic tribe typically resides in a hidden valley where a natural updraft allows them to sustain their floating home. They only descend when necessary, usually for trade or in emergencies. Their culture revolves around Silkbending, a refined form of airbending that incorporates Spiderlemur silk into their movements.\u003cbr\u003e\u003cbr\u003eCulture &amp; Traditions\u003cbr\u003e\u003cbr\u003e- Silkbending: A technique unique to this tribe, combining airbending with the manipulation of Spiderlemur silk. Masters can use it to create silk whips, nets, and even glider-like wings.\u003cbr\u003e    \u003cbr\u003e- Self-Sufficiency: The tribe cultivates special crops adapted to high-altitude life. Their clothing is woven from Spiderlemur silk, making it lightwei...","","","Overview of Earth Kingdom adventures, including themes like resilience, strength, and the challenges of navigating a vast and diverse region. Includes guidelines for integrating these modules with the larger campaign.","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview:\u003cbr\u003e\u003cbr\u003eThe Avatar spirit, the bridge between the physical and spiritual realms, is in a precarious state. During the final moments of the last Avatar\u2019s life, a catastrophic event caused the spirit\u2019s essence to splinter, disrupting the cycle of reincarnation and weakening its connection to the Spirit World.\u003cbr\u003e\u003cbr\u003eEvent of Fracture:\u003cbr\u003e\u003cbr\u003eThe fracture occurred during a climactic battle against a monstrous corrupted spirit, commanded by the rogue Spiritbender. The Avatar sacrificed themselves to contain the spirit\u2019s power, but the Spiritbender\u2019s mist disrupted the Avatar\u2019s spiritual essence, leaving it fragmented and vulnerable.\u003cbr\u003e\u003cbr\u003eEffects of the Fracture:\u003cbr\u003e\u003cbr\u003e1. Weakened Avatar State: The current Avatar cannot fully access the power of their predecessors, making their connection to past lives erratic and unreliable.\u003cbr\u003e    \u003cbr\u003e2. Disturbed Spirit World: The fracture has caused chaos in the Spirit World, with dark spirits manifesting more frequently in the physical realm.\u003cbr\u003e    \u003cbr\u003e3. Cycle in Jeopardy: The reincarnation cycle is unstable. If the fracture is not healed, the Avatar may not reincarnate after their current life ends.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eClues to Restoration:\u003cbr\u003e\u003cbr\u003e- Shards of Essence: Fragments of the Avatar spirit linger in sacred locations across the world. By visiting these sites and performing rituals, the group can begin to mend the fractures.\u003cbr\u003e    \u003cbr\u003e- Guidance from Spirits: Certain spirits, such as Shifting Sands or the elusive Bright Flame, may provide insight into restoring the balance.\u003cbr\u003e    \u003cbr\u003e- Confronting the Spiritbender: The rogue Airbender holds knowledge about the fracture and must be confronted to uncover the full truth.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eMechanics:\u003cbr\u003e\u003cbr\u003e- Fractured Avatar State:\u003cbr\u003e    \u003cbr\u003e    - When the Avatar attempts to enter the Avatar State, they must succeed on a Spirit check (DC 18). Failure results in a partial manifestation, granting a single bending style...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview of the purpose of the #Modules folder, including guidelines on how to scale the modules based on the party's power level and integrate them into the main campaign.\u003cbr\u003e\u003cbr\u003eModules\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCore Stats\u003cbr\u003eTABLE:\u003cbr\u003e+----------------+---------+--------+-------------------------+\u003cbr\u003e| Stat           | Value   | note   | Automatically updated   |\u003cbr\u003e+----------------+---------+--------+-------------------------+\u003cbr\u003e| Strength       | 4       |        | N                       |\u003cbr\u003e| Dexterity      | 2       |        | N                       |\u003cbr\u003e| Constitution   | 4       |        | N                       |\u003cbr\u003e| Intelligence   | 2       |        | N                       |\u003cbr\u003e| Wisdom         | 8       |        | N                       |\u003cbr\u003e| Charisma       | 5       |        | N                       |\u003cbr\u003e+----------------+---------+--------+-------------------------+\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eVital Stats (auto)\u003cbr\u003eTABLE:\u003cbr\u003e+------------------+---------+--------+-------------------------+\u003cbr\u003e| Attribute        | Value   | note   | Automatically updated   |\u003cbr\u003e+------------------+---------+--------+-------------------------+\u003cbr\u003e| Max Hit Points   |         |        | Y                       |\u003cbr\u003e| Evasion          |         |        | Y                       |\u003cbr\u003e| Armor            |         |        | Y                       |\u003cbr\u003e+------------------+---------+--------+------------------------         | 6       |        | N                       |\u003cbr\u003e| Charisma       | 2       |        | N                       |\u003cbr\u003e+----------------+---------+--------+-------------------------+\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eVital Stats (auto)\u003cbr\u003eTABLE:\u003cbr\u003e+------------------+---------+--------+-------------------------+\u003cbr\u003e| Attribute        | Value   | note   | Automatically updated   |\u003cbr\u003e+------------------+---------+--------+-------------------------+\u003cbr\u003e| Max Hit Points   |         |        | Y                       |\u003cbr\u003e| Evasion          |         |        | Y                       |\u003cbr\u003e| Armor            |         |        | Y                       |\u003cbr\u003e+------------------+---------+--------+-------------------------+\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBending Levels\u003cbr\u003eTABLE:\u003cbr\u003e+-----------------------+---------+--------------------------+----+\u003cbr\u003e| Element               | Level   | Notes                    |    |\u003cbr\u003e+-----------------------+---------+--------------------------+----+\u003cbr\u003e| Airbending Level      | 0       |                          |    |\u003cbr\u003e| Waterbending Level    | 0       |                          |    |\u003cbr\u003e| Earthbending Level    | 10      |                          |    |\u003cbr\u003e| Firebending Level     | 0       |                          |    |\u003cbr\u003e| Spiritbending Level   | 0       | (Avatar Spirit Bridge)   |    |\u003cbr\u003e+-----------------------+---------+--------------------------+----+\u003cbr\u003e\u003cbr\u003eBending Slots\u003cbr\u003e\u003cbr\u003e- (auto-generate...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCharacter\u003cbr\u003e\u003cbr\u003e- Name: Ula\u003cbr\u003e    \u003cbr\u003e- Appearance:\u003cbr\u003e    \u003cbr\u003e    - Pale skin, faintly glowing purple hair due to crystal-paste dye.\u003cbr\u003e    - Mushroom-leather outfit with a toad-eye hood for tradition and identity.\u003cbr\u003e- Personality:\u003cbr\u003e    \u003cbr\u003e    - Determined, resourceful, and reverent toward the spirit.\u003cbr\u003e    - Nervous about interacting with the outside world.\u003cbr\u003e- Role:\u003cbr\u003e    \u003cbr\u003e    - Tasked with seeking a Spirit Bender to save Ch\u00e1nch\u00fa .\u003cbr\u003e    - Acts as the guide for the party to the Undersands Village .\u003cbr\u003e\u003cbr\u003eEquipment:\u003cbr\u003e\u003cbr\u003e- Crystals for lighting caves.\u003cbr\u003e- Hydration stones for water control and protection.\u003cbr\u003e\u003cbr\u003eLinks to Other Notes:\u003cbr\u003e\u003cbr\u003e- Ch\u00e1nch\u00fa \u003cbr\u003e- Undersands Village \u003cbr\u003e- Spirit Benders \u003cbr\u003e- Mushroom Leather Techniques \u003cbr\u003eNPC\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eRin Kotak.png\u003cbr\u003ehe\u002fhim\u003cbr\u003ePhysical Description:  \u003cbr\u003e        A tall, gaunt man with alabaster skin and wispy, shoulder-length white hair that seems to shift like mist in the wind. His gray eyes are perpetually half-lidded, giving him a detached, eerie demeanor. His flowing black robes ripple unnaturally, as if caught in a constant breeze. His soft-spoken voice carries an unsettling intensity.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Airbending with a dark twist\u2014manipulating sound waves to confuse and disorient enemies and bending the air around him to make him almost invisible.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAirbending\u003cbr\u003e\u003cbr\u003e\u201cThey call it balance. They say the Avatar brings peace. But I ask you\u2014what peace is built upon the whims of a single soul? One person, plucked from the cycle, anointed by spirits, wielding the fury of all four elements like a god among mortals. We kneel to them. We trust them. We fear them. We wait for them to fix what we cannot. But what happens when the Avatar fails? When they vanish? When they turn tyrant? No one should bear such power. And no one should have to live under it. Balance cannot come from a single hand\u2014it must rise from all of us, together. End the cycle. Let the world breathe free for once, without its so-called savior.\u201d\u003cbr\u003e\u003cbr\u003eInit:\u003cbr\u003ephot 21 \u003cbr\u003eRin Xolai 20 \u003cbr\u003eTapi 19\u003cbr\u003ePui 15\u003cbr\u003eIroh Tanaka 15\u003cbr\u003e\u003cbr\u003eRiu 14\u003cbr\u003eIsay Treksal 12\u003cbr\u003eStie 12\u003cbr\u003eAnju 12\u003cbr\u003eJin koga\u003cbr\u003eAkira Meiyu\u003cbr\u003e\u003cbr\u003eDAMAGE\u003cbr\u003e9\u003cbr\u003e\u003cbr\u003eNPC\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- Physical Description:  \u003cbr\u003e    A striking woman in her early forties with jet-black hair styled into an intricate braid that cascades down her back. Her pale blue eyes seem to pierce through her opponents, reflecting a sharp intellect and unshakable resolve. Her high cheekbones and angular features give her an almost regal appearance. She wears an ornate, high-collared cloak adorned with faintly glowing charms.\u003cbr\u003e- Bending Style:  \u003cbr\u003e    Waterbending focused on offensive techniques, including the manipulation of black mist\u2014a mixture of water vapor and fine particles, creating disorienting smoke.\u003cbr\u003e- Role:  \u003cbr\u003e    Charismatic leader and visionary behind the rebellion. Isay is a master tactician and inspiring orator.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003eNPC\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOrganisations\u003cbr\u003eOverview:\u003cbr\u003e\u003cbr\u003eThe Night Bloom is a radical faction seeking to overthrow the Avatar\u2019s influence, advocating for a world ruled collectively by elite benders. They view the Avatar as a relic of oppression and seek to reshape the spiritual and physical realms.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLeadership:\u003cbr\u003e\u003cbr\u003e1. Isay Trekal (she\u002fher) (Faction Leader)\u003cbr\u003e    \u003cbr\u003e    - Physical Description:  \u003cbr\u003e        A striking woman in her early forties with jet-black hair styled into an intricate braid that cascades down her back. Her pale blue eyes seem to pierce through her opponents, reflecting a sharp intellect and unshakable resolve. Her high cheekbones and angular features give her an almost regal appearance. She wears an ornate, high-collared cloak adorned with faintly glowing charms.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Waterbending focused on offensive techniques, including the manipulation of black mist\u2014a mixture of water vapor and fine particles, creating disorienting smoke.\u003cbr\u003e    - Role:  \u003cbr\u003e        Charismatic leader and visionary behind the rebellion. Isay is a master tactician and inspiring orator.\u003cbr\u003e2. Hanal Koga(she\u002fher) (Second-in-Command)\u003cbr\u003e    \u003cbr\u003e    - Physical Description:  \u003cbr\u003e        A sturdy woman with sun-kissed skin and short, spiky hair the color of sandy blonde. She has a confident, swaggering gait, often adorned with sand-crusted boots and bracers. Her lightweight armor is covered with fine grains of sand that move subtly as she walks.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Earthbending with a specialization in sand manipulation.\u003cbr\u003e    - Role:  \u003cbr\u003e        Oversees the Night Bloom\u2019s military operations, crafting strategies for their attacks.\u003cbr\u003e3. Rin Kotak(he\u002fhim) (Spiritualist)\u003cbr\u003e    \u003cbr\u003e    - Physical Description:  \u003cbr\u003e        A tall, gaunt lings were raised by their\u003cbr\u003efather and the father's sister.\u003cbr\u003e\u003cbr\u003eEven though Anju was raised like a man, she has a feminine side to her which she learned from\u003cbr\u003eher aunt. The father is strict but also a good instructor. In time, Anju has enough athletic ability\u003cbr\u003eto pass as an average male of her tribe (though not outstanding like Korra). Anju's strength lies\u003cbr\u003ein her ability to create icicles. One of her greatest achievements - and also secrets - is when she\u003cbr\u003ecreated thick icicle soles to appear 5cm taller, which made her taller than her father at that time\u003cbr\u003eand caused her father to appear proud of her for the first time in forever.\u003cbr\u003e\u003cbr\u003eSeeing Anju's proficient icicle making, her father is convinced she is a very talented bender, maybe\u003cbr\u003eeven with potential of becoming the next Avatar. He sends Anju off to\u003cbr\u003e&lt;ENTER SUMMSI'S NAME FOR THE AVATAR CAMP HERE&gt; with one request to\u003cbr\u003eAnju: \"Be a great man that makes the southern water tribe proud\"\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eName: Anju\u003cbr\u003e\u003cbr\u003eCore Stats\u003cbr\u003eTABLE:\u003cbr\u003e+----------------+---------+\u003cbr\u003e| Stat           | Value   |\u003cbr\u003e+----------------+---------+\u003cbr\u003e| Strength       | 0       |\u003cbr\u003e| Dexterity      | 0       |\u003cbr\u003e| Constitution   | 0       |\u003cbr\u003e| Intelligence   | 0       |\u003cbr\u003e| Wisdom         | 0       |\u003cbr\u003e| Charisma       | 0       |\u003cbr\u003e+----------------+---------+\u003cbr\u003e\u003cbr\u003eBending Levels\u003cbr\u003eTABLE:\u003cbr\u003e+-----------------------+---------+---------+----+\u003cbr\u003e| Element               | Level   | Notes   |    |\u003cbr\u003e+-----------------------+---------+---------+----+\u003cbr\u003e| Airbending Level      | 0       |         | 00\u2500 Teamwork Moves.md\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eTake a break and rest for an Hour.\u003cbr\u003e\u003cbr\u003eYou Have a pool of Your Hitpoints and\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAshen Steppes\u003cbr\u003e\u003cbr\u003eEnvironment:\u00a0Volcanic plains and hardened lava flows  \u003cbr\u003eSpecialized Style:\u00a0Magma Pulse Bending  \u003cbr\u003eDescription:  \u003cbr\u003eBuilt on a cooled lava plateau, Ashen Steppes is a hardy settlement that thrives amidst ash and fire. Their benders have developed\u00a0Magma Pulse Bending, a high-heat technique that focuses on heating and liquifying stone momentarily to create bursts of molten rock or steam-based propulsion. It\u2019s more aggressive and volatile than traditional earthbending, with a focus on explosive, short-range attacks and reshaping brittle volcanic stone mid-combat.\u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Lava Flare:\u00a0Melts a small patch of ground into a geyser of magma.\u003cbr\u003e    \u003cbr\u003e- Obsidian Shardstorm:\u00a0Shatters cooled lava into razor-sharp fragments hurled at foes.\u003cbr\u003e    \u003cbr\u003e- Ash Drift:\u00a0Uses heated air and ash for sudden propulsion or smokescreen escapes.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWhispering Mesa\u003cbr\u003e\u003cbr\u003eEnvironment:\u00a0Wind-carved sandstone cliffs and canyons  \u003cbr\u003eSpecialized Style:\u00a0Echoform Bending  \u003cbr\u003eDescription:  \u003cbr\u003ePerched atop labyrinthine mesas where the wind never stops howling, Whispering Mesa is home to benders who\u2019ve mastered\u00a0Echoform Bending\u2014a refined technique that utilizes sound vibrations and seismic pulses through brittle stone. They focus on precision, using thin slices, tremor sense, and harmonic resonance to create unstable conditions underfoot or launch sonic-reinforced projectiles.\u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Resonant Blade:\u00a0Vibrates stone into a cutting edge capable of slicing metal.\u003cbr\u003e    \u003cbr\u003e- Tremor Veil:\u00a0Distorts local vibrations to confuse tremor-sensing enemies.\u003cbr\u003e    \u003cbr\u003e- Echo Step:\u00a0Propels the user forward using a precisely timed ground pulse.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWould you like me to create adventure hooks or NPCs tied to these villages?\u003cbr\u003e\u003cbr\u003eYou said:\u003cbr\u003e\u003cbr\u003egreat now do the same for airbender villages\u003cbr\u003e\u003cbr\u003eChatGPT said:\u003cbr\u003e\u003cbr\u003eHere are three distinct\u00a0Ai...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eStonevine Hollow\u003cbr\u003eEnvironment: \u003cbr\u003eSubterranean jungle cave system\u003cbr\u003eSpecialized Style: \u003cbr\u003eVinegrasp BendingDescription:\u003cbr\u003eStonevine Hollow is hidden deep beneath the surface in a lush cave network where glowing fungi and creeping vines dominate the stone landscape. The villagers have developed Vinegrasp Bending, a technique that integrates earthbending with plant interaction. Benders here can manipulate soil and roots in tandem, weaving vines through stone or using soil nutrients to rapidly grow roots as whips, restraints, or bridges. They value patience and symbiosis, with their bending resembling a slow but overwhelming encroachment.Key Techniques:Root Snare: Erupts tangled roots from the soil to bind enemies.Fungal Bloom: Encourages explosive growth of bioluminescent fungi to blind foes or light paths.Symbiotic Armor: Covers the bender in flexible bark-like plating drawn from surrounding flora.\u003cbr\u003e\u003cbr\u003eAshen Steppes\u003cbr\u003eEnvironment: \u003cbr\u003eVolcanic plains and hardened lava flowsSp l, such as smuggling or political rivalries.","","The party must infiltrate or attack a bandit camp causing problems for a nearby town. Scalable combat and stealth options.","","A session where the party is ambushed by bandits. Includes a scalable encounter table and potential motivations for the bandits.","The party must find a lost Air Nomad relic. Options for clues, red herrings, and NPCs involved.","","Detailed mechanics for a combat scenario with bandits, including scalable stats and optional objectives.","A beast attack on a village, with rules for scaling the beast\u2019s strength and integrating environmental hazards.","","A reusable template for creating scalable combat challenges.","A reusable template for crafting social or dialogue-heavy scenarios.","","A reusable template for creating Earthbending-based puzzles and challenges.","A reusable template for designing political intrigue scenarios.","","Clues uncovered in a marketplace dispute that lead to a larger conspiracy.","A scavenger hunt for an ancient artifact, with puzzles and conflicting NPC objectives.","","Options for resolving a bandit encounter through dialogue, including persuasion challenges and NPC personality traits.","The party witnesses a dispute in a busy marketplace and can choose to mediate, escalate, or exploit the situation.","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSkybison Polo Festival Extravaganza\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003eThe Skybison Polo Festival is an annual event held in the Air Nomad territories, combining thrilling competitions, festive games, and a cultural celebration of the bond between Air Nomads and their beloved skybison. This module introduces the players to the festival, offering opportunities for interaction, skill challenges, and intrigue.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eKey Locations\u003cbr\u003eThe Festival Grounds\u003cbr\u003e- A large, open area with colorful tents, food stalls, and stages for musical performances.\u003cbr\u003e- Games and activities like skybison rides, airbending obstacle courses, and market stalls selling unique wares.\u003cbr\u003e\u003cbr\u003eThe Polo Arena\u003cbr\u003e- The centerpiece of the festival, with a massive circular arena designed for skybison polo.\u003cbr\u003e- Spectators sit in tiered seating, cheering loudly as teams compete.\u003cbr\u003e\u003cbr\u003eThe Betting Tent\u003cbr\u003e- A lively hub where festival-goers can place bets on their favorite teams or players.\u003cbr\u003e- Operated by a charismatic Air Nomad known as Garo the Gamester.\u003cbr\u003e\u003cbr\u003eThe Stables\u003cbr\u003e- A quieter area where the competing skybison are cared for.\u003cbr\u003e- Players might meet the skybison caretakers or sneak around to uncover secrets.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eKey NPCs\u003cbr\u003eMaster Tenzho\u003cbr\u003e- An elder Air Nomad and referee of the polo matches. Wise but with a mischievous sense of humor.\u003cbr\u003e- Knows much about the history of skybison polo.\u003cbr\u003e\u003cbr\u003eGaro the Gamester\u003cbr\u003e- A charming and slightly shady Air Nomad who runs the betting tent.\u003cbr\u003e- Always looking for a way to turn a profit, possibly at the expense of honesty.\u003cbr\u003e\u003cbr\u003eTeam Azure Wings\u003cbr\u003e- A team of young, brash Air Nomads eager to prove their skills.\u003cbr\u003e- Might invite the players to join their team if they need extra members.\u003cbr\u003e\u003cbr\u003eTeam Sky Soarers\u003cbr\u003e- The reigning champions, led by the confident Kani Windstride.\u003cbr\u003e- They are skilled but harbor a secret\u2014they may be cheating to maintain their streak.\u003cbr\u003e\u003cbr\u003eRavi the S...","","Exploring an Air Nomad temple with traps, lore, and possible combat encounters.","Random encounter tables for traveling through uncharted wilderness.","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eshe her\u003cbr\u003ePhysical Description:  \u003cbr\u003e        A sturdy woman with sun-kissed skin and short, spiky hair the color of sandy blonde. She has a confident, swaggering gait, often adorned with sand-crusted boots and bracers. Her lightweight armor is covered with fine grains of sand that move subtly as she walks.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Earthbending with a specialization in sand manipulation.\u003cbr\u003e    - Role:  \u003cbr\u003e        Oversees the Night Bloom\u2019s military operations, crafting strategies for their attacks.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Armor\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eNPC\u003c\u002fspan\u003e","","","","","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Team-up Moves --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u251c\u2500\u2500 Earth\u003cbr\u003e                  \u2514\u2500\u2500 Earthbending Moves\u003cbr\u003e                      \u2514\u2500\u2500 glass fruit bending\u003cbr\u003e                          \u251c\u2500\u2500 FlashLemon Refractor Beam.md\u003cbr\u003e                          \u251c\u2500\u2500 Glassfruit Seed Mechanics.md\u003cbr\u003e                          \u251c\u2500\u2500 Inferno Bloom (Red Flamegrape).md\u003cbr\u003e                          \u251c\u2500\u2500 Resonant Collapse (Blue Soundbanana).md\u003cbr\u003e                          \u2514\u2500\u2500 Soulseed Harmonic Seal.md\u003cbr\u003e              \u251c\u2500\u2500 Spirit\u003cbr\u003e                  \u2514\u2500\u2500 Mechanics\u003cbr\u003e                      \u2514\u2500\u2500 Spiritbending.md\u003cbr\u003e              \u251 br\u003eKey Moves\u003cbr\u003e- Pressure Point Strike\u003cbr\u003e- Nerve Strike\u003c\u002fspan\u003e","A slowed creatures Movement Speed is halved and it can not use any #Bonusactions or #reactions. ( #Action is allowed)","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eGrants Damage reduction. \u003cbr\u003eBase armor:\u003cbr\u003e0 + Earthbending Level\u003cbr\u003e\u003cbr\u003eGeneral Armor reduces all Damage Types in addition to their specific type Armor (other than spiritual). \u003cbr\u003e\u003cbr\u003ePhysical Armor reduces all Piercing Slashing and bludgeoning Damage.\u003cbr\u003e\u003cbr\u003eBarrier Armor Whenever you suffer unblocked damage Barrier Armor halves\u003c\u002fspan\u003e","= Element Level - Stress Level","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eBarrier Armor Whenever you suffer unblocked damage Barrier Armor halves (rounded down)\u003cbr\u003eFor example when you have 15 Barrier Armor and suffer 18 damage you suffer 3 Damage and Barrier Armour halves to 7.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003e\u003cbr\u003eCharacter Level so the Sum of all your Element Levels\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:CL --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u251c\u2500\u2500 PCs\u003cbr\u003e          \u2514\u2500\u2500 Mahogany\u003cbr\u003e              \u2514\u2500\u2500 Transformation Points.md\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u251c\u2500\u2500 Bending Rules\u003cbr\u003e              \u251c\u2500\u2500 Air\u003cbr\u003e                  \u2514\u2500\u2500 Airbending Moves\u003cbr\u003e                      \u2514\u2500\u2500 Level 3\u003cbr\u003e                          \u2514\u2500\u2500 Hovering Hands.md\u003cbr\u003e              \u2514\u2500\u2500 Water\u003cbr\u003e                  \u ithin 3 meter is attacked, impose Disadvantage on the attack roll as you shift to protect them with your shell. Can be used 3 times per long rest.\u003cbr\u003e\t    Tuck in: \u003cbr\u003e\t    - Reaction\u003cbr\u003e\t\t    When you fail a dexterity saving throw you still only take half damage. Your Movement in the next round is halved.\u003cbr\u003e\u003cbr\u003e    - Sturdy Form:\u003cbr\u003e\t    - You have Advantage on saving throws against being knocked prone or moved against your will.\u003cbr\u003e    -\u003cbr\u003e    - \u003cbr\u003e- Combat Stats (Bearturtle):\u003cbr\u003e    \u003cbr\u003e    - Evasion: 15\u003cbr\u003e    - \u003cbr\u003e    - Armor: \u003cbr\u003e\t    - 5 Physical Armor\u003cbr\u003e\t    - 3 General Armor\u003cbr\u003e    - HP: 28.\u003cbr\u003e    - Attacks:\u003cbr\u003e        - Powerful Swipe: Melee Weapon Attack, +Strength to hit, 2d6 + Str slashing damage.\u003cbr\u003e\t- Shell Slam (AOE): All creatures within a 1 meter radius must make a Dexterity save DC17 or take 2d8 bludgeoning damage.\u003cbr\u003e\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e    \u003cbr\u003eBending Slots:\u003cbr\u003e\tFire Lvl1: 2\u003cbr\u003e\tEarth Lvl1: 1\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eName: Luma\u2019tik \u2014 Glimmerkin of Cracked Mirrors  \u003cbr\u003eType: Lesser Spirit  \u003cbr\u003eDomain: Light, Trickery  \u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003eElement Level:\u003cbr\u003e\tFirebending: Level 2 \u003cbr\u003e\tEarthbending: Level 1\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003eLuma'tik.png\u003cbr\u003e- Size: Small\u003cbr\u003eTABLE:\u003cbr\u003e+----------------------+-----------+\u003cbr\u003e| Stat                 | Value     |\u003cbr\u003e+----------------------+-----------+\u003cbr\u003e| Strength (STR)       | 4 (-3)    |\u003cbr\u003e| Dexterity (DEX)      | 16 (+3)   |\u003cbr\u003e| Constitution (CON)   | 12 (+1)   |\u003cbr\u003e| Wisdom(WIS)          | 10(+0)    |\u003cbr\u003e| Intelligence(Int)    | 8(-1)     |\u003cbr\u003e+----------------------+-----------+\u003cbr\u003e\u003cbr\u003e- Ideal for infiltration, distraction, and sensory manipulation. Luma\u2019tik thrives in urban or crystal-laced environments, using its shimmering form and illusions to mislead enemies and aid allies from the shadows. Though not powerful in direct combat, it\u2019s difficult to pin down and annoying to deal with.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMovement:\u003cbr\u003e\u003cbr\u003e- Fly 15 m (hovering, effortless, emits no sound).\u003cbr\u003e    \u003cbr\u003e- Climb 10 m (can scale smooth surfaces with reflective qualities).\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAbilities in Luma\u2019tik Form:\u003cbr\u003e\u003cbr\u003e- Refraction Veil: While in bright or shifting light, Luma\u2019tik gains advantage on Stealth and cannot be targeted by opportunity attacks. This effect ends if Luma\u2019tik is in total darkness or complete silence.\u003cbr\u003e    \u003cbr\u003e- Mirage Flicker (1\u002fShort Rest): As a Bonus Action, Luma\u2019tik can create up to two illusionary duplicates for 1 minute. Each duplicate mimics its movements and grants attackers disadvantage on attack rolls until they hit Luma\u2019tik.\u003cbr\u003e    \u003cbr\u003e    \u003cbr\u003e- Glimmerjump: \u003cbr\u003e- Reaction:\u003cbr\u003e\tteleport to any point within 20 m that is brightly lit or reflects light (e.g., mirrors, water, crystal surfaces)\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCombat Stats:\u003cbr\u003e\u003cbr\u003e- Evasion: 17\u003cbr\u003e    \u003cbr\u003e- HP: 21 (fragile, relies on mobility and illusions)\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e-...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eReaction\u003cbr\u003eRange: 3  Airbending Slot meters\u003cbr\u003e                       |\u003cbr\u003e| 2       | Level 1                                                         | 2 Slots from Level 1                                                                                                                                               |\u003cbr\u003e| 3       | Level 1, Level 2                                                | 4 Slots (3 from Level 1, 1 from Level 2)                                                                                                                           |\u003cbr\u003e| 4       | Level 1, Level 2                                                | 6 Slots (4 from Level 1, 2 from Level 2)                                                                                                                           |\u003cbr\u003e| 5       | Level 1, Level 2, Level 3                                       | 9 Slots (5 from Level 1, 3 from Level 2, 1 from Level 3)                                         ...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview:\u003cbr\u003e\u003cbr\u003eEarthbenders are solid and steadfast, drawing upon the Strength of their bodies and the stability of the ground beneath them. Their techniques focus on defense, fortification, and manipulating terrain. Rather than relying on agility to avoid blows, earthbenders create barriers, raise armor ratings, and reinforce their allies. They harness Earth Charges to shape stone and metal, providing a constant, reliable source of defense and stability.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e10 +Element Level - Stress Level\u003cbr\u003eFirebending\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eFirebending Slots Progression Table\u003cbr\u003eTABLE:\u003cbr\u003e+---------+-----------------------------------------------------------------+--------------------------------------------------------------------------------------------------------------------------------------------------------------------+\u003cbr\u003e| Level   | Accessible Slots                                                | Total Moves (Newly Learned)                                                                                                                                        |\u003cbr\u003e+---------+-----------------------------------------------------------------+--------------------------------------------------------------------------------------------------------------------------------------------------------------------+\u003cbr\u003e| 1       | Level 1                                                         | 1 Slot from Level 1                                                                                                                                                |\u003cbr\u003e| 2       | Level 1                                                         | 2 Slots from Level 1                                                                                                                                               |\u003cbr\u003e| 3       | Level 1, Level 2                                                | 4 Slots (3 from Level 1, 1 from Level 2)                                                                                                                           |\u003cbr\u003e| 4       | Level 1, Level 2                                                | 6 Slots (4 from Level 1, 2 from Level 2)                                                                                                                           |\u003cbr\u003e| 5       | Level 1, Level 2, Level 3                                       | 9 Slots (5 from Level 1, 3 from Level 2, 1 from Level 3)                                          ...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003eFor each Level:\u003cbr\u003e-1 Attack Roll\u003cbr\u003e-1 Firebending DC\u003cbr\u003e+2 Damage\u003cbr\u003e\u003cbr\u003eFirebenders draw power from passion, heat, and intensity. Stress is both a resource and a danger: it fuels more powerful techniques, but too much leaves a bender unstable and at risk of losing control. The following rules convert narrative stress into a simple mechanical resource for firebending moves.\u003cbr\u003e\u003cbr\u003eWhen do you gain Stress Level:\u003cbr\u003e- For every 10 damage you take you take 1 Stress Level\u003cbr\u003e- For every Firebending Slot used in a Damaging Move\u003cbr\u003eWhen you loose Stress Level:\u003cbr\u003e- 1 Stress Level after every turn\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Stress Level --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u251c\u2500\u2500 createnpc.py\u003cbr\u003e  \u251c\u2500\u2500 createpc.py\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u251c\u2500\u2500 PCs\u003cbr\u003e          \u251c\u2500\u2500 Airwatterbendertest\u003cbr\u003e              \u2514\u2500\u2500 Airwatterbendertest Character Sheet.md\u003cbr\u003e          \u251c\u2500\u2500 Anju\u003cbr\u003e              \u2514\u2500\u2500 Anju Character Sheet.md\u003cbr\u003e          \u251c\u2500\u2500 Spirittest\u003cbr\u003e              \u2514\u2500\u2500 Spirittest Character Sheet.md\u003cbr\u003e          \u251c\u2500\u2500 TestChar\u003cbr\u003e              \u2514\u2500\u2500 TestChar Character Sheet.md\u003cbr\u003e          \u251c\u2500\u2500 TestQuick\u003cbr\u003e              \u2514\u2500\u2500 TestQuick Character Sheet.md\u003cbr\u003e          \u2514\u2500\u2500 TmpTest\u003cbr\u003e              \u2514\u2500\u2500 TmpTest Character Sheet.md\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u251c\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Fire\u003cbr\u003e                  \u251c\u2500\u2500 Firebending Moves\u003cbr\u003e                      \u251c\u2500\u2500 Level 1\u003cbr\u003e                          \u2514\u2500\u2500 Burning Fists.md\u003cbr\u003e                      \u251c\u2500\u2500 Level 2\u003cbr\u003e                          \u251c\u2500\u2500 Breath Control.md\u003cbr\u003e                          \u2514\u2500\u2500 Emberlash.md\u003cbr\u003e                      \u251c\u2500\u2500 Level 3\u003cbr\u003e                          \u2514\u2500\u2500 Rage Fuel.md\u003cbr\u003e                      \u2514\u2500\u2500 Level 4\u003cbr\u003e                          \u2514\u2500\u2500 Seething Inferno.md\u003cbr\u003e                  \u2514\u2500\u2500 Mechanics\u003cbr\u003e                      \u2514\u2500\u2500 Firebending DC.md\u003cbr\u003e          \u2514\u2500\u2500 core rules\u003cbr\u003e              \u2514\u2500\u2500 Stat Shorts\u003cbr\u003e                  \u2514\u2500\u2500 Attack Roll Modifie...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003eAvatar Spirit Check\u003cbr\u003e\ud83c\udf0c Bridge of the Spirit: A Personal Journey\u003cbr\u003e\u003cbr\u003e&gt; \"To be the Avatar is not merely to bend all elements, but to bend one\u2019s self\u2014to align will and wisdom with the needs of the world.\"  \u003cbr\u003e&gt; \u2014 Grandmaster Shuyin of the White Lotus\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udded Reflecting on Your Journey\u003cbr\u003e\u003cbr\u003eEach character stands at a crossroads between spirit and self, and your progression in this campaign is deeply rooted in how your character emotionally and spiritually reacts to the events that unfold. Reflect on:\u003cbr\u003e\u003cbr\u003e- Have recent events hardened them? Are they acting with more recklessness, cruelty, or obsession to achieve their goals\u2014driven by trauma or ambition?\u003cbr\u003e    \u003cbr\u003e- Or have they found inner balance, perhaps discovering a renewed sense of duty or compassion, and beginning to understand the role of a bridge between the mortal and spiritual worlds?\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eThis reflection influences your na and will guide what type of power you unlock next.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd25 Paths of Power\u003cbr\u003e\u003cbr\u003eWhen your character increases their Bridge Level, they may choose one of the following paths, shaped by how they have grown:\u003cbr\u003e\u003cbr\u003eChaotic Awakening\u003cbr\u003e\u003cbr\u003eFor those who pursue strength, vengeance, or control without regard for balance. Unlock a new bending slot in an element already known (but not your origin element).  \u003cbr\u003eExample: A waterbender who has learned firebending may now gain a second firebending move.\u003cbr\u003e\u003cbr\u003eHarmonic Enlightenment\u003cbr\u003e\u003cbr\u003eFor those who embrace their role as a bridge between worlds. Unlock a new bending element, representing spiritual expansion and Avatar-like growth.  \u003cbr\u003eExample: An earthbender may now begin learning airbending.  \u003cbr\u003eAdditionally, you may gain access to rare spiritual techniques (GM approval), such as Spirit-Bending, Healing Flames, Echobending, etc., reflecting your evolving balance and connection to the Avatar Spirit.\u003cbr\u003e\u003cbr\u003e&gt; Choose base...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAvatar Spirit Check\u003cbr\u003e\u003cbr\u003eRoll a d20 as part of a spirit-focused ritual or when prompted by the GM (typically at key story beats or after using a Spirit Stone).\u003cbr\u003e\u003cbr\u003e- If the roll is even: you gain a number of temporary Spiritbending spellslots equal to the d20 result. These slots last until the end of the current scene or until spent, whichever comes first.\u003cbr\u003e- If the roll is odd: you do not gain slots, but you receive one Spirit Echo \u2014 a small, narratively useful boon (example: advantage on one Spiritbending check, a single short vision providing a clue, or temporary insight on a spirit's motive). The GM chooses the precise echo based on context.\u003cbr\u003e\u003cbr\u003eRules &amp; limits (assumptions \u2014 adjust with GM):\u003cbr\u003e\u003cbr\u003e- Maximum gained slots cannot exceed the character's Bridge Level (or another GM-set cap).\u003cbr\u003e- This check is usually available once per long rest unless a Spirit Stone or special ritual grants repeated checks.\u003cbr\u003e- Spirit slots gained are of the lowest available Spiritbending tier and must be used for Spiritbending moves or effects.\u003cbr\u003e\u003cbr\u003eExample:\u003cbr\u003e\u003cbr\u003e- You roll a d20 and get 14 (even). You gain 14 temporary Spiritbending spellslots (subject to the GM cap). You spend 2 of them to cast a Spirit Ward and keep the rest until the end of the scene.\u003cbr\u003e\u003cbr\u003eAvatar Spirit Bridge Level\u003c\u002fspan\u003e","10 +Element Level","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eprogression table\u003cbr\u003eTABLE:\u003cbr\u003e+---------+-----------------------------------------------------------------+--------------------------------------------------------------------------------------------------------------------------------------------------------------------+\u003cbr\u003e| Level   | Accessible Slots                                                | Total Moves (Newly Learned)                                                                                                                                        |\u003cbr\u003e+---------+-----------------------------------------------------------------+--------------------------------------------------------------------------------------------------------------------------------------------------------------------+\u003cbr\u003e| 1       | Level 1                                                         | 1 Slot from Level 1                                                                                                                                                |\u003cbr\u003e| 2       | Level 1                                                         | 2 Slots from Level 1                                                                                                                                               |\u003cbr\u003e| 3       | Level 1, Level 2                                                | 4 Slots (3 from Level 1, 1 from Level 2)                                                                                                                           |\u003cbr\u003e| 4       | Level 1, Level 2                                                | 6 Slots (4 from Level 1, 2 from Level 2)                                                                                                                           |\u003cbr\u003e| 5       | Level 1, Level 2, Level 3                                       | 9 Slots (5 from Level 1, 3 from Level 2, 1 from Level 3)                                                            ...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile\u003cbr\u003e\u003cbr\u003eSpiritbending represents techniques and rituals that draw on the Avatar Spirit or local spirit presences. These moves often focus on communication, protection, travel between worlds, and subtle influence rather than raw damage.\u003cbr\u003e\u003cbr\u003eHow it works (tiny contract):\u003cbr\u003e\u003cbr\u003e- Resource: Spiritbending slots. These come from your Bridge Level, Spirit Stones, and occasional Avatar Spirit Checks.\u003cbr\u003e- Use: Spend slots to cast Spiritbending moves (see Spiritbending Moves.md).\u003cbr\u003e- Limits: The GM may cap maximum temporary slots gained from checks or stones to preserve balance.\u003cbr\u003e\u003cbr\u003eWhen to use:\u003cbr\u003e\u003cbr\u003e- During rituals, when interacting with spirits, when entering spirit-touched locations, or as part of major story beats involving the Avatar Spirit.\u003cbr\u003e\u003cbr\u003eRisks:\u003cbr\u003e\u003cbr\u003e- Spiritbending can attract attention from powerful spirits. Overuse or reckless bargaining may cause hauntings, covenants, or spirit debt.\u003cbr\u003e\u003cbr\u003eQuick references:\u003cbr\u003e\u003cbr\u003e- Moves and examples: Spiritbending Moves\u003cbr\u003e- Mechanics for gaining slots: Avatar Spirit Check\u003cbr\u003e- Progression and Bridge mechanics: Avatar Spirit Bridge Level\u003cbr\u003e\u003cbr\u003eTeam-up Moves\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Spiritbending --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Spirit\u003cbr\u003e                  \u251c\u2500\u2500 ExpandedCollections\u003cbr\u003e                      \u251c\u2500\u2500 ExpandedAvatar Spirit Bridge Level.md\u003cbr\u003e                      \u2514\u2500\u2500 ExpandedSpiritbending Moves.md\u003cbr\u003e                  \u251c\u2500\u2500 Mechanics\u003cbr\u003e                      \u2514\u2500\u2500 Avatar Spirit Check.md\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending Moves\u003cbr\u003e                      \u2514\u2500\u2500 Spiritbending Moves.md\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile\u003cbr\u003eCollectionfile \u003cbr\u003eSpiritbending Moves\u003cbr\u003e\u003cbr\u003eSpiritbending moves are special techniques that use the Avatar Spirit's connection to the Spirit World. They tend to be more narrative and rarely purely destructive \u2014 instead focusing on influence, protection, communication, and spiritual transformation.\u003cbr\u003e\u003cbr\u003eCore contract:\u003cbr\u003e\u003cbr\u003e- Inputs: Spiritbending slots (from Bridge Level, Spirit Stones, or Avatar Spirit Checks).\u003cbr\u003e- Outputs: A move effect (see moves below).\u003cbr\u003e- Failure modes: On a failed GM opposed roll or failed concentration, some spirit effects can backfire or produce an unintended Spirit Echo.\u003cbr\u003e\u003cbr\u003eSample Moves\u003cbr\u003e\u003cbr\u003e1. Spirit Ward (cost: 2 slots)\u003cbr\u003e\u003cbr\u003e- Effect: Create a protective aura that grants allies within 3m + (1m \u00d7 slots used) advantage on Spirit-related saves for X minutes.\u003cbr\u003e\u003cbr\u003e2. Soul Sight (cost: 1 slot)\u003cbr\u003e\u003cbr\u003e- Effect: You and one ally can see invisible spirits or spirit effects for 1 minute. Provides a single insight on a spirit's nature.\u003cbr\u003e\u003cbr\u003e3. Calm of Ages (cost: 3 slots)\u003cbr\u003e\u003cbr\u003e- Effect: Attempt to pacify a hostile spirit or calm an area. Target makes a WIS save vs DC = 8 + slots used; on failure the spirit is pacified for 1d6 minutes.\u003cbr\u003e\u003cbr\u003e4. Spirit Relay (cost: variable)\u003cbr\u003e\u003cbr\u003e- Effect: Spend slots to send a short message into the Spirit World (or receive one). Each slot adds clarity and range.\u003cbr\u003e\u003cbr\u003e5. Ancestral Echo (cost: 4 slots)\u003cbr\u003e\u003cbr\u003e- Effect: Temporarily call on an ancestor's skill \u2014 grant an ally a one-time automatic success on a non-combat skill check tied to the ancestor's expertise.\u003cbr\u003e\u003cbr\u003eDesign notes:\u003cbr\u003e\u003cbr\u003e- Moves should be negotiated with the GM for balance and narrative fit.\u003cbr\u003e- Spiritbending is more flexible than elemental bending: creativity and roleplay matter.\u003cbr\u003e\u003cbr\u003eSpiritbending\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Spiritbending Moves --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending ...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou may use Levels from Air and Earth .\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  Y(Earth): Yd12 Damage per projectile\u003cbr\u003e- X(Air): X Sand Projectiles\u003cbr\u003e\u003cbr\u003e- Z(Earth  Air): Z  5 meter Cone Range\u003cbr\u003e \u003cbr\u003e- One Earthbender shoots Y Sand Projectiles (rolls the Damage roll) and the Airbender controlls them to home to the X Targets)\u003cbr\u003e\u003cbr\u003eEarthbending \u003cbr\u003eAirbending\u003cbr\u003eTeam-up Moves\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eLevel 3\u003cbr\u003e\u003cbr\u003e  - Range: 3  Firebending Slot meters.\u003cbr\u003e  - Duration: 2 rounds Concentration.\u003cbr\u003e  - Create a mirage of heat, imposing disadvantage on attack rolls against creatures within a 10-foot radius of a point you choose.\u003cbr\u003eFirebending\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  X: X number of projectiles \u003cbr\u003e-  Y: Yd6 Damage per projectile\u003cbr\u003e \u003cbr\u003e- One waterbender shoots X Water Projectiles (rolls the attack role) and the other one Freezes them  rolls the damage rolls)\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003eTeam-up Moves\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eMust be initiated by at least two Waterbenders.  \u003cbr\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  X: X  10 Barrier Armor \u003cbr\u003e-  Y: Y  5 Healing at the start of their turn\u003cbr\u003e\u003cbr\u003e- Encase a willing ally in a jagged prism of glacial ice with a liquid healing core.\u003cbr\u003e    \u003cbr\u003e- The ally immediately gains the effects of Barrier Armor\u003cbr\u003e    \u003cbr\u003e- At the start of their next turn, as the ice thaws, they are healed for 2 \u00d7 Y but their movement is halved.\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003eTeam-up Moves\u003cbr\u003eHealing\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003eIf Concentration is not broken half the Water Charges are refunded.\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Cyclic Flow --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u251c\u2500\u2500 graphs\u003cbr\u003e          \u2514\u2500\u2500 Players Partwikigraphtreemap.html\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Water\u003cbr\u003e                  \u251c\u2500\u2500 ExpandedCollections\u003cbr\u003e                      \u2514\u2500\u2500 ExpandedWater Charges.md\u003cbr\u003e                  \u251c\u2500\u2500 Mechanics\u003cbr\u003e                      \u2514\u2500\u2500 Water Charges.md\u003cbr\u003e                  \u2514\u2500\u2500 Waterbending Moves\u003cbr\u003e                      \u251c\u2500\u2500 Level 1\u003cbr\u003e                          \u2514\u2500\u2500 Healing Water.md\u003cbr\u003e                      \u251c\u2500\u2500 Level 2\u003cbr\u003e                          \u2514\u2500\u2500 Water Tentacles.md\u003cbr\u003e                      \u2514\u2500\u2500 Level 3\u003cbr\u003e                          \u251c\u2500\u2500 Complete Cyclic Reflow.md\u003cbr\u003e                          \u2514\u2500\u2500 Healing Mist.md\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003eWater Charges represent the amount of water available for a water-bender to manipulate.\u003cbr\u003e\u003cbr\u003eWaterbottle Charges \u003cbr\u003e\u003cbr\u003e- Environmental Influence:  \u003cbr\u003e    The number of Water Charges available at the start of combat or during an encounter depends on the setting. Feel free to get creative where to find water.:\u003cbr\u003e    \u003cbr\u003e    - Desert\u002fDry Area: 0 Water Charges (minimum water source).\u003cbr\u003e    - Humid Area: 5-10 Water Charges.\u003cbr\u003e    - Near Water Source (Lake, Ocean, etc.): 15 Water Charges.\u003cbr\u003e    - In Lake, Ocean, etc.: 50+ charges\u003cbr\u003e\t    \u003cbr\u003e- Restoring Water Charges:\u003cbr\u003e    \u003cbr\u003e    - Skill Checks: A waterbender can perform a skill check to draw water from their surroundings DC is determined by how dry the area is. Success restores Water Charges, depending on the environment.\u003cbr\u003e    - Abilities: Certain abilities allow Water Charges recovery or Cyclic Flow.\u003cbr\u003e    \u003cbr\u003eWaterbending\u003cbr\u003eWaterbottle Charges\u003cbr\u003eLevel 1\u003cbr\u003eLevel 2\u003cbr\u003eLevel 3\u003cbr\u003eLevel 4\u003cbr\u003eLevel 5\u003cbr\u003eLevel 6\u003cbr\u003eLevel 7\u003cbr\u003eLevel 8\u003cbr\u003eLevel 9\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Water Charges --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u251c\u2500\u2500 createnpc.py\u003cbr\u003e  \u251c\u2500\u2500 createpc.py\u003cbr\u003e  \u251c\u2500\u2500 Players Part\u003cbr\u003e      \u251c\u2500\u2500 graphs\u003cbr\u003e          \u2514\u2500\u2500 Players Partwikigraphtreemap.html\u003cbr\u003e      \u251c\u2500\u2500 PCs\u003cbr\u003e          \u251c\u2500\u2500 Airwatterbendertest\u003cbr\u003e              \u2514\u2500\u2500 Airwatterbendertest Character Sheet.md\u003cbr\u003e          \u251c\u2500\u2500 Anju\u003cbr\u003e              \u251c\u2500\u2500 Anju Character Sheet.md\u003cbr\u003e              \u2514\u2500\u2500 Character Sheet.md\u00
