erate new token\u201d.\u003cbr\u003e    \u003cbr\u003e- Set:\u003cbr\u003e    \u003cbr\u003e    - Scopes: Select repo.\u003cbr\u003e        \u003cbr\u003e    - Expiration: Choose no expiration (recommended for backups).\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eStep 3 \u2014 Install the Obsidian Git Plugin\u003cbr\u003e\u003cbr\u003eIn Obsidian:\u003cbr\u003e\u003cbr\u003e- Go to Settings \u2192 Community plugins.\u003cbr\u003e    \u003cbr\u003e- Enable community plugins.\u003cbr\u003e    \u003cbr\u003e- Search for \u201cObsidian Git\u201d and install it.\u003cbr\u003e    \u003cbr\u003e- Restart Obsidian.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eWikigraph recolor settings\u003cbr\u003e\u003cbr\u003e&lt;!-- lines of the form: path=#rrggbb --&gt;\u003cbr\u003e\u003cbr\u003e\u002fBending Rules\u002f=#2f2f2f\u003cbr\u003e\u002fAir\u002f=#aeeef0\u003cbr\u003e\u002fEarth\u002f=#d6c89a\u003cbr\u003e\u002fFire\u002f=#ffb3b3\u003cbr\u003e\u002fNPCs\u002f=#75C99D\u003cbr\u003e\u002fPCs\u002f=#000000\u003cbr\u003e\u002fSpirit\u002f=#FFF0FF\u003cbr\u003e\u002fTeam-up Moves\u002f=#c9c9c9\u003cbr\u003e\\\u002fWater\u002f=#a3c7ff\u003cbr\u003e\u003cbr\u003ePer-NPC pastel overrides (generated)\u003cbr\u003e\u003cbr\u003e\u002fAirbendertest\u002f=#aeeef0\u003cbr\u003e\u002fFirebender\u002f=#ffb3b3\u003cbr\u003e\u002fLotus\u002f=#ffbdbf\u003cbr\u003e\u002fMaster Baezu\u002f=#dacca5\u003cbr\u003e\u002fThe Night Bloom\u002f=#d6c89a\u003cbr\u003e\u002funsorted\u002f=#b3eef0\u003cbr\u003e\\\u002fWaterbender\u002f=#a3c7ff\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eTABLE:\u003cbr\u003e+---------------------------+-------+-------+-------+-------+-------+-------+---------+---------+-------+--------+----------+----------------------+--------------+\u003cbr\u003e| Name                      | STR   | DEX   | CON   | INT   | WIS   | CHA   | Water   | Earth   | Air nuals and provides the common commands and workflows you will use every day.\u003cbr\u003e\u003cbr\u003eContents\u003cbr\u003e\u003cbr\u003e  - Quick commands\u003cbr\u003e  - Typical workflows\u003cbr\u003e  - Integration map (which scripts call which)\u003cbr\u003e  - Where outputs land\u003cbr\u003e  - Quick troubleshooting pointers\u003cbr\u003e\u003cbr\u003eQuick commands\u003cbr\u003e\u003cbr\u003e  - Create a PC (single):\u003cbr\u003e    bash\u003cbr\u003e    python3 createpc.py --name Anju --str 4 --dex 4 --con 2 --int 3 --wis 3 --cha 2 --water 3 --run-update --make-graphs\u003cbr\u003e  \u003cbr\u003e\u003cbr\u003e  - Update a single sheet (compute derived stats):\u003cbr\u003e    bash\u003cbr\u003e    python3 updatechar.py --pc Anju\u003cbr\u003e    \u003cbr\u003e  - Sync all PCs\u002fNPCs from input tables and regenerate graphs:\u003cbr\u003e    bash\u003cbr\u003e    python3 updatechar.py --sync\u003cbr\u003e    \u003cbr\u003e  - Regenerate graphs for everything or a specific PC (exact command you requested):\u003cbr\u003e    bash\u003cbr\u003e    python3 Wikigraphs.py --root \"$(pwd)\" --out graphs\u003cbr\u003e    \u003cbr\u003e    (or for a single PC with embedded plotly JS):\u003cbr\u003e    bash\u003cbr\u003e    python3 Wikigraphs.py --pc Anju --embed --verbose\u003cbr\u003e    \u003c...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e&lt;!-- See MANUALS\u002fUsageGuide.md for a short summary of all manuals --&gt;\u003cbr\u003e\u003cbr\u003e\ud83d\udd04 How to Sync Your Vault (Git + Collectionfiles)\u003cbr\u003e\u003cbr\u003eTo sync your local vault with the remote repository and automatically update all collectionfiles (backlink blocks):\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython -c \"from WikiFileSystemManager import Sync; Sync()\"\u003cbr\u003e\u003cbr\u003eTo manually recreate all collectionfiles (backlink blocks) without syncing:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --recreate-collectionfiles\u003cbr\u003e\u003cbr\u003eThis will:\u003cbr\u003e\u003cbr\u003e- Stage, commit, and push all local changes\u003cbr\u003e- Pull and merge the latest from origin\u002fmain\u003cbr\u003e- Recreate all collectionfiles (backlink blocks)\u003cbr\u003e- Commit and push any new collectionfile changes\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\ude80 Quickstart\u003cbr\u003e\u003cbr\u003eCopy-paste friendly commands. See also: WikiFileSystemManager (Manual), WikiFileSystemManager (FAQ)\u003cbr\u003e\u003cbr\u003e&gt; Tips: Start with --dry-run, scope with --ext .md, keep backups with --backup .bak.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eSafe wiki-link bracketing\u003cbr\u003e\u003cbr\u003eBracket plain mentions, skipping already-linked:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --find \"Bumi\" --bracket --dry-run\u003cbr\u003e\u003cbr\u003epython WikiFileSystemManager.py --ext .md --find \"Bumi\" --bracket --backup .bak\u003cbr\u003e\u003cbr\u003eLiteral find\u002freplace\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --find \"Omashu\" --replace \"City of Omashu\" --backup .bak\u003cbr\u003e\u003cbr\u003eCase-sensitive:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --case-sensitive --find \"Spirit\" --replace \"spirit\" --backup .bak\u003cbr\u003e\u003cbr\u003eWith punctuation\u002fspecial chars (still literal):\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --find \"old\" --replace \"new\" --backup .bak\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eScope control\u003cbr\u003e\u003cbr\u003eOnly session logs:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py Sessions --ext .md --include \"\u002fSession.md\" --find \"Appa\" --replace \"Appa the Sky Bison\"\u003cbr\u003e\u003cbr\u003eExclude extra dirs:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e&lt;!-- See MANUALS\u002fUsageGuide.md for a short summary of all manuals --&gt;\u003cbr\u003e\u003cbr\u003ePurpose\u003cbr\u003e\u003cbr\u003eWikigraphs.py scans an Obsidian-style vault (or any folder of markdown\u002ftext files) and writes Plotly Sunburst and Treemap HTML visualizations that show the directory\u002ffile hierarchy, sizes (or counts), and sanitized Markdown content inside nodes.\u003cbr\u003e\u003cbr\u003eThis manual explains usage, CLI options, recolor persistence, and a few implementation notes so you can tune and extend behavior.\u003cbr\u003e\u003cbr\u003eExample workflows\u003cbr\u003e\u003cbr\u003e- updates All PC graphs:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython3 updatechar.py --all\u003cbr\u003e\u003cbr\u003e- Regenerate graphs:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython3 Wikigraphs.py --root \"$(pwd)\" --out graphs\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython3 Wikigraphs.py --root \"$(pwd)\" --out graphs --child-spread 0.7\u003cbr\u003e\u003cbr\u003eQuick copy-paste commands\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003eGenerate graphs for the current vault and write into .\u002fgraphs (default)\u003cbr\u003epython3 Wikigraphs.py --root \"$(pwd)\" --out graphs\u003cbr\u003e\u003cbr\u003eGenerate graphs for a single PC folder (e.g. Players Part\u002fPCs\u002fAnju)\u003cbr\u003epython3 Wikigraphs.py --pc Anju --verbose --embed\u003cbr\u003e\u003cbr\u003eGenerate graphs for every PC folder under Players Part\u002fPCs\u003cbr\u003epython3 Wikigraphs.py --all --verbose --embed\u003cbr\u003e\u003cbr\u003eApply a one-shot recolor directive and persist it to colorrecolors.md\u003cbr\u003epython3 Wikigraphs.py --recolor \"Rules\u002fBending Rules\u002fFire\u002f=#ff0000\"\u003cbr\u003e\u003cbr\u003eApply stored recolors only (do not modify colorrecolors.md)\u003cbr\u003epython3 Wikigraphs.py --recolor\u003cbr\u003e\u003cbr\u003e- Recolor every matching Bending Rules\u002fFire subtree to red and persist:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython3 Wikigraphs.py --root \"$(pwd)\" --out graphs --recolor \"Rules\u002fBending Rules\u002fFire\u002f=#ffb3b3\"\u003cbr\u003e\u003cbr\u003e- Apply stored recolors only without changing the recolor file:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython3 Wikigraphs.py --root \"$(pwd)\" --out graphs --recolor\u003cbr\u003e\u003cbr\u003eRequirements\u003cbr\u003e\u003cbr\u003e- Python 3.8+\u003cbr\u003e- plotly (required to produce the HTML visualizations)\u003cbr\u003e- numpy (optional, used for the file-size histogram)\u003cbr\u003e\u003cbr\u003eInstall the main dep...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSee MANUALS\u002fUsageGuide.md for a short summary of all manuals\u003cbr\u003e\u003cbr\u003echarformulas conventions (short)\u003cbr\u003e\u003cbr\u003eThis document explains the recommended canonical naming for keys used in charformulas.json and a short summary of how charformulascheck.py matches tokens.\u003cbr\u003e\u003cbr\u003eCanonical key naming (recommendation)\u003cbr\u003e\u003cbr\u003e- Use human-friendly Title Case for formula keys that correspond to sheet labels: e.g. Air Level, Manually Rolled HP, Waterbending Level.\u003cbr\u003e- Avoid mixing many variants in the JSON; prefer one canonical key and add a minimal alias only when necessary for backward compatibility.\u003cbr\u003e- Prefer explicit names for single concepts (e.g., HPPERCL or Manually Rolled HP) and map them consistently in charformulas.json.\u003cbr\u003e\u003cbr\u003eExamples:\u003cbr\u003e\u003cbr\u003e- Air Level -&gt; canonical name for a character's air level.\u003cbr\u003e- Waterbending Level -&gt; water level (if you prefer Water Level use it consistently across sheets and formulas).\u003cbr\u003e- Manually Rolled HP -&gt; total manually rolled HP (add an alias like ManuallyRolledHitpoints only if needed).\u003cbr\u003e\u003cbr\u003eChecker heuristics (how charformulascheck.py works)\u003cbr\u003e\u003cbr\u003e- The checker normalizes tokens before matching:\u003cbr\u003e  - Strips common wiki\u002fmarkdown punctuation (, , (, ), |, :, ,, etc.).\u003cbr\u003e  - Collapses underscores and whitespace into canonical spaced\u002funderscore variants.\u003cbr\u003e  - Removes the substring bending for matching convenience (so Airbending \u2194 Air).\u003cbr\u003e  - Generates variants: original, spaced, underscored, lowercased, and no-bending variants.\u003cbr\u003e- Greedy longest-match extraction: the checker attempts to match longest multi-word spans against known normalized keys to reduce fragmentation (so Manually Rolled HP is matched as a single token, not three separate tokens).\u003cbr\u003e- Numeric tokens are ignored in missing-identifier reports.\u003cbr\u003e\u003cbr\u003eHow to run\u003cbr\u003e\u003cbr\u003e- From the repo root:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython3 charformulascheck.py charformulas.json\u003cbr\u003e\u003cbr\u003eThe script prints any tokens referenc...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSee MANUALS\u002fUsageGuide.md for a short summary of all manuals\u003cbr\u003e\u003cbr\u003ecreatecharManual\u003cbr\u003e\u003cbr\u003ePurpose\u003cbr\u003e\u003cbr\u003eThis short manual explains how to quickly create a Character Sheet using createpc.py and (optionally) generate the corresponding HTML graphs with Wikigraphs.py immediately after creation.\u003cbr\u003e\u003cbr\u003ePrerequisites\u003cbr\u003e\u003cbr\u003e- Python 3 available on PATH (used as python3 in examples).\u003cbr\u003e- The repository root is the current working directory when running the commands.\u003cbr\u003e- Optional tools used by the workflow:\u003cbr\u003e  - updatechar.py \u2014 computes derived stats inside the sheet (recommended).\u003cbr\u003e  - Wikigraphs.py \u2014 creates sunburst\u002ftreemap HTML files for the PC (optional).\u003cbr\u003e\u003cbr\u003eQuick single-character example\u003cbr\u003e\u003cbr\u003eCreate a character named Anju, compute derived stats, and immediately generate embedded graphs:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython3 createpc.py --name Anju \\\u003cbr\u003e  --str 4 --dex 4 --con 2 --int 3 --wis 3 --cha 2 \\\u003cbr\u003e  --water 3 --earth 1 --air 0 --fire 0 --spirit 1 \\\u003cbr\u003e  --run-update --make-graphs --embed-graphs --graphs-verbose\u003cbr\u003e\u003cbr\u003eWhat this does:\u003cbr\u003e\u003cbr\u003e- Writes Players Part\u002fPCs\u002fAnju\u002fAnju Character Sheet.md.\u003cbr\u003e- If --run-update is given and updatechar.py exists, it will run it to compute and write derived stats into the sheet.\u003cbr\u003e- If --make-graphs is given and Wikigraphs.py exists, it will run Wikigraphs.py --pc Anju (add --embed and --verbose depending on flags) and write two files:\u003cbr\u003e\u003cbr\u003e  - graphs\u002fAnjuwikigraphsunburst.html\u003cbr\u003e  - graphs\u002fAnjuwikigraphtreemap.html\u003cbr\u003e\u003cbr\u003eNPCs (DM workflow)\u003cbr\u003e\u003cbr\u003e  There is a companion script for NPCs named createnpc.py that mirrors createpc.py but targets the DM-facing NPC folder structure.\u003cbr\u003e\u003cbr\u003e  Quick single-NPC example \u2014 create a DM-facing NPC sheet, compute derived stats, and optionally generate embedded graphs:\u003cbr\u003e\u003cbr\u003e  bash\u003cbr\u003e  python3 createnpc.py --npc \"Lady Kiri\" \\\u003cbr\u003e    --str 3 --dex 2 --con 3 --int 2 --wis 4 --cha 3 \\\u003cbr\u003e    --water 2 --earth 1 --air 0 --fire 0 --sp...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSee MANUALS\u002fUsageGuide.md for a short summary of all manuals\u003cbr\u003e\u003cbr\u003eupdatecharManual\u003cbr\u003e\u003cbr\u003ePurpose\u003cbr\u003e\u003cbr\u003eShort manual for updatechar.py: how to run it, common flags, how formulas work, and how the script integrates with other automation in this repo (character creation and the bending slots updater).\u003cbr\u003e\u003cbr\u003eQuick usage\u003cbr\u003e\u003cbr\u003eUpdate a single character (auto-discover by PC name):\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython3 updatechar.py --pc Anju\u003cbr\u003e\u003cbr\u003eUpdate a specific Character Sheet file path:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython3 updatechar.py --file \"Players Part\u002fPCs\u002fAnju\u002fAnju Character Sheet.md\"\u003cbr\u003e\u003cbr\u003eThe script edits the sheet in-place and writes a backup &lt;file&gt;.bak before overwriting.\u003cbr\u003e\u003cbr\u003eFlags and behavior\u003cbr\u003e\u003cbr\u003e- --pc &lt;NAME&gt; \u2014 locate Players Part\u002fPCs\u002f&lt;NAME&gt;\u002f&lt;NAME&gt; Character Sheet.md and update it.\u003cbr\u003e- --file &lt;PATH&gt; \u2014 update the specified file.\u003cbr\u003e- --formulas &lt;PATH&gt; \u2014 load formulas from the given JSON file (defaults to charformulas.json).\u003cbr\u003e- --extend-formulas \u2014 when provided, missing formula keys are filled from built-in defaults and the combined set is used.\u003cbr\u003e- --levelup \u2014 (if supported in your version) apply level-up logic before recomputing derived stats.\u003cbr\u003e- --backup \u2014 create an explicit timestamped backup (the script already writes a .bak by default).\u003cbr\u003e\u003cbr\u003eWhat the script computes\u003cbr\u003e\u003cbr\u003e- Reads the ## Core Stats markdown table to gather STR\u002fDEX\u002fCON\u002fINT\u002fWIS\u002fCHA and other core values.\u003cbr\u003e- Reads ## Bending Levels to gather element levels.\u003cbr\u003e- Evaluates formulas from charformulas.json (or your provided file) to compute values like Max Hitpoints, Evasion, Armor, and Element DCs.\u003cbr\u003e- Inserts an \"Autogen Report\" section into the sheet that lists inferred values, applied overrides, and any unresolved formula identifiers.\u003cbr\u003e\u003cbr\u003eFormulas are simple expressions that reference other named values (e.g. 10 + CON  2). The script uses a restricted safe-eval to avoid executing arbitrary code; onl...","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Damaging Move --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Fire\u003cbr\u003e                  \u251c\u2500\u2500 Firebending Moves\u003cbr\u003e                      \u251c\u2500\u2500 Level 1\u003cbr\u003e                          \u251c\u2500\u2500 Burning Fists.md\u003cbr\u003e                          \u2514\u2500\u2500 Flame Jet.md\u003cbr\u003e                      \u2514\u2500\u2500 Level 4\u003cbr\u003e                          \u2514\u2500\u2500 Seething Inferno.md\u003cbr\u003e                  \u2514\u2500\u2500 Mechanics\u003cbr\u003e                      \u2514\u2500\u2500 Stress Level.md\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u003c\u002fspan\u003e","manual stat","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003eThe Level the character is at this Element \u003cbr\u003eso \u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Element Level --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u251c\u2500\u2500 graphs\u003cbr\u003e          \u2514\u2500\u2500 Players Partwikigraphtreemap.html\u003cbr\u003e      \u251c\u2500\u2500 PCs\u003cbr\u003e          \u2514\u2500\u2500 Mahogany\u003cbr\u003e              \u2514\u2500\u2500 Shapeshifting Forms\u003cbr\u003e                  \u2514\u2500\u2500 Level 2\u003cbr\u003e                      \u2514\u2500\u2500 Luma\u2019tik.md\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u251c\u2500\u2500 Bending Rules\u003cbr\u003e              \u251c\u2500\u2500 Air\u003cbr\u003e                  \u2514\u2500\u2500 Mechanics\u003cbr\u003e                      \u2514\u2500\u2500 Airbending DC.md\u003cbr\u003e              \u251c\u2500\u2500 Earth\u003cbr\u003e                  \u2514\u2500\u2500 mechanics\u003cbr\u003e                      \u2514\u2500\u2500 Earthbending DC.md\u003cbr\u003e              \u251c\u2500\u2500 Fire\u003cbr\u003e                  \u2514\u2500\u2500 Mechanics\u003cbr\u003e                      \u2514\u2500\u2500 Firebending DC.md\u003cbr\u003e              \u251c\u2500\u2500 Spirit\u003cbr\u003e                  \u2514\u2500\u2500 Mechanics\u003cbr\u003e                      \u2514\u2500\u2500 Spiritbending DC.md\u003cbr\u003e              \u2514\u2500\u2500 Water\u003cbr\u003e                  \u2514\u2500\u2500 Mechanics\u003cbr\u003e                      \u2514\u2500\u2500 Waterbending DC.md\u003cbr\u003e          \u2514\u2500\u2500 core rules\u003cbr\u003e              \u251c\u2500\u2500 Attack Roll.md\u003cbr\u003e              \u2514\u2500\u2500 Stat Shorts\u003cbr\u003e                  \u251c\u2500\u2500 Attack Roll Modifier.md\u003cbr\u003e                  \u2514\u2500\u2500 CL.md\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u003c\u002fspan\u003e","","","Maximum bending slots of a certain Level","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Melee --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Fire\u003cbr\u003e                  \u2514\u2500\u2500 Firebending Moves\u003cbr\u003e                      \u2514\u2500\u2500 Level 1\u003cbr\u003e                          \u2514\u2500\u2500 Burning Fists.md\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActiontype\u003cbr\u003eLevel\u003cbr\u003eAdditional attributes\u003cbr\u003e\u003cbr\u003e- Range: e.g. Self.\u003cbr\u003e- Duration: e.g. 1 Turn.\u003cbr\u003e- Description for example: Propelling yourself with gusts of air.\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e- the effect(s) of the move e.g. Spend 1 Airbending Slot to add 5  Airbending Slot meters to your movement for this turn.\u003cbr\u003e\u003cbr\u003eElement\u003c\u002fspan\u003e","d20 + STR","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003eMust be parsed from the charactersheet\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:manual stat --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 unsorted\u003cbr\u003e      \u2514\u2500\u2500 Dexterity.md\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eObsidian Plugins Setup for Developers &amp; Data Scientists\u003cbr\u003e\u003cbr\u003eThis guide covers the installation and basic setup of the best Obsidian plugins for code, data workflows, dashboards, and research.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e1. Install Plugins\u003cbr\u003e1. Open Settings \u2192 Community Plugins.\u003cbr\u003e2. Enable Safe Mode if it's disabled.\u003cbr\u003e3. Click Browse.\u003cbr\u003e4. Search and install the following plugins:\u003cbr\u003e   - Dataview\u003cbr\u003e   - Templater\u003cbr\u003e   - QuickAdd\u003cbr\u003e   - RunJS\u003cbr\u003e   - Note Toolbar\u003cbr\u003e   - Better Search Views\u003cbr\u003e   - Obsidian Tags Overview\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e2. Plugin Configuration\u003cbr\u003e\u003cbr\u003eDataview\u003cbr\u003e- Go to Settings \u2192 Dataview.\u003cbr\u003e- Enable JavaScript Queries for dynamic calculations.\u003cbr\u003e- Example query to list all datasets:\u003cbr\u003e    dataview\u003cbr\u003e    TABLE file.name, size, date\u003cbr\u003e    FROM \"datasets\"\u003cbr\u003e    SORT date DESC\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eTemplater\u003cbr\u003e- Set Template Folder Location: templates\u002f\u003cbr\u003e- Create a file dataset-template.md:\u003cbr\u003e    markdown\u003cbr\u003e{{title}}\u003cbr\u003e    Date: &lt;% tp.date.now(\"YYYY-MM-DD\") %&gt;\u003cbr\u003e    Source: &lt;% tp.file.cursor() %&gt;\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eQuickAdd\u003cbr\u003e- Create a new Capture Command \u2192 \u201cNew Dataset\u201d\u003cbr\u003e- Use the dataset-template.md to quickly add new entries.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eRunJS\u003cbr\u003e- Go to Settings \u2192 RunJS.\u003cbr\u003e- Add a snippet:\u003cbr\u003e    js\u003cbr\u003e    const data = [1,2,3,4];\u003cbr\u003e    return data.map(x =&gt; x  2);\u003cbr\u003e    \u003cbr\u003e- Run inline JS inside notes with ==js blocks.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eNote Toolbar\u003cbr\u003e- Add quick buttons for:\u003cbr\u003e    - \u201cNew Dataset\u201d\u003cbr\u003e    - \u201cRun Dataview Query\u201d\u003cbr\u003e    - \u201cOpen Dashboard\u201d\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBetter Search Views\u003cbr\u003e- Use advanced search like:\u003cbr\u003e    \u003cbr\u003e    tag:#dataset size:&gt;10MB\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eObsidian Tags Overview\u003cbr\u003e- Go to the Tags Overview pane to visualize tags as a dataset tree.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e3. Recommended Folder Structure\u003cbr\u003eplaintext\u003cbr\u003e\ud83d\udcc2 vault\u002f\u003cbr\u003e \u251c\u2500\u2500 datasets\u002f\u003cbr\u003e \u2502   \u251c\u2500\u2500 dataset1.md\u003cbr\u003e \u2502   \u251c\u2500\u2500 dataset2.md\u003cbr\u003e \u251c\u2500\u2500 dashboards\u002f...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eType: Air Nomad Offshoot  \u003cbr\u003eLocation: Cliffside plateaus bordering the Great Si Wong Desert  \u003cbr\u003eRole: High-speed messengers, scouts, and storm-chasers of the desert  \u003cbr\u003eSpecialized Style: Thermal Riding\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003e\u003cbr\u003eThe Crimson Sails are a unique, nomadic sect of Air Nomads adapted to life on the edge of the Si Wong Desert. They do not dwell in temples or static sanctuaries, but aboard elegant skiffs and gliders designed to harness the fierce thermal currents that rise from the sun-scorched sand. Painted in brilliant reds and ochres, their vessels shimmer like embers in the sky.\u003cbr\u003e\u003cbr\u003eBound by the winds and the rhythms of the desert heat, the Crimson Sails are expert couriers, capable of crossing vast expanses far faster than beasts or traditional caravans. However, their airbending is heavily dependent on the desert\u2019s thermal conditions; at night, without the rising heat, they become grounded or slow-moving.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCulture\u003cbr\u003e\u003cbr\u003e- Daybound Nomadism: Their society revolves around daylight. At night, the flotilla anchors to cliff alcoves or ruins. Festivals, meals, and gatherings are nocturnal, while travel and work occur during the heat of the day.\u003cbr\u003e    \u003cbr\u003e- Messenger Guild: The Crimson Sails operate an informal courier and intelligence network across the Earth Kingdom desert frontier. They are trusted by traders, desert clans, and outposts to deliver messages, maps, and even small goods.\u003cbr\u003e    \u003cbr\u003e- Spiritual Traditions: Though descended from the Air Nomad monastic line, the Crimson Sails follow a more animistic interpretation of airbending\u2014viewing the desert winds as living spirits that must be listened to, not commanded.\u003cbr\u003e    \u003cbr\u003e- Cliff Shrines: Instead of temples, they maintain wind shrines at high cliffs where they meditate and commune with the desert wind spirits.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAirbending Style: Thermal Riding\u003cbr\u003e\u003cbr\u003eA fast, acrobatic form of airbendin...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile\u003cbr\u003eCollectionfile\u003cbr\u003e\u003cbr\u003e&gt; Note: Incensebending is understood as a hybrid craft combining multiple bending styles. Water and earth are used to grow and prepare the organic materials; fire dries and activates them for burning; and the resulting smoke carries a blend of those influences (often shaped further by air or spirit-affiliated bending). Many incense rituals therefore require cooperative inputs from different benders and are rich in mixed-element effects.\u003cbr\u003e\u003cbr\u003eIncencebending Team-Up Techniques\u003cbr\u003eAvatar Spirit Bridge Level\u003cbr\u003eX = y\\z\u003cbr\u003e\u003cbr\u003e- are the number of bending \u002f ritual slots contributed by each participant.\u003cbr\u003e- This encourages coordinated, complementary rituals rather than one person carrying the whole effect.\u003cbr\u003e- X = y \u00d7 z.\u003cbr\u003e\u003cbr\u003e&gt; Example:\u003cbr\u003e&gt;\u003cbr\u003e&gt; - Spirit-bender contributes 2 slots (y = 2)\u003cbr\u003e&gt; - Airbender contributes 3 (z = 3)\u003cbr\u003e&gt;   \u2192 X = 2 \u00d7 3 = 6\u003cbr\u003e\u003cbr\u003eThese incense rituals are subtle but potent \u2014 they alter minds, environments, and the thin veil between worlds. Each scales with X and changes flavor based on the blend used.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf2b\ufe0f Sanctified Veil (White Juniper Blend)\u003cbr\u003e\u003cbr\u003eMust be initiated by an Air- or Spirit-affiliated bender in line of sight\u003cbr\u003e\u003cbr\u003e&gt; A delicate, shimmering smoke hangs in the air, softening perception and muffling intent.\u003cbr\u003e\u003cbr\u003e- Effect: Creatures within the area gain disadvantage on Perception checks and Wisdom saves for social or detection rolls for the duration. Allies chosen by the casters gain advantage on stealth and deception checks instead.\u003cbr\u003e- Radius: 3 meter \\ X\u003cbr\u003e- Duration: X \u00d7 2 minutes\u003cbr\u003e- Special: If X \u2265 10, the veil extends an extra 50% radius and grants allies a one-time free Hide action while moving silently.\u003cbr\u003e\u003cbr\u003e- Narrative Use: Move through guarded temples, stage an ambush, or protect a ritual site from prying eyes.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd25 Ember-Perfume Lure (Saffron Ash Incense)\u003cbr\u003e\u003cbr\u003eMust ...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLocation and Culture:\u003cbr\u003e\u003cbr\u003eNestled at the edge of the Si Wong Desert\u2019s shifting dunes, the Village of Mahzeen stands as a rare bastion of life in the arid wilderness. The settlement lies just a half-day\u2019s journey from an ancient Earthbending Temple, its sandstone spires visible on the distant horizon. Though not large, Mahzeen is renowned for its skilled Sandbenders, who have perfected a unique defensive technique that harnesses the versatile power of sand.\u003cbr\u003e\u003cbr\u003eThe villagers live in dome-shaped tents woven from desert fibers, arranged around a central oasis fed by a hidden spring. Worn banners and intricate stone carvings display their heritage: guardians of the desert\u2019s secrets, proud custodians of a bending style that focuses on defense, endurance, and cunning ambush tactics. These Sandbenders follow a strict code of balance, taught to them by the temple monks long ago.\u003cbr\u003e\u003cbr\u003eThe Sandbending Technique: \u201cSpiked Sand Sphere\u201d\u003cbr\u003e\u003cbr\u003eThe hallmark ability of Mahzeen\u2019s Sandbenders is the creation of a swirling sphere of sand that hardens into a protective shell adorned with razor-like spikes of hardened silica. Both a shield and a weapon, it reflects their philosophy\u2014protection first, then retribution.\u003cbr\u003e\u003cbr\u003eMechanics:\u003cbr\u003e\u003cbr\u003e- Cost: 3 Earth (or Sand) Charges\u003cbr\u003e    \u003cbr\u003e- Type: Action\u003cbr\u003e    \u003cbr\u003e- Range: Self\u003cbr\u003e    \u003cbr\u003e- Effect:  \u003cbr\u003e    The Sandbender calls upon the shifting dunes, pulling grains of sand from the ground and condensing them into a floating sphere around their body. The sphere grants temporary hit points and can lash out with sharp spikes.\u003cbr\u003e    \u003cbr\u003e    - Temporary Hit Points (THP): Gain THP equal to 3 times your level (or a number appropriate for your system) when you form the Spiked Sand Sphere.\u003cbr\u003e    - Defensive Bonus: While the sphere is active, you gain +1 to your Evasion Score and +2 to your AR (or equivalent defensive bonus in your ruleset).\u003cbr\u003e    - Duration: Concentration, up to 1 mi...","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- Session 1 The Spirit Within\u003cbr\u003e- The Lotus Fractures\u003cbr\u003e- Building Alliances\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Session 1 The Spirit Within\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- The Spirit Gauge\u2019s Purpose\u003cbr\u003e- Betrayals and Deceptions\u003cbr\u003e- The Shadowed Spirits\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- The Avatar\u2019s Legacy\u003cbr\u003e- The Final Confrontation\u003cbr\u003e- The Avatar Reborn\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eTitle: Shattered Spirit, Rising Lotus\u003cbr\u003e\u003cbr\u003e- The Ceremony of the Lotus\u003cbr\u003e- Main Story Arc A Shattered Avatar Spirit\u003cbr\u003e- Recurring Themes and Player Agency\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Recurring Themes and Player Agency\u003cbr\u003e- The Lotus\u003cbr\u003e- The Ceremony of the Lotus\u003cbr\u003e- Main Story Arc A Shattered Avatar Spirit\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe Lotus\u003cbr\u003e\u003cbr\u003e- Home of the ceremony and spiritual hub.\u003cbr\u003e\u003cbr\u003eCeremony of the Resonance\u003cbr\u003e\u003cbr\u003e- Celebration of unity, balance, and bending mastery.\u003cbr\u003e\u003cbr\u003eNight Bloom\u003cbr\u003e\u003cbr\u003e- Radical faction opposing the Avatar\u2019s central role.\u003cbr\u003e\u003cbr\u003eResonance Jade\u003cbr\u003e\u003cbr\u003e- Artifact measuring spiritual energy.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAct 1: Unveiling the Threat\u003cbr\u003e\u003cbr\u003e- PCs discover they hold fragmented aspects of the Avatar Spirit.\u003cbr\u003e- Internal conflict: heightened bending abilities without unity.\u003cbr\u003e- Night Bloom\u2019s origins tied to a Lotus Fracture.\u003cbr\u003e\u003cbr\u003eAct 2: The Rise of the Night Bloom\u003cbr\u003e\u003cbr\u003e- Spirit Gauge\u2019s potential to destabilize balance.\u003cbr\u003e- Betrayals within the White Lotus.\u003cbr\u003e- Growing attacks from corrupted spirits.\u003cbr\u003e\u003cbr\u003eAct 3: The Broken Avatar\u003cbr\u003e\u003cbr\u003e- Truth of the Avatar\u2019s death and shattered spirit.\u003cbr\u003e- Final confrontation: Combine spirits to reform Avatar or share the essence among the group.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e1. Balance vs. Independence:  \u003cbr\u003e    Explores centralized power vs. collective leadership.\u003cbr\u003e    \u003cbr\u003e2. Personal Growth:  \u003cbr\u003e    Each PC\u2019s arc reflects their fragment of the Avatar Spirit.\u003cbr\u003e    \u003cbr\u003e3. Moral Dilemmas:  \u003cbr\u003e    The Night Bloom\u2019s ideals resonate with many; their morality isn\u2019t black and white.\u003cbr\u003e    \u003cbr\u003e4. Worldbuilding:  \u003cbr\u003e    Encourage player input for designing clans, bending styles, and spiritual entities.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eScene Setting:\u003cbr\u003e\u003cbr\u003eThe campaign begins at the serene Temple of the The Lotus, where benders from across the world gather for the annual Ceremony of the Lotus.\u003cbr\u003e\u003cbr\u003e- PCs arrive as prodigies of their respective arts.\u003cbr\u003e- Subtle unease: elders whisper of spiritual disturbances.\u003cbr\u003e- PCs feel a fleeting resonance, but there\u2019s no spiritual response\u2014an ill omen.\u003cbr\u003e\u003cbr\u003eThe Attack on the Ceremony:\u003cbr\u003e\u003cbr\u003e- Smokebomb and the Voice:  \u003cbr\u003e    A black mist explosion (orchestrated by Isai Trekal) disrupts the ceremony.  \u003cbr\u003e    Voice: \u201cThe age of bending submission is over...\u201d\u003cbr\u003e    \u003cbr\u003e- Artifact Theft:  \u003cbr\u003e    The Order of the Night Bloom steals the Resonance Jade.\u003cbr\u003e    \u003cbr\u003e- Rogue Spirit Attack:  \u003cbr\u003e    PCs fend off a corrupted spirit, feeling faint resonance from the ritual during combat.\u003cbr\u003e    \u003cbr\u003e- Aftermath:  \u003cbr\u003e    The artifact is gone, and the PCs are tasked with investigating the theft.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Night Bloom\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eStory\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Act 2 The Rise of the Night Bloom\u003cbr\u003e- Campaign Overview\u003cbr\u003e- Act 1 Unveiling the Threat\u003cbr\u003e- The Ceremony of the Lotus\u003cbr\u003e- Key Groups and Concepts\u003cbr\u003e- Recurring Themes and Player Agency\u003cbr\u003e- Main Story Arc A Shattered Avatar Spirit\u003cbr\u003e- Session 1 The Spirit Within\u003cbr\u003e- Act 3 The Broken Avatar\u003cbr\u003e- Modules\u003cbr\u003e- \u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOrganisations\u003cbr\u003eOverview:\u003cbr\u003e\u003cbr\u003eThe Lotus is a venerable organization dedicated to the balance of the world, acting as spiritual guides and protectors of harmony. They host the annual Ceremony of the Resonance, symbolizing their commitment to unity among benders.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eUniform Design:\u003cbr\u003e\u003cbr\u003e- Colors:  \u003cbr\u003e    White and gold, symbolizing purity and enlightenment, with accents of light blue to represent spiritual connection.\u003cbr\u003e    \u003cbr\u003e- Style:\u003cbr\u003e    \u003cbr\u003e    - Flowing robes for spiritual leaders, with a lotus emblem embroidered on the chest.\u003cbr\u003e    - Soldiers wear sturdy uniforms with plated armor on shoulders and bracers, designed for mobility and defense.\u003cbr\u003e- Details:\u003cbr\u003e    \u003cbr\u003e    - A sash or belt with a lotus motif, denoting rank.\u003cbr\u003e    - Masks for combat troops, styled after serene and neutral faces, emphasizing their role as impartial protectors.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Mistress Akira Meiyu\u003cbr\u003e- Armor\u003cbr\u003e- Strength\u003cbr\u003e- Stonewarden Garon\u003cbr\u003e- Wisdom\u003cbr\u003e- Grandmaster Iroh Tanaka\u003cbr\u003e- The Lotus\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eFirebending\u003cbr\u003eWaterbending\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCore Stats\u003cbr\u003eTABLE:\u003cbr\u003e+----------------+---------+--------+-------------------------+\u003cbr\u003e| Stat           | Value   | note   | Automatically updated   |\u003cbr\u003e+----------------+---------+--------+-------------------------+\u003cbr\u003e| Strength       |         |        | N                       |\u003cbr\u003e| Dexterity      |         |        | N                       |\u003cbr\u003e| Constitution   |         |        | N                       |\u003cbr\u003e| Intelligence   |         |        | N                       |\u003cbr\u003e| Wisdom         |         |        | N                       |\u003cbr\u003e| Charisma       |         |        | N                       |\u003cbr\u003e+----------------+---------+--------+-------------------------+\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eVital Stats (auto)\u003cbr\u003eTABLE:\u003cbr\u003e+------------------+---------+--------+-------------------------+\u003cbr\u003e| Attribute        | Value   | note   | Automatically updated   |\u003cbr\u003e+------------------+---------+--------+-------------------------+\u003cbr\u003e| Max Hit Points   |         |        | Y                       |\u003cbr\u003e| Evasion          |         |        | Y                       |\u003cbr\u003e| Armor            |         |        | Y                       |\u003cbr\u003e+------------------+---------+--------+-------------------------+\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003ePrimary Stats (optional \u002f autogenerated)\u003cbr\u003eTABLE:\u003cbr\u003e+----------------+---------+\u003cbr\u003e| Stat           | Value   |\u003cbr\u003e+----------------+---------+\u003cbr\u003e| STR            |         |\u003cbr\u003e| DEX            |         |\u003cbr\u003e| CON            |         |\u003cbr\u003e| INT            |         |\u003cbr\u003e| WIS            |         |\u003cbr\u003e| CHA            |         |\u003cbr\u003e| Air Level      | 0       |\u003cbr\u003e| Water Level    | 0       |\u003cbr\u003e| Earth Level    | 0       |\u003cbr\u003e| Fire Level     | 0       |\u003cbr\u003e| Spirit Level   | 0       |\u003cbr\u003e+----------------+---------+\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBending Levels\u003cbr\u003eTABLE:\u003cbr\u003e+-----------------------+---------+--------------------------+----+\u003cbr\u003e| Element               | Level   | Notes                   ...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e\u00a71 This is all fun and games.\u003cbr\u003e\t\u00a71.1 For many people (including the author :D) a big part of the fun is the improv theater roleplaying in TTRPGs. \u003cbr\u003e\tSome people like the Characterbuilding and creating a personality and fleshed out character how they imagine it. Both are valid but it needs to be communicated that i want to keep it generally in a very \"yes and...\" kind of style but always accept a \"no id rather have it like...\".\u003cbr\u003e\t\t1.1.1 That being said this also applies to world building and lore so feel free to worldbuild yourself a bit either spontanously during roleplay or planned out for bigger worldbuilding projects (e.g. \"I had an idea for a watertribe that uses plantbending algae as boats for their lake\"(and discussed with the GM)).\u003cbr\u003e\u003cbr\u003e\u00a72 I will try my best to nerve and buff bending moves how i think fits best. \u003cbr\u003e\t2.1 This may also include giving them more roleplaying opportunities to find bending teachers or similar to acquire new skills and bending Moves.\u003cbr\u003e\u003cbr\u003e\u00a73 I'm trying some more experimental mechanics that may be fun for me but not so fun for others. So always accept constructive feedback and\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDefensive:\u003cbr\u003e\tMostly like DnD but Armor class is now called evasion and there is an Armor  for every kind of Damage (Damage Resistance) that reduces the damage taken per instance.\u003cbr\u003e\tThe Damage types will be the same as in Dnd\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Armor\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eHow hard it is to hit you\u003cbr\u003eBase Evasion: 10 + Dex + Airbending Level\u003c\u002fspan\u003e","These are attacks you only have under specific limited conditions or have to study from a master to learn.","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003ePROBABLY NEEDS REBALANCING ON THE GO ALL THE TIME\u003cbr\u003eJoining Moves:  \u003cbr\u003eBenders can combine their abilities to create more powerful or creative effects, guided by the \"rule of cool.\" This allows for dynamic and collaborative gameplay that rewards teamwork.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eConditions to Join:\u003cbr\u003e\u003cbr\u003e- Proximity: You must be within 10 feet of the ally initiating the Move.\u003cbr\u003e- Action Type: Joining the Move requires using your Reaction.\u003cbr\u003e- Move Compatibility: The same Move does not need to be performed at the same Level Slot as the initiating Bender.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEffect:  \u003cbr\u003eCombining Moves enhances their overall power or effect. For example, if an ally uses Fireburst, and you join in, the resulting effect could be strong enough to burst through a stone wall.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOptional Variant:  \u003cbr\u003eYou can also combine different Moves if you can explain how they interact. For instance:\u003cbr\u003e\u003cbr\u003e- A Mud Wall created by an Earthbender could be reinforced with an Ice Wall from a Waterbender, resulting in a sturdier barrier with sharp ice spike defenses.  \u003cbr\u003e    This opens opportunities for creative problem-solving and innovative combinations, adding depth to gameplay.\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Teamwork Moves --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eGlacial Temple\u003cbr\u003e\u003cbr\u003ePurpose: Spiritual sanctuary and waterbender training ground  \u003cbr\u003eArchitecture: A glimmering structure partially embedded in ice, with prayer flags fluttering around open, steam-warmed courtyards.\u003cbr\u003e\u003cbr\u003eLore:  \u003cbr\u003eBuilt above the Healing Spring of Akara, the Glacial Temple is both a spiritual hub and defensive bastion. It\u2019s home to the Order of the Veiled Mist, a sect of waterbenders trained in Mistbending \u2014 a sacred technique taught only to those deemed spiritually attuned by the Jellytee Spirit.\u003cbr\u003e\u003cbr\u003eAccess to the temple is restricted. Pilgrims may offer prayers at the base, but only those with permission from the High Acolyte may enter the inner sanctum or take water directly from the spring.\u003cbr\u003e\u003cbr\u003eTemple Customs:\u003cbr\u003e\u003cbr\u003e- No artificial fire within the inner sanctum.\u003cbr\u003e    \u003cbr\u003e- Offerings must include a piece of handwoven fabric dipped in the spring.\u003cbr\u003e    \u003cbr\u003e- All initiates take a vow of vapor \u2014 a month-long silence.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eProperties:  \u003cbr\u003eThe water is infused with natural and spiritual properties, accelerating healing, soothing pain, and purging spiritual corruption. However, overuse or removal of too much water causes the spring to become turbulent and the Jellytee Spirit to grow agitated.\u003cbr\u003e\u003cbr\u003eLimits:\u003cbr\u003e\u003cbr\u003e- Only a limited volume can be extracted per day.\u003cbr\u003e    \u003cbr\u003e- Excessive exposure can dull pain but doesn\u2019t cure deeper ailments unless sanctioned by the temple.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eForm: A luminescent, ethereal fusion of jellyfish and manatee. It drifts through the spring, emitting soft pulses of bioluminescence and humming vibrations.  \u003cbr\u003eNature: Benevolent but sensitive to imbalance and greed. When pleased, it radiates a mist that calms the mind and heals minor ailments. When disturbed, the mist becomes turbulent and can induce hallucinations or intense emotional episodes.\u003cbr\u003e\u003cbr\u003eVery emotionally unstable and the waterbenders have to be super careful not to disturb the water as the manatee starts to cry and throw a tantrum when they do.\u003cbr\u003e\u003cbr\u003e---\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLocation: Southern Water Tribe tundra, near the Glacial Temple  \u003cbr\u003ePopulation: 150 permanent residents, swelling with visitors year-round  \u003cbr\u003eNotable Feature: The Healing Spring of Akara, which emits a continuous healing mist due to the presence of the Jellytee Spirit\u003cbr\u003e\u003cbr\u003eDescription:  \u003cbr\u003eAkara is a quiet, snow-dusted village nestled against a glacial ridge. Built in concentric circles around the Healing Spring of Akara, the town's layout reflects the cultural importance of balance and flow. Small wooden homes carved with oceanic motifs cluster closer to the spring, with larger communal and guest housing further out.\u003cbr\u003e\u003cbr\u003eThe village has become a sacred pilgrimage site for the chronically ill, terminally afflicted, and spirit-touched. While the Healing Spring of Akara's waters are said to be miraculous, the villagers are extremely cautious in how much water they allow to be drawn, in reverence to the Jellytee Spirit.\u003cbr\u003e\u003cbr\u003eKey NPCs:\u003cbr\u003e\u003cbr\u003e- High Acolyte Siva: Stoic leader of the temple, acts as intermediary between villagers and the Jellytee Spirit.\u003cbr\u003e    \u003cbr\u003e- Healer Rokan: Master of the Mistbending technique, teaches selected apprentices.\u003cbr\u003e    \u003cbr\u003e- Elder Tumaq: Village elder, keeper of oral history and taboos.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWould you like to expand this into a quest hook, adventure arc, or introduce tensions like outsiders exploiting the spring?\u003cbr\u003e\u003cbr\u003eYou said:\u003cbr\u003e\u003cbr\u003egreat now also add a little monplogue of the jellytee spirit. It is super whinie and moody and cries when water gets removed\u003cbr\u003e\u003cbr\u003eChatGPT said:\u003cbr\u003e\u003cbr\u003ePerfect! Here\u2019s a whimsical and moody monologue from the Jellytee Spirit, capturing its overly emotional, whiny personality. This could be delivered during a vision in the mist or heard echoing through the spring when someone tries to take more than their share of water:\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMonologue of the Jellytee Spirit\u003cbr\u003e\u003cbr\u003e&gt; The mist thickens. Light pul...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eType: Water Tribe Island Village  \u003cbr\u003eLocation: Remote island far from the Northern Water Tribe ice shelves  \u003cbr\u003eAffinity: Waterbending, Spirits\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003e\u003cbr\u003eKugluktup is a secretive and remote waterbending village located on a rugged island surrounded by turbulent seas. It lies several days' journey south of the Northern Water Tribe's territories. Due to its isolation and history of raids by pirates and foreign explorers, the villagers are notoriously wary and openly hostile to outsiders. Their waterbending traditions have diverged significantly from the mainstream Northern Tribe practices, adapting to a more self-sufficient, ocean-based survival.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eUnique Features\u003cbr\u003e\u003cbr\u003eOceanwater Desalination Technique\u003cbr\u003e\u003cbr\u003eKugluktup's greatest innovation is their sacred Desalination Ritual, used to convert seawater into fresh water. This process is spiritual as much as it is practical and is central to village survival. It involves collaboration with the village's guardian spirit, the Eelstar.\u003cbr\u003e\u003cbr\u003eThe Eelstar\u003cbr\u003e\u003cbr\u003eA hybrid spirit beast, the Eelstar resembles five long eels fused at the tail to form a living starfish-like body. It is an ancient spirit bound to the island, often dwelling in underwater caverns accessible only through intricate coral tunnels.\u003cbr\u003e\u003cbr\u003e- Elemental Power: Uniquely, the Eelstar can breathe fire (a rare trait among ocean spirits), which it uses to heat seawater to boiling during the desalination ceremony. Waterbenders then condense and harvest the purified steam into fresh water.\u003cbr\u003e    \u003cbr\u003e- Temperament: Benevolent but alien in its thinking, the Eelstar respects tradition and punishes disrespect. It chooses one acolyte per generation to serve as its interpreter and medium: the Boilkeeper.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCulture\u003cbr\u003e\u003cbr\u003e- Isolationist Ethos: Kugluktup culture is insular. Children are taught caution and mistrust of outsiders from birth. Stories of in...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe shimmering goldfish poop, once dismissed, is now reacting \u2014 humming faintly, vibrating when close to sacred texts or old chanting bowls in the temple. A monk, once skeptical, nervously confesses:\u003cbr\u003e\u003cbr\u003e&gt; \"There was\u2026 someone who always believed. The High Priest. Master Anzu.  \u003cbr\u003e&gt; He was banished to the temple archives after\u2026 well, too many sermons about invisible fish.\"\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udfdb\ufe0f Act I: Finding Master Anzu\u003cbr\u003e\u003cbr\u003eThe party must explore the forbidden lower sanctum of the temple \u2014 a quiet, echoing archive of moldy scrolls, broken water clocks, and fish-shaped relics. Deep within, they find Master Anzu:\u003cbr\u003e\u003cbr\u003e- A thin, ancient man with big watery eyes, speaking in half-poetry and full riddles\u003cbr\u003e    \u003cbr\u003e- Surrounded by aquariums full of no fish \u2014 only reflections and bubbles\u003cbr\u003e    \u003cbr\u003e- He talks to the goldfish regularly, but admits \u201cShe\u2019s shy. She only appears when you aren\u2019t looking.\u201d\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdd Act II: The Limerick\u003cbr\u003e\u003cbr\u003eAmong the scrolls, Anzu recites an ancient limerick he once found inscribed on a scale made of gold-leafed spiritglass:\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdc The Goldfish Limerick\u003cbr\u003e\u003cbr\u003e&gt; In stillest of ponds where no ripples are seen,  \u003cbr\u003e&gt; She darts through the veil where no spirit has been.  \u003cbr\u003e&gt; She poops like a comet, unseen in her wake,  \u003cbr\u003e&gt; And sleeps in the world where dreams do not break.  \u003cbr\u003e&gt; To find her, dear seeker, don't look but just feel\u2014  \u003cbr\u003e&gt; For goldfish are truth, and their silence is real.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udde9 Interpretation (What Anzu Knows)\u003cbr\u003e\u003cbr\u003e- The Goldfish fazes between the Spirit World and the Material based on emotional triggers \u2014 fear, serenity, hunger, embarrassment.\u003cbr\u003e    \u003cbr\u003e- She is drawn to stillness, reflection, and honest curiosity.\u003cbr\u003e    \u003cbr\u003e- Her poop only appears when she phases improperly \u2014 a symptom of imbalance between the realms.\u003cbr\u003e    \u003cbr\u003e- She once had a mirror-lake shrine, far from the temple, wher...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e\ud83c\udf49Glassfruit Watermelonsteamer\u003cbr\u003eMust be innitiated by a Earth or Waterbender and needs at least one level from each Elements Level. You can use Levels from up to two different Elements. \u003cbr\u003e\u003cbr\u003e&gt; A watermelon seed that needs to be watered to grow into a sphere of X meter radius that pushes everyone away and creates a Heavy sphere with X(Earthebending slot count double) Hitpoints. The watermelon is then quickly heated and the steam cooled down to heal every creature in a 5  X Meters cone from the watermelon with the steam 3  X Hitpoints \u003cbr\u003e- Effects: \u003cbr\u003e- Wall : \u003cbr\u003e\t- X(Earthebending slot count double) Hitpoints\u003cbr\u003e- Healing\u003cbr\u003e\t- 5  X Meters cone from the watermelon\u003cbr\u003e\t- 2  X(Water Counts double) Hitpoints Healing\u003cbr\u003e\t-\u003cbr\u003e\ud83c\udf4b Sunburst Nectarfield (Lemonseed)\u003cbr\u003e\u003cbr\u003eMust be initiated by a Fire or Water. Requires at least one Level from Fire and Air.  \u003cbr\u003eYou may use Levels from up to two Elements. Fire counts double.\u003cbr\u003e\u003cbr\u003e&gt; A lemon-shaped crystal is launched skyward, where it refracts the sunlight into a radiant bloom before one side sprays out hot liquid glassand one side shines a cleansing light. After a delay of 1 round, it explodes in midair with a flash that burns spirits and cleanses mortal ailments.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\u003cbr\u003e- Flashburst AoE\u003cbr\u003e    \u003cbr\u003e    - All enemies within X \u00d7 4 meters radius must succeed on INT Save (DC = 10 + X)\u003cbr\u003e        \u003cbr\u003e    - On fail: Blinded (1 round) + take Xd8 radiant damage\u003cbr\u003e        \u003cbr\u003e    - On success: Half damage, no blind\u003cbr\u003e        \u003cbr\u003e- Healing Burst (Allies only)\u003cbr\u003e    \u003cbr\u003e    - All allies in X \u00d7 5 meters are cured of one condition (blinded, frightened, charmed, etc.)\u003cbr\u003e        \u003cbr\u003e- X = Fire Slot \u00d7 Air Slot\u003cbr\u003e    \u003cbr\u003e    - Fire counts double\u003cbr\u003e        \u003cbr\u003e    - Max slots: 6 from Fire (counted as 12), 3 from Air\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf47 Cactusfruit  Bulb (Brambleseed)\u003cbr\u003e\u003cbr\u003eMust be initiated by an Earth or Fire. Requires at least one ...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLocation: Glassline canyon near Omashu\u2019s lower shell district \u2013 jagged cliffs, semi-wild Glassfruit groves, and an unstable spiritual resonance.\u003cbr\u003e\u003cbr\u003eSituation:  \u003cbr\u003eThe party seeks access to the Heart of Clarity (the ancient Resonance Stone), but they\u2019re intercepted by a Glassfang Vanguard Cell \u2014 loyal to the stone and sworn to protect it from those deemed \u201cunworthy\u201d or \u201cdisruptive.\u201d\u003cbr\u003e\u003cbr\u003eThe Glassfang benders are trained in Glassfruit Team-Up Techniques and immediately unleash synchronized bending using harvested seeds and sacred resonance tones.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udc65 Encounter Composition\u003cbr\u003e\u003cbr\u003e\ud83e\uddf1 Baezu \u2013 Earthbender (Initiator for Glassfruit seeds)\u003cbr\u003e\u003cbr\u003e- Tactical leader, chants in low harmonic tones\u003cbr\u003e    \u003cbr\u003e- Carries a pouch of clear Soulseeds\u003cbr\u003e    \u003cbr\u003e- Triggers Soulseed Harmonic Seal for massive battlefield control\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e\ud83d\udd25 Siroh \u2013 Firebender (Initiator for Inferno Bloom &amp; FlashLemon)\u003cbr\u003e\u003cbr\u003e- Aggressive and flashy, uses rapid Firebending katas\u003cbr\u003e    \u003cbr\u003e- Wears a red Glass mask\u003cbr\u003e    \u003cbr\u003e- Combo: Inferno Bloom followed by FlashLemon Refractor Beam to blind &amp; burn\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e\ud83d\udca8 Orhu \u2013 Airbender (Initiator for Resonant Collapse)\u003cbr\u003e\u003cbr\u003e- Agile, evasive, never touches the ground for long\u003cbr\u003e    \u003cbr\u003e- Keeps the party off-balance with shockwaves\u003cbr\u003e    \u003cbr\u003e- Uses Resonant Collapse to knock down and split the party\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e\ud83c\udf0a Luma \u2013 Waterbender (Initiator for BlueBerry Surge)\u003cbr\u003e\u003cbr\u003e- Calm and focused, wears a robe woven with mineral threads\u003cbr\u003e    \u003cbr\u003e- Traps frontline party members with BlueBerry Glass Surge\u003cbr\u003e    \u003cbr\u003e- Supports the others by locking down terrain\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf00 Opening Round (Round 1)\u003cbr\u003e\u003cbr\u003e- Luma (2 slots) + Baezu (3 slots):  \u003cbr\u003e    \u2192 X = 6  \u003cbr\u003e    \u2192 BlueBerry Glass Surge immobilizes frontliners (DC 12 Dex save)\u003cbr\u003e    \u003cbr\u003e- Siroh (3 slots) + Orhu (2 slots):  \u003cbr\u003e    \u2192 X = 6  \u003cbr\u003e    \u2192 Inferno Bloom explodes near ranged party members (6d6 d...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eBaezu \u2013 Earthbender Master of Resonance\u003cbr\u003e\u003cbr\u003eRole: Boss \u2013 Controller, Support, Spiritual Conduit  \u003cbr\u003eInitiates: \u26aa Soulseed Harmonic Seal, \ud83d\udfe2 BlueBerry Surge\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eStats\u003cbr\u003e\u003cbr\u003e- HP: 110\u003cbr\u003e    \u003cbr\u003e- Armor: 3\u003cbr\u003e    \u003cbr\u003e- Earthbending Level: 7\u003cbr\u003e    \u003cbr\u003e- Speed: Slow 4m\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eactions per Round: 2 (Legendary Bender)\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAbilities\u003cbr\u003e\u003cbr\u003e\u25aa\ufe0f Earth Anchor (Passive)\u003cbr\u003e\u003cbr\u003eCannot be forcibly moved or knocked prone while touching stone. \u003cbr\u003eHas advantage on Concentration Checks\u003cbr\u003e\u003cbr\u003e\u25aa\ufe0f Seismic Meditation (Bonus Action)\u003cbr\u003e\u003cbr\u003eRegain 1 bending slot if standing still for the round.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eTechniques\u003cbr\u003eGlassfruit Seed Mechanics\u003cbr\u003e\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e\u270b Harmonic Command (Support)\u003cbr\u003e\u003cbr\u003eBonus Action: another Crystalfang bender may immediately act using 1 technique as a Reaction\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd25 Siroh \u2013 Firebender Glassforger\u003cbr\u003e\u003cbr\u003eRole: Blaster, AoE Control  \u003cbr\u003eInitiates: \ud83d\udd34 Inferno Bloom, \ud83d\udfe1 FlashLemon Beam\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eStats\u003cbr\u003e\u003cbr\u003e- HP: 60\u003cbr\u003e    \u003cbr\u003e- Armor: 1\u003cbr\u003e    \u003cbr\u003e- Chi Slots: 4\u003cbr\u003e    \u003cbr\u003e- Speed: Normal\u003cbr\u003e    \u003cbr\u003e- Weaknesses: Cold, Waterbending\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eBending Slots: 3\u003cbr\u003e\u003cbr\u003eactions per Round: 1\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAbilities\u003cbr\u003e\u003cbr\u003e\u25aa\ufe0f Overheat Spark (Passive)\u003cbr\u003e\u003cbr\u003eWhen using a Fire-based team-up, add +1 to total X\u003cbr\u003e\u003cbr\u003e\u25aa\ufe0f Flashcore Mantle (1x\u002fday)\u003cbr\u003e\u003cbr\u003eCreate a cloak of glowing crystals \u2013 gain resistance to radiant damage for 2 rounds\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eTechniques\u003cbr\u003e\u003cbr\u003e\ud83d\udd34 Inferno Bloom (X = y \u00d7 z)\u003cbr\u003e\u003cbr\u003eInitiates with any bender\u003cbr\u003e\u003cbr\u003e- Explosive AoE, 2m \u00d7 X radius\u003cbr\u003e    \u003cbr\u003e- Damage: Xd6 bludgeoning + half fire\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e\ud83d\udfe1 FlashLemon Refractor Beam (X = y \u00d7 z)\u003cbr\u003e\u003cbr\u003eInitiates with Air or Earthbender\u003cbr\u003e\u003cbr\u003e- Cone: 10m \u00d7 X\u003cbr\u003e    \u003cbr\u003e- Blind + Xd8 radiant to primary target\u003cbr\u003e    \u003cbr\u003e- Enemies save INT vs DC X\u00d72\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udca8 Orhu \u2013 Airbender Harmonic Duelist\u003cbr\u003e\u003cbr\u003eRole: Support, Disruption  \u003cbr\u003eInitiates: \ud83d\udca8 Resonant Co...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePlothook\u003cbr\u003e\u003cbr\u003eLocation: Omashu  \u003cbr\u003eCategory: Mystery, Ancient Lore, Spiritual Intrigue\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\u26f0\ufe0f Hook Summary:\u003cbr\u003e\u003cbr\u003eWhile staying in Omashu, the party becomes involved in a mystery that will shake the foundation\u2014literally\u2014of one of the Earth Kingdom\u2019s oldest cities. Tremors beneath the city reveal not just ancient ruins, but a dormant guardian far older than the city itself.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf2c\ufe0f Cultural Flavor:\u003cbr\u003e\u003cbr\u003eLocals greet each other now with the phrase:  \u003cbr\u003e\u201cThe stone beneath still breathes.\u201d\u003cbr\u003e\u003cbr\u003eIt began as a poetic slogan after a strange event four years ago:  \u003cbr\u003eA group of quarry workers unearthed a resonance stone in the southern cliffs near Omashu. When struck, it caused a massive tremor\u2014and to the astonishment of all present, a massive turtle\u2019s head breached the ocean waters below the mountain, took a single GLORIOUS breath, and sank back below.\u003cbr\u003e\u003cbr\u003eIt was the first time the Earth Lion Turtle had moved in known history.\u003cbr\u003e\u003cbr\u003eScholars and spiritualists are divided: some believe it was a reflex, others a sign. Most of the population believed the Lion Turtle is long dead.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udde9 Current Mystery:\u003cbr\u003e\u003cbr\u003eNow, tremors are increasing. Unusual heat flows, deep echoes, and rock shifts are affecting the city's lower tunnels. The city\u2019s Tunnel Engineering Guild hires the party to investigate new cavern collapses and a recently revealed stone wall carved in unknown patterns.\u003cbr\u003e\u003cbr\u003eThe deeper they go, the stranger it gets\u2014stone murals of people walking on lion-turtle backs, spirits whispering, and a faint, rhythmic thrum echoing through the mountain\u2019s bones.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udc22 Ancient Truth:\u003cbr\u003e\u003cbr\u003eOmashu is not just built on a mountain\u2014  \u003cbr\u003eThe mountain is the shell of a slumbering Earth Lion Turtle.\u003cbr\u003e\u003cbr\u003eBefore sealing the Spirit Portals, Wan and Raava helped stabilize the world. In that time, this turtle gave Earthbending to a final generation and warned them:\u003cbr\u003e\u003c...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCity of Murmura\u003cbr\u003e\u003cbr\u003eTags: #PatolaMountainRange #Murmura #Airbending #Monastery\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003eTucked away in the shadows of the Patola Mountain Range, Murmura is a quiet city known for its mysterious and serene atmosphere. It is the home of the [Monastery of the Silent Echo], where airbenders train in creating sound barriers that shield conversations and disrupt vibrations.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eFeatures of Murmura\u003cbr\u003e\u003cbr\u003eGeography\u003cbr\u003e- Located in a valley surrounded by towering cliffs.\u003cbr\u003e- Natural acoustics make it an ideal place for sound-dampening practices.\u003cbr\u003e\u003cbr\u003eTrade and Economy\u003cbr\u003e- Renowned for stone masonry and crafting architectural elements designed to manage acoustics.\u003cbr\u003e- Produces soundproofing materials that are sought after by other cities.\u003cbr\u003e\u003cbr\u003eCulture\u003cbr\u003e- Values silence and mindfulness.\u003cbr\u003e- Rituals and celebrations often emphasize visual and tactile elements, such as light displays and intricate carvings, over sound.\u003cbr\u003e- Meditative practices are common, with many citizens adopting the Monastery\u2019s philosophy of inner peace.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMonastery of the Silent Echo\u003cbr\u003e\u003cbr\u003ePurpose\u003cbr\u003eThe Monastery focuses on teaching airbenders how to create zones of silence and shield conversations. This technique is often used for privacy, protection, and maintaining tranquility in tense situations.\u003cbr\u003e\u003cbr\u003eTraining Grounds\u003cbr\u003e- Stone-walled courtyards designed to absorb and reflect sound.\u003cbr\u003e- Training tools include resonance chambers and sound-dampening fabrics.\u003cbr\u003e\u003cbr\u003ePhilosophy\u003cbr\u003e- Advocates the sanctity of privacy and the importance of silence for spiritual growth.\u003cbr\u003e- Views sound as a powerful force that must be controlled to prevent discord.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eHistory\u003cbr\u003e- The Monastery\u2019s founding is tied to a shared legend with [Zephyros]. Supposedly, the monasteries were founded by twin brothers with differing philosophies. However, in reality, it was a single individual who had discovered...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCity of Zephyros\u003cbr\u003e\u003cbr\u003eTags: #PatolaMountainRange #Zephyros #Airbending #Monastery\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003eNestled on a high plateau of the Patola Mountain Range, Zephyros is a small yet vibrant city, renowned for its connection to airbending arts and the wind-swept beauty of its surroundings. It serves as home to the revered [Monastery of the Whispering Winds], a center for training advanced airbending techniques that amplify sound vibrations.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eFeatures of Zephyros\u003cbr\u003e\u003cbr\u003eGeography\u003cbr\u003e- Situated on a plateau surrounded by cliffs and narrow mountain passes.\u003cbr\u003e- Frequent strong winds make it an ideal location for the Monastery\u2019s practices.\u003cbr\u003e\u003cbr\u003eTrade and Economy\u003cbr\u003e- Known for its windmill-powered grain mills.\u003cbr\u003e- Exports rare herbs and teas found only in the Patola Mountain Range.\u003cbr\u003e\u003cbr\u003eCulture\u003cbr\u003e- A city that reveres sound and storytelling.\u003cbr\u003e- Town squares are filled with musicians, poets, and storytellers showcasing their art.\u003cbr\u003e- Festivals often feature performances designed to highlight the interplay of sound and wind.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMonastery of the Whispering Winds\u003cbr\u003e\u003cbr\u003ePurpose\u003cbr\u003eThe Monastery is dedicated to teaching an advanced airbending technique that allows practitioners to amplify and hear distant conversations by attuning themselves to sound vibrations carried by the air.\u003cbr\u003e\u003cbr\u003eTraining Grounds\u003cbr\u003e- Open-air platforms surrounded by wind chimes and vibrating strings.\u003cbr\u003e- Practice tools include resonance stones and air-tuned acoustic instruments.\u003cbr\u003e\u003cbr\u003ePhilosophy\u003cbr\u003e- Emphasizes harmony with nature and the spirits of the wind.\u003cbr\u003e- Believes that sound is a reflection of the balance between physical and spiritual realms.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eHistory\u003cbr\u003e- The Monastery\u2019s founding is tied to a shared legend with [Murmura]. Supposedly, the monasteries were founded by twin brothers with differing philosophies. However, in reality, it was a single individual who had discovered adva...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eEarmur\u003cbr\u003e\u003cbr\u003eTags: #PatolaMountainRange #Fauna #Soundbending\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003eThe Sonar Earmur is a unique and fascinating creature native to the Patola Mountain Range. A Lemur with huge ears. This animal is renowned for its natural attunement to soundbending, which it uses to hunt insects and navigate the rugged terrain of its habitat.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003ePhysical Description\u003cbr\u003e- Fur: Dense, velvety fur in shades of dark gray and brown, providing camouflage against rocky surroundings.\u003cbr\u003e- Eyes: Small and poorly developed, as the creature relies on sound rather than sight.\u003cbr\u003e- Ears: Oversized and highly sensitive, capable of detecting the faintest vibrations in the air.\u003cbr\u003e- Claws: Strong, digging claws adapted for burrowing into soft soil and crevices.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBehavior\u003cbr\u003eHunting\u003cbr\u003e- The Sonar Earmur uses a form of natural soundbending to emit focused sound waves. By controlling the vibrations in the air, it can detect and pinpoint the location of insects even in complete darkness.\u003cbr\u003e- Once an insect is located, it employs either its claws to dig them out of burrows or its quick reflexes to snatch them mid-flight.\u003cbr\u003e\u003cbr\u003eHabitat\u003cbr\u003e- Prefers caves, cliffside crevices, and underground burrows in the Patola Mountain Range.\u003cbr\u003e- Often found near Zephyros and Murmura, where the winds enhance its soundbending abilities.\u003cbr\u003e\u003cbr\u003eCommunication\u003cbr\u003e- Communicates with others of its kind using a series of ultrasonic chirps and vibrations. These signals are modulated to convey a wide range of information, from territory marking to mating calls.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eConnection to Soundbending\u003cbr\u003e- The Sonar Earmur\u2019s mastery of sound manipulation has made it an object of study for both the [Monastery of the Whispering Winds] and the [Monastery of the Silent Echo].\u003cbr\u003e- Monks observe its behavior to refine their own techniques, often mimicking its sound-based hunting methods or its ability to create \"silence zones\"...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview:  \u003cbr\u003eTwin siblings from Sekan\u2019to whose seamless coordination has turned their unique dual-element fusion into an art form. They\u2019re local legends among younger benders and are being watched closely by the Crystalfire Circle.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udc66 Kael (Older Twin, Firebender)\u003cbr\u003e\u003cbr\u003e- Element: Fire\u003cbr\u003e    \u003cbr\u003e- Personality: Outgoing, reckless, theatrical; deeply protective of Lira\u003cbr\u003e    \u003cbr\u003e- Style: Sharp, focused flame that arcs like a laser through mirrored crystals\u003cbr\u003e    \u003cbr\u003e- Role: Offensive striker and flare tactician\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udc67 Lira (Younger Twin, Earth\u002fCrystalbender)\u003cbr\u003e\u003cbr\u003e- Element: Crystal Earthbending\u003cbr\u003e    \u003cbr\u003e- Personality: Reserved, focused, analytical; handles all structural control\u003cbr\u003e    \u003cbr\u003e- Style: Forms and shapes a mirror-like mineral coating (called Shinestone) over crystals\u003cbr\u003e    \u003cbr\u003e- Role: Light-focus engineer and illusion architect\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd2e Twin Bending Style: Gleam-Fusion Technique\u003cbr\u003e\u003cbr\u003eA high-discipline technique that combines Kael\u2019s fire precision with Lira\u2019s crystal-light manipulation. It centers around Shinestone Mirrors, crystal structures polished to perfection to reflect and concentrate light and flame.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udca5 Signature Moves\u003cbr\u003e\u003cbr\u003e- Prism Lance \u2013 Kael fires a narrow beam of fire into a floating Shinestone prism shaped by Lira, focusing it into a searing beam of pure light\u002ffire that can pierce armor.\u003cbr\u003e    \u003cbr\u003e- Radiant Spiral Web \u2013 Lira surrounds an area with mirrored crystals while Kael spins flame between them, creating a dazzling maze of reflected fire that disorients enemies.\u003cbr\u003e    \u003cbr\u003e- Blinding Crossflare \u2013 Using mirrored arcs above and below, Kael and Lira bounce fire and light until it erupts in a precise, disorienting flash.\u003cbr\u003e    \u003cbr\u003e- Shinestone Mirage \u2013 Lira uses her mirrors to bend light around the twins, creating realistic illusory doubles mid-combat.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udded Role in the Campaign\u003cb...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e\ud83e\udded Hook Summary:\u003cbr\u003e\u003cbr\u003eWhile traveling the harsh Si Wong Desert, the heroes spot a mysterious gleam atop a sandstone spire\u2014a rhythmic flash of white light that appears unnatural, almost like a signal. Locals mention an ancient legend of a \u201cstar-serpent\u201d and a tribe of light-forgers hidden within the rock. The party must brave scorching winds, treacherous slopes, and possibly spiritual interference to uncover the truth.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udde3\ufe0f GM Read-Aloud \u2013 Desert Discovery\u003cbr\u003e\u003cbr\u003e&gt; As the desert heat shimmers on the horizon, something catches your eye \u2014 a glint. Then another. A pulse of light, like lightning trapped inside glass. It blinks from the top of a jagged rock mesa that juts out from the dunes like a spear aimed at the sun.\u003cbr\u003e&gt; \u003cbr\u003e&gt; \u201cNo fire shines like that in this heat,\u201d one of you murmurs. The light flickers again \u2014 three pulses. Then darkness.\u003cbr\u003e&gt; \u003cbr\u003e&gt; A traveler nearby mutters nervously, \u201cYou saw the serpent\u2019s signal. The old folk say that\u2019s where the Gleam-Tamers live. Nobody climbs that rock and comes back... unless the spirit lets them.\u201d\u003cbr\u003e&gt; \u003cbr\u003e&gt; A dry wind howls, and the mesa looms ahead \u2014 impossibly tall, its surface riddled with cracks and veins of quartz.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\ude9c Optional Reasons to Climb (Motivations by Character Type)\u003cbr\u003e\u003cbr\u003e- Spiritually Attuned Characters: You feel a strange resonance from the flashes \u2014 as if a spirit is calling out or warning you.\u003cbr\u003e    \u003cbr\u003e- Scholars\u002fHealers: Rumors say a rare crystal found only in the rock's core can amplify healing or spiritual communion.\u003cbr\u003e    \u003cbr\u003e- Treasure Hunters: The \u201cFlashing Coil\u201d is said to hoard spirit relics and glowing gemstones worth a king\u2019s ransom.\u003cbr\u003e    \u003cbr\u003e- Firebenders\u002fEarthbenders: Local lore speaks of ancient hybrid bending techniques passed down by an isolated sect.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udfaf Next Steps\u003cbr\u003e\u003cbr\u003e- Navigating the harsh desert terrain\u003cbr\u003e    \u003cbr\u003e- Climbing the rock safely (natur...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDC 17 \u003cbr\u003e\u003cbr\u003eType: Greater Spirit  \u003cbr\u003eDomain: Light, Trickery, Fire  \u003cbr\u003eAlignment: Chaotic Neutral  \u003cbr\u003eChallenge Rating: 9  \u003cbr\u003eLair: The Crystal Hollow beneath Sekan\u2019to\u003cbr\u003e\u003cbr\u003e21\u003cbr\u003e27\u003cbr\u003e32\u003cbr\u003e36\u003cbr\u003e43\u003cbr\u003e47\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAppearance:  \u003cbr\u003eA sinuous spirit with translucent scales that shimmer with inner fire. Its wings resemble glowing firefly lanterns, and its rattlesnake-like tail ends in a crystal that emits dazzling pulses of light.\u003cbr\u003e\u003cbr\u003eWhooo are you to stand in front of me without kneeling?\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAbilities:\u003cbr\u003e\u003cbr\u003e\u27a4 Blinding Flash (Recharge 4\u20136):  \u003cbr\u003eRaza'tel emits a pulse of searing white light from its tail crystal. All creatures within 60 ft must make a CON Save (DC 17) or be blinded for 1 minute. Success reduces to 1 round. Spirit-bonded individuals from Sekan\u2019to can use Reaction to shield themselves with a flare crystal.\u003cbr\u003e\u003cbr\u003e\u27a4 Serpent\u2019s Dance:  \u003cbr\u003eCan move through tight spaces without penalty and ignores difficult terrain created by crystal or fire. Gains evasion and uncanny dodge.\u003cbr\u003e\u003cbr\u003e\u27a4 Crystal Pulse (1\u002fturn):  \u003cbr\u003eCan emit a resonating pulse that causes infused crystals in a 90 ft radius to either flare with light, explode in fire (3d6 fire dmg), or emit echo-location pings that reveal invisible or hidden creatures.\u003cbr\u003e\u003cbr\u003e\u27a4 Flashmeld:  \u003cbr\u003eCan become pure light and move 120 ft instantly to any light source it can see. Cannot be targeted while in transit.\u003cbr\u003e\u003cbr\u003e\u27a4 Tri
