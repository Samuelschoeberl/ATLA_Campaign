3eElement                 | Slot level                | Max Slots       | current       | note       |       \u003cbr\u003ewater charges           | Waterbottle Charges       | 2               | 2             |            |       \u003cbr\u003eEarthbending Slot       | 1                         | 1               | 1             |            |       \u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eVital Stats\u003cbr\u003eTABLE:\u003cbr\u003eAttribute           | Value       | note                                  |       \u003cbr\u003eMax Hitpoints       | 12          |                                       |       \u003cbr\u003eHP                  | 0           |                                       |       \u003cbr\u003eEvasion             | 13          |                                       |       \u003cbr\u003eArmor               | 1           |                                       |       \u003cbr\u003eStress Level        | 0           | default is 0 at start of combat       |       \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBending Levels\u003cbr\u003eTABLE:\u003cbr\u003eElement                   | Level       | Notes                        |       \u003cbr\u003eAirbending Level          | 0           |                              |       \u003cbr\u003eWaterbending Level        | 2           |                              |       \u003cbr\u003eEarthbending Level        | 1           |                              |       \u003cbr\u003eFirebending Level         | 0           |                              |       \u003cbr\u003eSpiritbending Level       | 0           | (Avatar Spirit Bridge)       |       \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eSecondary Stats\u003cbr\u003eTABLE:\u003cbr\u003eStat                       | value       | Notes                        |       \u003cbr\u003eAttack Roll Modifier       | 3           |                              |       \u003cbr\u003eWaterbending DC            | 17          |                              |       \u003cbr\u003eEarthbending DC            | 12          |                              |       \u003cbr\u003eFirebending DC             | 13          |                              |       \u003cbr\u003eSpiritbending DC           | 13          | (Avatar Spirit Bridge)       |       \u003cbr\u003e\u003cbr\u003eManually Rolled Hitpoints\u003cbr\u003eTABLE:\u003cbr\u003eRolled Hp                       | Total       |       \u003cbr\u003eManually Rolled Hitpoints       | 21          |       \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eInventory &amp; Notes\u003cbr\u003e\u003cbr\u003e-\u003cbr\u003e-\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eMy character is Anju, the oldest daughter of 5 siblings. Anju's father always wanted a son but he\u003cbr\u003ewas only blessed with daughters. Believing only males could lead the great southern water tribe\u003cbr\u003eto further prosperity, he decided to raise Anju like the son he always wanted to have.\u003cbr\u003e(Anju is derived from \"Angijua\" in Inuktitut which means \"older brother\")\u003cbr\u003eThe mother died after giving birth to the 5th child, Anju and her siblings were raised by their\u003cbr\u003efather and the father's sister.\u003cbr\u003e\u003cbr\u003eEven though Anju was raised like a man, she has a feminine side to her which she learned from\u003cbr\u003eher aunt. The father is strict but also a good instructor. In time, Anju has enough athletic ability\u003cbr\u003eto pass as an average male of her tribe (though not outstanding like Korra). Anju's strength lies\u003cbr\u003ein her ability to create icicles. One of her greatest achievements - and also secrets - is when she\u003cbr\u003ecreated thick icicle soles to appear 5cm taller, which made her taller than her father at that time\u003cbr\u003eand caused her father to appear proud of her for the first time in forever.\u003cbr\u003e\u003cbr\u003eSeeing Anju's proficient icicle making, her father is convinced she is a very talented bender, maybe\u003cbr\u003eeven with potential of becoming the next Avatar. He sends Anju off to\u003cbr\u003e&lt;ENTER SUMMSI'S NAME FOR THE AVATAR CAMP HERE&gt; with one request to\u003cbr\u003eAnju: \"Be a great man that makes the southern water tribe proud\"\u003c\u002fspan\u003e","","","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Team-up Moves --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u251c\u2500\u2500 Earth\u003cbr\u003e                  \u2514\u2500\u2500 Earthbending Moves\u003cbr\u003e                      \u2514\u2500\u2500 glass fruit bending\u003cbr\u003e                          \u251c\u2500\u2500 FlashLemon Refractor Beam.md\u003cbr\u003e                          \u251c\u2500\u2500 Glassfruit Seed Mechanics.md\u003cbr\u003e                          \u251c\u2500\u2500 Inferno Bloom (Red Flamegrape).md\u003cbr\u003e                          \u251c\u2500\u2500 Resonant Collapse (Blue Soundbanana).md\u003cbr\u003e                          \u2514\u2500\u2500 Soulseed Harmonic Seal.md\u003cbr\u003e              \u251c\u2500\u2500 Spirit\u003cbr\u003e                  \u2514\u2500\u2500 Mechanics\u003cbr\u003e                      \u2514\u2500\u2500 Spiritbending.md\u003cbr\u003e              \u2514\u2500\u2500 Team-up Moves\u003cbr\u003e                  \u251c\u2500\u2500 Air-Earth\u003cbr\u003e                      \u2514\u2500\u2500 Sandstream.md\u003cbr\u003e                  \u2514\u2500\u2500 Water-Water\u003cbr\u003e                      \u251c\u2500\u2500 Freeze Projectiles.md\u003cbr\u003e                      \u2514\u2500\u2500 Frozen Aegis.md\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u0 l 2, Level 3, Level 4, Level 5, Level 6, Level 7       | 56 Slots (14 from Level 1, 12 from Level 2, 10 from Level 3, 8 from Level 4, 6 from Level 5, 4 from Level 6, 2 from Level 7)                                          \u003cbr\u003e15          | Level 1 - Level 8                                                   | 64 Slots (15 from Level 1, 13 from Level 2, 11 from Level 3, 9 from Level 4, 7 from Level 5, 5 from Level 6, 3 from Level 7, 1 from Level 8)                          \u003cbr\u003e16          | Level 1 - Level 8                                                   | 72 Slots (16 from Level 1, 14 from Level 2, 12 from Level 3, 10 from Level 4, 8 from Level 5, 6 from Level 6, 4 from Level 7, 2 from Level 8)                         \u003cbr\u003e17          | Level 1 - Level 9                                                   | 81 Slots (17 from Level 1, 15 from Level 2, 13 from Level 3, 11 from Level 4, 9 from Level 5, 7 from Level 6, 5 from Level 7, 3 from Level 8, 1 from Level 9)         \u003cbr\u003e18          | Level 1 - Level 9                                                   | 90 Slots (18 from Level 1, 16 from Level 2, 14 from Level 3, 12 from Level 4, 10 from Level 5, 8 from Level 6, 6 from Level 7, 4 from Level 8, 2 from Level 9)        \u003cbr\u003e19          | Level 1 - Level 9                                                   | 99 Slots (19 from Level 1, 17 from Level 2, 15 from Level 3, 13 from Level 4, 11 from Level 5, 9 from Level 6, 7 from Level 7, 5 from Level 8, 3 from Level 9)        \u003cbr\u003e20          | Level 1 - Level 9                                                   | 108 Slots (20 from Level 1, 18 from Level 2, 16 from Level 3, 14 from Level 4, 12 from Level 5, 10 from Level 6, 8 from Level 7, 6 from Level 8, 4 from Level 9)      \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eExplanation:\u003cbr\u003e\u003cbr\u003e1. Slots Increase Each Level: As characters level up, they gain slots to learn new moves, and the distribution of slots ensures steady growth and access to higher-level moves.\u003cbr\u003e2. Balanced Progression: Players gain slots evenly while progressively unlocking new levels at Levels 3, 5, 7, 9, 11, 13, 15, and 17.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003e\u003cbr\u003eLevel 1\u003cbr\u003eLevel 2\u003cbr\u003eLevel 3\u003cbr\u003eLevel 4\u003cbr\u003eLevel 5\u003cbr\u003eLevel 6\u003cbr\u003eLevel 7\u003cbr\u003eLevel 8\u003cbr\u003eLevel 9\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview:\u003cbr\u003e\u003cbr\u003eEarthbenders are solid and steadfast, drawing upon the Strength of their bodies and the stability of the ground beneath them. Their techniques focus on defense, fortification, and manipulating terrain. Rather than relying on agility to avoid blows, earthbenders create barriers, raise armor ratings, and reinforce their allies. They harness Earth Charges to shape stone and metal, providing a constant, reliable source of defense and stability.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003eAvatar Spirit Check\u003cbr\u003e\ud83c\udf0c Bridge of the Spirit: A Personal Journey\u003cbr\u003e\u003cbr\u003e&gt; \"To be the Avatar is not merely to bend all elements, but to bend one\u2019s self\u2014to align will and wisdom with the needs of the world.\"  \u003cbr\u003e&gt; \u2014 Grandmaster Shuyin of the White Lotus\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udded Reflecting on Your Journey\u003cbr\u003e\u003cbr\u003eEach character stands at a crossroads between spirit and self, and your progression in this campaign is deeply rooted in how your character emotionally and spiritually reacts to the events that unfold. Reflect on:\u003cbr\u003e\u003cbr\u003e- Have recent events hardened them? Are they acting with more recklessness, cruelty, or obsession to achieve their goals\u2014driven by trauma or ambition?\u003cbr\u003e    \u003cbr\u003e- Or have they found inner balance, perhaps discovering a renewed sense of duty or compassion, and beginning to understand the role of a bridge between the mortal and spiritual worlds?\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eThis reflection influences your na and will guide what type of power you unlock next.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd25 Paths of Power\u003cbr\u003e\u003cbr\u003eWhen your character increases their Bridge Level, they may choose one of the following paths, shaped by how they have grown:\u003cbr\u003e\u003cbr\u003eChaotic Awakening\u003cbr\u003e\u003cbr\u003eFor those who pursue strength, vengeance, or control without regard for balance. Unlock a new bending slot in an element already known (but not your origin element).  \u003cbr\u003eExample: A waterbender who has learned firebending may now gain a second firebending move.\u003cbr\u003e\u003cbr\u003eHarmonic Enlightenment\u003cbr\u003e\u003cbr\u003eFor those who embrace their role as a bridge between worlds. Unlock a new bending element, representing spiritual expansion and Avatar-like growth.  \u003cbr\u003eExample: An earthbender may now begin learning airbending.  \u003cbr\u003eAdditionally, you may gain access to rare spiritual techniques (GM approval), such as Spirit-Bending, Healing Flames, Echobending, etc., reflecting your evolving balance and connection to the Avatar Spirit.\u003cbr\u003e\u003cbr\u003e&gt; Choose based on your character's emotional and spiritual arc. This is about what kind of person they are becoming, not just what powers they can gain.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udc8e Spirit Stones\u003cbr\u003e\u003cbr\u003eScattered throughout the world are rare, luminous Spirit Stones, ancient relics humming with resonance from the Spirit World. Each stone can be used in a ritual to unlock or increase a Bridge Level, drawing forth latent potential within the bender\u2019s soul.\u003cbr\u003e\u003cbr\u003e- Your first Bridge Level was gained using one such stone in the initial ritual.\u003cbr\u003e    \u003cbr\u003e- These stones are rare and valuable, often hidden, protected, or born from significant spirit-world events.\u003cbr\u003e    \u003cbr\u003e- Some stones may resonate with specific emotions, elements, or spirits, and influence what type of power is awakened.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e&gt; The ritual may vary depending on location, spirit presence, or celestial timing. Use of a stone should always involve narrative roleplay, reflection, and a meaningful choice.\u003cbr\u003e\u003cbr\u003eTrack stones and their effects in your Spirit Stone Log.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcca Bending Move Availability Table\u003cbr\u003eTABLE:\u003cbr\u003eAvatar Spirit Bridge Level       | Unlocked Move Level      \u003cbr\u003e1                                | Level 1                  \u003cbr\u003e2                                | Level 1                  \u003cbr\u003e3                                | Level 2                  \u003cbr\u003e4                                | Level 2                  \u003cbr\u003e5                                | Level 3                  \u003cbr\u003e6                                | Level 3                  \u003cbr\u003e7                                | Level 4                  \u003cbr\u003e8                                | Level 4                  \u003cbr\u003e9                                | Level 5                  \u003cbr\u003e10                               | Level 5                  \u003cbr\u003e11                               | Level 6                  \u003cbr\u003e12                               | Level 6                  \u003cbr\u003e13                               | Level 7                  \u003cbr\u003e14                               | Level 7                  \u003cbr\u003e15                               | Level 8                  \u003cbr\u003e16                               | Level 8                  \u003cbr\u003e17                               | Level 9                  \u003cbr\u003e18                               | Level 9                  \u003cbr\u003e19                               | Level 9                  \u003cbr\u003e20                               | Level 9                  \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf00 How to Use This Table\u003cbr\u003e\u003cbr\u003e- On odd-numbered Bridge Levels, you gain access to new move tiers.\u003cbr\u003e    \u003cbr\u003e- On even-numbered Bridge Levels, you may select additional moves from existing unlocked tiers, but do not gain a new tier.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\u2728 Next Steps\u003cbr\u003e\u003cbr\u003e- Reflect in your journal: where is your character now\u2014spiritually, emotionally, morally? Use the tag #spiritreflection.\u003cbr\u003e    \u003cbr\u003e- Record any discovered or used Spirit Stones in the Spirit Stone Log.\u003cbr\u003e    \u003cbr\u003e- Meet with the GM to finalize your chosen path: new slot in a known element (Chaotic Awakening) or a new bending element (Harmonic Enlightenment).\u003cbr\u003e    \u003cbr\u003e- Update your Character Sheet Template with any changes to bending capabilities.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eTags:  \u003cbr\u003emechanics #spiritbridge #bending #characterprogression #Avatar #spiritstones #advancement\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Avatar Spirit Bridge Level --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Spirit\u003cbr\u003e                  \u2514\u2500\u2500 Mechanics\u003cbr\u0 003eWaterbending\u003cbr\u003e \u003cbr\u003e\u003cbr\u003e- Environmental Influence:  \u003cbr\u003e    The number of Water Charges available at the start of combat or during an encounter depends on the setting. Feel free to get creative where to find water.:\u003cbr\u003e    \u003cbr\u003e    - Desert\u002fDry Area: 0 Water Charges (minimum water source).\u003cbr\u003e    - Humid Area: 5-10 Water Charges.\u003cbr\u003e    - Near Water Source (Lake, Ocean, etc.): 15 Water Charges.\u003cbr\u003e    - In Lake, Ocean, etc.: 50+ charges\u003cbr\u003e\t    \u003cbr\u003e- Restoring Water Charges:\u003cbr\u003e    \u003cbr\u003e    - Skill Checks: A waterbender can perform a skill check to draw water from their surroundings DC is determined by how dry the area is. Success restores Water Charges, depending on the environment.\u003cbr\u003e    - Abilities: Certain abilities allow Water Charges recovery or Cyclic Flow.\u003cbr\u003e    \u003cbr\u003eWaterbending\u003cbr\u003eWaterbottle Charges\u003cbr\u003eLevel 1\u003cbr\u003eLevel 2\u003cbr\u003eLevel 3\u003cbr\u003eLevel 4\u003cbr\u003eLevel 5\u003cbr\u003eLevel 6\u003cbr\u003eLevel 7\u003cbr\u003eLevel 8\u003cbr\u003eLevel 9\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Water Charges --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u251c\u2500\u2500 PCs\u003cbr\u003e          \u2514\u2500\u2500 Anju\u003cbr\u003e              \u2514\u2500\u2500 Anju Character Sheet.md\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u251c\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Water\u003cbr\u003e                  \u251c\u2500\u2500 ExpandedCollections\u003cbr\u003e                      \u2514\u2500\u2500 ExpandedCyclic Flow.md\u003cbr\u003e                  \u251c\u2500\u2500 Mechanics\u003cbr\u003e                      \u2514\u2500\u2500 Cyclic Flow.md\u003cbr\u003e                  \u2514\u2500\u2500 W us .\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 10 ft radius centered on self.\u003cbr\u003e    - Will grow 10 feet per round until full sized\u003cbr\u003e    - Creates a heavily obscured area for concealment that can be absorbed to regain charges (10 feeet radius per Turn) or blown await by air.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eShape Water (Cantrip)\u003cbr\u003e\u003cbr\u003e- Cost: None.\u003cbr\u003e- Range: 30 ft.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Duration: At Will. Concentration.\u003cbr\u003e- Effect:  \u003cbr\u003e    You can manipulate a water, shaping it into simple forms, moving it, or changing its state (solid, liquid, mist) temporarily.\u003cbr\u003e    - Limitations: Cannot deal damage but can be used for utility (e.g., extinguishing flames, creating distractions). The higher your Level is the more water can be shaped. Might need an Int ability check.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Shape Water\u003cbr\u003e- Rules\u003cbr\u003e- Int\u003cbr\u003e- Waterbending Moves\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCyclic Flow\u003cbr\u003eLevel 1\u003cbr\u003e\u003cbr\u003e- Cost: 1-3 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Duration: 1 round Concentration.\u003cbr\u003e- Range: Touch (through water).\u003cbr\u003e- Effect:  \u003cbr\u003e    You channel healing energy through water, restoring health to a creature. \u003cbr\u003e\t- If the creature is unconscious the creature becomes stable.\u003cbr\u003e    - Healing: 2d8 per charge + Int modifier at the beginning of your next Turn.\u003cbr\u003e    - Limitations: Cannot heal constructs or undead.\u003cbr\u003e\u003cbr\u003eCollectionfile \u003cbr\u003eIf Concentration is not broken ha
