cbr\u003e| 10      | Level 1, Level 2, Level 3, Level 4, Level 5                     | 30 Slots (10 from Level 1, 8 from Level 2, 6 from Level 3, 4 from Level 4, 2 from Level 5)                                                                         |\u003cbr\u003e| 11      | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6            | 36 Slots (11 from Level 1, 9 from Level 2, 7 from Level 3, 5 from Level 4, 3 from Level 5, 1 from Level 6)                                                         |\u003cbr\u003e| 12      | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6            | 42 Slots (12 from Level 1, 10 from Level 2, 8 from Level 3, 6 from Level 4, 4 from Level 5, 2 from Level 6)                                                        |\u003cbr\u003e| 13      | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6, Level 7   | 49 Slots (13 from Level 1, 11 from Level 2, 9 from Level 3, 7 from Level 4, 5 from Level 5, 3 from Level 6, 1 from Level 7)                                        |\u003cbr\u003e| 14      | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6, Level 7   | 56 Slots (14 from Level 1, 12 from Level 2, 10 from Level 3, 8 from Level 4, 6 from Level 5, 4 from Level 6, 2 from Level 7)                                       |\u003cbr\u003e| 15      | Level 1 - Level 8                                               | 64 Slots (15 from Level 1, 13 from Level 2, 11 from Level 3, 9 from Level 4, 7 from Level 5, 5 from Level 6, 3 from Level 7, 1 from Level 8)                       |\u003cbr\u003e| 16      | Level 1 - Level 8                                               | 72 Slots (16 from Level 1, 14 from Level 2, 12 from Level 3, 10 from Level 4, 8 from Level 5, 6 from Level 6, 4 from Level 7, 2 from Level 8)                      |\u003cbr\u003e| 17      | Level 1 - Level 9                                               | 81 Slots (17 from Level 1, 15 from Level 2, 13 from Level 3, 11 from Level 4, 9 from Level 5, 7 from Level 6, 5 from Level 7, 3 from Level 8, 1 from Level 9)      |\u003cbr\u003e| 18      | Level 1 - Level 9                                               | 90 Slots (18 from Level 1, 16 from Level 2, 14 from Level 3, 12 from Level 4, 10 from Level 5, 8 from Level 6, 6 from Level 7, 4 from Level 8, 2 from Level 9)     |\u003cbr\u003e| 19      | Level 1 - Level 9                                               | 99 Slots (19 from Level 1, 17 from Level 2, 15 from Level 3, 13 from Level 4, 11 from Level 5, 9 from Level 6, 7 from Level 7, 5 from Level 8, 3 from Level 9)     |\u003cbr\u003e| 20      | Level 1 - Level 9                                               | 108 Slots (20 from Level 1, 18 from Level 2, 16 from Level 3, 14 from Level 4, 12 from Level 5, 10 from Level 6, 8 from Level 7, 6 from Level 8, 4 from Level 9)   |\u003cbr\u003e+---------+-----------------------------------------------------------------+--------------------------------------------------------------------------------------------------------------------------------------------------------------------+\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eExplanation:\u003cbr\u003e\u003cbr\u003e1. Slots Increase Each Level: As characters level up, they gain slots to learn new moves, and the distribution of slots ensures steady growth and access to higher-level moves.\u003cbr\u003e2. Balanced Progression: Players gain slots evenly while progressively unlocking new levels at Levels 3, 5, 7, 9, 11, 13, 15, and 17.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eFirebending\u003cbr\u003eFirebending\u003cbr\u003eLevel 1\u003cbr\u003eLevel 2\u003cbr\u003eLevel 3\u003cbr\u003eLevel 4\u003cbr\u003eLevel 5\u003cbr\u003eLevel 6\u003cbr\u003eLevel 7\u003cbr\u003eLevel 8\u003cbr\u003eLevel 9\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003eFor each Level:\u003cbr\u003e-1 Attack Roll\u003cbr\u003e-1 Firebending DC\u003cbr\u003e+2 Damage\u003cbr\u003e\u003cbr\u003eFirebenders draw power from passion, heat, and intensity. Stress is both a resource and a danger: it fuels more powerful techniques, but too much leaves a bender unstable and at risk of losing control. The following rules convert narrative stress into a simple mechanical resource for firebending moves.\u003cbr\u003e\u003cbr\u003eWhen do you gain Stress Level:\u003cbr\u003e- For every 10 damage you take you take 1 Stress Level\u003cbr\u003e- For every Firebending Slot used in a Damaging Move\u003cbr\u003eWhen you loose Stress Level:\u003cbr\u003e- 1 Stress Level after every turn\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Stress Level --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u251c\u2500\u2500 createnpc.py\u003cbr\u003e  \u251c\u2500\u2500 createpc.py\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u251c\u2500\u2500 PCs\u003cbr\u003e          \u251c\u2500\u2500 Airwatterbendertest\u003cbr\u003e              \u2514\u2500\u2500 Airwatterbendertest Character Sheet.md\u003cbr\u003e          \u251c\u2500\u2500 Anju\u003cbr\u003e              \u2514\u2500\u2500 Anju Character Sheet.md\u003cbr\u003e          \u251c\u2500\u2500 Spirittest\u003cbr\u003e              \u2514\u2500\u2500 Spirittest Character Sheet.md\u003cbr\u003e          \u251c\u2500\u2500 TestChar\u003cbr\u003e              \u2514\u2500\u2500 TestChar Character Sheet.md\u003cbr\u003e          \u251c\u2500\u2500 TestQuick\u003cbr\u003e              \u2514\u2500\u2500 TestQuick Character Sheet.md\u003cbr\u003e          \u2514\u2500\u2500 TmpTest\u003cbr\u003e              \u2514\u2500\u2500 TmpTest Character Sheet.md\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u251c\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Fire\u003cbr\u003e                  \u251c\u2500\u2500 Firebending Moves\u003cbr\u003e                      \u251c\u2500\u2500 Level 1\u003cbr\u003e                          \u2514\u2500\u2500 03cbr\u003e- Stone Shield\u003cbr\u003e- Earthbending Slot\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eEarthbending\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSpecial Attacks\u003cbr\u003eReaction: Must be initiated by a Firebender in line of sight \u003cbr\u003eLevel 1\u003cbr\u003eLingering Effect\u003cbr\u003e\u003cbr\u003eFocused light is amplified by mirrored shards into a blinding beam.\u003cbr\u003e- Effect: \u003cbr\u003e- Range: 10X meter radius Sphere\u003cbr\u003e- Effect: \u003cbr\u003e\t- Targets in area must make  a DC X  2 Int save to shield or close their eyes or be Blinded for one turn\u003cbr\u003e\t-  If X \u2265 10, Deal Xd4 radiant damage to all creatures in the area\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eTeam-up Moves\u003cbr\u003eEarthbending\u003cbr\u003eFirebending\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eGlassfruit Team-Up Techniques \u003cbr\u003e\u003cbr\u003eX = yz\u003cbr\u003e\u003cbr\u003e-  are the number of bending slots contributed by each bender.\u003cbr\u003e    \u003cbr\u003e- This rewards balanced team effort over just one person dumping points.\u003cbr\u003e    \u003cbr\u003e-X = y \u00d7 z.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e&gt; Example:\u003cbr\u003e&gt; \u003cbr\u003e&gt; - Earthbender contributes 2 slots (y = 2)\u003cbr\u003e&gt;     \u003cbr\u003e&gt; - Firebender contributes 3 (z = 3)\u003cbr\u003e&gt;     \u2192 X = 2 \u00d7 3 = 6\u003cbr\u003e\u003cbr\u003eThese are powerful, multi-element, terrain-altering moves that consume Glassfruit Seeds. Each scales based on X and has different effects depending on the seed used.\u003cbr\u003e\u003cbr\u003eEarthbending \u003cbr\u003eAirbending\u003cbr\u003eWaterbending\u003cbr\u003eFirebending\u003cbr\u003eTeam-up Moves\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSpecial Attacks\u003cbr\u003eReaction: Must be initiated by a Firebender in line of sight \u003cbr\u003eLevel 1\u003cbr\u003eLingering Effect\u003cbr\u003e\u003cbr\u003e- Range: 2X meter radius Sphere\u003cbr\u003e\u003cbr\u003e- Effect: Explosion in an area, dealing Xd6  bludgeoning + half fire damage\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eTeam-up Moves\u003cbr\u003eEarthbending\u003cbr\u003eFirebending\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eReaction: Must be initiated by a Airbender in line of sight \u003cbr\u003eSpecial Attacks\u003cbr\u003eLevel 1\u003cbr\u003eLingering Effect\u003cbr\u003e\u003cbr\u003eA soundblast builds from multiple frequencies and shatters the ground.\u003cbr\u003e- Range: 2X meter radius Sphere\u003cbr\u003e\u003cbr\u003e- Effects:\u003cbr\u003e\t- Targets in area must make CON save of X2 or take Xd8 thunder damage and fall prone\u003cbr\u003e\t- Earth terrain in the zone becomes difficult terrain\u003cbr\u003e\u003cbr\u003eTeam-up Moves\u003cbr\u003eEarthbending\u003cbr\u003eAirbending\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSpecial Attacks\u003cbr\u003eReaction: Must be initiated by a Earthbender in line of sight \u003cbr\u003eLevel 1\u003cbr\u003eLingering Effect\u003cbr\u003eConcentration\u003cbr\u003e\u003cbr\u003e- Range: within line of sight up to 100 meter\u003cbr\u003e- Duration: Lasts until stopped concentrating or for 1 hour.\u003cbr\u003e\u003cbr\u003e- Effect: \u003cbr\u003e\t- As the air vibrates with a cleansing energy as creatures of your choice within radius gain 10  X General Armor\u003cbr\u003e\t- If X \u2265 15, the seal also protects against being Immobilised  \u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eTeam-up Moves\u003cbr\u003eEarthbending\u003cbr\u003eFirebending\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eLevel 1\u003cbr\u003eStress Level\u003cbr\u003eDamaging Move\u003cbr\u003
