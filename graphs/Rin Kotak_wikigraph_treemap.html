:pre;\"\u003eMove or disperse most Lingering Damage effects\u003cbr\u003eAirbending\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eMovement \u003cbr\u003e\u003cbr\u003eMany Airbending techniques can boost movement\u003cbr\u003eAirbending\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003e\u003cbr\u003eThese Moves can be used without expending slots and are meant for out of combat usage\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Utility --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u251c\u2500\u2500 Air\u003cbr\u003e                  \u2514\u2500\u2500 Airbending Moves\u003cbr\u003e                      \u2514\u2500\u2500 Level 3\u003cbr\u003e                          \u2514\u2500\u2500 Hovering Hands.md\u003cbr\u003e              \u2514\u2500\u2500 Fire\u003cbr\u003e                  \u2514\u2500\u2500 Firebending Moves\u003cbr\u003e                      \u2514\u2500\u2500 Level 1\u003cbr\u003e                          \u2514\u2500\u2500 Control Flame.md\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003eAvatar Spirit Check\u003cbr\u003e\ud83c\udf0c Bridge of the Spirit: A Personal Journey\u003cbr\u003e\u003cbr\u003e&gt; \"To be the Avatar is not merely to bend all elements, but to bend one\u2019s self\u2014to align will and wisdom with the needs of the world.\"  \u003cbr\u003e&gt; \u2014 Grandmaster Shuyin of the White Lotus\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udded Reflecting on Your Journey\u003cbr\u003e\u003cbr\u003eEach character stands at a crossroads between spirit and self, and your progression in this campaign is deeply rooted in how your character emotionally and spiritually reacts to the events that unfold. Reflect on:\u003cbr\u003e\u003cbr\u003e- Have recent events hardened them? Are they acting with more recklessness, cruelty, or obsession to achieve their goals\u2014driven by trauma or ambition?\u003cbr\u003e    \u003cbr\u003e- Or have they found inner balance, perhaps discovering a renewed sense of duty or compassion, and beginning to understand the role of a bridge between the mortal and spiritual worlds?\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eThis reflection influences your na and will guide what type of power you unlock next.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd25 Paths of Power\u003cbr\u003e\u003cbr\u003eWhen your character increases their Bridge Level, they may choose one of the following paths, shaped by how they have grown:\u003cbr\u003e\u003cbr\u003eChaotic Awakening\u003cbr\u003e\u003cbr\u003eFor those who pursue strength, vengeance, or control without regard for balance. Unlock a new bending slot in an element already known (but not your origin element).  \u003cbr\u003eExample: A waterbender who has learned firebending may now gain a second firebending move.\u003cbr\u003e\u003cbr\u003eHarmonic Enlightenment\u003cbr\u003e\u003cbr\u003eFor those who embrace their role as a bridge between worlds. Unlock a new bending element, representing spiritual expansion and Avatar-like growth.  \u003cbr\u003eExample: An earthbender may now begin learning airbending.  \u003cbr\u003eAdditionally, you may gain access to rare spiritual techniques (GM approval), such as Spirit-Bending, Healing Flames, Echobending, etc., reflecting your evolving balance and connection to the Avatar Spirit.\u003cbr\u003e\u003cbr\u003e&gt; Choose based on your character's emotional and spiritual arc. This is about what kind of person they are becoming, not just what powers they can gain.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udc8e Spirit Stones\u003cbr\u003e\u003cbr\u003eScattered throughout the world are rare, luminous Spirit Stones, ancient relics humming with resonance from the Spirit World. Each stone can be used in a ritual to unlock or increase a Bridge Level, drawing forth latent potential within the bender\u2019s soul.\u003cbr\u003e\u003cbr\u003e- Your first Bridge Level was gained using one such stone in the initial ritual.\u003cbr\u003e    \u003cbr\u003e- These stones are rare and valuable, often hidden, protected, or born from significant spirit-world events.\u003cbr\u003e    \u003cbr\u003e- Some stones may resonate with specific emotions, elements, or spirits, and influence what type of power is awakened.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e&gt; The ritual may vary depending on location, spirit presence, or celestial timing. Use of a stone should always involve narrative roleplay, reflection, and a meaningful choice.\u003cbr\u003e\u003cbr\u003eTrack stones and their effects in your Spirit Stone Log.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcca Bending Move Availability Table\u003cbr\u003eTABLE:\u003cbr\u003eAvatar Spirit Bridge Level       | Unlocked Move Level      \u003cbr\u003e1                                | Level 1                  \u003cbr\u003e2                                | Level 1                  \u003cbr\u003e3                                | Level 2                  \u003cbr\u003e4                                | Level 2                  \u003cbr\u003e5                                | Level 3                  \u003cbr\u003e6                                | Level 3                  \u003cbr\u003e7                                | Level 4                  \u003cbr\u003e8                                | Level 4                  \u003cbr\u003e9                                | Level 5                  \u003cbr\u003e10                               | Level 5                  \u003cbr\u003e11                               | Level 6                  \u003cbr\u003e12                               | Level 6                  \u003cbr\u003e13                               | Level 7                  \u003cbr\u003e14                               | Level 7                  \u003cbr\u003e15                               | Level 8                  \u003cbr\u003e16                               | Level 8                  \u003cbr\u003e17                               | Level 9                  \u003cbr\u003e18                               | Level 9                  \u003cbr\u003e19                               | Level 9                  \u003cbr\u003e20                               | Level 9                  \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf00 How to Use This Table\u003cbr\u003e\u003cbr\u003e- On odd-numbered Bridge Levels, you gain access to new move tiers.\u003cbr\u003e    \u003cbr\u003e- On even-numbered Bridge Levels, you may select additional moves from existing unlocked tiers, but do not gain a new tier.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\u2728 Next Steps\u003cbr\u003e\u003cbr\u003e- Reflect in your journal: where is your character now\u2014spiritually, emotionally, morally? Use the tag #spiritreflection.\u003cbr\u003e    \u003cbr\u003e- Record any discovered or used Spirit Stones in the Spirit Stone Log.\u003cbr\u003e    \u003cbr\u003e- Meet with the GM to finalize your chosen path: new slot in a known element (Chaotic Awakening) or a new bending element (Harmonic Enlightenment).\u003cbr\u003e    \u003cbr\u003e- Update your Character Sheet Template with any changes to bending capabilities.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eTags:  \u003cbr\u003emechanics #spiritbridge #bending #characterprogression #Avatar #spiritstones #advancement\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Avatar Spirit Bridge Level --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Spirit\u003cbr\u003e                  \u2514\u2500\u2500 Mechanics\u003cbr\u003e                      \u251c\u2500\u2500 Avatar Spirit Check.md\u003cbr\u003e                      \u2514\u2500\u2500 Spiritbending.md\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAvatar Spirit Check\u003cbr\u003e\u003cbr\u003eRoll a d20 as part of a spirit-focused ritual or when prompted by the GM (typically at key story beats or after using a Spirit Stone).\u003cbr\u003e\u003cbr\u003e- If the roll is even: you gain a number of temporary Spiritbending spellslots equal to the d20 result. These slots last until the end of the current scene or until spent, whichever comes first.\u003cbr\u003e- If the roll is odd: you do not gain slots, but you receive one Spirit Echo \u2014 a small, narratively useful boon (example: advantage on one Spiritbending check, a single short vision providing a clue, or temporary insight on a spirit's motive). The GM chooses the precise echo based on context.\u003cbr\u003e\u003cbr\u003eRules &amp; limits (assumptions \u2014 adjust with GM):\u003cbr\u003e\u003cbr\u003e- Maximum gained slots cannot exceed the character's Bridge Level (or another GM-set cap).\u003cbr\u003e- This check is usually available once per long rest unless a Spirit Stone or special ritual grants repeated checks.\u003cbr\u003e- Spirit slots gained are of the lowest available Spiritbending tier and must be used for Spiritbending moves or effects.\u003cbr\u003e\u003cbr\u003eExample:\u003cbr\u003e\u003cbr\u003e- You roll a d20 and get 14 (even). You gain 14 temporary Spiritbending spellslots (subject to the GM cap). You spend 2 of them to cast a Spirit Ward and keep the rest until the end of the scene.\u003cbr\u003e\u003cbr\u003eAvatar Spirit Bridge Level\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e10 +Element Level\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eprogression table\u003cbr\u003eTABLE:\u003cbr\u003eLevel       | Accessible Slots                                                    | Total Moves (Newly Learned)                                                                                                                                           \u003cbr\u003e1           | Level 1                                                             | 1 Slot from Level 1                                                                                                                                                   \u003cbr\u003e2           | Level 1                                                             | 2 Slots from Level 1                                                                                                                                                  \u003cbr\u003e3           | Level 1, Level 2                                                    | 4 Slots (3 from Level 1, 1 from Level 2)                                                                                                                              \u003cbr\u003e4           | Level 1, Level 2                                                    | 6 Slots (4 from Level 1, 2 from Level 2)                                                                                                                              \u003cbr\u003e5           | Level 1, Level 2, Level 3                                           | 9 Slots (5 from Level 1, 3 from Level 2, 1 from Level 3)                                                                                                              \u003cbr\u003e6           | Level 1, Level 2, Level 3                                           | 12 Slots (6 from Level 1, 4 from Level 2, 2 from Level 3)                                                                                                             \u003cbr\u003e7           | Level 1, Level 2, Level 3, Level 4                                  | 16 Slots (7 from Level 1, 5 from Level 2, 3 from Level 3, 1 from Level 4)                                                                                             \u003cbr\u003e8           | Level 1, Level 2, Level 3, Level 4                                  | 20 Slots (8 from Level 1, 6 from Level 2, 4 from Level 3, 2 from Level 4)                                                                                             \u003cbr\u003e9           | Level 1, Level 2, Level 3, Level 4, Level 5                         | 25 Slots (9 from Level 1, 7 from Level 2, 5 from Level 3, 3 from Level 4, 1 from Level 5)                                                                             \u003cbr\u003e10          | Level 1, Level 2, Level 3, Level 4, Level 5                         | 30 Slots (10 from Level 1, 8 from Level 2, 6 from Level 3, 4 from Level 4, 2 from Level 5)                                                                            \u003cbr\u003e11          | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6                | 36 Slots (11 from Level 1, 9 from Level 2, 7 from Level 3, 5 from Level 4, 3 from Level 5, 1 from Level 6)                                                            \u003cbr\u003e12          | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6                | 42 Slots (12 from Level 1, 10 from Level 2, 8 from Level 3, 6 from Level 4, 4 from Level 5, 2 from Level 6)                                                           \u003cbr\u003e13          | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6, Level 7       | 49 Slots (13 from Level 1, 11 from Level 2, 9 from Level 3, 7 from Level 4, 5 from Level 5, 3 from Level 6, 1 from Level 7)                                           \u003cbr\u003 iritbending represents techniques and rituals that draw on the Avatar Spirit or local spirit presences. These moves often focus on communication, protection, travel between worlds, and subtle influence rather than raw damage.\u003cbr\u003e\u003cbr\u003eHow it works (tiny contract):\u003cbr\u003e\u003cbr\u003e- Resource: Spiritbending slots. These come from your Bridge Level, Spirit Stones, and occasional Avatar Spirit Checks.\u003cbr\u003e- Use: Spend slots to cast Spiritbending moves (see Spiritbending Moves.md).\u003cbr\u003e- Limits: The GM may cap maximum temporary slots gained from checks or stones to preserve balance.\u003cbr\u003e\u003cbr\u003eWhen to use:\u003cbr\u003e\u003cbr\u003e- During rituals, when interacting with spirits, when entering spirit-touched locations, or as part of major story beats involving the Avatar Spirit.\u003cbr\u003e\u003cbr\u003eRisks:\u003cbr\u003e\u003cbr\u003e- Spiritbending can attract attention from powerful spirits. Overuse or reckless bargaining may cause hauntings, covenants, or spirit debt.\u003cbr\u003e\u003cbr\u003eQuick references:\u003cbr\u003e\u003cbr\u003e- Moves and examples: Spiritbending Moves\u003cbr\u003e- Mechanics for gaining slots: Avatar Spirit Check\u003cbr\u003e- Progression and Bridge mechanics: Avatar Spirit Bridge Level\u003cbr\u003e\u003cbr\u003eTeam-up Moves\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Spiritbending --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u251c\u2500\u2500 Spirit\u003cbr\u003e                  \u251c\u2500\u2500 ExpandedCollections\u003cbr\u003e                      \u251c\u2500\u2500 ExpandedAvatar Spirit Bridge Level.md\u003cbr\u003e                      \u2514\u2500\u2500 ExpandedSpiritbending Moves.md\u003cbr\u003e                  \u251c\u2500\u2500 Mechanics\u003cbr\u003e                      \u2514\u2500\u2500 Avatar Spirit Check.md\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending Moves\u003cbr\u003e                      \u251c\u2500\u2500 ExpandedCollections\u003cbr\u003e                          \u2514\u2500\u2500 ExpandedSpiritbending Moves.md\u003cbr\u003e                      \u2514\u2500\u2500 Spiritbending Moves.md\u003cbr\u003e              \u2514\u2500\u2500 Team-up Moves\u003cbr\u003e                  \u251c\u2500\u2500 ExpandedCollections\u003cbr\u003e                      \u2514\u2500\u2500 ExpandedTeam-up Moves.md\u003cbr\u003e                  \u2514\u2500\u2500 Team-up Moves.md\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile\u003cbr\u003eCollectionfile \u003cbr\u003eSpiritbending Moves\u003cbr\u003e\u003cbr\u003eSpiritbending moves are special techniques that use the Avatar Spirit's connection to the Spirit World. They tend to be more narrative and rarely purely destructive \u2014 instead focusing on influence, protection, communication, and spiritual transformation.\u003cbr\u003e\u003cbr\u003eCore contract:\u003cbr\u003e\u003cbr\u003e- Inputs: Spiritbending slots (from Bridge Level, Spirit Stones, or Avatar Spirit Checks).\u003cbr\u003e- Outputs: A move effect (see moves below).\u003cbr\u003e- Failure modes: On a failed GM opposed roll or failed concentration, some spirit effects can backfire or produce an unintended Spirit Echo.\u003cbr\u003e\u003cbr\u003eSample Moves\u003cbr\u003e\u003cbr\u003e1. Spirit Ward (cost: 2 slots)\u003cbr\u003e\u003cbr\u003e- Effect: Create a protective aura that grants allies within 3m + (1m \u00d7 slots used) advantage on Spirit-related saves for X minutes.\u003cbr\u003e\u003cbr\u003e2. Soul Sight (cost: 1 slot)\u003cbr\u003e\u003cbr\u003e- Effect: You and one ally can see invisible spirits or spirit effects for 1 minute. Provides a single insight on a spirit's nature.\u003cbr\u003e\u003cbr\u003e3. Calm of Ages (cost: 3 slots)\u003cbr\u003e\u003cbr\u003e- Effect: Attempt to pacify a hostile spirit or calm an area. Target makes a WIS save vs DC = 8 + slots used; on failure the spirit is pacified for 1d6 minutes.\u003cbr\u003e\u003cbr\u003e4. Spirit Relay (cost: variable)\u003cbr\u003e\u003cbr\u003e- Effect: Spend slots to send a short message into the Spirit World (or receive one). Each slot adds clarity and range.\u003cbr\u003e\u003cbr\u003e5. Ancestral Echo (cost: 4 slots)\u003cbr\u003e\u003cbr\u003e- Effect: Temporarily call on an ancestor's skill \u2014 grant an ally a one-time automatic success on a non-combat skill check tied to the ancestor's expertise.\u003cbr\u003e\u003cbr\u003eDesign notes:\u003cbr\u003e\u003cbr\u003e- Moves should be negotiated with the GM for balance and narrative fit.\u003cbr\u003e- Spiritbending is more flexible than elemental bending: creativity and roleplay matter.\u003cbr\u003e\u003cbr\u003eSpiritbending\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Spiritbending Moves --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Spirit\u003cbr\u003e                  \u251c\u2500\u2500 ExpandedCollections\u003cbr\u003e                      \u2514\u2500\u2500 ExpandedSpiritbending.md\u003cbr\u003e                  \u2514\u2500\u2500 Mechanics\u003cbr\u003e                      \u2514\u2500\u2500 Spiritbending.md\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou may use Levels from Air and Earth .\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  Y(Earth): Yd12 Damage per projectile\u003cbr\u003e- X(Air): X Sand Projectiles\u003cbr\u003e\u003cbr\u003e- Z(Earth  Air): Z  5 meter Cone Range\u003cbr\u003e \u003cbr\u003e- One Earthbender shoots Y Sand Projectiles (rolls the Damage roll) and the Airbender controlls them to home to the X Targets)\u003cbr\u003e\u003cbr\u003eEarthbending \u003cbr\u003eAirbending\u003cbr\u003eTeam-up Moves\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eLevel 3\u003cbr\u003e\u003cbr\u003e  - Range: 3  Firebending Slot meters.\u003cbr\u003e  - Duration: 2 rounds Concentration.\u003cbr\u003e  - Create a mirage of heat, imposing disadvantage on attack rolls against creatures within a 10-foot radius of a point you choose.\u003cbr\u003eFirebending\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eReaction\u003cbr\u003eLevel 1\u003cbr\u003e- Range: 5  Airbending Slot meters.\u003cbr\u003e- Duration: Instantaneous.\u003cbr\u003e- Damage: 1d6 bludgeoning per Airbending Slot.\u003cbr\u003e- Attack Roll: Dex \u003cbr\u003e- Use airbending to send a blade of Air hurling at a creature within range\u003cbr\u003e\u003cbr\u003eAirbending\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eBonus Action\u003cbr\u003eMovement\u003cbr\u003eLevel 1\u003cbr\u003e\u003cbr\u003e- Range: Self.\u003cbr\u003e- Duration: 1 Turn.\u003cbr\u003e- Enhance agility by propelling yourself with gusts of air.\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e- Spend 1 Airbending Slot to add 5  Airbending Slot meters to your movement for this turn.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAirbending #Mobility\u003cbr\u003eAirbending\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDanger Sense Reaction.\u003cbr\u003eLevel 1\u003cbr\u003e- Range: 3  Airbending Slot meters.\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e- Push up to Airbending Slot  objects or creatures within Range away, up to Airbending Slot Meters in a chosen direction.\u003cbr\u003e- Creatures must make a Strength save against your Airbending DC.\u003cbr\u003e\u003cbr\u003e10 + Element Level\u003cbr\u003e\u003cbr\u003eElement Level\u003cbr\u003eAirbending\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDanger Sense Reaction\u003cbr\u003eLevel 3\u003cbr\u003e\t- Range: Self\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\t- Gain Advantage on dexterity saving throws until the start of your turn\u003cbr\u003e\u003cbr\u003eAirbending\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDanger Sense Reaction\u003cbr\u003eLevel 2\u003cbr\u003e\t- Range: 2  Airbending Slot meters radius.\u003cbr\u003e- Duration: Instantaneous.\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\tCreate a swirling vortex of air around you to deflect projectiles and disperse lingering Damgage effects.\u003cbr\u003e\u003cbr\u003eAirbending\u003cbr\u003eLevel 2\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eLevel 2\u003cbr\u003e- Range: 5  Airbending Slot meters.\u003cbr\u003e- Attack Roll: Dex + Proficiency.\u003cbr\u003e- Damage: 1d10 bludgeoning per Airbending Slot. Deals another 1d10  Airbending Slot if the Creature hits a Wall.\u003cbr\u003e- Effects:\u003cbr\u003e\t- Utilize airbending to dash towards an enemy within range within line of sight and hit them with a fast blow of pressurised air. The Target has to succeed a Strength saving throw against your Airbending DC or be knocked back your travelled distance this turn. Deals another 1d10  Airbending Slot if the Creature hits a Wall or similar.\u003cbr\u003e\u003cbr\u003eMovement\u003cbr\u003e\u003cbr\u003eAirbending\u003cbr\u003eMovement\u003cbr\u003e\u003cbr\u003eLevel 2\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eLevel 3 \u003cbr\u003e- Range: CL  1 meters.\u003cbr\u003e- Duration: Concentration, up to 1 Minute.\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e- Harness precision air currents to perform subtle or delicate tasks from a distance.\u003cbr\u003e-  Manipulate a small pbject within range or make fine adjustments as if using your hands.\u003cbr\u003e- You can perform sleight-of-hand checks or disable small mechanisms remotely.\u003cbr\u003e\u003cbr\u003eUsage: Precision tool for intricate tasks or stealth.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e\u003cbr\u003e- Utility\u003cbr\u003e\u003cbr\u003eAirbending\u003cbr\u003e\u003cbr\u003eLevel 3\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eBonus Action\u003cbr\u003eLevel 4\u003cbr\u003eConcentration\u003cbr\u003e- Range: 2  Airbending Slot Meter radius centered on yourself that moves with you.\u003cbr\u003e- Duration: Until the start of your next Turn.\u003cbr\u003e- Create a rotating shield of air to protect yourself or allies.\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e- Spend  Airbending Slot. to create a protective barrier of swirling air.\u003cbr\u003e- The shield grants 5  Airbending Slot Evasion to all creatures within Range.\u003cbr\u003e\u003cbr\u003eLingering Effect:  All Ranged Attacks that enter or exit the are made with Disadvantage.\u003cbr\u003e\u003cbr\u003eEvasion\u003cbr\u003eAirbending\u003cbr\u003eLevel 4\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAirbending\u003cbr\u003eLevel 5\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eGlassfruit Team-Up Techniques \u003cbr\u003e\u003cbr\u003eX = yz\u003cbr\u003e\u003cbr\u003e-  are the number of bending slots contributed by each bender.\u003cbr\u003e    \u003cbr\u003e- This rewards balanced team effort over just one person dumping points.\u003cbr\u003e    \u003cbr\u003e-X = y \u00d7 z.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e&gt; Example:\u003cbr\u003e&gt; \u003cbr\u003e&gt; - Earthbender contributes 2 slots (y = 2)\u003cbr\u003e&gt;     \u003cbr\u003e&gt; - Firebender contributes 3 (z = 3)\u003cbr\u003e&gt;     \u2192 X = 2 \u00d7 3 = 6\u003cbr\u003e\u003cbr\u003eThese are powerful, multi-element, terrain-altering moves that consume Glassfruit Seeds. Each scales based on X and has different effects depending on the seed used.\u003cbr\u003e\u003cbr\u003eEarthbending \u003cbr\u003eAirbending\u003cbr\u003eWaterbending\u003cbr\u003eFirebending\u003cbr\u003eTeam-up Moves\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eReaction: Must be initiated by a Airbender in line of sight \u003cbr\u003eSpecial Attacks\u003cbr\u003eLevel 1\u003cbr\u003eLingering Effect\u003cbr\u003e\u003cbr\u003eA soundblast builds from multiple frequencies and shatters the ground.\u003cbr\u003e- Range: 2X meter radius Sphere\u003cbr\u003e\u003cbr\u003e- Effects:\u003cbr\u003e\t- Targets in area must make CON save of X2 or take Xd8 thunder damage and fall prone\u003cbr\u003e\t- Earth terrain in the zone becomes difficult terrain\u003cbr\u003e\u003cbr\u003eTeam-up Moves\u003cbr\u003eEarthbending\u003cbr\u003eAirbending\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSpecial Attacks\u003cbr\u003eReaction: Must be initiated by a Earthbender in line of sight \u003cbr\u003eLevel 1\u003cbr\u003eLingering Effect\u003cbr\u003eConcentration\u003cbr\u003e\u003cbr\u003e- Range: within line of sight up to 100 meter\u003cbr\u003e- Duration: Lasts until stopped concentrating or for 1 hour.\u003cbr\u003e\u003cbr\u003e- Effect: \u003cbr\u003e\t- As the air vibrates with a cleansing energy as creatures of your choice within radius gain 10  X General Armor\u003cbr\u003e\t- If X \u2265 15, the seal also protects against being Immobilised  \u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eTeam-up Moves\u003cbr\u003eEarthbending\u003cbr\u003eFirebending\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e\ud83c\udf47 Origin: \u003cbr\u003e\u003cbr\u003eHigh on the outer cliffs of Omashu and the surrounding valley grow the rare Glassfruit Trees\u2014bizarre plants that draw heavy mineral content from the stone and soil, producing glass-like fruit with dense crystalline seeds. These seeds:\u003cbr\u003e\u003cbr\u003e- Grow in five known varieties, each with distinct elemental-reactive properties.\u003cbr\u003e    \u003cbr\u003e- Can be manipulated by Earthbenders with precise control, refined through spiritual discipline.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eLocal legend says the Earth Lion Turtle left these trees here, believing their presence would help the people grow with stone, not just build from it.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActiontype\u003cbr\u003eLevel\u003cbr\u003eAdditional attributes\u003cbr\u003e\u003cbr\u003e- Range: e.g. Self.\u003cbr\u003e- Duration: e.g. 1 Turn.\u003cbr\u003e- Description for example: Propelling yourself with gusts of air.\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e- the effect(s) of the move e.g. Spend 1 Airbending Slot to add 5  Airbending Slot meters to your movement for this turn.\u003cbr\u003e\u003cbr\u003eElement\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActiontype\u003cbr\u003eLevel\u003cbr\u003eAdditional attributes\u003cbr\u003e\u003cbr\u003e- Range: e.g. Self.\u003cbr\u003e- Duration: e.g. 1 Turn.\u003cbr\u003e- Description for example: Propelling yourself with gusts of air.\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e- the effect(s) of the move e.g. Spend 1 Airbending Slot to add 5  Airbending Slot meters to your movement for this turn.\u003cbr\u003e\u003cbr\u003eElement\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- Creating Mist:\u003cbr\u003e- Cost: 1 Water Charge per 10 ft radius .\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 10 ft radius centered on self.\u003cbr\u003e    - Will grow 10 feet per round until full sized\u003cbr\u003e    - Creates a heavily obscured area for concealment that can be absorbed to regain charges (10 feeet radius per Turn) or blown await by air.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eType: Waterbending spiritbending sub-skill  \u003cbr\u003e\u003cbr\u003eEffect:  \u003cbr\u003eThe bender draws a small amount of water and vaporizes it into a dense mist that spreads over a small to medium area. All creatures within the mist gain Fire Armour.  \u003cbr\u003e\u003cbr\u003eMechanics (TTRPG style):\u003cbr\u003e\u003cbr\u003e- Cost: 1-5 Water Charges\u003cbr\u003e    \u003cbr\u003e- Area: 1 Water Charges Meter radius \u003cbr\u003e    \u003cbr\u003e- Concentration: Water Charges Turns. Every Creature in the area has 10  Water Charges Fire Armor.\u003cbr\u003e    \u003cbr\u003e- Effect: Gradual healing, mental clarity, emotional soothing\u003cbr\u003e    \u003cbr\u003e- Interactions:\u003cbr\u003e    \u003cbr\u003e    - Can be moved by airbenders using wind techniques.\u003cbr\u003e        \u003cbr\u003e    - Can be dispersed or destroyed by strong firebending or extreme heat.\u003cbr\u003e        \u003cbr\u003e        \u003cbr\u003e\u003cbr\u003eAdvanced Technique (Mastery Level):\u003cbr\u003e\u003cbr\u003e- Cleansing Veil: Condenses the mist into a swirling cloak around allies, granting them resistance to poison, disease, or negative spiritual effects for a short duration.\u003cbr\u003eWaterbending\u003cbr\u003eLevel 1\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eBonus Action\u003cbr\u003eLevel 3\u003cbr\u003eCyclic Flow\u003cbr\u003e\u003cbr\u003e- Range:  Self.\u003cbr\u003e- Instead of regaining half you regain all cyclic flow points \u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003
