cbr\u003e+------------------+---------+--------+-------------------------+\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBending Levels\u003cbr\u003eTABLE:\u003cbr\u003e+-----------------------+---------+---------+----+\u003cbr\u003e| Element               | Level   | Notes   |    |\u003cbr\u003e+-----------------------+---------+---------+----+\u003cbr\u003e| Airbending Level      | 0       |         |    |\u003cbr\u003e| Waterbending Level    | 0       |         |    |\u003cbr\u003e| Earthbending Level    | 0       |         |    |\u003cbr\u003e| Firebending Level     | 0       |         |    |\u003cbr\u003e| Spiritbending Level   | 0       |         |    |\u003cbr\u003e+-----------------------+---------+---------+----+\u003cbr\u003e\u003cbr\u003eBending Slots\u003cbr\u003eTABLE:\u003cbr\u003e+-----------+--------------+-------------+-----------+--------+\u003cbr\u003e| Element   | Slot level   | Max Slots   | current   | note   |\u003cbr\u003e+---...","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eTranformation Points cost: 2 Transformation Points\u003cbr\u003eTABLE:\u003cbr\u003e+----------------------+-----------+\u003cbr\u003e| Stat                 | Value     |\u003cbr\u003e+----------------------+-----------+\u003cbr\u003e| Strength (STR)       | 8 (-1)    |\u003cbr\u003e| Dexterity (DEX)      | 14 (+2)   |\u003cbr\u003e| Constitution (CON)   | 12 (+1)   |\u003cbr\u003e+----------------------+-----------+\u003cbr\u003e\u003cbr\u003e- Size: Medium\u003cbr\u003e-  Ideal for scouting, hunting, and ambushing. The Sonar Earmur's sound-based abilities make it perfect for detecting enemies and disrupting plans, while its stealth and mobility allow it to evade retaliation effectively. Its combat abilities make it a nuisance for casters or stealth-reliant foes.\"\u003cbr\u003e\u003cbr\u003e- Movement:\u003cbr\u003e    - Fly 20 m (highly maneuverable, silent).\u003cbr\u003e    - Burrow 5 m (adapted for soft soil and loose earth).\u003cbr\u003e\u003cbr\u003e- Abilities in Sonar Earmur Form:    \u003cbr\u003e    - Echolocation Mastery: Advantage on Perception checks that rely on hearing. Can detect creatures and objects within a 30 m radius, even in complete darkness, unless in a \"silence zone.\"\u003cbr\u003e\t- Silent Hunt: Advantage on Stealth checks while flying or burrowing, as its movements are nearly soundless.\u003cbr\u003e\t- Soundbending Pulse: Once per short rest, the Earmur can emit a focused sound wave that disrupts enemy concentration or reveals hidden creatures. Creatures within 10 m must make a Airbending DC Constitution saving throw or be disoriented (disadvantage on attacks and Perception checks) for 1 minute.\u003cbr\u003e    Combat Stats:\u003cbr\u003e    - Evasion: 16\u003cbr\u003e    - HP: 2 x CL (durable for its size but not a tank).\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eContext:  \u003cbr\u003eImmediately after the group's victory over a corrupted spirit. Mahogany, the group's only spirit, has absorbed the entity\u2019s negative energy and purified it from within through a spiritual contest.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udfaf Mechanics\u003cbr\u003e\u003cbr\u003e- Trigger: Mahogany completes the spirit cleansing.\u003cbr\u003e    \u003cbr\u003e- Airbenders in the group must make a Perception check (DC 12, with advantage).\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eOn Success:  \u003cbr\u003eThey sense a brief, unnatural shift in air pressure\u2014a swirl or pulse like a door opening to a hidden chamber, but they are high on a mountain with nothing around. It vanishes after two seconds.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf00 Mahogany's Vision\u003cbr\u003e\u003cbr\u003e&gt; (Private: The player can request the others to leave the room for this scene.)\u003cbr\u003e\u003cbr\u003e&gt; As the spiritual remnants fade, Mahogany feels a tingle in the air\u2014not hostile, but watchful.  \u003cbr\u003e&gt; Then, a soft voice, cold as distant wind, whispers directly into her ear:\u003cbr\u003e\u003cbr\u003e\"Now... who are you?\"\u003cbr\u003e\u003cbr\u003eMahogany may make a History or Insight check (DC 17) to identify the speaker.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd0d On Success: Recognizing Rin Kotak\u003cbr\u003e\u003cbr\u003eMahogany realizes the voice belongs to Rin Kotak, the elusive Spiritualist of the Night Bloom, a radical airbender known for manipulating sound and blending with wind to near invisibility. He is feared not just for his bending, but for how he weaves ideology into every breath.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udde3\ufe0f Dialogue (If Mahogany responds)\u003cbr\u003e\u003cbr\u003eIf she speaks\u2014aloud or in thought\u2014a ripple of wind answers. On a distant cliff edge, so far that no human voice should carry, a tall, black-robed figure appears, seated cross-legged, barely more than a wraith in the wind. And yet... his voice is inside her again:\u003cbr\u003e\u003cbr\u003e&gt; \u201cYou bent the spirit. Purified it. Took its pain into your own.  \u003cbr\u003e&gt; You\u2019re not like them\u2014not just flesh. Not just bound by the old rules.  \u003cbr\u003e&gt; Intriguing.\u201d\u003cbr\u003e\u003cbr\u003e&gt; \u201cYou stand on a peak, but don\u2019t you feel th...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe village of the Spidermonkeys\u003cbr\u003eAdventure: \u003cbr\u003e\u003cbr\u003eSetting: The Floating Island of the Nomadic Airbenders\u003cbr\u003e\u003cbr\u003eThe players find themselves in a dense forest, where an entire floating island has landed momentarily. This island belongs to a nomadic airbending tribe that has perfected a unique bending style called Silkbending, inspired by their deep bond with the Spiderlemurs.\u003cbr\u003e\u003cbr\u003eThe Spiderlemurs\u003cbr\u003e\u003cbr\u003eA rare species found only in this part of the world, Spiderlemurs have the body of a lemur but with four arms, four legs, and a long prehensile tail. Their heads resemble spiders, complete with multiple eyes and small mandibles. They produce powerful silk from each of their appendages, which they use to glide alongside the airbenders, creating parachutes they manipulate through airbending. Their silk is also essential for the tribe, used for clothing, rope, and even structural supports for their floating homes.\u003cbr\u003e\u003cbr\u003eThe Spiderlemurs assist in keeping the floating island airborne. By gripping the island with their mandibles and spinning silk into large wind-catching sails, they create natural updrafts, allowing the airbenders to maintain their high-altitude lifestyle.\u003cbr\u003e\u003cbr\u003eThe Floating Island Tribe\u003cbr\u003e\u003cbr\u003eThis nomadic tribe typically resides in a hidden valley where a natural updraft allows them to sustain their floating home. They only descend when necessary, usually for trade or in emergencies. Their culture revolves around Silkbending, a refined form of airbending that incorporates Spiderlemur silk into their movements.\u003cbr\u003e\u003cbr\u003eCulture &amp; Traditions\u003cbr\u003e\u003cbr\u003e- Silkbending: A technique unique to this tribe, combining airbending with the manipulation of Spiderlemur silk. Masters can use it to create silk whips, nets, and even glider-like wings.\u003cbr\u003e    \u003cbr\u003e- Self-Sufficiency: The tribe cultivates special crops adapted to high-altitude life. Their clothing is woven from Spiderlemur silk, making it lightwei...","","","Overview of Earth Kingdom adventures, including themes like resilience, strength, and the challenges of navigating a vast and diverse region. Includes guidelines for integrating these modules with the larger campaign.","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview:\u003cbr\u003e\u003cbr\u003eThe Avatar spirit, the bridge between the physical and spiritual realms, is in a precarious state. During the final moments of the last Avatar\u2019s life, a catastrophic event caused the spirit\u2019s essence to splinter, disrupting the cycle of reincarnation and weakening its connection to the Spirit World.\u003cbr\u003e\u003cbr\u003eEvent of Fracture:\u003cbr\u003e\u003cbr\u003eThe fracture occurred during a climactic battle against a monstrous corrupted spirit, commanded by the rogue Spiritbender. The Avatar sacrificed themselves to contain the spirit\u2019s power, but the Spiritbender\u2019s mist disrupted the Avatar\u2019s spiritual essence, leaving it fragmented and vulnerable.\u003cbr\u003e\u003cbr\u003eEffects of the Fracture:\u003cbr\u003e\u003cbr\u003e1. Weakened Avatar State: The current Avatar cannot fully access the power of their predecessors, making their connection to past lives erratic and unreliable.\u003cbr\u003e    \u003cbr\u003e2. Disturbed Spirit World: The fracture has caused chaos in the Spirit World, with dark spirits manifesting more frequently in the physical realm.\u003cbr\u003e    \u003cbr\u003e3. Cycle in Jeopardy: The reincarnation cycle is unstable. If the fracture is not healed, the Avatar may not reincarnate after their current life ends.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eClues to Restoration:\u003cbr\u003e\u003cbr\u003e- Shards of Essence: Fragments of the Avatar spirit linger in sacred locations across the world. By visiting these sites and performing rituals, the group can begin to mend the fractures.\u003cbr\u003e    \u003cbr\u003e- Guidance from Spirits: Certain spirits, such as Shifting Sands or the elusive Bright Flame, may provide insight into restoring the balance.\u003cbr\u003e    \u003cbr\u003e- Confronting the Spiritbender: The rogue Airbender holds knowledge about the fracture and must be confronted to uncover the full truth.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eMechanics:\u003cbr\u003e\u003cbr\u003e- Fractured Avatar State:\u003cbr\u003e    \u003cbr\u003e    - When the Avatar attempts to enter the Avatar State, they must succeed on a Spirit check (DC 18). Failure results in a partial manifestation, granting a single bending style...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview of the purpose of the #Modules folder, including guidelines on how to scale the modules based on the party's power level and integrate them into the main campaign.\u003cbr\u003e\u003cbr\u003eModules\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAshen Steppes\u003cbr\u003e\u003cbr\u003eEnvironment:\u00a0Volcanic plains and hardened lava flows  \u003cbr\u003eSpecialized Style:\u00a0Magma Pulse Bending  \u003cbr\u003eDescription:  \u003cbr\u003eBuilt on a cooled lava plateau, Ashen Steppes is a hardy settlement that thrives amidst ash and fire. Their benders have developed\u00a0Magma Pulse Bending, a high-heat technique that focuses on heating and liquifying stone momentarily to create bursts of molten rock or steam-based propulsion. It\u2019s more aggressive and volatile than traditional earthbending, with a focus on explosive, short-range attacks and reshaping brittle volcanic stone mid-combat.\u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Lava Flare:\u00a0Melts a small patch of ground into a geyser of magma.\u003cbr\u003e    \u003cbr\u003e- Obsidian Shardstorm:\u00a0Shatters cooled lava into razor-sharp fragments hurled at foes.\u003cbr\u003e    \u003cbr\u003e- Ash Drift:\u00a0Uses heated air and ash for sudden propulsion or smokescreen escapes.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWhispering Mesa\u003cbr\u003e\u003cbr\u003eEnvironment:\u00a0Wind-carved sandstone cliffs and canyons  \u003cbr\u003eSpecialized Style:\u00a0Echoform Bending  \u003cbr\u003eDescription:  \u003cbr\u003ePerched atop labyrinthine mesas where the wind never stops howling, Whispering Mesa is home to benders who\u2019ve mastered\u00a0Echoform Bending\u2014a refined technique that utilizes sound vibrations and seismic pulses through brittle stone. They focus on precision, using thin slices, tremor sense, and harmonic resonance to create unstable conditions underfoot or launch sonic-reinforced projectiles.\u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Resonant Blade:\u00a0Vibrates stone into a cutting edge capable of slicing metal.\u003cbr\u003e    \u003cbr\u003e- Tremor Veil:\u00a0Distorts local vibrations to confuse tremor-sensing enemies.\u003cbr\u003e    \u003cbr\u003e- Echo Step:\u00a0Propels the user forward using a precisely timed ground pulse.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWould you like me to create adventure hooks or NPCs tied to these villages?\u003cbr\u003e\u003cbr\u003eYou said:\u003cbr\u003e\u003cbr\u003egreat now do the same for airbender villages\u003cbr\u003e\u003cbr\u003eChatGPT said:\u003cbr\u003e\u003cbr\u003eHere are three distinct\u00a0Ai...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eStonevine Hollow\u003cbr\u003eEnvironment: \u003cbr\u003eSubterranean jungle cave system\u003cbr\u003eSpecialized Style: \u003cbr\u003eVinegrasp BendingDescription:\u003cbr\u003eStonevine Hollow is hidden deep beneath the surface in a lush cave network where glowing fungi and creeping vines dominate the stone landscape. The villagers have developed Vinegrasp Bending, a technique that integrates earthbending with plant interaction. Benders here can manipulate soil and roots in tandem, weaving vines through stone or using soil nutrients to rapidly grow roots as whips, restraints, or bridges. They value patience and symbiosis, with their bending resembling a slow but overwhelming encroachment.Key Techniques:Root Snare: Erupts tangled roots from the soil to bind enemies.Fungal Bloom: Encourages explosive growth of bioluminescent fungi to blind foes or ","","A sprawling network of caves hiding bandits, lost treasures, or ancient Earth Kingdom artifacts.","The players uncover a smuggling ring operating beneath a major Earth Kingdom city.","","Hidden agendas during a local festival, such as smuggling or political rivalries.","","The party must infiltrate or attack a bandit camp causing problems for a nearby town. Scalable combat and stealth options.","","A session where the party is ambushed by bandits. Includes a scalable encounter table and potential motivations for the bandits.","The party must find a lost Air Nomad relic. Options for clues, red herrings, and NPCs involved.","","Detailed mechanics for a combat scenario with bandits, including scalable stats and optional objectives.","A beast attack on a village, with rules for scaling the beast\u2019s strength and integrating environmental hazards.","","A reusable template for creating scalable combat challenges.","A reusable template for crafting social or dialogue-heavy scenarios.","","A reusable template for creating Earthbending-based puzzles and challenges.","A reusable template for designing political intrigue scenarios.","","Clues uncovered in a marketplace dispute that lead to a larger conspiracy.","A scavenger hunt for an ancient artifact, with puzzles and conflicting NPC objectives.","","Options for resolving a bandit encounter through dialogue, including persuasion challenges and NPC personality traits.","The party witnesses a dispute in a busy marketplace and can choose to mediate, escalate, or exploit the situation.","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSkybison Polo Festival Extravaganza\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003eThe Skybison Polo Festival is an annual event held in the Air Nomad territories, combining thrilling competitions, festive games, and a cultural celebration of the bond between Air Nomads and their beloved skybison. This module introduces the players to the festival, offering opportunities for interaction, skill challenges, and intrigue.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eKey Locations\u003cbr\u003eThe Festival Grounds\u003cbr\u003e- A large, open area with colorful tents, food stalls, and stages for musical performances.\u003cbr\u003e- Games and activities like skybison rides, airbending obstacle courses, and market stalls selling unique wares.\u003cbr\u003e\u003cbr\u003eThe Polo Arena\u003cbr\u003e- The centerpiece of the festival, with a massive circular arena designed for skybison polo.\u003cbr\u003e- Spectators sit in tiered seating, cheering loudly as teams compete.\u003cbr\u003e\u003cbr\u003eThe Betting Tent\u003cbr\u003e- A lively hub where festival-goers can place bets on their favorite teams or players.\u003cbr\u003e- Operated by a charismatic Air Nomad known as Garo the Gamester.\u003cbr\u003e\u003cbr\u003eThe Stables\u003cbr\u003e- A quieter area where the competing skybison are cared for.\u003cbr\u003e- Players might meet the skybison caretakers or sneak around to uncover secrets.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eKey NPCs\u003cbr\u003eMaster Tenzho\u003cbr\u003e- An elder Air Nomad and referee of the polo matches. Wise but with a mischievous sense of humor.\u003cbr\u003e- Knows much about the history of skybison polo.\u003cbr\u003e\u003cbr\u003eGaro the Gamester\u003cbr\u003e- A charming and slightly shady Air Nomad who runs the betting tent.\u003cbr\u003e- Always looking for a way to turn a profit, possibly at the expense of honesty.\u003cbr\u003e\u003cbr\u003eTeam Azure Wings\u003cbr\u003e- A team of young, brash Air Nomads eager to prove their skills.\u003cbr\u003e- Might invite the players to join their team if they need extra members.\u003cbr\u003e\u003cbr\u003eTeam Sky Soarers\u003cbr\u003e- The reigning champions, led by the confident Kani Windstride.\u003cbr\u003e- They are skilled but harbor a secret\u2014they may be cheating to maintain their streak.\u003cbr\u003e\u003cbr\u003eRav
