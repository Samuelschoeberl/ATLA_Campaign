   \u003cbr\u003e- This rewards balanced team effort over just one person dumping points.\u003cbr\u003e    \u003cbr\u003e-X = y \u00d7 z.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e&gt; Example:\u003cbr\u003e&gt; \u003cbr\u003e&gt; - Earthbender contributes 2 slots (y = 2)\u003cbr\u003e&gt;     \u003cbr\u003e&gt; - Firebender contributes 3 (z = 3)\u003cbr\u003e&gt;     \u2192 X = 2 \u00d7 3 = 6\u003cbr\u003e\u003cbr\u003eThese are powerful, multi-element, terrain-altering moves that consume Glassfruit Seeds. Each scales based on X and has different effects depending on the seed used.\u003cbr\u003e\u003cbr\u003eEarthbending \u003cbr\u003eAirbending\u003cbr\u003eWaterbending\u003cbr\u003eFirebending\u003cbr\u003eTeam-up Moves\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSpecial Attacks\u003cbr\u003eReaction: Must be initiated by a Firebender in line of sight \u003cbr\u003eLevel 1\u003cbr\u003eLingering Effect\u003cbr\u003e\u003cbr\u003e- Range: 2X meter radius Sphere\u003cbr\u003e\u003cbr\u003e- Effect: Explosion in an area, dealing Xd6  bludgeoning + half fire damage\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eTeam-up Moves\u003cbr\u003eEarthbending\u003cbr\u003eFirebending\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSpecial Attacks\u003cbr\u003eReaction: Must be initiated by a Earthbender in line of sight \u003cbr\u003eLevel 1\u003cbr\u003eLingering Effect\u003cbr\u003eConcentration\u003cbr\u003e\u003cbr\u003e- Range: within line of sight up to 100 meter\u003cbr\u003e- Duration: Lasts until stopped concentrating or for 1 hour.\u003cbr\u003e\u003cbr\u003e- Effect: \u003cbr\u003e\t- As the air vibrates with a cleansing energy as creatures of your choice within radius gain 10  X General Armor\u003cbr\u003e\t- If X \u2265 15, the seal also protects against being Immobilised  \u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eTeam-up Moves\u003cbr\u003eEarthbending\u003cbr\u003eFirebending\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eLevel 1\u003cbr\u003eStress Level\u003cbr\u003eDamaging Move\u003cbr\u003e\u003cbr\u003e  - Range: Melee\u003cbr\u003e  - Attack Roll: Attacks Firebending Slot times\u003cbr\u003e  - Damage: 1d6 + Strength Bludgeoning + 1d12 fire\u003cbr\u003e\u003cbr\u003eFirebending\u003cbr\u003eFirebending Move\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePlayers Part\u002fRules\u002fBending Rules\u002fSpirit\u002fSpiritbending Moves\u002fUtility\u002fUtility\u003cbr\u003eLevel 1\u003cbr\u003e\u003cbr\u003e- Range: Firebending DC meter\u003cbr\u003e- You manipulate a flame within range\u003cbr\u003e\u003cbr\u003eFirebending\u003cbr\u003eFirebending DC\u003cbr\u003eFirebending Move\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eLevel 1\u003cbr\u003e\u003cbr\u003e  - Range: 5  Firebending Slot meters.\u003cbr\u003e  - Damage:   Firebending Slot  1 d10 fire\u003cbr\u003e  - Attack Roll\u003cbr\u003e  - Unleash a burst of flames in a straight line, damaging one target\u003cbr\u003e\u003cbr\u003eFirebending\u003cbr\u003eDamaging Move\u003cbr\u003eFirebending Move\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSmoldering Focus\u003cbr\u003e\u003cbr\u003eUtility \u002f Support\u003cbr\u003eLevel: 1\u003cbr\u003eAdditional attributes: Stress-aware\u003cbr\u003e\u003cbr\u003e- Range: Self\u003cbr\u003e- Duration: Instant\u003cbr\u003e- Description: Calm your breath and focus heat into a small, steady kernel for control or precision.\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\u003cbr\u003e- Roll: Roll +firebending.\u003cbr\u003e- On a 10+: Reduce your Stress by 1. Choose one: +1 forward to your next firebending roll, or suppress a small fire for 1 minute.\u003cbr\u003e- On a 7\u20139: No stress change; gain +1 forward to your next firebending roll.\u003cbr\u003e- On a miss (6 or less): Gain +1 Stress and the GM introduces a small complication.\u003cbr\u003e\u003cbr\u003eFire\u003cbr\u003eFirebending Move\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCyclic Flow\u003cbr\u003eLevel 1\u003cbr\u003e\u003cbr\u003e- Cost: 1-3 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Duration: 1 round Concentration.\u003cbr\u003e- Range: Touch (through water).\u003cbr\u003e- Effect:  \u003cbr\u003e    You channel healing energy through water, restoring health to a creature. \u003cbr\u003e\t- If the creature is unconscious the creature becomes stable.\u003cbr\u003e    - Healing: 2d8 per charge + Int modifier at the beginning of your next Turn.\u003cbr\u003e    - Limitations: Cannot heal constructs or undead.\u003cbr\u003e\u003cbr\u003eCyclic Flow\u003cbr\u003eWaterbending\u003cbr\u003eLevel 1\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eLevel 1\u003cbr\u003e\u003cbr\u003e- Cost: 1-3 Water Charges.\u003cbr\u003e- Range: 3  Water Charges meter.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender shoots a sharp, pressurized stream of water at a target.\u003cbr\u003e    - Attack Roll\u003cbr\u003e    - Damage: Water Charges d8 piercing or Water Charges d6 bludgeoning damage per Charge.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Piercing Water\u003cbr\u003e- Int\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003eLevel 1\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eType: Waterbending spiritbending sub-skill  \u003cbr\u003e\u003cbr\u003eEffect:  \u003cbr\u003eThe bender draws a small amount of water and vaporizes it into a dense mist that spreads over a small to medium area. All creatures within the mist gain Fire Armour.  \u003cbr\u003e\u003cbr\u003eMechanics (TTRPG style):\u003cbr\u003e\u003cbr\u003e- Cost: 1-5 Water Charges\u003cbr\u003e    \u003cbr\u003e- Area: 1 Water Charges Meter radius \u003cbr\u003e    \u003cbr\u003e- Concentration: Water Charges Turns. Every Creature in the area has 10  Water Charges Fire Armor.\u003cbr\u003e    \u003cbr\u003e- Effect: Gradual healing, mental clarity, emotional soothing\u003cbr\u003e    \u003cbr\u003e- Interactions:\u003cbr\u003e    \u003cbr\u003e    - Can be moved by airbenders using wind techniques.\u003cbr\u003e        \u003cbr\u003e    - Can be dispersed or destroyed by strong firebending or extreme heat.\u003cbr\u003e        \u003cbr\u003e        \u003cbr\u003e\u003cbr\u003eAdvanced Technique (Mastery Level):\u003cbr\u003e\u003cbr\u003e- Cleansing Veil: Condenses the mist into a swirling cloak around allies, granting them resistance to poison, disease, or negative spiritual effects for a short duration.\u003cbr\u003eWaterbending\u003cbr\u003eLevel 1\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSlicing Water (1st Level Move)\u003cbr\u003e\u003cbr\u003e- Cost: 2 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 15 ft cone.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender unleashes a slicing wave of water in a cone, dealing damage to multiple targets.\u003cbr\u003e    - Saving Throw: Targets make a Dexterity save (DC = 8 + Proficiency + Int mod).\u003cbr\u003e    - Damage: 1d6 slashing damage on a failed save, half on success.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Rules\u003cbr\u003e- Slicing Water\u003cbr\u003e- Waterbending Moves\u003cbr\u003e- Proficiency\u003cbr\u003e- Int\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003eLevel 1\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eWater Whip (Level 1 Ability)\u003cbr\u003e\u003cbr\u003e- Cost: 1 Water Charge.\u003cbr\u003e- Range: 20 ft.\u003cbr\u003e- Action: 1 Action.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender lashes out with a tendril of water, striking a target within range.\u003cbr\u003e    - Attack Roll: Intelligence + Proficiency Bonus.\u003cbr\u003e    - Damage: 1d8 + Int modifier bludgeoning damage.\u003cbr\u003e    - Special: The target must succeed on a Strength saving throw (DC 10 + Int modifier + Proficiency) or be knocked back 10 feet.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Strength\u003cbr\u003e- Rules\u003cbr\u003e- Water Whip\u003cbr\u003e- Proficiency\u003cbr\u003e- Int\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003eLevel 1\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eReaction\u003cbr\u003e\u003cbr\u003e- Range: 5  Waterbending Levelmeter.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender can attempt to freeze a creature that has been hit by a Move using Water Charges. It has to succeed a Strength Saving throw against your Waterbending DC or become Immobilised.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Waterbending Level\u003cbr\u003eWaterbending\u003cbr\u003eLevel 2\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eIce Daggers (2nd Level Move)\u003cbr\u003e\u003cbr\u003e- Cost: 1-2CL Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 20 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender creates sharp daggers of ice to hurl at targets.\u003cbr\u003e- Attack Roll\u003cbr\u003e- Damage: 1d8 + Int modifier piercing damage per dagger (can create up to 2CL daggers).\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- CL\u003cbr\u003e- Ice Daggers\u003cbr\u003e- Int\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003eLevel 2\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eWall of Water (2nd Level Move)\u003cbr\u003e\u003cbr
