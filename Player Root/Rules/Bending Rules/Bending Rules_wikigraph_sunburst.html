500 Air-Earth\u003cbr\u003e                      \u2514\u2500\u2500 Sandstream\u003cbr\u003e                  \u2514\u2500\u2500 Water-Water\u003cbr\u003e                      \u251c\u2500\u2500 Freeze Projectiles\u003cbr\u003e                      \u2514\u2500\u2500 Frozen Aegis\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u003cbr\u003e\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eCollectionfile\u003cbr\u003eplayerroot\u003cbr\u003eteamup\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eAction\u003cbr\u003e\u003cbr\u003eReaction\u003cbr\u003eRange: 3  Airbending Slot meters\u003cbr\u003eEffect:\u003cbr\u003eArea control technique that lets you push 2  Airbending Slot Creatures within a radius 1  Airbending Slot meters.\u003cbr\u003eAirbending\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eair\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYour Airbending Level.\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003cbr\u003eair\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAirbending Moves Progression Table\u003cbr\u003eTABLE:\u003cbr\u003e+---------+-----------------------------------------------------------------+--------------------------------------------------------------------------------------------------------------------------------------------------------------------+\u003cbr\u003e| Level   | Accessible Slots                                                | Total Moves (Newly Learned)                                                                                                                                        |\u003cbr\u003e+---------+-----------------------------------------------------------------+--------------------------------------------------------------------------------------------------------------------------------------------------------------------+\u003cbr\u003e| 1       | Level 1                                                         | 1 Slot from Level 1                                                                                                                                                |\u003cbr\u003e| 2       | Level 1                                                         | 2 Slots from Level 1                                                                                                                                               |\u003cbr\u003e| 3       | Level 1, Level 2                                                | 4 Slots (3 from Level 1, 1 from Level 2)                                                                                                                           |\u003cbr\u003e| 4       | Level 1, Level 2                                                | 6 Slots (4 from Level 1, 2 from Level 2)                                                                                                                           |\u003cbr\u003e| 5       | Level 1, Level 2, Level 3                                       | 9 Slots (5 from Level 1, 3 from Level 2, 1 from Level 3)                                           ...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eMove or disperse most Lingering Damage effects\u003cbr\u003eAirbending\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003cbr\u003eair\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eMovement \u003cbr\u003e\u003cbr\u003eMany Airbending techniques can boost movement\u003cbr\u003eAirbending\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003cbr\u003eair\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003cbr\u003eearth\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eEarthbending Moves Progression Table\u003cbr\u003eTABLE:\u003cbr\u003e+---------+-----------------------------------------------------------------+--------------------------------------------------------------------------------------------------------------------------------------------------------------------+\u003cbr\u003e| Level   | Accessible Slots                                                | Total Moves (Newly Learned)                                                                                                                                        |\u003cbr\u003e+---------+-----------------------------------------------------------------+--------------------------------------------------------------------------------------------------------------------------------------------------------------------+\u003cbr\u003e| 1       | Level 1                                                         | 1 Slot from Level 1                                                                                                                                                |\u003cbr\u003e| 2       | Level 1                                                         | 2 Slots from Level 1                                                                                                                                               |\u003cbr\u003e| 3       | Level 1, Level 2                                                | 4 Slots (3 from Level 1, 1 from Level 2)                                                                                                                           |\u003cbr\u003e| 4       | Level 1, Level 2                                                | 6 Slots (4 from Level 1, 2 from Level 2)                                                                                                                           |\u003cbr\u003e| 5       | Level 1, Level 2, Level 3                                       | 9 Slots (5 from Level 1, 3 from Level 2, 1 from Level 3)                                         ...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview:\u003cbr\u003e\u003cbr\u003eEarthbenders are solid and steadfast, drawing upon the Strength of their bodies and the stability of the ground beneath them. Their techniques focus on defense, fortification, and manipulating terrain. Rather than relying on agility to avoid blows, earthbenders create barriers, raise armor ratings, and reinforce their allies. They harness Earth Charges to shape stone and metal, providing a constant, reliable source of defense and stability.\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003cbr\u003eearth\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eCollectionfile\u003cbr\u003eFirebending\u003cbr\u003e\u003cbr\u003eCollectionfile\u003cbr\u003efire\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003eFor each Level:\u003cbr\u003e-1 Fire Attack Roll\u003cbr\u003e-1 Player Root\u002fRules\u002fBending Rules\u002fFire\u002fMechanics\u002fFirebending DC\u003cbr\u003e+2 Damage\u003cbr\u003e\u003cbr\u003eFirebenders draw power from passion, heat, and intensity. Stress is both a resource and a danger: it fuels more powerful techniques, but too much leaves a bender unstable and at risk of losing control. The following rules convert narrative stress into a simple mechanical resource for firebending moves.\u003cbr\u003e\u003cbr\u003eWhen do you gain Stress Level:\u003cbr\u003e- For every 10 damage you take you take 1 Stress Level\u003cbr\u003e- For every Firebending Slot used in a Damaging Move\u003cbr\u003eWhen you loose Stress Level:\u003cbr\u003e- 1 Stress Level after every turn\u003cbr\u003e\u003cbr\u003eplayerroot\u003cbr\u003efire\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003eAvatar Spirit Check\u003cbr\u003e\ud83c\udf0c Bridge of the Spirit: A Personal Journey\u003cbr\u003e\u003cbr\u003e&gt; \"To be the Avatar is not merely to bend all elements, but to bend one\u2019s self\u2014to align will and wisdom with the needs of the world.\"  \u003cbr\u003e&gt; \u2014 Grandmaster Shuyin of the White Lotus\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udded Reflecting on Your Journey\u003cbr\u003e\u003cbr\u003eEach character stands at a crossroads between spirit and self, and your progression in this campaign is deeply rooted in how your character emotionally and spiritually reacts to the events that unfold. Reflect on:\u003cbr\u003e\u003cbr\u003e- Have recent events hardened them? Are they acting with more recklessness, cruelty, or obsession to achieve their goals\u2014driven by trauma or ambition?\u003cbr\u003e    \u003cbr\u003e- Or have they found inner balance, perhaps discovering a renewed sense of duty or compassion, and beginning to understand the role of a bridge between the mortal and spiritual worlds?\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eThis reflection influences your na and will guide what type of power you unlock next.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd25 Paths of Power\u003cbr\u003e\u003cbr\u003eWhen your character increases their Bridge Level, they may choose one of the following paths, shaped by how they have grown:\u003cbr\u003e\u003cbr\u003eChaotic Awakening\u003cbr\u003e\u003cbr\u003eFor those who pursue strength, vengeance, or control without regard for balance. Unlock a new bending slot in an element already known (but not your origin element).  \u003cbr\u003eExample: A waterbender who has learned firebending may now gain a second firebending move.\u003cbr\u003e\u003cbr\u003eHarmonic Enlightenment\u003cbr\u003e\u003cbr\u003eFor those who embrace their role as a bridge between worlds. Unlock a new bending element, representing spiritual expansion and Avatar-like growth.  \u003cbr\u003eExample: An earthbender may now begin learning airbending.  \u003cbr\u003eAdditionally, you may gain access to rare spiritual techniques (GM approval), such as Spirit-Bending, Healing Flames, Echobending, etc., reflecting your evolving balance and connection to the Avatar Spirit.\u003cbr\u003e\u003cbr\u003e&gt; Choose base...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAvatar Spirit Check\u003cbr\u003e\u003cbr\u003eRoll a d20 as part of a spirit-focused ritual or when prompted by the GM (typically at key story beats or after using a Spirit Stone).\u003cbr\u003e\u003cbr\u003e- If the roll is even: you gain a number of temporary Spiritbending spellslots equal to the d20 result. These slots last until the end of the current scene or until spent, whichever comes first.\u003cbr\u003e- If the roll is odd: you do not gain slots, but you receive one Spirit Echo \u2014 a small, narratively useful boon (example: advantage on one Spiritbending check, a single short vision providing a clue, or temporary insight on a spirit's motive). The GM chooses the precise echo based on context.\u003cbr\u003e\u003cbr\u003eRules &amp; limits (assumptions \u2014 adjust with GM):\u003cbr\u003e\u003cbr\u003e- Maximum gained slots cannot exceed the character's Bridge Level (or another GM-set cap).\u003cbr\u003e- This check is usually available once per long rest unless a Spirit Stone or special ritual grants repeated checks.\u003cbr\u003e- Spirit slots gained are of the lowest available Spiritbending tier and must be used for Spiritbending moves or effects.\u003cbr\u003e\u003cbr\u003eExample:\u003cbr\u003e\u003cbr\u003e- You roll a d20 and get 14 (even). You gain 14 temporary Spiritbending spellslots (subject to the GM cap). You spend 2 of them to cast a Spirit Ward and keep the rest until the end of the scene.\u003cbr\u003e\u003cbr\u003eAvatar Spirit Bridge Level\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003cbr\u003espirit\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSpiritbending represents techniques and rituals that draw on the Avatar Spirit or local spirit presences. These moves often focus on communication, protection, travel between worlds, and subtle influence rather than raw damage.\u003cbr\u003e\u003cbr\u003eHow it works (tiny contract):\u003cbr\u003e\u003cbr\u003e- Resource: Spiritbending slots. These come from your Bridge Level, Spirit Stones, and occasional Avatar Spirit Checks.\u003cbr\u003e- Use: Spend slots to cast Spiritbending moves (see Spiritbending Moves.md).\u003cbr\u003e- Limits: The GM may cap maximum temporary slots gained from checks or stones to preserve balance.\u003cbr\u003e\u003cbr\u003eWhen to use:\u003cbr\u003e\u003cbr\u003e- During rituals, when interacting with spirits, when entering spirit-touched locations, or as part of major story beats involving the Avatar Spirit.\u003cbr\u003e\u003cbr\u003eRisks:\u003cbr\u003e\u003cbr\u003e- Spiritbending can attract attention from powerful spirits. Overuse or reckless bargaining may cause hauntings, covenants, or spirit debt.\u003cbr\u003e\u003cbr\u003eQuick references:\u003cbr\u003e\u003cbr\u003e- Moves and examples: Spiritbending Moves\u003cbr\u003e- Mechanics for gaining slots: Avatar Spirit Check\u003cbr\u003e- Progression and Bridge mechanics: Avatar Spirit Bridge Level\u003cbr\u003e- #spirit \u003cbr\u003e\u003cbr\u003eteamup \u003cbr\u003eplayerroot\u003cbr\u003espirit\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eAction\u003cbr\u003e\u003cbr\u003eCollectionfile\u003cbr\u003eCollectionfile \u003cbr\u003eSpiritbending Moves\u003cbr\u003e\u003cbr\u003eSpiritbending moves are special techniques that use the Avatar Spirit's connection to the Spirit World. They tend to be more narrative and rarely purely destructive \u2014 instead focusing on influence, protection, communication, and spiritual transformation.\u003cbr\u003e\u003cbr\u003eCore contract:\u003cbr\u003e\u003cbr\u003e- Inputs: Spiritbending slots (from Bridge Level, Spirit Stones, or Avatar Spirit Checks).\u003cbr\u003e- Outputs: A move effect (see moves below).\u003cbr\u003e- Failure modes: On a failed GM opposed roll or failed concentration, some spirit effects can backfire or produce an unintended Spirit Echo.\u003cbr\u003e\u003cbr\u003eSample Moves\u003cbr\u003e\u003cbr\u003e1. Spirit Ward (cost: 2 slots)\u003cbr\u003e\u003cbr\u003e- Effect: Create a protective aura that grants allies within 3m + (1m \u00d7 slots used) advantage on Spirit-related saves for X minutes.\u003cbr\u003e\u003cbr\u003e2. Soul Sight (cost: 1 slot)\u003cbr\u003e\u003cbr\u003e- Effect: You and one ally can see invisible spirits or spirit effects for 1 minute. Provides a single insight on a spirit's nature.\u003cbr\u003e\u003cbr\u003e3. Calm of Ages (cost: 3 slots)\u003cbr\u003e\u003cbr\u003e- Effect: Attempt to pacify a hostile spirit or calm an area. Target makes a WIS save vs DC = 8 + slots used; on failure the spirit is pacified for 1d6 minutes.\u003cbr\u003e\u003cbr\u003e4. Spirit Relay (cost: variable)\u003cbr\u003e\u003cbr\u003e- Effect: Spend slots to send a short message into the Spirit World (or receive one). Each slot adds clarity and range.\u003cbr\u003e\u003cbr\u003e5. Ancestral Echo (cost: 4 slots)\u003cbr\u003e\u003cbr\u003e- Effect: Temporarily call on an ancestor's skill \u2014 grant an ally a one-time automatic success on a non-combat skill check tied to the ancestor's expertise.\u003cbr\u003e\u003cbr\u003eDesign notes:\u003cbr\u003e\u003cbr\u003e- Moves should be negotiated with the GM for balance and narrative fit.\u003cbr\u003e- Spiritbending is more flexible than elemental bending: creativity and roleplay matter.\u003cbr\u003e\u003cbr\u003eSpiritbending\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Spiritbending Moves --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules...","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eAction\u003cbr\u003e\u003cbr\u003eYou may use Levels from Air and Earth .\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  Y(Earth): Yd12 Damage per projectile\u003cbr\u003e- X(Air): X Sand Projectiles\u003cbr\u003e\u003cbr\u003e- Z(Earth  Air): Z  5 meter Cone Range\u003cbr\u003e \u003cbr\u003e- One Earthbender shoots Y Sand Projectiles (rolls the Damage roll) and the Airbender controlls them to home to the X Targets)\u003cbr\u003e\u003cbr\u003eplayerroot #air #earth #Level3\u003cbr\u003e\u003cbr\u003eLevel3\u003cbr\u003eair\u003cbr\u003eearth\u003cbr\u003eplayerroot\u003cbr\u003eteamup\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eAction\u003cbr\u003e\u003cbr\u003eAction\u003cbr\u003eLevel 3\u003cbr\u003e\u003cbr\u003e  - Range: 3  Firebending Slot meters.\u003cbr\u003e  - Duration: 2 rounds Concentration.\u003cbr\u003e  - Create a mirage of heat, imposing disadvantage on attack rolls against creatures within a 10-foot radius of a point you choose.\u003cbr\u003eFirebending\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003cbr\u003eteamup\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eAction\u003cbr\u003e\u003cbr\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  X: X number of projectiles \u003cbr\u003e-  Y: Yd6 Damage per projectile\u003cbr\u003e \u003cbr\u003e- One waterbender shoots X Water Projectiles (rolls the attack role) and the other one Freezes them  rolls the damage rolls)\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003eTeam-up Moves\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003cbr\u003eteamup\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eAction\u003cbr\u003e\u003cbr\u003eMust be initiated by at least two Waterbenders.  \u003cbr\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  X: X  10 Barrier Armor definintion \u003cbr\u003e-  Y: Y  5 Healing at the start of their turn\u003cbr\u003e\u003cbr\u003e- Encase a willing ally in a jagged prism of glacial ice with a liquid healing core.\u003cbr\u003e    \u003cbr\u003e- The ally immediately gains the effects of Barrier Armor definintion\u003cbr\u003e    \u003cbr\u003e- At the start of their next turn, as the ice thaws, they are healed for 2 \u00d7 Y but their Movement is halved.\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003eTeam-up Moves\u003cbr\u003eHealing\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003cbr\u003eteamup\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eAction\u003cbr\u003e\u003cbr\u003eGlassfruit Varieties\u003cbr\u003e\u003cbr\u003eShort catalogue of common glassfruit types and their flavour\u002faffinities:\u003cbr\u003e\u003cbr\u003e- Watermelon Bastion (earth+water): large, forms push-spheres and healing steam when annealed and vented. Often used for barricades and field-healing devices.\u003cbr\u003e- Sunburst Nectarfield (lemonseed) (fire+air): refracts light, causes flashburst and healing cleanses; often launched and detonated midair.\u003cbr\u003e- Cactusfruit Bulb (earth+fire): crystalline bramble traps and restrains; used for area control.\u003cbr\u003e- Prism Bloom (clear soulseed): spirit-linked prism that absorbs and redirects elemental attacks.\u003cbr\u003e- Glassfang (beastseed) (rare): shard-tooth seeds used by Omashu hunters for crafting weapons and wards.\u003cbr\u003e\u003cbr\u003eTags: #glassfruit #varieties #catalogue #mechanics\u003cbr\u003e\u003cbr\u003eQuick storytelling prompt (skillcheck):\u003cbr\u003e\u003cbr\u003e- A caravan needs a Watermelon Bastion prepared in a hurry. Team has time for one quick anneal: combined Press &amp; Heat check (DC = 8 + X). Success yields a tempered bastion for defence; failure yields fragmented shards that must be cleared before travel.\u003cbr\u003e\u003cbr\u003ecatalogue\u003cbr\u003eglassfruit\u003cbr\u003emechanics\u003cbr\u003evarieties\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eAction\u003cbr\u003e\u003cbr\u003eGlasswright Houses\u003cbr\u003e\u003cbr\u003eSmall, specialized guilds that manage Glassfruit cultivation, annealing and shaping in and around Omashu.\u003cbr\u003e\u003cbr\u003e- Typical composition: Earthbender (substrate &amp; lattice), Waterbender (hydration &amp; pressure regulation), Firebender (annealing), Airbender (shaping). Some Houses add spiritbenders or smiths.\u003cbr\u003e\u003cbr\u003e- Role in the setting: They run terraces, operate pressure cradles, and compete through signature press profiles. Houses keep secret techniques that produce distinct glassware and battlefield seed-effects.\u003cbr\u003e\u003cbr\u003eTags: #glasswright #guild #omashu #glassfruit #craft #playerroot\u003cbr\u003e\u003cbr\u003eQuick storytelling hook (skillcheck):\u003cbr\u003e\u003cbr\u003e- Situation: A House's annealing fails mid-press and a half-formed crop threatens to explode.\u003cbr\u003e- Skillcheck: Firebender makes a Press Roll (DC = 10 + X) to stabilise heat; Waterbender may make a Pressure Check (DC = 8 + floor(X\u002f2)) to reduce steam. Success: crop tempered; failure: minor shard\u002fsteam blast and damaged press. Use failure consequences as an encounter or obstacle.\u003cbr\u003e\u003cbr\u003ecraft\u003cbr\u003eglassfruit\u003cbr\u003eglasswright\u003cbr\u003eguild\u003cbr\u003eomashu\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eAction\u003cbr\u003e\u003cbr\u003ePress &amp; Anneal\u003cbr\u003e\u003cbr\u003eThe controlled heating and pressurised annealing stage used to strengthen Glassfruit and activate elemental traits.\u003cbr\u003e\u003cbr\u003eCore rule summary:\u003cbr\u003e\u003cbr\u003e- Typical initiators: Fire + Water (team-up). Use X = product of contributing slots to scale difficulty.\u003cbr\u003e- Base DC: 8 + X (adjust per GM). Firebender usually makes the primary roll; Waterbender may assist for advantage or to reduce DC.\u003cbr\u003e\u003cbr\u003eOutcomes:\u003cbr\u003e\u003cbr\u003e- Success: fruit is \"Tempered\" (see Tempered (trait)).\u003cbr\u003e- Minor fail: reduced HP, minor steam\u002fshard hazard.\u003cbr\u003e- Critical fail: explosive fracture (area hazard, loot lost).\u003cbr\u003e\u003cbr\u003eTags: #press #anneal #mechanics #glassfruit #omashu\u003cbr\u003e\u003cbr\u003eStorytelling hook (skillcheck):\u003cbr\u003e\u003cbr\u003e- A rival House sabotaged a pressure valve; the team must reroute steam while holding the anneal. Firebender Press Roll (DC 12 + X\u002f2) to keep temp steady; Waterbender Pressure Check (DC 10) to vent safely. Failure escalates into an environmental hazard encounter.\u003cbr\u003e\u003cbr\u003eanneal\u003cbr\u003eglassfruit\u003cbr\u003emechanics\u003cbr\u003eomashu\u003cbr\u003epress\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eAction\u003cbr\u003e\u003cbr\u003eTempered (trait)\u003cbr\u003e\u003cbr\u003eA quality granted by successful annealing under controlled pressure.\u003cbr\u003e\u003cbr\u003eMechanical effects (examples):\u003cbr\u003e\u003cbr\u003e- +25% effective HP for wall\u002fstructure effects created from the fruit.\u003cbr\u003e- +1 to stability checks vs. fracture or spirit-corruption.\u003cbr\u003e- Fire-Level effects gain +1 tier on success in some recipes.\u003cbr\u003e\u003cbr\u003eTags: #trait #mechanics #glassfruit #tempered\u003cbr\u003e\u003cbr\u003eStorytelling \u002f short use-case (skillcheck):\u003cbr\u003e\u003cbr\u003e- Situation: Players must decide whether to risk a quick anneal to produce a tempered shard before an approaching bandit raid.\u003cbr\u003e- Skillcheck: Single combined Press &amp; Heat check (DC = 8 + X). Success: fruit gains Tempered; failure: fruit is fragile or explodes, forcing an improvised defence or retreat.\u003cbr\u003e\u003cbr\u003eglassfruit\u003cbr\u003emechanics\u003cbr\u003etempered\u003cbr\u003etrait\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003eIf Concentration is not broken half the Water Charges are refunded.\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Cyclic Flow --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u251c\u2500\u2500 graphs\u003cbr\u003e          \u2514\u2500\u2500 graphs\u002fPlayers Partwikigraphtreemap.html\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Water\u003cbr\u003e                  \u251c\u2500\u2500 ExpandedCollections\u003cbr\u003e                      \u2514\u2500\u2500 Player Root\u002fRules\u002fBending Rules\u002fWater\u002fMechanics\u002fExpandedCollections\u002fExpandedWater Charges\u003cbr\u003e                  \u251c\u2500\u2500 Mechanics\u003cbr\u003e                      \u2514\u2500\u2500 Water Charges\u003cbr\u003e                  \u2514\u2500\u2500 Waterbending Moves\u003cbr\u003e                      \u251c\u2500\u2500 Level 1\u003cbr\u003e                          \u2514\u2500\u2500 Healing Water\u003cbr\u003e                      \u251c\u2500\u2500 Level 2\u003cbr\u003e                          \u2514\u2500\u2500 Water Tentacles\u003cbr\u003e                      \u2514\u2500\u2500 Level 3\u003cbr\u003e aces)\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCombat Stats:\u003cbr\u003e\u003cbr\u003e- Evasion: 17\u003cbr\u003e    \u003cbr\u003e- HP: 21 (fragile, relies on mobilit...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eLevel2\u003cbr\u003espirit \u003cbr\u003eReaction \u003cbr\u003e\u003cbr\u003e- Range: self\u003cbr\u003e- Duration: spiritbending slot rounds.\u003cbr\u003e\u003cbr\u003eEffect:\u003cbr\u003eProvides 4  spiritbending slot General Armor, Evasion,  Barrier and Damage Dice Bonus until the start of your next turn. \u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003espirit\u003cbr\u003e\u003cbr\u003eLevel2\u003cbr\u003eReaction\u003cbr\u003eplayerroot\u003cbr\u003espirit\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eCollectionfile\u003cbr\u003e\u003cbr\u003eThese Moves can be used without expending slots and are meant for out of combat usage\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Utility --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 graphs\u003cbr\u003e          \u2514\u2500\u2500 graphs\u002fPlayers Partwikigraphtreemap.html\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u003cbr\u003e\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eCollectionfile\u003cbr\u003eplayerroot\u003cbr\u003espirit\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eAction\u003cbr\u003e\u003cbr\u003e- Cost: None.\u003cbr\u003e- Type: Bonus Action.\u003cbr\u003e- Range: 15 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender can freeze a small amount of water, such as a puddle or a drink-sized volume. The higher the Level the more water can be frozen.\u003cbr\u003e    - Duration: Permanent until thawed naturally.\u003cbr\u003e    - Uses: Create s
