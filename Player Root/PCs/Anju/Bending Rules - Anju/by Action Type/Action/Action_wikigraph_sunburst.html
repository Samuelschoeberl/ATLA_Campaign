        <script charset="utf-8" src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>                <div id="b2fbc638-aa01-49e4-9109-69c2f1d12f17" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script type="text/javascript">                                    window.PLOTLYENV=window.PLOTLYENV || {};                                    if (document.getElementById("b2fbc638-aa01-49e4-9109-69c2f1d12f17")) {                    Plotly.newPlot(                        "b2fbc638-aa01-49e4-9109-69c2f1d12f17",                        [{"branchvalues":"total","hovertemplate":"%{label}\u003cbr\u003e%{hovertext}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003e- Range: 3m  water (2) level\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender can freeze an amount of water. The higher the water (2) Level the more water can be frozen. (for big amounts might need to roll an Intelligence (0) check) \u003cbr\u003e\u003cbr\u003efreezingAnju\u003cbr\u003ewaterAnju \u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003eReactionAnju \u003cbr\u003e \u003cbr\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots (min 1 in each):\u003cbr\u003e-  X: X \\ 10 Barrier (0) and X \\ 20 Fire Armor (2) until the start if the Targets Turn\u003cbr\u003e-  Y: Y \\ 5 Healing at the start of the Targets turn if barrier remains unbroken\u003cbr\u003eRange: X + Y from all benders\u003cbr\u003e- If the barrier is not destroyed at the start of the Targets next turn, as the ice thaws, they are healed but their Movement (5) is halved.\u003cbr\u003e\u003cbr\u003e- Encase an ally in a pillar of glacial ice with a liquid healing core.\u003cbr\u003e\u003cbr\u003eteamupAnju \u003cbr\u003eLevel2Anju \u003cbr\u003ewaterAnju\u003c\u002fspan\u003e"," ont-family:monospace;white-space:pre;\"\u003eActionAnju \u003cbr\u003eReactionAnju \u003cbr\u003e\u003cbr\u003e-  Y(Earthbending slot (3)): Yd12 Damage per projectile\u003cbr\u003e- X(Airbendingslot (0)): X Projectiles Air Attack Roll (1d20 + 0 + 1)\u003cbr\u003e- Range: Y  X meters from the Airbender \u003cbr\u003e \u003cbr\u003e \u003cbr\u003e- One Earthbender shoots Y Sand Projectiles (rolls the Damage roll) and the Airbender controlls them to home to the X Targets)\u003cbr\u003e\u003cbr\u003eLevel1Anju\u003cbr\u003eairAnju\u003cbr\u003eearthAnju\u003cbr\u003eteamupAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju \u003cbr\u003eConcentrationAnju \u003cbr\u003e\u003cbr\u003e- Cost: None.\u003cbr\u003e- Duration: At Will. Concentration.\u003cbr\u003e- Effect:  \u003cbr\u003e    You can manipulate a water, shaping it into simple forms, moving it, or changing its state (solid, liquid, mist) temporarily.\u003cbr\u003e    - Limitations: Cannot deal damage but can be used for utility (e.g., extinguishing flames, creating distractions). The higher your Level is the more water can be shaped. Might need an \u003cbr\u003e\u003cbr\u003eWaterAnju\u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju \u003cbr\u003e\u003cbr\u003e- Range: 2  Watercharge (4) meter cone\u003cbr\u003e-  Water Attack Roll (1d20 + 2 + 5) per enemy\u003cbr\u003e- Damage: Watercharge (4)d6 slicing damage to all creatures within the area.\u003cbr\u003e\u003cbr\u003eLevel2Anju\u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003e\u003cbr\u003e- Range: #MeeleAnju\u003cbr\u003e- Earth Attack Roll (1d20 + 1 + 3)\u003cbr\u003e- Damage:  Earthbending slot (3) d10 bludgeoning damage. The target must succeed a str saving throw against your Earthbending DC (4) or be knocked back Earthbending slot (3) meters.
