 be used by any character (if its logic :D)  as part of their Moves to enhance them creatively.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eGrants Damage reduction. \u003cbr\u003eBase armor:\u003cbr\u003e\u003cbr\u003ePlayer Root\u002fRules\u002fcore rules\u002fGeneral Armor Definition (0) reduces all Damage Types in addition to their specific type Armor (other than spiritual). \u003cbr\u003e\u003cbr\u003ePlayer Root\u002fRules\u002fcore rules\u002fPhysical Armor Definition (0) reduces all Piercing Slashing and bludgeoning Damage.\u003cbr\u003e\u003cbr\u003ePlayer Root\u002fRules\u002fcore rules\u002fBarrier definintion (0) Whenever you suffer unblocked damage Barrier (0) Armor halves\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eWhenever you suffer unblocked damage for the first Time Barrier (0) halves (rounded down)\u003cbr\u003eThe Second Time you suffer unblocked damage the Barrier is destroyed.\u003cbr\u003e\u003cbr\u003eFor example when you have 15 Barrier (0) and suffer 18 damage you suffer 3 Damage and Barrier (0)  halves to 7. When you then take 11 damage you suffer 4 damage and the Barrier (0) is destroyed.\u003cbr\u003e\u003cbr\u003eBarrier Damage reduction is always applied before any other (e.g. General Armor (1)) (the barrier also halves\u002fis destroyed if the remaining damage is blocked)\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAirbending Slot Progression (0)\u003cbr\u003eFirebending Slot Progression (0)\u003cbr\u003eEarthbending Slot Progression (0)\u003cbr\u003eSpiritbending Slot Progression (0)\u003cbr\u003eWater Charges (0)\u003cbr\u003eWaterbottle Charge (4)\u003cbr\u003eenvironmentalwatercharge (9)\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eWhen a creature is standing within 1 meter of another creature it also gets affected by a #clusterAnju Move\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCon save DC of max(10, Damage Taken \u002f 2)\u003cbr\u003eSome Moves require concentration to keep them up. If you take damage while concentrationg you have to make a Con (2) save with a DC of max(10, Damage Taken \u002f 2)\u003cbr\u003ePlayer Root (0)\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eReduces All Damage Types other than Spirit Damage.\u003cbr\u003ebase general armor:\u003cbr\u003eearth (1) level\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eIf not Specified otherwise, lingering effect last until the start of your next Turn.\u003cbr\u003eIf caused by a damaging Move: Every creature that ends its turn there will get half the original attacks Damage.\u003cbr\u003ePlayer Root (0)\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePlayer Root (0)\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eIf not defined otherwise 1 meter range so directly next to target.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eMovement per Round:\u003cbr\u003e5 meters + air (0) Level  2\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eReduces Piercing Slashing and Bludgeoning Damage.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou restore all your Hitpoints and Bending Slots\u003cbr\u003ePlayer Root (0)\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDOWN if not specified otherwise.\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou have 3 \\ earth (1) Maximum Slots that are restored after about an hour of rest.\u003cbr\u003e\u003cbr\u003eYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\u003cbr\u003e- spend 2 and then 1 \u003cbr\u003e- spend 1 and then 2 or\u003cbr\u003e- spend 1 then 1 then 1 \u003cbr\u003e\u003cbr\u003eearthAnju \u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview:\u003cbr\u003e\u003cbr\u003eEarthbenders are solid and steadfast, drawing upon the Strength of their bodies and the stability of the ground beneath them. Their techniques focus on defense, fortification, and manipulating terrain. Rather than relying on agility to avoid blows, earthbenders create barriers, raise armor ratings, and reinforce their allies. They harness Earth Charges to shape stone and metal, providing a constant, reliable source of defense and stability.\u003cbr\u003e\u003cbr\u003eearthAnju\u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003eReactionAnju \u003cbr\u003e \u003cbr\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots (min 1 in each):\u003cbr\u003e-  X: X \\ 10 Barrier (0) and X \\ 20 Fire Armor (2) until the start if the Targets Turn\u003cbr\u003e-  Y: Y \\ 5 Healing at the start of the Targets turn if barrier remains unbroken\u003cbr\u003eRange: X + Y from all benders\u003cbr\u003e- If the barrier is not destroyed at the start of the Targets next turn, as the ice thaws, they are healed but their Movement (5) is halved.\u003cbr\u003e\u003cbr\u003e- Encase an ally in a pillar of glacial ice with a liquid healing core.\u003cbr\u003e\u003cbr\u003eteamupAnju \u003cbr\u003eLevel2Anju \u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eIf Concentration is not broken half the Water Charges (0) are refunded.\u003cbr\u003e\u003cbr\u003ewaterAnju \u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eWater Charges represent the amount of water available for a water-bender to manipulate.\u003cbr\u003e\u003cbr\u003e- Environmental Influence:  \u003cbr\u003e   The number of Water Charges available at the start of combat or during an encounter depends on the setting. Feel free to get creative where to find water:\u003cbr\u003e  - Desert\u002fDry Area: 0 Water Charges (minimum water source).\u003cbr\u003e  - Humid Area: 5-10 Water Charges.\u003cbr\u003e  - Near Water Source (Lake, Ocean, etc.): 15 Water Charges.\u003cbr\u003e  - In Lake, Ocean, etc.: 50+ charges\u003cbr\u003e\u003cbr\u003ewaterAnju \u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003e- Range: 3m  water (2) level\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender can freeze an amount of water. The higher the water (2) Level the more water can be frozen. (for big amounts might need to roll an Intelligence (0) check) \u003cbr\u003e\u003cbr\u003efreezingAnju\u003cbr\u003ewaterAnju \u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003eReactionAnju \u003cbr\u003e \u003cbr\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots (min 1 in each):\u003cbr\u003e-  X: X \\ 10 Barrier (0) and X \\ 20 Fire Armor (2) until the start if the Targets Turn\u003cbr\u003e-  Y: Y \\ 5 Healing at the start of the Targets turn if barrier remains unbroken\u003cbr\u003eRange: X + Y from all benders\u003cbr\u003e- If the barrier is not destroyed at the start of the Targets next turn, as the ice thaws, they are healed but their Movement (5) is halved.\u003cbr\u003e\u003cbr\u003e- Encase an ally in a pillar of glacial ice with a liquid healing core.\u003cbr\u003e\u003cbr\u003eteamupAnju \u003cbr\u003eLevel2Anju \u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003eCyclicFlowAnju\u003cbr\u003eConcentrationAnju \u003cbr\u003e\u003cbr\u003e- Duration: 1 round Concentration.\u003cbr\u003e- Range: Touch (through water).\u003cbr\u003e- Effect:  \u003cbr\u003e    You channel healing energy through water, restoring health to a creature. \u003cbr\u003e\t- If the creature is unconscious the creature becomes stable immediately.\u003cbr\u003e    - Healing: Watercharge (4) \\ 2 d8  at the beginning of your next Turn.\u003cbr\u003e\u003cbr\u003eLevel1Anju\u003cbr\u003ewaterAnju\u003cbr\u003ehealingAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju \u003cbr\u003e\u003cbr\u003e- Range: 5  water (2) level\u003cbr\u003e- Water Attack Roll (1d20 + 2 + 5)\u003cbr\u003e- Projectiles: Watercharge (4) \\ 2\u003cbr\u003e- Damage: 1d6 piercing and 1d4 Ice Damage per Projectile\u003cbr\u003e\u003cbr\u003eYou create small sharp daggers of ice to hurl at targets.\u003cbr\u003e\u003cbr\u003eLevel2Anju\u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003e\u003cbr\u003e- Range: 3\\ Watercharge (4) meters\u003cbr\u003e- Water Attack Roll (1d20 + 2 + 5)\u003cbr\u003e- Damage: Watercharge (4)d6 piercing.\u003cbr\u003e\u003cbr\u003eThe waterbender shoots a sharp, pressurized stream of water at a target.\u003cbr\u003e\u003cbr\u003eLevel1Anju\u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003e\u003cbr\u003e- Range: 3\\ Earthbending slot (3) meters\u003cbr\u003e- Earth Attack Roll (1d20 + 1 + 3)\u003cbr\u003e- Damage: Earthbending slot (3)d6 bludgeoning.\u003cbr\u003e\u003cbr\u003eEffect:\u003cbr\u003e- Lift and throw a small rock. Simple ranged attack.\u003cbr\u003e\u003cbr\u003eLevel1Anju\u003cbr\u003eearthAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju \u003cbr\u003eReactionAnju \u003cbr\u003e\u003cbr\u003e-  Y(Earthbending slot (3)): Yd12 Damage per projectile\u003cbr\u003e- X(Airbendingslot (0)): X Projectiles Air Attack Roll (1d20 + 0 + 1)\u003cbr\u003e- Range: Y  X meters from the Airbender \u003cbr\u003e \u003cbr\u003e \u003cbr\u003e- One Earthbender shoots Y Sand Projectiles (rolls the Damage roll) and the Airbender controlls them to home to the X Targets)\u003cbr\u003e\u003cbr\u003eLevel1Anju\u003cbr\u003eairAnju\u003cbr\u003eearthAnju\u003cbr\u003eteamupAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju \u003cbr\u003eConcentrationAnju \u003cbr\u003e\u003cbr\u003e- Cost: None.\u003cbr\u003e- Duration: At Will. Concentration.\u003cbr\u003e- Effect:  \u003cbr\u003e    You can manipulate a water, shaping it into simple forms, moving it, or changing its state (solid, liquid, mist) temporarily.\u003cbr\u003e    - Limitations: Cannot deal damage but can be used for utility (e.g., extinguishing flames, creating distractions). The higher your Level is the more water can be shaped. Might need an \u003cbr\u003e\u003cbr\u003eWaterAnju\u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju \u003cbr\u003e\u003cbr\u003e- Range: 2  Watercharge (4) meter cone\u003cbr\u003e-  Water Attack Roll (1d20 + 2 + 5) per enemy\u003cbr\u003e- Damage: Watercharge (4)d6 slicing damage to all creatures within the area.\u003cbr\u003e\u003cbr\u003eLevel2Anju\u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003e\u003cbr\u003e- Range: #MeeleAnju\u003cbr\u003e- Earth Attack Roll (1d20 + 1 + 3)\u003cbr\u003e- Damage:  Earthbending slot (3) d10 bludgeoning damage. The target must succeed a str saving throw against your Earthbending DC (4) or be knocked back Earthbending slot (3) meters.\u003cbr\u003e\u003cbr\u003eearthAnju \u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003eCyclicFlowAnju \u003cbr\u003e\u003cbr\u003eRange: water (2)\u003cbr\u003eWater Attack Roll (1d20 + 2 + 5)\u003cbr\u003eDamage: Watercharge (4)d4 bludgeoning damage\u003cbr\u003eGrapple: A creature hit by the tentacle must succeed on a Strength saving throw against your Waterbending DC (7) or be Slowed (0) and Immobilised (0) for one turn. \u003cbr\u003e\u003cbr\u003eLevel2Anju\u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eBonusActionAnju  \u003cbr\u003e\u003cbr\u003e- Range: self and every creature within 1+1  Earthbending slot (3) meters of you\u003cbr\u003e\u003cbr\u003eEffect:\u003cbr\u003eTripping opponents with minor terrain manipulation. The target must succeed on a Dexterity saving throw against your Earthbending DC (4)) or be knocked Prone.\u003cbr\u003e\u003cbr\u003eLevel1Anju \u003cbr\u003eearthAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eBonusActionAnju  \u003cbr\u003eMobilityAnju \u003cbr\u003eWhen you are moving over sand you can increase your Movement (5) by earth (1) meters.\u003cbr\u003e\u003cbr\u003eLevel1Anju \u003cbr\u003eearthAnju \u003cbr\u003eutilityAnju\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eReactionAnju (waterbender)\u003cbr\u003eDangerSenseReactionAnju (airbender)\u003cbr\u003e\u003cbr\u003e- Y(Watercharge (4)): Yd6 Fire Armor (2). The Waterbender must be in water (2) meter of the airbender.\u003cbr\u003e- X(Airbendingslot (0)): X meters cone range from the Airbender.\u003cbr\u003e- Duration: 1 Round\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\tThe Airbender creates a current of air that is cooled by a waterbender.\u003cbr\u003e\u003cbr\u003eLevel2Anju\u003cbr\u003eairAnju\u003cbr\u003ewaterAnju \u003cbr\u003e
