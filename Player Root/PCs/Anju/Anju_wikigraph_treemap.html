              | value   |\u003cbr\u003e+----------------------------------------------------------------+---------+\u003cbr\u003e| Environmental water charge                                     | 4\u002f4     |\u003cbr\u003e| Waterbottle charge                                             | 4\u002f4     |\u003cbr\u003e| &lt;details&gt;&lt;summary&gt;Bonus water charges&lt;\u002fsummary&gt;0\u002f0&lt;\u002fdetails&gt;   |         |\u003cbr\u003e+----------------------------------------------------------------+---------+\u003cbr\u003e\u003cbr\u003eAnju #CharacterSheet\u003cbr\u003e\u003cbr\u003e&gt; WARNING: The following character stats could not be placed by context and were appended:\u003cbr\u003eTABLE:\u003cbr\u003e+---------------------------+-----+\u003cbr\u003e| Amount of learned moves   | 3   |\u003cbr\u003e+---------------------------+-----+\u003cbr\u003e| Bonus bending slots       | 0   |\u003cbr\u003e| Charisma                  | 1   |\u003cbr\u003e| Constitution              | 2   |\u003cbr\u003e| Dexterity                 | 1   |\u003cbr\u003e| Intelligence              | 5   |\u003cbr\u003e| Strength                  | 3   |\u003cbr\u003e| Waterbending slot         | 6   |\u003cbr\u003e| Wisdom                    | 3   |\u003cbr\u003e+---------------------------+-----+\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYour personal Notes:\u003cbr\u003e\u003cbr\u003ethese are my personal notes\u003cbr\u003e\u003cbr\u003e2025-09-17\u003cbr\u003e\u003cbr\u003eAir Nomad people who lost their spirit pet. Bandits\u003cbr\u003e\u003cbr\u003eInventory:\u003cbr\u003e\u003cbr\u003eDagger\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMy character is Anju, the oldest daughter of 5 siblings. Anju's father always wanted a son but he\u003cbr\u003ewas only blessed with daughters. Believing only males could lead the great southern water tribe\u003cbr\u003eto further prosperity, he decided to raise Anju like the son he always wanted to have.\u003cbr\u003e(Anju is derived from \"Angijua\" in Inuktitut which means \"older brother\")\u003cbr\u003eThe mother died after giving birth to the 5th child, Anju and her siblings were raised by their\u003cbr\u003efather and the father's sister.\u003cbr\u003e\u003cbr\u003eEven though Anju was raised like a man, she has a feminine side to her which she learned from\u003cbr\u003eher aunt. The father is strict but also a good instructor. In time, Anju has enough athletic ability\u003cbr\u003eto pass as an average male of her tribe (though not outstanding like Korra). Anju's strength lies\u003cbr\u003ein her ability to create icicles. One of her greatest achievements - and also secrets - is when she\u003cbr\u003ecreated thick icicle soles to appear 5cm taller, which made her taller than her father at that time\u003cbr\u003eand caused her father to appear proud of her for the first time in forever.\u003cbr\u003e\u003cbr\u003eSeeing Anju's proficient icicle making, her father is convinced she is a very talented bender, maybe\u003cbr\u003eeven with potential of becoming the next Avatar. He sends Anju off to\u003cbr\u003e&lt;ENTER SUMMSI'S NAME FOR THE AVATAR CAMP HERE&gt; with one request to\u003cbr\u003eAnju: \"Be a great man that makes the southern water tribe proud\"\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThese Moves can be used without expending slots (and meant for usage out of combat)\u003cbr\u003e\u003cbr\u003eLevel1Anju \u003cbr\u003eairAnju #earthAnju #fireAnju #spiritAnju #waterAnju\u003c\u002fspan\u003e","","","","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eIf not Specified otherwise, Ammunition can be used by any character (if its logic :D)  as part of their Moves to enhance them creatively.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eGrants Damage reduction. \u003cbr\u003eBase armor:\u003cbr\u003e\u003cbr\u003eGeneral Armor Definition (0) reduces all Damage Types in addition to their specific type Armor (other than spiritual). \u003cbr\u003e\u003cbr\u003ePhysical Armor Definition (0) reduces all Piercing Slashing and bludgeoning Damage.\u003cbr\u003e\u003cbr\u003eBarrier definintion (0) Whenever you suffer unblocked damage Barrier (0) Armor halves\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAura is an area effect with the listed meter radius.\u003cbr\u003eIt is centered on the source and moves with them unless stated otherwise.\u003cbr\u003eCreatures or objects inside the radius are affected; leaving the area ends the effect.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eWhenever you suffer unblocked damage for the first Time Barrier (0) halves (rounded down)\u003cbr\u003eThe Second Time you suffer unblocked damage the Barrier is destroyed.\u003cbr\u003e\u003cbr\u003eFor example when you have 15 Barrier (0) and suffer 18 damage you suffer 3 Damage and Barrier (0)  halves to 7. When you then take 11 damage you suffer 4 damage and the Barrier (0) is destroyed.\u003cbr\u003e\u003cbr\u003eBarrier Damage reduction is always applied before any other (e.g. General Armor (1)) (the barrier also halves\u002fis destroyed if the remaining damage is blocked)\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAirbending Slot Progression (0)\u003cbr\u003eFirebending Slot Progression (0)\u003cbr\u003eEarthbending Slot Progression (0)\u003cbr\u003eSpiritbending Slot Progression (0)\u003cbr\u003eWater Charges (0)\u003cbr\u003eWaterbottle Charge (4)\u003cbr\u003eenvironmentalwatercharge (4)\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eWhen a creature is standing within 1 meter of another creature it also gets affected by a #clusterAnju Move\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCon save DC of max(10, Damage Taken \u002f 2)\u003cbr\u003eSome Moves require concentration to keep them up. If you take damage while concentrationg you have to make a Con (2) save with a DC of max(10, Damage Taken \u002f 2)\u003cbr\u003ePlayer Root (0)\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eReduces All Damage Types other than Spirit Damage.\u003cbr\u003ebase general armor:\u003cbr\u003eearth (1) level\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eIf not Specified otherwise, lingering effect last until the start of your next Turn.\u003cbr\u003eIf caused by a damaging Move: Every creature that ends its turn there will get half the original attacks Damage.\u003cbr\u003ePlayer Root (0)\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePlayer Root (0)\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eIf not defined otherwise 1 meter range so directly next to target.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eMovement per Round:\u003cbr\u003e5 meters + air (0) Level  2\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eReduces Piercing Slashing and Bludgeoning Damage.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou restore all your Hitpoints and Bending Slots\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDOWN if not specified otherwise.\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou have 3 \\ earth (1) Maximum Slots that are restored after about an hour of rest.\u003cbr\u003e\u003cbr\u003eYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\u003cbr\u003e- spend 2 and then 1 \u003cbr\u003e- spend 1 and then 2 or\u003cbr\u003e- spend 1 then 1 then 1 \u003cbr\u003e\u003cbr\u003eearthAnju \u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview:\u003cbr\u003e\u003cbr\u003eEarthbenders are solid and steadfast, drawing upon the Strength of their bodies and the stability of the ground beneath them. Their techniques focus on defense, fortification, and manipulating terrain. Rather than relying on agility to avoid blows, earthbenders create barriers, raise armor ratings, and reinforce their allies. They harness Earth Charges to shape stone and metal, providing a constant, reliable source of defense and stability.\u003cbr\u003e\u003cbr\u003eearthAnju\u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju (waterbender)\u003cbr\u003eReactionAnju (waterbender)\u003cbr\u003e \u003cbr\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots (min 1 in each):\u003cbr\u003e-  X: X \\ 10 Barrier (0) and X \\ 20 Fire Armor (2) until the start if the Targets Turn\u003cbr\u003e-  Y: Y \\ 5 Healing at the start of the Targets turn if barrier remains unbroken\u003cbr\u003eRange: X + Y from all benders\u003cbr\u003e- If the barrier is not destroyed at the start of the Targets next turn, as the ice thaws, they are healed but their Movement (5) is halved.\u003cbr\u003e\u003cbr\u003e- Encase an ally in a pillar of glacial ice with a liquid healing core.\u003cbr\u003e\u003cbr\u003eteamupAnju \u003cbr\u003eLevel2Anju \u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eIf Concentration is not broken half the Water Charges (0) are refunded.\u003cbr\u003e\u003cbr\u003ewaterAnju \u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eWater Charges represent the amount of water available for a water-bender to manipulate.\u003cbr\u003e\u003cbr\u003e- Environmental Influence:  \u003cbr\u003e   The number of Water Charges available at the start of combat or during an encounter depends on the setting. Feel free to get creative where to find water:\u003cbr\u003e  - Desert\u002fDry Area: 0 Water Charges (minimum water source).\u003cbr\u003e  - Humid Area: 5-10 Water Charges.\u003cbr\u003e  - Near Water Source (Lake, Ocean, etc.): 15 Water Charges.\u003cbr\u003e  - In Lake, Ocean, etc.: 50+ charges\u003cbr\u003e\u003cbr\u003ewaterAnju \u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003e- Range: 3m  water (2) level\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender can freeze an amount of water without creatures  or other sources of heat in it. The higher the water (2) Level the more water can be frozen. (for big amounts might need to roll an Intelligence (0) check).\u003cbr\u003e\u003cbr\u003efreezingAnju\u003cbr\u003ewaterAnju \u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003eConcentrationAnju\u003cbr\u003e\u003cbr\u003e- Range: A Watercharge (4) m radius area becomes ice slick.\u003cbr\u003e- Save: DEX save vs your Waterbending DC (7) when a creature enters\u002fstarts in the area\u003cbr\u003e- Duration: water (2) rounds (while you concentrate)\u003cbr\u003e\u003cbr\u003eEffect:\u003cbr\u003e- On a failed save, the creature falls Prone and becomes Exhausted (0).\u003cbr\u003e- Creatures with water (2) levels has advantage on the saving throw.\u003cbr\u003e\u003cbr\u003eLevel2Anju\u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju (waterbender)\u003cbr\u003eReactionAnju (waterbender)\u003cbr\u003e \u003cbr\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots (min 1 in each):\u003cbr\u003e-  X: X \\ 10 Barrier (0) and X \\ 20 Fire Armor (2) until the start if the Targets Turn\u003cbr\u003e-  Y: Y \\ 5 Healing at the start of the Targets turn if barrier remains unbroken\u003cbr\u003eRange: X + Y from all benders\u003cbr\u003e- If the barrier is not destroyed at the start of the Targets next turn, as the ice thaws, they are healed but their Movement (5) is halved.\u003cbr\u003e\u003cbr\u003e- Encase an ally in a pillar of glacial ice with a liquid healing core.\u003cbr\u003e\u003cbr\u003eteamupAnju \u003cbr\u003eLevel2Anju \u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003eCyclicFlowAnju\u003cbr\u003eConcentrationAnju \u003cbr\u003e\u003cbr\u003e- Duration: 1 round Concentration.\u003cbr\u003e- Range: Touch (through water).\u003cbr\u003e- Effect:  \u003cbr\u003e    You channel healing energy through water, restoring health to a creature. \u003cbr\u003e\t- If the creature is Bleedingout (0) the creature becomes stable immediately.\u003cbr\u003e    - Healing: Watercharge (4) \\ 2 d8  at the beginning of your next Turn.\u003cbr\u003e\u003cbr\u003eLevel1Anju\u003cbr\u003ewaterAnju\u003cbr\u003ehealingAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju \u003cbr\u003e\u003cbr\u003e- Range: 5  water (2) level\u003cbr\u003e- Water Attack Roll (1d20 + 2 + 5)\u003cbr\u003e- Projectiles: Watercharge (4) \\ 2\u003cbr\u003e- Damage: 1d6 piercing and 1d4 Ice Damage per Projectile\u003cbr\u003e\u003cbr\u003eYou create small sharp daggers of ice to hurl at targets.\u003cbr\u003e\u003cbr\u003eLevel2Anju\u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003e\u003cbr\u003e- Range: 3\\ Watercharge (4) meters\u003cbr\u003e- Water Attack Roll (1d20 + 2 + 5)\u003cbr\u003e- Damage: Watercharge (4)d6 piercing.\u003cbr\u003e\u003cbr\u003eThe waterbender shoots a sharp, pressurized stream of water at a target.\u003cbr\u003e\u003cbr\u003eLevel1Anju\u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003e\u003cbr\u003e- Range: 10 m cone\u003cbr\u003e- Water Attack Roll (1d20 + 2 + 5) \u003cbr\u003e- Damage: Watercharge (4) d6 bludgeoning + Watercharge (4) d4 cold\u003cbr\u003e- Save: STR save vs your Waterbending DC (7) to resist the pull and prone\u003cbr\u003e\u003cbr\u003eEffect:\u003cbr\u003e- On a failed STR save, pull the targe ft up to Water (2) meter towards you and knocked Prone.\u003cbr\u003e\u003cbr\u003eLevel2Anju\u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003e\u003cbr\u003e- Range: 3\\ Earthbending slot (3) meters\u003cbr\u003e- Earth Attack Roll (1d20 + 1 + 3)\u003cbr\u003e- Damage: Earthbending slot (3)d6 bludgeoning.\u003cbr\u003e\u003cbr\u003eEffect:\u003cbr\u003e- Lift and throw a small rock. Simple ranged attack.\u003cbr\u003e\u003cbr\u003eLevel1Anju\u003cbr\u003eearthAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003e\u003cbr\u003e- Range: Watercharge (4) meters\u003cbr\u003e- Water Attack Roll (1d20 + 2 + 5)\u003cbr\u003e- Damage: Watercharge (4)d4 cold.\u003cbr\u003e\u003cbr\u003eEffect:\u003cbr\u003e- On a hit, the target gains Slowed (0) until the end of its next turn.\u003cbr\u003e\u003cbr\u003eLevel1Anju\u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003e\u003cbr\u003e- Range: 2  Earthbending slot (3) meters\u003cbr\u003e- Earth Attack Roll (1d20 + 1 + 3)\u003cbr\u003e- Damage: Earthbending slot (3)d4 bludgeoning.\u003cbr\u003e\u003cbr\u003eEffect:\u003cbr\u003e- On a hit, the target gains Slowed (0) until the end of its next turn.\u003cbr\u003e\u003cbr\u003eLevel1Anju\u003cbr\u003eearthAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju \u003cbr\u003eConcentrationAnju \u003cbr\u003e\u003cbr\u003e- Cost: None.\u003cbr\u003e- Duration: At Will. Concentration.\u003cbr\u003e- Effect:  \u003cbr\u003e    You can manipulate a water, shaping it into simple forms, moving it, or changing its state (solid, liquid, mist) temporarily.\u003cbr\u003e    - Limitations: Cannot deal damage but can be used for utility (e.g., extinguishing flames, creating distractions). The higher your Level is the more water can be shaped. Might need an \u003cbr\u003e\u003cbr\u003eWaterAnju\u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju \u003cbr\u003e\u003cbr\u003e- Range: 2  Watercharge (4) meter cone\u003cbr\u003e-  Water Attack Roll (1d20 + 2 + 5) per enemy\u003cbr\u003e- Damage: Watercharge (4)d6 slicing damage to all creatures within the area.\u003cbr\u003e\u003cbr\u003eLevel2Anju\u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003e\u003cbr\u003e- Range: #MeeleAnju\u003cbr\u003e- Earth Attack Roll (1d20 + 1 + 3)\u003cbr\u003e- Damage:  Earthbending slot (3) d10 bludgeoning damage. The target must succeed a str saving throw against your Earthbending DC (4) or be knocked back Earthbending slot (3) meters.\u003cbr\u003e\u003cbr\u003eearthAnju \u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003eCyclicFlowAnju \u003cbr\u003e\u003cbr\u003eRange: water (2)\u003cbr\u003eWater Attack Roll (1d20 + 2 + 5)\u003cbr\u003eDamage: Watercharge (4)d4 bludgeoning damage\u003cbr\u003eGrapple: A creature hit by the tentacle must succeed on a Strength saving throw against your Waterbending DC (7) or be Exhausted (0) and Immobilised (0) for one turn. \u0 r or ice, moving with increased agility.\u003cbr\u003e    - Speed Boost: Gain 5 meter Movement (5)\u003cbr\u003e\u003cbr\u003eYou can use 1 Watercharge (4) to create an icy surface of 5 meters.\u003cbr\u003e\u003cbr\u003eLevel2Anju\u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eReactionAnju (waterbender)\u003cbr\u003eDangerSenseReactionAnju (airbender)\u003cbr\u003e\u003cbr\u003e- Y(Watercharge (4)): Yd6 Fire Armor (2). The Waterbender must be in water (2) meter of the airbender.\u003cbr\u003e- X(Airbendingslot (0)): X meters cone range from the Airbender.\u003cbr\u003e- Duration: 1 Round\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\tThe Airbender creates a current of air that is cooled by a waterbender.\u003cbr\u003e\u003cbr\u003eLevel2Anju\u003cbr\u003eairAnju\u003cbr\u003ewaterAnju \u003cbr\u003eteamupAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eReactionAnju \u003cbr\u003eConcentrationAnju \u003cbr\u003e\u003cbr\u003e- Target Range: water (2)\u003cbr\u003e\u003cbr\u003eEffect:\u003cbr\u003eWhen a target in range is hit by a damaging Move using Water charges you can reduce the damage by water (2) d10. For every 5 Damage you reduce you gain one Watercharge (4) until the end of your next turn.\u003cbr\u003e\u003cbr\u003eLevel2Anju\u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eReactionAnju\u003cbr\u003eConcentrationAnju \u003cbr\u003e- Range: self and every creature within Earthbending slot (3) Meters of you. (if used on self does not need an Earthbending slot (3))\u003cbr\u003e- Effect:  \u003cbr\u003e\t- Root yourself and every creature within range to resist forced movement.\u003cbr\u003e\t- Duration: 1 round.\u003cbr\u003e\u003cbr\u003eLevel1Anju\u003cbr\u003eearthAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju (waterbender)\u003cbr\u003eReactionAnju (waterbender)\u003cbr\u003e \u003cbr\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots (min 1 in each):\u003cbr\u003e-  X: X \\ 10 Barrier (0) and X \\ 20 Fire Armor (2) until the start if the Targets Turn\u003cbr\u003e-  Y: Y \\ 5 Healing at the start of the Targets turn if barrier remains unbroken\u003cbr\u003eRange: X + Y from all benders\u003cbr\u003e- If the barrier is not destroyed at the start of the Targets next turn, as the ice thaws, they are healed but their Movement (5) is halved.\u003cbr\u003e\u003cbr\u003e- Encase an ally in a pillar of glacial ice with a liquid healing core.\u003cbr\u003e\u003cbr\u003eteamupAnju \u003cbr\u003eLevel2Anju \u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eUntil the start of your next turn, double all of your armor values against the next Attack that targets you. Ends after that attack is resolved.\u003cbr\u003e\u003cbr\u003econditionAnju #BoonAnju #generalAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDouble the strength of your Barrier against the next Attack that would hit you. Ends after that attack is resolved.\u003cbr\u003e\u003cbr\u003econditionAnju #BoonAnju #generalAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eReplaces the standard DnD unconscious state so turns are still taken.\u003cbr\u003e\u003cbr\u003e- When you hit 0 HP (0) you become Bleeding out #BleedingoutAnju\u003cbr\u003e- At the start of each of your turns you roll a death saving throw (3 successes = you can stop rolling death saving throws for 3 rounds, 3 failures = dead). You keep taking your turn either way.\u003cbr\u003e- Your total movement is capped at 1 meter per round while Bleeding out.\u003cbr\u003e- Any Move you take while Bleeding out can expend at most 1 bending slot, making your options ;\"\u003eHalfed movement speed or to spend half your movement to end the condition.\u003cbr\u003e\u003cbr\u003eYou have\u00a0Disadvantag on attack rolls. An attack roll against you has\u00a0Advantage.\u003cbr\u003e\u003cbr\u003econditionAnju #CurseAnju #generalAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYour Initiative is doubled while this condition is active. It typically ends at the end of your next turn unless a move says otherwise.\u003cbr\u003e\u003cbr\u003econditionAnju #BoonAnju #generalAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYour Initiative is halved (rounded down) while this condition is active. It typically ends at the end of your next turn unless a move says otherwise.\u003cbr\u003e\u003cbr\u003econditionAnju #CurseAnju #generalAnju\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eBonusActionAnju  \u003cbr\u003e\u003cbr\u003e- Range: self and every creature within 1+1  Earthbending slot (3) meters of you\u003cbr\u003e\u003cbr\u003eEffect:\u003cbr\u003eTripping opponents with minor terrain manipulation. The target must succeed on a Dexterity saving throw against your Earthbending DC (4)) or be knocked Prone.\u003cbr\u003e\u003cbr\u003eLevel1Anju \u003cbr\u003eearthAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eReactionAnju\u003cbr\u003eConcentrationAnju \u003cbr\u003e- Range: self and every creature within Earthbending slot (3) Meters of you. (if used on self does not need an Earthbending slot (3))\u003cbr\u003e- Effect:  \u003cbr\u003e\t- Root yourself and every creature within range to resist forced movement.\u003cbr\u003e\t- Duration: 1 round.\u003cbr\u003e\u003cbr\u003eLevel1Anju\u003cbr\u003eearthAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003e\u003cbr\u003e- Range: 3\\ Earthbending slot (3)  Move using Water charges you can reduce the damage by water (2) d10. For every 5 Damage you reduce you gain one Watercharge (4) until the end of your next turn.\u003cbr\u003e\u003cbr\u003eLevel2Anju\u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003eConcentrationAnju\u003cbr\u003e\u003cbr\u003e- Range: A Watercharge (4) m radius area becomes ice slick.\u003cbr\u003e- Save: DEX save vs your Waterbending DC (7) when a creature enters\u002fstarts in the area\u003cbr\u003e- Duration: water (2) rounds (while you concentrate)\u003cbr\u003e\u003cbr\u003eEffect:\u003cbr\u003e- On a failed save, the creature falls Prone and becomes Exhausted (0).\u003cbr\u003e- Creatures with water (2) levels has advantage on the saving throw.\u003cbr\u003e\u003cbr\u003eLevel2Anju\u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju \u003cbr\u003e\u003cbr\u003e- Range: 5  water (2) level\u003cbr\u003e- Water Attack Roll (1d20 + 2 + 5)\u003cbr\u003e- Projectiles: Watercharge (4) \\ 2\u003cbr\u003e- Damage: 1d6 piercing and 1d4 Ice Damage per Projectile\u003cbr\u003e\u003cbr\u003eYou create small sharp daggers of ice to hurl at targets.\u003cbr\u003e\u003cbr\u003eLevel2Anju\u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003e\u003cbr\u003e- Range: 10 m cone\u003cbr\u003e- Water Attack Roll (1d20 + 2 + 5) \u003cbr\u003e- Damage: Watercharge (4) d6 bludgeoning + Watercharge (4) d4 cold\u003cbr\u003e- Save: STR save vs your Waterbending DC (7) to resist the pull and prone\u003cbr\u003e\u003cbr\u003eEffect:\u003cbr\u003e- On a failed STR save, pull the targe ft up to Water (2) meter towards you and knocked Prone.\u003cbr\u003e\u003cbr\u003eLevel2Anju\u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA
