s it into a dense mist that spreads over a small to medium area. All creatures within the mist gain Fire Armour.  \u003cbr\u003e\u003cbr\u003eMechanics (TTRPG style):\u003cbr\u003e\u003cbr\u003e- Cost: 1-5 Water Charges (0)\u003cbr\u003e    \u003cbr\u003e- Area: 1 Water Charges (0) Meter radius \u003cbr\u003e    \u003cbr\u003e- Concentration: Water Charges (0) Turns. Every Creature in the area has 10  Water Charges (0) Fire Armor definition (0).\u003cbr\u003e    \u003cbr\u003e- Effect: Gradual healing, mental clarity, emotional soothing\u003cbr\u003e    \u003cbr\u003e- Interactions:\u003cbr\u003e    \u003cbr\u003e    - Can be moved by airbenders using wind techniques.\u003cbr\u003e        \u003cbr\u003e    - Can be dispersed or destroyed by strong firebending or extreme heat.\u003cbr\u003e        \u003cbr\u003e        \u003cbr\u003e\u003cbr\u003eAdvanced Technique (Mastery Level):\u003cbr\u003e\u003cbr\u003e- Cleansing Veil: Condenses the mist into a swirling cloak around allies, granting them resistance to poison, disease, or negative spiritual effects for a short duration.\u003cbr\u003eWaterbending (0)\u003cbr\u003eLevel 1 (0)\u003cbr\u003ePlayer Root (0)\u003cbr\u003e\u003cbr\u003eLevel1\u003cbr\u003eplayerroot\u003cbr\u003ewater\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eSlicingWater(1stLevelMove)\u003cbr\u003e\u003cbr\u003e- Cost: 2 Water Charges.\u003cbr\u003e- Type: Action (0).\u003cbr\u003e- Range: 15 ft cone.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender unleashes a slicing wave of water in a cone, dealing damage to multiple targets.\u003cbr\u003e    - Saving Throw: Targets make a Dexterity save (DC = 8 + Proficiency (0) + Int (5) mod).\u003cbr\u003e    - Damage: 1d6 slashing damage on a failed save, half on success.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Rules (0)\u003cbr\u003e- Slicing Water (0)\u003cbr\u003e- Waterbending Moves (0)\u003cbr\u003e- Proficiency (0)\u00
