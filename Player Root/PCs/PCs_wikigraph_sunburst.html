e=\"font-family:monospace;white-space:pre;\"\u003eYou restore all your Hitpoints and Bending Slots\u003cbr\u003ePlayer Root (0)\u003cbr\u003e\u003cbr\u003eXTestchar\u003c\u002fspan\u003e","DOWN if not specified otherwise.","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou have 3 \\ earth (1) Maximum Slots that are restored after about an hour of rest.\u003cbr\u003e\u003cbr\u003eYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\u003cbr\u003e- spend 2 and then 1 \u003cbr\u003e- spend 1 and then 2 or\u003cbr\u003e- spend 1 then 1 then 1 \u003cbr\u003e\u003cbr\u003eearthAnju \u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview:\u003cbr\u003e\u003cbr\u003eEarthbenders are solid and steadfast, drawing upon the Strength of their bodies and the stability of the ground beneath them. Their techniques focus on defense, fortification, and manipulating terrain. Rather than relying on agility to avoid blows, earthbenders create barriers, raise armor ratings, and reinforce their allies. They harness Earth Charges to shape stone and metal, providing a constant, reliable source of defense and stability.\u003cbr\u003e\u003cbr\u003eAnju\u003cbr\u003eearthAnju\u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju \u003cbr\u003eReactionAnju \u003cbr\u003e\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  Y(Earthbending slot (3)): Yd12 Damage per projectile\u003cbr\u003e- X(Airbendingslot (0)): X Projectiles Air Attack Roll (1d20 + 0 + 1)\u003cbr\u003e- Range: Y  X meters from the Airbender \u003cbr\u003e \u003cbr\u003e \u003cbr\u003e- One Earthbender shoots Y Sand Projectiles (rolls the Damage roll) and the Airbender controlls them to home to the X Targets)\u003cbr\u003e\u003cbr\u003eLevel1Anju\u003cbr\u003eairAnju\u003cbr\u003eearthAnju\u003cbr\u003eteamupAnju\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003eReactionAnju \u003cbr\u003e \u003cbr\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots (min 1 in each):\u003cbr\u003e-  X: X \\ 10 Barrier (0) and X \\ 20 Fire Armor (2) until the start if the Targets Turn\u003cbr\u003e-  Y: Y \\ 5 Healing at the start of the Targets turn if barrier remains unbroken\u003cbr\u003eRange: X + Y from all benders\u003cbr\u003e- If the barrier is not broken once at the start of the Targets next turn, as the ice thaws, they are healed but their Movement (0) is halved.\u003cbr\u003e\u003cbr\u003e- Encase an ally in a pillar of glacial ice with a liquid healing core.\u003cbr\u003e\u003cbr\u003eteamupAnju \u003cbr\u003eLevel2Anju \u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eIf Concentration is not broken half the Water Charges (0) are refunded.\u003cbr\u003e\u003cbr\u003ewaterAnju \u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eWater Charges represent the amount of water available for a water-bender to manipulate.\u003cbr\u003e\u003cbr\u003e- Environmental Influence:  \u003cbr\u003e   The number of Water Charges available at the start of combat or during an encounter depends on the setting. Feel free to get creative where to find water:\u003cbr\u003e  - Desert\u002fDry Area: 0 Water Charges (minimum water source).\u003cbr\u003e  - Humid Area: 5-10 Water Charges.\u003cbr\u003e  - Near Water Source (Lake, Ocean, etc.): 15 Water Charges.\u003cbr\u003e  - In Lake, Ocean, etc.: 50+ charges\u003cbr\u003e\u003cbr\u003ewaterAnju \u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003e- Range: 3m  water (2) level\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender can freeze an amount of water. The higher the water (2) Level the more water can be frozen. (for big amounts might need to roll an Intelligence (0) check) \u003cbr\u003e\u003cbr\u003eWaterbendingAnju\u003cbr\u003efreezingAnju\u003cbr\u003ewaterAnju \u003cbr\u003eLevel1Anju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003eReactionAnju \u003cbr\u003e \u003cbr\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots (min 1 in each):\u003cbr\u003e-  X: X \\ 10 Barrier (0) and X \\ 20 Fire Armor (2) until the start if the Targets Turn\u003cbr\u003e-  Y: Y \\ 5 Healing at the start of the Targets turn if barrier remains unbroken\u003cbr\u003eRange: X + Y from all benders\u003cbr\u003e- If the barrier is not broken once at the start of the Targets next turn, as the ice thaws, they are healed but their Movement (0) is halved.\u003cbr\u003e\u003cbr\u003e- Encase an ally in a pillar of glacial ice with a liquid healing core.\u003cbr\u003e\u003cbr\u003eteamupAnju \u003cbr\u003eLevel2Anju \u003cbr\u003ewaterAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionAnju\u003cbr\u003eCyclicFlowAnju\u003cbr\u003eConcentrationAnju \u003cbr\u003e\u003cbr\u003e- Cost: 1-3 Water Charges.\u003cbr\u003e- Duration: 1 round Concentration.\u003cbr\u003e- Range: Touch (through water).\u003cbr\u003e- Effect:  \u003cbr\u003e    You channel healing energy through water, restoring health to a creature. \u003cbr\u003e\t- If the creature is unconscious the creature becomes stable immediately.\u003cbr\u003e    - Healing: 2d8 per charge + Int (5) modifier at the beginning of your next Turn.\u003cbr\u003e\u003cbr\u003eLevel1Anju\u003cbr\u003ewaterAnju\u003cbr\u003ehealingAnju\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u ht or shifting light, Luma\u2019tik gains advantage on Stealth and cannot be targeted by opportunity attacks. This effect ends if Luma\u2019tik is in total darkness or complete silence.\u003cbr\u003e    \u003cbr\u003e- Mirage Flicker (2 times): As a Bonus Action (0), Luma\u2019tik can create up to two illusionary duplicates for 3 rounds. Each duplicate mimics its movements and grants attackers disadvantage on attack rolls until they hit Luma\u2019tik.\u003cbr\u003e    \u003cbr\u003e    \u003cbr\u003e- Glimmerjump: \u003cbr\u003e- #ReactionMahogany:\u003cbr\u003e\tteleport to any point within 20 m that is brightly lit or reflects light (e.g., mirrors, water, crystal surfaces)\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCombat Stats:\u003cbr\u003e\u003cbr\u003e- Evasion: 17\u003cbr\u003e    \u003cbr\u003e- HP: 18 (fragile, relies on mobility and illusions)\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eSpecial Attacks (0):\u003cbr\u003e\u003cbr\u003e- Spark...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionMahogany \u003cbr\u003eReactionMahogany \u003cbr\u003e\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  Y(Earthbending slot (0)): Yd12 Damage per projectile\u003cbr\u003e- X(Airbendingslot (3)): X Projectiles Air Attack Roll (1d20 + 1 + 0)\u003cbr\u003e- Range: Y  X meters from the Airbender \u003cbr\u003e \u003cbr\u003e \u003cbr\u003e- One Earthbender shoots Y Sand Projectiles (rolls the Damage roll) and the Airbender controlls them to home to the X Targets)\u003cbr\u003e\u003cbr\u003eLevel1Mahogany\u003cbr\u003eairMahogany\u003cbr\u003eearthMahogany\u003cbr\u003eteamupMahogany\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003espiritMahogany \u003cbr\u003eReactionMahogany \u003cbr\u003e\u003cbr\u003e- Range: self\u003cbr\u003e- Duration: spiritbending slot (2) rounds.\u003cbr\u003e\u003cbr\u003eEffect:\u003cbr\u003eProvides spiritbending slot (2)d8  General Armor (0), Evasion (11),  Barrier (0) and Fire Damage Bonus (0) for spiritbending slot (2) rounds.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003espiritMahogany\u003cbr\u003e\u003cbr\u003eLevel2Mahogany\u003cbr\u003eReactionMahogany\u003cbr\u003eMahogany\u003cbr\u003espiritMahogany\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe creature can not move or be moved by force. Depending what causes Immobilisation you can save against it as an Action (0) or can remove it with your bending more efficiently.\u003cbr\u003ePlayer Root (0)\u003cbr\u003e\u003cbr\u003eMahogany\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePrevents the target from taking actions or Move\u003cbr\u003e\u003cbr\u003econditionMahogany\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA slowed creatures Movement Speed is halved and it can not use any #BonusactionsMahogany or #reactionsMahogany (including #DangerSenseReactionMahogany). ( #Action (0) is allowed)\u003cbr\u003e\u003cbr\u003econditionMahogany\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eNot good :D\u003cbr\u003e\u003cbr\u003econditionMahogany\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou have 3 \\ earth (2) Maximum Slots that are restored after about an hour of rest.\u003cbr\u003e\u003cbr\u003eYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\u003cbr\u003e- spend 2 and then 1 \u003cbr\u003e- spend 1 and then 2 or\u003cbr\u003e- spend 1 then 1 then 1 \u003cbr\u003e\u003cbr\u003eearthPuy \u003cbr\u003eLevel1Puy\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview:\u003cbr\u003e\u003cbr\u003eEarthbenders are solid and steadfast, drawing upon the Strength of th ress level (0):\u003cbr\u003e- 1 stress level (0) after every turn\u003cbr\u003e\u003cbr\u003efireXTestchar\u003cbr\u003eLevel1XTestchar\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou have spirit (20) Maximum spiritbending slot (20)s that are restored after about an hour of rest.\u003cbr\u003e\u003cbr\u003eYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\u003cbr\u003e- spend 2 and then 1 \u003cbr\u003e- spend 1 and then 2 or\u003cbr\u003e- spend 1 then 1 then 1 \u003cbr\u003e\u003cbr\u003espiritXTestchar \u003cbr\u003eLevel1XTestchar\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionXTestchar \u003cbr\u003eReactionXTestchar \u003cbr\u003e\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  Y(Earthbending slot (60)): Yd12 Damage per projectile\u003cbr\u003e- X(Airbendingslot (60)): X Projectiles Air Attack Roll (1d20 + 20 + 2)\u003cbr\u003e- Range: Y  X meters from the Airbender \u003cbr\u003e \u003cbr\u003e \u003cbr\u003e- One Earthbender shoots Y Sand Projectiles (rolls the Damage roll) and the Airbender controlls them to home to the X Targets)\u003cbr\u003e\u003cbr\u003eLevel1XTestchar\u003cbr\u003eairXTestchar\u003cbr\u003eearthXTestchar\u003cbr\u003eteamupXTestchar\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eActionXTestchar \u003cbr\u003eReactionXTestchar \u003cbr\u003e\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  Y(Firebendingslot (60)): Yd12 Fire Damage\u003cbr\u003e- X(Airbendingslot (60)): X  10 meter Range Air Attack Roll (1d20 + 20 + 2)\u003cbr\u003e\u003cbr\u003e- One Firebender shoots a roaring flame without carefull aiming (rolls the Damage roll) and the Airbender creates an air funnel that controlls it to home to a distant target (Air Attack Roll
