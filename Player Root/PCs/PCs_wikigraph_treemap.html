il the start of your next Turn.\u003cbr\u003eIf caused by a damaging Move: Every creature that ends its turn there will get half the original attacks Damage.\u003cbr\u003ePlayer Root (0)\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePlayer Root (0)\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eMovement per Round:\u003cbr\u003e10 meters + air (20) Level  3\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou restore all your Hitpoints and Bending Slots\u003cbr\u003ePlayer Root (0)\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou have 3 \\ earth (1) Maximum Slots that are restored after about an hour of rest.\u003cbr\u003e\u003cbr\u003eYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\u003cbr\u003e- spend 2 and then 1 \u003cbr\u003e- spend 1 and then 2 or\u003cbr\u003e- spend 1 then 1 then 1 \u003cbr\u003e\u003cbr\u003eearth \u003cbr\u003eLevel1\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview:\u003cbr\u003e\u003cbr\u003eEarthbenders are solid and steadfast, drawing upon the Strength of their bodies and the stability of the ground beneath them. Their techniques focus on defense, fortification, and manipulating terrain. Rather than relying on agility to avoid blows, earthbenders create barriers, raise armor ratings, and reinforce their allies. They harness Earth Charges to shape stone and metal, providing a constant, reliable source of defense and stability.\u003cbr\u003e\u003cbr\u003eplayerroot\u003cbr\u003eearth\u003cbr\u003eLevel1\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u00 ay use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots (min 1 in each):\u003cbr\u003e-  X: X  10 Barrier (0)\u003cbr\u003e-  Y: Y  5 Healing at the start of their turn if barrier remains unbroken\u003cbr\u003e\u003cbr\u003e- If the barrier is not broken once at the start of their next turn, as the ice thaws, they are healed for 2 \u00d7 Y but their Movement (0) is halved.\u003cbr\u003e\u003cbr\u003e- Encase an ally in a pillar of glacial ice with a liquid healing core.\u003cbr\u003e\u003cbr\u003eteamup \u003cbr\u003eLevel2 \u003cbr\u003ewater\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eIf Concentration is not broken half the Water Charges (0) are refunded.\u003cbr\u003e\u003cbr\u003ewater \u003cbr\u003eLevel1\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eWater Charges represent the amount of water available for a water-bender to manipulate.\u003cbr\u003e\u003cbr\u003e- Environmental Influence:  \u003cbr\u003e   The number of Water Charges available at the start of combat or during an encounter depends on the setting. Feel free to get creative where to find water:\u003cbr\u003e  - Desert\u002fDry Area: 0 Water Charges (minimum water source).\u003cbr\u003e  - Humid Area: 5-10 Water Charges.\u003cbr\u003e  - Near Water Source (Lake, Ocean, etc.): 15 Water Charges.\u003cbr\u003e  - In Lake, Ocean, etc.: 50+ charges\u003cbr\u003e\u003cbr\u003ewater \u003cbr\u003eLevel1\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003e\u003cbr\u003e- Range: Melee (0)\u003cbr\u003e-Fire Attack Roll (1d20 + 1 + 2): Attacks firebendingslot (3) times\u003cbr\u003e- Damage: 1d6 + Player Root\u002fvariable\u002fprimarystat\u002fStrength (0) Bludgeoning and 1d4 Fire Damage\u003cbr\u003e\u003cbr\u003eLevel1\u003cbr\u003efire\u003cbr\u003emelee\u003c\u002fspan\u003e","\u003cspan style=\"font-fa islead enemies and aid allies from the shadows. Though not powerful in direct combat, it\u2019s difficult to pin down and annoying to deal with.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMovement:\u003cbr\u003e\u003cbr\u003e- Fly 15 m (hovering, effortless, emits no sound).\u003cbr\u003e    \u003cbr\u003e- Climb 10 m (can scale smooth surfaces with reflective qualities).\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAbilities in Luma\u2019tik Form:\u003cbr\u003e\u003cbr\u003e- Refraction Veil: While in bright or shifting light, Luma\u2019tik gains advantage on Stealth and cannot be targeted by opportunity attacks. This effect ends if Luma\u2019tik is in total darkness or complete silence.\u003cbr\u003e    \u003cbr\u003e- Mirage Flicker (1\u002fShort Rest (0)): As a Bonus Action (0), Luma\u2019tik can create up to two illusionary duplicates for 1 minute. Each duplicate mimics its movements and grants attackers disadvantage on attack rolls until they hit Luma\u2019tik.\u003cbr\u003e    \u003cbr\u003e    \u003cbr\u003e- Glimmerjump: \u003cbr\u003e- Reaction (0):\u003cbr\u003e\tteleport to any point within 20 m that is brightly lit or reflects light (e.g., mirrors, water, crystal surfaces)\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCombat Stats:\u003cbr\u003e\u003cbr\u003e- Evasion: 17\u003cbr\u003e    \u003cbr\u003e- HP: 21 (fragile, relies on mobility and illusions)\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eSpecial Attacks (0):\u003cbr\u003e\u003cbr\u003e- Sparkbite: Melee Weapon Attack, Spirit Attack Roll (1d20 + 2 + 0)to hit, 1d6 piercing and 1d4 radiant damage. If attacking from stealth, deals an extra 1d4 radiant damage.\u003cbr\u003e    \u003cbr\u003e- Lightshard Dart: Ranged Attack, Spirit Attack Roll (1d20 + 2 + 0) to hit, 1d6 radiant damage. On hit, target has disadvantage on Perception checks for 1 minute.\u003cbr\u003e\u003cbr\u0 cbr\u003e- Size: Small\u003cbr\u003eTABLE:\u003cbr\u003e+------------------------------+-----------+\u003cbr\u003e| Stat                         | Value     |\u003cbr\u003e+------------------------------+-----------+\u003cbr\u003e| Strength (0) (STR (5))       | 4 (-3)    |\u003cbr\u003e| Dexterity (0) (Dex (3))      | 16 (+3)   |\u003cbr\u003e| Constitution (0) (Con (3))   | 12 (+1)   |\u003cbr\u003e| Wisdom (0)(WIS (7))          | 10(+0)    |\u003cbr\u003e| Intelligence (0)(Int (4))    | 8(-1)     |\u003cbr\u003e+------------------------------+-----------+\u003cbr\u003e\u003cbr\u003e- Ideal for infiltration, distraction, and sensory manipulation. Luma\u2019tik thrives in urban or crystal-laced environments, using its shimmering form and illusions to mislead enemies and aid allies from the shadows. Though not powerful in direct combat, it\u2019s difficult to pin down and annoying to deal with.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMovement:\u003cbr\u003e\u003cbr\u003e- Fly 15 m (hovering, effortless, emits no sound).\u003cbr\u003e    \u003cbr\u003e- Climb 10 m (can scale smooth surfaces with reflective qualities).\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAbilities in Luma\u2019tik Form:\u003cbr\u003e\u003cbr\u003e- Refraction Veil: While in bright or shifting light, Luma\u2019tik gains advantage on Stealth and cannot be targeted by opportunity attacks. This effect ends if Luma\u2019tik is in total darkness or complete silence.\u003cbr\u003e    \u003cbr\u003e- Mirage Flicker (1\u002fShort Rest (0)): As a Bonus Action (0), Luma\u2019tik can create up to two illusionary duplicates for 1 minute. Each duplicate mimics its movements and grants attackers disadvantage on attack rolls until they hit Luma\u2019tik.\u003cbr\u003e    \u003cbr\u003e    \u003cbr\u003e- Glimmerjump: \u003cbr\u003e- Reaction (0):\u003cbr\u003e\tteleport to any point within 20 m that is brightly lit or reflects light (e.g., mirrors, water, crystal surfaces)\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCombat Stats:\u003cbr\u003e\u003cbr\u003e- Evasion: 17\u003cbr\u003e    \u003cbr\u003e- HP: 21 (fragile, relies on mobility and illusions)\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eSpecial Attacks (0):\u003cbr\u003e\u003cbr\u003e- Sparkbite: Melee Weapon Attack, Spirit Attack Roll (1d20 + 2 + 3)to hit, 1d6 piercing and 1d4 radiant damage. If attacking from stealth, deals an extra 1d4 radiant damage.\u003cbr\u003e    \u003cbr\u003e- Lightshard Dart: Ranged Attack, Spirit Attack Roll (1d20 + 2 + 3) to hit, 1d6 radiant damage. On hit, target has disadvantage on Perception checks for 1 minute.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLuma\u2019tik is a playful, capricious entity\u2014often found dancing between fractured crystal surfaces or taunting intruders with flickers of light and laughter. Bonding with this spirit gives a bender or spiritualist access to stealth, misdirection, and flash-based utility, ideal for scouts or cunning tacticians.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLevel2 #spirit #playerroot\u003cbr\u003e\u003cbr\u003eLevel2\u003cbr\u003eplayerroot\u003cbr\u003eshapeshiftingform\u003cbr\u003espirit\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003e\u003cbr\u003e- Range: 5 \\ Airbending Slot (60) meters.\u003cbr\u003e- Duration: Instantaneous.\u003cbr\u003e- Damage: 1d4 bludgeoning per Airbendingslot (60).\u003cbr\u003e- Air Attack Roll (1d20 + 20 + 2)\u003cbr\u003e- Use airbending to send a blade of Air hurling at a creature within range\u003cbr\u003e\u003cbr\u003eLevel1\u003cbr\u003eair\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eBonusAction\u003cbr\u003e- Range: Self.\u003cbr\u003e- Duration: 1 Turn.\u003cbr\u003e- Enhance agility by propelling yourself with gusts of a gh difficult terrain. The form allows quick evasion and small-scale reconnaissance.\u003cbr\u003e\u003cbr\u003eBending Slots:\u003cbr\u003e\tAir Lvl1: 4\u003cbr\u003e\u003cbr\u003espirit  #Level1 #playerroot\u003cbr\u003e\u003cbr\u003eLevel1\u003cbr\u003eplayerroot\u003cbr\u003eshapeshiftingform\u003cbr\u003espirit\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eshapeshiftingform\u003cbr\u003eName: Luma\u2019tik \u2014 Glimmerkin of Cracked Mirrors  \u003cbr\u003eType: Lesser Spirit  \u003cbr\u003eDomain: Light, Trickery  \u003cbr\u003eTransformation Points cost: 2 Transformation Points (0)\u003cbr\u003eElement Level (0):\u003cbr\u003e\tFirebending (0): Level 2 (0) \u003cbr\u003e\tEarthbending (0): Level 1 (0)\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e!Luma'tik.png (0)\u003cbr\u003e- Size: Small\u003cbr\u003eTABLE:\u003cbr\u003e+------------------------------+-----------+\u003cbr\u003e| Stat                         | Value     |\u003cbr\u003e+------------------------------+-----------+\u003cbr\u003e| Strength (0) (STR (1))       | 4 (-3)    |\u003cbr\u003e| Dexterity (0) (Dex (2))      | 16 (+3)   |\u003cbr\u003e| Constitution (0) (Con (3))   | 12 (+1)   |\u003cbr\u003e| Wisdom (0)(WIS (5))          | 10(+0)    |\u003cbr\u003e| Intelligence (0)(Int (4))    | 8(-1)     |\u003cbr\u003e+------------------------------+-----------+\u003cbr\u003e\u003cbr\u003e- Ideal for infiltration, distraction, and sensory manipulation. Luma\u2019tik thrives in urban or crystal-laced environments, using its shimmering form and illusions to mislead enemies and aid allies from the shadows. Though not powerful in direct combat, it\u2019s difficult to pin down and annoying to deal with.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMovement:\u003cbr\u003e\u003cbr\u003e- Fly 15 m (hovering, effortless, emits no sound).\u003cbr\u003e    \u003cbr\u003e- Climb 10 m (can scale smooth surfaces with reflective qualities).\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAbilities in Luma\u2019tik Form:\u003cbr\u003e\u003cbr\u003e- Refraction Veil: While in bright or shifting light, Luma\u2019tik gains advantage on Stealth and cannot be targeted by opportunity attacks. This effect ends if Luma\u2019tik is in total darkness or complete silence.\u003cbr\u003e    \u003cbr\u003e- Mirage Flicker (1\u002fShort Rest (0)): As a Bonus Action (0), Luma\u2019tik can create up to two illusionary duplicates for 1 minute. Each duplicate mimics its movements and grants attackers disadvantage on attack rolls until they hit Luma\u2019tik.\u003cbr\u003e    \u003cbr\u003e    \u003cbr\u003e- Glimmerjump: \u003cbr\u003e- Reaction (0):\u003cbr\u003e\tteleport to any point within 20 m that is brightly lit or reflects light (e.g., mirrors, water, crystal surfaces)\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCombat Stats:\u003cbr\u003e\u003cbr\u003e- Evasion: 17\u003cbr\u003e    \u003cbr\u003e- HP: 21 (fragile, relies on mobility and illusions)\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eSpecial Attacks (0):\u003cbr\u003e\u003cbr\u003e- Sparkbite: Melee Weapon Attack, Spirit Attack Roll (1d20 + 20 + 2)to hit, 1d6 piercing and 1d4 radiant damage. If attacking from stealth, deals an extra 1d4 radiant damage.\u003cbr\u003e    \u003cbr\u003e- Lightshard Dart: Ranged Attack, Spirit Attack Roll (1d20 + 20 + 2) to hit, 1d6 radiant damage. On hit, target has disadvantage on Perception checks for 1 minute.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLuma\u2019tik is a playful, capricious entity\u2014often found dancing between fractured crystal surfaces or taunting intruders with flickers of light and laughter. Bonding with this spirit gives a bender or spiritualist access to stealth, misdirection, and flash-based utility, ideal for scouts or cunning tacticians.\u003cbr\u003e\u003cbr\u003e---\u0
