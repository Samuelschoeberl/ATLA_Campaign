ovement:\u003cbr\u003e    \u003cbr\u003e    - Walk 20 meter.\u003cbr\u003e    - Swim 10 meter\u003cbr\u003e\u003cbr\u003e- Abilities in Bearturtle Form:\u003cbr\u003e    - Shell Shield:\u003cbr\u003e\t    - Reaction (0)\u003cbr\u003e\t        When an ally within 3 meter is attacked, impose Disadvantage on the Attack Roll (0) as you shift to protect them with your shell. Can be used 3 times per long rest.\u003cbr\u003e\t    Tuck in: \u003cbr\u003e\t    - Reaction (0)\u003cbr\u003e\t\t    When you fail a dexterity saving throw you still only take half damage. Your Movement (0) in the next round is halved.\u003cbr\u003e\u003cbr\u003e    - Sturdy Form:\u003cbr\u003e\t    - You have Advantage on saving throws against being knocked prone or moved against your will.\u003cbr\u003e    -\u003cbr\u003e    - \u003cbr\u003e- Combat Stats (Bearturtle):\u003cbr\u003e    \u003cbr\u003e    - Evasion: 15\u003cbr\u003e    - \u003cbr\u003e    - Armor: \u003cbr\u003e\t    - 5 Physical Armor (0)\u003cbr\u003e\t    - 3 General Armor (1)\u003cbr\u003e    - HP: 50.\u003cbr\u003e    - Attacks:\u003cbr\u003e        - Powerful Swipe: Melee Weapon Attack, +Strength to hit, 2d6 + Str slashing damage.\u003cbr\u003e\t- Shell Slam (AOE): All creatures within a 1 meter radius must make a Dexterity save DC17 or take 2d8 bludgeoning damage.\u003cbr\u003e\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e    \u003cbr\u003eBending Slots:\u003cbr\u003e\tEarth Lvl1: 3\u003cbr\u003e\u003cbr\u003etransformation #spirit  #Level2 #playerroot\u003cbr\u003e\u003cbr\u003eLevel2\u003cbr\u003eplayerroot\u003cbr\u003eshapeshiftingform\u003cbr\u003espirit\u003cbr\u003etransformation\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eshapeshiftingform\u003cbr\u003eName: Luma\u2019tik \u2014 Glimmerkin of Cracked Mirrors  \u003cbr\u003eType: Lesser Spirit  \u003cbr\u003eDomain: Light, Trickery  \u003cbr\u003eTransformation Points cost: 2 Transformation Points (0)\u003cbr\u003eElement Level (0):\u003cbr\u003e\tFirebending (0): Level 2 (0) \u003cbr\u003e\tEarthbending (0): Level 1 (0)\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e!Luma'tik.png (0)\u003cbr\u003e- Size: Small\u003cbr\u003eTABLE:\u003cbr\u003e+------------------------------+-----------+\u003cbr\u003e| Stat                         | Value     |\u003cbr\u003e+------------------------------+-----------+\u003cbr\u003e| Strength (0) (STR (5))       | 4 (-3)    |\u003cbr\u003e| Dexterity (0) (Dex (3))      | 16 (+3)   |\u003cbr\u003e| Constitution (0) (Con (3))   | 12 (+1)   |\u003cbr\u003e| Wisdom (0)(WIS (7))          | 10(+0)    |\u003cbr\u003e| Intelligence (0)(Int (4))    | 8(-1)     |\u003cbr\u003e+------------------------------+-----------+\u003cbr\u003e\u003cbr\u003e- Ideal for infiltration, distraction, and sensory manipulation. Luma\u2019tik thrives in urban or crystal-laced environments, using its shimmering form and illusions to mislead enemies and aid allies from the shadows. Though not powerful in direct combat, it\u2019s difficult to pin down and annoying to deal with.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMovement:\u003cbr\u003e\u003cbr\u003e- Fly 15 m (hovering, effortless, emits no sound).\u003cbr\u003e    \u003cbr\u003e- Climb 10 m (can scale smooth surfaces with reflective qualities).\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAbilities in Luma\u2019tik Form:\u003cbr\u003e\u003cbr\u003e- Refraction Veil: While in bright or shifting light, Luma\u2019tik gains advantage on Stealth and cannot be targeted by opportunity attacks. This effect ends if Luma\u2019tik is in total darkness or complete silence.\u003cbr\u003e    \u003cbr\u003e- Mirage Flicker (1\u002fShort Rest (0)): As a Bonus Action (0), Luma\u2019tik can create up to two illusionary duplicates for 1 minute. Each duplicate mimics its movements and grants attackers disadvantage on attack rolls until they hit Luma\u2019tik.\u003cbr\u003e    \u003cbr\u003e    \u003cbr\u003e- Glimmerjump: \u003cbr\u003e- Reaction (0):\u003cbr\u003e\tteleport to any point within 20 m that is brightly lit or reflects light (e.g., mirrors, water, crystal surfaces)\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCombat Stats:\u003cbr\u003e\u003cbr\u003e- Evasion: 17\u003cbr\u003e    \u003cbr\u003e- HP: 21 (fragile, relies on mobility and illusions)\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eSpecial Attacks (0):\u003cbr\u003e\u003cbr\u003e- Sparkbite: Melee Weapon Attack, Spirit Attack Roll (1d20 + 2 + 3)to hit, 1d6 piercing and 1d4 radiant damage. If attacking from stealth, deals an extra 1d4 radiant damage.\u003cbr\u003e    \u003cbr\u003e- Lightshard Dart: Ranged Attack, Spirit Attack Roll (1d20 + 2 + 3) to hit, 1d6 radiant damage. On hit, target has disadvantage on Perception checks for 1 minute.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLuma\u2019tik is a playful, capricious entity\u2014often found dancing between fractured crystal surfaces or taunting intruders with flickers of light and laughter. Bonding with this spirit gives a bender or spiritualist access to stealth, misdirection, and flash-based utility, ideal for scouts or cunning tacticians.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLevel2 #spirit #playerroot\u003cbr\u003e\u003cbr\u003eLevel2\u003cbr\u003eplayerroot\u003cbr\u003eshapeshiftingform\u003cbr\u003espirit\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eLevel2\u003cbr\u003espirit \u003cbr\u003eReaction \u003cbr\u003e\u003cbr\u003e- Range: self\u003cbr\u003e- Duration: spiritbending slot (2) rounds.\u003cbr\u003e\u003cbr\u003eEffect:\u003cbr\u003eProvides 4  spiritbending slot (2) General Armor (1), Evasion (13),  Barrier (0) and Damage Dice Bonus (0) until the start of your next turn. \u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003espirit
