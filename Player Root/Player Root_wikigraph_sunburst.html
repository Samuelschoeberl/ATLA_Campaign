s, emphasizing their role as impartial protectors.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Mistress Akira Meiyu\u003cbr\u003e- Armor definition\u003cbr\u003e- Player Root\u002fvariable\u002fprimarystat\u002fStrength\u003cbr\u003e- Stonewarden Garon\u003cbr\u003e- Player Root\u002fvariable\u002fprimarystat\u002fWisdom\u003cbr\u003e- Grandmaster Iroh Tanaka\u003cbr\u003e- The Lotus\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eFirebending\u003cbr\u003eWaterbending\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eStat Overview\u003cbr\u003e\u003cbr\u003eGlobal environmental variables\u003cbr\u003eTABLE:\u003cbr\u003e+----------------------------+---------+--------------------------------------------------------------+------------------------------------------------------------------+\u003cbr\u003e| Name                       | Value   | Tags                                                         | File                                                             |\u003cbr\u003e+----------------------------+---------+--------------------------------------------------------------+------------------------------------------------------------------+\u003cbr\u003e| environmentalwatercharge   | 11      | #variable #secondarystat #template #environmentalvariables   | Player Root\u002fvariable\u002fenvironmental\u002fenvironmentalwatercharge.md   |\u003cbr\u003e+----------------------------+---------+--------------------------------------------------------------+------------------------------------------------------------------+\u003cbr\u003e\u003cbr\u003ePer-PC extracted stats\u003cbr\u003e\u003cbr\u003eAnju\u003cbr\u003eTABLE:\u003cbr\u003e+-----------------+---------+------------------------------------------------+\u003cbr\u003e| Key             | Value   | Source File                                    |\u003cbr\u003e+---------------- ude giving them more roleplaying opportunities to find bending teachers or similar to acquire new skills and bending Moves.\u003cbr\u003e\u003cbr\u003e\u00a73 I'm trying some more experimental mechanics that may be fun for me but not so fun for others. So always accept constructive feedback and \u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDefensive:\u003cbr\u003e\tMostly like DnD but Armor class is now called evasion and there is an Armor  for every kind of Damage (Damage Resistance) that reduces the damage taken per instance.\u003cbr\u003e\tThe Damage types will be the same as in Dnd\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Armor definition\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eHow hard it is to hit you\u003cbr\u003eBase Evasion: 10 + Dex + Airbending Level\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThese are attacks you only have under specific limited conditions or have to study from a master to learn.\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","Space to write down your puzzles and story connections","","THIS ISTHETESTFILE FOR THE GRAPH GENERATION","inventory","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eEnvironmental\u003cbr\u003ename: testtrigger\u003cbr\u003evalue: 123\u003c\u002fspan\u003e","does saving still work?","","","","","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCore Stats\u003cbr\u003eTABLE:\u003cbr\u003e+----------------+---------+--------+-------------------------+\u003cbr\u003e| Stat           | Value   | note   | Automatically updated   |\u003cbr\u003e+----------------+---------+--------+-------------------------+\u003c r\u003e- Spirit Benders \u003cbr\u003e- Mushroom Leather Techniques \u003cbr\u003eNPC\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eRin Kotak.png\u003cbr\u003ehe\u002fhim\u003cbr\u003ePhysical Description:  \u003cbr\u003e        A tall, gaunt man with alabaster skin and wispy, shoulder-length white hair that seems to shift like mist in the wind. His gray eyes are perpetually half-lidded, giving him a detached, eerie demeanor. His flowing black robes ripple unnaturally, as if caught in a constant breeze. His soft-spoken voice carries an unsettling intensity.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Airbending with a dark twist\u2014manipulating sound waves to confuse and disorient enemies and bending the air around him to make him almost invisible.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAirbending\u003cbr\u003e\u003cbr\u003e\u201cThey call it balance. They say the Avatar brings peace. But I ask you\u2014what peace is built upon the whims of a single soul? One person, plucked from the cycle, anointed by spirits, wielding the fury of all four elements like a god among mortals. We kneel to them. We trust them. We fear them. We wait for them to fix what we cannot. But what happens when the Avatar fails? When they vanish? When they turn tyrant? No one should bear such power. And no one should have to live under it. Balance cannot come from a single hand\u2014it must rise from all of us, together. End the cycle. Let the world breathe free for once, without its so-called savior.\u201d\u003cbr\u003e\u003cbr\u003eInit:\u003cbr\u003ephot 21 \u003cbr\u003eRin Xolai 20 \u003cbr\u003eTapi 19\u003cbr\u003ePui 15\u003cbr\u003eIroh Tanaka 15\u003cbr\u003e\u003cbr\u003eRiu 14\u003cbr\u003eIsay Treksal 12\u003cbr\u003eStie 12\u003cbr\u003eAnju 12\u003cbr\u003eJin koga\u003cbr\u003eAkira Meiyu\u003cbr\u003e\u003cbr\u003eDAMAGE\u003cbr\u003e9\u003cbr\u003e\u003cbr\u003eNPC\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- Physical Description:  \u003cbr\u003e    A striking woman in her early forties with jet-black hair styled into an intricate braid that cascades down her back. Her pale blue eyes seem to pierce through her opponents, reflecting a sharp intellect and unshakable resolve. Her high cheekbones and angular features give her an almost regal appearance. She wears an ornate, high-collared cloak adorned with faintly glowing charms.\u003cbr\u003e- Bending Style:  \u003cbr\u003e    Waterbending focused on offensive techniques, including the manipulation of black mist\u2014a mixture of water vapor and fine particles, creating disorienting smoke.\u003cbr\u003e- Role:  \u003cbr\u003e    Charismatic leader and visionary behind the rebellion. Isay is a master tactician and inspiring orator.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003eNPC\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOrganisations\u003cbr\u003eOverview:\u003cbr\u003e\u003cbr\u003eThe Night Bloom is a radical faction seeking to overthrow the Avatar\u2019s influence, advocating for a world ruled collectively by elite benders. They view the Avatar as a relic of oppression and seek to reshape the spiritual and physical realms.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLeadership:\u003cbr\u003e\u003cbr\u003e1. Isay Trekal (she\u002fher) (Faction Leader)\u003cbr\u003e    \u003cbr\u003e    - Physical Description:  \u003cbr\u003e        A striking woman in her early forties with jet-black hair s s\u003cbr\u003eTemporary Hitpoints\u003cbr\u003e\u003cbr\u003evariable\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAuotoexplanatory.\u003cbr\u003ePlayer Root\u003cbr\u003evariable\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou max Hitpoints are determined by your Level and Bending Type:\u003cbr\u003eEarth: 1d12 per CL + Con\u003cbr\u003eWater: 1d8 per CL + Con\u003cbr\u003eFire: 1d8 per CL +Con\u003cbr\u003eAir: 1d6 per CL + Con\u003cbr\u003eSpirit: 1d4 per CL + Con\u003cbr\u003ePlayer Root\u003cbr\u003evariable\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePlayer Root\u003cbr\u003evariable\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePlayer Root\u003cbr\u003evariable\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eTemporary Hitpoints are always used first and usually don't Stack but Situational exceptions.\u003cbr\u003ePlayer Root\u003cbr\u003evariable\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePlayer Root\u003cbr\u003evariable\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","If not Specified otherwise, Ammunition can be used by any character (if its logic :D)  as part of their Moves to enhance them creatively.","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eGrants Damage reduction. \u003cbr\u003eBase armor:\u003cbr\u003e\u003cbr\u003eGeneral Armor Definition reduces all Damage Types in addition to their specific type Armor (other than spiritual). \u003cbr\u003e\u003cbr\u003ePhysical Armor reduces all Piercing Slashing and bludgeoning Damage.\u003cbr\u003e\u003cbr\u003eBarrier definintion Whenever you suffer unblocked damage Barrier Armor halves\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eWhenever you suffer unblocked damage Barrier halves (rounded down)\u003cbr\u003e\u003cbr\u003eFor example when you have 15 Barrier and suffer 18 damage you suffer 3 Damage and Barrier  halves to 7.\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAirbending Slot Progression\u003cbr\u003eFirebending Slot Progression\u003cbr\u003eearthbending slot\u003cbr\u003eSpiritbending Slot Progression\u003cbr\u003eWater Charges\u003cbr\u003eWaterbottle Charge\u003cbr\u003eenvironmentalwatercharge\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eWhen a creature is standing within 1 meter of another creature it can get affected by some effects\u003cbr\u003e\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCon save DC of max(10, Damage Taken \u002f 2)\u003cbr\u003eSome Moves require concentration to keep them up. If you take damage while concentrationg you have to make a Con save with a DC of max(10, Damage Taken \u002f 2)\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eReduces All Damage Types other than Spirit Damage.\u003cbr\u003ebase general armor:\u003cbr\u003eearth level\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eIf not Specified otherwise, lingering effect last until the start of your next Turn.\u003cbr\u003eIf caused by a damaging Move: Every creature that ends its turn there will get half the original attacks Damage.\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eMovement per Round:\u003cbr\u003e10 meters + air Level  3\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou restore all your Hitpoints and Bending Slots\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSession 5 Transcript\u003cbr\u003e\u003cbr\u003eSpirit Snake Scale:\u003cbr\u003e\u003cbr\u003eParty found a spirit snake scale on the ground.\u003cbr\u003e\u003cbr\u003eIt can be used as a reaction to flash and impose disadvantage.\u003cbr\u003e\u003cbr\u003eMilking Antics:\u003cbr\u003e\u003cbr\u003eThe group tried to milk desert oxen to mix with cactus juice for cocktails.\u003cbr\u003e\u003cbr\u003eMultiple failed Nature checks led to confusion over whether the ox was male or female (\u201cAm I holding a penis?!\u201d).\u003cbr\u003e\u003cbr\u003eThey eventually gave up on proper milking but still mixed cactus juice with mystery milk for later.\u003cbr\u003e\u003cbr\u003eJourney to Tapi\u2019s Village:\u003cbr\u003e\u003cbr\u003eParty headed toward Tapi\u2019s home village near an oasis.\u003cbr\u003e\u003cbr\u003eTraversed a rocky descent, using Earthbending to create steps and platforms (some attempts failed hilariously).\u003cbr\u003e\u003cbr\u003eCaravan &amp; Hyena Falcon Encounter:\u003cbr\u003e\u003cbr\u003eThey spotted a merchant caravan (camels carrying barrels of cactus juice).\u003cbr\u003e\u003cbr\u003eThe caravan seemed fleeing something but let the group catch up.\u003cbr\u003e\u003cbr\u003eHyena falcons attacked.\u003cbr\u003e\u003cbr\u003eThe party used creative bending \u2014 including launching a flaming barrel \u2014 to drive the falcons off.\u003cbr\u003e\u003cbr\u003eArrival at Tapi\u2019s Village:\u003cbr\u003e\u003cbr\u003eThey arrived at Tapi\u2019s tourist-friendly oasis village, known for its premium cactus juice.\u003cbr\u003e\u003cbr\u003eTapi\u2019s house: described as bohemian and cluttered, filled with shiny decorations, bottles, and jars.\u003cbr\u003e\u003cbr\u003eThey met Tapi\u2019s mom (a warm, hippie-like woman). She mentioned that Tapi\u2019s dad was out on the cactus farm.\u003cbr\u003e\u003cbr\u003eThe Oasis &amp; Temple:\u003cbr\u003e\u003cbr\u003eThe group visited the oasis temple, which had:\u003cbr\u003e\u003cbr\u003eDrawings and statues of a fish spirit \u2014 but none of them looked the same.\u003cbr\u003e\u003cbr\u003ePriestess Ban Ban, who explained:\u003cbr\u003e\u003cbr\u003eThe fish spirit disappeared a few days ago.\u003cbr\u003e\u003cbr\u003eIt used to communicate with her via bubbles.\u003cbr\u003e\u003cbr\u003eShe has drunk the holy water herself.\u003cbr\u003e\u003cbr\u003eMahogany dove into the pool, searching for signs of the spirit.\u003cbr\u003e\u003cbr\u003eShe felt faint traces of spiritual energy, but nothing alive.\u003cbr\u003e\u003cbr\u003eInstead, she found poop, which sh...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSession transkript:\u003cbr\u003eAvatar TTRPG \u2014 Session 6\u003cbr\u003eWhere we left off\u003cbr\u003e\u003cbr\u003eParty is in Misty Palms Oasis investigating the exploded distillery and a newly exposed basement chamber full of ancient fish-pictograph scrolls about D\u012bnu, the oasis\u2019s invisible goldfish spirit (appears only when you aren\u2019t looking).\u003cbr\u003e\u003cbr\u003eA dropped potion formed a watery portal. A hand reached through; the party pulled back Ash, who\u2019d been on a long spirit-world journey (felt like 45 years to Ash).\u003cbr\u003e\u003cbr\u003eKey events\u003cbr\u003e\u003cbr\u003eHidden archive: Scrolls describe D\u012bnu phasing between Spirit and Material Worlds; only D\u012bnu\u2019s poop manifests materially. Verses hint you must bring all four elements into harmony to contact D\u012bnu.\u003cbr\u003e\u003cbr\u003eFire-pets &amp; zodiac quest: The muscular young firebender continues bonding with animals (fire cat, Woofie the fire dog, Cuckoo the fire rooster) and wants connections to all 12 zodiac animals (today\u2019s attempt at a fire rat ended\u2026 poorly).\u003cbr\u003e\u003cbr\u003eCat chaos: The fire cat singed some scrolls before being dismissed.\u003cbr\u003e\u003cbr\u003eStabilizing the chamber: A richly dressed, highly skilled earthbender arrives\u2014revealed as the King of Omashu. Using a resonant glass pomegranate technique, he and the party stabilize the collapsing room (massive group healing\u002fsoothing resonance).\u003cbr\u003e\u003cbr\u003eOmashu hook: The king, an acquaintance of Vin Kotak (the tense airbender from earlier sessions), invites the party to Omashu to learn more about resonance stones and how the party uniquely uses them.\u003cbr\u003e\u003cbr\u003eSpirit contact via poop ritual: The group combined five poop pellets with the four elements (watered, frozen, sand-encapsulated, burned, air-swirled).\u003cbr\u003e\u003cbr\u003eResult: a thick, spiritually potent smoke.\u003cbr\u003e\u003cbr\u003eAsh, using a spirit-sight technique (\u201cSi U Li\u201d), saw and heard D\u012bnu emerge and briefly speak; others only heard a faint \u201cblub.\u201d D\u012bnu then faded; the smoke dissipated and the pellets were consumed.\u003cbr\u003e\u003cbr\u003eWrap-up: Bath at the oasis; plans made to...","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e11\u003cbr\u003e\u003cbr\u003evariable #secondarystat #template #environmentalvariables\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCharisma\u003cbr\u003e\u003cbr\u003eprimarystat #variable #characterstat\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eConstitution\u003cbr\u003e\u003cbr\u003eprima other than Spirit Damage.\u003cbr\u003ebase general armor:\u003cbr\u003eearth (20) level\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eIf not Specified otherwise, lingering effect last until the start of your next Turn.\u003cbr\u003eIf caused by a damaging Move: Every creature that ends its turn there will get half the original attacks Damage.\u003cbr\u003ePlayer Root (0)\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePlayer Root (0)\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eMovement per Round:\u003cbr\u003e10 meters + air (20) Level  3\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou restore all your Hitpoints and Bending Slots\u003cbr\u003ePlayer Root (0)\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou have 3 \\ air Maximum Slots that are restored after about an hour of rest.\u003cbr\u003e\u003cbr\u003eYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\u003cbr\u003e- spend 2 and then 1 \u003cbr\u003e- spend 1 and then 2 or\u003cbr\u003e- spend 1 then 1 then 1 \u003cbr\u003e\u003cbr\u003eair \u003cbr\u003eLevel1\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou have the air level amount of Danger Sense Reaction PER ROUND\u003cbr\u003e\u003cbr\u003eair \u003cbr\u003eLevel1 \u003cbr\u003eDangerSenseReaction\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eMovement \u003cbr\u003e\u003cbr\u003eAdditionally Many Airbending techniques can boost movement\u003cbr\u003e\u003cbr\u003eplayerroot\u003cbr\u003eair\u003cbr\u003eLevel1\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou have 3 \\ earth Maximum Slots that are restored after about an hour of rest.\u003cbr\u003e\u003cbr\u003eYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\u003cbr\u003e- spend 2 and then 1 \u003cbr\u003e- spend 1 and then 2 or\u003cbr\u003e- spend 1 then 1 then 1 \u003cbr\u003e\u003cbr\u003eearth \u003cbr\u003eLevel1\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview:\u003cbr\u003e\u003cbr\u003eEarthbenders are solid and steadfast, drawing upon the Strength of their bodies and the stability of the ground beneath them. Their techniques focus on defense, fortification, and manipulating terrain. Rather than relying on agility to avoid blows, earthbenders create barriers, raise armor ratings, and reinforce their allies. They harness Earth Charges to shape stone and metal, providing a constant, reliable source of defense and stability.\u003cbr\u003e\u003cbr\u003eplayerroot\u003cbr\u003eearth\u003cbr\u003eLevel1\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eCollectionfile\u003cbr\u003eFirebending\u003cbr\u003e\u003cbr\u003eCollectionfile\u003cbr\u003efire\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou have 3 \\ fire Maximum Slots that are restored after about an hour of rest.\u003cbr\u003e\u003cbr\u003eYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\u003cbr\u003e- spend 2 and then 1 \u003cbr\u003e- spend 1 and then 2 or\u003cbr\u003e- spend 1 then 1 then 1 \u003cbr\u003e\u003cbr\u003efire \u003cbr\u003eLevel1\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eFor each Level:\u003cbr\u003e-1 Fire Attack Roll\u003cbr\u003e-1 Firebending DC\u003cbr\u003e+2 fire Damage\u003cbr\u003e\u003cbr\u003eFirebenders draw power from passion, heat, and intensity. Stress is both a resource and a danger: it fuels more powerful techniques, but too much leaves a bender unstable and at risk of losing control. The following rules convert narrative stress into a simple mechanical resource for firebending moves.\u003cbr\u003e\u003cbr\u003eWhen do you gain stress level:\u003cbr\u003e- Everytime you take Dmage you gain 1 stress level\u003cbr\u003e- For every Firebending Slot Progression used in a Damaging Move you gain 1 stress level AFTER using the Move\u003cbr\u003eWhen you loose stress level:\u003cbr\u003e- 1 stress level after every turn\u003cbr\u003e\u003cbr\u003efire\u003cbr\u003eLevel1\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003erevisionneeded\u003cbr\u003e\ud83c\udf0c Bridge of the Spirit: A Personal Journey\u003cbr\u003e\u003cbr\u003e&gt; \"To be the Avatar is not merely to bend all elements, but to bend one\u2019s self\u2014to align will and wisdom with the needs of the world.\"  \u003cbr\u003e&gt; \u2014 Grandmaster Shuyin of the White Lotus\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udded Reflecting on Your Journey\u003cbr\u003e\u003cbr\u003eEach character stands at a crossroads between spirit and self, and your progression in this campaign is deeply rooted in how your character emotionally and spiritually reacts to the events that unfold. Reflect on:\u003cbr\u003e\u003cbr\u003e- Have recent events hardened them? Are they acting with more recklessness, cruelty, or obsession to achieve their goals\u2014driven by trauma or ambition?\u003cbr\u003e    \u003cbr\u003e- Or have they found inner balance, perhaps discovering a renewed sense of duty or compassion, and beginning to understand the role of a bridge between the mortal and spiritual worlds?\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eThis reflection influences your na and will guide what type of power you unlock next.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd25 Paths of Power\u003cbr\u003e\u003cbr\u003eWhen your character increases their Bridge Level, they may choose one of the following paths, shaped by how they have grown:\u003cbr\u003e\u003cbr\u003eChaotic Awakening\u003cbr\u003e\u003cbr\u003eFor those who pursue strength, vengeance, or control without regard for balance. Unlock a new bending slot in an element already known (but not your origin element).  \u003cbr\u003eExample: A waterbender who has learned firebending may now gain a second firebending move.\u003cbr\u003e\u003cbr\u003eHarmonic Enlightenment\u003cbr\u003e\u003cbr\u003eFor those who embrace their role as a bridge between worlds. Unlock a new bending element, representing spiritual expansion and Avatar-like growth.  \u003cbr\u003eExample: An earthbender may now begin learning airbending.  \u003cbr\u003eAdditionally, you may gain access to rare spiritual techniques (GM approval), such as Spirit-Bending, Healing Flames, Echobending, etc., reflecting your evolving balance and connection to the Avatar Spirit.\u003cbr\u003e\u003cbr\u003e&gt; Choose based on your character's em...","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAvatar Spirit Check\u003cbr\u003e\u003cbr\u003eRoll a d20 as part of a spirit-focused ritual or when prompted by the GM (typically at key story beats or after using a Spirit Stone).\u003cbr\u003e\u003cbr\u003e- If the roll is even: you gain a number of temporary Spiritbending spellslots equal to the d20 result. These slots last until the end of the current scene or until spent, whichever comes first.\u003cbr\u003e- If the roll is odd: you do not gain slots, but you receive one Spirit Echo \u2014 a small, narratively useful boon (example: advantage on one Spiritbending check, a single short vision providing a clue, or temporary insight on a spirit's motive). The GM chooses the precise echo based on context.\u003cbr\u003e\u003cbr\u003eRules &amp; limits (assumptions \u2014 adjust with GM):\u003cbr\u003e\u003cbr\u003e- Maximum gained slots cannot exceed the character's Bridge Level (or another GM-set cap).\u003cbr\u003e- This check is usually available once per long rest unless a Spirit Stone or special ritual grants repeated checks.\u003cbr\u003e- Spirit slots gained are of the lowest available Spiritbending tier and must be used for Spiritbending moves or effects.\u003cbr\u003e\u003cbr\u003eExample:\u003cbr\u003e\u003cbr\u003e- You roll a d20 and get 14 (even). You gain 14 temporary Spiritbending spellslots (subject to the GM cap). You spend 2 of them to cast a Spirit Ward and keep the rest until the end of the scene.\u003cbr\u003e\u003cbr\u003eAvatar Spirit Bridge Level\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003cbr\u003espirit\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou have spirit Maximum spiritbending slots that are restored after about an hour of rest.\u003cbr\u003e\u003cbr\u003eYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\u003cbr\u003e- spend 2 and then 1 \u003cbr\u003e- spend 1 and then 2 or\u003cbr\u003e- spend 1 then 1 then 1 \u003cbr\u003e\u003cbr\u003espirit \u003cbr\u003eLevel1\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction \u003cbr\u003eReaction \u003cbr\u003e\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  Y(Earth): Yd12 Damage per projectile\u003cbr\u003e- X(Air): X Projectiles Air Attack Roll\u003cbr\u003e- Range: Y  X meters from the Airbender \u003cbr\u003e \u003cbr\u003e \u003cbr\u003e- One Earthbender shoots Y Sand Projectiles (rolls the Damage roll) and the Airbender controlls them to home to the X Targets)\u003cbr\u003e\u003cbr\u003eLevel1\u003cbr\u003eair\u003cbr\u003eearth\u003cbr\u003eteamup\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction \u003cbr\u003eReaction \u003cbr\u003e\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  Y(Fire): Yd12 Fire Damage\u003cbr\u003e- X(Air): X  10 meter Range Air Attack Roll\u003cbr\u003e\u003cbr\u003e- One Firebender shoots a roaring flame without carefull aiming (rolls the Damage roll) and the Airbender creates an air funnel that controlls it to home to a distant target (Air Attack Roll)\u003cbr\u003e\u003cbr\u003eteamup\u003cbr\u003eLevel3 \u003cbr\u003eair \u003cbr\u003efire\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction \u003cbr\u003eReaction \u003cbr\u003e\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  Y(Water): Yd6 Barrier \u003cbr\u003e- X(Air): X\u002f2 (rounded down) Targets\u003cbr\u003e- Duration: 2 Rounds\u003cbr\u003e\u003cbr\u003eAirbending vaporizes water into a puffy cloud that creates a temporary Barrier. \u003cbr\u003e\u003cbr\u003eteamup\u003cbr\u003eLevel4\u003cbr\u003eair \u003cbr\u003ewater\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eReaction \u003cbr\u003e\u003cbr\u003eReaction: Must be initiated by a Waterbender in line of sight \u003cbr\u003e\u003cbr\u003eLingering Effect\u003cbr\u003e\u003cbr\u003eStick and grow trapping enemies and reshaping the terrain.\u003cbr\u003e- Range: 2X meter radius Sphere\u003cbr\u003e\u003cbr\u003e- Effects: \u003cbr\u003e\t- Targets in area must make  a DCX  2 Dex save to jump aside or get Immobilised in cold soft and barely liquid Glass.\u003cbr\u003e\t- If X \u2265 8, brambles regenerate once if destroyed\u003cbr\u003e\u003cbr\u003eLevel1 \u003cbr\u003eearth\u003cbr\u003ewater \u003cbr\u003eteamup\u003cbr\u003esignaturemove\u003cbr\u003ePuy\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eReaction \u003cbr\u003e\u003cbr\u003eReaction: Must be initiated by a Firebender in line of sight \u003cbr\u003e\u003cbr\u003elingeringeffect \u003cbr\u003e\u003cbr\u003eFocused light is amplified by mirrored shards into a blinding beam.\u003cbr\u003e- Effect: \u003cbr\u003e- Range: 10X meter radius Sphere\u003cbr\u003e- Effect: \u003cbr\u003e\t- Targets in area must make  a DC X  2 Int save to shield or close their eyes or be Blinded for one turn\u003cbr\u003e\t-  If X \u2265 10, Deal Xd4 radiant damage to all creatures in the area\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eteamup\u003cbr\u003efire \u003cbr\u003eearth\u003cbr\u003eLevel1 \u003cbr\u003esignaturemove\u003cbr\u003ePuy\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eGlassfruitTeam-UpTechniques\u003cbr\u003e\u003cbr\u003eX = yz\u003cbr\u003e\u003cbr\u003e-  are the number of bending slots contributed by each bender.\u003cbr\u003e    \u003cbr\u003e- This rewards balanced team effort over just one person dumping points.\u003cbr\u003e    \u003cbr\u003e-X = y \u00d7 z.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e&gt; Example:\u003cbr\u003e&gt; \u003cbr\u003e&gt; - Earthbender contributes 2 slots (y = 2)\u003cbr\u003e&gt;     \u003cbr\u003e&gt; - Firebender contributes 3 (z = 3)\u003cbr\u003e&gt;     \u2192 X = 2 \u00d7 3 = 6\u003cbr\u003e\u003cbr\u003eThese are powerful, multi-element, terrain-altering moves that consume Glassfruit Seeds. Each scales based on X and has different effects depending on the seed used.\u003cbr\u003e\u003cbr\u003eEarth \u003cbr\u003eAir\u003cbr\u003eWater\u003cbr\u003eFire\u003cbr\u003eteamup \u003cbr\u003eearth\u003cbr\u003eplayerroot\u003cbr\u003esignaturemove\u003cbr\u003ePuy\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eReaction \u003cbr\u003e\u003cbr\u003eReaction: Must be initiated by a Firebender in line of sight \u003cbr\u003e\u003cbr\u003eLingering Effect\u003cbr\u003e\u003cbr\u003e- Range: 2X meter radius Sphere\u003cbr\u003e\u003cbr\u003e- Effect: Explosion in an area, dealing Xd6  bludgeoning + half fire damage\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eLevel1 \u003cbr\u003eearth\u003cbr\u003efire \u003cbr\u003eplayerroot\u003cbr\u003eteamup\u003cbr\u003esignaturemove\u003cbr\u003ePuy\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eReaction \u003cbr\u003e\u003cbr\u003eReaction: Must be initiated by a Airbender in line of sight \u003cbr\u003e\u003cbr\u003elingeringeffect \u003cbr\u003e\u003cbr\u003eA soundblast builds from multiple frequencies and shatters the ground.\u003cbr\u003e- Range: 2X meter radius Sphere\u003cbr\u003e\u003cbr\u003e- Effects:\u003cbr\u003e\t- Targets in area must make CON save of X2 or take Xd8 thunder damage and fall prone\u003cbr\u003e\t- Earth terrain in the zone becomes difficult terrain\u003cbr\u003e\u003cbr\u003eLevel1 \u003cbr\u003eearth\u003cbr\u003eair \u003cbr\u003eplayerroot\u003cbr\u003eteamup\u003cbr\u003esignaturemove\u003cbr\u003ePuy\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eReaction \u003cbr\u003e\u003cbr\u003eReaction: Must be initiated by a Earthbender in line of sight \u003cbr\u003e\u003cbr\u003e- Range: within line of sight up to 100 meter\u003cbr\u003e- Duration: Lasts until stopped concentrating or for 1 hour.\u003cbr\u003e\u003cbr\u003e- Effect: \u003cbr\u003e\t- As the air vibrates with a cleansing energy as creatures of your choice within radius gain 10  X Barrier (if this barrier is halfed for one creature its halfed for all)\u003cbr\u003e\t- If X \u2265 15, the seal also protects against being Immobilised  \u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eLevel1 \u003cbr\u003eearth\u003cbr\u003eteamup\u003cbr\u003esignaturemove\u003cbr\u003ePuy\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eHigh on the outer cliffs of Omashu and the surrounding valley grow the rare Glassfruit Trees\u2014bizarre plants that draw heavy mineral content from the stone and soil, producing glass-like fruit with dense crystalline seeds. These seeds:\u003cbr\u003e\u003cbr\u003e- Grow in five known varieties, each with distinct elemental-reactive properties.\u003cbr\u003e    \u003cbr\u003e- Can be manipulated by Earthbenders with precise control, refined through spiritual discipline.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eLocal legend says the Earth Lion Turtle left these trees here, believing their presence would help the people grow with stone, not just build from it.\u003cbr\u003e\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eearth\u003cbr\u003eplayerroot\u003cbr\u003esignaturemove\u003cbr\u003ePuy\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eReaction \u003cbr\u003e\u003cbr\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  X: X number of projectiles \u003cbr\u003e-  Y: Yd6 Damage per projectile\u003cbr\u003e \u003cbr\u003e- One waterbender shoots X Water Projectiles (rolls the attack role) and the other one Freezes them  rolls the damage rolls)\u003cbr\u003e\u003cbr\u003eteamup \u003cbr\u003eLevel3 \u003cbr\u003ewater\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eReaction \u003cbr\u003e \u003cbr\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots (min 1 in each):\u003cbr\u003e-  X: X  10 Barrier\u003cbr\u003e-  Y: Y  5 Healing at the start of their turn if barrier remains unbroken\u003cbr\u003e\u003cbr\u003e- If the barrier is not broken once at the start of their next turn, as the ice thaws, they are healed for 2 \u00d7 Y but their Movement is halved.\u003cbr\u003e\u003cbr\u003e- Encase an ally in a pillar of glacial ice with a liquid healing core.\u003cbr\u003e\u003cbr\u003eteamup \u003cbr\u003eLevel2 \u003cbr\u003ewater\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eIf Concentration is not broken half the Water Charges are refunded.\u003cbr\u003e\u003cbr\u003ewater \u003cbr\u003eLevel1\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eWater Charges represent the amount of water available for a water-bender to manipulate.\u003cbr\u003e\u003cbr\u003e- Environmental Influence:  \u003cbr\u003e   The number of Water Charges available at the start of combat or during an encounter depends on the setting. Feel free to get creative where to find water:\u003cbr\u003e  - Desert\u002fDry Area: 0 Water Charges (minimum water source).\u003cbr\u003e  - Humid Area: 5-10 Water Charges.\u003cbr\u003e  - Near Water Source (Lake, Ocean, etc.): 15 Water Charges.\u003cbr\u003e  - In Lake, Ocean, etc.: 50+ charges\u003cbr\u003e\u003cbr\u003ewater \u003cbr\u003eLevel1\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDefensive Techniques\u003cbr\u003e\u003cbr\u003eChi Blockers excel at evading and mitigating damage through agility and strategic positioning.\u003cbr\u003e\u003cbr\u003eTechniques\u003cbr\u003e- Enhanced Reflexes: Gain temporary bonuses to evasion.\u003cbr\u003e- Counterattack: Strike back immediately after dodging.\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eEnergy Points\u003cbr\u003e\u003cbr\u003eChi Blockers use Energy Points (EP) to perform their moves. EP are a finite resource that replenishes during rests or by using specific techniques. \u003cbr\u003e\u003cbr\u003eManaging EP\u003cbr\u003e- Base EP: 2CL\u003cbr\u003e- Replenish: Gain 2 EP at the End of your turn if not using any EP this Turn.\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eChi Blocking Moves\u003cbr\u003e\u003cbr\u003eChi Blockers have a range of moves categorized by levels, growing more potent as they develop their skills.\u003cbr\u003e\u003cbr\u003eMove Levels\u003cbr\u003e- Level 1: Basic disruption techniques.\u003cbr\u003e- Level 2: Advanced strikes with added effects.\u003cbr\u003e- Level 3: High-impact moves that exhaust opponents.\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eYou have 3 \\ earth (1) Maximum Slots that are restored after about an hour of rest.\u003cbr\u003e\u003cbr\u003eYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\u003cbr\u003e- spend 2 and then 1 \u003cbr\u003e- spend 1 and then 2 or\u003cbr\u003e- spend 1 then 1 then 1 \u003cbr\u003e\u003cbr\u003eearth \u003cbr\u003eLevel1\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview:\u003cbr\u003e\u003cbr\u003eEarthbenders are solid and steadfast, drawing upon the Strength of their bodies and the stability of the ground beneath them. Their techniques focus on defense, fortification, and manipulating terrain. Rather than relying on agility to avoid blows, earthbenders create barriers, raise armor ratings, and reinforce their allies. They harness Earth Charges to shape stone and metal, providing a constant, reliable source of defense and stability.\u003cbr\u003e\u003cbr\u003eplayerroot\u003cbr\u003eearth\u003cbr\u003eLevel1\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction \u003cbr\u003eReaction \u003cbr\u003e\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  Y(Earth): Yd12 Damage per projectile\ 0+ charges\u003cbr\u003e\u003cbr\u003ewater \u003cbr\u003eLevel1\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003e- Range: 3m  water (2) level\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender can freeze an amount of water. The higher the water (2) Level the more water can be frozen. (for big amounts might need to roll an Player Root\u002fvariable\u002fprimarystat\u002fIntelligence|Intelligence (0) check) \u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003efreezing\u003cbr\u003ewater \u003cbr\u003eLevel1\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eReaction \u003cbr\u003e \u003cbr\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots (min 1 in each):\u003cbr\u003e-  X: X  10 Barrier (0)\u003cbr\u003e-  Y: Y  5 Healing at the start of their turn if barrier remains unbroken\u003cbr\u003e\u003cbr\u003e- If the barrier is not broken once at the start of their next turn, as the ice thaws, they are healed for 2 \u00d7 Y but their Movement (0) is halved.\u003cbr\u003e\u003cbr\u003e- Encase an ally in a pillar of glacial ice with a liquid healing core.\u003cbr\u003e\u003cbr\u003eteamup \u003cbr\u003eLevel2 \u003cbr\u003ewater\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAction\u003cbr\u003eCyclicFlow\u003cbr\u003eConcentration \u003cbr\u003e\u003cbr\u003e- Cost: 1-3 Water Charges.\u003cbr\u003e- Duration: 1 round Concentration.\u003cbr\u003e- Range: Touch (through water).\u003cbr\u003e- Effect:  \u003cbr\u003e    You channel healing energy through water, restoring health to a creature. \u003cbr\u003e\t- If the creature is unconscious the creature becomes stable immediately.\u003cbr\u003e    - Healing: 2d8 per charge + Int (5) modifier at the beginning of your next Turn.\u003cbr\u003e\u003cbr\u003eLevel1\u003cbr\u003ewater\u003cbr\u00
