// Very small Markdown -> HTML converter (subset of marked).
const marked = {
    parse: function(md){
        if(md == null) return '';
        let s = String(md);
        // escape HTML
        s = s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        // code blocks ```
        s = s.replace(/```([\s\S]*?)```/g, function(m, code){ return '<pre><code>'+code.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</code></pre>'; });
        // headings
        s = s.replace(/^###\s*(.+)$/gm, '<h3>$1</h3>');
        s = s.replace(/^##\s*(.+)$/gm, '<h2>$1</h2>');
        s = s.replace(/^#\s*(.+)$/gm, '<h1>$1</h1>');
        // bold and italic
        s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
        // inline code
        s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
        // links [text](url)
        s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(m,t,u){ return '<a href="'+u.replace(/"/g,'&quot;')+'">'+t+'</a>'; });
        // unordered lists: convert lines starting with - into <ul>
        s = s.replace(/(^|\n)(?:-\s+(.+))(?:\n|$)/g, function(_,pre,item){ return pre+'<ul><li>'+item+'</li></ul>'; });
        // paragraphs: two or more newlines => paragraph breaks
        s = s.replace(/\n{2,}/g, '</p><p>');
        // wrap remaining single newlines with <br>
        s = s.replace(/\n/g, '<br>');
        // ensure top-level paragraphs
        if(!/^\s*<h|^\s*<ul|^\s*<pre/.test(s)){
            s = '<p>' + s + '</p>';
        }
        return s;
    }
};

// Simple DOMPurify-like sanitizer implemented using DOM APIs.
const DOMPurify = {
    sanitize: function(html){
        if(html == null) return '';

                    if(tag === 'script' || tag === 'iframe' || tag === 'object' || tag === 'embed'){

                        return;
                    }
                    // remove event handler attributes and dangerous URIs
                    for(const attr of Array.from(node.attributes || [])){
                        const name = (attr.name||'').toLowerCase();
                        const val = (attr.value||'').toLowerCase().trim();

                            node.removeAttribute(attr.name);

                        }

            });
            return template.innerHTML;
        }catch(e){
            // fallback: escape
            return String(html).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }
    }

f-contained HTML animation from timestamped snapshot files named like `<timestamp>_<root>.md` (parses JSON blocks or markdown tables).\n- `Mycelium/scripts/grow_mushroom.py` \u2014 a proxy that delegates to the Python implementation under `Mycelium/scripts/Python` if present.\n\n## How they relate to `Player Root`\n\n- The scripts scan the repository for `.md` files (including files under `Player Root/PCs`, `Player Root/NPCs`, `Player Root/Rules`, `Player Root/Organisations`, `Player Root/variable`, etc.).\n- `append_backlinks.py` will add Obsidian-style links `[[relative/path/to/file]]` into target files so you can see where a PC, NPC or location is referenced.\n- `build_tag_backlinks.py` aggregates tag usage into `Tag_Summaries/` (by default), giving a quick index of all files mentioning a tag.\n- `animate_pagerank.py` reads snapshot files (eg `20250915_Player Root.md`) and produces an HTML animation useful for visualising changing prominence of PCs/NPCs/locations over time.\n\n## Quick commands (run from repo root)\n\n- Dry-run backlink scan:\n  `python3 Mycelium/scripts/append_backlinks.py --root .`\n- Apply backlinks (writes files):\n  `python3 Mycelium/scripts/append_backlinks.py --root . --apply`\n- Build tag summaries (dry-run):\n  `python3 Mycelium/scripts/build_tag_backlinks.py --root . --outdir Tag_Summaries`\n- Write tag summaries:\n  `python3 Mycelium/scripts/build_tag_backlinks.py --root . --outdir Tag_Summaries --apply`\n- Create PageRank animation from snapshots in `Player Root`:\n  `python3 Mycelium/scripts/animate_pagerank.py --dir \"Player Root\" --out \"Player Root/mycelium_animation.html\"` doesn't work yet\n\n## DM recommended workflow\n\nwrite your Dms notes into a folder that you list in .gitgnore like Dms Root\n\n1. Commit or copy the repo as a backup.\n2. Run backlink dry-run and inspect the preview:\n   `python3 Mycelium/scripts/append_backlinks.py --root .`\n3. If satisfied, apply backlinks:\n   `python3 Mycelium/scripts/append_backlinks.py --root . --apply`\n4. Build tag summaries for session prep:\n   `python3 Mycelium/scripts/build_tag_backlinks.py --root . --apply`\n5. If you maintain periodic snapshots, generate an animation and open the HTML to visualise story prominence.\n\n## Player quick usage \u2014 where to find everything about your character\n\nPlayers: most of the information about a character is stored in the PCs folder. Look in `Player Root/PCs/` (player-facing area) depending on your group's workflow. Or edit general information about the world or npc in files on the whole Player Root with your content. Feel free to write create files for bending moves just tag them with #player_created_rule to clarify its not yet been cleared officially yet or it still needs work.\n\nWhat to look for:\n\n- Character sheet file (usually `<Name> character sheet.md`) \u2014 canonical stats\n- Session notes and encounters \u2014 files whose titles describe an event; these contain context and references to the PC.\n- Images and media \u2014 look for PNG/JPG files in the same folder (some characters have portraits next to their MD file).\n- Backups \u2014 files ending in `.bak` are safe copies made previously.\n\nBacklinks and tags (how to find cross-references):\n\n- After the DM runs the repo tools (recommended), each character file will include a `## Backlinks` section listing files that refer to that PC. Open your PC file and scroll to `## Backlinks` to see where you've been mentioned.\n- The DM may also generate `Tag_Summaries/` (e.g. `Tag_Summaries/NightBloom/NightBloom.md`) which collects all files using a particular `#tag` (useful for themes, factions, or story hooks).\n\nIf you want to preview changes locally (read-only):\n\n```\npython3 Mycelium/scripts/append_backlinks.py --root .\npython3 Mycelium/scripts/build_tag_backlinks.py --root .\n```\n\nThese run in dry-run mode by default and will print previews; do not run `--apply` unless you are coordinating with the DM.\n\n## Safety & tips\n\n- Both backlink and tag scripts default to dry-run; always preview before `--apply`.\n- Back up or commit before running `--apply`.\n- `append_backlinks.py` will include PageRank info if `Mycelium/pagerank.json` exists.\n- Snapshot files must match the pattern `^\\d+_.*\\.md$` for `animate_pagerank.py` to detect them.\n\n## Want automation?\n\nIf you want, create a small wrapper script that commits first, runs the scans with `--apply`, and exports the animation\u2014I'll help create it.\n\n---\n\nGenerated: concise usage guide for Mycelium scripts and `Player Root` integration.\n"}, "Static_index.html": {"size": 863293, "type": "large", "note": "file too large to embed in static snapshot"}, ".gitignore": {"size": 810, "type": "text", "text": "# Ignore common generated and backup files\n*DMs Root*\n*.bak\n*.zip\n*.DS_Store*\n*__pycache__/\n*.obsidian/workspace.json\n# All paths that contain the word \"Collectionfiles\" or \"ExpandedCollections\"\n\n# Ignore backups and vault/workspace folders\nbackups/\n*.bak\n\n# ---- Mycelium vault handling ----\n# We want to completely ignore any working Mycelium vault content so that\n# local/generated files in the Mycelium folder are never committed.\n#\n# - Ignore the canonical vault directory and any sibling folders that start\n#   with \"Mycelium_\" (these are working or intermediate folders).\nMycelium/*\nMycelium_*\n\n\n\n# Note: If Mycelium files were already committed, remove them from the index\n# with: `git rm -r --cached Mycelium` and commit the change. That will ensure\n# the ignore rules take effect for future commits.\n"}, "ATLA_Campaign_wikigraph_sunburst.html": {"size": 608238, "type": "large", "note": "file too large to embed in static snapshot"}, "wikigraphs_run.log": {"size": 0, "type": "text", "text": ""}, "server.pid": {"size": 6, "type": "text", "text": "80475\n"}, "server.log": {"size": 2075, "type": "text", "text": " * Serving Flask app 'run_frontend_api'\n * Debug mode: on\nWARNING: This is a development ser nsformation Points (0)\nElement Level (0):\n\tFirebending (0): Level 2 (0) \n\tEarthbending (0): Level 1 (0)\n\n\n---\n!Luma'tik.png (0)\n- **Size:** Small\n\n| **Stat**                       | **Value**   |\n| ------------------------------ | ----------- |\n| **Strength (0) (STR (5))**     | 4 (-3)      |\n| **Dexterity (0) (Dex (3))**    | **16 (+3)** |\n| **Constitution (0) (Con (3))** | 12 (+1)     |\n| Wisdom (0)(WIS (7))            | 10(+0)      |\n| Intelligence (0)(Int (4))      | 8(-1)       |\n\n\n- **Ideal for infiltration, distraction, and sensory manipulation.** Luma\u2019tik thrives in urban or crystal-laced environments, using its shimmering form and illusions to mislead enemies and aid allies from the shadows. Though not powerful in direct combat, it\u2019s difficult to pin down and annoying to deal with.\n    \n\n---\n\n### **Movement:**\n\n- Fly 15 m (hovering, effortless, emits no sound).\n    \n- Climb 10 m (can scale smooth surfaces with reflective qualities).\n    \n\n---\n\n### **Abilities in Luma\u2019tik Form:**\n\n- **Refraction Veil:** While in bright or shifting light, Luma\u2019tik gains advantage on Stealth and cannot be targeted by opportunity attacks. This effect ends if Luma\u2019tik is in total darkness or complete silence.\n    \n- **Mirage Flicker (1/Short Rest (0)):** As a Bonus Action (0), Luma\u2019tik can create up to two illusionary duplicates for 1 minute. Each duplicate mimics its movements and grants attackers disadvantage on attack rolls until they hit Luma\u2019tik.\n    \n    \n- **Glimmerjump:** \n- Reaction (0):\n\tteleport to any point within 20 m that is brightly lit or reflects light (e.g., mirrors, water, crystal surfaces)\n    \n\n---\n\n### **Combat Stats:**\n\n- **Evasion:** 17\n    \n- **HP:** 21 (fragile, relies on mobility and illusions)\n    \n\n---\n\nSpecial Attacks (0):\n\n- **Sparkbite:** Melee Weapon Attack, Spirit Attack Roll (1d20 + 2 + 3)to hit, 1d6 piercing and 1d4 radiant damage. If attacking from stealth, deals an extra 1d4 radiant damage.\n    \n- **Lightshard Dart:** Ranged Attack, Spirit Attack Roll (1d20 + 2 + 3) to hit, 1d6 radiant damage. On hit, target has disadvantage on Perception checks for 1 minute.\n\n---\n\n_Luma\u2019tik is a playful, capricious entity\u2014often found dancing between fractured crystal surfaces or taunting intruders with flickers of light and laughter. Bonding with this spirit gives a bender or spiritualist access to stealth, misdirection, and flash-based utility, ideal for scouts or cunning tacticians._\n\n---\n\n\n\n#Level2 #spirit #player_root\n\n#Level2\n#player_root\n#shapeshifting_form\n#spirit\n```\n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/Spirit/Spiritbending Moves/Level 1/Untitled - Tiebeediy.md": {"size": 249, "type": "text", "text": "```markdown\n#transformation\n\nYou transform into a creature using Spiritbending Slot (2). The Level of creature corresponds with the Bending Slot used.\n- Range: e.g. Self (0).\n- **Duration:** varies\n\n#level1\n#player_root\n#spirit\n#transformation\n```\n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/Spirit/Spiritbending Moves/Level 1/Shapeshifting - Tiebeediy.md": {"size": 425, "type": "text", "text": "\n#transformation\n\nYou transform into a creature using Spiritbending Slot (2). The Level of creature corresponds with the Bending Slot used.\n- Range: e.g. Self (0).\n- **Duration:** varies\n- Whenever you loose your shapeshifting form involuntarily (by getting reduced to 0 HP in that form) you roll against your own Spiritbending DC (19) or you gain spirit (2) chaos_energy (0).\n\n#level1\n#player_root\n#spirit\n#transformation\n\n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/Spirit/Spiritbending Moves/Level 1/Human Form - Tiebeediy.md": {"size": 160, "type": "text", "text": "```markdown\n#Action\n\nMahogany (0)\nSpecial Attacks (0)\n\n\n#spirit #Level1 #shapeshifting_form #player_root\n\n#Level1\n#player_root\n#shapeshifting_form\n#spirit\n```\n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/Spirit/Spiritbending Moves/Level 1/Flying Lemur Form - Tiebeediy.md": {"size": 1345, "type": "text", "text": "```markdown\n#shapeshifting_form\n**Transformation Points cost:** 2 Transformation Points (0)\n\n| **Stat**                       | **Value** |\n| ------------------------------ | --------- |\n| **Strength (0) (STR (5))**     | 6 (-2)    |\n| **Dexterity (0) (Dex (3))**    | 24(+7)    |\n| **Constitution (0) (Con (3))** | 7 (-2)    |\n| Wisdom (0)(WIS (7))            | 14(+2)    |\n| Intelligence (0)(Int (4))      | 8(-1)     |\n**Transformation Points cost:** 2 Transformation Points (0)\n- **Size:** Small\n    \n- **Movement:**\n    - Fly 20 m (highly maneuverable).\n    - Climb 20 m (adapted to vertical movement).\n- **Abilities in Flying Lemur Form:**\n\n    - **Silent Glide:** Advantage on Stealth checks while flying.\n    - **Acute Senses:** Advantage on Perception checks that rely on sight or hearing.\n    - **Quick Escape:** Disengage or dash as a Bonus Action (0).\n- **Combat Stats (Flying Lemur):**\n    \n    - Evasion (13): 20\n    - HP: 6 (fragile but evasive).\n    - Attacks:\n        - **Razor Claws:** Melee Weapon Attack, d20 + Dex (3) to hit, 1d4 slashing damage.\n- **Uses:**  \n    Perfect for scouting, infiltration, or swift movement through difficult terrain. The form allows quick evasion and small-scale reconnaissance.\n\nBending Slots:\n\tAir Lvl1: 4\n\n\n#spirit  #Level1 #player_root\n\n#Level1\n#player_root\n#shapeshifting_form\n#spirit\n```\n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/core rules/Lingering Effect - Tiebeediy.md": {"size": 229, "type": "text", "text": "If not Specified otherwise, lingering effect last until the start of your next Turn.\nIf caused by a damaging Move: Every creature that ends its turn there will get half the original attacks Damage.\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/core rules/Manually Rolled Hitpoints - Tiebeediy.md": {"size": 32, "type": "text", "text": "\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/core rules/Concentration - Tiebeediy.md": {"size": 233, "type": "text", "text": "Con save DC of max(10, Damage Taken / 2)\nSome Moves require concentration to keep them up. If you take damage while concentrationg you have to make a Con (3) save with a DC of max(10, Damage Taken / 2)\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/core rules/Bending Slots - Tiebeediy.md": {"size": 783, "type": "text", "text": "Airbending Slot Progression (0)\nFirebending Slot Progression (0)\nearthbending slot (2)\nWater Charges (0)\nSpiritbending Slot Progression (0)\n\nSlot progression rule: for a bending element at level N you receive slots distributed by slot level as follows \u2014 1 slot at level N, 2 slots at level N-1, 3 slots at level N-2, and so on down to N slots at level 1. In formula form: for each k from 1..N you get k slots of level (N+1-k).\n\nExamples:\n\n- Level 3 earthbender \u2192 1\u00d7 level 3, 2\u00d7 level 2, 3\u00d7 level 1.\n- Level 4 earthbender \u2192 1\u00d7 level 4, 2\u00d7 level 3, 3\u00d7 level 2, 4\u00d7 level 1.\n\nUse this rule to calculate and fill the table entries below. Only rows for elements with at least one slot are included to make tracking easier:\n\nNot for waterbenders\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/core rules/Cluster - Tiebeediy.md": {"size": 247, "type": "text", "text": "#Collectionfile \nWhen a creature is standing within 1 meter of another creature it can get affected by some effects\n<!-- BEGIN-AUTO-COLLECTION:Cluster -->\n## Backlinks\n\n  ./\n\n<!-- END-AUTO-COLLECTION -->\n\n\n\n\n\n\n\n\n\n\n\n\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/core rules/Short Rest - Tiebeediy.md": {"size": 81, "type ) + Con (3)\nSpirit: 1d4 per CL (3) + Con (3)\nPlayer Root (0)\n#variable\n\n#player_root\n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/core rules/Stat Shorts/Physical Armor - Tiebeediy.md": {"size": 42, "type": "text", "text": "\nPlayer Root (0)\n#variable\n\n#player_root\n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/core rules/Stat Shorts/HP - Tiebeediy.md": {"size": 1034, "type": "text", "text": "#Collectionfile \nHitpoints\nWhen your HP (0) reach 0 you are unconscious (0) and bleeding out. \n\nOn your Turn you have to roll a death saving throw. \nIf you have 3 Successes you become stable and don't have to roll anymore.\nIf you have 3 Failures you die.\n<!-- BEGIN-AUTO-COLLECTION:HP -->\n## Backlinks\n\n  ./\n  \u251c\u2500\u2500 create_npc.py (0)\n  \u251c\u2500\u2500 create_pc.py (0)\n  \u2514\u2500\u2500 Players Part\n      \u2514\u2500\u2500 PCs\n          \u251c\u2500\u2500 Airwatterbendertest\n              \u2514\u2500\u2500 Airwatterbendertest Character Sheet.md (0)\n          \u251c\u2500\u2500 Anju\n              \u2514\u2500\u2500 Player Root/PCs/Anju/Anju Character Sheet (0)\n          \u251c\u2500\u2500 Spirittest\n              \u2514\u2500\u2500 Spirittest Character Sheet.md (0)\n          \u251c\u2500\u2500 TestChar\n              \u2514\u2500\u2500 TestChar Character Sheet.md (0)\n          \u251c\u2500\u2500 TestQuick\n              \u2514\u2500\u2500 TestQuick Character Sheet.md (0)\n          \u2514\u2500\u2500 TmpTest\n              \u2514\u2500\u2500 TmpTest Character Sheet.md (0)\n\n<!-- END-AUTO-COLLECTION -->\n\n\n\n\n\nPlayer Root (0)\n#variable\n\n#player_root\n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/core rules/Stat Shorts/Int - Tiebeediy.md": {"size": 170, "type": "text", "text": "Intelligence\nOne of the 6 Stats. Important for Waterbending Moves (0).\n\n**Links**:\n- Waterbending Moves (0)\n\nTags:\n#Waterbending\nPlayer Root (0)\n#variable\n\n#player_root\n\n"}, "Player Root/PCs/Tiebeedi ype": "text", "text": "#Action\n#Reaction \n\nReaction: Must be initiated by a Firebender in line of sight \n\n#lingering_effect \n\nFocused light is amplified by mirrored shards into a blinding beam.\n- **Effect:** \n- Range: 10X meter radius Sphere\n- **Effect:** \n\t- Targets in area must make  a DC X * 2 Int (4) save to shield or close their eyes or be Blinded for one turn\n\t-  If X \u2265 10, Deal **Xd4 radiant damage** to all creatures in the area\n    \n\n\n#teamup\n#fire \n#earth\n#player_root\n#Level1 \n\n\n\n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/Team-up Moves/Glass Fruit Bending/Resonant Collapse (Blue Soundbanana) - Tiebeediy.md": {"size": 418, "type": "text", "text": "\n#Action\n#Reaction \n\nReaction: Must be initiated by a Airbender in line of sight \n\n\n#lingering_effect \n\nA soundblast builds from multiple frequencies and shatters the ground.\n- Range: 2X meter radius Sphere\n\n- **Effects:**\n\t- Targets in area must make CON save of X*2 or take **Xd8 thunder damage** and fall prone\n\t- Earth terrain in the zone becomes **difficult terrain**\n\n#Level1 \n#earth\n#air \n#player_root\n#teamup\n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/Team-up Moves/Glass Fruit Bending/Soulseed Harmonic Seal - Tiebeediy.md": {"size": 519, "type": "text", "text": "\n#Action\n#Reaction \n\n\nReaction: Must be initiated by a Earthbender in line of sight \n\n\n- Range: within line of sight up to 100 meter\n- **Duration:** Lasts until stopped concentrating or for 1 hour.\n\n- **Effect:** \n\t- As the air vibrates with a cleansing energy as creatures of your choice within radius gain 10 * X Barrier (0) (if this barrier is halfed for one creature its halfed for all)\n\t- If X \u2265 15, the seal also protects against being Immobilised (0)  \n    \n\n#defensive \n#Level1 \n#earth\n#player_root\n#teamup\n\n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/Team-up Moves/Air-Earth/Sandstream - Tiebeediy.md": {"size": 396, "type": "text", "text": "\n#Action \n#Reaction \n\nEach Bender-decides to which pool to add their Bending slots:\n-  **Y**(Earth): Yd12 Damage per projectile\n- **X**(Air): X Projectiles Air Attack Roll (1d20 + 0 + 3)\n- **Range:** Y * X meters from the Airbender \n \n \n- One Earthbender shoots Y Sand Projectiles (rolls the Damage roll) and the Airbender controlls them to home to the X Targets)\n\n\n#Level1\n#air\n#earth\n#teamup\n\n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/Earth/mechanics/Earthbending rules - Tiebeediy.md": {"size": 502, "type": "text", "text": "\n#### **Overview:**\n\nEarthbenders are solid and steadfast, drawing upon the Strength of their bodies and the stability of the ground beneath them. Their techniques focus on defense, fortification, and manipulating terrain. Rather than relying on agility to avoid blows, earthbenders create barriers, raise armor ratings, and reinforce their allies. They harness **Earth Charges** to shape stone and metal, providing a constant, reliable source of defense and stability.\n\n\n\n#player_root\n#earth\n#Level1 \n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/Earth/mechanics/Earthbending Slot Progression - Tiebeediy.md": {"size": 305, "type": "text", "text": "\nYou have 2 \\* earth (1) Maximum Slots that are restored after about an hour of rest.\n\nYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\n- spend 2 and then 1 \n- spend 1 and then 2 or\n- spend 1 then 1 then 1 \n\n#earth \n#Level1 \n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/Earth/Earthbending Moves/Level 1/Earth Shift - Tiebeediy.md": {"size": 359, "type": "text", "text": "\n\n#Bonus_Action  \n\n- **Range:** self and every creature within 1+1 * earthbending slot (2) meters of you\n\n**Effect**:\nTripping opponents with minor terrain manipulation. The target must succeed on a Dexterity saving throw against your Player Root/Rules/Bending Rules/Earth/mechanics/Earthbending DC (0)) or be knocked Prone.\n\n\n\n#Level1 \n#earth\n#player_root\n\n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/Earth/Earthbending Moves/Level 1/Stone Knuckles - Tiebeediy.md": {"size": 145, "type": "text", "text": "\n#Action\n\n- Range: #Meele\n- **Earth Attack Roll (1d20 + 1 + 5)**\n- Damage: 1+ earthbending slot (2) d6 bludgeoning damage.\n\n\n#earth \n#Level1 \n\n\n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/Earth/Earthbending Moves/Level 1/Rock Hurl - Tiebeediy.md": {"size": 238, "type": "text", "text": "\n#Action\n\n\n- Range: 3\\* earthbending slot (2) meters\n- Earth Attack Roll (1d20 + 1 + 5)\n- Damage: 1d6 \\* earthbending slot (2) bludgeoning.\n\n**Effect**:\n\n- Lift and throw a small rock. Simple ranged attack.\n\n\n#Level1\n#earth\n#player_root\n\n"}, "Player Root/PCs/Tiebeediy/Bending Rules - Tiebeediy/Earth/Earthbending Moves/Level 1/Earth Brace - Tiebeediy.md": {"size": 251, "type": "text", "text": "#Reaction\n#Concentration \n- **Range:** self and every creature within earthbending slot (2) Meters of you\n- **Effect:**  \n\t- Root yourself and every creature within range to resist forced movement.\n\t- Duration: 1 round.\n\n\n#Level1\n#earth\n#player_root\n\n"}, "Player Root/PCs/Rio/Rio Character Sheet.md": {"size": 1594, "type": "text", "text": "Name: Rio\n## Vitals\n\n\n\n| key          |            value |\n| ------------ | ---------------: |\n| max_hp       |       90 |\n| current hp   |   90 |\n| Stress Level | 0 |\n\n## Core Stats\n\n| Stat         |            Value |\n| ------------ | ---------------: |\n| Strength     |     1 |\n| Dexterity    |    6 |\n| Constitution | 2 |\n| Intelligence | 8 |\n| Wisdom       |       2 |\n| Charisma     |     4 |\n\n## Bending Levels\n\nTotal Bending Level: 3\nDamage Dice Bonus: 0\n\n| Element |      Level | Attack Roll            | DC                   |\n| ------- | ---------: | ---------------------- | -------------------- |\n| Water   |  2 : "If Concentration is not broken half the Water Charges (0) are refunded.\n\n\n#water \n#Level1 \n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/Water/Waterbending Moves/Level 2/Slicing Water - Rio.md": {"size": 211, "type": "text", "text": "#Action \n\n- **Range:** 2 * Water_charge (15) meter \n-  Water Attack Roll (1d20 + 2 + 8)\n- **Damage:** Water_charge (15)d6 slicing damage to all creatures within the area within line of sight. \n\n#Level2\n#water \n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/Water/Waterbending Moves/Level 2/Ice Daggers - Rio.md": {"size": 261, "type": "text", "text": "#Action \n\n- **Range:** 5 * water (2) level\n- Water Attack Roll (1d20 + 2 + 8)\n- Projectiles: Water_charge (15) \\* 3\n- **Damage:** 1d4 piercing per Projectile\n\nThe waterbender creates small sharp daggers of ice to hurl at targets.\n\n#Level2\n#player_root\n#water\n\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/Water/Waterbending Moves/Level 2/Freeze Enemy - Rio.md": {"size": 388, "type": "text", "text": "#Reaction \n#Bonus_Action \n\n- **Range:**  Water (2) Level meters.\n\n- The waterbender can attempt to freeze a creature that has been hit by a Move using Water_charge (15)(s). It has to succeed a Strength Saving throw against your Waterbending DC (20) or become Immobilised (0).\n- The target gets to repeat its save at the start of its turn. The DC drops by 1 every round.\n\n\n#Level2\n#water\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/Water/Waterbending Moves/Level 2/Water Tentacles - Rio.md": {"size": 948, "type": "text", "text": "\n#Action\n\nLevel 3 (0)\nCyclic Flow (0)\n\n- Range: Self (0).\n- **Duration:** 1 Turn.\n- Description The waterbender summons two water tentacles to attack or grapple targets.\n\n**Effects:**\n    - Water Attack Rolll (0)\n    - **Damage:** 1d10 bludgeoning damage per tentacle.\n    - **Grapple:** A creature hit by the tentacle must succeed on a Strength saving throw against your Player Root/Rules/Bending Rules/Water/Mechanics/Waterbending DC (0) or be restrained.\n\nElement (0)\n#### **Water Tentacles (2nd Level Move)**\n\n- **Cost:** 2 Water Charges.\n- **Type:** Action (0).\n- **Range:** 15 ft.\n- **Effect:**  \n    The waterbender summons two water tentacles to attack or grapple targets.\n    - **Water Attack Rolll (0):** Int (8) + Proficiency (0).\n    - **Damage:** 1d10 bludgeoning damage per tentacle.\n    - **Grapple:** A creature hit by the tentacle must succeed on a Strength saving throw or be restrained.\n\n\nTags:\n\n#Level2\n#player_root\n#water\n```\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/Water/Waterbending Moves/Level 1/Piercing Water - Rio.md": {"size": 217, "type": "text", "text": "\n#Action\n\n- Range: 3\\* Water_charge (15) meters\n- Water Attack Roll (1d20 + 2 + 8)\n- Damage: Water_charge (15)d6 piercing.\n\nThe waterbender shoots a sharp, pressurized stream of water at a target.\n\n\n#Level1\n#water \n\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/Water/Waterbending Moves/Level 1/Freeze - Rio.md": {"size": 325, "type": "text", "text": "#Action\n- **Range:** 3m * water (2) level\n- **Effect:**  \n    The waterbender can freeze an amount of water. The higher the water (2) Level the more water can be frozen. (for big amounts might need to roll an Player Root/variable/primary_stat/Intelligence|Intelligence (0) check) \n\n\n#Waterbending\n#freezing\n#water \n#Level1 \n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/Water/Waterbending Moves/Level 1/Healing Water - Rio.md": {"size": 427, "type": "text", "text": "\n#Action\n#Cyclic_Flow\n#Concentration \n\n- **Cost:** 1-3 Water Charges.\n- Duration: 1 round Concentration.\n- **Range:** Touch (through water).\n- **Effect:**  \n    You channel healing energy through water, restoring health to a creature. \n\t- If the creature is unconscious the creature becomes stable immediately.\n    - **Healing:** 2d8 per charge + Int (8) modifier at the beginning of your next Turn.\n\n\n#Level1\n#water\n#healing\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/Water/Waterbending Moves/Level 1/Water Whip - Rio.md": {"size": 500, "type": "text", "text": "#water \n- **Range:** Water_charge (15) meters\n- **Effect:**  \n   The waterbender lashes out with a tendril of water, striking a target within range.\n  - **Water Attack Roll (1d20 + 2 + 8):**\n  - **Damage:** 1d6 modifier bludgeoning damage.\n  - **Special:** The target must succeed on a Strength saving throw against your Waterbending DC (20) or be immobilised for 1 round.\n\n**Links**:\n\n- Strength (0)\n- _Rules (0)\n- Water Whip (0)\n- Proficiency (0)\n- Int (8)\n\nTags:\n\n#Level1\n#player_root\n#water\n```\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Short Rest - Rio.md": {"size": 81, "type": "text", "text": "You restore all your Hitpoints and Bending Slots\nPlayer Root (0)\n\n#player_root\n\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Movement - Rio.md": {"size": 71, "type": "text", "text": "**Movement per Round**:\n10 meters + air (0) Level * 3\n\n\n#player_root\n\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Manually Rolled Hitpoints - Rio.md": {"size": 32, "type": "text", "text": "\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Ammunition - Rio.md": {"size": 169, "type": "text", "text": "If not Specified otherwise, Ammunition can be used by any character (if its logic :D)  as part of their Moves to enhance them creatively.\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Concentration - Rio.md": {"size": 233, "type": "text", "text": "Con save DC of max(10, Damage Taken / 2)\nSome Moves require concentration to keep them up. If you take damage while concentrationg you have to make a Con (2) save with a DC of max(10, Damage Taken / 2)\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Cluster - Rio.md": {"size": 247, "type": "text", "text": "#Collectionfile \nWhen a creature is standing within 1 meter of another creature it can get affected by some effects\n<!-- BEGIN-AUTO-COLLECTION:Cluster -->\n## Backlinks\n\n  ./\n\n<!-- END-AUTO-COLLECTION -->\n\n\n\n\n\n\n\n\n\n\n\n\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Bending Slots - Rio.md": {"size": 783, "type": "text", "text": "Airbending Slot Progression (0)\nFirebending Slot Progression (0)\nearthbending slot (0)\nWater Charges (0)\nSpiritbending Slot Progression (0)\n\nSlot progression rule: for a bending element at level N you receive slots distributed by slot level as follows \u2014 1 slot at level N, 2 slots at level N-1, 3 slots at level N-2, and so on down to N slots at level 1. In formula form: for each k from 1..N you get k slots of level (N+1-k).\n\nExamples:\n\n- Level 3 earthbender \u2192 1\u00d7 level 3, 2\u00d7 level 2, 3\u00d7 level 1.\n- Level 4 earthbender \u2192 1\u00d7 level 4, 2\u00d7 level 3, 3\u00d7 level 2, 4\u00d7 level 1.\n\nUse this rule to calculate and fill the table entries below. Only rows for elements with at least one slot are included to make tracking easier:\n\nNot for waterbenders\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Lingering Effect - Rio.md": {"size": 229, "type": "text", "text": "If not Specified otherwise, lingering effect last until the start of your next Turn.\nIf caused by a damaging Move: Every creature that ends its turn there will get half the original attacks Damage.\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Conditions/Slowed - Rio.md": {"size": 154, "type": "text", "text": "A slowed creatures Movement Speed is halved and it can not use any #Bonus_actions or #reactions. ( #Action (0) is allowed)\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Conditions/unconscious - Rio.md": {"size": 32, "type": "text", "text": "\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Conditions/Immobilised - Rio.md": {"size": 210, "type": "text", "text": "The creature can not move or be moved by force. Depending what causes Immobilisation you can save against it as an Action (0) or can remove it with your bending more efficiently.\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Conditions/Paralysed - Rio.md": {"size": 230, "type": "text", "text": "# Paralysis Mechanics\n\nCertain Chi Blocking moves cause paralysis, preventing the target from taking actions or bending for a specified duration.\n\n## Key Moves\n- Pressure Point Strike\n- Nerve Strike\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Stat Shorts/HP - Rio.md": {"size": 1034, "type": "text", "text": "#Collectionfile \nHitpoints\nWhen your HP (0) reach 0 you are unconscious (0) and bleeding out. \n\nOn your Turn you have to roll a death saving throw. \nIf you have 3 Successes you become stable and don't have to roll anymore.\nIf you have 3 Failures you die.\n<!-- BEGIN-AUTO-COLLECTION:HP -->\n## Backlinks\n\n  ./\n  \u251c\u2500\u2500 create_npc.py (0)\n  \u251c\u2500\u2500 create_pc.py (0)\n  \u2514\u2500\u2500 Players Part\n      \u2514\u2500\u2500 PCs\n          \u251c\u2500\u2500 Airwatterbendertest\n              \u2514\u2500\u2500 Airwatterbendertest Character Sheet.md (0)\n          \u251c\u2500\u2500 Anju\n              \u2514\u2500\u2500 Player Root/PCs/Anju/Anju Character Sheet (0)\n          \u251c\u2500\u2500 Spirittest\n              \u2514\u2500\u2500 Spirittest Character Sheet.md (0)\n          \u251c\u2500\u2500 TestChar\n              \u2514\u2500\u2500 TestChar Character Sheet.md (0)\n          \u251c\u2500\u2500 TestQuick\n              \u2514\u2500\u2500 TestQuick Character Sheet.md (0)\n          \u2514\u2500\u2500 TmpTest\n              \u2514\u2500\u2500 TmpTest Character Sheet.md (0)\n\n<!-- END-AUTO-COLLECTION -->\n\n\n\n\n\nPlayer Root (0)\n#variable\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Stat Shorts/General Armor Definition - Rio.md": {"size": 113, "type": "text", "text": "Reduces All Damage Types other than Spiritual Damage.\nbase general armor:\nEarthbending Level (0)\n\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Stat Shorts/Armor definition - Rio.md": {"size": 340, "type": "text", "text": "Grants Damage reduction. \nBase armor:\n\n\nGeneral Armor Definition (0) reduces all Damage Types in addition to their specific type Armor (other than spiritual). \n\nPhysical Armor (0) reduces all Piercing Slashing and bludgeoning Damage.\n\n\nBarrier Armor definintion (0) Whenever you suffer unblocked damage Barrier Armor halves\n\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Stat Shorts/Hitpoints - Rio.md": {"size": 111, "type": "text", "text": "Very mandatory for living.\n\nMax Hitpoints (0)\nTemporary Hitpoints (0)\nPlayer Root (0)\n#variable\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Stat Shorts/Strength - Rio.md": {"size": 42, "type": "text", "text": "\nPlayer Root (0)\n#variable\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Stat Shorts/Wisdom - Rio.md": {"size": 42, "type": "text", "text": "\nPlayer Root (0)\n#variable\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Stat Shorts/Max Hitpoints - Rio.md": {"size": 268, "type": "text", "text": "You max Hitpoints (0) are determined by your Level and Bending Type:\nEarth: 1d12 per CL (3) + Con (2)\nWater: 1d8 per CL (3) + Con (2)\nFire: 1d8 per CL (3) +Con (2)\nAir: 1d6 per CL (3) + Con (2)\nSpirit: 1d4 per CL (3) + Con (2)\nPlayer Root (0)\n#variable\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Stat Shorts/Barrier Armor definintion - Rio.md": {"size": 235, "type": "text", "text": "Barrier Armor definintion (0) Whenever you suffer unblocked damage Barrier Armor halves (rounded down)\n\nFor example when you have 15 Barrier Armor and suffer 18 damage you suffer 3 Damage and Barrier Armour halves to 7.\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Stat Shorts/Temporary Hitpoints - Rio.md": {"size": 139, "type": "text", "text": "Temporary Hitpoints (0) are always used first and usually don't Stack but Situational exceptions.\nPlayer Root (0)\n#variable\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Stat Shorts/Int - Rio.md": {"size": 170, "type": "text", "text": "Intelligence\nOne of the 6 Stats. Important for Waterbending Moves (0).\n\n**Links**:\n- Waterbending Moves (0)\n\nTags:\n#Waterbending\nPlayer Root (0)\n#variable\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Stat Shorts/Physical Armor - Rio.md": {"size": 42, "type": "text", "text": "\nPlayer Root (0)\n#variable\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Stat Shorts/Intelligence - Rio.md": {"size": 59, "type": "text", "text": "Auotoexplanatory.\nPlayer Root (0)\n#variable\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/core rules/Stat Shorts/Attack Roll Modifier - Rio.md": {"size": 65, "type": "text", "text": "= Element (0) Level - Stress Level (0)\n\n#variable\n\n#player_root\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/Team-up Moves/Water-Water/Frozen Aegis - Rio.md": {"size": 509, "type": "text", "text": "#Action\n#Reaction \n \nYou may use Levels from **Water only**.\nEach Bender-decides to which pool to add their Bending slots (min 1 in each):\n-  **X**: X * 10 Barrier (0)\n-  **Y**: Y * 5 Healing at the start of their turn if barrier remains unbroken\n\n- If the barrier is not broken once at the **start of their next turn**, as the ice thaws, they are healed for **2 \u00d7 Y** but their **Movement (0) is halved**.\n\n- Encase an ally in a pillar of glacial ice with a liquid healing core.\n\n#teamup \n#Level2 \n#water \n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/Team-up Moves/Glass Fruit Bending/FlashLemon Refractor Beam - Rio.md": {"size": 474, "type": "text", "text": "#Action\n#Reaction \n\nReaction: Must be initiated by a Firebender in line of sight \n\n#lingering_effect \n\nFocused light is amplified by mirrored shards into a blinding beam.\n- **Effect:** \n- Range: 10X meter radius Sphere\n- **Effect:** \n\t- Targets in area must make  a DC X * 2 Int (8) save to shield or close their eyes or be Blinded for one turn\n\t-  If X \u2265 10, Deal **Xd4 radiant damage** to all creatures in the area\n    \n\n\n#teamup\n#fire \n#earth\n#player_root\n#Level1 \n\n\n\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/Team-up Moves/Glass Fruit Bending/Inferno Bloom (Red Flamegrape) - Rio.md": {"size": 271, "type": "text", "text": "#Action\n#Reaction \n\n\nReaction: Must be initiated by a Firebender in line of sight \n\nLingering Effect (0)\n\n- Range: 2X meter radius Sphere\n\n- **Effect:** Explosion in an area, dealing Xd6  bludgeoning + half fire damage\n    \n\n\n#Level1 \n#earth\n#fire \n#player_root\n#teamup\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/Team-up Moves/Glass Fruit Bending/BlueBerry Glass Surge - Rio.md": {"size": 440, "type": "text", "text": "\n#Action\n#Reaction \n\nReaction: Must be initiated by a Waterbender in line of sight \n\nLingering Effect (0)\n\nStick and grow trapping enemies and reshaping the terrain.\n- Range: 2X meter radius Sphere\n\n- **Effects:** \n\t- Targets in area must make  a DCX * 2 Dex (6) save to jump aside or get Immobilised in cold soft and barely liquid Glass.\n\t- If X \u2265 8, brambles regenerate once if destroyed\n\n\n#Level1 \n#earth\n#water \n#player_root\n#teamup\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/Fire/Firebending Moves/Level 1/Smoldering Focus - Rio.md": {"size": 210, "type": "text", "text": "#Bonus_Action\n\n- Description: Calm your breath and focus heat into a small, steady kernel for control or precision.\n\n**Effects:**\n- Reduce your Stress by up to your wis (2) points\n\n#Level1\n#fire\n#player_root\n\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/Fire/Firebending Moves/Level 1/Flame Jet - Rio.md": {"size": 226, "type": "text", "text": "#Action\n\n- **Range:** 5 \\* firebending_slot (2) meters.\n- **Damage:** firebending_slot (2) \\* 1 d10 fire\n- Fire Attack Roll (1d20 + 1 + 2)\n- Unleash a burst of flames in a straight line, damaging one target\n\n\n#Level1\n#fire\n\n\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/Fire/Firebending Moves/Level 1/Control Flame - Rio.md": {"size": 118, "type": "text", "text": "#Action\n#utility\n\n\n- Range: fire (1) \\* 3 meters\n- You manipulate a flame within range\n\n\n#Level1\n#fire\n#player_root\n\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/Fire/Firebending Moves/Level 1/Burning Fists - Rio.md": {"size": 184, "type": "text", "text": "\n#Action\n\n- Range: Melee (0)\n-Fire Attack Roll (1d20 + 1 + 2): Attacks firebending_slot (2) times\n- Damage: 1d6 + Strength (0) Bludgeoning and 1d4 Fire Damage\n\n\n#Level1\n#fire\n#melee\n\n\n"}, "Player Root/PCs/Rio/Bending Rules - Rio/Fire/Mechanics/Firebending Slot Progression - Rio.md": {"size": 303, "type": "text", "text": "\nYou have 2 \\* fire (1) Maximum Slots that are restored after about an hour of rest.\n\nYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\n- spend 2 and then 1 \n- spend 1 and then 2 or\n- spend 1 then 1 then 1 \n\n#fire \n#Level1 \n\n"}, "Player Root/PCs/Anju/$(whoami).json": {"size": 49, "type": "text", "text": "Your personal Notes:\n\nthese are my personal notes"}, "Player Root/PCs/Anju/$WHOAMI.json": {"size": 49, "type": "text", "text": "Your personal Notes:\n\nthese are my personal notes"}, "Player Root/PCs/Anju/Anju Character Sheet.md": {"size": 1601, "type": "text", "text": "Name: Anju\n## Vitals\n\n\n\n| key          |            value |\n| ----------  {\"responsive\": true}                    )                };                            <\/script>        <\/div>\n<\/body>\n<\/html>"}, "Player Root/PCs/Anju/Bending Rules - Anju/Utility - Anju.md": {"size": 130, "type": "text", "text": "\nThese Moves can be used without expending slots (and meant for usage out of combat)\n\n\n#Level1 \n#air #earth #fire #spirit #water \n"}, "Player Root/PCs/Anju/Bending Rules - Anju/Water/Mechanics/Cyclic Flow - Anju.md": {"size": 92, "type": "text", "text": "If Concentration is not broken half the Water Charges (0) are refunded.\n\n\n#water \n#Level1 \n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/Water/Mechanics/Water Charges - Anju.md": {"size": 515, "type": "text", "text": "Water Charges represent the amount of water available for a water-bender to manipulate.\n\n- **Environmental Influence:**  \n   The number of Water Charges available at the start of combat or during an encounter depends on the setting. Feel free to get creative where to find water:\n  - **Desert/Dry Area:** ~0 Water Charges (minimum water source).\n  - **Humid Area:** ~5-10 Water Charges.\n  - **Near Water Source (Lake, Ocean, etc.):** 15 Water Charges.\n  - **In Lake, Ocean, etc.:** ~50+ charges\n\n#water \n#Level1 \n\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/Water/Waterbending Moves/Level 2/Freeze Enemy - Anju.md": {"size": 388, "type": "text", "text": "#Reaction \n#Bonus_Action \n\n- **Range:**  Water (2) Level meters.\n\n- The waterbender can attempt to freeze a creature that has been hit by a Move using Water_charge (15)(s). It has to succeed a Strength Saving throw against your Waterbending DC (17) or become Immobilised (0).\n- The target gets to repeat its save at the start of its turn. The DC drops by 1 every round.\n\n\n#Level2\n#water\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/Water/Waterbending Moves/Level 2/Water Tentacles - Anju.md": {"size": 948, "type": "text", "text": "\n#Action\n\nLevel 3 (0)\nCyclic Flow (0)\n\n- Range: Self (0).\n- **Duration:** 1 Turn.\n- Description The waterbender summons two water tentacles to attack or grapple targets.\n\n**Effects:**\n    - Water Attack Rolll (0)\n    - **Damage:** 1d10 bludgeoning damage per tentacle.\n    - **Grapple:** A creature hit by the tentacle must succeed on a Strength saving throw against your Player Root/Rules/Bending Rules/Water/Mechanics/Waterbending DC (0) or be restrained.\n\nElement (0)\n#### **Water Tentacles (2nd Level Move)**\n\n- **Cost:** 2 Water Charges.\n- **Type:** Action (0).\n- **Range:** 15 ft.\n- **Effect:**  \n    The waterbender summons two water tentacles to attack or grapple targets.\n    - **Water Attack Rolll (0):** Int (5) + Proficiency (0).\n    - **Damage:** 1d10 bludgeoning damage per tentacle.\n    - **Grapple:** A creature hit by the tentacle must succeed on a Strength saving throw or be restrained.\n\n\nTags:\n\n#Level2\n#player_root\n#water\n```\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/Water/Waterbending Moves/Level 2/Slicing Water - Anju.md": {"size": 211, "type": "text", "text": "#Action \n\n- **Range:** 2 * Water_charge (15) meter \n-  Water Attack Roll (1d20 + 2 + 5)\n- **Damage:** Water_charge (15)d6 slicing damage to all creatures within the area within line of sight. \n\n#Level2\n#water \n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/Water/Waterbending Moves/Level 2/Ice Daggers - Anju.md": {"size": 261, "type": "text", "text": "#Action \n\n- **Range:** 5 * water (2) level\n- Water Attack Roll (1d20 + 2 + 5)\n- Projectiles: Water_charge (15) \\* 3\n- **Damage:** 1d4 piercing per Projectile\n\nThe waterbender creates small sharp daggers of ice to hurl at targets.\n\n#Level2\n#player_root\n#water\n\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/Water/Waterbending Moves/Level 1/Piercing Water - Anju.md": {"size": 217, "type": "text", "text": "\n#Action\n\n- Range: 3\\* Water_charge (15) meters\n- Water Attack Roll (1d20 + 2 + 5)\n- Damage: Water_charge (15)d6 piercing.\n\nThe waterbender shoots a sharp, pressurized stream of water at a target.\n\n\n#Level1\n#water \n\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/Water/Waterbending Moves/Level 1/Healing Water - Anju.md": {"size": 427, "type": "text", "text": "\n#Action\n#Cyclic_Flow\n#Concentration \n\n- **Cost:** 1-3 Water Charges.\n- Duration: 1 round Concentration.\n- **Range:** Touch (through water).\n- **Effect:**  \n    You channel healing energy through water, restoring health to a creature. \n\t- If the creature is unconscious the creature becomes stable immediately.\n    - **Healing:** 2d8 per charge + Int (5) modifier at the beginning of your next Turn.\n\n\n#Level1\n#water\n#healing\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/Water/Waterbending Moves/Level 1/Water Whip - Anju.md": {"size": 500, "type": "text", "text": "#water \n- **Range:** Water_charge (15) meters\n- **Effect:**  \n   The waterbender lashes out with a tendril of water, striking a target within range.\n  - **Water Attack Roll (1d20 + 2 + 5):**\n  - **Damage:** 1d6 modifier bludgeoning damage.\n  - **Special:** The target must succeed on a Strength saving throw against your Waterbending DC (17) or be immobilised for 1 round.\n\n**Links**:\n\n- Strength (0)\n- _Rules (0)\n- Water Whip (0)\n- Proficiency (0)\n- Int (5)\n\nTags:\n\n#Level1\n#player_root\n#water\n```\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/Water/Waterbending Moves/Level 1/Freeze - Anju.md": {"size": 325, "type": "text", "text": "#Action\n- **Range:** 3m * water (2) level\n- **Effect:**  \n    The waterbender can freeze an amount of water. The higher the water (2) Level the more water can be frozen. (for big amounts might need to roll an Player Root/variable/primary_stat/Intelligence|Intelligence (0) check) \n\n\n#Waterbending\n#freezing\n#water \n#Level1 \n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/core rules/Manually Rolled Hitpoints - Anju.md": {"size": 32, "type": "text", "text": "\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/core rules/Cluster - Anju.md": {"size": 247, "type": "text", "text": "#Collectionfile \nWhen a creature is standing within 1 meter of another creature it can get affected by some effects\n<!-- BEGIN-AUTO-COLLECTION:Cluster -->\n## Backlinks\n\n  ./\n\n<!-- END-AUTO-COLLECTION -->\n\n\n\n\n\n\n\n\n\n\n\n\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/core rules/Lingering Effect - Anju.md": {"size": 229, "type": "text", "text": "If not Specified otherwise, lingering effect last until the start of your next Turn.\nIf caused by a damaging Move: Every creature that ends its turn there will get half the original attacks Damage.\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/core rules/Short Rest - Anju.md": {"size": 81, "type": "text", "text": "You restore all your Hitpoints and Bending Slots\nPlayer Root (0)\n\n#player_root\n\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/core rules/Concentration - Anju.md": {"size": 233, "type": "text", "text": "Con save DC of max(10, Damage Taken / 2)\nSome Moves require concentration to keep them up. If you take damage while concentrationg you have to make a Con (2) save with a DC of max(10, Damage Taken / 2)\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/core rules/Bending Slots - Anju.md": {"size": 783, "type": "text", "text": "Airbending Slot Progression (0)\nFirebending Slot Progression (0)\nearthbending slot (2)\nWater Charges (0)\nSpiritbending Slot Progression (0)\n\nSlot progression rule: for a bending element at level N you receive slots distributed by slot level as follows \u2014 1 slot at level N, 2 slots at level N-1, 3 slots at level N-2, and so on down to N slots at level 1. In formula form: for each k from 1..N you get k slots of level (N+1-k).\n\nExamples:\n\n- Level 3 earthbender \u2192 1\u00d7 level 3, 2\u00d7 level 2, 3\u00d7 level 1.\n- Level 4 earthbender \u2192 1\u00d7 level 4, 2\u00d7 level 3, 3\u00d7 level 2, 4\u00d7 level 1.\n\nUse this rule to calculate and fill the table entries below. Only rows for elements with at least one slot are included to make tracking easier:\n\nNot for waterbenders\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/core rules/Ammunition - Anju.md": {"size": 169, "type": "text", "text": "If not Specified otherwise, Ammunition can be used by any character (if its logic :D)  as part of their Moves to enhance them creatively.\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/core rules/Movement - Anju.md": {"size": 71, "type": "text", "text": "**Movement per Round**:\n10 meters + air (0) Level * 3\n\n\n#player_root\n\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/core rules/Conditions/Immobilised - Anju.md": {"size": 210, "type": "text", "text": "The creature can not move or be moved by force. Depending what causes Immobilisation you can save against it as an Action (0) or can remove it with your bending more efficiently.\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/core rules/Conditions/unconscious - Anju.md": {"size": 32, "type": "text", "text": "\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/core rules/Conditions/Slowed - Anju.md": {"size": 154, "type": "text", "text": "A slowed creatures Movement Speed is halved and it can not use any #Bonus_actions or #reactions. ( #Action (0) is allowed)\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/core rules/Conditions/Paralysed - Anju.md": {"size": 230, "type": "text", "text": "# Paralysis Mechanics\n\nCertain Chi Blocking moves cause paralysis, preventing the target from taking actions or bending for a specified duration.\n\n## Key Moves\n- Pressure Point Strike\n- Nerve Strike\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/core rules/Stat Sho r:\n\n\nGeneral Armor Definition (0) reduces all Damage Types in addition to their specific type Armor (other than spiritual). \n\nPhysical Armor (0) reduces all Piercing Slashing and bludgeoning Damage.\n\n\nBarrier Armor definintion (0) Whenever you suffer unblocked damage Barrier Armor halves\n\n\n#player_root\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/core rules/Stat Shorts/Int - Anju.md": {"size": 170, "type": "text", "text": "Intelligence\nOne of the 6 Stats. Important for Waterbending Moves (0).\n\n**Links**:\n- Waterbending Moves (0)\n\nTags:\n#Waterbending\nPlayer Root (0)\n#variable\n\n#player_root\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/Team-up Moves/Water-Water/Frozen Aegis - Anju.md": {"size": 509, "type": "text", "text": "#Action\n#Reaction \n \nYou may use Levels from **Water only**.\nEach Bender-decides to which pool to add their Bending slots (min 1 in each):\n-  **X**: X * 10 Barrier (0)\n-  **Y**: Y * 5 Healing at the start of their turn if barrier remains unbroken\n\n- If the barrier is not broken once at the **start of their next turn**, as the ice thaws, they are healed for **2 \u00d7 Y** but their **Movement (0) is halved**.\n\n- Encase an ally in a pillar of glacial ice with a liquid healing core.\n\n#teamup \n#Level2 \n#water \n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/Team-up Moves/Glass Fruit Bending/Resonant Collapse (Blue Soundbanana) - Anju.md": {"size": 418, "type": "text", "text": "\n#Action\n#Reaction \n\nReaction: Must be initiated by a Airbender in line of sight \n\n\n#lingering_effect \n\nA soundblast builds from multiple frequencies and shatters the ground.\n- Range: 2X meter radius Sphere\n\n- **Effects:**\n\t- Targets in area must make CON save of X*2 or take **Xd8 thunder damage** and fall prone\n\t- Earth terrain in the zone becomes **difficult terrain**\n\n#Level1 \n#earth\n#air \n#player_root\n#teamup\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/Team-up Moves/Glass Fruit Bending/Inferno Bloom (Red Flamegrape) - Anju.md": {"size": 271, "type": "text", "text": "#Action\n#Reaction \n\n\nReaction: Must be initiated by a Firebender in line of sight \n\nLingering Effect (0)\n\n- Range: 2X meter radius Sphere\n\n- **Effect:** Explosion in an area, dealing Xd6  bludgeoning + half fire damage\n    \n\n\n#Level1 \n#earth\n#fire \n#player_root\n#teamup\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/Team-up Moves/Glass Fruit Bending/Soulseed Harmonic Seal - Anju.md": {"size": 519, "type": "text", "text": "\n#Action\n#Reaction \n\n\nReaction: Must be initiated by a Earthbender in line of sight \n\n\n- Range: within line of sight up to 100 meter\n- **Duration:** Lasts until stopped concentrating or for 1 hour.\n\n- **Effect:** \n\t- As the air vibrates with a cleansing energy as creatures of your choice within radius gain 10 * X Barrier (0) (if this barrier is halfed for one creature its halfed for all)\n\t- If X \u2265 15, the seal also protects against being Immobilised (0)  \n    \n\n#defensive \n#Level1 \n#earth\n#player_root\n#teamup\n\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/Team-up Moves/Glass Fruit Bending/FlashLemon Refractor Beam - Anju.md": {"size": 474, "type": "text", "text": "#Action\n#Reaction \n\nReaction: Must be initiated by a Firebender in line of sight \n\n#lingering_effect \n\nFocused light is amplified by mirrored shards into a blinding beam.\n- **Effect:** \n- Range: 10X meter radius Sphere\n- **Effect:** \n\t- Targets in area must make  a DC X * 2 Int (5) save to shield or close their eyes or be Blinded for one turn\n\t-  If X \u2265 10, Deal **Xd4 radiant damage** to all creatures in the area\n    \n\n\n#teamup\n#fire \n#earth\n#player_root\n#Level1 \n\n\n\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/Team-up Moves/Glass Fruit Bending/BlueBerry Glass Surge - Anju.md": {"size": 440, "type": "text", "text": "\n#Action\n#Reaction \n\nReaction: Must be initiated by a Waterbender in line of sight \n\nLingering Effect (0)\n\nStick and grow trapping enemies and reshaping the terrain.\n- Range: 2X meter radius Sphere\n\n- **Effects:** \n\t- Targets in area must make  a DCX * 2 Dex (1) save to jump aside or get Immobilised in cold soft and barely liquid Glass.\n\t- If X \u2265 8, brambles regenerate once if destroyed\n\n\n#Level1 \n#earth\n#water \n#player_root\n#teamup\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/Team-up Moves/Air-Earth/Sandstream - Anju.md": {"size": 396, "type": "text", "text": "\n#Action \n#Reaction \n\nEach Bender-decides to which pool to add their Bending slots:\n-  **Y**(Earth): Yd12 Damage per projectile\n- **X**(Air): X Projectiles Air Attack Roll (1d20 + 0 + 1)\n- **Range:** Y * X meters from the Airbender \n \n \n- One Earthbender shoots Y Sand Projectiles (rolls the Damage roll) and the Airbender controlls them to home to the X Targets)\n\n\n#Level1\n#air\n#earth\n#teamup\n\n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/Earth/mechanics/Earthbending Slot Progression - Anju.md": {"size": 305, "type": "text", "text": "\nYou have 2 \\* earth (1) Maximum Slots that are restored after about an hour of rest.\n\nYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\n- spend 2 and then 1 \n- spend 1 and then 2 or\n- spend 1 then 1 then 1 \n\n#earth \n#Level1 \n\n"}, "Player Root/PCs/Anju/Bending Rules - Anju/Earth/mechanics/Earthbending rules - Anju.md": {"size": 502, "type": "text", "text": "\n#### **Overview:**\n\nEarthbenders are solid and steadfast, drawing upon the Strength of their bodies and the stability of the ground beneath them. Their techniques focus on defense, fortification, and manipulating terrain. Rather than relying on agility to avoid blows, earthbenders create barriers, raise armor ratings, and reinforce their allies. They harness **Earth Charges** to shape stone and metal, providing a constant, reliable source of defense and stability.\n\n\n\n#player_root\n#earth\n#Level1 \n"},    - **Acute Senses:** Advantage on Perception checks that rely on sight or hearing.\n    - **Quick Escape:** Disengage or dash as a Bonus Action (0).\n- **Combat Stats (Flying Lemur):**\n    \n    - Evasion (11): 20\n    - HP: 6 (fragile but evasive).\n    - Attacks:\n        - **Razor Claws:** Melee Weapon Attack, d20 + Dex (1) to hit, 1d4 slashing damage.\n- **Uses:**  \n    Perfect for scouting, infiltration, or swift movement through difficult terrain. The form allows quick evasion and small-scale reconnaissance.\n\nBending Slots:\n\tAir Lvl1: 4\n\n\n#spirit  #Level1 #player_root\n\n#Level1\n#player_root\n#shapeshifting_form\n#spirit\n```\n\n"}, "Player Root/PCs/Ash/Bending Rules - Ash/Spirit/Spiritbending Moves/Level 1/Human Form - Ash.md": {"size": 160, "type": "text", "text": "```markdown\n#Action\n\nMahogany (0)\nSpecial Attacks (0)\n\n\n#spirit #Level1 #shapeshifting_form #player_root\n\n#Level1\n#player_root\n#shapeshifting_form\n#spirit\n```\n\n"}, "Player Root/PCs/Ash/Bending Rules - Ash/core rules/Concentration - Ash.md": {"size": 233, "type": "text", "text": "Con save DC of max(10, Damage Taken / 2)\nSome Moves require concentration to keep them up. If you take damage while concentrationg you have to make a Con (1) save with a DC of max(10, Damage Taken / 2)\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Ash/Bending Rules - Ash/core rules/Cluster - Ash.md": {"size": 247, "type": "text", "text": "#Collectionfile \nWhen a creature is standing within 1 meter of another creature it can get affected by some effects\n<!-- BEGIN-AUTO-COLLECTION:Cluster -->\n## Backlinks\n\n  ./\n\n<!-- END-AUTO-COLLECTION -->\n\n\n\n\n\n\n\n\n\n\n\n\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Ash/Bending Rules - Ash/core rules/Lingering Effect - Ash.md": {"size": 229, "type": "text", "text": "If not Specified otherwise, lingering effect last until the start of your next Turn.\nIf caused by a damaging Move: Every creature that ends its turn there will get half the original attacks Damage.\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Ash/Bending Rules - Ash/core rules/Bending Slots - Ash.md": {"size": 783, "type": "text", "text": "Airbending Slot Progression (0)\nFirebending Slot Progression (0)\nearthbending slot (0)\nWater Charges (0)\nSpiritbending Slot Progression (0)\n\nSlot progression rule: for a bending element at level N you receive slots distributed by slot level as follows \u2014 1 slot at level N, 2 slots at level N-1, 3 slots at level N-2, and so on down to N slots at level 1. In formula form: for each k from 1..N you get k slots of level (N+1-k).\n\nExamples:\n\n- Level 3 earthbender \u2192 1\u00d7 level 3, 2\u00d7 level 2, 3\u00d7 level 1.\n- Level 4 earthbender \u2192 1\u00d7 level 4, 2\u00d7 level 3, 3\u00d7 level 2, 4\u00d7 level 1.\n\nUse this rule to calculate and fill the table entries below. Only rows for elements with at least one slot are included to make tracking easier:\n\nNot for waterbenders\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Ash/Bending Rules - Ash/core rules/Movement - Ash.md": {"size": 71, "type": "text", "text": "**Movement per Round**:\n10 meters + air (0) Level * 3\n\n\n#player_root\n\n\n"}, "Player Root/PCs/Ash/Bending Rules - Ash/core rules/Short Rest - Ash.md": {"size": 81, "type": "text", "text": "You restore all your Hitpoints and Bending Slots\nPlayer Root (0)\n\n#player_root\n\n\n"}, "Player Root/PCs/Ash/Bending Rules - Ash/core rules/Manually Rolled Hitpoints - Ash.md": {"size": 32, "type": "text", "text": "\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Ash/Bending Rules - Ash/core rules/Ammunition - Ash.md": {"size": 169, "type": "text", "text": "If not Specified otherwise, Ammunition can be used by any character (if its logic :D)  as part of their Moves to enhance them creatively.\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Ash/Bending Rules - Ash/core rules/Conditions/unconscious - Ash.md": {"size": 32, "type": "text", "text": "\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Ash/Bending Rules - Ash/core rules/Conditions/Immobilised - Ash.md": {"size": 210, "type": "text", "text": "The creature can not move or be moved by force. Depending what causes Immobilisation you can save against it as an Action (0) or can remove it with your bending more efficiently.\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Ash/Bending Rules - Ash/core rules/Conditions/Slowed - Ash.md": {"size": 154, "type": "text", "text": "A slowed creatures Movement Speed is halved and it can not use any #Bonus_actions or #reactions. ( #Action (0) is allowed)\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Ash/Bending Rules - Ash/core rules/Conditions/Paralysed - Ash.md": {"size": 230, "type": "text", "text": "# Paralysis Mechanics\n\nCertain Chi Blocking moves cause paralysis, preventing the target from taking actions or bending for a specified duration.\n\n## Key Moves\n- Pressure Point Strike\n- Nerve Strike\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Ash/Bending Rules - Ash/core rules/Stat Shorts/Strength - Ash.md": {"size": 42, "type": "text", "text": "\nPlayer Root (0)\n#variable\n\n#player_root\n\n"}, "Player Root/PCs/Ash/Bending Rules - Ash/core rules/Stat Shorts/Hitpoints - Ash.md": {"size": 111, "type": "text", "text": "Very mandatory for living.\n\nMax Hitpoints (0)\nTemporary Hitpoints (0)\nPlayer Root (0)\n#variable\n\n#player_root\n\n"}, "Player Root/PCs/Ash/Bending Rules - Ash/core rules/Stat Shorts/Wisdom - Ash.md": {"size": 42, "type": "text", "text": "\nPlayer Root (0)\n#variable\n\n#player_root\n\n"}, "Player Root/PCs/Ash/Bending Rules - Ash/core rules/Stat Shorts/HP - Ash.md": {"size": 1034, "type": "text", "text": "#Collectionfile \nHitpoints\nWhen your HP (0) reach 0 you are unconscious (0) and bleeding out. \n\nOn your Turn you have to roll a death saving throw. \nIf you have 3 Successes you become stable and don't have to roll anymore.\nIf you h        value |\n| ------------ | ---------------: |\n| max_hp       |       90 |\n| current hp   |   90 |\n\n## Core Stats\n\n| Stat         |            Value |\n| ------------ | ---------------: |\n| Strength     |     1 |\n| Dexterity    |    7 |\n| Constitution | 1 |\n| Intelligence | 3 |\n| Wisdom       |       3 |\n| Charisma     |     3 |\n\n## Bending Levels\n\nTotal Bending Level: 3\nDamage Dice Bonus: 0\n\n| Element |      Level | Attack Roll            | DC                   |\n| ------- | ---------: | ---------------------- | -------------------- |\n| Air     |    2 | 1d20 + 2 + 7    | 19    |\n| Earth   |  1 | 1d20 + 1 + 1  | 12  |\n|         |            |                        |                      |\n## Defensive\n\n| key           |              Base | Bonus |\n| ------------- | ----------------: | ----- |\n| Evasion       |       19 | 0     |\n| General Armor | 1 | 0     |\n\n\n## Bending Slots\nYou can always only use maximum half of you current Bending slots (rounded up so if you have 3 left you can either spend 2 and then 1 or only 1 but 3 times)\n\n| Slot                   |                    Amount |\n| ---------------------- | ------------------------: |\n| Airbending slot        |       4 |\n| Danger Sense Reactions | 2 |\n| Earthbending slot      |     2 |\n\n## Water charges\n\n| Environmental Variable     |                          value |\n| -------------------------- | -----------------------------: |\n| Environmental water charge | 11 |\n\n\n#Tapioca #Character_Sheet\n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/Utility - Tapioca.md": {"size": 130, "type": "text", "text": "\nThese Moves can be used without expending slots (and meant for usage out of combat)\n\n\n#Level1 \n#air #earth #fire #spirit #water \n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/core rules/Movement - Tapioca.md": {"size": 71, "type": "text", "text": "**Movement per Round**:\n10 meters + air (2) Level * 3\n\n\n#player_root\n\n\n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/core rules/Ammunition - Tapioca.md": {"size": 169, "type": "text", "text": "If not Specified otherwise, Ammunition can be used by any character (if its logic :D)  as part of their Moves to enhance them creatively.\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/core rules/Bending Slots - Tapioca.md": {"size": 783, "type": "text", "text": "Airbending Slot Progression (0)\nFirebending Slot Progression (0)\nearthbending slot (2)\nWater Charges (0)\nSpiritbending Slot Progression (0)\n\nSlot progression rule: for a bending element at level N you receive slots distributed by slot level as follows \u2014 1 slot at level N, 2 slots at level N-1, 3 slots at level N-2, and so on down to N slots at level 1. In formula form: for each k from 1..N you get k slots of level (N+1-k).\n\nExamples:\n\n- Level 3 earthbender \u2192 1\u00d7 level 3, 2\u00d7 level 2, 3\u00d7 level 1.\n- Level 4 earthbender \u2192 1\u00d7 level 4, 2\u00d7 level 3, 3\u00d7 level 2, 4\u00d7 level 1.\n\nUse this rule to calculate and fill the table entries below. Only rows for elements with at least one slot are included to make tracking easier:\n\nNot for waterbenders\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/core rules/Concentration - Tapioca.md": {"size": 233, "type": "text", "text": "Con save DC of max(10, Damage Taken / 2)\nSome Moves require concentration to keep them up. If you take damage while concentrationg you have to make a Con (1) save with a DC of max(10, Damage Taken / 2)\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/core rules/Lingering Effect - Tapioca.md": {"size": 229, "type": "text", "text": "If not Specified otherwise, lingering effect last until the start of your next Turn.\nIf caused by a damaging Move: Every creature that ends its turn there will get half the original attacks Damage.\nPlayer Root (0)\n\n#player_root\n\n"}
