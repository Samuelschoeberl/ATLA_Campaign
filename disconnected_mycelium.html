r homes, unsettling livestock, and\u2014most concerning\u2014fixating on a curious village child who watches him from the rooftops.\n\n---\n\n#### The Spirit's Condition\n\n- **Hunger**: His appetite has deepened unnaturally, driven not just by physical need but spiritual imbalance due to a stolen object \u2014 the [[Resonance Stone]].\n    \n- **Mood Swings**: Villagers report rapid mood shifts \u2014 playful illusions one moment, threatening flares the next.\n    \n- **Recent Event**: A stranger arrived a week ago and offered Raza'tel fresh meat, buying the village some time. But no one knows who the stranger was or where they went.\n    \n\n---\n\n#### Quest Hook\n\nWhen the party meets Raza'tel, he coils above a cracked cliff-ledge, glowing eyes half-lidded, tail slowly rattling with bursts of white light.\n\n**Raza'tel\u2019s Bargain:**\n\n> \u201cYes, I have the gleaming heart \u2014 your so-called Resonance Stone. But I trade not in trinkets. I am hungry. Five Chameleonrats. Big ones. Laced with fear. Bring them, and the stone is yours.\u201d\n\n- He will only repeat the offer once.\n    \n- He expresses clear temptation about \"sampling the shiny child who stares at stars,\" and notes with eerie amusement that the child \"tastes like curiosity.\"\n    \n\n**Reward:**\n\n- If the party brings him **5 freshly slain Chameleonrats**, he will lead them to a hidden crystal cavern where he has hidden the [[Resonance Stone]] \u2014 an ancient artifact humming with harmonic energy.\n    \n\n---\n\n#### Optional Outcomes:\n\n- **Violence Option**: Killing Raza'tel will collapse the protective veil around Sekan\u2019to, inviting both spirit-world predators and mortal looters.\n    \n- **Deception Option**: Trying to trick Raza'tel with false prey may work once, but he will mark the deceiver with a **Curse of Light** \u2014 a glow visible to spirits from the Spirit World.\n    \n- **Bonding Option**: Feeding him well over time (or helping solve his imbalance via the Resonance Stone) can win his long-term loyalty.\n    \n\n---\n\n### \ud83d\udcc4 [[Chameleonrats]]\n\n**Description:**  \nWolf-sized rodents with scaly patches and natural cloaking ability. Known to hunt in packs and ambush CowMoles by mimicking the canyon rockface.\n\n- **Abilities:**\n    \n    - **Camouflage Ambush** \u2013 Cannot be detected unless moving (DC 17 Perception)\n        \n    - **Pack Howl** \u2013 When two or more are nearby, gain advantage on attack rolls\n        \n    - **Spined Tails** \u2013 Defensive whip-tails inflict bleeding (1 dmg per turn)\n        \n\n**Habitat:**  \nThe shadowed rifts beyond Sekan\u2019to, especially the **Gloaming Slabs** and **Burrow Maze Ridge**.\n\n**Challenge:**  \nHunting five is no easy task \u2014 they often flee into sheer drops or lure pursuers into deadfalls.\n\n---\n\n### \ud83d\udcc4 [[Resonance Stone]]\n\n**Type:** Spiritual Keystone  \n**Function:** Tunes and stabilizes the harmonic link between the Spirit World and Sekan\u2019to.  \n**Appearance:** A hexagonal, color-shifting crystal that emits pure harmonic tones when held.\n\n- **Current Status:** Stolen by the [[Black Lotus]] \u2014 a secretive organization dabbling in spirit-binding and energy extraction.\n    \n- **Raza'tel's Involvement:** He stole it back from the Lotus during a raid, hiding it in his lair. He doesn't want to part with it, but his hunger overrides his caution."}, "Dms Root/Locations/Sekanto/Kael & Lira of Sekan'to \u2013 The Gleam-Twin Benders.md": {"size": 2358, "type": "text", "text": "\n\n**Overview:**  \nTwin siblings from Sekan\u2019to whose seamless coordination has turned their unique dual-element fusion into an art form. They\u2019re local legends among younger benders and are being watched closely by the [[Crystalfire Circle]].\n\n---\n\n#### \ud83d\udc66 Kael (Older Twin, Firebender)\n\n- **Element:** Fire\n    \n- **Personality:** Outgoing, reckless, theatrical; deeply protective of Lira\n    \n- **Style:** Sharp, focused flame that arcs like a laser through mirrored crystals\n    \n- **Role:** Offensive striker and flare tactician\n    \n\n---\n\n#### \ud83d\udc67 Lira (Younger Twin, Earth/Crystalbender)\n\n- **Element:** Crystal Earthbending\n    \n- **Personality:** Reserved, focused, analytical; handles all structural control\n    \n- **Style:** Forms and shapes a mirror-like mineral coating (called _Shinestone_) over crystals\n    \n- **Role:** Light-focus engineer and illusion architect\n    \n\n---\n\n### \ud83d\udd2e **Twin Bending Style: Gleam-Fusion Technique**\n\nA high-discipline technique that combines Kael\u2019s fire precision with Lira\u2019s crystal-light manipulation. It centers around _Shinestone Mirrors_, crystal structures polished to perfection to reflect and concentrate light and flame.\n\n---\n\n#### \ud83d\udca5 **Signature Moves**\n\n- **Prism Lance** \u2013 Kael fires a narrow beam of fire into a floating Shinestone prism shaped by Lira, focusing it into a searing beam of pure light/fire that can pierce armor.\n    \n- **Radiant Spiral Web** \u2013 Lira surrounds an area with mirrored crystals while Kael spins flame between them, creating a dazzling maze of reflected fire that disorients enemies.\n    \n- **Blinding Crossflare** \u2013 Using mirrored arcs above and below, Kael and Lira bounce fire and light until it erupts in a precise, disorienting flash.\n    \n- **Shinestone Mirage** \u2013 Lira uses her mirrors to bend light around the twins, creating realistic illusory doubles mid-combat.\n    \n\n---\n\n#### \ud83e\udded **Role in the Campaign**\n\n- **Potential Allies:** Could aid the party in overwhelming light-based battle situations or lead a training session in combined techniques.\n    \n- **Optional NPC Quest Givers:** May seek the party's help to retrieve a _Shinestone Core_ from a collapsing canyon mine.\n    \n- **Narrative Flavor:** Their deep sibling bond serves as a counterpoint to unstable spirits like [[Raza'tel]] or morally gray groups like the [[Black Lotus]]."}, "Dms Root/Locations/Misty Palms Oasis/Hook Find the One Who Still Believes.md": {"size": 8294, "type": "text", "text": "\n\nThe shimmering goldfish poop, once dismissed, is now **reacting** \u2014 humming faintly, vibrating when close to sacred texts or old chanting bowls in the temple. A monk, once skeptical, nervously confesses:\n\n> \"_There was\u2026 someone who always believed. The High Priest. Master Anzu._  \n> He was banished to the temple archives after\u2026 well, too many sermons about invisible fish.*\"\n\n---\n\n### \ud83c\udfdb\ufe0f Act I: Finding Master Anzu\n\nThe party must explore the **forbidden lower sanctum** of the temple \u2014 a quiet, echoing archive of moldy scrolls, broken water clocks, and fish-shaped relics. Deep within, they find **Master Anzu**:\n\n- A thin, ancient man with **big watery eyes**, speaking in **half-poetry and full riddles**\n    \n- Surrounded by aquariums full of **no fish** \u2014 only reflections and bubbles\n    \n- He **talks to the goldfish regularly**, but admits \u201c_She\u2019s shy. She only appears when you aren\u2019t looking._\u201d\n    \n\n---\n\n### \ud83d\udcdd Act II: The Limerick\n\nAmong the scrolls, Anzu recites an **ancient limerick** he once found inscribed on a scale made of gold-leafed spiritglass:\n\n---\n\n### \ud83d\udcdc The Goldfish Limerick\n\n> _In stillest of ponds where no ripples are seen,_  \n> _She darts through the veil where no spirit has been._  \n> _She poops like a comet, unseen in her wake,_  \n> _And sleeps in the world where dreams do not break._  \n> _To find her, dear seeker, don't look but just feel\u2014_  \n> _For goldfish are truth, and their silence is real._\n\n---\n\n### \ud83e\udde9 Interpretation (What Anzu Knows)\n\n- The Goldfish **fazes between the Spirit World and the Material** based on emotional triggers \u2014 fear, serenity, hunger, embarrassment.\n    \n- She is drawn to **stillness**, **reflection**, and **honest curiosity**.\n    \n- Her poop only appears when she phases improperly \u2014 a symptom of imbalance between the realms.\n    \n- She once had **a mirror-lake shrine**, far from the temple, where the veil was thin and she could swim freely.\n    \n- Anzu believes the party can **recreate the conditions** to lure her back temporarily.\n    \n\n---\n\n### \ud83d\udc3e Next Steps / Quest Objectives\n\n1. **Recreate the Still Pond:**\n    \n    - Find or build a water basin with perfect stillness (no wind, noise, light)\n        \n    - Must be placed in a high-spirit resonance area (Anzu knows of one \u2014 the **Mirror Hollow**)\n        \n2. **Use the Poop (yes, really):**\n    \n    - The poop fragment is a **spiritual scent marker** \u2014 burn it as incense during the ritual to open the veil\n        \n3. **Avoid looking directly at the fish** \u2014 this causes her to retreat. Players must instead **perceive her via reflections**, **ripples**, or through **mirrors held backwards**.\n    \n4. **If successful**, the fish may:\n    \n    - Grant a **blessing** (invisibility, silent movement, spirit-sight)\n        \n    - Reveal the location of a hidden **artifact** (maybe another Resonance Stone?)\n        \n    - Simply leave behind **another poop**\u2026 but now it\u2019s **glowing with spiritual energy** and can be used to **track spirit movements** like a compass\n    - \n## \ud83d\udc1f **Still Ear, Truth Clear**\n\n_Advanced Spiritual Airbending Technique_  \n**Prerequisite:** Training in Airbending (even basic level), spiritual sensitivity, and a connection to the [[Invisible Goldfish Spirit]]  \n**Learned from:** Master Anzu\u2019s teachings and meditation upon the Limerick\n\n---\n\n### \u2728 Description:\n\nBy entering a state of deep meditation and tuning out all worldly sound, the Goldfish Priest reaches a state of **resonant stillness**. In this space, she poses questions not with voice, but with **thoughts shaped like ripples** \u2014 gentle vibrations of intent across the boundary between worlds.\n\nIn response, the **Invisible Goldfish Spirit** answers not with words, but with the **presence or absence of a single \"blub\"** in the ear of the priest. No one else can hear it.\n\n---\n\n### \ud83e\uddd8\u200d\u2640\ufe0f Mechanics:\n\n**[[Action]] Type:** Special Ritual [[Action]] (requires 1 uninterrupted minute of focus)\n\n**Check:** Roll a **Religion (or Spirit) check**, DC = 12 + number of times used today\n\n- You may only ask **1 question per successful check**\n    \n\n**Rules for Questions:**\n\n- Must be phrased in a **Yes/No format**\n    \n- Must be **genuinely introspective or spiritually oriented** (not \"What\u2019s 2+2?\")\n    \n- The answer comes **as a sensation, not a sound**:\n    \n    - **No Blub = YES**\n        \n    - **Blub = NO**\n        \n\n> _(The GM determines the answer truthfully, according to what the goldfish would know spiritually.)_\n\n---\n\n### \ud83c\udf00 Enhancements / Level Ups\n\nAs the Goldfish Priest deepens their connection, the ability can evolve:\n\n#### \ud83c\udf2c\ufe0f **Level 2 \u2013 Ripple Reading**\n\nOn a successful check, the priest can ask **2 yes/no questions** in a single ritual.\n\n#### \ud83c\udf0a **Level 3 \u2013 Spirit Echo Clarity**\n\nOnce per day, the priest can **automatically succeed** on the check and get a brief **vision or emotional impression** along with the blub/no-blub (GM\u2019s choice).\n\n#### \ud83c\udf90 **Level 4 \u2013 Silent Chorus**\n\nWhile meditating in a naturally silent location (e.g. Mirror Hollow), the priest can allow **one other person to share the ritual** and ask a question as well \u2014 but only the priest will \u201chear\u201d the answer.\n\n---\n\n### \ud83e\udde9 Narrative Uses:\n\n- Discover hidden spiritual truths (\"Is there a spirit watching us?\")\n    \n- Test moral/spiritual judgments (\"Did we choose the right path?\")\n    \n- Detect lies from other spirit beings (\"Is this spirit telling the truth?\")\n    \n- Feel for portals, veils, or corrupted energies (\"Is the balance broken here?\")\n    \n\n---\n\n\n---\n\n## \ud83d\udcdc Limerick #1 \u2013 _\u201cThe Golden Scent\u201d_\n\n> _A shimmer, a scent in the air,_  \n> _From a gift left behind with great care._  \n> _Though humble its form,_  \n> _It shifts spirit and norm,_  \n> _And opens the veil with a prayer._\n\n---\n\n## \ud83d\udcdc Limerick #2 \u2013 _\u201cBlaze of the Blub\u201d_\n\n> _When silence and stillness align,_  \n> _And poop becomes truly divine,_  \n> _Then burneth the gold,_  \n> _For the pathways unfold,_  \n> _And spirit and seeker entwine._\n\n---\n\n## \ud83d\udcdc Limerick #3 \u2013 _\u201cBurn, O Holy Pellet\u201d_\n\n> _Burn, O holy pellet so faint,_  \n> _Though most would dismiss with complaint,_  \n> _It draws back the tide,_  \n> _Where the shy fish doth hide,_  \n> _In places the bold dare not paint._\n\n---\n\n## \ud83d\udcdc Limerick #4 \u2013 _\u201cThe Temple Fume\u201d_\n\n> _When the fish leaves a mark on the floor,_  \n> _Do not clean \u2014 it\u2019s a key to the door._  \n> _Light incense with care,_  \n> _Let the spirit draw near,_  \n> _And you'll swim where the world touches more._\n\n---\n\n## \ud83c\udfad Usage in Game:\n\n- These can be used as **ritual verses** the character must recite while performing the incense ceremony.\n    \n- Master Anzu may **only remember part of the limerick**, and the players must recover missing lines.\n    \n- One limerick might be written **in the margins of a water-damaged scroll**, adding to the mystery.\n\n\n# _Scene: before sunrise, smoky ruins of a cactus juice distillery. \n\n\nThe air is thick with dew, ash, and just a hint of fermented regret. Master Anzu, eyes wide and glistening, kneels over charred stone, holding up a soot-smudged scroll as the sunrise reflects in his watery eyes._\n\"_...Do you smell that? Not the smoke. Not the fermented sin still clinging to the sand._  \n_No... it's the scent of secrets._  \n_(he raises the scroll gently, reverently)_  \n_Buried beneath a vat of distilled foolishness... lay the truth._\n\n_(clears throat)_  \n'When the moon reflects with no moon to see,  \nAnd silence moves where sound should be,  \nThe swimmer glides in sacred hush\u2014  \nA ripple born from temple\u2019s blush.'\n\n_(he pauses, the scroll trembles in his hands)_  \nIt speaks of her. The One Between Currents.  \nNot just fable, not just fish.  \nThis text\u2014this... **Scripture of the Silted Gills**\u2014it was lost when the archives collapsed in the Flood of Tea. They said it was nonsense. Poetry.\n\nBut now\u2026 NOW\u2026!  \n_By the blessed bladder of the Desert Carp!_  \nThis explosion\u2014this blessed, bubbling, bone-shaking _boom_\u2014has unearthed what no scholar would dare admit:\n\n**The goldfish was never gone. She was only waiting... for the distillery to ignite.**\n\n_(he looks around dramatically)_  \nCall it fate. Call it fermentation.  \nBut this\u2026 this is providence.*\""}, "Dms Root/Locations/Akara VIllage/Glacial Temple.md": {"size": 1024, "type": "text", "text": "### [[Glacial Temple]]\n\n**Purpose:** Spiritual sanctuary and waterbender training ground  \n**Architecture:** A glimmering structure partially embedded in ice, with prayer flags fluttering around open, steam-warmed courtyards.\n\n**Lore:**  \nBuilt above the [[Healing Spring of Akara]], the Glacial Temple is both a spiritual hub and defensive bastion. It\u2019s home to the Order of the Veiled Mist, a sect of waterbenders trained in [[Players Part/Rules/Bending Rules/Water/Waterbending Moves/Cantrips/Mistbending]] \u2014 a sacred technique taught only to those deemed spiritually attuned by the [[Jellytee Spirit]].\n\nAccess to the temple is restricted. Pilgrims may offer prayers at the base, but only those with permission from the High Acolyte may enter the inner sanctum or take water directly from the spring.\n\n**Temple Customs:**\n\n- No artificial fire within the inner sanctum.\n    \n- Offerings must include a piece of handwoven fabric dipped in the spring.\n    \n- All initiates take a vow of vapor \u2014 a month-long silence."}, "Dms Root/Locations/Akara VIllage/Jellytee Spirit.md": {"size": 576, "type": "text", "text": "\n**Form:** A luminescent, ethereal fusion of jellyfish and manatee. It drifts through the spring, emitting soft pulses of bioluminescence and humming vibrations.  \n**Nature:** Benevolent but sensitive to imbalance and greed. When pleased, it radiates a mist that calms the mind and heals minor ailments. When disturbed, the mist becomes turbulent and can induce hallucinations or intense emotional episodes.\n\n\n\nVery emotionally unstable and the waterbenders have to be super careful not to disturb the water as the manatee starts to cry and throw a tantrum when they do.\n\n---\n"}, "Dms Root/Locations/Akara VIllage/Healing Spring of Akara.md": {"size": 463, "type": "text", "text": "\n**Properties:**  \nThe water is infused with natural and spiritual properties, accelerating healing, soothing pain, and purging spiritual corruption. However, overuse or removal of too much water causes the spring to become turbulent and the [[Jellytee Spirit]] to grow agitated.\n\n**Limits:**\n\n- Only a limited volume can be extracted per day.\n    \n- Excessive exposure can dull pain but doesn\u2019t cure deeper ailments unless sanctioned by the temple.\n    \n\n---\n\n"}, "Dms Root/Locations/Akara VIllage/Village of Akara.md": {"size": 2992, "type": "text", "text": "\n\n**Location:** Southern Water Tribe tundra, near the [[Glacial Temple]]  \n**Population:** ~150 permanent residents, swelling with visitors year-round  \n**Notable Feature:** The [[Healing Spring of Akara]], which emits a continuous healing mist due to the presence of the [[Jellytee Spirit]]\n\n**Description:**  \nAkara is a quiet, snow-dusted village nestled against a glacial ridge. Built in concentric circles around the [[Healing Spring of Akara]], the town's layout reflects the cultural importance of balance and flow. Small wooden homes carved with oceanic motifs cluster closer to the spring, with larger communal and guest housing further out.\n\nThe village has become a sacred pilgrimage site for the chronically ill, terminally afflicted, and spirit-touched. While the [[Healing Spring of Akara]]'s waters are said to be miraculous, the villagers are extremely cautious in how much water they allow to be drawn, in reverence to the [[Jellytee Spirit]].\n\n**Key NPCs:**\n\n- **High Acolyte Siva:** Stoic leader of the temple, acts as intermediary between villagers and the [[Jellytee Spirit]].\n    \n- **Healer Rokan:** Master of the [[Players Part/Rules/Bending Rules/Water/Waterbending Moves/Cantrips/Mistbending]] technique, teaches selected apprentices.\n    \n- **Elder Tumaq:** Village elder, keeper of oral history and taboos.\n    \n\n---\n\n\n\n\n---\n\nWould you like to expand this into a quest hook, adventure arc, or introduce tensions like outsiders exploiting the spring?\n\n##### You said:\n\ngreat now also add a little monplogue of the jellytee spirit. It is super whinie and moody and cries when water gets removed\n\n###### ChatGPT said:\n\nPerfect! Here\u2019s a whimsical and moody monologue from the [[Jellytee Spirit]], capturing its overly emotional, whiny personality. This could be delivered during a vision in the mist or heard echoing through the spring when someone tries to take more than their share of water:\n\n---\n\n### [[Monologue of the Jellytee Spirit]]\n\n> _The mist thickens. Light pulses softly from below the water. A voice, melodious yet dripping with exaggerated sorrow, rings out through the temple\u2019s chamber..._\n\n**\"Oooohhh noooo... not agaaaain... why must you _always_ take? I _just_ got the spring balanced. My nerves\u2014my poor, fluttery nerves! You don\u2019t understand how hard it is to keep the mist pretty and shimmery when you\u2019re all down here sloshing and scooping like hungry pelicans!\"**\n\n**\"Do you know what it\u2019s like to live in a sacred spring? It\u2019s _cold_, it's _bright_, and people are _always touching stuff_. I\u2014we\u2014me! I need peace! And you\u2014you greedy water-sucking little surface-crawlers\u2014never think about _me!_\"**\n\n**(_sniffs dramatically, bubble trails forming in the water_)**\n\n**\"Fine. Take a few drops, go ahead. It\u2019s not like _I_ matter. Just the ancient sacred spirit who lives in this place. That\u2019s fine. That\u2019s totally fine.\"**\n\n**(_beat_)**\n\n**\"...But if you take more than one flask I _will_ emotionally devastate you.\"**"}, "Dms Root/Locations/ideas/air/airbending villages ideas.md": {"size": 5907, "type": "text", "text": "\n---\n\n## [[Stonevine Hollow]]\n\n**Environment:**\u00a0Subterranean jungle cave system  \n**Specialized Style:**\u00a0**Vinegrasp Bending**  \n**Description:**  \nStonevine Hollow is hidden deep beneath the surface in a lush cave network where glowing fungi and creeping vines dominate the stone landscape. The villagers have developed\u00a0**Vinegrasp Bending**, a technique that integrates earthbending with plant interaction. Benders here can manipulate soil and roots in tandem, weaving vines through stone or using soil nutrients to rapidly grow roots as whips, restraints, or bridges. They value patience and symbiosis, with their bending resembling a slow but overwhelming encroachment.\n\n**Key Techniques:**\n\n- **Root Snare:**\u00a0Erupts tangled roots from the soil to bind enemies.\n    \n- **Fungal Bloom:**\u00a0Encourages explosive growth of bioluminescent fungi to blind foes or light paths.\n    \n- **Symbiotic Armor:**\u00a0Covers the bender in flexible bark-like plating drawn from surrounding flora.\n    \n\n---\n\n## [[Ashen Steppes]]\n\n**Environment:**\u00a0Volcanic plains and hardened lava flows  \n**Specialized Style:**\u00a0**Magma Pulse Bending**  \n**Description:**  \nBuilt on a cooled lava plateau, Ashen Steppes is a hardy settlement that thrives amidst ash and fire. Their benders have developed\u00a0**Magma Pulse Bending**, a high-heat technique that focuses on heating and liquifying stone momentarily to create bursts of molten rock or steam-based propulsion. It\u2019s more aggressive and volatile than traditional earthbending, with a focus on explosive, short-range attacks and reshaping brittle volcanic stone mid-combat.\n\n**Key Techniques:**\n\n- **Lava Flare:**\u00a0Melts a small patch of ground into a geyser of magma.\n    \n- **Obsidian Shardstorm:**\u00a0Shatters cooled lava into razor-sharp fragments hurled at foes.\n    \n- **Ash Drift:**\u00a0Uses heated air and ash for sudden propulsion or smokescreen escapes.\n    \n\n---\n\n## [[Whispering Mesa]]\n\n**Environment:**\u00a0Wind-carved sandstone cliffs and canyons  \n**Specialized Style:**\u00a0**Echoform Bending**  \n**Description:**  \nPerched atop labyrinthine mesas where the wind never stops howling, Whispering Mesa is home to benders who\u2019ve mastered\u00a0**Echoform Bending**\u2014a refined technique that utilizes sound vibrations and seismic pulses through brittle stone. They focus on precision, using thin slices, tremor sense, and harmonic resonance to create unstable conditions underfoot or launch sonic-reinforced projectiles.\n\n**Key Techniques:**\n\n- **Resonant Blade:**\u00a0Vibrates stone into a cutting edge capable of slicing metal.\n    \n- **Tremor Veil:**\u00a0Distorts local vibrations to confuse tremor-sensing enemies.\n    \n- **Echo Step:**\u00a0Propels the user forward using a precisely timed ground pulse.\n    \n\n---\n\nWould you like me to create adventure hooks or NPCs tied to these villages?\n\n##### You said:\n\ngreat now do the same for airbender villages\n\n###### ChatGPT said:\n\nHere are three distinct\u00a0**Airbender villages**, each shaped by their unique environments and showcasing specialized Airbending styles that reflect their culture and surroundings:\n\n---\n\n## [[Zephyr\u2019s Climb]]\n\n**Environment:**\u00a0High-altitude glacier peak  \n**Specialized Style:**\u00a0**Stillwind Bending**  \n**Description:**  \nZephyr\u2019s Climb is nestled in the razor-thin air of a mountain range\u2019s highest glacier, where silence and stillness are paramount for survival. The airbenders here have developed\u00a0**Stillwind Bending**, a meditative form that emphasizes control of minute air currents and micro-movements. This precision-based style allows benders to manipulate even the most stagnant air to create silence zones, control breath patterns, and maintain balance on windswept peaks.\n\n**Key Techniques:**\n\n- **Silent Gale:**\u00a0Dampens all nearby sound by stabilizing air pressure and movement.\n    \n- **Breath Cloak:**\u00a0Controls respiration and surface-level air to become undetectable to heat or motion sensors.\n    \n- **Frozen Drift:**\u00a0Uses fine gusts to levitate lightly over snow without leaving prints or triggering avalanches.\n    \n\n---\n\n## [[Hollow Reeds]]\n\n**Environment:**\u00a0Floating reed islands in a vast foggy marsh  \n**Specialized Style:**\u00a0**Reedflow Bending**  \n**Description:**  \nHollow Reeds is a nomadic, waterbound community drifting through an enormous marsh where visibility is low and navigation is based on air and scent. The benders here created\u00a0**Reedflow Bending**, a fluid, serpentine style that emulates the winding patterns of wind through wetland reeds. This style excels at low-altitude flight, air scent-tracking, and creating confusing, humid mirages using moisture-laden gusts.\n\n**Key Techniques:**\n\n- **Mist Spiral:**\u00a0Twists warm air and fog into a smothering vortex that obscures vision and sound.\n    \n- **Scent Echo:**\u00a0Carries specific smells on wind currents for tracking or signaling.\n    \n- **Whispering Drift:**\u00a0Glides just above water without causing ripples, ideal for stealth and scouting.\n    \n\n---\n\n## [[Crimson Sails]]\n\n**Environment:**\u00a0Roaming cliffside windships on desert thermals  \n**Specialized Style:**\u00a0**Thermal Riding**  \n**Description:**  \nCrimson Sails is not a stationary village but a mobile flotilla of wind-powered skiffs and gliders that ride the desert\u2019s fierce thermals between cliff plateaus. The benders here specialize in\u00a0**Thermal Riding**, an acrobatic and speed-focused airbending style that manipulates vertical drafts and uses heat differentials to soar at high speeds. Their combat relies on divebomb maneuvers, sudden bursts of updrafts, and redirecting hot air from desert stones.\n\n**Key Techniques:**\n\n- **Updraft Spear:**\u00a0Condenses a vertical wind column to launch people or objects skyward.\n    \n- **Searing Glide:**\u00a0Uses heat rising off hot stone to gain lift or deflect projectile attacks.\n    \n- **Cyclone Lance:**\u00a0A spinning, high-speed dive with piercing air pressure, used in aerial jousts.\n    \n\n---\n\n"}, "Dms Root/Locations/ideas/earth/earthbending village ideas.md": {"size": 2490, "type": "text", "text": "[[Stonevine Hollow]]\nEnvironment: \nSubterranean jungle cave system\nSpecialized Style: \nVinegrasp BendingDescription:\nStonevine Hollow is hidden deep beneath the surface in a lush cave network where glowing fungi and creeping vines dominate the stone landscape. The villagers have developed Vinegrasp Bending, a technique that integrates earthbending with plant interaction. Benders here can manipulate soil and roots in tandem, weaving vines through stone or using soil nutrients to rapidly grow roots as whips, restraints, or bridges. They value patience and symbiosis, with their bending resembling a slow but overwhelming encroachment.Key Techniques:Root Snare: Erupts tangled roots from the soil to bind enemies.Fungal Bloom: Encourages explosive growth of bioluminescent fungi to blind foes or light paths.Symbiotic Armor: Covers the bender in flexible bark-like plating drawn from surrounding flora.\n\n[[Ashen Steppes]]\nEnvironment: \nVolcanic plains and hardened lava flowsSpecialized Style: Magma Pulse BendingDescription:\nBuilt on a cooled lava plateau, Ashen Steppes is a hardy settlement that thrives amidst ash and fire. Their benders have developed Magma Pulse Bending, a high-heat technique that focuses on heating and liquifying stone momentarily to create bursts of molten rock or steam-based propulsion. It\u2019s more aggressive and volatile than traditional earthbending, with a focus on explosive, short-range attacks and reshaping brittle volcanic stone mid-combat.\nKey Techniques:\nLava Flare:\nMelts a small patch of ground into a geyser of magma.\nObsidianShardstorm: \nShatters cooled lava into razor-sharp fragments hurled at foes.\nAsh Drift: \nUses heated air and ash for sudden propulsion or smokescreen escapes.\n\n[[Whispering Mesa]]\nEnvironment: \nWind-carved sandstone cliffs and canyons\nSpecialized Style:\nEchoform Bending Description:\nPerched atop labyrinthine mesas where the wind never stops howling, Whispering Mesa is home to benders who\u2019ve mastered Echoform Bending\u2014a refined technique that utilizes sound vibrations and seismic pulses through brittle stone. They focus on precision, using thin slices, tremor sense, and harmonic resonance to create unstable conditions underfoot or launch sonic-reinforced projectiles.\nKey Techniques:\nResonant Blade: Vibrates stone into a cutting edge capable of slicing metal.\nTremor Veil: Distorts local vibrations to confuse tremor-sensing enemies.\nEcho Step: Propels the user forward using a precisely timed ground pulse."}, "Dms Root/Locations/Omashu/Glassfang stats.md": {"size": 4118, "type": "text", "text": "## Baezu \u2013 Earthbender Master of Resonance\n\n**Role:** Boss \u2013 Controller, Support, Spiritual Conduit  \n**Initiates:** \u26aa Soulseed Harmonic Seal, \ud83d\udfe2 BlueBerry Surge\n\n---\n\n### **Stats**\n\n- **HP:** 110\n    \n- **Armor:** 3\n    \n- **Earthbending Level:** 7\n    \n- **Speed:** Slow 4m\n    \n\n\n### **actions per Round:** 2 (Legendary Bender)\n\n---\n\n### **Abilities**\n\n#### \u25aa\ufe0f **Earth Anchor (Passive)**\n\nCannot be forcibly moved or knocked prone while touching stone. \nHas advantage on Concentration Checks\n\n#### \u25aa\ufe0f **Seismic Meditation ([[Bonus Action]])**\n\nRegain 1 bending slot if standing still for the round.\n\n---\n\n### **Techniques**\n![[Glassfruit Seed Mechanics]]\n\n    \n\n\n#### \u270b **Harmonic Command (Support)**\n\n[[Bonus Action]]: another Crystalfang bender may immediately act using 1 technique as a **[[Reaction]]**\n\n---\n\n## \ud83d\udd25 Siroh \u2013 Firebender Glassforger\n\n**Role:** Blaster, AoE Control  \n**Initiates:** \ud83d\udd34 Inferno Bloom, \ud83d\udfe1 FlashLemon Beam\n\n---\n\n### **Stats**\n\n- **HP:** 60\n    \n- **Armor:** 1\n    \n- **Chi Slots:** 4\n    \n- **Speed:** Normal\n    \n- **Weaknesses:** Cold, Waterbending\n    \n\n### **Bending Slots:** 3\n\n### **actions per Round:** 1\n\n---\n\n### **Abilities**\n\n#### \u25aa\ufe0f **Overheat Spark (Passive)**\n\nWhen using a Fire-based team-up, add +1 to total X\n\n#### \u25aa\ufe0f **Flashcore Mantle (1x/day)**\n\nCreate a cloak of glowing crystals \u2013 gain resistance to radiant damage for 2 rounds\n\n---\n\n### **Techniques**\n\n#### \ud83d\udd34 **Inferno Bloom (X = y \u00d7 z)**\n\nInitiates with any bender\n\n- Explosive AoE, 2m \u00d7 X radius\n    \n- Damage: Xd6 bludgeoning + half fire\n    \n\n#### \ud83d\udfe1 **FlashLemon Refractor Beam (X = y \u00d7 z)**\n\nInitiates with Air or Earthbender\n\n- Cone: 10m \u00d7 X\n    \n- Blind + Xd8 radiant to primary target\n    \n- Enemies save INT vs DC X\u00d72\n    \n\n---\n\n## \ud83d\udca8 Orhu \u2013 Airbender Harmonic Duelist\n\n**Role:** Support, Disruption  \n**Initiates:** \ud83d\udca8 Resonant Collapse, \ud83d\udfe1 FlashLemon Beam\n\n---\n\n### **Stats**\n\n- **HP:** 55\n    \n- **Armor:** 0\n    \n- **Chi Slots:** 3\n    \n- **Speed:** Fast (9m), ignores terrain\n    \n- **Weaknesses:** Slashing/Heavy weapon attacks\n    \n\n### **Bending Slots:** 2\n\n### **actions per Round:** 1\n\n---\n\n### **Abilities**\n\n#### \u25aa\ufe0f **Windstep (Passive)**\n\nTakes no opportunity attacks while moving\n\n#### \u25aa\ufe0f **Glider Counter ([[Reaction]])**\n\nOnce per round, redirect a ranged attack targeting an ally to self and reduce damage by half\n\n---\n\n### **Techniques**\n\n#### \ud83d\udca8 **Resonant Collapse (X = y \u00d7 z)**\n\nInitiates with Earth or Firebender\n\n- DC = X\u00d72 CON save\n    \n- Damage: Xd8 thunder\n    \n- Targets fall prone, terrain becomes difficult\n    \n\n#### \ud83c\udf2c **Gale Dash**\n\nMove up to 9m in a straight line; push enemies 1m and impose disadvantage on their next attack\n\n---\n\n## \ud83c\udf0a Luma \u2013 Waterbender Crystal Grove Tender\n\n**Role:** Control, Utility  \n**Initiates:** \ud83d\udfe2 BlueBerry Surge, \u26aa Soulseed Support\n\n---\n\n### **Stats**\n\n- **HP:** 50\n    \n- **Armor:** 1\n    \n- **Chi Slots:** 3\n    \n- **Speed:** Normal\n    \n- **Weaknesses:** Fire, Lightning\n    \n\n### **Bending Slots:** 2\n\n### **actions per Round:** 1\n\n---\n\n### **Abilities**\n\n#### \u25aa\ufe0f **Glass Nourishment (Passive)**\n\nCan regrow a destroyed Glassfruit seed in 3 rounds\n\n#### \u25aa\ufe0f **Mirror Pool (1x/day)**\n\nRedirects one spell or bending technique back at the user (must be within 10m)\n\n---\n\n### **Techniques**\n\n#### \ud83d\udfe2 **BlueBerry Glass Surge (X = y \u00d7 z)**\n\nInitiates with Earthbender\n\n- Sticky terrain, immobilizes with Dex save (DC = X\u00d72)\n    \n- Crystal vines regrow if X \u2265 8\n    \n\n#### \ud83d\udca7 **Crystal Soothe**\n\nHeals 2d8 HP by wrapping ally in regenerative crystal pod (target can\u2019t act next turn)\n\n---\n\n## \ud83d\udcca Encounter Dynamics\n\n- **Baezu anchors the team**, often starting with **Soulseed Seal** in Round 1 to boost defense.\n    \n- **Siroh + Orhu** use **FlashLemon** or **Inferno Bloom** to control the battlefield.\n    \n- **Luma** uses **BlueBerry Surge** to stall the party and reposition.\n    \n- If **Baezu drops to 50% HP**, he channels his final energy into a **massive Soulseed + Soundstone combo**, threatening a **battlefield-wide harmonic quake**."}, "Dms Root/Locations/Omashu/The Stone Beneath Still Breathes.md": {"size": 3585, "type": "text", "text": "    #Plothook\n\n**Location:** [[Omashu]]  \n**Category:** Mystery, Ancient Lore, Spiritual Intrigue\n\n---\n\n### \u26f0\ufe0f Hook Summary:\n\nWhile staying in Omashu, the party becomes involved in a mystery that will shake the foundation\u2014literally\u2014of one of the Earth Kingdom\u2019s oldest cities. Tremors beneath the city reveal not just ancient ruins, but a dormant guardian far older than the city itself.\n\n---\n\n### \ud83c\udf2c\ufe0f Cultural Flavor:\n\nLocals greet each other now with the phrase:  \n**\u201cThe stone beneath still breathes.\u201d**\n\nIt began as a poetic slogan after a strange event four years ago:  \nA group of quarry workers unearthed a **resonance stone** in the southern cliffs near Omashu. When struck, it caused a massive tremor\u2014and to the astonishment of all present, **a massive turtle\u2019s head** breached the ocean waters below the mountain, took **a single GLORIOUS breath**, and sank back below.\n\nIt was the first time the Earth Lion Turtle had moved in known history.\n\nScholars and spiritualists are divided: some believe it was a reflex, others a sign. Most of the population believed the Lion Turtle is long dead.\n\n---\n\n### \ud83e\udde9 Current Mystery:\n\nNow, tremors are increasing. Unusual **heat flows**, **deep echoes**, and **rock shifts** are affecting the city's lower tunnels. The city\u2019s Tunnel Engineering Guild hires the party to investigate new cavern collapses and a recently revealed **stone wall carved in unknown patterns**.\n\nThe deeper they go, the stranger it gets\u2014stone murals of **people walking on lion-turtle backs**, **spirits whispering**, and a **faint, rhythmic thrum** echoing through the mountain\u2019s bones.\n\n---\n\n### \ud83d\udc22 Ancient Truth:\n\nOmashu is not just built on a mountain\u2014  \nThe **mountain is the shell** of a **slumbering Earth Lion Turtle**.\n\nBefore sealing the Spirit Portals, Wan and Raava helped stabilize the world. In that time, this turtle gave Earthbending to a final generation and warned them:\n\n> _\u201cDo not stray far from the Guardian\u2019s reach. This world forgets mercy when left alone. Here, between salt and stone, you will endure.\u201d_\n\nThe Lion Turtle then **entered dormancy**, embedding itself between desert and sea. The people adapted\u2014learning to evaporate seawater from nearby coastal flows and building atop the safe, rocky shell.\n\n---\n\n### \ud83c\udf00 Complications:\n\n- The **resonance stone** may be an organ, memory node, or sensory antenna of the turtle.\n- A spirit bound to the turtle, long dormant, is **awakening confused and angry**.\n- The secretive **Stoneblood Line**, descendants of the first settlers, wants to **awaken the turtle fully**\u2014either to protect Omashu, or as a weapon of last resort.\n\n---\n\n### \ud83c\udfaf How the Party Gets Involved:\n\n- Hired by tunnel engineers to investigate tremors.\n- Approached by a **young Stoneblood acolyte** who believes the party was \u201cchosen\u201d to awaken the Guardian.\n- A **Spirit World disturbance** nearby begins to bleed through into the material realm\u2014linked to the turtle\u2019s still presence.\n\n---\n\n### \ud83c\udfc1 Leads To:\n\n- Unlocking an ancient connection to the **Lion Turtle Age**.\n- Encounters with **primal spirits** or even visions from **Wan\u2019s era**.\n- The choice: leave the Turtle sleeping, or **risk waking a force that shaped the world.**\n- The choice: leave the Turtle sleeping, or **risk waking a force that shaped the world.**\n\n#Omashu #EarthKingdom #LionTurtle #resonanceStone #tremors #seismic #ancientGuardian #spiritWorld #StonebloodLine #tunnelEngineering #murals #ancientLore #mystery #investigation #moralChoice #NPChook #campaignPlot #spiritualIntrigue\n"}, "Dms Root/Locations/Omashu/Sidequest Bitter Berries, Restless Spikes.md": {"size": 7416, "type": "text", "text": "Here\u2019s a structured quest write-up you can drop straight into your vault:\n\n---\n\n#sidequest #story #prep #roleplay\n\n## Hook\n\nOn the way to [[Omashu]], the party encounters a small **Air Nomad family caravan**. They travel lightly with gliders strapped to their backs, but one thing stands out: a **hedgehogkoala**, a gentle spirit-beast companion. Its fur is soft and koala-like, but its back bristles with soft quills tipped with **berry clusters**. Normally, the berries are sweet and nourishing, but lately they have grown bitter. The creature also appears lethargic.\n\nThe party first meets the family under duress: two local hunters have the hedgehogkoala and refuse to hand it back, insisting it's a wild specimen or offering a reward. The group must intervene\u2014through negotiation, stealth, or force\u2014to rescue the pet and earn the family's trust.\n\nThe family explains they are traveling to Omashu to find a healer who might know what is wrong.\n\n---\n\n## Key NPCs\n\n- **Tashi (Father, calm and kind)** \u2013 wants to remain optimistic but is worried for the creature.\n- **Mila (Mother, practical)** \u2013 thinks the hedgehogkoala\u2019s diet might be \u201cspirit sick\u201d from traveling near corrupted land.\n- **Rin (Youngest child, mischievous)** \u2013 sneaks into the party\u2019s camp at night and tries to steal food/supplies to \u201chelp Spikeberry\u201d (the pet).\n\n---\n\n## Conflict & Choices\n\n- **Theft in the Night**: Rin sneaks into camp. The group may:\n  - Catch Rin and confront him.\n  - Let him steal, and later discover food is missing.\n  - Gently follow him and find he is feeding the hedgehogkoala.\n- **Healing the Spirit Pet**:  \n   Investigation reveals the hedgehogkoala\u2019s berries soured because it absorbed **tainted energy** while grazing near a patch of corrupted vines (link to [[Spiritual Corruption]]).\n  - Earth/Waterbenders can try cleansing rituals.\n  - Airbenders or spiritual characters can meditate with the creature to calm it.\n  - Herbal knowledge might help create a temporary tonic.\n- **Outcome**:\n  - If healed, the berries return to being sweet and nourishing. The family gratefully gifts the party a pouch of dried \u201cspikeberries\u201d (restore fatigue or minor healing).\n  - If left unresolved, the hedgehogkoala slowly worsens. The family thanks the group for their company but continues to seek help in [[Omashu]].\n\n---\n\n## Rewards\n\n- **Spikeberry Pouch**: 1d4 uses, eaten as an action \u2192 heals minor HP or grants +1 [[General Armor]] until next rest.\n- Roleplay reward: trust and friendship with a family who may reappear later in Omashu as allies or quest givers.\n\n---\n\n## Themes & Mood\n\n- Compassion vs. suspicion (how do they handle Rin\u2019s theft?)\n- Connection to spirits and the land\u2019s corruption\n- Small but heartfelt stakes that foreshadow larger spiritual imbalances in the world\n\n---\n\n# Scene: Shaken Paths to Stonegrove\n\n## Setup\n\nThe party approaches **Stonegrove Village**, led by the Air Nomad family. Just as the terraced orchards come into view, the ground rumbles. A violent **earthquake** tears through the valley:\n\n- The upper half of the mountain village slides away from the lower terraces.\n- **The Spiritberry Groves** (on the lower terraces) are now cut off by a deep fissure.\n- The Air Nomad **child Rin** is stranded on the opposite side with other villagers.\n\nDust clouds rise, the air fills with panic, and the valley hums with unstable resonance.\n\n---\n\n## Complication 1 \u2013 Separation\n\n- The group must decide whether to climb down and around the mountain, cross unstable bridges, or try bending-assisted solutions to reunite the family.\n- Non-bending solutions: ropework, teamwork, or navigating cliffside paths.\n- Bending solutions: Earthbenders may stabilize rock, Waterbenders freeze temporary paths, Airbenders glide or ferry.\n\nFailing checks doesn\u2019t necessarily drop PCs but causes **minor harm** or **delays**, making them vulnerable to what comes next\u2026\n\n---\n\n## Complication 2 \u2013 Spirit Encounter\n\nAs they make their way toward the grove, the fissure **oozes with corrupted water**. From it rises a strange hybrid spirit:\n\n**Spirit: Burrowfang**\n\n- **Appearance**: A towering **bear-sized rabbit** with a broad muzzle and long ears, covered in dripping mossy fur. Its claws drip mud and it shifts between watery fluidity and rocky density.\n- **Abilities**:\n  - _Earth Claws_: slams the ground, causing spikes of stone.\n  - _Water Wash_: surges forward in a wave, knocking characters back.\n  - _Spirit Rage_: grows more chaotic if the players harm the land around it.\n- **Weakness**: Calms when shown **restoration of balance** (cleansing corrupted vines, feeding it Spiritberry, bending in harmony).\n\n---\n\n# Burrowfang \u2013 Earth-Water Spirit\n\nA spirit born of mud, stone, and river runoff. Normally a gentle guardian of mountain springs, but corrupted quakes have filled it with restless rage.\n\n---\n\n## \ud83d\udcca Stat Block\n\n- **Type**: Large Spirit Beast (Corrupted)\n- **HP**: 60\n- **Armor**: 3 [[General Armor]]\n- **Speed**: Slow on land, Fast when flowing through fissures (burrow/swim).\n\n---\n\n## \ud83c\udf00 Abilities\n\n### \ud83c\udf0a **Water Wash**\n\n- **Action**: Sends a crashing wave of muddy water in a 15 ft cone.\n- **Effect**: All creatures must make a Defense or Athletics check (DC 14).\n  - Success \u2192 Take half damage (1d8).\n  - Fail \u2192 Take full damage (2d8) and are knocked prone/slid back 10 ft.\n\n### \ud83e\udea8 **Earth Claws**\n\n- **Action**: Swipes with stone-encrusted claws.\n- **Attack**: +6 to hit, 2 attacks per turn.\n- **Damage**: 2d6 + Strength (earthbending energy) each.\n\n### \ud83c\udf11 **Spirit Rage (Corruption Aura)**\n\n- **Passive**: When struck, loose stones and muddy water lash out.\n- Anyone within 5 ft of Burrowfang when they deal melee damage must succeed on a Reflex check (DC 13) or take 1d6 damage from shards/splash.\n\n### \ud83c\udf3f **Spirit Shift**\n\n- **Bonus Action (2x per fight)**: Transforms partially into water or stone.\n  - **Water Form**: Resistance to physical damage, vulnerable to freezing/containment.\n  - **Stone Form**: Resistance to bending damage, but speed halved.\n\n---\n\n## \ud83c\udfaf Weaknesses\n\n- Feeding it a **Spiritberry** or cleansing corrupted vines with bending reduces its HP by 10 instantly (it calms).\n- Combined bending (Earth + Water or Air + Water harmony) can weaken its Spirit Rage.\n\n---\n\n## \ud83c\udfad Behavior\n\n- Opens by **Water Wash** to separate intruders.\n- Switches forms depending on damage received.\n- Targets anyone attacking the land or Spiritberry vines most aggressively.\n\n---\n\n## \ud83c\udfc6 Rewards\n\n- **If Defeated (non-lethal)**: The land around the fissure heals slightly. Path to the Spiritberry Grove stabilizes.\n- **If Appeased**: Grants the group **Burrowfang\u2019s Blessing** \u2192 +1 forward on checks with earth/water spirits.\n- **Success**: The Burrowfang retreats, leaving behind fertile ground that opens a safer path to the Spiritberry Grove.\n- **Failure**: The party reaches the grove but strained and injured, consuming more resources.\n\nAt last, they reach the separated **Spiritberry terraces**, where they can gather the healing fruit. The family is reunited after the ordeal, grateful not only for healing their pet but also for saving them during the quake.\n\n---\n\n## Rewards\n\n- **Spiritberry Cluster**: (3 berries)\n  - Eat \u2192 Heal moderate HP and cleanse corruption/fatigue.\n  - Feed to spirit-animal \u2192 Restores vitality, calms agitation or illness.\n- Air Nomad pendant gift for remembrance.\n"}, "Dms Root/Locations/Omashu/Glassfang Vanguard Ambush.md": {"size": 3666, "type": "text", "text": "\n\n**Location:** Glassline canyon near Omashu\u2019s lower shell district \u2013 jagged cliffs, semi-wild Glassfruit groves, and an unstable spiritual resonance.\n\n**Situation:**  \nThe party seeks access to the **Heart of Clarity** (the ancient Resonance Stone), but they\u2019re intercepted by a **Glassfang Vanguard Cell** \u2014 loyal to the stone and sworn to protect it from those deemed \u201cunworthy\u201d or \u201cdisruptive.\u201d\n\nThe Glassfang benders are **trained in Glassfruit Team-Up Techniques** and immediately unleash synchronized bending using harvested seeds and sacred resonance tones.\n\n---\n\n### \ud83d\udc65 Encounter Composition\n\n#### \ud83e\uddf1 Baezu \u2013 Earthbender (Initiator for Glassfruit seeds)\n\n- Tactical leader, chants in low harmonic tones\n    \n- Carries a pouch of clear Soulseeds\n    \n- Triggers **Soulseed Harmonic Seal** for massive battlefield control\n    \n\n#### \ud83d\udd25 Siroh \u2013 Firebender (Initiator for Inferno Bloom & FlashLemon)\n\n- Aggressive and flashy, uses rapid Firebending katas\n    \n- Wears a red Glass mask\n    \n- Combo: **Inferno Bloom** followed by **FlashLemon Refractor Beam** to blind & burn\n    \n\n#### \ud83d\udca8 Orhu \u2013 Airbender (Initiator for Resonant Collapse)\n\n- Agile, evasive, never touches the ground for long\n    \n- Keeps the party off-balance with **shockwaves**\n    \n- Uses **Resonant Collapse** to knock down and split the party\n    \n\n#### \ud83c\udf0a Luma \u2013 Waterbender (Initiator for BlueBerry Surge)\n\n- Calm and focused, wears a robe woven with mineral threads\n    \n- Traps frontline party members with **BlueBerry Glass Surge**\n    \n- Supports the others by locking down terrain\n    \n\n---\n\n### \ud83c\udf00 Opening Round (Round 1)\n\n- **Luma (2 slots)** + **Baezu (3 slots)**:  \n    \u2192 `X = 6`  \n    \u2192 **BlueBerry Glass Surge** immobilizes frontliners (DC 12 Dex save)\n    \n- **Siroh (3 slots)** + **Orhu (2 slots)**:  \n    \u2192 `X = 6`  \n    \u2192 **Inferno Bloom** explodes near ranged party members (6d6 damage, 12m radius)\n    \n\n---\n\n### \u2604\ufe0f Round 2\n\n- **Baezu (3 slots)** + **Siroh (4 slots)**:  \n    \u2192 `X = 12`  \n    \u2192 **FlashLemon Refractor Beam** (24m cone)\n    \n    - One party member takes 12d8 radiant\n        \n    - Others must make DC 24 INT save or be blinded 1 round, with disadvantage on Perception for 4 turns\n        \n- **Orhu (3 slots)** + **Luma (2 slots)**:  \n    \u2192 `X = 6`  \n    \u2192 **Resonant Collapse** targeting remaining melee fighters\n    \n    - DC 12 CON save or fall prone and take 6d8 thunder\n        \n\n---\n\n### \ud83d\udee1\ufe0f Round 3 (Defensive Phase)\n\n- **Baezu (3 slots)** + **Orhu (2 slots)**:  \n    \u2192 `X = 6`  \n    \u2192 **Soulseed Harmonic Seal**\n    \n    - Grants 60 points of [[General Armor]] to the whole Glassfang squad within LoS\n        \n- Terrain now features:\n    \n    - Burning shards (Inferno)\n        \n    - Difficult ground (Sound)\n        \n    - Glassline vines (BlueBerry)\n        \n    - Blinding sun-beam points (FlashLemon)\n        \n    - Resonating vibration field (Soulseed)\n        \n\n---\n\n### \ud83e\udde0 Strategy Notes\n\n- The Glassfangs **target coordination**: knockdown, blind, and trap to **divide the party** and set up overwhelming AoE combos.\n    \n- They **rotate initiators** and **conserve bending slots** unless pressed.\n    \n- They treat **Resonance Stone activation** as a **last resort** \u2014 if they lose control, they may attempt to overcharge it, leading to **a spirit backlash or geomantic anomaly**.\n    \n\n---\n\n### \ud83e\ude99 Rewards (Optional)\n\n- **Glassfruit Seed Satchel**: 1 of each type\n    \n- **Glass Refractor Lens**: Lets a bender \u201cstore\u201d a technique once/day and release it later\n    \n- **Glassfang Tuning Rod**: Used to \u201cping\u201d the Resonance Stone for spiritual harmonization"}, "Dms Root/Locations/Omashu/Omashu.md": {"size": 3481, "type": "text", "text": "### Omashu \u2014 Glassfruit Terraces\n\nOn the outer cliffs and terraced slopes around Omashu grow the rare Glassfruit Trees. The city has long cultivated these trees as part of a local craft tradition that blends earth-working, horticulture, and elemental bending into a coordinated guild practice.\n\nOmashu's engineers and glasswrights pair with specialized bending teams to coax the fruits from mineral-rich stone and shape them while they are still forming. The result are glass-like fruits that are both useful (architectural shards, lenses, wards, tools) and dangerous (terrain-altering seeds and battlefield implements).\n\nKey features of Omashu's cultivation:\n\n- Terraced beds: Earthbenders prepare layered terraces seeded with mineral fines scraped from the cliffs; this concentrated substrate is what gives the fruits their glassy matrix.\n- Water management: Waterbenders control salinity, flow, and hydration pulses; they time irrigation to tune crystal growth and internal steam pockets.\n- Press-heat workshops: Firebenders (often working with Waterbenders) operate press-heat ovens and steam-forges that anneal and temper developing fruit under controlled pressure.\n- Air shaping: Airbenders perform the final \"glassblowing\" stage \u2014 using controlled gusts and focused breath to form hollows, vents, and decorative or functional shapes while the glass is still malleable.\n\nThis coordinated, multi-disciplinary craft is managed in small local guilds (often called Glasswright Houses) near Omashu's quarries and thermal vents. The practice is both practical and ritualized: harvests and tempering are accompanied by call-and-response bending chants and careful safety measures; mis-timed heat or pressure can shatter a crop or create unstable spirits.\n\nSee also: [[The Glassfruit Trees]] \u00b7 [[Glassfruit Varieties]] \u00b7 [[Glassfruit Seed Mechanics]] for rules and team-up techniques used by players and NPC guilds.\n\n### GM read\u2011aloud\n\nRead this to the table when the characters first lay eyes on Omashu:\n\"A round flat mountain rises out of the bay like a sentinel\u2014its broad flank half-swallowed by seawater, the city on top. Buildings step up the slopes in terraces and shells of carved stone; sunlight slides across glassy roofs and fractured lenses that wink like a field of stars. A broad, engineered bridge of packed earth and carved blocks reaches from the mainland and pins itself to the mountain\u2014earthbenders walk its span in disciplined lines, shaping and tending the road as naturally as a farmer tends a furrow. Around the city's outer rim, orchards cling to terraces and cliff ledges: glassfruit trees, their crystalline fruit catching the spray and the light, cluster in neat rows and glimmer like lanterns. From here you can smell salt and warm stone; faint chanting threads through the air where glasswrights and benders temper their harvests. The city looks both ancient and alive\u2014part quarry, part garden, and entirely of its people.\"\n\nSee also the glassfruit rules for mechanical details: [[Glassfruit Varieties]] and [[Glassfruit Seed Mechanics]].\n\n### Tags & links\n\n- Location: [[Omashu]]\n- Cultivation: [[Glassfruit Trees]] / [[Glasswright Houses]]\n- Bending roles: [[Earthbending]] (Earthbenders), [[Waterbending]] (Waterbenders), [[Firebending]] (Firebenders), [[Airbending]] (Airbenders)\n- Mechanics: [[Press & Anneal]] / [[Air shaping]] / [[Tempered (trait)]]\n\n#location\n#omashu\n#glassfruit\n#craft\n#player_root\n#earth\n#water\n#fire\n#air\n#spirit\n"}, "Dms Root/Locations/Omashu/Advanced Glassfruitbending.md": {"size": 4833, "type": "text", "text": "\ud83c\udf49Glassfruit Watermelonsteamer\nMust be innitiated by a Earth or Waterbender and needs at least one level from each Elements Level. You can use Levels from up to two different Elements. \n\n> A watermelon seed that needs to be watered to grow into a sphere of X meter radius that pushes everyone away and creates a Heavy sphere with X(Earthebending slot count double) Hitpoints. The watermelon is then quickly heated and the steam cooled down to heal every creature in a 5 * X Meters cone from the watermelon with the steam 3 * X Hitpoints \n- **Effects:** \n- Wall : \n\t- X(Earthebending slot count double) Hitpoints\n- Healing\n\t- 5 * X Meters cone from the watermelon\n\t- 2 * X(Water Counts double) Hitpoints Healing\n\t-\n## \ud83c\udf4b **Sunburst Nectarfield (Lemonseed)**\n\n_Must be initiated by a Fire or Water. Requires at least one Level from Fire and Air._  \nYou may use Levels from **up to two Elements**. **Fire counts double**.\n\n> A lemon-shaped crystal is launched skyward, where it refracts the sunlight into a radiant bloom before one side sprays out hot liquid glassand one side shines a cleansing light. After a delay of 1 round, it explodes in midair with a flash that burns spirits and cleanses mortal ailments.\n\n---\n\n### **Effects**:\n\n- **Flashburst AoE**\n    \n    - All enemies within **X \u00d7 4 meters radius** must succeed on **INT Save (DC = 10 + X)**\n        \n    - On fail: **Blinded (1 round)** + **take Xd8 radiant damage**\n        \n    - On success: Half damage, no blind\n        \n- **Healing Burst (Allies only)**\n    \n    - All allies in **X \u00d7 5 meters** are cured of **one condition** (blinded, frightened, charmed, etc.)\n        \n- **X = Fire Slot \u00d7 Air Slot**\n    \n    - **Fire counts double**\n        \n    - Max slots: 6 from Fire (counted as 12), 3 from Air\n        \n\n---\n\n## \ud83c\udf47 Cactusfruit  Bulb (Brambleseed)**\n\n_Must be initiated by an Earth or Fire. Requires at least one Level from Earth and Fire._  \nYou may use Levels from **up to two Elements**, but **Earth counts double**.\n\n> A Cactusfruit-shaped glassfruit seed is planted in the ground and rapidly grows into a colossal crystalline maze that coils and shifts like a sentient trap.\n\n---\n\n### **Effects**:\n\n- **Create a Trap**: \n    \n    - Radius: **X \u00d7 2 meters**\n        \n    - Duration: **X rounds**\n        \n    - Any enemy who enters or exits takes **Xd6 slashing damage** A the \n        \n    - Moving inside costs **double [[movement**\n        \n- **Binding Roots**:\n    \n    - 1 enemy of choice each round must succeed **STR Save (DC = 10 + X)** or be **restrained** by vine-arms from the wall\n        \n- **X = Earth Slot \u00d7 Water Slot**\n    \n    - **Earth counts double**\n        \n\n---\n\n## \ud83d\udd2e **Prism Bloom Reflection Field (Clear Soulseed + Flashcore)**\n\n_Must be initiated by an Air or Firebender. Requires at least one Level from Spirit and Fire._  \nYou may use Levels from **up to two Elements**, but **Spirit counts double.**\n\n> A flower of soul-glass blooms and begins refracting incoming energy \u2014 redirecting harmful bending and reflecting light into a calming aura.\n\n---\n\n### **Effects**:\n\n- **Mirror Ward (Ward HP = X \u00d7 8)**\n    \n    - All elemental attacks against allies within **X \u00d7 3 meters** are **redirected to the prism** instead of their original target\n        \n    - Prism absorbs the damage until depleted\n        \n- **Reflection Surge (1/short rest)**\n    \n    - When Prism Bloom is destroyed, it releases a **cone of refracted energy**\n        \n    - All enemies in a **6 \u00d7 X meter cone** take **Xd10 radiant or bending-type damage**, matching the last element absorbed\n        \n- **X = Spirit Slot \u00d7 Fire or Air Slot**\n    \n    - **Spirit counts double**\n        \n\n---\n\n## \ud83c\udf49 **Watermelon Bastion Bomb (Updated Version)**\n\n_Must be initiated by an Earth or Waterbender. Needs at least one Level from each._  \nYou may use Levels from **up to two Elements**.\n\n- **Earth counts double for the wall HP**\n    \n- **Water counts double for the healing effect**\n    \n\n---\n\n### **Effects**:\n\n- **Push Sphere**:\n    \n    - Grows into a **crystal watermelon** with a radius of **X meters**\n        \n    - All creatures within range must succeed on **STR Save (DC = 10 + X)** or be pushed back **X meters**\n        \n- **Bastion Wall**:\n    \n    - Leaves behind a hard shell with **X \u00d7 2 (Earth Slots double) Hitpoints**\n        \n- **Healing Steam**:\n    \n    - After heating and cooling, a cone of **5 \u00d7 X meters** heals all allies for **3 \u00d7 X (Water Slots double) HP**\n        \n- **X = Earth Slot \u00d7 Water Slot**\n    \n\n---\n\n## \ud83e\udeb7 Want more?\n\nWould you like 1-2 more \u201cepic\u201d tier moves using **triple-element requirements** (e.g. Fire + Water + Air) or **spiritual terrain effects** next? I can also create a visual reference card or turn these into [[Glassfruit High Techniques]] for your Obsidian campaign folder."}, "Dms Root/Locations/Untitled/Spirit - Galehide Armadra.md": {"size": 2179, "type": "text", "text": "I maybe want an arc there between metalbender and airbender characters to find ways to woek together.\n\n**Type**: Spirit Beast  \n**Elemental Affinity**: Air & Earth  \n**Hybrid Form**: Peregrine Falcon + Armadillo\n\n---\n\n### \ud83d\udccc Description\n\nThe **Galehide Armadra** is a rare spirit born from the convergence of swift winds and resolute stone. It has the **wings and keen eyes of a falcon**, merged with the **armored shell and burrowing claws of an armadillo**. Its spirit form is in constant, subtle motion\u2014its body shimmering slightly as if caught between gust and granite.\n\n---\n\n### \ud83c\udf00 Abilities\n\n#### **Evasive Windstep (Airbending)**\n\n- The Galehide Armadra uses short bursts of compressed air to **blur its position**, making it extremely difficult to track or hit.\n    \n- Mechanically: +2 or +3 to Evasion rolls; may impose Disadvantage on attacks once per round.\n    \n- Fluff: It seems to \"ghost\" sideways just as you strike.\n    \n\n#### **Metalhide Mantle (Earthbending/Metalbending)**\n\n- The spirit can pull iron-rich minerals from the earth and **form sleek, overlapping metal plates over its body**, boosting its physical defenses.\n    \n- Mechanically: Gains temporary armor (e.g., +2 Armor, or temporary HP).\n    \n- Duration: Until destroyed or shed voluntarily.\n    \n- Visual: The plates shimmer with a dull luster, engraved with swirling wind motifs.\n    \n\n#### **Drillstorm Dive**\n\n- It spirals rapidly while encased in metal, transforming into a high-velocity projectile.\n    \n- Combines wind momentum and armored piercing.\n    \n- Deals significant damage and breaks through Earth-based defenses.\n    \n\n---\n\n### \ud83c\udf2a Behavior\n\n- Prefers solitude and high altitudes, often found near **wind-swept canyons or mountain ridges with rich mineral deposits**.\n    \n- Highly territorial and shy; only appears to those it respects or finds spiritually aligned.\n    \n\n---\n\n### \ud83d\udd17 Campaign Use Ideas\n\n- **Trial Spirit**: A test for a player character mastering both air and earth.\n    \n- **Rare Bonding Spirit**: A spirit companion for someone straddling both disciplines.\n    \n- **Antagonist Guardian**: Defends a sacred location with both agility and raw defense.\n  "}, "Dms Root/Locations/Undersand Village/Si Wong Rock.md": {"size": 0, "type": "text", "text": ""}, "Dms Root/Locations/Undersand Village/Undersands Village.md": {"size": 1412, "type": "text", "text": "\n**Overview**\n\n- **Location**: Hidden beneath Si Wong Rock , central Si Wong Desert.\n    \n- **Primary Features**:\n    \n    - Underground lake: Provides water to sustain life.\n    - Fungi colonies: Essential for food, clothing, and tools.\n    - Purple light crystals: Emit a bioluminescent glow, providing light.\n- **Inhabitants**:\n    \n    - Dual-bending Earth and Waterbenders who use a unique technique to hydrate sandstone, allowing water retention in a closed system.\n    - Isolation for centuries. Language, traditions, and clothing are unique.\n- **Religion and Worship**:\n    \n    - **Spirit**: [[Ch\u00e1nch\u00fa ]] \u2013 A wise and powerful being that guided them to survive in their hostile environment.\n- **Society**:\n    \n    - Resource-focused: Mushroom-based leather-like textiles, crystal paste for light, and strict water management.\n    - Leadership: A council of elder benders, each excelling in Earth, Water, or combined bending techniques.\n\n**Links to Other Notes**:\n\n\n- [[Ch\u00e1nch\u00fa ]]\n\n---\n\n\n\n---\n\n### File: \n\n\n\n\n### File: [[Purple Light Crystals ]]\n\n**Description**\n\n- Formed naturally in the caves beneath the Si Wong Desert.\n- Properties: Emit a faint purple glow, often crushed into a paste for hair dye or tools.\n\n**Uses**\n\n- Lighting for the [[Undersands Village ]].\n- Crafting luminescent artifacts.\n\n**Links to Other Notes**:\n\n- [[Undersands Village ]]\n- [[Mushroom Leather Techniques ]]\n\n---\n"}, "Dms Root/Locations/Undersand Village/Ch\u00e1nch\u00fa.md": {"size": 1113, "type": "text", "text": "**Description**\n\n- Appearance: A colossal peaceful and good spirit creature that is a hybrid between a toad and an elephant. It has thick, webbed feet, long elephant tusks, and a bloated, amphibian-like body with slick moist skin. Its texture resembles that of a toads \u2014 moist, clothed in simple silk robes. On its back is a disturbing cyst-like growth shaped like a smaller toad's face, with a trunk for a tongue hanging limply. The creature is ancient and wise, embodying Earth and Water, and is surrounded by a shimmering aura of mist.\n\t\n\n- Role: The spiritual protector of the [[Undersands Village ]].\n- Teachings:\n    - Combined Earth and Waterbending to manipulate sandstone hydration.\n    - Balance and sustainability in the harsh desert environment.\n\n**Current Problem**\n\n- Essence corruption: The spirit\u2019s power is shifting due to unknown influences.\n- Evil form:\n    - Tusks elongate, trunk becomes prehensile with a sticky frog tongue.\n    - Aggressive and territorial.\n\n**Links to Other Notes**:\n\n- [[Spirit Corruption Mechanisms ]]\n- [[Undersands Village ]]\n- [[Ula Envoy of Ch\u00e1nch\u00fa]]\n\n\n\nHP:16\n"}, "Dms Root/visuals/Hatemonger_Reloaded_-_Tyler_Walpole.webp": {"size": 943396, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/visuals/Gloamglut_-_Tyler_Walpole.webp": {"size": 117610, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/visuals/Omentis_-_Tyler_Walpole.jpg": {"size": 187786, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/visuals/All-Minds-Burn_-_Tyler_Walpole.png": {"size": 1126403, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/visuals/Bari_Mondolo_-_Tyler_Walpole.webp": {"size": 862664, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/visuals/Basalt_Caecailian_-_Tyler_Walpole.png": {"size": 1340922, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/visuals/Reilora_Shrike_-_Tyler_Walpole.webp": {"size": 245898, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/visuals/hyperlinks.md": {"size": 120, "type": "text", "text": "https://criticalrole.miraheze.org/wiki/Category:Art_by_Tyler_Walpole#/media/File:Hatemonger_Reloaded_-_Tyler_Walpole.png"}, "Dms Root/visuals/Ozo_Cruth_-_Tyler_Walpole.jpg": {"size": 389852, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/visuals/Predathos_-_Tyler_Walpole.jpg": {"size": 413890, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/visuals/Extovass_-_Tyler_Walpole.png": {"size": 1426011, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/visuals/Reilora_-_Tyler_Walpole.png": {"size": 3850513, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/visuals/Hatemonger_-_Tyler_Walpole.webp": {"size": 916622, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/visuals/Fearne_Titan.jpg": {"size": 165386, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/visuals/Sandkheg_-_Tyler_Walpole.png": {"size": 360008, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/visuals/Jirana_the_Shore_Shrew_-_Tyler_Walpole.webp": {"size": 442498, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/visuals/Ruin-Crawler_-_Tyler_Walpole.jpg": {"size": 157991, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/Story/Act 2 The Rise of the Night Bloom.md": {"size": 94, "type": "text", "text": "\n\n- [[The Spirit Gauge\u2019s Purpose]]\n- [[Betrayals and Deceptions]]\n- [[The Shadowed Spirits]]"}, "Dms Root/Story/Campaign Overview.md": {"size": 327, "type": "text", "text": "\n#### Title: Shattered Spirit, Rising Lotus\n\n- [[The Ceremony of the Lotus]]\n- [[Main Story Arc A Shattered Avatar Spirit]]\n- [[Recurring Themes and Player Agency]]\n\n**Links**:\n- [[Recurring Themes and Player Agency]]\n- [[The Lotus]]\n- [[The Ceremony of the Lotus]]\n- [[Main Story Arc A Shattered Avatar Spirit]]\n\nTags:\n#Avatar"}, "Dms Root/Story/Act 1 Unveiling the Threat.md": {"size": 147, "type": "text", "text": "\n- [[Session 1 The Spirit Within]]\n- [[The Lotus Fractures]]\n- [[Building Alliances]]\n\n**Links**:\n- [[The Lotus]]\n- [[Session 1 The Spirit Within]]"}, "Dms Root/Story/The Ceremony of the Lotus.md": {"size": 941, "type": "text", "text": "\n#### Scene Setting:\n\nThe campaign begins at the serene Temple of the [[The Lotus]], where benders from across the world gather for the annual Ceremony of the Lotus.\n\n- PCs arrive as prodigies of their respective arts.\n- Subtle unease: elders whisper of spiritual disturbances.\n- PCs feel a fleeting resonance, but there\u2019s no spiritual response\u2014an ill omen.\n\n#### The Attack on the Ceremony:\n\n- **Smokebomb and the Voice:**  \n    A black mist explosion (orchestrated by Isai Trekal) disrupts the ceremony.  \n    **Voice:** \u201cThe age of bending submission is over...\u201d\n    \n- **Artifact Theft:**  \n    The Order of the [[Night Bloom]] steals the Resonance Jade.\n    \n- **Rogue Spirit Attack:**  \n    PCs fend off a corrupted spirit, feeling faint resonance from the ritual during combat.\n    \n- **Aftermath:**  \n    The artifact is gone, and the PCs are tasked with investigating the theft.\n\n**Links**:\n- [[The Lotus]]\n- [[Night Bloom]]"}, "Dms Root/Story/Key Groups and Concepts.md": {"size": 358, "type": "text", "text": "\n#### [[The Lotus]]\n\n- Home of the ceremony and spiritual hub.\n\n#### [[Ceremony of the Resonance]]\n\n- Celebration of unity, balance, and bending mastery.\n\n#### [[Night Bloom]]\n\n- Radical faction opposing the Avatar\u2019s central role.\n\n#### [[Resonance Jade]]\n\n- Artifact measuring spiritual energy.\n\n**Links**:\n- [[The Lotus]]\n- [[Night Bloom]]\n\nTags:\n#Avatar"}, "Dms Root/Story/Recurring Themes and Player Agency.md": {"size": 473, "type": "text", "text": "\n1. **Balance vs. Independence:**  \n    Explores centralized power vs. collective leadership.\n    \n2. **Personal Growth:**  \n    Each PC\u2019s arc reflects their fragment of the Avatar Spirit.\n    \n3. **Moral Dilemmas:**  \n    The Night Bloom\u2019s ideals resonate with many; their morality isn\u2019t black and white.\n    \n4. **Worldbuilding:**  \n    Encourage player input for designing clans, bending styles, and spiritual entities.\n\n**Links**:\n- [[Night Bloom]]\n\nTags:\n#Avatar"}, "Dms Root/Story/Main Story Arc A Shattered Avatar Spirit.md": {"size": 647, "type": "text", "text": "\n#### [[Act 1: Unveiling the Threat]]\n\n- PCs discover they hold fragmented aspects of the Avatar Spirit.\n- Internal conflict: heightened bending abilities without unity.\n- Night Bloom\u2019s origins tied to a [[Lotus Fracture]].\n\n#### [[Act 2: The Rise of the Night Bloom]]\n\n- Spirit Gauge\u2019s potential to destabilize balance.\n- Betrayals within the White Lotus.\n- Growing attacks from corrupted spirits.\n\n#### [[Act 3: The Broken Avatar]]\n\n- Truth of the Avatar\u2019s death and shattered spirit.\n- Final confrontation: Combine spirits to reform Avatar or share the essence among the group.\n\n**Links**:\n- [[The Lotus]]\n- [[Night Bloom]]\n\nTags:\n#Avatar"}, "Dms Root/Story/_Story.md": {"size": 363, "type": "text", "text": "# Story\n\n**Links**:\n- [[Act 2 The Rise of the Night Bloom]]\n- [[Campaign Overview]]\n- [[Act 1 Unveiling the Threat]]\n- [[The Ceremony of the Lotus]]\n- [[Key Groups and Concepts]]\n- [[Recurring Themes and Player Agency]]\n- [[Main Story Arc A Shattered Avatar Spirit]]\n- [[Session 1 The Spirit Within]]\n- [[Act 3 The Broken Avatar]]\n- [[Modules]]\n- \n\nTags:\n#Avatar\n"}, "Dms Root/Story/Act 3 The Broken Avatar.md": {"size": 98, "type": "text", "text": "\n\n- [[The Avatar\u2019s Legacy]]\n- [[The Final Confrontation]]\n- [[The Avatar Reborn]]\n\nTags:\n#Avatar"}, "Dms Root/Story/Main Story/The Fractured Avatar Spirit.md": {"size": 3139, "type": "text", "text": "\n\n### Overview:\n\nThe Avatar spirit, the bridge between the physical and spiritual realms, is in a precarious state. During the final moments of the last Avatar\u2019s life, a catastrophic event caused the spirit\u2019s essence to splinter, disrupting the cycle of reincarnation and weakening its connection to the Spirit World.\n\n#### Event of Fracture:\n\nThe fracture occurred during a climactic battle against a monstrous corrupted spirit, commanded by the rogue [[Spiritbender]]. The Avatar sacrificed themselves to contain the spirit\u2019s power, but the Spiritbender\u2019s mist disrupted the Avatar\u2019s spiritual essence, leaving it fragmented and vulnerable.\n\n### Effects of the Fracture:\n\n1. **Weakened Avatar State:** The current Avatar cannot fully access the power of their predecessors, making their connection to past lives erratic and unreliable.\n    \n2. **Disturbed Spirit World:** The fracture has caused chaos in the Spirit World, with dark spirits manifesting more frequently in the physical realm.\n    \n3. **Cycle in Jeopardy:** The reincarnation cycle is unstable. If the fracture is not healed, the Avatar may not reincarnate after their current life ends.\n    \n\n### Clues to Restoration:\n\n- **Shards of Essence:** Fragments of the Avatar spirit linger in sacred locations across the world. By visiting these sites and performing rituals, the group can begin to mend the fractures.\n    \n- **Guidance from Spirits:** Certain spirits, such as [[Shifting Sands]] or the elusive [[Bright Flame]], may provide insight into restoring the balance.\n    \n- **Confronting the Spiritbender:** The rogue Airbender holds knowledge about the fracture and must be confronted to uncover the full truth.\n    \n\n### Mechanics:\n\n- **Fractured Avatar State:**\n    \n    - When the Avatar attempts to enter the Avatar State, they must succeed on a Spirit check (DC 18). Failure results in a partial manifestation, granting a single bending style enhancement instead of full power.\n        \n    - Past Avatar advice requires a concentration check (DC 15) to establish communication.\n        \n- **Restoration Sites:**\n    \n    - Each sacred location restores a portion of the Avatar spirit, reducing the DCs for Avatar State checks by 2. Fully visiting all sites removes these penalties entirely.\n        \n\n### Encounters:\n\n- **The First Shard:** The group travels to a secluded temple where the shard is guarded by a territorial spirit. They must earn the spirit\u2019s trust or defeat it to claim the shard.\n    \n- **Spiritual Consequences:** An encounter with a corrupted spirit shows the group the real-world effects of the fractured Avatar spirit, emphasizing the urgency of their quest.\n    \n- **The Spiritbender\u2019s Challenge:** A climactic battle against the Spiritbender offers an opportunity to learn how the fracture occurred and hints at their larger agenda.\n    \n\n### Implications for the Campaign:\n\nHealing the Avatar spirit becomes a central goal, tying together themes of balance, sacrifice, and teamwork. The fracture also provides opportunities for moral dilemmas, as the group navigates the complex relationships between humans and spirits."}, "Dms Root/Story/Earth_Kingdom_Folder_Structure/Earth_Kingdom_Adventures.md": {"size": 217, "type": "text", "text": "Overview of Earth Kingdom adventures, including themes like resilience, strength, and the challenges of navigating a vast and diverse region. Includes guidelines for integrating these modules with the larger campaign."}, "Dms Root/Story/Earth_Kingdom_Folder_Structure/Regional Conflicts/Bandit_Camp_Raid.md": {"size": 122, "type": "text", "text": "The party must infiltrate or attack a bandit camp causing problems for a nearby town. Scalable combat and stealth options."}, "Dms Root/Story/Earth_Kingdom_Folder_Structure/Earthbending Challenges/Siege_Scenario.md": {"size": 120, "type": "text", "text": "Players defend or breach a fortress using Earthbending tactics. Includes scalable mechanics for different player levels."}, "Dms Root/Story/Earth_Kingdom_Folder_Structure/Earthbending Challenges/Precision_Test.md": {"size": 117, "type": "text", "text": "A challenge requiring precise Earthbending control, such as moving a delicate object or navigating a collapsing cave."}, "Dms Root/Story/Earth_Kingdom_Folder_Structure/Political Intrigue/Festival_Tensions.md": {"size": 81, "type": "text", "text": "Hidden agendas during a local festival, such as smuggling or political rivalries."}, "Dms Root/Story/Earth_Kingdom_Folder_Structure/Cultural Experiences/Local_Festival.md": {"size": 107, "type": "text", "text": "A vibrant Earth Kingdom festival, featuring opportunities for roleplay, games, and uncovering local rumors."}, "Dms Root/Story/Earth_Kingdom_Folder_Structure/Cultural Experiences/Master_Sculptor.md": {"size": 134, "type": "text", "text": "The players meet a famous Earth Kingdom sculptor who uses Earthbending to create works of art. Potential for puzzles or a heist story."}, "Dms Root/Story/Earth_Kingdom_Folder_Structure/Exploration and Mysteries/Underground_Smuggling_Ring.md": {"size": 82, "type": "text", "text": "The players uncover a smuggling ring operating beneath a major Earth Kingdom city."}, "Dms Root/Story/Earth_Kingdom_Folder_Structure/Exploration and Mysteries/Hidden_Cave_Network.md": {"size": 96, "type": "text", "text": "A sprawling network of caves hiding bandits, lost treasures, or ancient Earth Kingdom artifacts."}, "Dms Root/Story/Sidestories/Sidequest Bitter Berries, Restless Spikes.md": {"size": 7416, "type": "text", "text": "Here\u2019s a structured quest write-up you can drop straight into your vault:\n\n---\n\n#sidequest #story #prep #roleplay\n\n## Hook\n\nOn the way to [[Omashu]], the party encounters a small **Air Nomad family caravan**. They travel lightly with gliders strapped to their backs, but one thing stands out: a **hedgehogkoala**, a gentle spirit-beast companion. Its fur is soft and koala-like, but its back bristles with soft quills tipped with **berry clusters**. Normally, the berries are sweet and nourishing, but lately they have grown bitter. The creature also appears lethargic.\n\nThe party first meets the family under duress: two local hunters have the hedgehogkoala and refuse to hand it back, insisting it's a wild specimen or offering a reward. The group must intervene\u2014through negotiation, stealth, or force\u2014to rescue the pet and earn the family's trust.\n\nThe family explains they are traveling to Omashu to find a healer who might know what is wrong.\n\n---\n\n## Key NPCs\n\n- **Tashi (Father, calm and kind)** \u2013 wants to remain optimistic but is worried for the creature.\n- **Mila (Mother, practical)** \u2013 thinks the hedgehogkoala\u2019s diet might be \u201cspirit sick\u201d from traveling near corrupted land.\n- **Rin (Youngest child, mischievous)** \u2013 sneaks into the party\u2019s camp at night and tries to steal food/supplies to \u201chelp Spikeberry\u201d (the pet).\n\n---\n\n## Conflict & Choices\n\n- **Theft in the Night**: Rin sneaks into camp. The group may:\n  - Catch Rin and confront him.\n  - Let him steal, and later discover food is missing.\n  - Gently follow him and find he is feeding the hedgehogkoala.\n- **Healing the Spirit Pet**:  \n   Investigation reveals the hedgehogkoala\u2019s berries soured because it absorbed **tainted energy** while grazing near a patch of corrupted vines (link to [[Spiritual Corruption]]).\n  - Earth/Waterbenders can try cleansing rituals.\n  - Airbenders or spiritual characters can meditate with the creature to calm it.\n  - Herbal knowledge might help create a temporary tonic.\n- **Outcome**:\n  - If healed, the berries return to being sweet and nourishing. The family gratefully gifts the party a pouch of dried \u201cspikeberries\u201d (restore fatigue or minor healing).\n  - If left unresolved, the hedgehogkoala slowly worsens. The family thanks the group for their company but continues to seek help in [[Omashu]].\n\n---\n\n## Rewards\n\n- **Spikeberry Pouch**: 1d4 uses, eaten as an action \u2192 heals minor HP or grants +1 [[General Armor]] until next rest.\n- Roleplay reward: trust and friendship with a family who may reappear later in Omashu as allies or quest givers.\n\n---\n\n## Themes & Mood\n\n- Compassion vs. suspicion (how do they handle Rin\u2019s theft?)\n- Connection to spirits and the land\u2019s corruption\n- Small but heartfelt stakes that foreshadow larger spiritual imbalances in the world\n\n---\n\n# Scene: Shaken Paths to Stonegrove\n\n## Setup\n\nThe party approaches **Stonegrove Village**, led by the Air Nomad family. Just as the terraced orchards come into view, the ground rumbles. A violent **earthquake** tears through the valley:\n\n- The upper half of the mount
