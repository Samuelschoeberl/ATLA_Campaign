------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | ------------------ | ------------------ | ----------------- | ------------------ | ------------------ |\n| # HOLIDAY SPIRIT  <br>Medium Undead, Typically Chaotic Neutral                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         |                    |                    |                   |                    |                    |\n| Armor Class\u00a013<br><br>Hit Points\u00a045 (10d8)<br><br>Speed\u00a010 ft., fly 40 ft.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             |                    |                    |                   |                    |                    |\n| STR<br><br>9 (-1)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      | DEX<br><br>16 (+3) | CON<br><br>10 (+0) | INT<br><br>9 (-1) | WIS<br><br>16 (+3) | CHA<br><br>17 (+3) |\n| Damage Resistances\u00a0acid, fire, lightning, thunder; bludgeoning, piercing, and slashing from nonmagical attacks<br><br>Damage Immunities\u00a0cold, necrotic, poison<br><br>Condition Immunities\u00a0exhaustion, grappled, paralyzed, petrified, poisoned, prone, restrainedSenses\u00a0darkvision 60 ft., passive Perception 13<br><br>Languages\u00a0Common<br><br>Challenge\u00a05 (1,800 XP) \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0Proficiency Bonus\u00a0+3                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            |                    |                    |                   |                    |                    |\n| Amphibious.\u00a0The holiday spirit can breathe air and water.<br><br>Fluid Form.\u00a0The Holiday Spirit can enter a hostile creature\u2019s space and stop there. It can move through and stop in a space as narrow as 1 inch wide without squeezing.<br><br>Spirit Siphon.\u00a0The Holiday Spirit draws power from festivities and collective emotion. The nature of any given festivity reflects the energy the creature is able to drain, determining its unique traits. The GM chooses from one of the traits from the table below, selecting one that best reflects the celebrations that have drawn the spirit\u2019s attention.<br><br>Spirit Siphon Table<br><br>\\|   \\|   \\|   \\|<br>\\|---\\|---\\|---\\|<br>\\|Trait\\|Effect\\|Suggested Festivity\\|<br>\\|Present\\|The first time the spirit deals damage to a creature on its turn, it rolls\u00a02d8. That creature takes additional cold damage equal to the result. If the result on both dice are the same, the target instead gains Temporary Hit Points equal to the result, and resists all damage dealt by the spirit until the start of the spirit\u2019s next turn.\\|christmas, wedding, eid al-fitr\\|<br>\\|Regeneration\\|The spirit regains 3 hit points at the start of its turn. This trait does not trigger if it took damage from a critical hit since the end of its last turn.\\|easter, funeral\\|<br>\\|Big Day Beatdown\\|The spirit aggressively targets the focus of the festivity. It has advantage on attack rolls against the creature(s) who are the subject of the current celebration, and the first time it deals damage to such a creature on its turn, it gains 1d10 Temporary Hit Points and can use its [[Reaction]] to move up to 30 feet.\\|birthday, bar mitzvah, graduation, quincea\u00f1era\\|<br>\\|Drunken Merriment\\|The spirit is one with flowing champagne and neat spirits. The first time it deals damage to a creature each turn, that creature must succeed on a DC14 Constitution saving throw or become poisoned for the next minute. A creature poisoned in this way is also intoxicated. It has disadvantage on Dexterity saving throws and Dexterity-based Attack Rolls, and speaks with slurred speech. A creature can repeat this save at the end of its turns, ending the effect on a success.\\|new year, rosh hashanah\\|<br>\\|Dead Party. (Recharge 6)\\|The Spirit knows the spell Animate Dead, and can use its [[Action]] to cast it without components. When it does so, it can choose the carcasses of beasts (such as carved chicken, suckling pig, etc.) to animate as zombies or skeletons, in addition to the bones and corpses of humanoids.\\|d\u00eda de muertos, halloween\\| |                    |                    |                   |                    |                    |\n| actionS                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                |                    |                    |                   |                    |                    |\n| Multiattack.\u00a0The Holiday Spirit makes two Sapping Touch attacks.<br><br>Sapping Touch.\u00a0Melee Weapon Attack:\u00a0+6 to hit, reach 5 ft., one target.\u00a0Hit:\u00a013 (2d8 + 4) necrotic damage, and the target feels a wave of apathy wash over them. They have a -1 penalty to the next attack roll or saving throw they make before the end of their next turn.<br><br>Fluid Fling.\u00a0The Spirit hurls a fragment of its fluid body at a point it can see within 60 feet. Creatures within 10 feet of that point must succeed on a Dexterity saving throw, taking 4d10 poison damage and falling prone on a failed save. On a successful save, they take half as much damage and do not fall prone.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 |                    |                    |                   |                    |                    |"}, "Dms Root/NPCs/Night Bloom/Dark Spirits/Frostling puppetier.png": {"size": 641516, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/NPCs/Night Bloom/Dark Spirits/Bobakik.md": {"size": 5702, "type": "text", "text": "|                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      |                    |                    |                    |                    |                   |\n| ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | ------------------ | ------------------ | ------------------ | ------------------ | ----------------- |\n| # Bobakik  <br>Small Fey, Typically Lawful Neutral                                                                                                                                                                                                                                                                                                                                                                                                                                                   |                    |                    |                    |                    |                   |\n| Armor Class\u00a014 (Natural Armor)<br><br>Hit Points\u00a016 (4d6 + 2)<br><br>Speed\u00a030 ft., climb 30 ft.                                                                                                                                                                                                                                                                                                                                                                                                      |                    |                    |                    |                    |                   |\n| STR<br><br>10 (+0)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   | DEX<br><br>14 (+2) | CON<br><br>12 (+1) | INT<br><br>16 (+3) | WIS<br><br>14 (+2) | CHA<br><br>7 (-2) |\n| Skills\u00a0Perception +4, Sleight of Hand +4, Stealth +4Senses\u00a0darkvision 60 ft., passive Perception 14<br><br>Languages\u00a0Sylvan<br><br>Challenge\u00a05 (1,800 XP) \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0Proficiency Bonus\u00a0+3                                                                                                                                                                                                                                                                        |                    |                    |                    |                    |                   |\n| Artisan's Darkvision.\u00a0The bobakik can see in darkness as if it were bright light, and is able to discern colors in darkness.<br><br>Shadow Stealth.\u00a0While in dim light or darkness, the bobakik can take the Hide [[Action]] as a [[Bonus Action]].<br><br>Sunlight Weakness.\u00a0While in sunlight, the bobakik has disadvantage on attack rolls, ability checks, and saving throws.<br><br>True Artisan.\u00a0The bobakik has proficiency with all artisans tools, as well as navigator's tools and thieves' tools. |                    |                    |                    |                    |                   |\n| actionS                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              |                    |                    |                    |                    |                   |\n| Multiattack.\u00a0The bobakik makes two scratch or tool toss attacks. If it is targeting the master of its house, it instead makes three attacks.<br><br>Scratch.\u00a0Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 5 (1d6 + 2) slashing damage.<br><br>Tool Toss.\u00a0Ranged Weapon Attack: +4 to hit, range 15/30 ft., one target. Hit: 4 (1d4 + 2) piercing damage.                                                                                                                            |                    |                    |                    |                    |                   |\n\n\n\n- The Bobakik will generally avoid combat, using its Shadow Stealth to escape most confrontations\n- The Bobakik will resort to ranged attacks from small areas inside buildings, such as rafters or holes in walls\n- The Bobakik is nocturnal, and if moved to attack targets first, will do so when its enemies are asleep"}, "Dms Root/NPCs/Night Bloom/Dark Spirits/boba.png": {"size": 1631750, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/NPCs/Night Bloom/Dark Spirits/Holiday Spirit.png": {"size": 812677, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/NPCs/Spirits/assets_task_01jqk424c7ea58gb9jdd0zmvqj_img_0.webp": {"size": 286492, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/NPCs/Spirits/Sora.html": {"size": 209173, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/NPCs/Spirits/assets_task_01jqk4rq81fnsrfydwnb0gnxr1_img_1.webp": {"size": 173264, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/NPCs/Spirits/Jellytee.webp": {"size": 230316, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/NPCs/DMPCs/Kaedo, the Young Sandbender Guide.md": {"size": 9437, "type": "text", "text": "**Name:** Kaedo  \n**Age:** Mid-twenties  \n**Role:** Tour Guide of Mahzeen Village, Sandbending Prodigy\n\n---\n\n#### **Background:**\n\nKaedo was born and raised in the Village of Mahzeen, a remote Sandbender settlement near the ancient Earth Temple. As a child, he was always tinkering with the dunes, shaping small sand sculptures for travelers and inventing playful uses for the desert wind. His parents\u2014humble herders\u2014never expected much beyond a stable future guiding caravans, but Kaedo surprised everyone with his natural talent and quick mastery of sandbending techniques.\n\nAs he grew older, Kaedo became the village\u2019s unofficial \u201cfaces and voices\u201d to the outside world. His tours of Mahzeen were famous for their charm, humor, and breathtaking bending displays. He\u2019s the one who leads travelers around the oasis, showing them the intricate carvings, the subtle dunes that whisper of ancient spirits, and the clever ways Sandbenders have adapted to life in the harsh desert.\n\n---\n\n#### **Personality:**\n\nKaedo is warm-hearted, eager to please, and curious\u2014an ideal guide, equal parts entertainer and educator. He carries himself with easy confidence and a touch of boyish pride. Deep down, he\u2019s both honored and perplexed that High Priestess Shakiri believes he might be more than just a talented Sandbender.\n\nHe shrugs off such lofty notions. After all, he\u2019s no Avatar\u2014just Kaedo, the sand-sculptor and storyteller who makes visitors laugh and gasp in wonder. He wears practical desert garb: loose, sand-hued pants, a sleeveless tunic tied with a bright sash, and a cloth mask to protect his face from the whipping winds. Bracelets of polished sandstone beads jangle softly at his wrists.\n\n---\n\n#### **Invited to the Ritual:**\n\nBecause Mahzeen\u2019s tribe has tended the Temple for generations\u2014cleaning the carved alcoves, maintaining its walkways, and ensuring its sacred pools remain undisturbed\u2014the Lotus Order grants them a place of honor at the annual ritual. Kaedo was chosen to represent the village\u2019s younger generation. Many in the tribe think he\u2019s just there to show friendly hospitality and ensure dignitaries know the village\u2019s story.\n\nHowever, High Priestess Shakiri suspects something greater\u2014she alone sees a glimmer of destiny in the way Kaedo bends sand with effortless grace, in his profound empathy for travelers from all walks of life. She has handpicked him with the quiet conviction that, despite his disbelief and everyone else\u2019s doubts, Kaedo may be something far more important than a guide\u2014perhaps even the Avatar reborn.\n\n---\n\n#### **In Roleplay:**\n\n- **Meeting Strangers:** Kaedo greets newcomers with a grin and an offer: \u201cFollow me, I\u2019ll show you the sights that most people miss. If you\u2019ve never seen a scorpion dragon carved from pure sand, you\u2019re in for a treat.\u201d\n- **Sandbending Display:** As he guides travelers around the oasis, Kaedo deftly flicks his wrist to form a sand sculpture\u2014a miniature version of the Earth Temple\u2019s spires, or a delicate sand lotus flower, complete with swirling petals that dance in the breeze.\n- **Lingering Doubts:** If pressed on the topic of the Avatar, Kaedo laughs nervously, \u201cOh, that\u2019s just Shakiri\u2019s fancy notion. I\u2019m just a village kid who got real good at pushing sand around. Let\u2019s not get carried away!\u201d Yet, behind his smile, there\u2019s a hint of wonder: could the High Priestess know something he doesn\u2019t?\n\n\n\n#### **Personality and Methods:**\n\nKaedo believes that the best way to understand a culture is to listen to those at the edges of its story: the children, who carry fresh perspectives free of cynicism, and the elderly, whose memories contain secrets and wisdom spanning decades. When guiding visitors, Kaedo isn\u2019t satisfied with rote facts or common tourist spots. Instead, he brings guests straight to the village\u2019s heart.\n\n- **Children:**  \n    Kaedo delights in entertaining the youngest villagers. He uses sandbending to animate little figures\u2014dancing scorpions, squawking birds, tiny versions of the temple\u2019s guardians\u2014to amuse the children. Once they\u2019re giggling and comfortable, he encourages them to share their favorite games, songs, and stories. Through their laughter and unfiltered truth, travelers glimpse the village\u2019s values and hopes. The children\u2019s chatter reveals what they love, fear, and aspire to, painting a genuine portrait of life in Mahzeen.\n    \n- **Elders:**  \n    Kaedo also knows that while children carry the future, the elders hold the past. He\u2019ll approach an elderly woman sitting in the shade of a tent, bow respectfully, and compliment the intricate pattern on her scarf. With a wink and a light-hearted quip, he\u2019ll offer his arm to her, and before long, she\u2019s laughing at his jokes. Soon, she\u2019s recalling how the village came to its current home, how the temple was restored after a mighty sandstorm, and what old rituals were once practiced under starlit skies. By flirting gently and listening attentively, Kaedo coaxes out precious histories and personal anecdotes that no dusty archive could ever match.\n    \n- **Putting it Together:**  \n    After a day spent making children shriek with glee and coaxing secret histories from grinning grandmothers, Kaedo leads his guests to the village\u2019s central fire. There, he weaves these fragments into a tapestry of Mahzeen\u2019s story\u2014its traditions, struggles, and evolution. His method of cultural exploration ensures visitors don\u2019t just see the village; they feel it, through laughter, memories, and honest conversation.\n    \n\nKaedo settles into a comfortable crouch at the edge of Mahzeen\u2019s central oasis, a small circle of curious children gathered around him. The late afternoon sun casts long shadows across the sandy ground, and his fingers gently sift through warm, golden grains, coaxing them upward into shape. With a subtle flourish of sandbending, he begins to form a figure\u2014taller than the usual tiny animals or playful shapes he makes to make them giggle.\n\n\"Come on now,\" Kaedo says in a teasing whisper, arching an eyebrow at the smallest child, Ila, who\u2019s perched with knees drawn up to her chest. \"Tell me what you see. Who is this?\"\n\nThe children lean in, wide-eyed. The figure is a man carved of compressed sand\u2014lean, strong, yet kind-eyed. Around him, Kaedo sculpts waves and spirals of shifting textures, subtle hints of other elements.\n\n\"It\u2019s... it\u2019s [[Atash the Avatar]], isn\u2019t it?\" Ila ventures, her voice barely above the hush of desert wind. A murmur of excitement passes through the group.\n\n\"Yes!\" squeaks a boy, clutching a polished stone he keeps in his pocket. \"That\u2019s the one we always hear about!\"\n\nKaedo nods slowly, encouraging them with a gentle smile. He lifts his palm, and a swirl of sand forms a towering shape behind the Avatar. The grains drift and billow, forming something immense, with a broad head and elongated limbs.\n\nThe children\u2019s eyes grow round. \"The Giant Air Spirit!\" one of them whispers, voice trembling in mock fear.\n\n\"The Giant Air Spirit that came from beyond the seas,\" Ila adds more confidently. Her tone becomes reverent as she recounts the legend they all know by heart. \"They say it swept in on a storm of salt and cloud, tearing at our tents and scattering our herds. Its roar shook the dunes. It tried to swallow the desert\u2019s life.\"\n\nKaedo\u2019s jaw tightens slightly, but he keeps sculpting, guiding their narrative. As they speak, he slowly pulls sand upward around the Avatar figure\u2019s feet, showing him standing firm against the monstrous shape.\n\n\"And what did the Avatar do?\" Kaedo prompts softly.\n\n\"He fought it!\" Jin says, chest puffing with pride. \"He used earth and sand and stone. He raised great walls of rock that the spirit could not pass. He guided rivers of sand to blind it. He drew strength from the dunes and did not flee.\"\n\nThe smallest girl, Tala, her voice trembling a bit, adds: \"But the spirit was so strong. It howled and twisted the wind. The Avatar pushed it back, but at a terrible cost.\" Her eyes lower, and the other children\u2019s shoulders droop. They know the ending, and it stings every time.\n\n\"He won,\" Ila finishes quietly, looking Kaedo in the eye. \"The Avatar stopped the spirit and sent it away for good. But he... he died in the last strike, didn\u2019t he?\"\n\nKaedo nods, his smile gentle, though his heart tugs painfully. He refines the details of the sandy figure\u2019s face\u2014his strong jaw, determined eyes, and kind smile, even in battle. It is a face that resembles Kaedo more than he\u2019d ever admit to the children. The final sculpture shows the Avatar standing tall, the monstrous spirit recoiling, and a burst of sand suggesting the final, heroic blow.\n\n\"Yes,\" Kaedo says softly, \"he gave his life for the tribe. For all of us.\"\n\nThe children fall silent for a moment, the hush of the desert wrapping around them. They understand the sacrifice now, through their own telling. Kaedo looks at them and musters a bright, warm grin. \"You told the story well. I\u2019m proud of you.\"\n\nAnd as he smooths the last grains of sand, Kaedo feels the bittersweet weight of lineage: the story of the last Avatar, their tribe\u2019s leader, who was his father. The children never say those words directly\u2014it\u2019s a truth known but unspoken, carried in their eyes and in Kaedo\u2019s gentle silence.\n\n\t\n\n**Links**:\n- [[The Lotus]]\n- [[Wisdom]]\n- [[Strength]]\n\nTags:\n#Avatar"}, "Dms Root/NPCs/DMPCs/_DMPCs.md": {"size": 50, "type": "text", "text": "**Links**:\n- [[Kaedo, the Young Sandbender Guide]]"}, "Dms Root/NPCs/DMPCs/Kaedo.png": {"size": 1458174, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/NPCs/DMPCs/Silent Song.md": {"size": 3968, "type": "text", "text": "A Dark humnaoid Cat like Spirit that has a large shard of Vaatu and was therefore corrupted early. He supresses the dark as good as he cans but the dark spirit also gives him the gifts to be an elite assasin. He only uses a little bit of airbending and is mostly waepon and archery based.\n\n\n**Race/Type**: Dark Humanoid Cat-like Spirit  \n**Affiliation**: Independent (Potentially allied with the Party and later [[Night Bloom]]?)  \n**Role**: Elite Assassin, Tracker, and Protector\n\n---\n\n### **Overview**\n\nSilent Song is a shadowy feline humanoid spirit with sleek, dark fur and piercing silver eyes. His form is lithe and agile, blending the traits of a predator with the intelligence of a humanoid. A shard of **Vaatu**, the spirit of chaos and darkness, embedded itself in Silent Song. This corruption taints him, but Silent Song works tirelessly to suppress its influence.\n\nThe dark shard grants him supernatural abilities, enhancing his combat prowess and sensory skills but constantly tempts him toward chaos. He channels his darkness into his role as an elite assassin, using his gifts for precision and stealth to survive and protect others.\n\n---\n\n### **Abilities**\n\n- **Shadow Infusion**:\n    \n    - **Enhanced Stealth**: Silent Song can meld into the shadows almost seamlessly, making him nearly invisible in darkness.\n    - **Spirit Step**: A short-range teleportation ability, moving from one shadow to another within his line of sight.\n    - **Sense Chaos**: He can detect nearby spirits or individuals tainted by chaotic energy.\n- **Limited Airbending**:  \n    While not a master, Silent Song wields airbending with precision, using it primarily for utility and agility:\n    \n    - **Wind-Assisted Leaps**: Propel himself higher or farther.\n    - **Silent Movement**: Dampen sound waves to move noiselessly.\n    - **Projectile Diversion**: Slightly redirect arrows or small projectiles mid-flight.\n- **Weapons Mastery**:\n    \n    - Proficient in dual blades, daggers, and a custom recurved bow.\n\n---\n\n### **Personality**\n\nSilent Song is introspective and reserved, with a constant inner battle against the corruption inside him. He fears losing himself to the shard of Vaatu and, as a result, avoids attachments. However, he harbors a strong moral compass and a sense of duty, especially toward protecting the balance between the physical and spirit worlds.\n\nHis sense of humor is dry, and his voice carries a low, rumbling purr when he speaks. He avoids direct leadership roles but often acts as a quiet protector and advisor.\n\n---\n\n### **Motivations**\n\n1. **Suppressing the Corruption**: Silent Song constantly seeks ways to either remove or control the shard of Vaatu.\n2. **Protecting the Balance**: Despite his dark powers, Silent Song believes in balance and works to ensure neither light nor dark dominates.\n3. **Redemption**: He struggles to prove that he is more than the darkness within him, seeking to atone for the acts he committed under its influence.\n\n---\n\n### **Potential Plot Hooks**\n\n- **Temptation of Vaatu**: The party encounters a scenario where the shard within Silent Song reacts to a surge of dark spirit energy, forcing him to either resist or succumb to Vaatu's will.\n- **The Assassin's Creed**: Silent Song is sent to eliminate a high-ranking figure but learns that their death would tip the balance toward chaos. He must decide whether to follow orders or defect.\n- **A Cure for the Darkness**: The party hears of a lost technique or artifact that might sever Silent Song's link to Vaatu's shard.\n\n---\n\n### Suggested Connections\n\n- **[Vaatu's Influence]**: Details the lingering effects of Vaatu's corruption.\n- **[The Spirit World]**: Context for Silent Song\u2019s origin and the battle where he was tainted.\n- **[The Assassin's Guild]**: Silent Song's possible former allies or enemies.\n- **[The Party]**: How Silent Song integrates into the group.\n\nWould you like this detailed further or tied into a specific campaign event?\n\n"}, "Dms Root/NPCs/Lotus/_Lotus.md": {"size": 92, "type": "text", "text": "\n**Links**:\n- [[Stonewarden Garon]]\n- [[Mistress Akira Meiyu]]\n- [[Grandmaster Iroh Tanaka]]"}, "Dms Root/NPCs/Important/Atash.md": {"size": 1033, "type": "text", "text": "The Last Avatar\nFather of Kaedo\n\nWrite a dreamsequence Monologue for the players. The narrator is Salla. She was the avatar before Atash (the last avatar). She perfected Foambending and is showing a vision in the foam of the ocean waves in the wind. Describe her as standing and almost dancing on top of the water in a wind swept sea as she uses air and waterbending to control the storm around her and create visions in the foam. She taught Atash to use Sandbending to create stories. She explains that now that the avatar spirit is splintered there are many that are born with a part of it. The light and dark parts are not distributed evently and as it grows exponentially it is important too nourish the light energy early on. In the second dream she explains that by showing kindness and bringing joy to the world you can nourish your light energy. She also says that she can feel Atashs spirit still being trapped and the avatar spirit being sucked out of him slowly and potentially painfully. She shows that in a thunderstorm\n"}, "Dms Root/Locations/Tribe of Mahzeen.md": {"size": 4149, "type": "text", "text": "#### **Location and Culture:**\n\nNestled at the edge of the Si Wong Desert\u2019s shifting dunes, the **Village of Mahzeen** stands as a rare bastion of life in the arid wilderness. The settlement lies just a half-day\u2019s journey from an ancient Earthbending Temple, its sandstone spires visible on the distant horizon. Though not large, Mahzeen is renowned for its skilled Sandbenders, who have perfected a unique defensive technique that harnesses the versatile power of sand.\n\nThe villagers live in dome-shaped tents woven from desert fibers, arranged around a central oasis fed by a hidden spring. Worn banners and intricate stone carvings display their heritage: guardians of the desert\u2019s secrets, proud custodians of a bending style that focuses on defense, endurance, and cunning ambush tactics. These Sandbenders follow a strict code of balance, taught to them by the temple monks long ago.\n\n#### **The Sandbending Technique: \u201cSpiked Sand Sphere\u201d**\n\nThe hallmark ability of Mahzeen\u2019s Sandbenders is the creation of a swirling sphere of sand that hardens into a protective shell adorned with razor-like spikes of hardened silica. Both a shield and a weapon, it reflects their philosophy\u2014protection first, then retribution.\n\n**Mechanics:**\n\n- **Cost:** 3 Earth (or Sand) Charges\n    \n- **Type:** [[Action]]\n    \n- **Range:** Self\n    \n- **Effect:**  \n    The Sandbender calls upon the shifting dunes, pulling grains of sand from the ground and condensing them into a floating sphere around their body. The sphere grants temporary hit points and can lash out with sharp spikes.\n    \n    - **Temporary Hit Points (THP):** Gain THP equal to 3 times your level (or a number appropriate for your system) when you form the Spiked Sand Sphere.\n    - **Defensive Bonus:** While the sphere is active, you gain +1 to your Evasion Score and +2 to your AR (or equivalent defensive bonus in your ruleset).\n    - **Duration:** Concentration, up to 1 minute, or until the THP are depleted.\n\n**Attacking with the Sphere:**\n\n- As a [[Bonus Action]] (or [[Reaction]] when hit by a melee attack), you can command the spikes to strike out at a foe within 5 ft.\n- **Attack Roll:** Strength + Proficiency vs. Target\u2019s Evasion Score.\n- **Damage:** 1d8 + Strength modifier piercing damage.\n- **Scaling Damage:** The damage die increases by 1 step (e.g., from 1d8 to 1d10) for every 5 remaining THP in the sphere. For example:\n    - 15+ THP: 1d10 damage\n    - 10+ THP: 1d8 damage\n    - 5+ THP: 1d6 damage\n    - <5 THP: 1d4 damage\n\nAs the THP are chipped away by enemy strikes and your own attacks, the sphere\u2019s integrity diminishes. Fewer remaining THP means smaller, less potent spikes. Skilled Sandbenders learn how to maintain their focus, refortify the sand with additional Charges, or time their attacks at the peak of the sphere\u2019s resilience.\n\n#### **In-World Significance:**\n\n- **Training and Tradition:**  \n    Mahzeen\u2019s Sandbenders perfect the Spiked Sand Sphere technique through years of practice in the harsh desert climate. Initiates spend countless hours balancing water gourds atop columns of shifting sand, refining their focus to keep the sphere stable under pressure.\n    \n- **Trade and Diplomacy:**  \n    Adventurers and scholars traveling to the nearby Earth Temple often stop at Mahzeen to hire guides or seek instruction. Monks from the temple once taught the villagers about spiritual discipline and fortitude, and in return, the Sandbenders offer them their protective services against raiders and feral spirits that prowl the dunes.\n    \n- **Rites of Passage:**  \n    Young Sandbenders earn their place in Mahzeen\u2019s society by successfully conjuring and maintaining a Spiked Sand Sphere under trial conditions\u2014fending off controlled attacks from elders. Only then may they wear the village\u2019s distinctive sand-silk armbands, signifying their mastery of this unique technique.\n    \n\nIn this way, the Spiked Sand Sphere embodies the village\u2019s identity: resilience in adversity, measured strength, and harmony with the unforgiving desert world they call home.\n\n**Links**:\n- [[Proficiency]]\n- [[Strength]]\n\nTags:\n#Earthbending"}, "Dms Root/Locations/Crimson Sails.md": {"size": 3527, "type": "text", "text": "\n\n**Type:** Air Nomad Offshoot  \n**Location:** Cliffside plateaus bordering the Great Si Wong Desert  \n**Role:** High-speed messengers, scouts, and storm-chasers of the desert  \n**Specialized Style:** [[Thermal Riding]]\n\n---\n\n## Overview\n\nThe **Crimson Sails** are a unique, nomadic sect of Air Nomads adapted to life on the edge of the Si Wong Desert. They do not dwell in temples or static sanctuaries, but aboard elegant skiffs and gliders designed to harness the fierce thermal currents that rise from the sun-scorched sand. Painted in brilliant reds and ochres, their vessels shimmer like embers in the sky.\n\nBound by the winds and the rhythms of the desert heat, the Crimson Sails are expert couriers, capable of crossing vast expanses far faster than beasts or traditional caravans. However, their airbending is heavily dependent on the desert\u2019s thermal conditions; at night, without the rising heat, they become grounded or slow-moving.\n\n---\n\n## Culture\n\n- **Daybound Nomadism:** Their society revolves around daylight. At night, the flotilla anchors to cliff alcoves or ruins. Festivals, meals, and gatherings are nocturnal, while travel and work occur during the heat of the day.\n    \n- **Messenger Guild:** The Crimson Sails operate an informal courier and intelligence network across the Earth Kingdom desert frontier. They are trusted by traders, desert clans, and outposts to deliver messages, maps, and even small goods.\n    \n- **Spiritual Traditions:** Though descended from the Air Nomad monastic line, the Crimson Sails follow a more animistic interpretation of airbending\u2014viewing the desert winds as living spirits that must be listened to, not commanded.\n    \n- **Cliff Shrines:** Instead of temples, they maintain wind shrines at high cliffs where they meditate and commune with the desert wind spirits.\n    \n\n---\n\n## Airbending Style: [[Thermal Riding]]\n\nA fast, acrobatic form of airbending that specializes in using heat-induced updrafts. Unlike traditional circular airbending, Thermal Riding involves linear acceleration, vertical climbs, and divebomb maneuvers.\n\n### Key Techniques\n\n- **Updraft Spear:** Used for rapid vertical ascents or launching allies over obstacles.\n    \n- **Searing Glide:** Gliders skim hot surfaces to catch lift or create sudden evasions.\n    \n- **Cyclone Lance:** A spiraling dive technique combining momentum and pressure for duels.\n    \n\n---\n\n## Key Figures\n\n- **Sister Nhari:** Elder wind-priestess and navigator. Keeper of the Flame Charts\u2014ancient wind maps burned into silk.\n    \n- **Korran of the Lances:** Champion aerial jouster and defense leader of the flotilla.\n    \n- **Tama Reed-Singer:** Renowned messenger known for solo crossings of the Empty Expanse.\n    \n\n---\n\n## Conflicts & Hooks\n\n- **A Night-Time Ambush:** Without thermal lift, the Crimson Sails are vulnerable after dark. A rival faction may exploit this to sabotage a key courier mission.\n    \n- **Desert Spirits Stirring:** Strange wind patterns and dust devils are interfering with their gliding. Is it natural\u2014or something darker awakening beneath the sands?\n    \n- **A Lost Shrine:** A sandstorm uncovers an ancient Air Nomad relic near a long-buried cliff shrine. The Crimson Sails must recover it before sandbenders do.\n    \n\n---\n\n## Connections\n\n- Allies of the [[Si Wong Water Raiders]] for mutual desert survival.\n    \n- Sometimes in conflict with [[Sandbender Tribes]] who view them as sky-interlopers.\n    \n- Rumored to ferry secrets for the [[White Lotus]] across desert borders."}, "Dms Root/Locations/Kugluktuk/Kugluktup.md": {"size": 4249, "type": "text", "text": "\n\n**Type:** Water Tribe Island Village  \n**Location:** Remote island far from the Northern Water Tribe ice shelves  \n**Affinity:** [[Waterbending]], [[Spirits]]\n\n---\n\n## Overview\n\nKugluktup is a secretive and remote waterbending village located on a rugged island surrounded by turbulent seas. It lies several days' journey south of the Northern Water Tribe's territories. Due to its isolation and history of raids by pirates and foreign explorers, the villagers are notoriously wary and openly hostile to outsiders. Their waterbending traditions have diverged significantly from the mainstream Northern Tribe practices, adapting to a more self-sufficient, ocean-based survival.\n\n---\n\n## Unique Features\n\n### Oceanwater Desalination Technique\n\nKugluktup's greatest innovation is their sacred **Desalination Ritual**, used to convert seawater into fresh water. This process is spiritual as much as it is practical and is central to village survival. It involves collaboration with the village's guardian spirit, the [[Eelstar]].\n\n### The [[Eelstar]]\n\nA hybrid spirit beast, the Eelstar resembles five long eels fused at the tail to form a living starfish-like body. It is an ancient spirit bound to the island, often dwelling in underwater caverns accessible only through intricate coral tunnels.\n\n- **Elemental Power:** Uniquely, the Eelstar can breathe fire (a rare trait among ocean spirits), which it uses to heat seawater to boiling during the desalination ceremony. Waterbenders then condense and harvest the purified steam into fresh water.\n    \n- **Temperament:** Benevolent but alien in its thinking, the Eelstar respects tradition and punishes disrespect. It chooses one acolyte per generation to serve as its interpreter and medium: the **Boilkeeper**.\n    \n\n---\n\n## Culture\n\n- **Isolationist Ethos:** Kugluktup culture is insular. Children are taught caution and mistrust of outsiders from birth. Stories of invaders stealing knowledge or corrupting the Eelstar are retold often.\n    \n- **Spiritual Bond:** The villagers see themselves as stewards of both the sea and the Eelstar. Every household contributes to tending coral beds, cleaning beaches, and preserving balance with the spirit.\n    \n- **Tattoos of the Tides:** Adult waterbenders earn blue-green tattoos patterned after ocean currents. Each wave line signifies a milestone in mastery of their local bending techniques.\n    \n\n---\n\n## Waterbending Style\n\nKugluktup's bending style is:\n\n- **Flowing and Sudden:** Movements mimic sudden waves, surges, and sharp contractions like jellyfish pulses.\n    \n- **Saltwater Versatility:** Benders here specialize in manipulating saltwater directly, with subtle techniques to shift salinity and temperature. Many learn to pull fog from the sea for concealment.\n    \n- **Condensation Arts:** A unique branch of waterbending that involves evaporating and condensing water in minute amounts, especially during the desalination rituals.\n    \n\n---\n\n## Key Figures\n\n### Naqqi the Boilkeeper\n\n- **Role:** Spiritual leader and medium for the Eelstar\n    \n- **Traits:** Stern, enigmatic, speaks rarely and often in parables\n    \n- **Skills:** Master of condensation arts, communicates directly with the spirit in dreams and trance\n    \n\n### Tuliq the Tideguard\n\n- **Role:** Military captain and protector of the shores\n    \n- **Traits:** Fierce, pragmatic, believes in pre-emptive defense\n    \n- **Skills:** Skilled warrior and waterbender with techniques that use high-pressure saltwater jets\n    \n\n### Pana the Listener\n\n- **Role:** One of the few curious about the outside world\n    \n- **Traits:** Quiet, observant, secretly collects maps and foreign items\n    \n- **Potential Hook:** Might secretly assist travelers if convinced they mean no harm\n    \n\n---\n\n## Adventure Hooks\n\n- A drought weakens the Eelstar, and Kugluktup's hostility intensifies. The players must convince the villagers to let them help.\n    \n- A rogue spirit has infected one of the Eel limbs, twisting it into an aggressive form. The Boilkeeper calls for aid.\n    \n- Pirates are seeking the secret of the Desalination Ritual. The players must decide whether to defend Kugluktup or broker peace.\n    \n\n---\n\n## Links\n\n- [[Waterbending]]\n    \n- [[Spirits]]\n    \n- [[Eelstar]]"}, "Dms Root/Locations/Patola_Mountain_Cities/City_of_Zephyros.md": {"size": 2806, "type": "text", "text": "# City of Zephyros\n\n**Tags:** #PatolaMountainRange #Zephyros #Airbending #Monastery\n\n## Overview\nNestled on a high plateau of the Patola Mountain Range, **Zephyros** is a small yet vibrant city, renowned for its connection to airbending arts and the wind-swept beauty of its surroundings. It serves as home to the revered **[Monastery of the Whispering Winds]**, a center for training advanced airbending techniques that amplify sound vibrations.\n\n---\n\n## Features of Zephyros\n\n### Geography\n- Situated on a plateau surrounded by cliffs and narrow mountain passes.\n- Frequent strong winds make it an ideal location for the Monastery\u2019s practices.\n\n### Trade and Economy\n- Known for its windmill-powered grain mills.\n- Exports rare herbs and teas found only in the Patola Mountain Range.\n\n### Culture\n- A city that reveres sound and storytelling.\n- Town squares are filled with musicians, poets, and storytellers showcasing their art.\n- Festivals often feature performances designed to highlight the interplay of sound and wind.\n\n---\n\n## Monastery of the Whispering Winds\n\n### Purpose\nThe Monastery is dedicated to teaching an advanced airbending technique that allows practitioners to amplify and hear distant conversations by attuning themselves to sound vibrations carried by the air.\n\n### Training Grounds\n- Open-air platforms surrounded by wind chimes and vibrating strings.\n- Practice tools include resonance stones and air-tuned acoustic instruments.\n\n### Philosophy\n- Emphasizes harmony with nature and the spirits of the wind.\n- Believes that sound is a reflection of the balance between physical and spiritual realms.\n\n---\n\n## History\n- The Monastery\u2019s founding is tied to a shared legend with **[Murmura]**. Supposedly, the monasteries were founded by twin brothers with differing philosophies. However, in reality, it was a single individual who had discovered advanced soundbending techniques. \n- Using his abilities, he projected his voice into a statue at the neighboring site, creating the illusion of another founder.\n- This fabricated rivalry was intended to drive both monasteries to compete, thereby accelerating the development of soundbending techniques.\n\n---\n\n## Relationship with [Murmura]\n- A long-standing rivalry exists between Zephyros and the neighboring city of **[Murmura]**.\n- The monks of the **[Monastery of the Silent Echo]** in Murmura teach counter-techniques to shield sound, often leading to philosophical and practical conflicts.\n\n---\n\n## Potential Story Hooks\n- A tournament is held to demonstrate airbending mastery, drawing competitors and spectators from afar.\n- Rumors of a spy using the Whispering Winds technique strain relations with Murmura.\n- A mysterious artifact tied to the origins of the Monastery is discovered, sparking debates over its ownership.\n"}, "Dms Root/Locations/Patola_Mountain_Cities/Sonar Earmur.md": {"size": 2791, "type": "text", "text": "# Earmur\n\n**Tags:** #PatolaMountainRange #Fauna #Soundbending\n\n## Overview\nThe **Sonar Earmur* is a unique and fascinating creature native to the Patola Mountain Range. A Lemur with huge ears. This animal is renowned for its natural attunement to soundbending, which it uses to hunt insects and navigate the rugged terrain of its habitat.\n\n---\n\n## Physical Description\n- **Fur:** Dense, velvety fur in shades of dark gray and brown, providing camouflage against rocky surroundings.\n- **Eyes:** Small and poorly developed, as the creature relies on sound rather than sight.\n- **Ears:** Oversized and highly sensitive, capable of detecting the faintest vibrations in the air.\n- **Claws:** Strong, digging claws adapted for burrowing into soft soil and crevices.\n\n---\n\n## Behavior\n### Hunting\n- The Sonar Earmur uses a form of natural soundbending to emit focused sound waves. By controlling the vibrations in the air, it can detect and pinpoint the location of insects even in complete darkness.\n- Once an insect is located, it employs either its claws to dig them out of burrows or its quick reflexes to snatch them mid-flight.\n\n### Habitat\n- Prefers caves, cliffside crevices, and underground burrows in the Patola Mountain Range.\n- Often found near Zephyros and Murmura, where the winds enhance its soundbending abilities.\n\n### Communication\n- Communicates with others of its kind using a series of ultrasonic chirps and vibrations. These signals are modulated to convey a wide range of information, from territory marking to mating calls.\n\n---\n\n## Connection to Soundbending\n- The Sonar Earmur\u2019s mastery of sound manipulation has made it an object of study for both the **[Monastery of the Whispering Winds]** and the **[Monastery of the Silent Echo]**.\n- Monks observe its behavior to refine their own techniques, often mimicking its sound-based hunting methods or its ability to create \"silence zones\" while resting.\n- Legends in both Zephyros and Murmura suggest that early soundbending techniques were inspired by observing this creature.\n\n---\n\n## Potential Story Hooks\n- **A Missing Colony:** A colony of Sonar Earmurs near Zephyros disappears, disrupting the local ecosystem and sparking tension between the two cities as they blame each other.\n- **A Rare Variant:** A golden-furred Sonar Earmur, believed to be a spiritual guardian, is spotted near the Monastery of the Silent Echo, prompting a race to protect or capture it.\n- **Training Aid:** Monks enlist the players to help track and capture a Sonar Earmur to study its abilities, only to discover a greater mystery involving the creature.\n\n---\n\nThe Sonar Earmur is both a vital part of the Patola Mountain Range\u2019s ecosystem and a source of inspiration for soundbenders, embodying the harmony and power of sound in nature.\n"}, "Dms Root/Locations/Patola_Mountain_Cities/City_of_Murmura.md": {"size": 2861, "type": "text", "text": "# City of Murmura\n\n**Tags:** #PatolaMountainRange #Murmura #Airbending #Monastery\n\n## Overview\nTucked away in the shadows of the Patola Mountain Range, **Murmura** is a quiet city known for its mysterious and serene atmosphere. It is the home of the **[Monastery of the Silent Echo]**, where airbenders train in creating sound barriers that shield conversations and disrupt vibrations.\n\n---\n\n## Features of Murmura\n\n### Geography\n- Located in a valley surrounded by towering cliffs.\n- Natural acoustics make it an ideal place for sound-dampening practices.\n\n### Trade and Economy\n- Renowned for stone masonry and crafting architectural elements designed to manage acoustics.\n- Produces soundproofing materials that are sought after by other cities.\n\n### Culture\n- Values silence and mindfulness.\n- Rituals and celebrations often emphasize visual and tactile elements, such as light displays and intricate carvings, over sound.\n- Meditative practices are common, with many citizens adopting the Monastery\u2019s philosophy of inner peace.\n\n---\n\n## Monastery of the Silent Echo\n\n### Purpose\nThe Monastery focuses on teaching airbenders how to create zones of silence and shield conversations. This technique is often used for privacy, protection, and maintaining tranquility in tense situations.\n\n### Training Grounds\n- Stone-walled courtyards designed to absorb and reflect sound.\n- Training tools include resonance chambers and sound-dampening fabrics.\n\n### Philosophy\n- Advocates the sanctity of privacy and the importance of silence for spiritual growth.\n- Views sound as a powerful force that must be controlled to prevent discord.\n\n---\n\n## History\n- The Monastery\u2019s founding is tied to a shared legend with **[Zephyros]**. Supposedly, the monasteries were founded by twin brothers with differing philosophies. However, in reality, it was a single individual who had discovered advanced soundbending techniques.\n- Using his abilities, he projected his voice into a statue at the neighboring site, creating the illusion of another founder.\n- This fabricated rivalry was intended to drive both monasteries to compete, thereby accelerating the development of soundbending techniques.\n\n---\n\n## Relationship with [Zephyros]\n- Tension with the neighboring city of **[Zephyros]** due to conflicting airbending philosophies.\n- The monks of the **[Monastery of the Whispering Winds]** in Zephyros focus on amplifying sound, creating frequent debates and competitions.\n\n---\n\n## Potential Story Hooks\n- A group of monks from the Silent Echo suspect foul play when one of their techniques fails during an important negotiation.\n- A rare material required for the Monastery\u2019s soundproofing methods is discovered near Zephyros, leading to disputes.\n- Both cities face a shared threat that disrupts sound and air currents, forcing cooperation between the two monasteries.\n"}, "Dms Root/Locations/Visual References/Pasted image 20250104171805.png": {"size": 2246696, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/Locations/Sekanto/Plot Hook \u2013 The Gleaming Stone Above the Sands.md": {"size": 5955, "type": "text", "text": "\n#### \ud83e\udded Hook Summary:\n\nWhile traveling the harsh Si Wong Desert, the heroes spot a mysterious **gleam atop a sandstone spire**\u2014a rhythmic flash of white light that appears unnatural, almost like a signal. Locals mention an ancient legend of a \u201cstar-serpent\u201d and a tribe of light-forgers hidden within the rock. The party must brave scorching winds, treacherous slopes, and possibly spiritual interference to uncover the truth.\n\n---\n\n### \ud83d\udde3\ufe0f **GM Read-Aloud \u2013 Desert Discovery**\n\n> _As the desert heat shimmers on the horizon, something catches your eye \u2014 a glint. Then another. A pulse of light, like lightning trapped inside glass. It blinks from the top of a jagged rock mesa that juts out from the dunes like a spear aimed at the sun._\n> \n> _\u201cNo fire shines like that in this heat,\u201d one of you murmurs. The light flickers again \u2014 three pulses. Then darkness._\n> \n> _A traveler nearby mutters nervously, \u201cYou saw the serpent\u2019s signal. The old folk say that\u2019s where the Gleam-Tamers live. Nobody climbs that rock and comes back... unless the spirit lets them.\u201d_\n> \n> _A dry wind howls, and the mesa looms ahead \u2014 impossibly tall, its surface riddled with cracks and veins of quartz._\n\n---\n\n### \ud83e\ude9c **Optional Reasons to Climb (Motivations by Character Type)**\n\n- **Spiritually Attuned Characters**: You feel a strange _resonance_ from the flashes \u2014 as if a spirit is calling out or warning you.\n    \n- **Scholars/Healers**: Rumors say a rare crystal found only in the rock's core can amplify healing or spiritual communion.\n    \n- **Treasure Hunters**: The \u201cFlashing Coil\u201d is said to hoard spirit relics and glowing gemstones worth a king\u2019s ransom.\n    \n- **Firebenders/Earthbenders**: Local lore speaks of ancient hybrid bending techniques passed down by an isolated sect.\n    \n\n---\n\n### \ud83c\udfaf Next Steps\n\n- Navigating the harsh desert terrain\n    \n- Climbing the rock safely (natural hazards, mirage illusions, perhaps a Chameleonbat ambush)\n    \n- Discovering the crystal gate to [[Village of Sekan'to]], sealed until one \u201coffers a reflection\u201d\n    \n\nWould you like me to create climbing challenges or a mini-dungeon encounter for the ascent?\n\n### [Journey Up the Si Wong Rock]]\n\n**Structure:**  \nThe climb is broken into **four major segments**, each with physical, spiritual, or environmental hazards, culminating in the crystal gate to the hidden village.\n\n---\n\n### \ud83c\udf35 **Segment 1: Base of the Mesa \u2013 The Bleached Graveyard**\n\n> _The desert winds scream around the base of the spire, a thousand grains of sand scraping like whispers. Half-buried bones and rusted tools litter the area \u2014 relics of past climbers who failed._\n\n#### Challenges:\n\n- **Survival (DC 12):** Navigate boiling sands and choking heat\n    \n- **Lore Check (DC 10):** Discover tales of the serpent spirit protecting the cliffs\n    \n- **Spirit Disturbance:** A faint ringing sound in the air grows louder the closer they get \u2014 a harmonic warning from [[Raza\u2019tel]]\n    \n\n**Optional Encounter:**\n\n- **Chameleonrat Scout Pack**: A small group hides in the rocks to ambush CowMoles. May stalk the party if they linger.\n    \n\n---\n\n### \ud83e\uddd7 **Segment 2: The Cracked Wall \u2013 Heat, Height, and Light**\n\n> _You begin your climb. The stone burns beneath your fingers. Quartz veins run like scars along the cliffside, catching the sunlight and scattering it into dazzling bursts._\n\n#### Hazards:\n\n- **Climbing (DC 13, Group Check):** 200 feet of treacherous vertical surface; crystal edges can cut or slip\n    \n- **Light Hazard:** Reflected sunlight can **blind** (DC 14 Con Save or disadvantage on next [[Action]])\n    \n- **Mirage Spirits:** Dancing lights and whispering voices try to lure climbers into unsafe handholds (Illusion Save or Insight DC 14)\n    \n\n**Optional Obstacle:**\n\n- A **collapsed ledge** forces players to creatively bend or engineer a solution \u2014 e.g., Earthbenders create a ledge, Firebenders burn-etch a grip path, others use rope tricks or teamwork.\n    \n\n---\n\n### \ud83c\udf2c\ufe0f **Segment 3: The Gleaming Funnel \u2013 Wind Mirror Pass**\n\n> _You reach a hollow tunnel carved into the rock, where winds howl like beasts. Shards of mirror-like crystal hover loosely here, caught in ancient drafts, spinning on unseen currents._\n\n#### Hazards:\n\n- **Wind Gales (DC 14 Dex Save):** Failures may drop items or be pushed toward jagged crystal walls\n    \n- **Crystal Echoes:** The wind can \u201csing\u201d through crystals, causing psychic pressure (DC 12 Wis Save or minor disorientation)\n    \n- **Teamwork Challenge:** To move safely, the party must time their steps with the shifting winds \u2014 coordination and clever problem solving are key.\n    \n\n**Narrative Beat:**\n\n- One crystal may momentarily reflect a character\u2019s spirit double \u2014 a vision from the [[Spirit World]] or a flash of [[Raza\u2019tel]]'s tail\n    \n\n---\n\n### \u26e9\ufe0f **Segment 4: The Vein Gate \u2013 Entry to Sekan\u2019to**\n\n> _A forked crevice leads into shadow. Then you see it \u2014 a sealed archway of shaped crystal, half-grown and half-carved, pulsing faintly with reddish light. Symbols shimmer across the surface as if waiting to be understood._\n\n#### Gate Puzzle:\n\n- **Requires Light Offering**: To open the gate, a **beam of natural or bending light** must be aligned through a **mirror-crystal circle** to hit a central glyph.\n    \n- Firebenders can do it directly; others must improvise with torches, reflection, or manipulation.\n    \n\n**Optional Guardian Test:**\n\n- A voice booms in harmony:\n    \n    > \u201cOnly those who shine together may pass. Show us your unity.\u201d\n    \n    - Players may need to perform a teamwork task, or two members combine bending styles or solve a pattern puzzle together.\n        \n\n---\n\n### \ud83c\udfc1 **Outcome**\n\nOnce the gate opens, the party enters the first chamber of [[Village of Sekan'to]]: a domed entry hall filled with glowing crystal murals, the scent of scorched stone, and the first echoes of approaching footfalls..."}, "Dms Root/Locations/Sekanto/Sekan'to Crystalfire Style.md": {"size": 2100, "type": "text", "text": " \n**Elemental Roots:** Firebending + Crystal-focused Earthbending  \n**Nickname:** _Crystalfire Flash_ or _Gleam-bending_\n\n**Combat Techniques:**\n\n- **Flashflare Strike:** A sudden burst of white-hot light from a crystal bomb, used to blind and disorient\n    \n- **Radiant Brand:** Fire-infused crystal shards that cling to a target and continue glowing intensely\n    \n- **Mirror Serpent Dance:** Reflective crystals scatter light from one another, creating blinding zones and illusions\n    \n\n**Utility Techniques:**\n\n- **Flaretrail Pathing:** Crystals laid in advance can be ignited to form a glowing path or trap\n    \n- **Echo Pulse:** Crystals resonate with flame, creating a pulse of light and sound that acts like echolocation\n    \n\n**Spiritual Aspects:**\n\n- Every crystal must be \"awakened\" with a ritual guided by [[Raza'tel, the Flashing Coil]], invoking its inner light\n    \n\n**Training:**\n\n- Young benders must master both the meditative patience of earthbending crystal shaping and the passionate intensity of fire\n    \n\n---\n\n### \ud83d\udcc4 [[Raza'tel, the Flashing Coil]]\n\n**Type:** Spirit of Light, Trickery, and Dazzling Revelation  \n**Form:** A serpentine creature with a bioluminescent body. Its tail ends in a sharp crystalline rattle that emits intense light flashes. Wings are shaped like firefly lanterns.\n\n**Behavior:**\n\n- Elusive and curious, often tests those who seek its aid with riddles or challenges in pitch darkness\n    \n- Appears as a trail of flashing lights before revealing its full form\n    \n- Prankster but fiercely protective of Sekan\u2019to and its crystals\n    \n\n**Abilities:**\n\n- Emits blinding pulses that disrupt both spirit and human senses\n    \n- Can communicate through light patterns\n    \n- Often appears during major rites or battles, dancing in the sky above the Crucible\n    \n\n**Legends Say:**\n\n- It was born from a dying comet and a spirit of a desert snake; one represented knowledge, the other fire\n    \n- Once blinded a Fire Nation battalion to protect Sekan\u2019to from conquest\n    \n\n**See also:** [[Village of Sekan'to]] for how the people venerate Raza'tel"}, "Dms Root/Locations/Sekanto/Village of Sekanto.md": {"size": 3330, "type": "text", "text": "\n#### \ud83c\udf0d **Setting: Village of Sekan'to (Si Wong Desert)**\n\n- Hidden **within a towering mesa** in the **Si Wong Desert**, Sekan'to is carved into rich quartz veins deep in the desert\u2019s sandstone spires.\n    \n- **Subterranean galleries** and halls protect the village from heat and sandstorms.\n    \n- **Flame-infused crystals** illuminate the stone tunnels, casting glowing, angular patterns on the walls.\n    \n\n**Major Locations:**\n\n- **Crystalfire Circle** \u2013 the ruling council who sit in the mirrored Hall of Judgment\n    \n- **Forge-Shrines** \u2013 subterranean smithies where fire and earth unite to purify and shape crystals\n    \n- **Crucible of Gleam** \u2013 an arena embedded in a polished stone bowl that uses reflected sunlight and fire to dazzle fighters\n    \n\n---\n\n#### \ud83d\udd25 **Unique Bending Style: Sekan'to Crystalfire Style**\n\n- A refined fusion of **firebending** and **crystal-earthbending**, adapted to desert minerals\n    \n- Combines **light, heat, and mineral reflection** to disorient foes and control terrain\n    \n\n**Key Techniques:**\n\n- **Flashflare Strike** \u2013 a burst of searing, white-hot light using quartz lenses\n    \n- **Radiant Brand** \u2013 molten fire-laced crystal that clings and continues to burn\n    \n- **Mirror Serpent Dance** \u2013 dazzling illusions using crystalline reflection\n    \n\n**Utilities:**\n\n- **Flaretrail Pathing** \u2013 pre-laid glowing paths in the dunes or tunnels\n    \n- **Echo Pulse** \u2013 light and fire resonation to locate movement or invisible foes underground\n    \n\n---\n\n#### \ud83d\udc0d **Spirit Patron: [[Raza'tel, the Flashing Coil]]**\n\n- A massive **serpent spirit** with **firefly wings** and a **smoldering crystal tail**\n    \n- Dwells in the **lightless stone hollows** beneath the mesa\n    \n- Spirit of **Light, Trickery, and Hunger**\n    \n- Protects the village from **Chameleonrats**, but his hunger is growing unnatural\n    \n- Recently nearly attacked a child \u2014 only pacified by a stranger\u2019s meat offering\n    \n\n---\n\n#### \ud83d\udc8e **Main Plot Hook: Raza'tel\u2019s Bargain**\n\n- Raza'tel has stolen back the **[[Resonance Stone]]**, an artifact from the [[Black Lotus]]\n    \n- He offers the stone to the party **only if they hunt and bring him 5 Chameleonrats**\n    \n- Warns the party of dire consequences if they lie, offer substitutions, or try to take it by force\n    \n\n---\n\n#### \ud83e\udded **Quest Threads**\n\n- **Primary Quest:** Hunt 5 Chameleonrats in the sun-scarred tunnels and bring them to Raza'tel\n    \n- **Mystery Subplot:** Discover the identity and motives of the stranger who fed Raza'tel\n    \n- **Moral Dilemma:** Should a dangerous spirit be fed, appeased, or sealed away?\n    \n\n---\n\n#### \ud83e\uddff **Artifacts**\n\n- **[[Resonance Stone]]** \u2013 A powerful, harmonic crystal that anchors spiritual balance in the desert\n    \n- Held by Raza'tel, but desired by the [[Black Lotus]]\n    \n- Could be used to stabilize portals, protect Sekan'to, or amplify spirit communications\n    \n\n---\n\n#### \ud83d\udc3e **Creature Index**\n\n- **[[MoleCows]]** \u2013 Blind, round-bodied desert livestock; burrowers that sniff out underground water\n    \n- **[[Chameleonrats]]** \u2013 Wolf-sized predators that blend with desert stone; pack hunters with extending tongues\n    \n- **[[ChameleonBats]]** \u2013 Night-flying, heat-sensitive beasts with light-reflective skin; attack livestock and stray villagers"}, "Dms Root/Locations/Sekanto/Raza'tel, the Flashing Coil.md": {"size": 2318, "type": "text", "text": "DC 17 \n\n**Type:** Greater Spirit  \n**Domain:** Light, Trickery, Fire  \n**Alignment:** Chaotic Neutral  \n**Challenge Rating:** 9  \n**Lair:** The Crystal Hollow beneath Sekan\u2019to\n\n\n21\n27\n32\n36\n43\n47\n\n---\n\n**Appearance:**  \nA sinuous spirit with translucent scales that shimmer with inner fire. Its wings resemble glowing firefly lanterns, and its rattlesnake-like tail ends in a crystal that emits dazzling pulses of light.\n\n\nWhooo are you to stand in front of me without kneeling?\n\n---\n\n#### **Abilities:**\n\n**\u27a4 Blinding Flash (Recharge 4\u20136):**  \nRaza'tel emits a pulse of searing white light from its tail crystal. All creatures within 60 ft must make a **CON Save (DC 17)** or be **blinded** for 1 minute. Success reduces to 1 round. Spirit-bonded individuals from Sekan\u2019to can use [[Reaction]] to shield themselves with a flare crystal.\n\n**\u27a4 Serpent\u2019s Dance:**  \nCan move through tight spaces without penalty and ignores difficult terrain created by crystal or fire. Gains **evasion** and **uncanny dodge**.\n\n**\u27a4 Crystal Pulse (1/turn):**  \nCan emit a resonating pulse that causes infused crystals in a 90 ft radius to either flare with light, explode in fire (3d6 fire dmg), or emit echo-location pings that reveal invisible or hidden creatures.\n\n**\u27a4 Flashmeld:**  \nCan become pure light and move 120 ft instantly to any light source it can see. Cannot be targeted while in transit.\n\n**\u27a4 Trickster of Light:**  \nCan cast the following spells (or bending analogues), DC 16:\n\n- _Mirror Image_, _Faerie Fire_, _Invisibility_, _Major Image_, _Flame Strike_\n    \n\n---\n\n#### **Legendary actions (3/turn):**\n\n**Radiant Coil:** Constricts a foe in a loop of glowing spirit-light; target must pass STR Save (DC 15) or be restrained and take 2d6 radiant + 2d6 fire dmg.\n\n**Flashbang Glare:** Forces one target to make a WIS Save (DC 16) or be stunned by overwhelming light and visions until end of its next turn.\n\n**Coilstep Mirage:** Creates an illusory double that mimics his movements until hit (AC 15).\n\n---\n\n#### **Lair actions (in Crystal Hollow):**\n\n- Reflective surfaces can bend light, causing attacks to target illusions (Disadvantage on ranged attacks).\n    \n- Once per round, a blinding flash bursts from a wall, forcing DC 15 CON Save or be dazed (disadvantage on next attack or save).\n    \n\n---"}, "Dms Root/Locations/Sekanto/Raza'tel\u2019s Hunger and the Resonance Stone.md": {"size": 3477, "type": "text", "text": "### \ud83d\udcc4 \n**Overview:**  \nRaza'tel, Spirit of Flash and Fang, has grown erratic and testy in recent weeks. Once content with the offerings of the villagers and occasional predator flesh, he has begun lurking nea
