eamup \n#Level3 \n#water \n"}, "Player Root/Rules/Bending Rules/Team-up Moves/Glass Fruit Bending/Soulseed Harmonic Seal.md": {"size": 518, "type": "text", "text": "\n#Action\n#Reaction \n\n\nReaction: Must be initiated by a Earthbender in line of sight \n\n\n- Range: within line of sight up to 100 meter\n- **Duration:** Lasts until stopped concentrating or for 1 hour.\n\n- **Effect:** \n\t- As the air vibrates with a cleansing energy as creatures of your choice within radius gain 10 * X [[Barrier]] (if this barrier is halfed for one creature its halfed for all)\n\t- If X \u2265 15, the seal also protects against being [[Immobilised]]  \n    \n\n#defensive \n#Level1 \n#earth\n#player_root\n#teamup\n\n"}, "Player Root/Rules/Bending Rules/Team-up Moves/Glass Fruit Bending/The Glassfruit Trees.md": {"size": 655, "type": "text", "text": "\n#\ud83c\udf47_Origin:\n\nHigh on the outer cliffs of Omashu and the surrounding valley grow the rare **Glassfruit Trees**\u2014bizarre plants that draw heavy mineral content from the stone and soil, producing **glass-like fruit** with dense crystalline seeds. These seeds:\n\n\n- Grow in **five known varieties**, each with distinct elemental-reactive properties.\n    \n- Can be manipulated by Earthbenders with precise control, refined through spiritual discipline.\n    \n\nLocal legend says the **Earth Lion Turtle** left these trees here, believing their presence would help the people **grow with stone, not just build from it**.\n\n[[Player Root]]\n\n#earth\n#player_root\n\n"}, "Player Root/Rules/Bending Rules/Team-up Moves/Glass Fruit Bending/FlashLemon Refractor Beam.md": {"size": 473, "type": "text", "text": "#Action\n#Reaction \n\nReaction: Must be initiated by a Firebender in line of sight \n\n#lingering_effect \n\nFocused light is amplified by mirrored shards into a blinding beam.\n- **Effect:** \n- Range: 10X meter radius Sphere\n- **Effect:** \n\t- Targets in area must make  a DC X * 2 [[Int]] save to shield or close their eyes or be Blinded for one turn\n\t-  If X \u2265 10, Deal **Xd4 radiant damage** to all creatures in the area\n    \n\n\n#teamup\n#fire \n#earth\n#player_root\n#Level1 \n\n\n\n"}, "Player Root/Rules/Bending Rules/Team-up Moves/Glass Fruit Bending/Resonant Collapse (Blue Soundbanana).md": {"size": 417, "type": "text", "text": "\n#Action\n#Reaction \n\nReaction: Must be initiated by a Airbender in line of sight \n\n\n#lingering_effect \n\nA soundblast builds from multiple frequencies and shatters the ground.\n- Range: 2X meter radius Sphere\n\n- **Effects:**\n\t- Targets in area must make CON save of X*2 or take **Xd8 thunder damage** and fall prone\n\t- Earth terrain in the zone becomes **difficult terrain**\n\n#Level1 \n#earth\n#air \n#player_root\n#teamup\n"}, "Player Root/Rules/Bending Rules/Team-up Moves/Glass Fruit Bending/Glassfruit Seed Mechanics.md": {"size": 583, "type": "text", "text": "\n#Glassfruit_Team-Up_Techniques\n\n### X = y*z\n\n-  are the number of **bending slots** contributed by each bender.\n    \n- This rewards **balanced team effort** over just one person dumping points.\n    \n-`X = y \u00d7 z`.\n    \n\n> **Example:**\n> \n> - Earthbender contributes 2 slots (y = 2)\n>     \n> - Firebender contributes 3 (z = 3)\n>     \u2192 `X = 2 \u00d7 3 = 6`\n\n\nThese are **powerful, multi-element, terrain-altering** moves that consume Glassfruit Seeds. Each scales based on X and has different effects depending on the seed used.\n\n#Earth \n#Air\n#Water\n#Fire\n#teamup \n#earth\n#player_root\n\n"}, "Player Root/Rules/Bending Rules/Team-up Moves/Glass Fruit Bending/BlueBerry Glass Surge.md": {"size": 439, "type": "text", "text": "\n#Action\n#Reaction \n\nReaction: Must be initiated by a Waterbender in line of sight \n\n[[Lingering Effect]]\n\nStick and grow trapping enemies and reshaping the terrain.\n- Range: 2X meter radius Sphere\n\n- **Effects:** \n\t- Targets in area must make  a DCX * 2 [[Dex]] save to jump aside or get Immobilised in cold soft and barely liquid Glass.\n\t- If X \u2265 8, brambles regenerate once if destroyed\n\n\n#Level1 \n#earth\n#water \n#player_root\n#teamup\n"}, "Player Root/Rules/Bending Rules/Team-up Moves/Glass Fruit Bending/Inferno Bloom (Red Flamegrape).md": {"size": 270, "type": "text", "text": "#Action\n#Reaction \n\n\nReaction: Must be initiated by a Firebender in line of sight \n\n[[Lingering Effect]]\n\n- Range: 2X meter radius Sphere\n\n- **Effect:** Explosion in an area, dealing Xd6  bludgeoning + half fire damage\n    \n\n\n#Level1 \n#earth\n#fire \n#player_root\n#teamup\n"}, "Player Root/Rules/Bending Rules/Team-up Moves/Air-Earth/Sandstream.md": {"size": 384, "type": "text", "text": "\n#Action \n#Reaction \n\nEach Bender-decides to which pool to add their Bending slots:\n-  **Y**(Earth): Yd12 Damage per projectile\n- **X**(Air): X Projectiles [[Air Attack Roll]]\n- **Range:** Y * X meters from the Airbender \n \n \n- One Earthbender shoots Y Sand Projectiles (rolls the Damage roll) and the Airbender controlls them to home to the X Targets)\n\n\n#Level1\n#air\n#earth\n#teamup\n\n"}, "Player Root/Rules/Bending Rules/Team-up Moves/Air-Fire/Flaming Funnel.md": {"size": 396, "type": "text", "text": "#Action \n#Reaction \n\nEach Bender-decides to which pool to add their Bending slots:\n-  **Y**(Fire): Yd12 Fire Damage\n- **X**(Air): X * 10 meter Range [[Air Attack Roll]]\n\n- One Firebender shoots a roaring flame without carefull aiming (rolls the Damage roll) and the Airbender creates an air funnel that controlls it to home to a distant target ([[Air Attack Roll]])\n\n#teamup\n#Level3 \n#air \n#fire "}, "Player Root/Rules/Bending Rules/Fire/Firebending Moves/Firebending Move.md": {"size": 84, "type": "text", "text": "```markdown\n#Collectionfile\n[[Firebending]]\n\n#Collectionfile\n#fire\n#player_root\n```\n"}, "Player Root/Rules/Bending Rules/Fire/Firebending Moves/Level 5/Volcanic_Eruption.md": {"size": 430, "type": "text", "text": "```markdown\n#Volcanic_Eruption\n#firebending #level5\n\n- **Volcanic Eruption**\n  - **[[Action]]:** 1 [[Action]].\n  - **Range:** 40 * [[Firebending Slot]] meters.\n  - **Duration:** Instantaneous.\n  - **Damage:** 6d10 fire.\n  - Create a massive eruption of molten rock and fire at a target point, affecting all creatures in a 30-foot radius.\n[[Firebending]]\n[[Firebending Move]]\n[[Player Root]]\n\n#firebending\n#level5\n#player_root\n```\n"}, "Player Root/Rules/Bending Rules/Fire/Firebending Moves/Level 5/Blazing Phoenix.md": {"size": 324, "type": "text", "text": "\n#Action\n#lingering_effect \n\n\n  - **Range:** 3 * [[Firebending Slot Progression]] meters.\n  - **Duration:** Instantaneous.\n  - **Damage:** [[Firebending Slot Progression]] * 2 d12 fire.\n  - Summon a massive phoenix of fire that flies in a straight line within range, damaging all in its path.\n\n\n\n#Level5\n#fire\n#player_root\n\n"}, "Player Root/Rules/Bending Rules/Fire/Firebending Moves/Level 5/Meteor_Shower.md": {"size": 418, "type": "text", "text": "```markdown\n#Meteor_Shower\n#firebending #level5\n\n- **Meteor Shower**\n  - **[[Action]]:** 2 actions.\n  - **Range:** 50 * [[Firebending Slot]] meters.\n  - **Duration:** 3 rounds.\n  - Summon fiery meteors that fall in a 50-foot radius. Each round, creatures in the area must make Dexterity saving throws or take 4d6 fire damage.\n[[Firebending]]\n[[Firebending Move]]\n[[Player Root]]\n\n#firebending\n#level5\n#player_root\n```\n"}, "Player Root/Rules/Bending Rules/Fire/Firebending Moves/Level 5/Infernal_Form.md": {"size": 400, "type": "text", "text": "```markdown\n#Infernal_Form\n#firebending #level5\n\n- **Infernal Form**\n  - **[[Action]]:** [[Bonus Action]].\n  - **Range:** Self.\n  - **Duration:** 1 minute.\n  - Transform into a being of pure flame. Gain resistance to all non-magical damage and deal 2d8 fire damage to any creature that attacks you in melee.\n[[Firebending]]\n[[Firebending Move]]\n[[Player Root]]\n\n#firebending\n#level5\n#player_root\n```\n"}, "Player Root/Rules/Bending Rules/Fire/Firebending Moves/Level 2/Flame Barrage.md": {"size": 309, "type": "text", "text": "\n#Action\n#lingering_effect\n\n\n- **Range:** 1 \\* [[Firebending Slot Progression]] meters.\n- **Damage:** [[Firebending Slot Progression]]\\* 2d8 fire.\n- [[Fire Attack Roll]]\n- Release multiple smaller blasts of fire in quick succession, targeting up to three creatures within range.\n\n\n#Level2\n#fire\n#player_root\n\n"}, "Player Root/Rules/Bending Rules/Fire/Firebending Moves/Level 2/Emberlash.md": {"size": 579, "type": "text", "text": "#Action\n\n- Range: 3 * [[firebending_slot]]\n- [[Fire Attack Roll]]\n- The Target takes [[firebending_slot]] \\* d6 fire Damage and is pulled towards you by [[firebending_slot]] meters\n- Description: Strike with a whip-like stream of burning embers.\n\n\n- On a 10+: Deal the move's base damage plus +1d6 fire damage per current Stress point (see `Stress Level.md`).\n- On a 7\u20139: Deal the base damage; choose one: push the target back one position, or add +1 damage die.\n- On a miss (6 or less): The attack fizzles; no damage and the GM may impose a minor complication.\n\n#Level2\n#fire\n"}, "Player Root/Rules/Bending Rules/Fire/Firebending Moves/Level 2/Inferno Wave.md": {"size": 582, "type": "text", "text": "```markdown\n#Action\n\n[[Bonus Action]]\n[[Level 2]]\n[[Lingering Effect]]\n[[Player Root/Rules/Bending Rules/Fire/Mechanics/Firebending DC]]\n\n  - **Range:** 2* [[Firebending Slot]] meter Cone.\n  - **Damage:** 4 * [[Firebending Slot]] d6 fire.\n- Effect: \n\t- Dexterity saving thow against your [[Player Root/Rules/Bending Rules/Fire/Mechanics/Firebending DC]] or take Damage\n\n  - Unleash a wide wave of flames\n  \n![[Lingering Effect]]\n\n![[Player Root/Rules/Bending Rules/Fire/Mechanics/Firebending DC]]\n[[Firebending]]\n[[Firebending Move]]\n[[Player Root]]\n\n#Level2\n#fire\n#player_root\n```\n"}, "Player Root/Rules/Bending Rules/Fire/Firebending Moves/Level 2/Fireburst.md": {"size": 421, "type": "text", "text": "\n#Action\n\n[[Lingering Effect]]\n[[Action]]\n  - **Range:** 5 * [[firebending_slot]] meters. Sphere with a radius of [[firebending_slot]] * 1 meters.\n  - **Damage:** 2d6 fire per [[firebending_slot]].\n  - **Save:** Dex DC against your  [[Firebending DC]] \n  - Create a fiery explosion at a target point, affecting all creatures within a 10-foot radius.\n\n\n![[Lingering Effect]]\n\n#lingering_effect\n#Level2\n#fire\n#player_root\n\n"}, "Player Root/Rules/Bending Rules/Fire/Firebending Moves/Level 3/Scorching_Aura.md": {"size": 334, "type": "text", "text": "```markdown\n#Scorching_Aura\n#firebending #level3\n\n- **Scorching Aura**\n  - **[[Action]]:** [[Bonus Action]].\n  - **Range:** Self.\n  - **Duration:** 3 rounds.\n  - Creatures within 5 feet of you take 1d6 fire damage at the start of their turn.\n[[Firebending]]\n[[Firebending Move]]\n[[Player Root]]\n\n#firebending\n#level3\n#player_root\n```\n"}, "Player Root/Rules/Bending Rules/Fire/Firebending Moves/Level 3/Rage Fuel.md": {"size": 606, "type": "text", "text": "```markdown\n#Action\n\n[[Bonus Action]]\n[[Level 3]]\n[[Stress Level]]\n\n- Range: [[Self]].\n- **Duration:** until the beginning of your next turn\n\n**Effects:**\n- Increase your [[Stress Level]] by 2* [[Firebending Slot]]\n\n[[Element]]\n\n#firebending #level3\n\n- **Rage Fuel**\n  - **[[Action]]:** [[Bonus Action]].\n  - **Range:** Self.\n  - **Duration:** 3 rounds. [[Concentration]].\n  - Transform your stress penalty into a bonus. Gain +1 to accuracy and damage rolls for every stress point. At the end, stress resets to 0.\n[[Firebending]]\n[[Firebending Move]]\n[[Player Root]]\n\n#firebending\n#level3\n#player_root\n```\n"}, "Player Root/Rules/Bending Rules/Fire/Firebending Moves/Level 4/Lightning Strike.md": {"size": 408, "type": "text", "text": "```markdown\n#Action\n\n[[Level 4]]\n\n- **Lightning Strike**\n  - **[[Action]]:** 2 actions (Charge required).\n  - **Range:** 10 * [[Firebending Slot]] meters.\n  - **Duration:** Instantaneous.\n  - **Damage:** 4d10 lightning.\n- [[Fire Attack Roll]]\n  - After charging for a round, unleash a bolt of lightning at a single target.\n[[Firebending]]\n[[Firebending Move]]\n[[Player Root]]\n\n#Level4\n#fire\n#player_root\n```\n"}, "Player Root/Rules/Bending Rules/Fire/Firebending Moves/Level 4/Firestorm.md": {"size": 533, "type": "text", "text": "```markdown\n#Action\n\n [[Action]]\n [[Level 4]]\n [[Concentration]]\n  - **Range:** 3 * [[Firebending Slot]] meters radius centered on yourself. Moves with you and you are immune to its damage.\n  - **Duration:** [[Firebending Slot]]/2 rounds. Concentration. \n  - **Damage:** [[Firebending Slot]] * 2 d12 fire.\n  - Create a localized storm of fire in a 3 * [[Firebending Slot]] meters radius, damaging all creatures within the area.\n\n![[Concentration]]\n[[Firebending]]\n[[Firebending Move]]\n[[Player Root]]\n\n#Level4\n#fire\n#player_root\n```\n"}, "Player Root/Rules/Bending Rules/Fire/Firebending Moves/Level 4/Seething Inferno.md": {"size": 777, "type": "text", "text": "```markdown\n#Action\n\n[[Action]]\n[[Level]]: 4\n\n- Range: Zone / Area\n- **Duration:** Instant\n- Description: Unleash a wide wave of fire. You may spend up to [[Player Root/Rules/Bending Rules/Fire/Mechanics/Firebending DC]] Stress to boost the effect.\n\n**Effects:**\n\n- Use: Each stress spent adds 5d6 fire damage to the attack.\n- Roll: [[fire Fire Attack Roll]].\n- On a 10+: All targets in the area take base damage plus the extra dice from stress spent.\n- On a 7\u20139: Succeed with a cost\u2014choose one: half the area, one less damage die, or gain +1 Stress.\n- On a miss (6 or less): You lose control; gain +2 Stress and the GM narrates a costly complication.\n\n[[Firebending]]\n[[Stress Level]]\n[[Damaging Move]]\n[[Firebending Move]]\n[[Player Root]]\n\n#Level4\n#fire\n#player_root\n```\n"}, "Player Root/Rules/Bending Rules/Fire/Firebending Moves/Level 1/Burning Fists.md": {"size": 172, "type": "text", "text": "\n#Action\n\n- Range: [[Melee]]\n-[[Fire Attack Roll]]: Attacks [[firebending_slot]] times\n- Damage: 1d6 + [[Strength]] Bludgeoning and 1d4 Fire Damage\n\n\n#Level1\n#fire\n#melee\n\n"}, "Player Root/Rules/Bending Rules/Fire/Firebending Moves/Level 1/Smoldering Focus.md": {"size": 209, "type": "text", "text": "#Bonus_Action\n\n- Description: Calm your breath and focus heat into a small, steady kernel for control or precision.\n\n**Effects:**\n- Reduce your Stress by up to your [[wis]] points\n\n#Level1\n#fire\n#player_root\n\n"}, "Player Root/Rules/Bending Rules/Fire/Firebending Moves/Level 1/Flame Jet.md": {"size": 214, "type": "text", "text": "#Action\n\n- **Range:** 5 \\* [[firebending_slot]] meters.\n- **Damage:** [[firebending_slot]] \\* 1 d10 fire\n- [[Fire Attack Roll]]\n- Unleash a burst of flames in a straight line, damaging one target\n\n\n#Level1\n#fire\n\n\n"}, "Player Root/Rules/Bending Rules/Fire/Firebending Moves/Level 1/Control Flame.md": {"size": 117, "type": "text", "text": "#Action\n#utility\n\n\n- Range: [[fire]] \\* 3 meters\n- You manipulate a flame within range\n\n\n#Level1\n#fire\n#player_root\n\n"}, "Player Root/Rules/Bending Rules/Fire/Mechanics/Firebending Slot Progression.md": {"size": 302, "type": "text", "text": "\nYou have 2 \\* [[fire]] Maximum Slots that are restored after about an hour of rest.\n\nYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\n- spend 2 and then 1 \n- spend 1 and then 2 or\n- spend 1 then 1 then 1 \n\n#fire \n#Level1 \n"}, "Player Root/Rules/Bending Rules/Fire/Mechanics/Stress Level.md": {"size": 701, "type": "text", "text": "#Collectionfile \nFor each Level:\n-1 [[Fire Attack Roll]]\n-1 [[Player Root/Rules/Bending Rules/Fire/Mechanics/Firebending DC]]\n+2 Damage\n\nFirebenders draw power from passion, heat, and intensity. Stress is both a resource and a danger: it fuels more powerful techniques, but too much leaves a bender unstable and at risk of losing control. The following rules convert narrative stress into a simple mechanical resource for firebending moves.\n\nWhen do you gain [[Stress Level]]:\n- For every 10 damage you take you take 1 [[Stress Level]]\n- For every [[Firebending Slot Progression]] used in a [[Damaging Move]]\nWhen you loose [[Stress Level]]:\n- 1 [[Stress Level]] after every turn\n\n\n#player_root\n#fire\n"}, "Player Root/Rules/Bending Rules/Earth/mechanics/Earthbending rules.md": {"size": 501, "type": "text", "text": "\n#### **Overview:**\n\nEarthbenders are solid and steadfast, drawing upon the Strength of their bodies and the stability of the ground beneath them. Their techniques focus on defense, fortification, and manipulating terrain. Rather than relying on agility to avoid blows, earthbenders create barriers, raise armor ratings, and reinforce their allies. They harness **Earth Charges** to shape stone and metal, providing a constant, reliable source of defense and stability.\n\n\n\n#player_root\n#earth\n#Level1 "}, "Player Root/Rules/Bending Rules/Earth/mechanics/Earthbending Slot Progression.md": {"size": 304, "type": "text", "text": "\nYou have 2 \\* [[earth]] Maximum Slots that are restored after about an hour of rest.\n\nYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\n- spend 2 and then 1 \n- spend 1 and then 2 or\n- spend 1 then 1 then 1 \n\n#earth \n#Level1 \n"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Earthbending Moves_wikigraph_sunburst.html": {"size": 3658384, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Earthbending Moves_wikigraph_treemap.html": {"size": 3662377, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Level 5 Moves/Catapult Step.md": {"size": 319, "type": "text", "text": "```markdown\n#Action\n\n**Catapult Step**\n\n**Level 5 Slot**\n- Launch yourself or an ally up to 60ft.\n- Range: Self.\n- Duration: Instantaneous.\n\n**Usage**: Effective for repositioning or surprise attacks.\n\n**Links**:\n- [[Catapult Step]]\n\nTags:\n#Earthbending\n[[Earthbending]]\n[[Player Root]]\n\n#Earthbending\n#player_root\n```\n"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Level 5 Moves/Level 5 Moves_wikigraph_sunburst.html": {"size": 3641997, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Level 5 Moves/Level 5 Moves_wikigraph_treemap.html": {"size": 3642550, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Level 5 Moves/Shard Storm.md": {"size": 309, "type": "text", "text": "```markdown\n#Action\n\n**Shard Storm**\n\n**Level 5 Slot**\n- Launch sharp metal shards at enemies.\n- Range: 60ft.\n- Damage: 5d8 piercing.\n\n**Usage**: Devastating attack for dealing massive damage.\n\n**Links**:\n- [[Shard Storm]]\n\nTags:\n#Earthbending\n[[Earthbending]]\n[[Player Root]]\n\n#Earthbending\n#player_root\n```\n"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Level 5 Moves/Level 5 Moves.md": {"size": 156, "type": "text", "text": "```markdown\n#Action\n\n**Links**:\n- [[Catapult Step]]\n- [[Shard Storm]]\n\nTags:\n#Earthbending\n[[Earthbending]]\n[[Player Root]]\n\n#Earthbending\n#player_root\n```\n"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Level 3 Moves/Boulder Throw.md": {"size": 355, "type": "text", "text": "\n#Action\n\n- Lift and hurl a large boulder.\n- Range: 2 * [[Player Root/variable/secondary_stat/earthbending slot|earthbending slot]] meter.\n- Damage: [[Player Root/variable/secondary_stat/earthbending slot|earthbending slot]] d12 bludgeoning.\n\n**Usage**: Powerful ranged attack for dealing heavy damage.\n\nTags:\n#Level3 \n#earth \n#Earthbending\n#player_root\n\n"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Level 3 Moves/Earth Spike.md": {"size": 352, "type": "text", "text": "```markdown\n#Action\n\n**Earth Spike**\n\n**Level 3 Slot**\n- Summon spikes in a 10ft radius.\n- Damage: 2d6 piercing.\n- Duration: Instantaneous.\n\n**Usage**: Ideal for area control and damage. creates a Lingering Effect with piercing damage\n\n**Links**:\n- [[Earth Spike]]\n\n\nTags:\n#Earthbending\n[[Earthbending]]\n[[Player Root]]\n\n#Earthbending\n#player_root\n```\n"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Level 4 Moves/Level 4 Moves_wikigraph_sunburst.html": {"size": 3642502, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Level 4 Moves/Earthen Fortress.md": {"size": 319, "type": "text", "text": "```markdown\n#Action\n\n**Earthen Fortress**\n\n**Level 4 Slot**\n- Summon a reinforced stone fortress.\n- Size: 15ft x 15ft.\n- Duration: 10 minutes.\n\n**Usage**: Defensive structure for protecting allies.\n\n**Links**:\n- [[Earthen Fortress]]\n\nTags:\n#Earthbending\n[[Earthbending]]\n[[Player Root]]\n\n#Earthbending\n#player_root\n```\n"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Level 4 Moves/Sandsuit.md": {"size": 553, "type": "text", "text": "```markdown\n#Action\n\n**Level 4**\n[[Concentration]]\n- **[[Bonus Action]]** .\n- Range: Self\n- Duration: 3 round. [[Concentration]]\n- Surround yourself in a thick layer of Sand until the start of your next turn.\n\n**Effect**:\nProvides 2 * [[Earthbending Slot]]  [[General Armor Definition]]\nProvides 5* [[Earthbending Slot]] [[Physical Armor]]\nProvides 10 * [[Earthbending Slot]]  [[Barrier Armor definintion]]\n \n**Links**:\n- [[Armor definition]]\n- [[Earthbending Slot]]\n\nTags:\n#Earthbending\n[[Earthbending]]\n[[Player Root]]\n\n#Earthbending\n#player_root\n```\n"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Level 4 Moves/Level 4 Moves_wikigraph_treemap.html": {"size": 3643061, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Level 4 Moves/Crystal Bending.md": {"size": 307, "type": "text", "text": "```markdown\n#Action\n\n**Crystal Bending**\n\n**Level 4 Slot**\n- Manipulate crystals for traps or barriers.\n- Range: 20ft.\n- Duration: 1 minute.\n\n**Usage**: Unique utility for crowd control.\n\n**Links**:\n- [[Crystal Bending]]\n\nTags:\n#Earthbending\n[[Earthbending]]\n[[Player Root]]\n\n#Earthbending\n#player_root\n```\n"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Level 2/Ground Unlock.md": {"size": 250, "type": "text", "text": "\n#Bonus_Action \n- Range: 3* [[earthbending slot]] Meters\n- Target: 1 * [[earthbending slot]]  Enemies within range\nRevert Immobilisation through [[Ground Lock]]\n\n\nTags:\n#Earthbending #Mobility #Immobilisation\n#earth \n#Level2 \n#Mobility\n#player_root\n\n"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Level 2/Stone Shield.md": {"size": 314, "type": "text", "text": "#Reaction \n#Concentration \n\n- Range: 2* [[earthbending slot]] Meters\n- Duration: 1 round.\n- Target [[earthbending slot]] / 2 * Creatures \n\n**Effect**:\nProvides 10 * [[earthbending slot]] temporary  [[General Armor]] until the start of your next turn. \n\n\n\n#Earthbending\n#Level2 \n#earth \n#Earthbending\n#player_root\n\n"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Level 2/Ground Lock.md": {"size": 320, "type": "text", "text": "\n#Bonus_Action  \n\n- Range: 2 * [[earthbending slot]] Meters\n- Duration: Until Saved.\n- Save: Dex Save against your [[Earthbending DC]].\n- Target: 1 * [[earthbending slot]]  Enemies within range\n- an opponent becomes [[Immobilised]] . They get to re-roll the save at the end of their turn.\n\n#earth\n#player_root\n#Level2 \n\n"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Level 2/Gravel Vortex.md": {"size": 407, "type": "text", "text": "#Action\n#Concentration \n- Range: 2* [[earthbending slot]] Meters\n- Duration: 1 round.\n- Summon a vortex of gravel  barrier that grants 10* [[earthbending slot]] [[Barrier]] until the start of your next turn.\n- Target [[earthbending slot]] / 3  Creatures within [[earthbending slot]] meters\n\n \n**Effect**: \nProvides 10 * [[earthbending slot]] [[Barrier]]\n\n\nTags:\n#Earthbending\n#player_root\n#earth \n#Level2 \n\n"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Base Moves/Base Moves_wikigraph_treemap.html": {"size": 3642122, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Base Moves/Base Moves_wikigraph_sunburst.html": {"size": 3641675, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Level 1/Earth Brace.md": {"size": 250, "type": "text", "text": "#Reaction\n#Concentration \n- **Range:** self and every creature within [[earthbending slot]] Meters of you\n- **Effect:**  \n\t- Root yourself and every creature within range to resist forced movement.\n\t- Duration: 1 round.\n\n\n#Level1\n#earth\n#player_root\n"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Level 1/Stone Knuckles.md": {"size": 133, "type": "text", "text": "\n#Action\n\n- Range: #Meele\n- **[[Earth Attack Roll]]**\n- Damage: 1+ [[earthbending slot]] d6 bludgeoning damage.\n\n\n#earth \n#Level1 \n\n\n"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Level 1/Earth Shift.md": {"size": 358, "type": "text", "text": "\n\n#Bonus_Action  \n\n- **Range:** self and every creature within 1+1 * [[earthbending slot]] meters of you\n\n**Effect**:\nTripping opponents with minor terrain manipulation. The target must succeed on a Dexterity saving throw against your [[Player Root/Rules/Bending Rules/Earth/mechanics/Earthbending DC]]) or be knocked Prone.\n\n\n\n#Level1 \n#earth\n#player_root\n\n"}, "Player Root/Rules/Bending Rules/Earth/Earthbending Moves/Level 1/Rock Hurl.md": {"size": 226, "type": "text", "text": "\n#Action\n\n\n- Range: 3\\* [[earthbending slot]] meters\n- [[Earth Attack Roll]]\n- Damage: 1d6 \\* [[earthbending slot]] bludgeoning.\n\n**Effect**:\n\n- Lift and throw a small rock. Simple ranged attack.\n\n\n#Level1\n#earth\n#player_root\n"}, "Player Root/Rules/core rules/Bending Slots.md": {"size": 782, "type": "text", "text": "[[Airbending Slot Progression]]\n[[Firebending Slot Progression]]\n[[earthbending slot]]\n[[Water Charges]]\n[[Spiritbending Slot Progression]]\n\nSlot progression rule: for a bending element at level N you receive slots distributed by slot level as follows \u2014 1 slot at level N, 2 slots at level N-1, 3 slots at level N-2, and so on down to N slots at level 1. In formula form: for each k from 1..N you get k slots of level (N+1-k).\n\nExamples:\n\n- Level 3 earthbender \u2192 1\u00d7 level 3, 2\u00d7 level 2, 3\u00d7 level 1.\n- Level 4 earthbender \u2192 1\u00d7 level 4, 2\u00d7 level 3, 3\u00d7 level 2, 4\u00d7 level 1.\n\nUse this rule to calculate and fill the table entries below. Only rows for elements with at least one slot are included to make tracking easier:\n\nNot for waterbenders\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/core rules/Lingering Effect.md": {"size": 228, "type": "text", "text": "If not Specified otherwise, lingering effect last until the start of your next Turn.\nIf caused by a damaging Move: Every creature that ends its turn there will get half the original attacks Damage.\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/core rules/Cluster.md": {"size": 246, "type": "text", "text": "#Collectionfile \nWhen a creature is standing within 1 meter of another creature it can get affected by some effects\n<!-- BEGIN-AUTO-COLLECTION:Cluster -->\n## Backlinks\n\n  ./\n\n<!-- END-AUTO-COLLECTION -->\n\n\n\n\n\n\n\n\n\n\n\n\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/core rules/Concentration.md": {"size": 232, "type": "text", "text": "Con save DC of max(10, Damage Taken / 2)\nSome Moves require concentration to keep them up. If you take damage while concentrationg you have to make a [[Con]] save with a DC of max(10, Damage Taken / 2)\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/core rules/Manually Rolled Hitpoints.md": {"size": 31, "type": "text", "text": "\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/core rules/Ammunition.md": {"size": 168, "type": "text", "text": "If not Specified otherwise, Ammunition can be used by any character (if its logic :D)  as part of their Moves to enhance them creatively.\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/core rules/Movement.md": {"size": 70, "type": "text", "text": "**Movement per Round**:\n10 meters + [[air]] Level * 3\n\n\n#player_root\n\n"}, "Player Root/Rules/core rules/Short Rest.md": {"size": 80, "type": "text", "text": "You restore all your Hitpoints and Bending Slots\n[[Player Root]]\n\n#player_root\n\n"}, "Player Root/Rules/core rules/Conditions/Slowed.md": {"size": 153, "type": "text", "text": "A slowed creatures Movement Speed is halved and it can not use any #Bonus_actions or #reactions. ( #[[Action]] is allowed)\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/core rules/Conditions/unconscious.md": {"size": 31, "type": "text", "text": "\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/core rules/Conditions/Conditions_wikigraph_treemap.html": {"size": 3642860, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/core rules/Conditions/Conditions_wikigraph_sunburst.html": {"size": 3641780, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/core rules/Conditions/Paralysed.md": {"size": 229, "type": "text", "text": "# Paralysis Mechanics\n\nCertain Chi Blocking moves cause paralysis, preventing the target from taking actions or bending for a specified duration.\n\n## Key Moves\n- Pressure Point Strike\n- Nerve Strike\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/core rules/Conditions/Immobilised.md": {"size": 209, "type": "text", "text": "The creature can not move or be moved by force. Depending what causes Immobilisation you can save against it as an [[Action]] or can remove it with your bending more efficiently.\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/core rules/Stat Shorts/HP.md": {"size": 1033, "type": "text", "text": "#Collectionfile \nHitpoints\nWhen your [[HP]] reach 0 you are [[unconscious]] and bleeding out. \n\nOn your Turn you have to roll a death saving throw. \nIf you have 3 Successes you become stable and don't have to roll anymore.\nIf you have 3 Failures you die.\n<!-- BEGIN-AUTO-COLLECTION:HP -->\n## Backlinks\n\n  ./\n  \u251c\u2500\u2500 [[create_npc.py]]\n  \u251c\u2500\u2500 [[create_pc.py]]\n  \u2514\u2500\u2500 Players Part\n      \u2514\u2500\u2500 PCs\n          \u251c\u2500\u2500 Airwatterbendertest\n              \u2514\u2500\u2500 [[Airwatterbendertest Character Sheet.md]]\n          \u251c\u2500\u2500 Anju\n              \u2514\u2500\u2500 [[Player Root/PCs/Anju/Anju Character Sheet]]\n          \u251c\u2500\u2500 Spirittest\n              \u2514\u2500\u2500 [[Spirittest Character Sheet.md]]\n          \u251c\u2500\u2500 TestChar\n              \u2514\u2500\u2500 [[TestChar Character Sheet.md]]\n          \u251c\u2500\u2500 TestQuick\n              \u2514\u2500\u2500 [[TestQuick Character Sheet.md]]\n          \u2514\u2500\u2500 TmpTest\n              \u2514\u2500\u2500 [[TmpTest Character Sheet.md]]\n\n<!-- END-AUTO-COLLECTION -->\n\n\n\n\n\n[[Player Root]]\n#variable\n\n#player_root\n"}, "Player Root/Rules/core rules/Stat Shorts/Temporary Hitpoints.md": {"size": 138, "type": "text", "text": "Temporary [[Hitpoints]] are always used first and usually don't Stack but Situational exceptions.\n[[Player Root]]\n#variable\n\n#player_root\n"}, "Player Root/Rules/core rules/Stat Shorts/Physical Armor.md": {"size": 41, "type": "text", "text": "\n[[Player Root]]\n#variable\n\n#player_root\n"}, "Player Root/Rules/core rules/Stat Shorts/Stat Shorts_wikigraph_sunburst.html": {"size": 0, "type": "text", "text": ""}, "Player Root/Rules/core rules/Stat Shorts/Int.md": {"size": 169, "type": "text", "text": "Intelligence\nOne of the 6 Stats. Important for [[Waterbending Moves]].\n\n**Links**:\n- [[Waterbending Moves]]\n\nTags:\n#Waterbending\n[[Player Root]]\n#variable\n\n#player_root\n"}, "Player Root/Rules/core rules/Stat Shorts/Max Hitpoints.md": {"size": 267, "type": "text", "text": "You max [[Hitpoints]] are determined by your Level and Bending Type:\nEarth: 1d12 per [[CL]] + [[Con]]\nWater: 1d8 per [[CL]] + [[Con]]\nFire: 1d8 per [[CL]] +[[Con]]\nAir: 1d6 per [[CL]] + [[Con]]\nSpirit: 1d4 per [[CL]] + [[Con]]\n[[Player Root]]\n#variable\n\n#player_root\n"}, "Player Root/Rules/core rules/Stat Shorts/Wisdom.md": {"size": 41, "type": "text", "text": "\n[[Player Root]]\n#variable\n\n#player_root\n"}, "Player Root/Rules/core rules/Stat Shorts/Stat Shorts_wikigraph_treemap.html": {"size": 3648686, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/core rules/Stat Shorts/Strength.md": {"size": 41, "type": "text", "text": "\n[[Player Root]]\n#variable\n\n#player_root\n"}, "Player Root/Rules/core rules/Stat Shorts/Intelligence.md": {"size": 58, "type": "text", "text": "Auotoexplanatory.\n[[Player Root]]\n#variable\n\n#player_root\n"}, "Player Root/Rules/core rules/Stat Shorts/Barrier Armor definintion.md": {"size": 234, "type": "text", "text": "[[Barrier Armor definintion]] Whenever you suffer unblocked damage Barrier Armor halves (rounded down)\n\nFor example when you have 15 Barrier Armor and suffer 18 damage you suffer 3 Damage and Barrier Armour halves to 7.\n\n#player_root\n"}, "Player Root/Rules/core rules/Stat Shorts/Hitpoints.md": {"size": 110, "type": "text", "text": "Very mandatory for living.\n\n[[Max Hitpoints]]\n[[Temporary Hitpoints]]\n[[Player Root]]\n#variable\n\n#player_root\n"}, "Player Root/Rules/core rules/Stat Shorts/General Armor Definition.md": {"size": 112, "type": "text", "text": "Reduces All Damage Types other than Spiritual Damage.\nbase general armor:\n[[Earthbending Level]]\n\n\n#player_root\n"}, "Player Root/Rules/core rules/Stat Shorts/Armor definition.md": {"size": 339, "type": "text", "text": "Grants Damage reduction. \nBase armor:\n\n\n[[General Armor Definition]] reduces all Damage Types in addition to their specific type Armor (other than spiritual). \n\n[[Physical Armor]] reduces all Piercing Slashing and bludgeoning Damage.\n\n\n[[Barrier Armor definintion]] Whenever you suffer unblocked damage Barrier Armor halves\n\n\n#player_root\n"}, "Player Root/Rules/core rules/Stat Shorts/Attack Roll Modifier.md": {"size": 64, "type": "text", "text": "= [[Element]] Level - [[Stress Level]]\n\n#variable\n\n#player_root\n"}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking_wikigraph_treemap.html": {"size": 3650508, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking rules.md": {"size": 509, "type": "text", "text": "# Chi Blocking Rules\n\nChi Blocking is a specialized combat style that relies on targeting an opponent's pressure points to immobilize them or impede their bending abilities. \nChi Blockers are adept at neutralizing threats without requiring bending.\n\n## Core Features\n- **Pressure Point Strikes**: Disable bending or other abilities temporarily.\n- **Energy Points**: Manage energy to execute powerful moves.\n- **Evasion and Defense**: Increased agility and defensive techniques.\n\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking_wikigraph_sunburst.html": {"size": 0, "type": "text", "text": ""}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking Moves/Chi Blocking Moves_wikigraph_treemap.html": {"size": 3647054, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking Moves/_Chi Blocking Moves.md": {"size": 329, "type": "text", "text": "# Chi Blocking Moves\n\nChi Blockers have a range of moves categorized by levels, growing more potent as they develop their skills.\n\n## Move Levels\n- **Level 1**: Basic disruption techniques.\n- **Level 2**: Advanced strikes with added effects.\n- **Level 3**: High-impact moves that exhaust opponents.\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking Moves/Chi Blocking Moves_wikigraph_sunburst.html": {"size": 3645613, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking Moves/Level 3 Moves/Chi Surge.md": {"size": 312, "type": "text", "text": "- **Cost:** 4 EP.\n- **Type:** [[Action]].\n- **Range:** Melee.\n- Attack: [[Dex]]+[[EP]]\n- **Effect:**  \n    Deliver a powerful blow that if hit restores 6 EP. The Target must succeed on a DC 10 + [[EP]] Con Save or become [[Slowed]].\n    - **Duration:** 2 turns.\n\nTags:\n#ChiBlocking\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking Moves/Level 3 Moves/Bedning Redirect.md": {"size": 531, "type": "text", "text": "- **Cost:** 5 EP.\n- **Type:** [[Reaction]].\n- **Range:** The original attacks range.\n- **Effect:**  \n    When in Melee range to an enemy performing a Bending Move. If they fail a DC 10+[[EP]] Dex Save you can redirect the opponent's bending energy back at them using the same bending Move. If they succeed by more than 5 they additionally get to use their Move.\n    If you steal a Move that requires concentration it is automatically broken instantly.\n    - **Duration:** Instant.\n\nTags:\n#ChiBlocking\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking Moves/Level 3 Moves/Level 3 Moves_wikigraph_treemap.html": {"size": 3642202, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking Moves/Level 3 Moves/Level 3 Moves_wikigraph_sunburst.html": {"size": 3641781, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking Moves/Level 1 Moves/Evasive manouvers.md": {"size": 209, "type": "text", "text": "- **Cost:** 1+ EP.\n- **Type:**  [[Reaction]].\n- **Range:** Self.\n- **Effect:**  \n    Jump by [[EP]] * 2 Meter. Allows you to dodge bending attacks with ease.\n\nTags:\n#ChiBlocking\n\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking Moves/Level 1 Moves/Pressure Point Strike.md": {"size": 321, "type": "text", "text": "- **Cost:** 2+ EP.\n- **Type:** [[Action]].\n- **Range:** Melee.\n- **Effect:**  \n    A Flick to the forehead to disrupt focus. Deals [[EP]]d4 + Dexterity and the target makes concentraion saves with disadvantage until the end of your next turn.\n    - **Duration:** 1 turn.\n\nTags:\n#ChiBlocking\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking Moves/Level 1 Moves/Level 1 Moves_wikigraph_treemap.html": {"size": 3642665, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking Moves/Level 1 Moves/Quick Jab.md": {"size": 350, "type": "text", "text": "- **Cost:** 1 + EP.\n- **Type:** [[Bonus Action]].\n- **Range:** Melee.\n- [[Attack Roll]]\n- **Effect:**  \n    A swift strike aimed at disrupting the target's focus. Deals [[EP]]d8 + [[Dex]] bludgeoning damage and imposes disadvantage on the target's next [[Attack Roll]].\n    - **Duration:** 1 Minute.\n\nTags:\n#ChiBlocking\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking Moves/Level 1 Moves/Level 1 Moves_wikigraph_sunburst.html": {"size": 3642084, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking Moves/Level 2 Moves/Enhanced Reflexes.md": {"size": 267, "type": "text", "text": "- **Cost:** 2 EP.\n- **Type:** [[Bonus Action]].\n- **Range:** Self.\n- **Effect:**  \n    Increase your evasion by [[EP]] for one turn. Allows you to dodge bending attacks with greater ease.\n    - **Duration:** 1 turn.\n\nTags:\n#ChiBlocking\n\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking Moves/Level 2 Moves/Nerve Strike.md": {"size": 335, "type": "text", "text": "- **Cost:** 3+ EP.\n- **Type:** [[Action]].\n- **Range:** Melee.\n- Attack: [[Dex]] \n- **Effect:**  \n    A precise strike that deals no damage but if hit the Target must succeed a DC 10+[[EP]] [[Con]] Save or be [[Paralysed]] until the end of your next Turn. \n    - **Duration:** 1 turn.\n\nTags:\n#ChiBlocking\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking Moves/Level 2 Moves/Level 2 Moves_wikigraph_sunburst.html": {"size": 3641548, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking Moves/Level 2 Moves/Level 2 Moves_wikigraph_treemap.html": {"size": 3641974, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking Mechanics/Defensive Techniques.md": {"size": 276, "type": "text", "text": "# Defensive Techniques\n\nChi Blockers excel at evading and mitigating damage through agility and strategic positioning.\n\n## Techniques\n- Enhanced Reflexes: Gain temporary bonuses to evasion.\n- Counterattack: Strike back immediately after dodging.\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/Non Bending Rules/Chi Blocking/Chi Blocking Mechanics/Chi Blocking M bed in static snapshot"}, "Player Root/deleted/deleted_smoke_test_created_by_agent.md": {"size": 0, "type": "text", "text": ""}, "Player Root/deleted/deleted_test.json": {"size": 49, "type": "text", "text": "Your personal Notes:\n\nthese are my personal notes"}, "Player Root/deleted/deleted_smoke_test_by_playwright.md": {"size": 0, "type": "text", "text": ""}, "Player Root/deleted/TESTFILE.md": {"size": 43, "type": "text", "text": "THIS ISTHETESTFILE FOR THE GRAPH GENERATION"}, "Player Root/deleted/Player Root_wikigraph_treemap.html": {"size": 582175, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/deleted/deleted_smoke_test_by_api.md": {"size": 0, "type": "text", "text": ""}, "Player Root/deleted/deleted_smoke_test_agent2.md": {"size": 0, "type": "text", "text": ""}, "Player Root/deleted/deleted_Anju Inventory.md": {"size": 9, "type": "text", "text": "inventory"}, "Player Root/Story/players_theories.md": {"size": 54, "type": "text", "text": "Space to write down your puzzles and story connections"}, "Player Root/Story/Session Transcript Summaries/Session 5.md": {"size": 3507, "type": "text", "text": "Session 5 Transcript\n\nSpirit Snake Scale:\n\nParty found a spirit snake scale on the ground.\n\nIt can be used as a reaction to flash and impose disadvantage.\n\n\nMilking Antics:\n\nThe group tried to milk desert oxen to mix with cactus juice for cocktails.\n\nMultiple failed Nature checks led to confusion over whether the ox was male or female (\u201cAm I holding a penis?!\u201d).\n\nThey eventually gave up on proper milking but still mixed cactus juice with mystery milk for later.\n\n\nJourney to Tapi\u2019s Village:\n\nParty headed toward Tapi\u2019s home village near an oasis.\n\nTraversed a rocky descent, using Earthbending to create steps and platforms (some attempts failed hilariously).\n\n\nCaravan & Hyena Falcon Encounter:\n\nThey spotted a merchant caravan (camels carrying barrels of cactus juice).\n\nThe caravan seemed fleeing something but let the group catch up.\n\nHyena falcons attacked.\n\nThe party used creative bending \u2014 including launching a flaming barrel \u2014 to drive the falcons off.\n\n\nArrival at Tapi\u2019s Village:\n\nThey arrived at Tapi\u2019s tourist-friendly oasis village, known for its premium cactus juice.\n\nTapi\u2019s house: described as bohemian and cluttered, filled with shiny decorations, bottles, and jars.\n\nThey met Tapi\u2019s mom (a warm, hippie-like woman). She mentioned that Tapi\u2019s dad was out on the cactus farm.\n\n\nThe Oasis & Temple:\n\nThe group visited the oasis temple, which had:\n\nDrawings and statues of a fish spirit \u2014 but none of them looked the same.\n\nPriestess Ban Ban, who explained:\n\nThe fish spirit disappeared a few days ago.\n\nIt used to communicate with her via bubbles.\n\nShe has drunk the holy water herself.\n\n\n\nMahogany dove into the pool, searching for signs of the spirit.\n\nShe felt faint traces of spiritual energy, but nothing alive.\n\nInstead, she found poop, which she proudly brought up for examination.\n\n\nThe group speculated:\n\nThe spirit may have been taken, changed form, or left through an unseen passage.\n\nSome PCs (esp. Puy) rehashed the ongoing argument about reselling cactus juice as \u201choly juice.\u201d\n\n\n\nEvening at Tapi\u2019s Home:\n\nTapi\u2019s mom suddenly burst in dramatically announcing Tapi\u2019s dad had an accident.\n\nTurns out he had just fallen into a cactus.\n\nAnju helped him, and he was fine.\n\nThey then relaxed, enjoying:\n\nCucumber sandwiches and watermelon-quinoa salad.\n\nCactus-milk cocktails (surprisingly good, rated 9/10).\n\nCactus juice \u2014 some PCs got drunk after failing Con saves.\n\n\n\nCliffhanger:\n\nJust as everyone was comfortably drunk and chilling, they heard strange noises outside near the farm \u2014 something is happening.\n\n\n\n---\n\nSession Summary:\n\nThe group picked up a spirit snake scale and concocted a strange but tasty cactus-milk cocktail after a chaotic ox-milking attempt. On their way to Tapi\u2019s home village, they helped a merchant caravan fend off hyena falcons with creative bending (including a flaming barrel).\n\nAt the oasis temple, they learned from priestess Ban Ban that the fish spirit who once communicated through bubbles had disappeared. Mahogany dove into the pool, sensing faint spiritual energy but finding only poop \u2014 perhaps a remnant of the missing spirit.\n\nReturning to Tapi\u2019s house, the party met his dramatic mother, who announced his father\u2019s \u201cterrible accident\u201d (which turned out to be just a cactus fall). After Anju helped him, they spent the evening enjoying cocktails, food, and cactus juice \u2014 some drinking heavily.\n\nThe night ended with a cliffhanger: suspicious noises outside near the cactus farm."}, "Player Root/Story/Session Transcript Summaries/Session 6.md": {"size": 3760, "type": "text", "text": "Session transkript:\nAvatar TTRPG \u2014 Session 6\nWhere we left off\n\nParty is in Misty Palms Oasis investigating the exploded distillery and a newly exposed basement chamber full of ancient fish-pictograph scrolls about D\u012bnu, the oasis\u2019s invisible goldfish spirit (appears only when you aren\u2019t looking).\n\nA dropped potion formed a watery portal. A hand reached through; the party pulled back Ash, who\u2019d been on a long spirit-world journey (felt like ~45 years to Ash).\n\nKey events\n\nHidden archive: Scrolls describe D\u012bnu phasing between Spirit and Material Worlds; only D\u012bnu\u2019s poop manifests materially. Verses hint you must bring all four elements into harmony to contact D\u012bnu.\n\nFire-pets & zodiac quest: The muscular young firebender continues bonding with animals (fire cat, Woofie the fire dog, Cuckoo the fire rooster) and wants connections to all 12 zodiac animals (today\u2019s attempt at a fire rat ended\u2026 poorly).\n\nCat chaos: The fire cat singed some scrolls before being dismissed.\n\nStabilizing the chamber: A richly dressed, highly skilled earthbender arrives\u2014revealed as the King of Omashu. Using a resonant glass pomegranate technique, he and the party stabilize the collapsing room (massive group healing/soothing resonance).\n\nOmashu hook: The king, an acquaintance of Vin Kotak (the tense airbender from earlier sessions), invites the party to Omashu to learn more about resonance stones and how the party uniquely uses them.\n\nSpirit contact via poop ritual: The group combined five poop pellets with the four elements (watered, frozen, sand-encapsulated, burned, air-swirled).\n\nResult: a thick, spiritually potent smoke.\n\nAsh, using a spirit-sight technique (\u201cSi U Li\u201d), saw and heard D\u012bnu emerge and briefly speak; others only heard a faint \u201cblub.\u201d D\u012bnu then faded; the smoke dissipated and the pellets were consumed.\n\nWrap-up: Bath at the oasis; plans made to travel north to Omashu next session, following the king\u2019s lead and the party\u2019s prior tip that a resonance stone lies there.\n\nCharacters (quick refresher)\n\nAsh (returned): Spirit-touched; can see spirit effects; has a dragon companion; newly improved airbending via resonance.\n\nMuscular young firebender (19): Open leather vest, big scar, long hair; animal-bonding focus; current companions: fire cat, Woofie (fire dog), Cuckoo (fire rooster); pursuing 12-zodiac bonds.\n\nSandbender (southern tribe): Ceremonial paint, desert-tough; pragmatic.\n\nRio (Northern Water Tribe): Calm, tired look; waterbender; tea-making; helped with stabilization.\n\nTemple Master/Scholar (NPC): Obsessed with decoding the fish-script scrolls; stays behind to study.\n\nKing of Omashu (NPC): Powerful, courteous earthbender; demonstrates resonance technique; offers mentorship/invitation.\n\nWhat we learned\n\nD\u012bnu\u2019s nature: Invisible by choice; only poop is material; contact likely requires balanced multi-element ritual.\n\nResonance stones: Can imbue/awaken secondary elements (party has experienced this). The king can teach more in Omashu.\n\nSpirit access: Spirit-sight lets mortals perceive otherwise invisible spirit effects, at least briefly.\n\nOpen threads & to-dos\n\nTravel to Omashu; meet the king; research resonance stones and their safe use.\n\nContinue decoding fish-pictograph scrolls (master is on it).\n\nRefine the elemental ritual to reliably contact D\u012bnu (now out of pellets\u2014need new material manifestation).\n\nPursue the zodiac-bond quest (next up: fire rat\u2014bring gloves).\n\nKeep an eye on Vin Kotak and Lotus connections.\n\nSession end state\n\nLocation: Misty Palms \u2192 setting out across the desert toward Omashu.\n\nResources: No poop pellets left; one resonant glass pomegranate (king\u2019s, not the party\u2019s).\n\nParty status: Stable, cleaned up, motivated; Ash rejoined."}, "logs/wikigraphs.log": {"size": 1644, "type": "text", "text": "{\"severity\": \"info\", \"text\": \"[diagnostic] Resolved root: /Users/samuelschoberl/projects/ATLA_Campaign/Player Root\"}\n{\"severity\": \"info\", \"text\": \"[diagnostic] Effective outdir: /Users/samuelschoberl/projects/ATLA_Campaign/Player Root\"}\n{\"severity\": \"info\", \"text\": \"[diagnostic] Will write sunburst to: /Users/samuelschoberl/projects/ATLA_Campaign/Player Root/Player Root_wikigraph_sunburst.html\"}\n{\"severity\": \"info\", \"text\": \"[diagnostic] Will write treemap to: /Users/samuelschoberl/projects/ATLA_Campaign/Player Root/Player Root_wikigraph_treemap.html\"}\n{\"severity\": \"info\", \"text\": \"Wrote: /Users/samuelschoberl/projects/ATLA_Campaign/Player Root/Player Root_wikigraph_sunburst.html\"}\n{\"severity\": \"info\", \"text\": \"Wrote: /Users/samuelschoberl/projects/ATLA_Campaign/Player Root/Player Root_wikigraph_treemap.html\"}\n{\"severity\": \"info\", \"text\": \"[diagnostic] Resolved root: /Users/samuelschoberl/projects/ATLA_Campaign/Player Root\"}\n{\"severity\": \"info\", \"text\": \"[diagnostic] Effective outdir: /Users/samuelschoberl/projects/ATLA_Campaign/Player Root\"}\n{\"severity\": \"info\", \"text\": \"[diagnostic] Will write sunburst to: /Users/samuelschoberl/projects/ATLA_Campaign/Player Root/Player Root_wikigraph_sunburst.html\"}\n{\"severity\": \"info\", \"text\": \"[diagnostic] Will write treemap to: /Users/samuelschoberl/projects/ATLA_Campaign/Player Root/Player Root_wikigraph_treemap.html\"}\n{\"severity\": \"info\", \"text\": \"Wrote: /Users/samuelschoberl/projects/ATLA_Campaign/Player Root/Player Root_wikigraph_sunburst.html\"}\n{\"severity\": \"info\", \"text\": \"Wrote: /Users/samuelschoberl/projects/ATLA_Campaign/Player Root/Player Root_wikigraph_treemap.html\"}\n"}, ".github/workflows/graphs.yaml": {"size": 1149, "type": "text", "text": "name: Deploy to GitHub pages\n\non:\n  push:\n    # this is the branch where you develop your site\n    # as discussed in the publishing sources section\n    # this can change if you are using an user/organization repo\n    branches: [ feature/pages_prototype ]\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n    - uses: actions/checkout@v2\n    - name: Run a multi-line script\n      run: |\n        echo test the checkout action,\n        ls -a\n    - name: Init new repo in graphs folder and commit generated files\n      run: |\n        cd ./graphs\n        git init\n        git add -A\n        git config --local user.email \"action@github.com\"\n        git config --local user.name \"GitHub Action\"\n        git commit -m 'deploy'\n    - name: Force push to destination branch\n      uses: ad-m/github-push-action@v0.5.0\n      with:\n        # Token for the repo\n        # Can be passed in using $\\{{ secrets.GITHUB_TOKEN }}\n        github_token: ${{ secrets.GITHUB_TOKEN }}\n        # Destination branch to push changes\n        branch: gh-pages\n        # Use force push to fully overwrite the destination branch\n        force: true\n      run: |\n        ls -l\n"}, "Dms Root/Dms Root_wikigraph_treemap.html": {"size": 5052214, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/Dms Root_wikigraph_sunburst.html": {"size": 4886530, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/PCs/Mahogany/Spiritual Echo - Mountain Summit Encounter.md": {"size": 2601, "type": "text", "text": "\n**Context:**  \nImmediately after the group's victory over a corrupted spirit. Mahogany, the group's only spirit, has absorbed the entity\u2019s negative energy and purified it from within through a spiritual contest.\n\n---\n\n### \ud83c\udfaf Mechanics\n\n- **Trigger:** Mahogany completes the spirit cleansing.\n    \n- **Airbenders in the group** must make a **Perception check (DC 12, with advantage)**.\n    \n\n**On Success:**  \nThey sense a **brief, unnatural shift in air pressure**\u2014a swirl or pulse like a door opening to a hidden chamber, but they are high on a mountain with nothing around. It vanishes after two seconds.\n\n---\n\n### \ud83c\udf00 Mahogany's Vision\n\n> _(Private: The player can request the others to leave the room for this scene.)_\n\n> As the spiritual remnants fade, Mahogany feels a tingle in the air\u2014not hostile, but watchful.  \n> Then, a soft voice, cold as distant wind, whispers directly into her ear:\n\n**\"Now... who are you?\"**\n\nMahogany may make a **History or Insight check (DC 17)** to identify the speaker.\n\n---\n\n### \ud83d\udd0d On Success: Recognizing Rin Kotak\n\nMahogany realizes the voice belongs to **[[Rin Kotak]]**, the elusive **Spiritualist of the Night Bloom**, a radical airbender known for manipulating sound and blending with wind to near invisibility. He is feared not just for his bending, but for how he **weaves ideology into every breath.**\n\n---\n\n### \ud83d\udde3\ufe0f Dialogue (If Mahogany responds)\n\nIf she speaks\u2014aloud or in thought\u2014a ripple of wind answers. On a distant cliff edge, so far that no human voice should carry, a **tall, black-robed figure** appears, seated cross-legged, barely more than a wraith in the wind. And yet... his voice is inside her again:\n\n> _\u201cYou bent the spirit. Purified it. Took its pain into your own.  \n> You\u2019re not like them\u2014not _just_ flesh. Not just bound by the old rules.  \n> Intriguing.\u201d_\n\n> _\u201cYou stand on a peak, but don\u2019t you feel the cage around you still?  \n> The cycle. The Avatar. All of it\u2014wheels within wheels, spinning us endlessly toward the same fate.\u201d_\n\n> _\u201cThey call me traitor. But I only want what you just proved is possible\u2014freedom from what _was_. You and I, Mahogany... we could speak again. When the wind is right.\u201d_\n\nThe wind sighs. A blink later, the figure is gone. The cliff is bare again.\n\n---\n\n### \ud83d\uddc2\ufe0f Linked Files\n\n- [[Rin Kotak]]\n    \n- [[Night Bloom]]\n    \n- [[Isay Trekal]]\n    \n- [[Hanal Koga]]\n    \n\n---\n\nWould you like me to now generate or clean up the Obsidian files for [[Rin Kotak]] or [[Night Bloom]] based on your inputs? I can help you integrate this directly into your vault."}, "Dms Root/NPCs/_NPCs.md": {"size": 38, "type": "text", "text": "[[_DMPCs]]\n[[_Lotus]]\n[[_Night Bloom]]"}, "Dms Root/NPCs/Night Bloom/_Night Bloom.md": {"size": 61, "type": "text", "text": "**Links**:\n- [[Rin Kotak]]\n- [[Isay Trekal]]\n- [[Hanal Koga]]"}, "Dms Root/NPCs/Night Bloom/Dark Spirits/Frostling Puppetier.md": {"size": 18297, "type": "text", "text": "|                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    |                    |                    |                    |                    |                    |\n| ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | ------------------ | ------------------ | ------------------ | ------------------ | ------------------ |\n| # FROSTLING PUPPETEER  <br>Small fey, lawful evil                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  |                    |                    |                    |                    |                    |\n| Armor Class\u00a014<br><br>Hit Points\u00a044 (8d6 + 16)<br><br>Speed\u00a030 ft.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 |                    |                    |                    |                    |                    |\n| STR<br><br>9 (-1)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  | DEX<br><br>18 (+4) | CON<br><br>14 (+2) | INT<br><br>10 (+0) | WIS<br><br>12 (+1) | CHA<br><br>17 (+3) |\n| Skills\u00a0Acrobatics +6, Deception +5<br><br>Condition Immunities\u00a0charmedSenses\u00a0darkvision 60 ft., passive Perception 11<br><br>Languages\u00a0Common, Sylvan<br><br>Challenge\u00a03 (700 XP) \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0Proficiency Bonus\u00a0+2                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              |                    |                    |                    |                    |                    |\n| Frostling Puppet.\u00a0The frostling puppeteer\u2019s magical puppet has AC 14, 10 hit points, and resistance to non-magical bludgeoning, piercing, and slashing damage. If the puppet is destroyed, the Puppeteer can no longer use its Puppet Binding ability. It takes 24 hours for the Frostling Puppeteer to craft a new puppet.<br><br>Magic Resistance.\u00a0The frostling puppeteer has advantage on saving throws against spells and other magical effects.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              |                    |                    |                    |                    |                    |\n| actionS                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            |                    |                    |                    |                    |                    |\n| Naughty, Naughty.\u00a0The frostling puppeteer targets one creature it can see within 30 feet with a harsh scolding. The target must succeed on a DC 13 Wisdom saving throw. On a failed save, the creature takes 14 (2d10 + 3) psychic damage and is frightened until the end of its next turn. On a successful save, the creature takes half as much and is not frightened.<br><br>Puppet Binding.\u00a0The frostling puppeteer targets one creature it can see within 30 feet. The target must succeed on a DC 13 Wisdom saving throw or be bound by magical strings for up to 24 hours (if a child) or until the end of its next turn (if an adult). While bound, the target is controlled by the frostling puppeteer. The binding ends if the puppet is destroyed or the frostling puppeteer binds a new creature.<br><br>Pull the Strings.\u00a0The frostling puppeteer commands a bound creature to move up to its full movement and take two of the following attacks:<br><br>1. Feral Bite:\u00a0Melee Weapon Attack:\u00a0+6 to hit, reach 5 ft., one target.\u00a0Hit:\u00a011 (2d6 + 4) piercing damage.<br>2. Meltdown.\u00a0The bound creature lets out a petulant scream. All other creatures within 30 feet that can hear it must succeed a DC 13 Constitution saving throw or take 10 (3d6) Psychic damage.<br>3. Strangle.\u00a0The bound creature attempts to choke the target with the magical strings that bind it.\u00a0Melee Weapon Attack:\u00a0+6 to hit, reach 5 ft., one Medium or smaller creature.\u00a0Hit:\u00a0The creature is grappled (escape DC 13). Until this grapple ends, the target is restrained and at risk of suffocating, and the bound creature can\u2019t strangle another target. In addition, at the start of each of the target's turns, the target takes 7 (2d6) bludgeoning damage.<br><br>\u00a0reactionS |                    |                    |                    |                    |                    |\n| Ventriloquist's Dodge (3/day).\u00a0When the frostling puppeteer is targeted by an attack, it can use its [[Reaction]] to magically swap places with a bound creature within 30 feet, causing the attack to target the bound creature instead.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              |                    |                    |                    |                    |                    |"}, "Dms Root/NPCs/Night Bloom/Dark Spirits/Untitled.md": {"size": 129, "type": "text", "text": "https://docs.google.com/document/d/e/2PACX-1vS6lUZOVfTes0fREKrjtLjDXrZ-oZkxG3jeoAdIFJErzhnTc82UnTnXKRTlWVBrhxy9c3bBBdj8Nkh0/pub\n\n"}, "Dms Root/NPCs/Night Bloom/Dark Spirits/kiki.png": {"size": 2163926, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/NPCs/Night Bloom/Dark Spirits/Holiday Spirit.md": {"size": 23982, "type": "text", "text": "|                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        |                    |                    |                   |                    |                    |\n| ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
