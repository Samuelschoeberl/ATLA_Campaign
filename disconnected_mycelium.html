          close.textContent = "Close";
          close.addEventListener("click", () => {
            if (entry.parentElement) entry.parentElement.removeChild(entry);
            saveEventLogToStorage();
          });
          actionsWrap.appendChild(close);
          const header = document.createElement("div");
          header.style.display = "flex";
          header.style.alignItems = "center";
          header.appendChild(iconWrap);
          header.appendChild(h);
          entry.appendChild(ts);
          entry.appendChild(header);
          entry.appendChild(p);
          entry.appendChild(actionsWrap);
          // prepend to the top
          // prepend to the top
          body.insertBefore(entry, body.firstChild);
          // update compact last two messages (most recent first)
          try {
            const item0 = document.getElementById("event-log-compact-item-0");
            const item1 = document.getElementById("event-log-compact-item-1");
            // Only show general-channel entries in compact view; debug channel is not shown there
            if (channel === "general" && item0 && item1) {
              // shift previous item0 into item1
              item1.textContent = item0.textContent || "";
              // set item0 to this new message (title: first line)
              const firstLine = String(text || "").split(/\r?\n/)[0] || "";
              item0.textContent = `${escapeHtml(title)}: ${escapeHtml(
                firstLine
              )}`;
            }
          } catch (e) {}
          // cap entries to 200 to avoid excessive memory use
          try {
            const children = body.children;
            const max = 200;
            while (children.length > max) body.removeChild(body.lastChild);
          } catch (e) {}
          // if expanded, ensure body is visible and scrolled to top (newest first)
          try {
            const container = document.getElementById("event-log");
            const logBody = document.getElementById("event-log-body");
            if (container && container.classList.contains("expanded")) {
              logBody.style.display = "block";
              logBody.scrollTop = 0;
              try {
                const controls = document.getElementById("event-log-controls");
                if (controls) controls.style.display = "flex";
              } catch (e) {}
            }
          } catch (e) {}
          // persist to localStorage
          try {
            saveEventLogToStorage();
          } catch (e) {}
          try {
            applyEventFilters();
          } catch (e) {}
        } catch (e) {
          console.warn("appendEventLog failed", e);
        }
      }

      // localStorage persistence helpers
      const EVENT_LOG_KEY = "mycelium_event_log_v1";
      function saveEventLogToStorage() {
        try {
          const body = document.getElementById("event-log-body");
          if (!body) return;
          const items = [];
          for (const ch of Array.from(body.children)) {
            try {
              const title = ch.querySelector("strong")
                ? ch.querySelector("strong").textContent
                : "";
              const text = ch.querySelector("div:nth-of-type(3)")
                ? ch.querySelector("div:nth-of-type(3)").innerText
                : "";
              const ts = ch.querySelector(".ts")
                ? ch.querySelector(".ts").textContent
                : "";
              const sev = ch.classList.contains("error")
                ? "error"
                : ch.classList.contains("warn")
                ? "warn"
                : "info";
              const channel = ch.classList.contains("channel-debug")
                ? "debug"
                : "general";
              items.push({ title, text, ts, severity: sev, channel });
            } catch (e) {}
          }
          localStorage.setItem(
            EVENT_LOG_KEY,
            JSON.stringify(items.slice(0, 200))
          );
        } catch (e) {
          console.warn("saveEventLogToStorage failed", e);
        }
      }

      function restoreEventLogFromStorage() {
        try {
          const raw = localStorage.getItem(EVENT_LOG_KEY);
          if (!raw) return;
          const items = JSON.parse(raw || "[]");
          if (!Array.isArray(items) || !items.length) return;
          // restore in reverse so newest first remains top
          for (let i = items.length - 1; i >= 0; i--) {
            const it = items[i];
            appendEventLog(
              it.title || "",
              it.text || "",
              it.severity || "info"
            );
          }
          // set compact items to the two most recent entries (if present)
          try {
            const item0 = document.getElementById("event-log-compact-item-0");
            const item1 = document.getElementById("event-log-compact-item-1");
            const body = document.getElementById("event-log-body");
            if (body && body.children && body.children.length) {
              const newest = body.children[0];
              const second = body.children[1];
              if (item0)
                item0.textContent =
                  newest && newest.querySelector("strong")
                    ? newest.querySelector("strong").textContent +
                      ": " +
                      (newest.querySelector("div:nth-of-type(3)")
                        ? newest
                            .querySelector("div:nth-of-type(3)")
                            .innerText.split("\n")[0]
                        : "")
                    : "";
              if (item1)
                item1.textContent =
                  second && second.querySelector("strong")
                    ? second.querySelector("strong").textContent +
                      ": " +
                      (second.querySelector("div:nth-of-type(3)")
                        ? second
                            .querySelector("div:nth-of-type(3)")
                            .innerText.split("\n")[0]
                        : "")
                    : "\u00A0";
            }
          } catch (e) {}
        } catch (e) {
          console.warn("restoreEventLogFromStorage failed", e);
        }
      }

      // Filtering and searching (debug-only): hide debug-channel entries unless the
      // debug toggle is enabled. Also support full-text search.
      function applyEventFilters() {
        try {
          const body = document.getElementById("event-log-body");
          if (!body) return;
          const showDebug = document.getElementById("filter-debug")
            ? document.getElementById("filter-debug").checked
            : false;
          const q = (
            document.getElementById("event-log-search")
              ? document.getElementById("event-log-search").value
              : ""
          )
            .toLowerCase()
            .trim();
          for (const ch of Array.from(body.children)) {
            try {
              // hide debug-channel entries unless showDebug is true
              if (ch.classList.contains("channel-debug") && !showDebug) {
                ch.style.display = "none";
                continue;
              }
              if (q) {
                const txt = (
                  ch.dataset.text ||
                  ch.innerText ||
                  ""
                ).toLowerCase();
                if (txt.indexOf(q) === -1) {
                  ch.style.display = "none";
                  continue;
                }
              }
              ch.style.display = "block";
            } catch (e) {
              console.warn("applyEventFilters item failed", e);
            }
          }
        } catch (e) {
          console.warn("applyEventFilters failed", e);
        }
      }

      // Global SSE stream
      let GLOBAL_LOG_ES = null;
      function startGlobalEventStream() {
        try {
          if (GLOBAL_LOG_ES) return;
          GLOBAL_LOG_ES = new EventSource(BASE + "/api/tail-wikigraphs");
          // (Handler removed) The onmessage handler below handles both
          // structured JSON events and raw text; keep only the safe handler.
          GLOBAL_LOG_ES.onmessage = (ev) => {
            try {
              // Try to parse structured JSON events. If parsing fails, treat the
              // incoming data as raw text and do NOT create a persistent event
              // log entry (this prevents "Generator / (no log file yet)" entries).
              let obj = null;
              try {
                obj = JSON.parse(ev.data);
              } catch (e) {
                obj = null;
              }

              // If we received structured JSON, append to the persistent event log.
              if (obj && typeof obj === "object") {
                const sev = (obj.severity || obj.level || "info").toLowerCase();
                const mapped =
                  sev === "warn" ? "warn" : sev === "error" ? "error" : "info";
                const channel =
                  obj.channel === "debug" || obj.debug === true
                    ? "debug"
                    : "general";
                // Only append persistent events when there's a title or text; avoid
                // creating spurious 'Generator' entries for empty messages.
                const payloadText = obj.text || obj.message || "";
                if (
                  (obj.title && String(obj.title).trim()) ||
                  payloadText.trim()
                ) {
                  appendEventLog(
                    obj.title || "",
                    payloadText,
                    mapped,
                    [],
                    channel
                  );
                }
                // Also append the same human-readable text to the busy overlay if visible
                try {
                  const genLogEl = document.getElementById("generator-log");
                  if (
                    genLogEl &&
                    genLogEl.parentElement &&
                    genLogEl.parentElement.style.display !== "none"
                  ) {
                    const span = document.createElement("span");
                    span.className =
                      "log-line " +
                      (mapped === "error" ? "log-error" : "log-info");
                    span.textContent = (obj.text || obj.message || "") + "\n";
                    genLogEl.appendChild(span);
                    genLogEl.scrollTop = genLogEl.scrollHeight;
                  }
                } catch (e) {}
              } else {
                // Raw text: show in the busy overlay if visible, but do NOT create
                // a persistent event log entry to avoid spurious Generator messages.
                try {
                  const genLogEl = document.getElementById("generator-log");
                  if (
                    genLogEl &&
                    genLogEl.parentElement &&
                    genLogEl.parentElement.style.display !== "none"
                  ) {
                    const span = document.createElement("span");
                    span.className = "log-line log-info";
                    span.textContent = ev.data + "\n";
                    genLogEl.appendChild(span);
                    genLogEl.scrollTop = genLogEl.scrollHeight;
                  }
                } catch (e) {}
              }
            } catch (e) {
              console.warn("GLOBAL_LOG_ES.onmessage failed", e);
            }
          };
          // restore persisted events
          try {
            restoreEventLogFromStorage();
          } catch (e) {}
          const toggle = document.getElementById("toggle-log");
          const container = document.getElementById("event-log");
          const logBody = document.getElementById("event-log-body");
          const compact = document.getElementById("event-log-compact");
          const controls = document.getElementById("event-log-controls");
          if (toggle && container) {
            toggle.addEventListener("click", () => {
              const expanded = container.classList.toggle("expanded");
              if (expanded) {
                // show full body and controls
                if (logBody) logBody.style.display = "block";
                if (compact) compact.style.display = "none";
                if (controls) controls.style.display = "flex";
                toggle.textContent = "▣";
                toggle.title = "Collapse log";
              } else {
                // hide full UI, show compact only
                if (logBody) logBody.style.display = "none";
                if (compact) compact.style.display = "flex";
                if (controls) controls.style.display = "none";
                toggle.textContent = "▢";
                toggle.title = "Expand log";
              }
            });
          }
        } catch (e) {}
      }
      // Apply search and filter bindings
      document.addEventListener("DOMContentLoaded", () => {
        try {
          const search = document.getElementById("event-log-search");
          if (search) search.addEventListener("input", applyEventFilters);
          const fDebug = document.getElementById("filter-debug");
          if (fDebug) fDebug.addEventListener("change", applyEventFilters);
        } catch (e) {}
        // start global SSE stream
        try {
          startGlobalEventStream();
        } catch (e) {}
      });

      function pulseOnce() {
        document.body.classList.add("pulse");
        setTimeout(() => document.body.classList.remove("pulse"), 900);
      }

      // Show a UI-blocking busy overlay with optional message
      function showBusy(msg) {
        try {
          const overlay = document.getElementById("busy-overlay");
          if (!overlay) return;
          overlay.style.display = "flex";
          overlay.setAttribute("aria-hidden", "false");
          const text = overlay.querySelector(".busy-card div strong");
          if (text && msg) text.textContent = msg;
        } catch (e) {
          console.warn("showBusy failed", e);
        }
      }

      function hideBusy() {
        try {
          const overlay = document.getElementById("busy-overlay");
          if (!overlay) return;
          overlay.style.display = "none";
          overlay.setAttribute("aria-hidden", "true");
        } catch (e) {
          console.warn("hideBusy failed", e);
        }
      }

      // app state
      const entriesWrap = document.getElementById("entries-wrap");
      const mdContainer = document.getElementById("md-container");
      const curpathEl = document.getElementById("curpath");
      const pinBtn = document.getElementById("pin-btn");
      const pinnedListEl = document.getElementById("pinned-list");
      const upBtn = document.getElementById("up-btn");
      // stack holds relative folder paths (no leading 'Player Root/' prefix).
      // Root is represented by an empty string "".
      let stack = [""];
      let openPath = null,
        openFileName = null;
      let ws = null;
      const cachedHash = Object.create(null);
      const locks = Object.create(null);
      const clientId = Math.random().toString(36).slice(2, 9);

      // Ensure a path is returned in the canonical 'Player Root' form.
      // Accepts either a relative path ("PCs/Anju/file.md") or a
      // frontend-style "Player Root/..." path and returns a normalized
      // string. Empty/falsey input yields the top-level "Player Root".
      function ensurePlayerRoot(p) {
        if (!p && p !== "") return "Player Root";
        p = String(p || "").trim();
        if (p === "") return "Player Root";
        if (/^Player Root\//i.test(p))
          return p.replace(/^Player Root\//i, "Player Root/");
        // strip leading slashes
        p = p.replace(/^\/+/, "");
        return "Player Root/" + p;
      }

      // Encode path segments for use in URLs. Accepts either a
      // canonical 'Player Root/...' string or a relative path and returns
      // an encoded segment string (e.g. 'PCs/Anju/My%20File.md'). An empty
      // result is returned for top-level.
      function encodeSegments(p) {
        if (!p && p !== "") return "";
        let s = String(p || "").trim();
        // remove 'Player Root/' prefix when present
        if (/^Player Root\//i.test(s)) s = s.replace(/^Player Root\//i, "");
        s = s.replace(/^\/+|\/+$/g, "");
        if (!s) return "";
        return s
          .split("/")
          .map((seg) => encodeURIComponent(seg))
          .join("/");
      }

      // Try to resolve an HTML file URL. Prefer the direct repo-relative URL
      // and the stable /graphs/ alias. Legacy /vault/ proxy fallbacks have been
      // removed.
      async function resolveHtmlUrl(seg) {
        // seg: encoded path segments like 'Player%20Root/Player%20Root_wikigraph_sunburst.html' or 'PCs/Anju/Anju_wikigraph.html'
        if (!seg && seg !== "") return null;
        const direct = `${location.origin}/${seg}`;
        try {
          const res = await fetch(direct, { method: "HEAD" });
          if (res.ok) return direct;
        } catch (e) {
          // network error, fall through to vault fallback
        }
        // First, prefer the dedicated /graphs/ alias which maps to
        // Mycelium/scripts/manuals/graphs for stable URLs.
        try {
          const graphsUrl = `${location.origin}/graphs/${seg}`;
          const g = await fetch(graphsUrl, { method: "HEAD" });
          if (g.ok) return graphsUrl;
        } catch (e) {
          // ignore and fall back to vault probing
        }

        // final fallback: return direct URL (may 404 if not present)
        return direct;
      }

      async function fetchPath(p) {
        const seg = encodeSegments(p);
        const res = await fetch(
          BASE + "/player_root" + (seg ? "/" + seg : ""),
          { cache: "no-store" }
        );
        if (!res.ok) return null;
        return res.json();
      }
      async function fetchPathWithHash(p) {
        const seg = encodeSegments(p);
        const res = await fetch(
          BASE + "/player_root" + (seg ? "/" + seg : ""),
          { cache: "no-store" }
        );
        if (!res.ok) return null;
        const j = await res.json();
        let h = null;
        // Prefer server-provided hash (ETag/hash field). Fall back to client-side hashing when missing.
        if (j && j.hash) {
          h = j.hash;
          cachedHash[p] = h;
        } else {
          try {
            h = await hashText(j.content || "");
            cachedHash[p] = h;
          } catch (err) {
            // hashText may fail on older browsers; continue without hash
            console.warn("hashText failed, skipping hash:", err);
            h = null;
          }
        }
        return { json: j, hash: h };
      }

      // Create an empty markdown file in the given folder.
      // folder: may be a relative path ("PCs/Anju") or a canonical "Player Root/..." string.
      // Returns true on success, false on failure.
      async function createMdFile(folder, filename) {
        try {
          const body = { folderPath: folder || "", filename: filename };
          const res = await fetch(BASE + "/api/create-md-file", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!res.ok) {
            // try to parse json error, fall back to text
            let txt = null;
            try {
              const j = await res.json();
              txt = j && (j.error || JSON.stringify(j));
            } catch (e) {
              txt = await res.text();
            }
            showNotif("Create file failed", String(txt || res.status));
            return false;
          }
          const j = await res.json();
          if (j && j.success) {
            showNotif("Created", (j.path || filename) + " created");
            return true;
          }
          showNotif("Create file", "Unexpected response from server");
          return false;
        } catch (e) {
          showNotif("Create error", String(e));
          return false;
        }
      }

      async function renderDir(p = "") {
        // Normalize p to a relative path without 'Player Root/' prefix so the
        // rest of the function can assume a consistent format for stack entries.
        p = (p || "").replace(/^Player Root\//i, "");
        debugLog("renderDir(" + p + ") called");
        const j = await fetchPath(p);
        debugLog(
          "fetchPath returned " +
            (j
              ? Array.isArray(j.entries)
                ? j.entries.length
                : "has_entries?"
              : "null")
        );
        // When rendering a directory, clear any open file state so the UI
        // treats the current location as the folder rather than a stale file.
        openPath = null;
        openFileName = null;
        entriesWrap.innerHTML = "";
        mdContainer.innerHTML = "";
        // p is expected to be a relative path (no Player Root/ prefix)
        // Display the current relative path in the UI.
        curpathEl.textContent = p;
        // refresh pin UI for this location
        refreshPinUI();
        // enable graphs button when viewing a folder
        try {
          const graphsBtn = document.getElementById("graphs-btn");
          if (graphsBtn) graphsBtn.disabled = false;
        } catch (e) {}
        // Up should be disabled only when the current normalized path is the repository root (empty string)
        try {
          upBtn.disabled = p === "";
        } catch (e) {
          upBtn.disabled = false;
        }
        if (!j) return;
        const ul = create("ul", { className: "entries" });
        const entries = j.entries || [];
        for (const e of entries) {
          const li = create("li");
          // For HTML file entries, set the anchor href to the static server's
          // /vault URL and target _blank so left-click opens a new tab. For
          // non-HTML files keep a hash href and handle opening in-app.
          let href = "#";
          const isHtmlFile =
            e.type === "file" && e.name.toLowerCase().endsWith(".html");
          if (isHtmlFile) {
            // Point directly to the repo-relative HTML file instead of using
            // the /vault proxy route. The server returns e.path as a path
            // relative to the repository root; strip any leading "Player Root/"
            // prefix and link to that file so the browser requests the actual
            // HTML file path.
            let rel = e.path || "";
            if (/^Player Root\//i.test(rel))
              rel = rel.replace(/^Player Root\//i, "");
            // encode path segments safely and resolve to a working URL (direct or /vault fallback)
            href = await resolveHtmlUrl(encodeSegments(rel));
          }
          const a = create("a", {
            href,
            textContent: e.name,
            ...(isHtmlFile ? { target: "_blank", rel: "noopener" } : {}),
          });
          // mark links that point to .html files so they can be styled differently
          if (isHtmlFile) {
            a.classList.add("html-link");
            // give a clear tooltip so users know this opens externally
            a.title = "Opens in new tab (external)";
          }
          a.addEventListener("click", (ev) => {
            // allow modified clicks (ctrl/cmd/shift/alt) and middle-click to open
            // the href in a new tab/window via the browser default behavior
            const isModified =
              ev.metaKey ||
              ev.ctrlKey ||
              ev.shiftKey ||
              ev.altKey ||
              ev.button === 1 ||
              ev.which === 2;
            if (e.type === "dir") {
              ev.preventDefault();
              // normalize to a relative folder path (strip any leading 'Player Root/')
              const rel = (e.path || "").replace(/^Player Root\//i, "");
              stack.push(rel);
              renderDir(rel);
            } else {
              // HTML files: let the browser open the /vault href in a new tab
              // when clicked (target=_blank). Non-HTML files should open in-app.
              if (isHtmlFile) {
                // allow default navigation (will open in new tab due to target)
                return;
              }
              if (isModified) {
                // modified clicks on non-html files should still let the browser
                // handle (though href is '#', so fall back to opening in-app)
                return;
              }
              ev.preventDefault();
              openFile(e.path, e.name);
            }
          });
          li.appendChild(a);
          li.appendChild(
            create("div", { className: "muted", textContent: e.type })
          );
          // If we're viewing the deleted folder, show a Restore button for files
          const viewingDeleted =
            (p || "").replace(/^Player Root\//i, "") === "deleted" ||
            (j &&
              j.path &&
              j.path.replace(/^Player Root\//i, "") === "deleted");
          if (viewingDeleted && e.type === "file") {
            const restoreBtn = create("button", { textContent: "Restore" });
            restoreBtn.style.marginLeft = "8px";
            restoreBtn.addEventListener("click", async (ev) => {
              ev.preventDefault();
              const defaultDst = prompt(
                "Restore to (path under Player Root, e.g. PCs/Anju):",
                "PCs/"
              );
              if (!defaultDst) return;
              // build destination path: ensure folder + original filename
              const dstFolder = defaultDst.replace(/^\/+|\/+$/g, "");
              const dstFull = ensurePlayerRoot(dstFolder + "/" + e.name);
              const srcFull = ensurePlayerRoot("deleted/" + e.name);
              try {
                const r = await fetch(BASE + "/player_root/move", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ src: srcFull, dst: dstFull }),
                });
                if (!r.ok) {
                  const txt = await r.text();
                  showNotif("Restore failed", txt || String(r.status));
                  return;
                }
                showNotif("Restored", e.name);
                // refresh deleted view
                renderDir("deleted");
              } catch (err) {
                showNotif("Restore error", String(err));
              }
            });
            li.appendChild(restoreBtn);
          }
          ul.appendChild(li);
        }
        // Add an inline "New .md file" input when viewing a directory
        try {
          const newMdDiv = create("div", {
            style: "margin:12px 0;display:flex;gap:8px;align-items:center",
          });
          const input = create("input", {
            placeholder: "new-file.md",
            style: "flex:1;padding:6px;border-radius:4px;border:1px solid #ddd",
          });
          const newMdBtn = create("button", { textContent: "Create" });
          // supply the current folder via dataset so handlers can access it
          newMdBtn.dataset.folder = j.path || p || "";
          // wire create action directly (lightweight, no modal)
          newMdBtn.addEventListener("click", async (ev) => {
            ev.preventDefault();
            const name =
              (input.value || "").trim() || input.placeholder || "new-file.md";
            if (!name) return;
            const ok = await createMdFile(newMdBtn.dataset.folder, name);
            if (ok) {
              // clear input and refresh current directory view
              input.value = "";
              if (typeof renderDir === "function") {
                // ensure we refresh the top of stack (relative path)
                const ptop =
                  stack && stack.length
                    ? stack[stack.length - 1]
                    : j.path || p || "";
                // j.path or p may include 'Player Root/' prefix; normalize to relative
                const relTop = (ptop || "").replace(/^Player Root\//i, "");
                renderDir(relTop || "");
              } else {
                location.reload();
              }
            }
          });
          newMdDiv.appendChild(input);
          newMdDiv.appendChild(newMdBtn);
          entriesWrap.appendChild(newMdDiv);
        } catch (e) {
          console.warn("failed to render new file input", e);
        }

        entriesWrap.appendChild(ul);
        // show md previews
        const mds = entries.filter(
          (e) => e.type === "file" && e.name.toLowerCase().endsWith(".md")
        );
        for (const f of mds) {
          const box = create("div", { className: "markdown-file" });
          // apply node colouring to the preview background so it matches graph nodes
          try {
            box.style.background = nodeColorForKey(f.path || f.name);
          } catch (e) {}
          const title = create("div", { className: "file-title" });
          const left = create("div");
          const nameLink = create("a", { href: "#", textContent: f.name });
          nameLink.style.textDecoration = "none";
          nameLink.style.color = "inherit";
          nameLink.addEventListener("click", (ev) => {
            ev.preventDefault();
            openFile(f.path, f.name);
          });
          const meta = create("div", {
            className: "file-meta",
            textContent: `/${f.path.replace(/^Player Root\//i, "")}`,
          });
          left.appendChild(nameLink);
          left.appendChild(meta);
          const openBtn = create("button", { textContent: "Open" });
          openBtn.addEventListener("click", () => openFile(f.path, f.name));
          title.appendChild(left);
          title.appendChild(openBtn);
          box.appendChild(title);
          const preview = create("div");
          preview.textContent = "Loading...";
          box.appendChild(preview);
          mdContainer.appendChild(box);
          (async () => {
            const seg = encodeSegments(f.path.replace(/^Player Root\//i, ""));
            const res = await fetch(BASE + "/player_root/" + seg);
            if (!res.ok) {
              preview.textContent = "error";
              return;
            }
            const j = await res.json();
            preview.innerHTML = renderMarkdown(j.content || "");
            try {
              // style tables to use a variant of the node background
              const nodeBg =
                box.style.background || nodeColorForKey(f.path || f.name);
              stylePreviewTables(preview, nodeBg);
            } catch (e) {}
          })();
        }
      }

      async function openFile(path, name) {
        openPath = path;
        openFileName = name;
        // If this is an HTML file, open it directly in a new tab (vault URL) and return.
        if (name.toLowerCase().endsWith(".html")) {
          try {
            // Open the actual HTML file directly (repo-relative) instead of
            // using the /vault proxy. Strip any leading Player Root/ prefix
            // and encode path segments so the browser requests the correct file.
            let rel = path || "";
            if (/^Player Root\//i.test(rel))
              rel = rel.replace(/^Player Root\//i, "");
            const seg = encodeSegments(rel);
            const url = await resolveHtmlUrl(seg);
            try {
              window.open(url, "_blank");
            } catch (e) {
              location.href = url;
            }
          } catch (e) {
            console.warn("failed to open html file in new tab", e);
          }
          return;
        }
        mdContainer.innerHTML = "";
        const contentPane = create("div", { className: "markdown-file" });
        // apply node colouring to the opened file pane background
        try {
          contentPane.style.background = nodeColorForKey(path || name);
        } catch (e) {}
        // For non-HTML files we show the editor/preview
        // Previously HTML files were embedded; now HTML files are opened in a new tab instead.

        contentPane.innerHTML = `<div class="file-title"><div><strong id="file-title-name">${name}</strong><div id="file-lock" class="file-meta"></div><div class="file-meta">/${path.replace(
          /^Player Root\//i,
          ""
        )}</div></div><div><button id="fullscreen-btn">Full screen</button> <button id="refresh-btn" style="margin-left:8px">Refresh</button></div></div>
          <div style="margin-top:8px;position:relative">
            <textarea id="file-ta" style="width:100%;min-height:320px;padding-right:140px" placeholder="Loading..."></textarea>
            <div id="file-controls" style="position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:8px;align-items:flex-end">
              <button id="save-btn">Save</button>
              <button id="delete-btn" style="background:#ffefef;border:1px solid #cc9999">Delete</button>
              <button id="retry-btn" style="display:none">Retry</button>
              <button id="open-raw" style="display:none">Open raw</button>
              <span id="status" class="muted" style="display:block;white-space:nowrap"></span>
            </div>
          </div>
          <h3>Preview</h3>
          <div id="preview" style="background:#fff;padding:8px;border-radius:6px;min-height:120px"></div>`;
        mdContainer.appendChild(contentPane);

        // refresh pin UI for this opened file
        refreshPinUI();
        // disable graphs button when a file is open
        try {
          const graphsBtn = document.getElementById("graphs-btn");
          if (graphsBtn) graphsBtn.disabled = true;
        } catch (e) {}

        const ta = $("#file-ta");
        const statusEl = $("#status");
        const retryBtn = $("#retry-btn");
        const openRawBtn = $("#open-raw");

        async function loadContent() {
          if (statusEl) statusEl.textContent = "loading...";
          try {
            // For HTML files we don't fetch content via the backend; instead
            // set iframe src to the static server 'vault' path and return early.
            if (name.toLowerCase().endsWith(".html")) {
              const iframe = $("#file-iframe");
              // Use the repo-relative file URL directly rather than /vault proxy.
              let rel = path || "";
              if (/^Player Root\//i.test(rel))
                rel = rel.replace(/^Player Root\//i, "");
              const encoded = encodeSegments(rel);
              const src = await resolveHtmlUrl(encoded);
              if (iframe) iframe.src = src;
              if (openRawBtn) openRawBtn.style.display = "";
              if (retryBtn) retryBtn.style.display = "none";
              if (statusEl) statusEl.textContent = "";
              updateLockUI(path);
              return { json: { content: null }, hash: null };
            }
            const resObj = await fetchPathWithHash(path);
            if (!resObj) {
              // show a helpful placeholder rather than an empty box
              if (ta)
                ta.value =
                  "// Failed to load content from backend.\n// Tap Retry to attempt again, or Open raw to view via backend URL.";
              const prevEl = $("#preview");
              if (prevEl) prevEl.textContent = "";
              if (statusEl) statusEl.textContent = "failed to load";
              if (retryBtn) retryBtn.style.display = "";
              if (openRawBtn) openRawBtn.style.display = "";
              return null;
            }
            const j = resObj.json;
            ta.value = j.content || "";
            $("#preview").innerHTML = DOMPurify.sanitize(
              renderMarkdown(j.content || "")
            );
            try {
              const nodeBg =
                contentPane.style.background || nodeColorForKey(path || name);
              stylePreviewTables($("#preview"), nodeBg);
            } catch (e) {}
            statusEl.textContent = "";
            retryBtn.style.display = "none";
            openRawBtn.style.display = "none";
            updateLockUI(path);
            return resObj;
          } catch (e) {
            if (ta)
              ta.value =
                "// Error loading content: " + String(e) + "\n// Tap Retry";
            const prevEl = $("#preview");
            if (prevEl) prevEl.textContent = "";
            if (statusEl) statusEl.textContent = "error";
            if (retryBtn) retryBtn.style.display = "";
            if (openRawBtn) openRawBtn.style.display = "";
            return null;
          }
        }

        // initial load
        await loadContent();

        // Refresh button - manually reload current file from server
        const refreshBtn = $("#refresh-btn");
        if (refreshBtn) {
          refreshBtn.addEventListener("click", async () => {
            if (statusEl) statusEl.textContent = "refreshing...";
            await loadContent();
            if (statusEl) statusEl.textContent = "";
            showNotif("Refreshed", path.replace(/^Player Root\//i, ""));
          });
        }

        if (ta) {
          ta.addEventListener("input", () => {
            const prev = $("#preview");
            if (prev)
              prev.innerHTML = DOMPurify.sanitize(
                renderMarkdown(ta.value || "")
              );
            if (statusEl) statusEl.textContent = "";
            sendLock(path);
          });
        }

        if (retryBtn) {
          retryBtn.addEventListener("click", async () => {
            if (statusEl) statusEl.textContent = "retrying...";
            await loadContent();
          });
        }

        if (openRawBtn) {
          openRawBtn.addEventListener("click", () => {
            // For HTML files, open the actual repo-relative HTML file path.
            if (name.toLowerCase().endsWith(".html")) {
              let rel = path || "";
              if (/^Player Root\//i.test(rel))
                rel = rel.replace(/^Player Root\//i, "");
              const seg = encodeSegments(rel);
              const url = `${location.origin}/${seg}`;
              try {
                window.open(url, "_blank");
              } catch (e) {
                location.href = url;
              }
            } else {
              const seg = encodeSegments(ensurePlayerRoot(path));
              const url = BASE + "/player_root/" + seg;
              try {
                window.open(url, "_blank");
              } catch (e) {
                location.href = url;
              }
            }
          });
        }

        // Fullscreen toggle
        const fsBtn = $("#fullscreen-btn");
        let isFs = false;
        function enterFs() {
          contentPane.classList.add("is-fullscreen");
          fsBtn.textContent = "Close";
          isFs = true;
        }
        function exitFs() {
          contentPane.classList.remove("is-fullscreen");
          fsBtn.textContent = "Full screen";
          isFs = false;
        }
        fsBtn.addEventListener("click", () => {
          if (!isFs) enterFs();
          else exitFs();
        });

        const saveBtn = $("#save-btn");
        if (saveBtn) {
          saveBtn.addEventListener("click", async () => {
            const content = ta.value;
            const remote = await fetchPathWithHash(path);
            const remoteHash = remote ? remote.hash : null;
            const baseHash = cachedHash[path];
            if (remoteHash && baseHash && remoteHash !== baseHash) {
              showConflictModal(
                path,
                ta.value,
                remote.json.content,
                async (action) => {
                  if (action === "overwrite") {
                    await doSave(path, content, true);
                  } else if (action === "accept_remote") {
                    ta.value = remote.json.content || "";
                    $("#preview").innerHTML = renderMarkdown(ta.value || "");
                    cachedHash[path] = await hashText(ta.value || "");
                  } else if (action === "merge") {
                    showNotif("Conflict", "Edit merged content and press Save");
                  }
                }
              );
              return;
            }
            await doSave(path, content, false);
          });
        }

        // Delete button: move file to Player Root/deleted/deleted_<originalname>
        const deleteBtn = $("#delete-btn");
        if (deleteBtn) {
          deleteBtn.addEventListener("click", async () => {
            const confirmDelete = confirm(
              `Are you sure you want to delete ${name}? This will move it to Player Root/deleted/deleted_${name}.`
            );
            if (!confirmDelete) return;
            try {
              const taVal = ta ? ta.value : "";

              // Ensure destination folder path (without Player Root prefix) for the API call
              const deletedFolderRel = "deleted"; // under Player Root
              const dstName = `deleted_${name}`;

              // Perform atomic server-side move via POST /player_root/move
              try {
                const moveUrl = BASE + "/player_root/move";
                const srcFull = ensurePlayerRoot(path);
                const dstFull = ensurePlayerRoot(
                  deletedFolderRel + "/" + dstName
                );
                const moveRes = await fetch(moveUrl, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ src: srcFull, dst: dstFull }),
                });
                if (!moveRes.ok) {
                  const txt = await moveRes.text();
                  showNotif(
                    "Delete failed",
                    `move failed: ${moveRes.status} ${txt}`
                  );
                  return;
                }
              } catch (e) {
                showNotif("Delete failed", String(e));
                return;
              }

              showNotif(
                "Deleted",
                `${name} moved to Player Root/deleted/${dstName}`,
                8000,
                [
                  {
                    label: "Undo",
                    cb: async () => {
                      try {
                        const moveUrl = BASE + "/player_root/move";
                        const srcFull = ensurePlayerRoot(
                          deletedFolderRel + "/" + dstName
                        );
                        const dstFull = ensurePlayerRoot(path);
                        const r = await fetch(moveUrl, {
                          method: "POST",
                          headers: { "Content-Type": "application/json" },
                          body: JSON.stringify({ src: srcFull, dst: dstFull }),
                        });
                        if (!r.ok) {
                          const txt = await r.text();
                          showNotif("Undo failed", txt || String(r.status));
                          return;
                        }
                        showNotif("Restored", name);
                        // refresh current dir view
                        renderDir(stack[stack.length - 1]);
                      } catch (err) {
                        console.error("undo move err", err);
                        showNotif("Undo error", String(err));
                      }
                    },
                  },
                ]
              );
              // close editor and refresh view
              openPath = null;
              openFileName = null;
              mdContainer.innerHTML = "";
              // ensure we render the current top-of-stack as a relative path
              const top = stack && stack.length ? stack[stack.length - 1] : "";
              renderDir((top || "").replace(/^Player Root\//i, ""));
            } catch (err) {
              console.error("delete error", err);
              showNotif("Delete error", String(err));
            }
          });
        }
      }

      // ---- Pin management ----
      // New pin format: store array of objects {path, label}
      // normalizePinPath ensures canonical 'Player Root/...' prefix for comparisons
      function normalizePinPath(p) {
        if (!p) return p;
        p = String(p).trim();
        if (/^Player Root\//i.test(p))
          return p.replace(/^Player Root\//i, "Player Root/");
        p = p.replace(/^\/+/, "");
        return "Player Root/" + p;
      }

      function loadPins() {
        try {
          const raw = localStorage.getItem("mycelium_pins") || "[]";
          const arr = JSON.parse(raw || "[]");
          if (!Array.isArray(arr)) return [];
          // Backwards compatibility: accept array of strings -> convert and normalize
          if (arr.length && typeof arr[0] === "string") {
            return arr
              .map((p) => ({
                path: normalizePinPath(p),
                label: (p || "").split("/").pop(),
              }))
              .filter((o) => o && o.path);
          }
          // Validate objects and normalize paths
          return arr
            .map((o) => ({
              path: normalizePinPath(o && o.path ? o.path : ""),
              label:
                o && o.label
                  ? o.label
                  : o && o.path
                  ? (o.path || "").split("/").pop()
                  : "",
            }))
            .filter((o) => o && o.path);
        } catch (e) {
          return [];
        }
      }
      function savePins(arr) {
        try {
          // ensure we store only minimal objects with normalized paths
          const norm = (arr || []).map((o) => ({
            path: normalizePinPath(o.path),
            label: o.label,
          }));
          localStorage.setItem("mycelium_pins", JSON.stringify(norm));
        } catch (e) {}
      }
      function isPinned(target) {
        if (!target) return false;
        const norm = normalizePinPath(target);
        const pins = loadPins();
        return pins.some((p) => p.path === norm);
      }
      async function togglePin(target) {
        if (!target) return;
        const normTarget = normalizePinPath(target);
        const pins = loadPins();
        const idx = pins.findIndex((x) => x.path === normTarget);
        if (idx === -1) {
          // ask for a label
          let suggested = (target || "").split("/").pop() || target;
          try {
            const val = prompt("Label for pin:", suggested);
            if (val === null) return; // cancelled
            const label = (val || suggested).trim() || suggested;
            pins.push({ path: normTarget, label });
          } catch (e) {
            pins.push({ path: normTarget, label: suggested });
          }
        } else {
          pins.splice(idx, 1);
        }
        savePins(pins);
        renderPins();
        refreshPinUI();
      }
      function renderPins() {
        if (!pinnedListEl) return;
        const pins = loadPins();
        // Hide the visual sidebar if no pins exist
        try {
          const sb = document.getElementById("pins-sidebar");
          if (sb) sb.style.display = pins && pins.length ? "flex" : "none";
        } catch (e) {}
        pinnedListEl.innerHTML = "";
        for (const p of pins) {
          const btn = create("button", {
            textContent:
              (p.label && p.label.length > 16
                ? p.label.slice(0, 13) + "..."
                : p.label) || p.path,
            title: p.path,
          });
          btn.style.padding = "6px 8px";
          btn.style.borderRadius = "6px";
          btn.style.border = "1px solid #ccc";
          btn.style.background = "#fff";
          btn.addEventListener("click", (ev) => {
            ev.preventDefault();
            const rel = p.path.replace(/^Player Root\//i, "");
            if (p.path.toLowerCase().endsWith(".md")) {
              // Reset navigation to the parent folder of the file so the
              // UI treats the location as the containing folder rather than
              // accumulating file paths on the stack which confused pin state.
              const parent = rel.split("/").slice(0, -1).join("/");
              if (parent) stack = [parent];
              else stack = [""]; // root
              renderDir(stack[stack.length - 1]);
              setTimeout(() => openFile(p.path, p.path.split("/").pop()), 200);
            } else {
              // For folder pins, navigate directly to that folder (reset stack)
              stack = [rel];
              renderDir(stack[stack.length - 1]);
            }
          });
          // edit label control
          const edit = create("button", { textContent: "✎" });
          edit.style.marginLeft = "6px";
          edit.title = "Edit pin label";
          edit.addEventListener("click", (ev) => {
            ev.preventDefault();
            const v = prompt("Pin label:", p.label || p.path.split("/").pop());
            if (v === null) return;
            const pins2 = loadPins().map((x) =>
              x.path === p.path
                ? { path: x.path, label: (v || "").trim() || x.label }
                : x
            );
            savePins(pins2);
            renderPins();
            refreshPinUI();
          });
          // unpin control
          const unpin = create("button", { textContent: "×" });
          unpin.style.marginLeft = "6px";
          unpin.title = "Unpin";
          unpin.addEventListener("click", (ev) => {
            ev.preventDefault();
            const pins2 = loadPins().filter((x) => x.path !== p.path);
            savePins(pins2);
            renderPins();
            refreshPinUI();
          });
          const wrap = create("span", {
            style: "display:inline-flex;align-items:center;gap:6px",
          });
          // enable dragging to reorder pins
          wrap.setAttribute("draggable", "true");
          wrap.dataset.path = p.path;
          wrap.appendChild(btn);
          wrap.appendChild(edit);
          wrap.appendChild(unpin);
          pinnedListEl.appendChild(wrap);
        }
        // drag & drop handlers for reordering
        let dragSrcPath = null;
        pinnedListEl.addEventListener("dragstart", (ev) => {
          const tgt =
            ev.target.closest && ev.target.closest("span[draggable='true']");
          if (!tgt) return;
          dragSrcPath = tgt.dataset.path;
          try {
            ev.dataTransfer.setData("text/plain", dragSrcPath);
          } catch (e) {}
        });
        pinnedListEl.addEventListener("dragover", (ev) => {
          ev.preventDefault();
          const over =
            ev.target.closest && ev.target.closest("span[draggable='true']");
          if (!over) return;
          over.style.outline = "2px dashed #aaa";
        });
        pinnedListEl.addEventListener("dragleave", (ev) => {
          const over =
            ev.target.closest && ev.target.closest("span[draggable='true']");
          if (!over) return;
          over.style.outline = "";
        });
        pinnedListEl.addEventListener("drop", (ev) => {
          ev.preventDefault();
          const dst =
            ev.target.closest && ev.target.closest("span[draggable='true']");
          if (!dst || !dragSrcPath) return;
          dst.style.outline = "";
          const dstPath = dst.dataset.path;
          if (!dstPath || dstPath === dragSrcPath) return;
          // reorder pins array: move dragSrcPath to before dstPath
          const pins2 = loadPins();
          const srcIdx = pins2.findIndex((x) => x.path === dragSrcPath);
          const dstIdx = pins2.findIndex((x) => x.path === dstPath);
          if (srcIdx === -1 || dstIdx === -1) return;
          const [item] = pins2.splice(srcIdx, 1);
          pins2.splice(dstIdx, 0, item);
          savePins(pins2);
          renderPins();
        });
      }
      function refreshPinUI() {
        const current =
          openPath || (stack && stack.length ? stack[stack.length - 1] : "");
        if (!pinBtn) return;
        if (!current) {
          pinBtn.textContent = "Pin";
          pinBtn.disabled = true;
          return;
        }
        pinBtn.disabled = false;
        if (isPinned(current)) pinBtn.textContent = "Unpin";
        else pinBtn.textContent = "Pin";
      }
      if (pinBtn) {
        pinBtn.addEventListener("click", async () => {
          const current =
            openPath || (stack && stack.length ? stack[stack.length - 1] : "");
          if (!current) return;
          await togglePin(current);
        });
      }
      try {
        renderPins();
      } catch (e) {}

      async function doSave(path, content, forceOverwrite) {
        // Determine whether to route this save through the special
        // `/update_sheet/<Name>` wrapper. Only do that for files that are
        // clearly a character sheet. Previously we routed any file under
        // `Player Root/PCs/<Name>/...` which caused unrelated files like
        // `<Name>_variables.md` to be written into the character sheet.
        let saveUrl = null;
        try {
          const decoded = path.replace(/^Player Root\//i, "");
          const parts = decoded.split("/").filter(Boolean);
          if (parts.length >= 2 && parts[0].toLowerCase() === "pcs") {
            const fileName = parts.slice(2).join("/") || ""; // path inside the PC folder
            const baseFile = parts.slice(-1)[0] || "";
            const pcName = parts[1];
            // Normalize and detect common character-sheet patterns.
            const n = baseFile.toLowerCase();
            const isCharacterSheet =
              n.includes("character sheet") || // explicit pattern
              n === (pcName + " character sheet.md").toLowerCase() ||
              n === (pcName + "_character_sheet.md").toLowerCase() ||
              // some files use just '<Name>.md' as the canonical sheet
              n === (pcName + ".md").toLowerCase();
            if (isCharacterSheet) {
              saveUrl = BASE + "/update_sheet/" + encodeURIComponent(pcName);
            }
          }
        } catch (e) {}
        try {
          const url = saveUrl
            ? saveUrl
            : BASE +
              "/player_root/" +
              encodeSegments(path.replace(/^Player Root\//i, ""));
          const body = saveUrl ? { content, propagate: true } : { content };
          if (forceOverwrite) body.force = true;
          const r = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!r.ok) {
            $("#status").textContent = "save failed";
            showNotif("Save", "Failed to save");
            return;
          }
          $("#status").textContent = "saved";
          const newHash = await hashText(content || "");
          cachedHash[path] = newHash;
          try {
            if (ws && ws.readyState === WebSocket.OPEN)
              ws.send(JSON.stringify({ event: "saved", path, clientId }));
          } catch (e) {}
          showNotif("Saved", path.replace(/^Player Root\//i, ""));
          // Reload the file from server to ensure the editor shows the
          // canonical saved content (avoids stale or empty previews).
          try {
            if (typeof openFile === "function")
              openFile(path, openFileName || path.split("/").pop());
          } catch (e) {
            console.warn("failed to re-open file after save", e);
          }
        } catch (err) {
          $("#status").textContent = "error";
          showNotif("Save error", String(err));
        }
        releaseLock(path);
      }

      function showConflictModal(path, local, remote, cb) {
        const modal = create("div");
        modal.style.position = "fixed";
        modal.style.left = "50%";
        modal.style.top = "50%";
        modal.style.transform = "translate(-50%,-50%)";
        modal.style.background = "#fff";
        modal.style.padding = "18px";
        modal.style.zIndex = 99999;
        modal.style.boxShadow = "0 8px 32px rgba(0,0,0,0.25)";
        modal.innerHTML = `<h3>Conflict</h3><p>Remote version changed since you opened the file.</p>`;
        const remoteBtn = create("button", { textContent: "Accept remote" });
        const overwriteBtn = create("button", {
          textContent: "Overwrite remote",
          style: "margin-left:8px",
        });
        const mergeBtn = create("button", {
          textContent: "Open merge editor",
          style: "margin-left:8px",
        });
        modal.appendChild(remoteBtn);
        modal.appendChild(overwriteBtn);
        modal.appendChild(mergeBtn);
        document.body.appendChild(modal);
        remoteBtn.addEventListener("click", () => {
          document.body.removeChild(modal);
          cb("accept_remote");
        });
        overwriteBtn.addEventListener("click", () => {
          document.body.removeChild(modal);
          cb("overwrite");
        });
        mergeBtn.addEventListener("click", () => {
          document.body.removeChild(modal);
          cb("merge");
        });
      }

      function sendLock(path) {
        try {
          if (ws && ws.readyState === WebSocket.OPEN)
            ws.send(JSON.stringify({ cmd: "lock", path, clientId }));
        } catch (e) {}
      }
      function releaseLock(path) {
        try {
          if (ws && ws.readyState === WebSocket.OPEN)
            ws.send(JSON.stringify({ cmd: "unlock", path, clientId }));
        } catch (e) {}
      }
      function updateLockUI(path) {
        const el = document.getElementById("file-lock");
        if (!el) return;
        const locker = locks[path];
        if (locker && locker !== clientId)
          el.textContent = `Editing by ${locker}`;
        else el.textContent = "";
      }

      // Legacy SSE '/events' endpoint removed: the server does not provide
      // this endpoint in most dev setups. We avoid creating an EventSource
      // to '/events' to prevent spurious 400/404 requests in browser logs.
      // If you need server-propagated events in the future enable a proper
      // endpoint on the backend and re-enable this block.

      // WebSocket (disabled by default). Enable by setting ENABLE_WS=true
      // when your server provides a /ws WebSocket endpoint.
      const ENABLE_WS = false;
      // only attempt to open a WebSocket when explicitly enabled
      if (ENABLE_WS) {
        try {
          const wsUrl = BASE.replace(/^http/, "ws") + "/ws";
          ws = new WebSocket(wsUrl);
          ws.addEventListener("open", () => {
            console.log("ws open");
            try {
              ws.send(JSON.stringify({ cmd: "hello", clientId }));
            } catch (e) {}
          });
          ws.addEventListener("message", (ev) => {
            try {
              const obj = JSON.parse(ev.data);
              if (obj.cmd === "lock" || obj.event === "lock") {
                locks[obj.path] = obj.clientId || obj.by || "unknown";
                updateLockUI(obj.path);
              } else if (obj.cmd === "unlock" || obj.event === "unlock") {
                delete locks[obj.path];
                updateLockUI(obj.path);
              } else if (obj.event === "saved" || obj.cmd === "saved") {
                if (obj.path && openPath && obj.path === openPath) {
                  openFile(openPath, openFileName);
                  showNotif("Saved by peer", obj.clientId || "peer");
                }
              } else if (obj.event === "propagated") {
                pulseOnce();
                showNotif(
                  "Propagated",
                  JSON.stringify(obj.updated || obj.files || "")
                );
              }
            } catch (e) {
              console.warn("ws parse", e);
            }
          });
          ws.addEventListener("error", () => console.warn("ws err"));
          window.addEventListener("beforeunload", () => {
            if (openPath) releaseLock(openPath);
          });
        } catch (e) {
          console.warn("ws not available", e);
        }
      }

      // Delegated click handler for wiki-links rendered in previews: open the PC folder.
      // This performs a case-insensitive match against folders in `Player Root/PCs`.
      document.addEventListener("click", async (ev) => {
        try {
          const a = ev.target.closest && ev.target.closest(".wikilink");
          if (!a) return;
          ev.preventDefault();
          let name = (
            a.getAttribute("data-wikilink") ||
            a.textContent ||
            ""
          ).trim();
          if (!name) return;
          // Normalize whitespace
          name = name.replace(/\s+/g, " ");

          // Try to find a case-insensitive match in Player Root/PCs
          try {
            const seg = encodeSegments("PCs");
            const res = await fetch(BASE + "/player_root/" + seg, {
              cache: "no-store",
            });
            if (res && res.ok) {
              const j = await res.json();
              const entries = j.entries || [];
              // Look for directory entries whose name matches case-insensitively
              const lower = name.toLowerCase();
              const match = entries.find(
                (e) =>
                  e.type === "dir" &&
                  String(e.name || "").toLowerCase() === lower
              );
              if (match) {
                const pcPath = "PCs/" + match.name;
                stack.push(pcPath);
                renderDir(pcPath);
                return;
              }
            }
          } catch (e) {
            // If fetching PCs failed, fall back to direct navigation
            console.warn("failed to fetch PCs for case-insensitive match", e);
          }

          // Fallback: navigate using the provided name as-is
          const pcPath = `PCs/${encodeURIComponent(name)}`;
          stack.push(pcPath);
          renderDir(pcPath);
        } catch (e) {
          console.warn("wikilink handler error", e);
        }
      });

      upBtn.addEventListener("click", () => {
        // Determine current top-of-stack (may be a folder or accidentally a file path)
        const curr = stack && stack.length ? stack[stack.length - 1] : "";
        if (!curr || curr === "") return; // already at root
        // Compute parent folder by dropping the last segment
        const parts = String(curr).split("/").filter(Boolean);
        const parent = parts.slice(0, -1).join("/");
        const target = parent || "";
        // Replace the top of the stack with the parent (preserve earlier history)
        stack[stack.length - 1] = target;
        renderDir(target.replace(/^Player Root\//i, ""));
      });
      const deletedBtn = document.getElementById("deleted-btn");
      if (deletedBtn) {
        deletedBtn.addEventListener("click", () => {
          // navigate to Player Root/deleted
          stack.push("deleted");
          renderDir("deleted");
        });
      }
      // --- Search UI wiring ---
      (function () {
        const searchInput = document.getElementById("search-input");
        const searchClear = document.getElementById("search-clear");
        const searchResultsEl = document.getElementById("search-results");

        function debounce(fn, wait) {
          let t = null;
          return function (...args) {
            clearTimeout(t);
            t = setTimeout(() => fn.apply(this, args), wait);
          };
        }

        async function performSearch(q) {
          q = (q || "").trim();
          if (!q) {
            if (searchResultsEl) {
              searchResultsEl.style.display = "none";
              searchResultsEl.innerHTML = "";
            }
            return;
          }
          if (searchResultsEl) {
            searchResultsEl.style.display = "block";
            searchResultsEl.innerHTML = `<div class="muted">Searching for "${escapeHtml(
              q
            )}"...</div>`;
          }
          try {
            const url = `${BASE}/player_root/search?q=${encodeURIComponent(q)}`;
            const r = await fetch(url, { cache: "no-store" });
            if (!r.ok) {
              if (searchResultsEl)
                searchResultsEl.innerHTML = `<div class="muted">Search failed: ${r.status}</div>`;
              return;
            }
            const j = await r.json();
            renderSearchResults(q, j.results || []);
          } catch (e) {
            if (searchResultsEl)
              searchResultsEl.innerHTML = `<div class="muted">Search error: ${escapeHtml(
                String(e)
              )}</div>`;
          }
        }

        function renderSearchResults(q, results) {
          if (!searchResultsEl) return;
          if (!results || !results.length) {
            searchResultsEl.innerHTML = `<div class="muted">No results for "${escapeHtml(
              q
            )}"</div>`;
            return;
          }
          const wrap = create("div");
          for (const r of results) {
            const fileDiv = create("div", {
              style:
                "margin-bottom:12px;padding:8px;border-radius:6px;background:#f2f2f2",
            });
            // Title: clickable filename that opens the file
            const title = create("div");
            const fileLink = create("a", {
              href: "#",
              innerHTML: `<strong>${escapeHtml(r.path)}</strong>`,
            });
            fileLink.addEventListener("click", async (ev) => {
              ev.preventDefault();
              try {
                const rel = r.path.replace(/^Player Root\//i, "");
                // Reset to the file's containing folder so stack doesn't keep stale file entries
                const parent = rel.split("/").slice(0, -1).join("/");
                stack = parent ? [parent] : [""];
                renderDir(stack[stack.length - 1]);
                await new Promise((res) => setTimeout(res, 250));
                await openFile(r.path, r.path.split("/").pop());
                // if there are matches, scroll to the first one
                const first = (r.matches && r.matches[0]) || null;
                if (first) {
                  const ta = document.getElementById("file-ta");
                  if (ta && typeof first.line_no === "number") {
                    const lineIndex = Math.max(0, first.line_no - 1);
                    const lines = (ta.value || "").split(/\r?\n/);
                    let pos = 0;
                    for (let i = 0; i < lineIndex && i < lines.length; i++)
                      pos += lines[i].length + 1;
                    ta.focus();
                    ta.setSelectionRange(
                      pos,
                      pos + (lines[lineIndex] || "").length
                    );
                    const lineHeight =
                      parseInt(window.getComputedStyle(ta).lineHeight) || 18;
                    ta.scrollTop = Math.max(0, lineIndex * lineHeight - 40);
                  }
                }
                // Clear search UI after opening
                try {
                  if (searchInput) {
                    searchInput.value = "";
                    searchInput.blur();
                  }
                  if (searchResultsEl) {
                    searchResultsEl.style.display = "none";
                    searchResultsEl.innerHTML = "";
                  }
                } catch (e) {}
                showNotif("Opened", r.path);
              } catch (e) {
                console.warn("open from title failed", e);
              }
            });
            title.appendChild(fileLink);
            const meta = create("span", {
              className: "muted",
              textContent: ` (${r.match_count} matches) `,
            });
            title.appendChild(meta);
            const scoreSpan = create("span", {
              className: "muted",
              style: "margin-left:8px",
              textContent: `score: ${String(r.score || 0)}`,
            });
            title.appendChild(scoreSpan);
            fileDiv.appendChild(title);
            for (const m of r.matches) {
              const ctxPre = create("pre", {
                style:
                  "background:#fff;padding:8px;border-radius:6px;margin-top:8px;white-space:pre-wrap;font-size:13px",
              });
              const joined = m.context.join("\n");
              const re = new RegExp(
                q.replace(/[.*+?^${}()|[\\]\\]/g, "\\$&"),
                "gi"
              );
              const highlighted = joined.replace(re, (s) => `<<${s}>>`);
              const html = escapeHtml(highlighted)
                .replace(/&lt;&lt;(.*?)&gt;&gt;/g, "<strong>$1</strong>")
                .replace(/\n/g, "<br>");
              ctxPre.innerHTML = html;
              ctxPre.addEventListener("click", async () => {
                try {
                  // navigate to the folder and open the file
                  const rel = r.path.replace(/^Player Root\//i, "");
                  const parent = rel.split("/").slice(0, -1).join("/");
                  stack = parent ? [parent] : [""];
                  renderDir(stack[stack.length - 1]);
                  // wait a bit for the directory UI to render, then open file
                  await new Promise((res) => setTimeout(res, 250));
                  await openFile(r.path, r.path.split("/").pop());
                  // attempt to scroll the editor to the matched line
                  const ta = document.getElementById("file-ta");
                  if (ta && typeof m.line_no === "number") {
                    const lineIndex = Math.max(0, m.line_no - 1);
                    const lines = (ta.value || "").split(/\r?\n/);
                    let pos = 0;
                    for (let i = 0; i < lineIndex && i < lines.length; i++)
                      pos += lines[i].length + 1;
                    // set selection and scroll
                    ta.focus();
                    ta.setSelectionRange(
                      pos,
                      pos + (lines[lineIndex] || "").length
                    );
                    // scroll so the selection is visible
                    const lineHeight =
                      parseInt(window.getComputedStyle(ta).lineHeight) || 18;
                    ta.scrollTop = Math.max(0, lineIndex * lineHeight - 40);
                  }
                  // Clear search UI after opening
                  try {
                    if (searchInput) {
                      searchInput.value = "";
                      searchInput.blur();
                    }
                    if (searchResultsEl) {
                      searchResultsEl.style.display = "none";
                      searchResultsEl.innerHTML = "";
                    }
                  } catch (e) {}
                  showNotif("Opened", r.path);
                } catch (e) {
                  console.warn("open from search failed", e);
                }
              });
              fileDiv.appendChild(ctxPre);
            }
            wrap.appendChild(fileDiv);
          }
          searchResultsEl.innerHTML = "";
          searchResultsEl.appendChild(wrap);
        }

        const debouncedSearch = debounce(
          (e) => performSearch(e.target.value),
          300
        );
        if (searchInput) searchInput.addEventListener("input", debouncedSearch);
        if (searchClear)
          searchClear.addEventListener("click", () => {
            if (searchInput) searchInput.value = "";
            if (searchResultsEl) {
              searchResultsEl.style.display = "none";
              searchResultsEl.innerHTML = "";
            }
          });
      })();
      renderDir("");
    </script>
  </body>
</html>
