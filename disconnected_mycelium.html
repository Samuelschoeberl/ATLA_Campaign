pioca/Air/Airbending Moves/Level 2/Wind Spear - Tapioca.md": {"size": 548, "type": "text", "text": "#Action\n\n- **Range:** 5 * Airbending Slot Progression (0) meters.\n- **Air Attack Roll (1d20 + 2 + 7)**\n- **Damage**: 1d8 bludgeoning per Airbending_slot (4). Deals another 1d6 * Airbending_slot (4) if the Creature hits a Wall.\n- The Target has to succeed a Strength (0) saving throw against your Airbending DC (19) or be knocked back half your travelled distance this turn. \n- **Effects:**\n\t- Utilize airbending to dash towards an enemy within range and line of sight and hit them with a fast blow of pressurised air. \n\t\n\n\n#Level2\n#air\n#movement\n\n\n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/Air/Airbending Moves/Level 1/Airdash - Tapioca.md": {"size": 321, "type": "text", "text": "#Bonus_Action\n- **Range:** Self.\n- **Duration:** 1 Turn.\n- Enhance agility by propelling yourself with gusts of air.\n\n**Effects:**\n- You gain 5 * Airbending_slot (4) meters movement for this turn.\n\n\n\n\nTags:\n#Airbending #Mobility #Level_1 #Bonus_Action\n\n#Airbending\n#Bonus_Action\n#Level1\n#Level_1\n#Mobility\n#player_root\n\n\n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/Air/Airbending Moves/Level 1/Air Blade - Tapioca.md": {"size": 265, "type": "text", "text": "#Action\n\n- **Range:** 5 \\* Airbending Slot (4) meters.\n- **Duration:** Instantaneous.\n- **Damage**: 1d4 bludgeoning per Airbending_slot (4).\n- Air Attack Roll (1d20 + 2 + 7)\n- Use airbending to send a blade of Air hurling at a creature within range\n\n\n#Level1\n#air\n\n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/Air/Airbending Moves/Level 1/Gentle Push - Tapioca.md": {"size": 353, "type": "text", "text": "\n#Danger_Sense_Reaction\n\n- **Range:** 3 * Airbending Slot Progression (0) meters.\n\n**Effects:**\n- Push up to Airbending Slot Progression (0)  objects or creatures within Range away, up to Airbending Slot Meters in a chosen direction.\n- Creatures must make a Strength save against your Airbending DC (19).\n\n#Danger_Sense_Reaction\n#Level1\n#Mobility\n#air\n\n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/Team-up Moves/Glass Fruit Bending/Soulseed Harmonic Seal - Tapioca.md": {"size": 519, "type": "text", "text": "\n#Action\n#Reaction \n\n\nReaction: Must be initiated by a Earthbender in line of sight \n\n\n- Range: within line of sight up to 100 meter\n- **Duration:** Lasts until stopped concentrating or for 1 hour.\n\n- **Effect:** \n\t- As the air vibrates with a cleansing energy as creatures of your choice within radius gain 10 * X Barrier (0) (if this barrier is halfed for one creature its halfed for all)\n\t- If X \u2265 15, the seal also protects against being Immobilised (0)  \n    \n\n#defensive \n#Level1 \n#earth\n#player_root\n#teamup\n\n\n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/Team-up Moves/Glass Fruit Bending/Inferno Bloom (Red Flamegrape) - Tapioca.md": {"size": 271, "type": "text", "text": "#Action\n#Reaction \n\n\nReaction: Must be initiated by a Firebender in line of sight \n\nLingering Effect (0)\n\n- Range: 2X meter radius Sphere\n\n- **Effect:** Explosion in an area, dealing Xd6  bludgeoning + half fire damage\n    \n\n\n#Level1 \n#earth\n#fire \n#player_root\n#teamup\n\n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/Team-up Moves/Glass Fruit Bending/Resonant Collapse (Blue Soundbanana) - Tapioca.md": {"size": 418, "type": "text", "text": "\n#Action\n#Reaction \n\nReaction: Must be initiated by a Airbender in line of sight \n\n\n#lingering_effect \n\nA soundblast builds from multiple frequencies and shatters the ground.\n- Range: 2X meter radius Sphere\n\n- **Effects:**\n\t- Targets in area must make CON save of X*2 or take **Xd8 thunder damage** and fall prone\n\t- Earth terrain in the zone becomes **difficult terrain**\n\n#Level1 \n#earth\n#air \n#player_root\n#teamup\n\n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/Team-up Moves/Glass Fruit Bending/BlueBerry Glass Surge - Tapioca.md": {"size": 440, "type": "text", "text": "\n#Action\n#Reaction \n\nReaction: Must be initiated by a Waterbender in line of sight \n\nLingering Effect (0)\n\nStick and grow trapping enemies and reshaping the terrain.\n- Range: 2X meter radius Sphere\n\n- **Effects:** \n\t- Targets in area must make  a DCX * 2 Dex (7) save to jump aside or get Immobilised in cold soft and barely liquid Glass.\n\t- If X \u2265 8, brambles regenerate once if destroyed\n\n\n#Level1 \n#earth\n#water \n#player_root\n#teamup\n\n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/Team-up Moves/Glass Fruit Bending/FlashLemon Refractor Beam - Tapioca.md": {"size": 474, "type": "text", "text": "#Action\n#Reaction \n\nReaction: Must be initiated by a Firebender in line of sight \n\n#lingering_effect \n\nFocused light is amplified by mirrored shards into a blinding beam.\n- **Effect:** \n- Range: 10X meter radius Sphere\n- **Effect:** \n\t- Targets in area must make  a DC X * 2 Int (3) save to shield or close their eyes or be Blinded for one turn\n\t-  If X \u2265 10, Deal **Xd4 radiant damage** to all creatures in the area\n    \n\n\n#teamup\n#fire \n#earth\n#player_root\n#Level1 \n\n\n\n\n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/Team-up Moves/Air-Earth/Sandstream - Tapioca.md": {"size": 396, "type": "text", "text": "\n#Action \n#Reaction \n\nEach Bender-decides to which pool to add their Bending slots:\n-  **Y**(Earth): Yd12 Damage per projectile\n- **X**(Air): X Projectiles Air Attack Roll (1d20 + 2 + 7)\n- **Range:** Y * X meters from the Airbender \n \n \n- One Earthbender shoots Y Sand Projectiles (rolls the Damage roll) and the Airbender controlls them to home to the X Targets)\n\n\n#Level1\n#air\n#earth\n#teamup\n\n\n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/Earth/mechanics/Earthbending Slot Progression - Tapioca.md": {"size": 305, "type": "text", "text": "\nYou have 2 \\* earth (1) Maximum Slots that are restored after about an hour of rest.\n\nYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\n- spend 2 and then 1 \n- spend 1 and then 2 or\n- spend 1 then 1 then 1 \n\n#earth \n#Level1 \n\n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/Earth/mechanics/Earthbending rules - Tapioca.md": {"size": 502, "type": "text", "text": "\n#### **Overview:**\n\nEarthbenders are solid and steadfast, drawing upon the Strength of their bodies and the stability of the ground beneath them. Their techniques focus on defense, fortification, and manipulating terrain. Rather than relying on agility to avoid blows, earthbenders create barriers, raise armor ratings, and reinforce their allies. They harness **Earth Charges** to shape stone and metal, providing a constant, reliable source of defense and stability.\n\n\n\n#player_root\n#earth\n#Level1 \n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/Earth/Earthbending Moves/Level 1/Stone Knuckles - Tapioca.md": {"size": 145, "type": "text", "text": "\n#Action\n\n- Range: #Meele\n- **Earth Attack Roll (1d20 + 1 + 1)**\n- Damage: 1+ earthbending slot (2) d6 bludgeoning damage.\n\n\n#earth \n#Level1 \n\n\n\n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/Earth/Earthbending Moves/Level 1/Earth Brace - Tapioca.md": {"size": 251, "type": "text", "text": "#Reaction\n#Concentration \n- **Range:** self and every creature within earthbending slot (2) Meters of you\n- **Effect:**  \n\t- Root yourself and every creature within range to resist forced movement.\n\t- Duration: 1 round.\n\n\n#Level1\n#earth\n#player_root\n\n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/Earth/Earthbending Moves/Level 1/Earth Shift - Tapioca.md": {"size": 359, "type": "text", "text": "\n\n#Bonus_Action  \n\n- **Range:** self and every creature within 1+1 * earthbending slot (2) meters of you\n\n**Effect**:\nTripping opponents with minor terrain manipulation. The target must succeed on a Dexterity saving throw against your Player Root/Rules/Bending Rules/Earth/mechanics/Earthbending DC (0)) or be knocked Prone.\n\n\n\n#Level1 \n#earth\n#player_root\n\n\n"}, "Player Root/PCs/Tapioca/Bending Rules - Tapioca/Earth/Earthbending Moves/Level 1/Rock Hurl - Tapioca.md": {"size": 238, "type": "text", "text": "\n#Action\n\n\n- Range: 3\\* earthbending slot (2) meters\n- Earth Attack Roll (1d20 + 1 + 1)\n- Damage: 1d6 \\* earthbending slot (2) bludgeoning.\n\n**Effect**:\n\n- Lift and throw a small rock. Simple ranged attack.\n\n\n#Level1\n#earth\n#player_root\n\n"}, "Player Root/PCs/Puy/Puy Character Sheet.md": {"size": 1504, "type": "text", "text": "Name: Puy\n## Vitals\n\n\n\n| key          |            value |\n| ------------ | ---------------: |\n| max_hp       |       120 |\n| current hp   |   120 |\n| Stress Level | 0 |\n\n## Core Stats\n\n| Stat         |            Value |\n| ------------ | ---------------: |\n| Strength     |     5 |\n| Dexterity    |    3 |\n| Constitution | 5 |\n| Intelligence | 1 |\n| Wisdom       |       3 |\n| Charisma     |     4 |\n\n## Bending Levels\n\nTotal Bending Level: 3\nDamage Dice Bonus: 0\n\n| Element |      Level | Attack Roll            | DC                   |\n| ------- | ---------: | ---------------------- | -------------------- |\n| Earth   |  2 | 1d20 + 2 + 5  | 17  |\n| Fire    |   1 | 1d20 + 1 + 3   | 14   |\n|         |            |                        |                      |\n## Defensive\n\n| key           |              Base | Bonus |\n| ------------- | ----------------: | ----- |\n| Evasion       |       13 | 0     |\n| General Armor | 2 | 0     |\n\n\n## Bending Slots\nYou can always only use maximum half of you current Bending slots (rounded up so if you have 3 left you can either spend 2 and then 1 or only 1 but 3 times)\n\n| Slot                   |                    Amount |\n| ---------------------- | ------------------------: |\n| Firebending slot       |      2 |\n| Earthbending slot      |     4 |\n\n## Water charges\n\n| Environmental Variable     |                          value |\n| -------------------------- | -----------------------------: |\n| Environmental water charge | 11 |\n\n\n#Puy #Character_Sheet\n"}, "Player Root/PCs/Puy/Puy_variables.md": {"size": 1562, "type": "text", "text": "| Variable | Value |\n|---|---:|\n| air | 0 |\n| air attack roll | 1d20 + 0 + 3 |\n| air.attack.roll | 1d20 + 0 + 3 |\n| airbending dc | 13 |\n| airbending.dc | 13 |\n| airbending.slot | 0 |\n| airbending_slot | 0 |\n| barrier | 0 |\n| cha | 4 |\n| chaos.energy | 0 |\n| chaos_energy | 0 |\n| cl | 3 |\n| con | 5 |\n| current.hp | 120 |\n| current_hp | 120 |\n| damage dice bonus | 0 |\n| damage.dice.bonus | 0 |\n| danger sense reaction | 0 |\n| danger.sense.reaction | 0 |\n| dex | 3 |\n| earth | 2 |\n| earth attack roll | 1d20 + 2 + 5 |\n| earth.attack.roll | 1d20 + 2 + 5 |\n| earthbending dc | 17 |\n| earthbending slot | 4 |\n| earthbending.dc | 17 |\n| earthbending.slot | 4 |\n| earthbending_slot | 4 |\n| environmental.water.charge | 11 |\n| environmental_water_charge | 11 |\n| evasion | 13 |\n| fire | 1 |\n| fire attack roll | 1d20 + 1 + 3 |\n| fire.attack.roll | 1d20 + 1 + 3 |\n| firebending dc | 14 |\n| firebending.dc | 14 |\n| firebending.slot | 2 |\n| firebending_slot | 2 |\n| general armor | 2 |\n| general.armor | 2 |\n| int | 1 |\n| max.hp | 120 |\n| max_hp | 120 |\n| rolled.hp | 9 |\n| spirit | 0 |\n| spirit attack roll | 1d20 + 0 + 3 |\n| spirit.attack.roll | 1d20 + 0 + 3 |\n| spiritbending dc | 13 |\n| spiritbending slot | 0 |\n| spiritbending.dc | 13 |\n| spiritbending.slot | 0 |\n| str | 5 |\n| stress level | 0 |\n| stress.level | 0 |\n| water | 0 |\n| water attack roll | 1d20 + 0 + 1 |\n| water.attack.roll | 1d20 + 0 + 1 |\n| water.charge | 11 |\n| water_charge | 11 |\n| waterbending dc | 11 |\n| waterbending.dc | 11 |\n| waterbottle charge | 0 |\n| waterbottle.charge | 0 |\n| wis | 3 |\n"}, "Player Root/PCs/Puy/Puy_wikigraph_treemap.html": {"size": 4786504, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/PCs/Puy/Puy_wikigraph_sunburst.html": {"size": 4783083, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/PCs/Puy/Bending Rules - Puy/Utility - Puy.md": {"size": 130, "type": "text", "text": "\nThese Moves can be used without expending slots (and meant for usage out of combat)\n\n\n#Level1 \n#air #earth #fire #spirit #water \n"}, "Player Root/PCs/Puy/Bending Rules - Puy/core rules/Cluster - Puy.md": {"size": 247, "type": "text", "text": "#Collectionfile \nWhen a creature is standing within 1 meter of another creature it can get affected by some effects\n<!-- BEGIN-AUTO-COLLECTION:Cluster -->\n## Backlinks\n\n  ./\n\n<!-- END-AUTO-COLLECTION -->\n\n\n\n\n\n\n\n\n\n\n\n\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/core rules/Concentration - Puy.md": {"size": 233, "type": "text", "text": "Con save DC of max(10, Damage Taken / 2)\nSome Moves require concentration to keep them up. If you take damage while concentrationg you have to make a Con (5) save with a DC of max(10, Damage Taken / 2)\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/core rules/Bending Slots - Puy.md": {"size": 783, "type": "text", "text": "Airbending Slot Progression (0)\nFirebending Slot Progression (0)\nearthbending slot (4)\nWater Charges (0)\nSpiritbending Slot Progression (0)\n\nSlot progression rule: for a bending element at level N you receive slots distributed by slot level as follows \u2014 1 slot at level N, 2 slots at level N-1, 3 slots at level N-2, and so on down to N slots at level 1. In formula form: for each k from 1..N you get k slots of level (N+1-k).\n\nExamples:\n\n- Level 3 earthbender \u2192 1\u00d7 level 3, 2\u00d7 level 2, 3\u00d7 level 1.\n- Level 4 earthbender \u2192 1\u00d7 level 4, 2\u00d7 level 3, 3\u00d7 level 2, 4\u00d7 level 1.\n\nUse this rule to calculate and fill the table entries below. Only rows for elements with at least one slot are included to make tracking easier:\n\nNot for waterbenders\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/core rules/Lingering Effect - Puy.md": {"size": 229, "type": "text", "text": "If not Specified otherwise, lingering effect last until the start of your next Turn.\nIf caused by a damaging Move: Every creature that ends its turn there will get half the original attacks Damage.\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/core rules/Short Rest - Puy.md": {"size": 81, "type": "text", "text": "You restore all your Hitpoints and Bending Slots\nPlayer Root (0)\n\n#player_root\n\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/core rules/Movement - Puy.md": {"size": 71, "type": "text", "text": "**Movement per Round**:\n10 meters + air (0) Level * 3\n\n\n#player_root\n\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/core rules/Ammunition - Puy.md": {"size": 169, "type": "text", "text": "If not Specified otherwise, Ammunition can be used by any character (if its logic :D)  as part of their Moves to enhance them creatively.\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/core rules/Manually Rolled Hitpoints - Puy.md": {"size": 32, "type": "text", "text": "\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/core rules/Conditions/Immobilised - Puy.md": {"size": 210, "type": "text", "text": "The creature can not move or be moved by force. Depending what causes Immobilisation you can save against it as an Action (0) or can remove it with your bending more efficiently.\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/core rules/Conditions/unconscious - Puy.md": {"size": 32, "type": "text", "text": "\nPlayer Root (0)\n\n#player_root\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/core rules/Conditions/Slowed - Puy.md": {"size": 154, "type": "text", "text": "A slowed creatures Movement Speed is ng Effect (0)\n\nStick and grow trapping enemies and reshaping the terrain.\n- Range: 2X meter radius Sphere\n\n- **Effects:** \n\t- Targets in area must make  a DCX * 2 Dex (3) save to jump aside or get Immobilised in cold soft and barely liquid Glass.\n\t- If X \u2265 8, brambles regenerate once if destroyed\n\n\n#Level1 \n#earth\n#water \n#player_root\n#teamup\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/Team-up Moves/Glass Fruit Bending/Soulseed Harmonic Seal - Puy.md": {"size": 519, "type": "text", "text": "\n#Action\n#Reaction \n\n\nReaction: Must be initiated by a Earthbender in line of sight \n\n\n- Range: within line of sight up to 100 meter\n- **Duration:** Lasts until stopped concentrating or for 1 hour.\n\n- **Effect:** \n\t- As the air vibrates with a cleansing energy as creatures of your choice within radius gain 10 * X Barrier (0) (if this barrier is halfed for one creature its halfed for all)\n\t- If X \u2265 15, the seal also protects against being Immobilised (0)  \n    \n\n#defensive \n#Level1 \n#earth\n#player_root\n#teamup\n\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/Team-up Moves/Glass Fruit Bending/FlashLemon Refractor Beam - Puy.md": {"size": 474, "type": "text", "text": "#Action\n#Reaction \n\nReaction: Must be initiated by a Firebender in line of sight \n\n#lingering_effect \n\nFocused light is amplified by mirrored shards into a blinding beam.\n- **Effect:** \n- Range: 10X meter radius Sphere\n- **Effect:** \n\t- Targets in area must make  a DC X * 2 Int (1) save to shield or close their eyes or be Blinded for one turn\n\t-  If X \u2265 10, Deal **Xd4 radiant damage** to all creatures in the area\n    \n\n\n#teamup\n#fire \n#earth\n#player_root\n#Level1 \n\n\n\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/Team-up Moves/Glass Fruit Bending/Inferno Bloom (Red Flamegrape) - Puy.md": {"size": 271, "type": "text", "text": "#Action\n#Reaction \n\n\nReaction: Must be initiated by a Firebender in line of sight \n\nLingering Effect (0)\n\n- Range: 2X meter radius Sphere\n\n- **Effect:** Explosion in an area, dealing Xd6  bludgeoning + half fire damage\n    \n\n\n#Level1 \n#earth\n#fire \n#player_root\n#teamup\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/Team-up Moves/Air-Earth/Sandstream - Puy.md": {"size": 396, "type": "text", "text": "\n#Action \n#Reaction \n\nEach Bender-decides to which pool to add their Bending slots:\n-  **Y**(Earth): Yd12 Damage per projectile\n- **X**(Air): X Projectiles Air Attack Roll (1d20 + 0 + 3)\n- **Range:** Y * X meters from the Airbender \n \n \n- One Earthbender shoots Y Sand Projectiles (rolls the Damage roll) and the Airbender controlls them to home to the X Targets)\n\n\n#Level1\n#air\n#earth\n#teamup\n\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/Fire/Firebending Moves/Level 1/Smoldering Focus - Puy.md": {"size": 210, "type": "text", "text": "#Bonus_Action\n\n- Description: Calm your breath and focus heat into a small, steady kernel for control or precision.\n\n**Effects:**\n- Reduce your Stress by up to your wis (3) points\n\n#Level1\n#fire\n#player_root\n\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/Fire/Firebending Moves/Level 1/Flame Jet - Puy.md": {"size": 226, "type": "text", "text": "#Action\n\n- **Range:** 5 \\* firebending_slot (2) meters.\n- **Damage:** firebending_slot (2) \\* 1 d10 fire\n- Fire Attack Roll (1d20 + 1 + 3)\n- Unleash a burst of flames in a straight line, damaging one target\n\n\n#Level1\n#fire\n\n\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/Fire/Firebending Moves/Level 1/Control Flame - Puy.md": {"size": 118, "type": "text", "text": "#Action\n#utility\n\n\n- Range: fire (1) \\* 3 meters\n- You manipulate a flame within range\n\n\n#Level1\n#fire\n#player_root\n\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/Fire/Firebending Moves/Level 1/Burning Fists - Puy.md": {"size": 184, "type": "text", "text": "\n#Action\n\n- Range: Melee (0)\n-Fire Attack Roll (1d20 + 1 + 3): Attacks firebending_slot (2) times\n- Damage: 1d6 + Strength (0) Bludgeoning and 1d4 Fire Damage\n\n\n#Level1\n#fire\n#melee\n\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/Fire/Mechanics/Firebending Slot Progression - Puy.md": {"size": 303, "type": "text", "text": "\nYou have 2 \\* fire (1) Maximum Slots that are restored after about an hour of rest.\n\nYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\n- spend 2 and then 1 \n- spend 1 and then 2 or\n- spend 1 then 1 then 1 \n\n#fire \n#Level1 \n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/Earth/mechanics/Earthbending Slot Progression - Puy.md": {"size": 305, "type": "text", "text": "\nYou have 2 \\* earth (2) Maximum Slots that are restored after about an hour of rest.\n\nYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\n- spend 2 and then 1 \n- spend 1 and then 2 or\n- spend 1 then 1 then 1 \n\n#earth \n#Level1 \n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/Earth/mechanics/Earthbending rules - Puy.md": {"size": 502, "type": "text", "text": "\n#### **Overview:**\n\nEarthbenders are solid and steadfast, drawing upon the Strength of their bodies and the stability of the ground beneath them. Their techniques focus on defense, fortification, and manipulating terrain. Rather than relying on agility to avoid blows, earthbenders create barriers, raise armor ratings, and reinforce their allies. They harness **Earth Charges** to shape stone and metal, providing a constant, reliable source of defense and stability.\n\n\n\n#player_root\n#earth\n#Level1 \n"}, "Player Root/PCs/Puy/Bending Rules - Puy/Earth/Earthbending Moves/Level 2/Ground Unlock - Puy.md": {"size": 251, "type": "text", "text": "\n#Bonus_Action \n- Range: 3* earthbending slot (4) Meters\n- Target: 1 * earthbending slot (4)  Enemies within range\nRevert Immobilisation through Ground Lock (0)\n\n\nTags:\n#Earthbending #Mobility #Immobilisation\n#earth \n#Level2 \n#Mobility\n#player_root\n\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/Earth/Earthbending Moves/Level 2/Gravel Vortex - Puy.md": {"size": 408, "type": "text", "text": "#Action\n#Concentration \n- Range: 2* earthbending slot (4) Meters\n- Duration: 1 round.\n- Summon a vortex of gravel  barrier that grants 10* earthbending slot (4) Barrier (0) until the start of your next turn.\n- Target earthbending slot (4) / 3  Creatures within earthbending slot (4) meters\n\n \n**Effect**: \nProvides 10 * earthbending slot (4) Barrier (0)\n\n\nTags:\n#Earthbending\n#player_root\n#earth \n#Level2 \n\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/Earth/Earthbending Moves/Level 2/Ground Lock - Puy.md": {"size": 322, "type": "text", "text": "\n#Bonus_Action  \n\n- Range: 2 * earthbending slot (4) Meters\n- Duration: Until Saved.\n- Save: Dex Save against your Earthbending DC (17).\n- Target: 1 * earthbending slot (4)  Enemies within range\n- an opponent becomes Immobilised (0) . They get to re-roll the save at the end of their turn.\n\n#earth\n#player_root\n#Level2 \n\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/Earth/Earthbending Moves/Level 2/Stone Shield - Puy.md": {"size": 315, "type": "text", "text": "#Reaction \n#Concentration \n\n- Range: 2* earthbending slot (4) Meters\n- Duration: 1 round.\n- Target earthbending slot (4) / 2 * Creatures \n\n**Effect**:\nProvides 10 * earthbending slot (4) temporary  General Armor (2) until the start of your next turn. \n\n\n\n#Earthbending\n#Level2 \n#earth \n#Earthbending\n#player_root\n\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/Earth/Earthbending Moves/Level 1/Rock Hurl - Puy.md": {"size": 238, "type": "text", "text": "\n#Action\n\n\n- Range: 3\\* earthbending slot (4) meters\n- Earth Attack Roll (1d20 + 2 + 5)\n- Damage: 1d6 \\* earthbending slot (4) bludgeoning.\n\n**Effect**:\n\n- Lift and throw a small rock. Simple ranged attack.\n\n\n#Level1\n#earth\n#player_root\n\n"}, "Player Root/PCs/Puy/Bending Rules - Puy/Eart gal appearance. She wears an ornate, high-collared cloak adorned with faintly glowing charms.\n- **Bending Style:**  \n    Waterbending focused on offensive techniques, including the manipulation of black mist\u2014a mixture of water vapor and fine particles, creating disorienting smoke.\n- **Role:**  \n    Charismatic leader and visionary behind the rebellion. Isay is a master tactician and inspiring orator.\n\nTags:\n#Waterbending\n\n\n[[NPC]]\n[[Player Root]]\n\n#player_root\n"}, "Player Root/NPCs/The Night Bloom/Jin Koga/Jin Koga_wikigraph_treemap.html": {"size": 3641634, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/NPCs/The Night Bloom/Jin Koga/Jin Koga_wikigraph_sunburst.html": {"size": 3641364, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/NPCs/The Night Bloom/Jin Koga/Hanal Koga.md": {"size": 626, "type": "text", "text": "she her\n**Physical Description:**  \n        A sturdy woman with sun-kissed skin and short, spiky hair the color of sandy blonde. She has a confident, swaggering gait, often adorned with sand-crusted boots and bracers. Her lightweight armor is covered with fine grains of sand that move subtly as she walks.\n    - **Bending Style:**  \n        Earthbending with a specialization in sand manipulation.\n    - **Role:**  \n        Oversees the Night Bloom\u2019s military operations, crafting strategies for their attacks.\n\n**Links**:\n- [[Armor definition]]\n- [[Night Bloom]]\n\nTags:\n#Earthbending\n[[NPC]]\n[[Player Root]]\n\n#player_root\n"}, "Player Root/NPCs/Lotus/Mistress Akira Meiyu.md": {"size": 1986, "type": "text", "text": "## Core Stats\n\n| Stat         | Value | note | Automatically updated |\n| ------------ | ----- | ---- | --------------------- |\n| Strength     | 2     |      | N                     |\n| Dexterity    | 7     |      | N                     |\n| Constitution | 1     |      | N                     |\n| Intelligence | 5     |      | N                     |\n| Wisdom       | 0     |      | N                     |\n| Charisma     | 4     |      | N                     |\n\n---\n\n## Vital Stats (auto)\n\n| Attribute      | Value | note | Automatically updated |\n| -------------- | ----- | ---- | --------------------- |\n| Max Hit Points |       |      | Y                     |\n| Evasion        |       |      | Y                     |\n| Armor          |       |      | Y                     |\n\n---\n\n## Bending Levels\n\n| Element                 | Level | Notes                  | Auto |\n| ----------------------- | ----- | ---------------------- | ---- |\n| [[Airbending Level]]    | 0     |                        | Y    |\n| [[Waterbending Level]]  | 9     |                        | Y    |\n| [[Earthbending Level]]  | 0     |                        | Y    |\n| [[Firebending Level]]   | 0     |                        | Y    |\n| [[Spiritbending Level]] | 0     | (Avatar Spirit Bridge) | Y    |\n\n## [[Bending Slots]]\n\n- (auto-generated table will be created by scripts)\n\n- **Physical Description:**  \n   A middle-aged woman of medium height with a graceful, slender build. Her long, silvery-blue hair flows freely down her back, adorned with small jade pins shaped like water droplets. Her piercing sea-green eyes seem to look into a person\u2019s soul. Her demeanor is serene but carries an undercurrent of strength, much like a calm sea hiding its depth.\n  - **Bending Style:**  \n     Waterbending that incorporates healing and offensive manipulation of mist, granting her versatility in combats\n\n**Links**:\n\n- [[The Lotus]]\n- [[Strength]]\n\nTags:\n#Waterbending\n[[NPC]]\n[[Player Root]]\n\n#player_root\n"}, "Player Root/NPCs/Lotus/Lotus_wikigraph_treemap.html": {"size": 3650920, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/NPCs/Lotus/Phot the Sandsnake.md": {"size": 1397, "type": "text", "text": "## Core Stats\n\n| Stat         | Value | note | Automatically updated |\n| ------------ | ----- | ---- | --------------------- |\n| Strength     | 3     |      | N                     |\n| Dexterity    | 5     |      | N                     |\n| Constitution | 3     |      | N                     |\n| Intelligence | 4     |      | N                     |\n| Wisdom       | 6     |      | N                     |\n| Charisma     | 2     |      | N                     |\n\n---\n\n## Vital Stats (auto)\n\n| Attribute      | Value | note | Automatically updated |\n| -------------- | ----- | ---- | --------------------- |\n| Max Hit Points |       |      | Y                     |\n| Evasion        |       |      | Y                     |\n| Armor          |       |      | Y                     |\n\n---\n\n## Bending Levels\n\n| Element                 | Level | Notes                  | Auto |\n| ----------------------- | ----- | ---------------------- | ---- |\n| [[Airbending Level]]    | 0     |                        | Y    |\n| [[Waterbending Level]]  | 0     |                        | Y    |\n| [[Earthbending Level]]  | 10    |                        | Y    |\n| [[Firebending Level]]   | 0     |                        | Y    |\n| [[Spiritbending Level]] | 0     | (Avatar Spirit Bridge) | Y    |\n\n## [[Bending Slots]]\n\n- (auto-generated table will be created by scripts)\n\n[[NPC]]\n[[Player Root]]\n\n#player_root\n"}, "Player Root/NPCs/Lotus/Grandmaster Iroh Tanaka.md": {"size": 2470, "type": "text", "text": "## Core Stats\n\n| Stat         | Value | note | Automatically updated |\n| ------------ | ----- | ---- | --------------------- |\n| Strength     | 4     |      | N                     |\n| Dexterity    | 2     |      | N                     |\n| Constitution | 4     |      | N                     |\n| Intelligence | 2     |      | N                     |\n| Wisdom       | 8     |      | N                     |\n| Charisma     | 5     |      | N                     |\n\n---\n\n## Vital Stats (auto)\n\n| Attribute      | Value | note | Automatically updated |\n| -------------- | ----- | ---- | --------------------- |\n| Max Hit Points |       |      | Y                     |\n| Evasion        |       |      | Y                     |\n| Armor          |       |      | Y                     |\n\n---\n\n## Bending Levels\n\n| Element                 | Level | Notes                  | Auto |\n| ----------------------- | ----- | ---------------------- | ---- |\n| [[Airbending Level]]    | 0     |                        | Y    |\n| [[Waterbending Level]]  | 0     |                        | Y    |\n| [[Earthbending Level]]  | 0     |                        | Y    |\n| [[Firebending Level]]   | 15    |                        | Y    |\n| [[Spiritbending Level]] | 3     | (Avatar Spirit Bridge) | Y    |\n\n## [[Bending Slots]]\n\n- (auto-generated table will be created by scripts)\n\n- **Physical Description:**  \n   A tall, lean man in his early sixties with silver-streaked black hair tied into a high topknot. His sharp amber eyes radiate wisdom and authority, while his lightly weathered skin reflects years of spiritual practice. He has a composed, almost regal posture, wearing a perpetual calm smile that hides the fire of his immense power.\n  - **Bending Style:**  \n     Firebending infused with advanced spiritual techniques, emphasizing control and harmony over raw power. Known for producing green flame as a sign of his mastery.\n  - **Role:**  \n     Oversees the organization\u2019s spiritual and physical balance, emphasizing diplomacy and tradition.\n\n**Links**:\n\n- [[Wisdom]]\n\nTags:\n#Firebending\n\nDear Iroh Tanaka,\nWe hope this letter finds you well, we from team anju ~the avatar~ make our way Omashu. We think the bad guys (and girls and enbis) want to go to that village. Greeting from christopher. anyways that village has a chrystal that we think that might be the next target of the evil people.\nmfg  \nTeam Anju\nTHIS GOT EATEN BY ALEXANDER\n[[NPC]]\n[[Player Root]]\n\n#player_root\n"}, "Player Root/NPCs/Lotus/Lotus_wikigraph_sunburst.html": {"size": 3647917, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/NPCs/Other Importants/Other Importants_wikigraph_sunburst.html": {"size": 3641730, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/NPCs/Other Importants/Other Importants_wikigraph_treemap.html": {"size": 3641992, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/NPCs/Other Importants/Ula Envoy of Ch\u00e1nch\u00fa.md": {"size": 772, "type": "text", "text": "**Character**\n\n- **Name**: Ula\n    \n- **Appearance**:\n    \n    - Pale skin, faintly glowing purple hair due to crystal-paste dye.\n    - Mushroom-leather outfit with a toad-eye hood for tradition and identity.\n- **Personality**:\n    \n    - Determined, resourceful, and reverent toward the spirit.\n    - Nervous about interacting with the outside world.\n- **Role**:\n    \n    - Tasked with seeking a Spirit Bender to save [[Ch\u00e1nch\u00fa ]].\n    - Acts as the guide for the party to the [[Undersands Village ]].\n\n**Equipment**:\n\n- Crystals for lighting caves.\n- Hydration stones for water control and protection.\n\n**Links to Other Notes**:\n\n- [[Ch\u00e1nch\u00fa ]]\n- [[Undersands Village ]]\n- [[Spirit Benders ]]\n- [[Mushroom Leather Techniques ]]\n[[NPC]]\n[[Player Root]]\n\n#player_root\n"}, "Player Root/NPCs/Rin Kotak/Rin Kotak.md": {"size": 1462, "type": "text", "text": "![[Rin Kotak.png]]\nhe/him\n**Physical Description:**  \n        A tall, gaunt man with alabaster skin and wispy, shoulder-length white hair that seems to shift like mist in the wind. His gray eyes are perpetually half-lidded, giving him a detached, eerie demeanor. His flowing black robes ripple unnaturally, as if caught in a constant breeze. His soft-spoken voice carries an unsettling intensity.\n    - **Bending Style:**  \n        Airbending with a dark twist\u2014manipulating sound waves to confuse and disorient enemies and bending the air around him to make him almost invisible.\n\n\n\n**Links**:\n- [[Night Bloom]]\n\nTags:\n#Airbending\n\n\u201cThey call it balance. They say the Avatar brings peace. But I ask you\u2014what peace is built upon the whims of a single soul? One person, plucked from the cycle, anointed by spirits, wielding the fury of all four elements like a god among mortals. We kneel to them. We trust them. We fear them. We wait for them to fix what we cannot. But what happens when the Avatar fails? When they vanish? When they turn tyrant? No one should bear such power. And no one should have to live under it. Balance cannot come from a single hand\u2014it must rise from all of us, together. End the cycle. Let the world breathe free for once, without its so-called savior.\u201d\n\n\n\nInit:\nphot 21 \nRin Xolai 20 \nTapi 19\nPui 15\nIroh Tanaka 15\n\nRiu 14\nIsay Treksal 12\nStie 12\nAnju 12\nJin koga\nAkira Meiyu\n\n\nDAMAGE\n9\n\n[[NPC]]\n[[Player Root]]\n\n#player_root\n"}, "Player Root/NPCs/Rin Kotak/Rin Kotak.png": {"size": 2990235, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/NPCs/Rin Kotak/meditating dark.png": {"size": 1685865, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/NPCs/Rin Kotak/Rin Kotak_wikigraph_treemap.html": {"size": 3642716, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/NPCs/Rin Kotak/meditating cartoon.png": {"size": 2990235, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/NPCs/Rin Kotak/Rin Kotak_wikigraph_sunburst.html": {"size": 3642450, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Organisations/Organisations_wikigraph_sunburst.html": {"size": 3644770, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Organisations/The Lotus.md": {"size": 1094, "type": "text", "text": "[[Organisations]]\n#### Overview:\n\nThe Lotus is a venerable organization dedicated to the balance of the world, acting as spiritual guides and protectors of harmony. They host the annual [[Ceremony of the Resonance]], symbolizing their commitment to unity among benders.\n\n\n---\n\n#### Uniform Design:\n\n- **Colors:**  \n    White and gold, symbolizing purity and enlightenment, with accents of light blue to represent spiritual connection.\n    \n- **Style:**\n    \n    - Flowing robes for spiritual leaders, with a lotus emblem embroidered on the chest.\n    - Soldiers wear sturdy uniforms with plated armor on shoulders and bracers, designed for mobility and defense.\n- **Details:**\n    \n    - A sash or belt with a lotus motif, denoting rank.\n    - Masks for combat troops, styled after serene and neutral faces, emphasizing their role as impartial protectors.\n\n**Links**:\n- [[Mistress Akira Meiyu]]\n- [[Armor definition]]\n- [[Strength]]\n- [[Stonewarden Garon]]\n- [[Wisdom]]\n- [[Grandmaster Iroh Tanaka]]\n- [[The Lotus]]\n\nTags:\n#Earthbending\n#Firebending\n#Waterbending\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Organisations/Organisations_wikigraph_treemap.html": {"size": 3646983, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Organisations/Night Bloom/new-file.md": {"size": 17, "type": "text", "text": "this is text file"}, "Player Root/Organisations/Night Bloom/Night Bloom_wikigraph_treemap.html": {"size": 3645085, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Organisations/Night Bloom/Ceremony of the Resonance.md": {"size": 31, "type": "text", "text": "\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Organisations/Night Bloom/Night Bloom_wikigraph_sunburst.html": {"size": 0, "type": "text", "text": ""}, "Player Root/Organisations/Night Bloom/Night Bloom.md": {"size": 3166, "type": "text", "text": "[[Organisations]]\n#### Overview:\n\nThe Night Bloom is a radical faction seeking to overthrow the Avatar\u2019s influence, advocating for a world ruled collectively by elite benders. They view the Avatar as a relic of oppression and seek to reshape the spiritual and physical realms.\n\n---\n\n#### Leadership:\n\n1. **[[Isay Trekal]] (she/her) (Faction Leader)**\n    \n    - **Physical Description:**  \n        A striking woman in her early forties with jet-black hair styled into an intricate braid that cascades down her back. Her pale blue eyes seem to pierce through her opponents, reflecting a sharp intellect and unshakable resolve. Her high cheekbones and angular features give her an almost regal appearance. She wears an ornate, high-collared cloak adorned with faintly glowing charms.\n    - **Bending Style:**  \n        Waterbending focused on offensive techniques, including the manipulation of black mist\u2014a mixture of water vapor and fine particles, creating disorienting smoke.\n    - **Role:**  \n        Charismatic leader and visionary behind the rebellion. Isay is a master tactician and inspiring orator.\n2. **[[Hanal Koga]](she/her) (Second-in-Command)**\n    \n    - **Physical Description:**  \n        A sturdy woman with sun-kissed skin and short, spiky hair the color of sandy blonde. She has a confident, swaggering gait, often adorned with sand-crusted boots and bracers. Her lightweight armor is covered with fine grains of sand that move subtly as she walks.\n    - **Bending Style:**  \n        Earthbending with a specialization in sand manipulation.\n    - **Role:**  \n        Oversees the Night Bloom\u2019s military operations, crafting strategies for their attacks.\n3. **[[Rin Kotak]](he/him) (Spiritualist)**\n    \n    - **Physical Description:**  \n        A tall, gaunt man with alabaster skin and wispy, shoulder-length white hair that seems to shift like mist in the wind. His gray eyes are perpetually half-lidded, giving him a detached, eerie demeanor. His flowing black robes ripple unnaturally, as if caught in a constant breeze. His soft-spoken voice carries an unsettling intensity.\n    - **Bending Style:**  \n        Airbending with a dark twist\u2014manipulating sound waves to confuse and disorient enemies and bending the air around him to make him almost invisible.\n    - **Role:**  \n        Spirit guide of the Night Bloom, responsible for forging alliances with rogue spirits.\n\n---\n\n#### Uniform Design:\n\n- **Colors:**  \n    Black and deep purple, representing secrecy and defiance, with accents of crimson to signify rebellion.\n    \n- **Style:**\n    \n    - Sleek and utilitarian clothing designed for agility.\n    - Leaders wear flowing cloaks with jagged, petal-like edges to resemble blooming flowers in the dark.\n- **Details:**\n    \n    - Masks covering the lower face, often stylized with floral patterns or fanged motifs.\n    - Small spirit-charms integrated into their outfits, glowing faintly with corrupted energy during rituals or battles.\n\n**Links**:\n- [[Armor definition]]\n- [[Isay Trekal]]\n- [[Rin Kotak]]\n- [[Night Bloom]]\n- [[Hanal Koga]]\n\nTags:\n#Earthbending\n#Waterbending\n#Airbending\n#Avatar\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Organisations/Night Bloom/raka_file_hello.md": {"size": 17, "type": "text", "text": "this is text file"}, "Player Root/Rules/Special Attacks.md": {"size": 138, "type": "text", "text": "\nThese are attacks you only have under specific limited conditions or have to study from a master to learn.\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/Rules_wikigraph_treemap.html": {"size": 3827839, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/AGBs.md": {"size": 1148, "type": "text", "text": "\u00a71 This is all fun and games.\n\t\u00a71.1 For many people (including the author :D) a big part of the fun is the improv theater roleplaying in TTRPGs. \n\tSome people like the Characterbuilding and creating a personality and fleshed out character how they imagine it. Both are valid but it needs to be communicated that i want to keep it generally in a very \"yes and...\" kind of style but always accept a \"no id rather have it like...\".\n\t\t1.1.1 That being said this also applies to world building and lore so feel free to worldbuild yourself a bit either spontanously during roleplay or planned out for bigger worldbuilding projects (e.g. \"I had an idea for a watertribe that uses plantbending algae as boats for their lake\"(and discussed with the GM)).\n\n\u00a72 I will try my best to nerve and buff bending moves how i think fits best. \n\t2.1 This may also include giving them more roleplaying opportunities to find bending teachers or similar to acquire new skills and bending Moves.\n\n\u00a73 I'm trying some more experimental mechanics that may be fun for me but not so fun for others. So always accept constructive feedback and \n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/Combat Rules.md": {"size": 295, "type": "text", "text": "\n**Defensive:**\n\tMostly like DnD but Armor class is now called evasion and there is an Armor  for every kind of Damage (Damage Resistance) that reduces the damage taken per instance.\n\tThe Damage types will be the same as in Dnd\n\n\n\n**Links**:\n- [[Armor definition]]\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/Evasion.md": {"size": 106, "type": "text", "text": "How hard it is to hit you\nBase Evasion: 10 + [[Dex]] + [[Airbending Level]]\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/Teamwork Moves.md": {"size": 1340, "type": "text", "text": "#Collectionfile \nPROBABLY NEEDS REBALANCING ON THE GO ALL THE TIME\n**Joining Moves:**  \nBenders can combine their abilities to create more powerful or creative effects, guided by the \"rule of cool.\" This allows for dynamic and collaborative gameplay that rewards teamwork.\n\n---\n\n**Conditions to Join:**\n\n- **Proximity:** You must be within 10 feet of the ally initiating the Move.\n- **[[Action]] Type:** Joining the Move requires using your [[Reaction]].\n- **Move Compatibility:** The same Move does not need to be performed at the same Level Slot as the initiating Bender.\n\n---\n\n**Effect:**  \nCombining Moves enhances their overall power or effect. For example, if an ally uses [[Fireburst]], and you join in, the resulting effect could be strong enough to burst through a stone wall.\n\n---\n\n**Optional Variant:**  \nYou can also combine different Moves if you can explain how they interact. For instance:\n\n- A **Mud Wall** created by an Earthbender could be reinforced with an **Ice Wall** from a Waterbender, resulting in a sturdier barrier with sharp ice spike defenses.  \n    This opens opportunities for creative problem-solving and innovative combinations, adding depth to gameplay.\n<!-- BEGIN-AUTO-COLLECTION:Teamwork Moves -->\n## Backlinks\n\n  ./\n\n<!-- END-AUTO-COLLECTION -->\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/Rules_wikigraph_sunburst.html": {"size": 3776936, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Bending Rules/Bending Rules_wikigraph_treemap.html": {"size": 143138, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Bending Rules/Bending Rules_wikigraph_sunburst.html": {"size": 119784, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Bending Rules/Utility.md": {"size": 129, "type": "text", "text": "\nThese Moves can be used without expending slots (and meant for usage out of combat)\n\n\n#Level1 \n#air #earth #fire #spirit #water "}, "Player Root/Rules/Bending Rules/Spirit/Mechanics/Avatar Spirit Bridge Level.md": {"size": 4672, "type": "text", "text": "\n#revision_needed\n### \ud83c\udf0c **Bridge of the Spirit: A Personal Journey**\n\n> _\"To be the Avatar is not merely to bend all elements, but to bend one\u2019s self\u2014to align will and wisdom with the needs of the world.\"_  \n> \u2014 Grandmaster Shuyin of the White Lotus\n\n---\n\n### \ud83e\udded Reflecting on Your Journey\n\nEach character stands at a crossroads between spirit and self, and your progression in this campaign is deeply rooted in how your character **emotionally and spiritually reacts** to the events that unfold. Reflect on:\n\n- Have recent events **hardened** them? Are they acting with more **recklessness, cruelty, or obsession** to achieve their goals\u2014driven by trauma or ambition?\n    \n- Or have they found **inner balance**, perhaps discovering a renewed sense of **duty or compassion**, and beginning to understand the role of a **bridge** between the mortal and spiritual worlds?\n    \n\nThis reflection influences your **[[na]]** and will guide what type of power you unlock next.\n\n---\n\n### \ud83d\udd25 Paths of Power\n\nWhen your character increases their **Bridge Level**, they may choose **one** of the following paths, shaped by how they have grown:\n\n#### **Chaotic Awakening**\n\nFor those who pursue strength, vengeance, or control without regard for balance. Unlock a **new bending slot** in an element already known (but not your origin element).  \n_Example: A waterbender who has learned firebending may now gain a second firebending move._\n\n#### **Harmonic Enlightenment**\n\nFor those who embrace their role as a bridge between worlds. Unlock **a new bending element**, representing spiritual expansion and Avatar-like growth.  \n_Example: An earthbender may now begin learning airbending._  \nAdditionally, you may gain access to **rare spiritual techniques** (GM approval), such as Spirit-Bending, Healing Flames, Echobending, etc., reflecting your evolving balance and connection to the Avatar Spirit.\n\n> Choose based on your character's **emotional and spiritual arc**. This is about what kind of person they are becoming, not just what powers they can gain.\n\n---\n\n### \ud83d\udc8e Spirit Stones\n\nScattered throughout the world are rare, luminous **[[Spirit Stones]]**, ancient relics humming with resonance from the Spirit World. Each stone can be **used in a ritual to unlock or increase a Bridge Level**, drawing forth latent potential within the bender\u2019s soul.\n\n- **Your first Bridge Level was gained** using one such stone in the initial ritual.\n    \n- These stones are **rare and valuable**, often hidden, protected, or born from significant spirit-world events.\n    \n- Some stones may resonate with specific **emotions, elements, or spirits**, and influence what type of power is awakened.\n    \n\n> The ritual may vary depending on location, spirit presence, or celestial timing. Use of a stone should always involve **narrative roleplay**, reflection, and a meaningful choice.\n\nTrack stones and their effects in your [[Spirit Stone Log]].\n\n---\n\n### \ud83d\udcca Bending Move Availability Table\n\n|**Avatar Spirit Bridge Level**|**Unlocked Move Level**|\n|---|---|\n|**1**|Level 1|\n|**2**|Level 1|\n|**3**|Level 2|\n|**4**|Level 2|\n|**5**|Level 3|\n|**6**|Level 3|\n|**7**|Level 4|\n|**8**|Level 4|\n|**9**|Level 5|\n|**10**|Level 5|\n|**11**|Level 6|\n|**12**|Level 6|\n|**13**|Level 7|\n|**14**|Level 7|\n|**15**|Level 8|\n|**16**|Level 8|\n|**17**|Level 9|\n|**18**|Level 9|\n|**19**|Level 9|\n|**20**|Level 9|\n\n---\n\n### \ud83c\udf00 How to Use This Table\n\n- On **odd-numbered Bridge Levels**, you gain access to **new move tiers**.\n    \n- On **even-numbered Bridge Levels**, you may **select additional moves** from existing unlocked tiers, but do not gain a new tier.\n    \n\n---\n\n### \u2728 Next Steps\n\n- Reflect in your journal: where is your character now\u2014spiritually, emotionally, morally? Use the tag `#spiritreflection`.\n    \n- Record any discovered or used Spirit Stones in the [[Spirit Stone Log]].\n    \n- Meet with the GM to finalize your chosen path: **new slot in a known element** (Chaotic Awakening) or **a new bending element** (Harmonic Enlightenment).\n    \n- Update your [[Character Sheet Template]] with any changes to bending capabilities.\n    \n\n---\n\nTags:  \n#mechanics #spiritbridge #bending #characterprogression #Avatar #spiritstones #advancement #spirit \n<!-- BEGIN-AUTO-COLLECTION:Avatar Spirit Bridge Level -->\n## Backlinks\n\n  ./\n  \u2514\u2500\u2500 Players Part\n      \u2514\u2500\u2500 Rules\n          \u2514\u2500\u2500 Bending Rules\n              \u2514\u2500\u2500 Spirit\n                  \u2514\u2500\u2500 Mechanics\n                      \u251c\u2500\u2500 [[Avatar Spirit Check]]\n                      \u2514\u2500\u2500 [[Spiritbending]]\n\n<!-- END-AUTO-COLLECTION -->\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n[[Player Root]]\n\n#player_root\n"}, "Player Root/Rules/Bending Rules/Spirit/Mechanics/Spiritbending Slot Progression.md": {"size": 319, "type": "text", "text": "\nYou have [[spirit]] Maximum [[spiritbending slot]]s that are restored after about an hour of rest.\n\nYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\n- spend 2 and then 1 \n- spend 1 and then 2 or\n- spend 1 then 1 then 1 \n\n#spirit \n#Level1 \n"}, "Player Root/Rules/Bending Rules/Spirit/Mechanics/Spiritbending.md": {"size": 1104, "type": "text", "text": "\n\nSpiritbending represents techniques and rituals that draw on the Avatar Spirit or local spirit presences. These moves often focus on communication, protection, travel between worlds, and subtle influence rather than raw damage.\n\nHow it works (tiny contract):\n\n- Resource: Spiritbending slots. These come from your Bridge Level, Spirit Stones, and occasional Avatar Spirit Checks.\n- Use: Spend slots to cast Spiritbending moves (see `Spiritbending Moves.md`).\n- Limits: The GM may cap maximum temporary slots gained from checks or stones to preserve balance.\n\nWhen to use:\n\n- During rituals, when interacting with spirits, when entering spirit-touched locations, or as part of major story beats involving the Avatar Spirit.\n\nRisks:\n\n- Spiritbending can attract attention from powerful spirits. Overuse or reckless bargaining may cause hauntings, covenants, or spirit debt.\n\nQuick references:\n\n- Moves and examples: [[Spiritbending Moves]]\n- Mechanics for gaining slots: [[Avatar Spirit Check]]\n- Progression and Bridge mechanics: [[Avatar Spirit Bridge Level]]\n- #spirit \n\n#teamup \n#player_root\n#spirit\n"}, "Player Root/Rules/Bending Rules/Spirit/Mechanics/Avatar Spirit Check.md": {"size": 1314, "type": "text", "text": "# Avatar Spirit Check\n\nRoll a d20 as part of a spirit-focused ritual or when prompted by the GM (typically at key story beats or after using a Spirit Stone).\n\n- If the roll is even: you gain a number of temporary [[Spiritbending]] spellslots equal to the d20 result. These slots last until the end of the current scene or until spent, whichever comes first.\n- If the roll is odd: you do not gain slots, but you receive one _Spirit Echo_ \u2014 a small, narratively useful boon (example: advantage on one Spiritbending check, a single short vision providing a clue, or temporary insight on a spirit's motive). The GM chooses the precise echo based on context.\n\nRules & limits (assumptions \u2014 adjust with GM):\n\n- Maximum gained slots cannot exceed the character's Bridge Level (or another GM-set cap).\n- This check is usually available once per long rest unless a Spirit Stone or special ritual grants repeated checks.\n- Spirit slots gained are of the lowest available Spiritbending tier and must be used for Spiritbending moves or effects.\n\nExample:\n\n- You roll a d20 and get 14 (even). You gain 14 temporary Spiritbending spellslots (subject to the GM cap). You spend 2 of them to cast a Spirit Ward and keep the rest until the end of the scene.\n\n[[Avatar Spirit Bridge Level]]\n[[Player Root]]\n\n#player_root\n#spirit\n"}, "Player Root/Rules/Bending Rules/Spirit/Shapeshifting Pics/Luma'tik.png": {"size": 1825635, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Bending Rules/Spirit/Shapeshifting Pics/Bearturtle.webp": {"size": 177630, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Bending Rules/Spirit/Spiritbending Moves/Level 2/Luma\u2019tik.md": {"size": 2707, "type": "text", "text": "```markdown\n#shapeshifting_form\n**Name:** Luma\u2019tik \u2014 Glimmerkin of Cracked Mirrors  \n**Type:** Lesser Spirit  \n**Domain:** Light, Trickery  \n**Transformation Points cost:** 2 [[Transformation Points]]\n[[Element Level]]:\n\t[[Firebending]]: [[Level 2]] \n\t[[Earthbending]]: [[Level 1]]\n\n\n---\n![[Luma'tik.png]]\n- **Size:** Small\n\n| **Stat**                       | **Value**   |\n| ------------------------------ | ----------- |\n| **[[Strength]] ([[STR]])**     | 4 (-3)      |\n| **[[Dexterity]] ([[Dex]])**    | **16 (+3)** |\n| **[[Constitution]] ([[Con]])** | 12 (+1)     |\n| [[Wisdom]]([[WIS]])            | 10(+0)      |\n| [[Intelligence]]([[Int]])      | 8(-1)       |\n\n\n- **Ideal for infiltration, distraction, and sensory manipulation.** Luma\u2019tik thrives in urban or crystal-laced environments, using its shimmering form and illusions to mislead enemies and aid allies from the shadows. Though not powerful in direct combat, it\u2019s difficult to pin down and annoying to deal with.\n    \n\n---\n\n### **Movement:**\n\n- Fly 15 m (hovering, effortless, emits no sound).\n    \n- Climb 10 m (can scale smooth surfaces with reflective qualities).\n    \n\n---\n\n### **Abilities in Luma\u2019tik Form:**\n\n- **Refraction Veil:** While in bright or shifting light, Luma\u2019tik gains advantage on Stealth and cannot be targeted by opportunity attacks. This effect ends if Luma\u2019tik is in total darkness or complete silence.\n    \n- **Mirage Flicker (1/[[Short Rest]]):** As a [[Bonus Action]], Luma\u2019tik can create up to two illusionary duplicates for 1 minute. Each duplicate mimics its movements and grants attackers disadvantage on attack rolls until they hit Luma\u2019tik.\n    \n    \n- **Glimmerjump:** \n- [[Reaction]]:\n\tteleport to any point within 20 m that is brightly lit or reflects light (e.g., mirrors, water, crystal surfaces)\n    \n\n---\n\n### **Combat Stats:**\n\n- **Evasion:** 17\n    \n- **HP:** 21 (fragile, relies on mobility and illusions)\n    \n\n---\n\n[[Special Attacks]]:\n\n- **Sparkbite:** Melee Weapon Attack, [[Spirit Attack Roll]]to hit, 1d6 piercing and 1d4 radiant damage. If attacking from stealth, deals an extra 1d4 radiant damage.\n    \n- **Lightshard Dart:** Ranged Attack, [[Spirit Attack Roll]] to hit, 1d6 radiant damage. On hit, target has disadvantage on Perception checks for 1 minute.\n\n---\n\n_Luma\u2019tik is a playful, capricious entity\u2014often found dancing between fractured crystal surfaces or taunting intruders with flickers of light and laughter. Bonding with this spirit gives a bender or spiritualist access to stealth, misdirection, and flash-based utility, ideal for scouts or cunning tacticians._\n\n---\n\n\n\n#Level2 #spirit #player_root\n\n#Level2\n#player_root\n#shapeshifting_form\n#spirit\n```\n"}, "Player Root/Rules/Bending Rules/Spirit/Spiritbending Moves/Level 2/Bearturtle.md": {"size": 1721, "type": "text", "text": "```markdown\n#shapeshifting_form\n![[Bearturtle.webp]]#### **Bearturtle Form (Protection/Defense Form)**\n- **Size:** Medium\n- On Transform:\n\t- **Defensive Presence:** Allies within 5 meter gain +3 to their AC until you Form Drops.\n\n| **Stat**                       | **Value** |\n| ------------------------------ | --------- |\n| **[[Strength]] ([[STR]])**     | 22 (+6)   |\n| **[[Dexterity]] ([[Dex]])**    | 2 (-4)    |\n| **[[Constitution]] ([[Con]])** | 24 (+7)   |\n| [[Wisdom]]([[WIS]])            | 10(+0)    |\n| [[Intelligence]]([[Int]])      | 8(-1)     |\n\n- **Movement:**\n    \n    - Walk 20 meter.\n    - Swim 10 meter\n\n\n- **Abilities in Bearturtle Form:**\n    - **Shell Shield:**\n\t    - [[Reaction]]\n\t        When an ally within 3 meter is attacked, impose Disadvantage on the [[Attack Roll]] as you shift to protect them with your shell. Can be used 3 times per long rest.\n\t    **Tuck in**: \n\t    - [[Reaction]]\n\t\t    When you fail a dexterity saving throw you still only take half damage. Your [[Movement]] in the next round is halved.\n\n    - **Sturdy Form:**\n\t    - You have Advantage on saving throws against being knocked prone or moved against your will.\n    -\n    - \n- **Combat Stats (Bearturtle):**\n    \n    - Evasion: 15\n    - \n    - Armor: \n\t    - 5 [[Physical Armor]]\n\t    - 3 [[General Armor]]\n    - HP: 50.\n    - Attacks:\n        - **Powerful Swipe:** Melee Weapon Attack, +Strength to hit, 2d6 + Str slashing damage.\n\t- **Shell Slam (AOE):** All creatures within a 1 meter radius must make a Dexterity save DC17 or take 2d8 bludgeoning damage.\n\n    \n\n    \nBending Slots:\n\tEarth Lvl1: 3\n\n#transformation #spirit  #Level2 #player_root\n\n#Level2\n#player_root\n#shapeshifting_form\n#spirit\n#transformation\n```\n"}, "Player Root/Rules/Bending Rules/Spirit/Spiritbending Moves/Level 2/Spirit Ward.md": {"size": 314, "type": "text", "text": "```markdown\n#Level2\n#spirit \n#Reaction \n\n- Range: self\n- Duration: [[spiritbending slot]] rounds.\n\n**Effect**:\nProvides 4 * [[spiritbending slot]] [[General Armor]], [[Evasion]],  [[Barrier]] and [[Damage Dice Bonus]] until the start of your next turn. \n\n\nTags:\n#spirit\n\n#Level2\n#Reaction\n#player_root\n#spirit\n```\n"}, "Player Root/Rules/Bending Rules/Spirit/Spiritbending Moves/Level 1/Human Form.md": {"size": 159, "type": "text", "text": "```markdown\n#Action\n\n[[Mahogany]]\n[[Special Attacks]]\n\n\n#spirit #Level1 #shapeshifting_form #player_root\n\n#Level1\n#player_root\n#shapeshifting_form\n#spirit\n```\n"}, "Player Root/Rules/Bending Rules/Spirit/Spiritbending Moves/Level 1/Flying Lemur Form.md": {"size": 1343, "type": "text", "text": "```markdown\n#shapeshifting_form\n**Transformation Points cost:** 2 [[Transformation Points]]\n\n| **Stat**                       | **Value** |\n| ------------------------------ | --------- |\n| **[[Strength]] ([[STR]])**     | 6 (-2)    |\n| **[[Dexterity]] ([[Dex]])**    | 24(+7)    |\n| **[[Constitution]] ([[Con]])** | 7 (-2)    |\n| [[Wisdom]]([[WIS]])            | 14(+2)    |\n| [[Intelligence]]([[Int]])      | 8(-1)     |\n**Transformation Points cost:** 2 [[Transformation Points]]\n- **Size:** Small\n    \n- **Movement:**\n    - Fly 20 m (highly maneuverable).\n    - Climb 20 m (adapted to vertical movement).\n- **Abilities in Flying Lemur Form:**\n\n    - **Silent Glide:** Advantage on Stealth checks while flying.\n    - **Acute Senses:** Advantage on Perception checks that rely on sight or hearing.\n    - **Quick Escape:** Disengage or dash as a [[Bonus Action]].\n- **Combat Stats (Flying Lemur):**\n    \n    - [[Evasion]]: 20\n    - HP: 6 (fragile but evasive).\n    - Attacks:\n        - **Razor Claws:** Melee Weapon Attack, d20 + [[Dex]] to hit, 1d4 slashing damage.\n- **Uses:**  \n    Perfect for scouting, infiltration, or swift movement through difficult terrain. The form allows quick evasion and small-scale reconnaissance.\n\nBending Slots:\n\tAir Lvl1: 4\n\n\n#spirit  #Level1 #player_root\n\n#Level1\n#player_root\n#shapeshifting_form\n#spirit\n```\n"}, "Player Root/Rules/Bending Rules/Spirit/Spiritbending Moves/Level 1/Shapeshifting.md": {"size": 423, "type": "text", "text": "\n#transformation\n\nYou transform into a creature using [[Spiritbending Slot]]. The Level of creature corresponds with the Bending Slot used.\n- Range: e.g. [[Self]].\n- **Duration:** varies\n- Whenever you loose your shapeshifting form involuntarily (by getting reduced to 0 HP in that form) you roll against your own [[Spiritbending DC]] or you gain [[spirit]] [[chaos_energy]].\n\n#level1\n#player_root\n#spirit\n#transformation\n\n"}, "Player Root/Rules/Bending Rules/Spirit/Spiritbending Moves/Level 1/Untitled.md": {"size": 248, "type": "text", "text": "```markdown\n#transformation\n\nYou transform into a creature using [[Spiritbending Slot]]. The Level of creature corresponds with the Bending Slot used.\n- Range: e.g. [[Self]].\n- **Duration:** varies\n\n#level1\n#player_root\n#spirit\n#transformation\n```\n"}, "Player Root/Rules/Bending Rules/Water/Mechanics/Cyclic Flow.md": {"size": 91, "type": "text", "text": "If Concentration is not broken half the [[Water Charges]] are refunded.\n\n\n#water \n#Level1 \n"}, "Player Root/Rules/Bending Rules/Water/Mechanics/Water Charges.md": {"size": 514, "type": "text", "text": "Water Charges represent the amount of water available for a water-bender to manipulate.\n\n- **Environmental Influence:**  \n   The number of Water Charges available at the start of combat or during an encounter depends on the setting. Feel free to get creative where to find water:\n  - **Desert/Dry Area:** ~0 Water Charges (minimum water source).\n  - **Humid Area:** ~5-10 Water Charges.\n  - **Near Water Source (Lake, Ocean, etc.):** 15 Water Charges.\n  - **In Lake, Ocean, etc.:** ~50+ charges\n\n#water \n#Level1 \n\n"}, "Player Root/Rules/Bending Rules/Water/Waterbending Moves/Level 2/Slicing Water.md": {"size": 197, "type": "text", "text": "#Action \n\n- **Range:** 2 * [[Water_charge]] meter \n-  [[Water Attack Roll]]\n- **Damage:** [[Water_charge]]d6 slicing damage to all creatures within the area within line of sight. \n\n#Level2\n#water \n"}, "Player Root/Rules/Bending Rules/Water/Waterbending Moves/Level 2/Water Tentacles.md": {"size": 947, "type": "text", "text": "\n#Action\n\n[[Level 3]]\n[[Cyclic Flow]]\n\n- Range: [[Self]].\n- **Duration:** 1 Turn.\n- Description The waterbender summons two water tentacles to attack or grapple targets.\n\n**Effects:**\n    - [[Water Attack Rolll]]\n    - **Damage:** 1d10 bludgeoning damage per tentacle.\n    - **Grapple:** A creature hit by the tentacle must succeed on a Strength saving throw against your [[Player Root/Rules/Bending Rules/Water/Mechanics/Waterbending DC]] or be restrained.\n\n[[Element]]\n#### **Water Tentacles (2nd Level Move)**\n\n- **Cost:** 2 Water Charges.\n- **Type:** [[Action]].\n- **Range:** 15 ft.\n- **Effect:**  \n    The waterbender summons two water tentacles to attack or grapple targets.\n    - **[[Water Attack Rolll]]:** [[Int]] + [[Proficiency]].\n    - **Damage:** 1d10 bludgeoning damage per tentacle.\n    - **Grapple:** A creature hit by the tentacle must succeed on a Strength saving throw or be restrained.\n\n\nTags:\n\n#Level2\n#player_root\n#water\n```\n"}, "Player Root/Rules/Bending Rules/Water/Waterbending Moves/Level 2/Ice Daggers.md": {"size": 248, "type": "text", "text": "#Action \n\n- **Range:** 5 * [[water]] level\n- [[Water Attack Roll]]\n- Projectiles: [[Water_charge]] \\* 3\n- **Damage:** 1d4 piercing per Projectile\n\nThe waterbender creates small sharp daggers of ice to hurl at targets.\n\n#Level2\n#player_root\n#water\n\n"}, "Player Root/Rules/Bending Rules/Water/Waterbending Moves/Level 2/Freeze Enemy.md": {"size": 385, "type": "text", "text": "#Reaction \n#Bonus_Action \n\n- **Range:**  [[Water]] Level meters.\n\n- The waterbender can attempt to freeze a creature that has been hit by a Move using [[Water_charge]](s). It has to succeed a Strength Saving throw against your [[Waterbending DC]] or become [[Immobilised]].\n- The target gets to repeat its save at the start of its turn. The DC drops by 1 every round.\n\n\n#Level2\n#water\n"}, "Player Root/Rules/Bending Rules/Water/Waterbending Moves/Level 3/Wall of water.md": {"size": 250, "type": "text", "text": "#Action \n#Concentration \n\n- **Range:** [[Water_charge]] meter wall\n- **Effect:**  \n    The waterbender creates a wall of water. It blocks most projectiles and moving through requires a strength check against your [[Waterbending DC]]\n\n\n#Level3\n#water "}, "Player Root/Rules/Bending Rules/Water/Waterbending Moves/Level 3/Complete Cyclic Reflow.md": {"size": 361, "type": "text", "text": "```markdown\n#Action\n\n[[Bonus Action]]\n[[Level 3]]\n[[Cyclic Flow]]\n\n- Range:  [[Self]].\n- Instead of regaining half you regain all [[Cyclic Flow]] points \n\n**Effects:**\n- the effect(s) of the move e.g. Spend 1 [[Airbending Slot]] to add 5 * [[Airbending Slot]] meters to your movement for this turn.\n\n[[Element]]\n[[Player Root]]\n\n#Level3\n#player_root\n#water\n```\n"}, "Player Root/Rules/Bending Rules/Water/Waterbending Moves/Level 3/Icicle Ammunition.md": {"size": 543, "type": "text", "text": "\n#Action\n\n- **Cost:** 3- 2 * CL Water Charges.\n- **Type:** [[Action]].\n- **Range:** 5 Meter.\n- **Effect:**  \n    You create A number of Icicles equal to the used charges.\n\tThey swirl around the Target and grants them the [[Reaction]] to send any or all of the [[Ammunition]] against one target within 100 Meters of them until all Icicles are used.\n\tAmmunition:\n    - **HP:** 20 HP.\n    - **AC:** 12.\n    - Damage 5d12 + [[Int]] Piercing Damage\n    - **Duration:** 1 minute.\n\n\nTags:\n#Waterbending\n\n#Level3\n#Waterbending\n#player_root\n#water\n```\n"}, "Player Root/Rules/Bending Rules/Water/Waterbending Moves/Level 3/Surfing.md": {"size": 338, "type": "text", "text": "```markdown\n#Action\n\n- **Cost:** None.\n- **Type:** Passive.\n- **Range:** Self.\n- **Effect:**  \n    The waterbender rides atop a thin sheet of water or ice, moving with increased agility.\n    - **Speed Boost:** Gain +30 ft movement speed.\n    - **Prerequisite:** Accessible at a higher level(TBA).\n\n\nTags:\n\n#Level3\n#player_root\n#water\n```\n"}, "Player Root/Rules/Bending Rules/Water/Waterbending Moves/Level 3/Healing Mist.md": {"size": 477, "type": "text", "text": "```markdown\n#Action\n\n[[Cyclic Flow]]\n[[Concentration]]\n[[Level 3]]\n    \n[[Range: 1]] * [[Water Charges]] Meter radius cloud\nEffect:\n [[Water Charges]] * d8 Healing to every creature that was in the clouds radius during the [[Concentration]]\n\n- _Interactions:_\n    - Can be _moved_ by Airbenders.\n        \n    - Can be _dispersed_ or _destroyed_ by strong firebending or extreme heat breaking [[Cyclic Flow]]\n        \n\n#Cyclic_Flow\n\n#Cyclic_Flow\n#Level3\n#player_root\n#water\n```\n"}, "Player Root/Rules/Bending Rules/Water/Waterbending Moves/Level 3/Mistbending.md": {"size": 350, "type": "text", "text": "#Action\n\n- **Cost:** 1 Water Charge per 1 meter radius .\n- **Type:** [[Action]].\n- **Range:** 1 meter radius centered on self.\n    - Will grow 1 meter per round until full sized\n    - Creates a heavily obscured area for concealment that can be absorbed to regain charges (1 meter radius per Turn) or blown await by air.\n\n\n#water \n#Level3\n#utility \n\n\n"}, "Player Root/Rules/Bending Rules/Water/Waterbending Moves/Level 4/Ice Wall.md": {"size": 318, "type": "text", "text": "\n#Action\n\n- **Range:** [[Water_charge]] meter wall\n- **Effect:**  \n    The waterbender creates a wall of Ice providing [[Water_charge]] \\* 10 [[Barrier]]. \n\tThe Barrier is reduced by 5 at the start of each of your turns but can be restored using a #Bonus_Action by any waterbender.\n\n#Level4\n#water \n#freezing \n#barrier"}, "Player Root/Rules/Bending Rules/Water/Waterbending Moves/Cantrips/Shape Water.md": {"size": 733, "type": "text", "text": "```markdown\n#**Shape_Water_(Cantrip)**\n\n- **Cost:** None.\n- **Range:** 30 ft.\n- **Type:** [[Action]].\n- **Duration:** At Will. Concentration.\n- **Effect:**  \n    You can manipulate a water, shaping it into simple forms, moving it, or changing its state (solid, liquid, mist) temporarily.\n    - **Limitations:** Cannot deal damage but can be used for utility (e.g., extinguishing flames, creating distractions). The higher your Level is the more water can be shaped. Might need an [[Int]] ability check.\n\n**Links**:\n- [[Player Root/Rules/Bending Rules/Water/Waterbending Moves/Cantrips/Shape Water]]\n- [[_Rules]]\n- [[Int]]\n- [[Waterbending Moves]]\n\nTags:\n#Waterbending\n[[Waterbending]]\n[[Player Root]]\n\n#Waterbending\n#player_root\n```\n"}, "Player Root/Rules/Bending Rules/Water/Waterbending Moves/Level 1/Freeze.md": {"size": 324, "type": "text", "text": "#Action\n- **Range:** 3m * [[water]] level\n- **Effect:**  \n    The waterbender can freeze an amount of water. The higher the [[water]] Level the more water can be frozen. (for big amounts might need to roll an [[Player Root/variable/primary_stat/Intelligence|Intelligence]] check) \n\n\n#Waterbending\n#freezing\n#water \n#Level1 \n"}, "Player Root/Rules/Bending Rules/Water/Waterbending Moves/Level 1/Healing Water.md": {"size": 426, "type": "text", "text": "\n#Action\n#Cyclic_Flow\n#Concentration \n\n- **Cost:** 1-3 Water Charges.\n- Duration: 1 round Concentration.\n- **Range:** Touch (through water).\n- **Effect:**  \n    You channel healing energy through water, restoring health to a creature. \n\t- If the creature is unconscious the creature becomes stable immediately.\n    - **Healing:** 2d8 per charge + [[Int]] modifier at the beginning of your next Turn.\n\n\n#Level1\n#water\n#healing\n"}, "Player Root/Rules/Bending Rules/Water/Waterbending Moves/Level 1/Water Whip.md": {"size": 486, "type": "text", "text": "#water \n- **Range:** [[Water_charge]] meters\n- **Effect:**  \n   The waterbender lashes out with a tendril of water, striking a target within range.\n  - **[[Water Attack Roll]]:**\n  - **Damage:** 1d6 modifier bludgeoning damage.\n  - **Special:** The target must succeed on a Strength saving throw against your [[Waterbending DC]] or be immobilised for 1 round.\n\n**Links**:\n\n- [[Strength]]\n- [[_Rules]]\n- [[Water Whip]]\n- [[Proficiency]]\n- [[Int]]\n\nTags:\n\n#Level1\n#player_root\n#water\n```\n"}, "Player Root/Rules/Bending Rules/Water/Waterbending Moves/Level 1/Piercing Water.md": {"size": 203, "type": "text", "text": "\n#Action\n\n- Range: 3\\* [[Water_charge]] meters\n- [[Water Attack Roll]]\n- Damage: [[Water_charge]]d6 piercing.\n\nThe waterbender shoots a sharp, pressurized stream of water at a target.\n\n\n#Level1\n#water \n\n"}, "Player Root/Rules/Bending Rules/Air/Mechanics/Speed Boost.md": {"size": 102, "type": "text", "text": "![[Movement]] \n\nAdditionally Many Airbending techniques can boost movement\n\n#player_root\n#air\n#Level1 "}, "Player Root/Rules/Bending Rules/Air/Mechanics/Airbending Slot Progression.md": {"size": 300, "type": "text", "text": "\nYou have 2 \\* [[air]] Maximum Slots that are restored after about an hour of rest.\n\nYou can always only use maximum half of you current Bending slots on any move (rounded up so if you have 3 left you can either:\n- spend 2 and then 1 \n- spend 1 and then 2 or\n- spend 1 then 1 then 1 \n\n#air \n#Level1 \n"}, "Player Root/Rules/Bending Rules/Air/Airbending Moves/Airbending Moves_wikigraph_sunburst.html": {"size": 3646630, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Bending Rules/Air/Airbending Moves/Airbending Moves_wikigraph_treemap.html": {"size": 3648272, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Bending Rules/Air/Airbending Moves/Level 5/Level 5_wikigraph_treemap.html": {"size": 3640945, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Bending Rules/Air/Airbending Moves/Level 5/Level 5_wikigraph_sunburst.html": {"size": 3640686, "type": "large", "note": "file too large to embed in static snapshot"}, "Player Root/Rules/Bending Rules/Air/Airbending Moves/Level 5/Tornado Shield.md": {"size": 82, "type": "text", "text": "\n#Action\n\n[[Airbending]]\n[[Level 5]]\n[[Player Root]]\n\n\n#Level5\n#air\n#player_root\n\n"}, "Player Root/Rules/Bending Rules/Air/Airbending Moves/Level 2/Wind Spear.md": {"size": 535, "type": "text", "text": "#Action\n\n- **Range:** 5 * [[Airbending Slot Progression]] meters.\n- **[[Air Attack Roll]]**\n- **Damage**: 1d8 bludgeoning per [[Airbending_slot]]. Deals another 1d6 * [[Airbending_slot]] if the Creature hits a Wall.\n- The Target has to succeed a [[Strength]] saving throw against your [[Airbending DC]] or be knocked back half your travelled distance this turn. \n- **Effects:**\n\t- Utilize airbending to dash towards an enemy within range and line of sight and hit them with a fast blow of pressurised air. \n\t\n\n\n#Level2\n#air\n#movement\n\n"}, "Player Root/Rules/Bending Rules/Air/Airbending Moves/Level 2/Emergency Air Push.md": {"size": 288, "type": "text", "text": "#Danger_Sense_Reaction \n\n- Range:  [[Airbending_slot]] meters\n- Effect:\n\tYou push [[Airbending_slot]] Creatures within a radius [[Airbending Slot]] meters in any direction. The target can make a Strength Saving Throw against your [[Airbending DC]] to resist the Movement.\n\n#air\n#Level2 \n\n"}, "Player Root/Rules/Bending Rules/Air/Airbending Moves/Level 2/Air Vortex.md": {"size": 255, "type": "text", "text": "\n#Action \n\n- **Range:** 2  [[Airbending Slot Progression]] meters radius.\n- **Duration:** Instantaneous.\n\n**Effects:**\n\tCreate a swirling vortex of air around you to deflect projectiles and disperse lingering Damgage effects.\n\n\n#Level2\n#air\n#player_root\n\n"}, "Player Root/Rules/Bending Rules/Air/Airbending Moves/Level 3/Hovering Hands.md": {"size": 415, "type": "text", "text": "#Action\n\n- **Range:** [[air]] * 1 meters.\n- **Duration:** Concentration, up to 1 Minute.\n\n\n**Effects:**\n- Harness precision air currents to perform subtle or delicate tasks from a distance.\n-  Manipulate a small pbject within range or make fine adjustments as if using your hands.\n- You can perform sleight-of-hand dexterity checks or disable small mechanisms remotely.\n\n#Action\n#Level3\n#air\n#player_root\n#utility\n\n"}, "Player Root/Rules/Bending Rules/Air/Airbending Moves/Level 3/Air Shift.md": {"size": 181, "type": "text", "text": "#Danger_Sense_Reaction\n\t- **Range:** Self\n\n**Effects:**\n\t- Gain Advantage on dexterity saving throws until the start of your turn\n\n#Danger_Sense_Reaction\n#Level3\n#air\n#player_root\n\n"}, "Player Root/Rules/Bending Rules/Air/Airbending Moves/Level 4/Tail Wind.md": {"size": 343, "type": "text", "text": "\n#Bonus_Action \n#Concentration \n\t- **Range:** [[Airbending Slot Progression]] targets within [[Airbending_slot]] meters\n\n**Effects:**\n\t- Targets gain [[Airbending_slot]] * 5 meters movement per round and [[Airbending_slot]] [[Player Root/variable/secondary_stat/Evasion|Evasion]]\n\t  \n\t  \n\t  \n\n#Danger_Sense_Reaction\n#Level4\n#air\n#player_root\n\n"}, "Player Root/Rules/Bending Rules/Air/Airbending Moves/Level 4/Cyclone kick.md": {"size": 146, "type": "text", "text": "\n#Action \n\n- **Range:** 1 * [[Airbending_slot]] Meter cone \n- [[Air Attack Roll]]\n- [[Airbending_slot]]\\* d8 Bludgeoning  Damage\n\n\n#Level4\n#air\n\n\n"}, "Player Root/Rules/Bending Rules/Air/Airbending Moves/Level 1/Shifting Winds.md": {"size": 156, "type": "text", "text": "#Action \n\n- Radius:  [[Airbending_slot]] meters radius\n- Range: [[air]] meters\n- Move most lingering effects within Range\n\n\n#air\n#Level1 \n#lingering_effect "}, "Player Root/Rules/Bending Rules/Air/Airbending Moves/Level 1/Air Blade.md": {"size": 253, "type": "text", "text": "#Action\n\n- **Range:** 5 \\* [[Airbending Slot]] meters.\n- **Duration:** Instantaneous.\n- **Damage**: 1d4 bludgeoning per [[Airbending_slot]].\n- [[Air Attack Roll]]\n- Use airbending to send a blade of Air hurling at a creature within range\n\n\n#Level1\n#air\n"}, "Player Root/Rules/Bending Rules/Air/Airbending Moves/Level 1/Gentle Push.md": {"size": 351, "type": "text", "text": "\n#Danger_Sense_Reaction\n\n- **Range:** 3 * [[Airbending Slot Progression]] meters.\n\n**Effects:**\n- Push up to [[Airbending Slot Progression]]  objects or creatures within Range away, up to Airbending Slot Meters in a chosen direction.\n- Creatures must make a Strength save against your [[Airbending DC]].\n\n#Danger_Sense_Reaction\n#Level1\n#Mobility\n#air\n"}, "Player Root/Rules/Bending Rules/Air/Airbending Moves/Level 1/Airdash.md": {"size": 320, "type": "text", "text": "#Bonus_Action\n- **Range:** Self.\n- **Duration:** 1 Turn.\n- Enhance agility by propelling yourself with gusts of air.\n\n**Effects:**\n- You gain 5 * [[Airbending_slot]] meters movement for this turn.\n\n\n\n\nTags:\n#Airbending #Mobility #Level_1 #Bonus_Action\n\n#Airbending\n#Bonus_Action\n#Level1\n#Level_1\n#Mobility\n#player_root\n\n"}, "Player Root/Rules/Bending Rules/Team-up Moves/Air-Water/Puffy Cloud Armor.md": {"size": 294, "type": "text", "text": "#Action \n#Reaction \n\n\nEach Bender-decides to which pool to add their Bending slots:\n-  **Y**(Water): Yd6 [[Barrier]] \n- **X**(Air): X/2 (rounded down) Targets\n- Duration: 2 Rounds\n\nAirbending vaporizes water into a puffy cloud that creates a temporary Barrier. \n\n#teamup\n#Level4\n#air \n#water \n\n"}, "Player Root/Rules/Bending Rules/Team-up Moves/Water-Water/Frozen Aegis.md": {"size": 508, "type": "text", "text": "#Action\n#Reaction \n \nYou may use Levels from **Water only**.\nEach Bender-decides to which pool to add their Bending slots (min 1 in each):\n-  **X**: X * 10 [[Barrier]]\n-  **Y**: Y * 5 Healing at the start of their turn if barrier remains unbroken\n\n- If the barrier is not broken once at the **start of their next turn**, as the ice thaws, they are healed for **2 \u00d7 Y** but their **[[Movement]] is halved**.\n\n- Encase an ally in a pillar of glacial ice with a liquid healing core.\n\n#teamup \n#Level2 \n#water \n"}, "Player Root/Rules/Bending Rules/Team-up Moves/Water-Water/Freeze Projectiles.md": {"size": 348, "type": "text", "text": "#Action\n#Reaction \n\nYou may use Levels from **Water only**.\nEach Bender-decides to which pool to add their Bending slots:\n-  **X**: X number of projectiles \n-  **Y**: Yd6 Damage per projectile\n \n- One waterbender shoots X Water Projectiles (rolls the attack role) and the other one Freezes them  rolls the damage rolls)\n\n\n#t
