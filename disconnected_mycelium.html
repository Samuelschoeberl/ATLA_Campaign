ain village slides away from the lower terraces.\n- **The Spiritberry Groves** (on the lower terraces) are now cut off by a deep fissure.\n- The Air Nomad **child Rin** is stranded on the opposite side with other villagers.\n\nDust clouds rise, the air fills with panic, and the valley hums with unstable resonance.\n\n---\n\n## Complication 1 \u2013 Separation\n\n- The group must decide whether to climb down and around the mountain, cross unstable bridges, or try bending-assisted solutions to reunite the family.\n- Non-bending solutions: ropework, teamwork, or navigating cliffside paths.\n- Bending solutions: Earthbenders may stabilize rock, Waterbenders freeze temporary paths, Airbenders glide or ferry.\n\nFailing checks doesn\u2019t necessarily drop PCs but causes **minor harm** or **delays**, making them vulnerable to what comes next\u2026\n\n---\n\n## Complication 2 \u2013 Spirit Encounter\n\nAs they make their way toward the grove, the fissure **oozes with corrupted water**. From it rises a strange hybrid spirit:\n\n**Spirit: Burrowfang**\n\n- **Appearance**: A towering **bear-sized rabbit** with a broad muzzle and long ears, covered in dripping mossy fur. Its claws drip mud and it shifts between watery fluidity and rocky density.\n- **Abilities**:\n  - _Earth Claws_: slams the ground, causing spikes of stone.\n  - _Water Wash_: surges forward in a wave, knocking characters back.\n  - _Spirit Rage_: grows more chaotic if the players harm the land around it.\n- **Weakness**: Calms when shown **restoration of balance** (cleansing corrupted vines, feeding it Spiritberry, bending in harmony).\n\n---\n\n# Burrowfang \u2013 Earth-Water Spirit\n\nA spirit born of mud, stone, and river runoff. Normally a gentle guardian of mountain springs, but corrupted quakes have filled it with restless rage.\n\n---\n\n## \ud83d\udcca Stat Block\n\n- **Type**: Large Spirit Beast (Corrupted)\n- **HP**: 60\n- **Armor**: 3 [[General Armor]]\n- **Speed**: Slow on land, Fast when flowing through fissures (burrow/swim).\n\n---\n\n## \ud83c\udf00 Abilities\n\n### \ud83c\udf0a **Water Wash**\n\n- **Action**: Sends a crashing wave of muddy water in a 15 ft cone.\n- **Effect**: All creatures must make a Defense or Athletics check (DC 14).\n  - Success \u2192 Take half damage (1d8).\n  - Fail \u2192 Take full damage (2d8) and are knocked prone/slid back 10 ft.\n\n### \ud83e\udea8 **Earth Claws**\n\n- **Action**: Swipes with stone-encrusted claws.\n- **Attack**: +6 to hit, 2 attacks per turn.\n- **Damage**: 2d6 + Strength (earthbending energy) each.\n\n### \ud83c\udf11 **Spirit Rage (Corruption Aura)**\n\n- **Passive**: When struck, loose stones and muddy water lash out.\n- Anyone within 5 ft of Burrowfang when they deal melee damage must succeed on a Reflex check (DC 13) or take 1d6 damage from shards/splash.\n\n### \ud83c\udf3f **Spirit Shift**\n\n- **Bonus Action (2x per fight)**: Transforms partially into water or stone.\n  - **Water Form**: Resistance to physical damage, vulnerable to freezing/containment.\n  - **Stone Form**: Resistance to bending damage, but speed halved.\n\n---\n\n## \ud83c\udfaf Weaknesses\n\n- Feeding it a **Spiritberry** or cleansing corrupted vines with bending reduces its HP by 10 instantly (it calms).\n- Combined bending (Earth + Water or Air + Water harmony) can weaken its Spirit Rage.\n\n---\n\n## \ud83c\udfad Behavior\n\n- Opens by **Water Wash** to separate intruders.\n- Switches forms depending on damage received.\n- Targets anyone attacking the land or Spiritberry vines most aggressively.\n\n---\n\n## \ud83c\udfc6 Rewards\n\n- **If Defeated (non-lethal)**: The land around the fissure heals slightly. Path to the Spiritberry Grove stabilizes.\n- **If Appeased**: Grants the group **Burrowfang\u2019s Blessing** \u2192 +1 forward on checks with earth/water spirits.\n- **Success**: The Burrowfang retreats, leaving behind fertile ground that opens a safer path to the Spiritberry Grove.\n- **Failure**: The party reaches the grove but strained and injured, consuming more resources.\n\nAt last, they reach the separated **Spiritberry terraces**, where they can gather the healing fruit. The family is reunited after the ordeal, grateful not only for healing their pet but also for saving them during the quake.\n\n---\n\n## Rewards\n\n- **Spiritberry Cluster**: (3 berries)\n  - Eat \u2192 Heal moderate HP and cleanse corruption/fatigue.\n  - Feed to spirit-animal \u2192 Restores vitality, calms agitation or illness.\n- Air Nomad pendant gift for remembrance.\n"}, "Dms Root/Story/Sidestories/The Spiritberry of Stonegrove.md": {"size": 2795, "type": "text", "text": "\n## Setup\n\nAfter examining the hedgehogkoala (\u201cSpikeberry\u201d), the Air Nomad family reveals they once heard of an **Earthbender village** a day\u2019s journey off the main road: **Stonegrove**. The people there cultivate **Spiritberries**, a crystalline glassfruit that glows faintly at night. These rare fruits are said to **nourish both body and spirit**, healing those who eat them and soothing spirit-beasts.\n\nThe family begs the group to travel with them to Stonegrove, hoping that the Spiritberry may heal Spikeberry\u2019s ailment.\n\n---\n\n## Arrival at Stonegrove\n\n- **Setting**: A terraced valley carved into stone, where crystalline vines hang from shaped rock arches. The berries look like translucent grapes with faintly shifting colors inside.\n    \n- **Atmosphere**: Hum of resonance from the stone, soft windchimes hung between earthen homes. The people here are warm but cautious of outsiders.\n    \n\n---\n\n## NPCs\n\n- **Elder Baezu\u2019s Kin (Caretaker of the Spiritberry Orchard)** \u2013 a stern Earthbender who ensures the berries are never misused.\n    \n- **Apprentice Growers** \u2013 young Earthbenders learning to coax vines from stone with rhythmic stomps and gestures.\n    \n\n---\n\n## Conflict\n\nThe villagers are reluctant to share Spiritberries, as each fruit takes months to form and is meant to aid their sick and elderly. To convince them, the party must either:\n\n1. **Skill Challenge** \u2013 Show good intent by helping the orchard:\n    \n    - Earthbending: resonate the vines into bloom.\n        \n    - Waterbending: cleanse the roots with pure water.\n        \n    - Airbending: circulate the valley\u2019s chi with glider-winds.\n        \n    - Non-benders: assist with care, labor, or persuasion.\n        \n2. **Persuasion/Negotiation** \u2013 Convince the caretaker that the hedgehogkoala\u2019s illness is tied to **greater spirit corruption**, and that aiding it is for the good of all.\n    \n3. **Alternative Quest** \u2013 The caretaker says:  \n    _\u201cBring proof of your compassion. A corrupted vine spreads on the far cliffside. If you can cleanse it, I\u2019ll grant you a Spiritberry.\u201d_\n    \n\n---\n\n## Outcome\n\n- If successful, the party receives **1 Spiritberry Cluster** (3 berries).\n    \n- Feeding them to Spikeberry restores its health, sweetness, and cheer. Its berries are once again nourishing.\n    \n- The Air Nomad family gifts the party a small carved airbender pendant: _\u201cSo you\u2019ll remember us when the winds shift paths again.\u201d_\n    \n\n---\n\n## Rewards\n\n- **Spiritberry (Consumable)**:\n    \n    - Eat \u2192 Heal moderate HP + remove one level of spiritual corruption/fatigue.\n        \n    - Feed to spirit-animal \u2192 Revitalizes it, calming agitation or illness.\n        \n- Reputation with Stonegrove \u2192 The group may return later for training in resonance-based earthbending."}, "Dms Root/Story/Airbender Nomands/3atljldbkbk41.jpg": {"size": 1489609, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/Story/Airbender Nomands/Floating rocks of Baraduna.md": {"size": 4560, "type": "text", "text": "The village of the Spidermonkeys\n### Adventure: \n\n#### Setting: The Floating Island of the Nomadic Airbenders\n\nThe players find themselves in a dense forest, where an entire floating island has landed momentarily. This island belongs to a nomadic airbending tribe that has perfected a unique bending style called **Silkbending**, inspired by their deep bond with the Spiderlemurs.\n\n#### The Spiderlemurs\n\nA rare species found only in this part of the world, Spiderlemurs have the body of a lemur but with four arms, four legs, and a long prehensile tail. Their heads resemble spiders, complete with multiple eyes and small mandibles. They produce powerful silk from each of their appendages, which they use to glide alongside the airbenders, creating parachutes they manipulate through airbending. Their silk is also essential for the tribe, used for clothing, rope, and even structural supports for their floating homes.\n\nThe Spiderlemurs assist in keeping the floating island airborne. By gripping the island with their mandibles and spinning silk into large wind-catching sails, they create natural updrafts, allowing the airbenders to maintain their high-altitude lifestyle.\n\n#### The Floating Island Tribe\n\nThis nomadic tribe typically resides in a hidden valley where a natural updraft allows them to sustain their floating home. They only descend when necessary, usually for trade or in emergencies. Their culture revolves around **Silkbending**, a refined form of airbending that incorporates Spiderlemur silk into their movements.\n\n##### Culture & Traditions\n\n- **Silkbending**: A technique unique to this tribe, combining airbending with the manipulation of Spiderlemur silk. Masters can use it to create silk whips, nets, and even glider-like wings.\n    \n- **Self-Sufficiency**: The tribe cultivates special crops adapted to high-altitude life. Their clothing is woven from Spiderlemur silk, making it lightweight yet incredibly durable.\n    \n- **Ceremonial Bonding**: Each child of the tribe bonds with a Spiderlemur from birth, forming a lifelong partnership.\n    \n\n#### The Threat: The Corrupted Spiderlemur Spirit\n\nA young Spiderlemur has been corrupted by dark spiritual energy, transforming into a monstrous creature with a grotesquely large monkey-like head filled with razor-sharp teeth. Its body is now entirely that of a spider, with long, sharp legs and a bloated abdomen leaking dark silk.\n\n##### Corrupted Spiderlemur (Dark Spirit)\n\n**Type**: Dark Spirit Creature (Corrupted Beast)\n\n**HP**: High  \n**Armor**: Medium (Silk-reinforced exoskeleton)\n\n**Abilities**:\n\n- **Silk Barrage**: Fires multiple strands of razor-sharp silk at enemies, restraining and cutting them.\n    \n- **Parasitic Weave**: Can attach dark silk to a target, slowly draining their energy while strengthening itself.\n    \n- **Silk Puppet Master**: Uses tendrils of silk to control other Spiderlemurs, forcing them to fight against the players.\n    \n- **Shadowed Updraft**: Manipulates air currents and silk parachutes to move unpredictably, making it hard to hit.\n    \n- **Venomous Bite**: Delivers a spirit-poison that clouds the mind, causing hallucinations and fear.\n    \n- **Dark Ascension**: If weakened, the spirit attempts to retreat into the spirit world, requiring the players to perform a purification ritual to prevent its return.\n    \n\n#### Adventure Goals\n\n- **Discover the Floating Island**: The players must navigate the forest and befriend the nomadic tribe.\n    \n- **Understand Silkbending**: Learning about the Spiderlemurs and the tribe's unique abilities may grant temporary Silkbending techniques.\n    \n- **Fight the Corrupted Spiderlemur**: The players must defeat or purify the creature before it corrupts the other Spiderlemurs and endangers the island.\n    \n- **Protect the Floating Island**: The battle could disrupt the delicate updraft balance, forcing players to use creative airbending or Silkbending to keep the island afloat.\n    \n\n#### Possible Rewards\n\n- **Silkbender\u2019s Cloak**: A lightweight but durable cloak woven from Spiderlemur silk, enhancing agility and stealth.\n    \n- **Silkglider Bracers**: Wristbands that generate small silk wings, allowing for short bursts of controlled gliding.\n    \n- **Spiderlemur Ally**: If the players handle the situation well, they may gain a Spiderlemur companion or a future alliance with the tribe.\n    \n\n---\n\nThis adventure introduces a unique airbending culture, a powerful corrupted foe, and creative bending techniques, encouraging both combat and problem-solving elements in the game."}, "Dms Root/Story/Airbender Nomands/The Nomadic Airbenders and the Spiderlemurs.md": {"size": 0, "type": "text", "text": ""}, "Dms Root/Story/Airbender Nomands/1664411181325.jpg": {"size": 112056, "type": "large", "note": "file too large to embed in static snapshot"}, "Dms Root/Story/Modules/Modules.md": {"size": 182, "type": "text", "text": "Overview of the purpose of the #Modules folder, including guidelines on how to scale the modules based on the party's power level and integrate them into the main campaign.\n\n#Modules"}, "Dms Root/Story/Modules/World Exploration/Wilderness_Encounters.md": {"size": 67, "type": "text", "text": "Random encounter tables for traveling through uncharted wilderness."}, "Dms Root/Story/Modules/World Exploration/Remote_Temples.md": {"size": 79, "type": "text", "text": "Exploring an Air Nomad temple with traps, lore, and possible combat encounters."}, "Dms Root/Story/Modules/Adventure Hooks/Lost_Relic.md": {"size": 95, "type": "text", "text": "The party must find a lost Air Nomad relic. Options for clues, red herrings, and NPCs involved."}, "Dms Root/Story/Modules/Adventure Hooks/Bandit_Ambush.md": {"size": 128, "type": "text", "text": "A session where the party is ambushed by bandits. Includes a scalable encounter table and potential motivations for the bandits."}, "Dms Root/Story/Modules/Social Encounters/Marketplace_Drama.md": {"size": 114, "type": "text", "text": "The party witnesses a dispute in a busy marketplace and can choose to mediate, escalate, or exploit the situation."}, "Dms Root/Story/Modules/Social Encounters/Skybison_Polo_Festival.md": {"size": 4207, "type": "text", "text": "\n# Skybison Polo Festival Extravaganza\n\n## Overview\nThe Skybison Polo Festival is an annual event held in the Air Nomad territories, combining thrilling competitions, festive games, and a cultural celebration of the bond between Air Nomads and their beloved skybison. This module introduces the players to the festival, offering opportunities for interaction, skill challenges, and intrigue.\n\n---\n\n## Key Locations\n### The Festival Grounds\n- A large, open area with colorful tents, food stalls, and stages for musical performances.\n- Games and activities like skybison rides, airbending obstacle courses, and market stalls selling unique wares.\n\n### The Polo Arena\n- The centerpiece of the festival, with a massive circular arena designed for skybison polo.\n- Spectators sit in tiered seating, cheering loudly as teams compete.\n\n### The Betting Tent\n- A lively hub where festival-goers can place bets on their favorite teams or players.\n- Operated by a charismatic Air Nomad known as **Garo the Gamester**.\n\n### The Stables\n- A quieter area where the competing skybison are cared for.\n- Players might meet the skybison caretakers or sneak around to uncover secrets.\n\n---\n\n## Key NPCs\n### Master Tenzho\n- An elder Air Nomad and referee of the polo matches. Wise but with a mischievous sense of humor.\n- Knows much about the history of skybison polo.\n\n### Garo the Gamester\n- A charming and slightly shady Air Nomad who runs the betting tent.\n- Always looking for a way to turn a profit, possibly at the expense of honesty.\n\n### Team Azure Wings\n- A team of young, brash Air Nomads eager to prove their skills.\n- Might invite the players to join their team if they need extra members.\n\n### Team Sky Soarers\n- The reigning champions, led by the confident **Kani Windstride**.\n- They are skilled but harbor a secret\u2014they may be cheating to maintain their streak.\n\n### Ravi the Snack Vendor\n- A jovial vendor selling skybison-themed snacks.\n- Often hears interesting gossip from festival-goers.\n\n---\n\n## Module Hooks\n- **An Invitation to Compete:** A friendly Air Nomad approaches the players and invites them to join Team Azure Wings, either as players or strategists.\n- **Suspicious Activity:** Players overhear rumors of Team Sky Soarers cheating. They can investigate by talking to NPCs, sneaking into the stables, or tracking unusual behavior.\n- **High-Stakes Betting:** Garo the Gamester offers the players a deal to rig a match or uncover potential rigging by others.\n- **Festival Trouble:** A rogue skybison causes chaos, giving players a chance to save festival-goers and show their skills.\n\n---\n\n## Key Activities and Challenges\n### Skybison Polo Match\n- A dynamic game where players use bending abilities or athletic prowess to assist their team in scoring goals.\n- Structured as a series of skill challenges, with opportunities for creativity and teamwork.\n\n### Betting and Investigation\n- Players can place bets, investigate odds, or catch cheaters in the act.\n- Success depends on Insight, Persuasion, and Stealth rolls.\n\n### Festival Games\n- Airbending obstacle courses, pie-eating contests, and skybison riding challenges offer chances for fun and minor rewards.\n\n### The Final Match\n- If the players participate in or interfere with the final match, it\u2019s a climactic scene with high stakes.\n- The outcome affects the players' reputation among the Air Nomads.\n\n---\n\n## Complications and Twists\n- **Cheating Exposed:** If the players expose Team Sky Soarers\u2019 cheating, the festival becomes tense, and the players must help restore fairness.\n- **Skybison Stampede:** Midway through the festival, a group of frightened skybison rampages through the grounds, requiring quick [[Action]] to protect the crowd.\n- **A Mysterious Stranger:** An enigmatic figure offers the players a chance to sabotage the match for a hefty reward, creating a moral dilemma.\n\n---\n\n## Rewards\n- **Air Nomad Artifacts:** Unique trinkets and gear, such as a **Skybison Whistle** or a **Windcatcher Cloak**.\n- **Favor of the Air Nomads:** Unlock access to future Air Nomad storylines or resources.\n- **Reputation and Renown:** Gain prestige among festival-goers or uncover secrets tied to the Air Nomads\u2019 history.\n    "}, "Dms Root/Story/Modules/Social Encounters/Bandit_Negotiation.md": {"size": 118, "type": "text", "text": "Options for resolving a bandit encounter through dialogue, including persuasion challenges and NPC personality traits."}, "Dms Root/Story/Modules/Mysteries/Marketplace_Clues.md": {"size": 74, "type": "text", "text": "Clues uncovered in a marketplace dispute that lead to a larger conspiracy."}, "Dms Root/Story/Modules/Mysteries/Relic_Discovery.md": {"size": 86, "type": "text", "text": "A scavenger hunt for an ancient artifact, with puzzles and conflicting NPC objectives."}, "Dms Root/Story/Modules/Earth Kindom Templates/Combat_Challenge_Template.md": {"size": 60, "type": "text", "text": "A reusable template for creating scalable combat challenges."}, "Dms Root/Story/Modules/Earth Kindom Templates/Social_Encounter_Template.md": {"size": 68, "type": "text", "text": "A reusable template for crafting social or dialogue-heavy scenarios."}, "Dms Root/Story/Modules/Module Templates 1/Earthbending_Challenge_Template.md": {"size": 75, "type": "text", "text": "A reusable template for creating Earthbending-based puzzles and challenges."}, "Dms Root/Story/Modules/Module Templates 1/Political_Scenario_Template.md": {"size": 63, "type": "text", "text": "A reusable template for designing political intrigue scenarios."}, "Dms Root/Story/Modules/Combat Challenges/Wild_Beast.md": {"size": 113, "type": "text", "text": "A beast attack on a village, with rules for scaling the beast\u2019s strength and integrating environmental hazards."}, "Dms Root/Story/Modules/Combat Challenges/Bandit_Encounter.md": {"size": 104, "type": "text", "text": "Detailed mechanics for a combat scenario with bandits, including scalable stats and optional objectives."}};

// Normalize helper: accept either 'Player Root/...' or relative paths
function _normPath(p){
    if(!p && p!=="") return "";
    p = String(p || "");
    if(/^Player Root\//i.test(p)) p = p.replace(/^Player Root\//i, "");
    return p.replace(/^\/+|\/+$/g, "");
}

// Build a lightweight folder view from MANIFEST for the given relative path.
async function static_fetchPath(p){
    const rel = _normPath(p);
    const entriesMap = Object.create(null);
    for(const k of Object.keys(MANIFEST)){
        const key = k.replace(/^\/+/,"");
        if(!rel){
            // top-level: take first segment
            const seg = key.split('/')[0];
            entriesMap[seg] = entriesMap[seg] || { name: seg, path: seg, type: 'dir' };
            // if key has no slash, it's a file at top-level
            if(key.indexOf('/')===-1){
                entriesMap[seg] = { name: seg, path: seg, type: 'file' };
            }
        } else {
            if(key === rel) {
                const name = rel.split('/').pop();
                entriesMap[name] = { name, path: rel, type: 'file' };
            } else if(key.startsWith(rel + '/')){
                const rest = key.slice((rel + '/').length);
                const first = rest.split('/')[0];
                const isDir = rest.indexOf('/') !== -1;
                if(isDir){
                    entriesMap[first] = entriesMap[first] || { name: first, path: (rel? rel + '/'+ first: first), type: 'dir' };
                } else {
                    entriesMap[first] = { name: first, path: (rel? rel + '/'+ first: first), type: 'file' };
                }
            }
        }
    }
    const entries = Object.keys(entriesMap).sort().map(k=>entriesMap[k]);
    return { path: (rel? 'Player Root/' + rel : 'Player Root'), entries };
}

async function static_fetchPathWithHash(p){
    const rel = _normPath(p);
    const key = rel;
    if(MANIFEST[key] && MANIFEST[key].type === 'text'){
        return { json: { content: MANIFEST[key].text }, hash: null };
    }
    return { json: { content: '' }, hash: null };
}

async function static_resolveHtmlUrl(seg){
    if(!seg) return null;
    return '/' + seg.replace(/^\/+/, '');
}

// Helper to remove the 'new-file' input and Create button from the
// static view since those require a backend.
function removeCreateControls(){
    try{
        const entriesWrap = document.getElementById('entries-wrap');
        if(!entriesWrap) return;
        // remove input containers that look like the new-file control
        const inputs = entriesWrap.querySelectorAll('input[placeholder]');
        inputs.forEach(inp=>{
            const ph = (inp.getAttribute('placeholder')||'').toLowerCase();
            if(ph.indexOf('new-file')!==-1){
                const parent = inp.closest('div');
                if(parent && entriesWrap.contains(parent)) parent.remove();
            }
        });
        // hide any Create buttons inside entriesWrap
        const createBtns = Array.from(entriesWrap.querySelectorAll('button'));
        createBtns.forEach(btn=>{
            if((btn.textContent||'').trim().toLowerCase()==='create'){
                btn.disabled = true;
                btn.style.display = 'none';
            }
        });
    }catch(e){}
}

// If the original frontend defines fetchPath/renderDir later in
// its script, patch them when they appear so our static helpers
// are used. We poll briefly for the original functions and then
// replace them with wrappers that prefer static_* implementations.
(function(){
    let attempts = 0;
    const maxAttempts = 100; // ~5 seconds at 50ms interval
    const iv = setInterval(()=>{
        attempts++;
        const hasFetch = typeof window.fetchPath === 'function';
        const hasRender = typeof window.renderDir === 'function';
        if(hasFetch){
            try{
                const origFetchPath = window.fetchPath;
                const origFetchPathWithHash = window.fetchPathWithHash;
                window.fetchPath = async function(p){
                    try{
                        return await static_fetchPath(p);
                    }catch(e){
                        try{ return await origFetchPath(p); }catch(e2){ throw e; }
                    }
                };
                window.fetchPathWithHash = async function(p){
                    try{
                        return await static_fetchPathWithHash(p);
                    }catch(e){
                        try{ return await origFetchPathWithHash(p); }catch(e2){ throw e; }
                    }
                };
            }catch(e){/*ignore*/}
        }
        if(hasRender){
            try{
                // If renderDir exists, call it once to ensure the UI
                // initializes using our patched fetchPath.
                try{ window.renderDir(''); }catch(e){}
                clearInterval(iv);
                return;
            }catch(e){}
        }
        if(attempts>maxAttempts){
            clearInterval(iv);
        }
    }, 50);
})();

// Replace runtime functions after the original script has loaded.
window.addEventListener('DOMContentLoaded', ()=>{
    try{
        window.fetchPath = static_fetchPath;
        window.fetchPathWithHash = static_fetchPathWithHash;
        window.resolveHtmlUrl = static_resolveHtmlUrl;
    }catch(e){console.warn('Failed to override fetchPath for static view', e)}

    // Disable editing controls by id to make them visible but greyed out
    const disabledIds = ['save-btn','delete-btn','graphs-btn','pin-btn','up-btn','fullscreen-btn','open-raw','refresh-btn'];
    for(const id of disabledIds){
        const el = document.getElementById(id);
        if(el) el.disabled = true;
    }

    try{ if(typeof renderDir === 'function') renderDir(''); }catch(e){}
    try{ if(typeof removeCreateControls === 'function') removeCreateControls(); }catch(e){}
});

// Also patch the global fetch() so that calls to backend
// endpoints like /player_root/... succeed when opened via
// file:///. We only intercept the specific backend paths
// used by the frontend and fall back to the original fetch.
(function(){
    const _origFetch = window.fetch.bind(window);
    window.fetch = async function(input, init){
        try{
            const url = (typeof input === 'string') ? input : (input && input.url) || '';
            // handle player_root API calls
            const m = url.match(/[\/]player_root\/?(.*)$/);
            if(m){
                const seg = decodeURIComponent((m[1]||'').replace(/^\/+/, ''));
                // renderDir and other callers use endpoints like /player_root/<seg>
                // Build a JSON response object similar to server's API
                const rel = seg || '';
                const data = await static_fetchPath(rel);
                return new Response(JSON.stringify(data), { status: 200, headers: { 'Content-Type': 'application/json' } });
            }
            // some calls use /player_root/search or other endpoints; handle basic ones
            if(url.indexOf('/player_root/search') !== -1){
                return new Response(JSON.stringify({ results: [] }), { status: 200, headers: { 'Content-Type': 'application/json' } });
            }
            // otherwise fall back to original fetch (which may fail under file://)
            return _origFetch(input, init);
        }catch(e){
            return new Response(JSON.stringify({ error: String(e) }), { status: 500, headers: { 'Content-Type': 'application/json' } });
        }
    };
})();

          .replace(/&/g, "&amp;")

      // Async hash helper: returns a hex SHA-256 when possible, otherwise a deterministic fallback hex string.
      async function hashText(s) {
        s = String(s || "");
        try {
          if (window.crypto && crypto.subtle && crypto.subtle.digest) {
            const enc = new TextEncoder();
            const buf = await crypto.subtle.digest("SHA-256", enc.encode(s));

              .map((b) => b.toString(16).padStart(2, "0"))
              .join("");

        } catch (e) {
          console.warn("WebCrypto digest failed, falling back:", e);
        }
        // Fallback: simple non-crypto 32-bit rolling hash expanded to 64 hex chars
        let h = 0;
        for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
        const hex = ("00000000" + h.toString(16)).slice(-8);
        return hex.repeat(8);

      // Centralized render helper so we can apply the same transformations
      // everywhere the preview is created. Returns sanitized HTML.
      function renderMarkdown(src) {
        const text = String(src || "");
        // Basic Obsidian-style wiki-link support: convert [[Name]] into an
        // inline anchor with a data-wikilink attribute so clicks can be
        // intercepted and routed inside the app rather than navigating.
        const withWikilinks = text.replace(/\[\[([^\]]+)\]\]/g, (m, name) => {
          const safe = String(name)
            .trim()
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
          return `<a href="#" class="wikilink" data-wikilink="${safe}">${safe}</a>`;

          try {
            const esc = (text || "")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/\"/g, "&quot;")
              .replace(/'/g, "&#39;");

              "<pre style='white-space:pre-wrap;'>" + esc + "</pre>"

        // Fallback: compact pure-JS SHA-256 implementation
        function rightRotate(n, x) {

        const K = [
          1116352408, 1899447441, 3049323471, 3921009573, 961987163, 1508970993,
          2453635748, 2870763221, 3624381080, 310598401, 607225278, 1426881987,
          1925078388, 2162078206, 2614888103, 3248222580, 3835390401,
          4022224774, 264347078, 604807628, 770255983, 1249150122, 1555081692,
          1996064986, 2554220882, 2821834349, 2952996808, 3210313671,
          3336571891, 3584528711, 113926993, 338241895, 666307205, 773529912,
          1294757372, 1396182291, 1695183700, 1986661051, 2177026350,
          2456956037, 2730485921, 2820302411, 3259730800, 3345764771,
          3516065817, 3600352804, 4094571909, 275423344, 430227734, 506948616,
          659060556, 883997877, 958139571, 1322822218, 1537002063, 1747873779,
          1955562222, 2024104815, 2227730452, 2361852424, 2428436474,
          2756734187, 3204031479, 3329325298,
        ];
        // convert to bytes (ASCII only safe); use UTF-8 encoding by converting code points
        const msg = unescape(encodeURIComponent(text));
        const ml = msg.length * 8;
        const words = [];
        for (let i = 0; i < msg.length; i++) {
          const c = msg.charCodeAt(i);
          const wordIndex = i >> 2;
          words[wordIndex] =
            (words[wordIndex] || 0) | (c << ((3 - (i % 4)) * 8));
        }
        // append padding
        const bitLenHi = Math.floor(ml / 0x100000000);
        const bitLenLo = ml >>> 0;
        // append 0x80 byte
        const idx = msg.length;
        const wi = idx >> 2;
        words[wi] = (words[wi] || 0) | (0x80 << ((3 - (idx % 4)) * 8));
        // pad with zeros until length ≡ 56 mod 64
        const totalWords = (((idx + 8) >> 6) + 1) * 16;
        words.length = totalWords;
        words[totalWords - 2] = bitLenHi;
        words[totalWords - 1] = bitLenLo;

        let H = [
          1779033703, 3144134277, 1013904242, 2773480762, 1359893119,
          2600822924, 528734635, 1541459225,
        ];

        for (let j = 0; j < words.length; j += 16) {
          const W = new Array(64);
          for (let t = 0; t < 16; t++) W[t] = words[j + t] >>> 0;

              (rightRotate(7, W[t - 15]) ^
                rightRotate(18, W[t - 15]) ^
                (W[t - 15] >>> 3)) >>>

              (rightRotate(17, W[t - 2]) ^
                rightRotate(19, W[t - 2]) ^
                (W[t - 2] >>> 10)) >>>

            b = H[1],
            c = H[2],
            d = H[3],

            f = H[5],

            f = e;

            c = b;

      // Generate a consistent, pastel HSL color for a repo node (path or id)
      // so UI elements can share the same colouring logic as the graph nodes.
      // Input: any string (path, name, id). Output: CSS HSL color string.
      function nodeColorForKey(key) {
        key = key || "";
        // Use the same hash helper to produce a hex sha256 string (fast JS fallback)
        // Prefer the WebCrypto-based hashText above when available.
        // Note: hashText returns a hex string.
        const make = async (k) => {
          try {
            const h = await hashText(k);
            return h || "";
          } catch (e) {
            // fallback: simple JS hash
            let h = 0;
            for (let i = 0; i < k.length; i++)
              h = (h * 31 + k.charCodeAt(i)) >>> 0;
            return ("00000000" + (h >>> 0).toString(16)).slice(-8) + "00000000";
          }

        // via a small non-blocking trick (we call hashText but don't await in some
        // faster code paths). For deterministic synchronous color we fall back to
        // a simple JS hash if hashText isn't available synchronously.
        // Here we'll generate a synchronous color from the string directly
        // (so callers can use it immediately). This mirrors the same distribution
        // as the sha-based approach well enough for UI colouring.
        let syncHash = 0;
        for (let i = 0; i < key.length; i++)
          syncHash = (syncHash * 31 + key.charCodeAt(i)) >>> 0;
        const h = syncHash % 360;
        // pick a pleasant pastel saturation/lightness tuned for backgrounds
        const s = 38 + ((syncHash >> 8) % 10); // 38-47%
        const l = 90 - ((syncHash >> 16) % 6); // 90-85%
        return `hsl(${h} ${s}% ${l}%)`;

      // Adjust HSL lightness in strings like 'hsl(H S% L%)'. delta is in percent points.

          /hsl\s*\(\s*([0-9.]+)\s+([0-9.]+)%\s+([0-9.]+)%\s*\)/i
        );
        if (!m) return hslStr;
        const h = m[1];
        const s = m[2];
        let l = parseFloat(m[3]);
        l = Math.max(0, Math.min(100, l + delta));
        return `hsl(${h} ${s}% ${l}%)`;
      }

      // showNotif now accepts optional actions: [{label: 'Undo', cb: ()=>{}}]
