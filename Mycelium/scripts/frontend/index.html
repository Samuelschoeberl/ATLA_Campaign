<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mycelium — Repo Browser</title>
    <!-- Favicons: prefer the repo logo; fall back to other common locations -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/Mycelium/Mycelium Logo.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/Mycelium/Mycelium Logo.png"
    />
    <link rel="shortcut icon" href="/Mycelium/Mycelium Logo.png" />
    <!-- Additional fallbacks (server will decode percent-encodings) -->
    <link rel="icon" href="/Mycelium/Logo.png" />
    <link rel="icon" href="/Logo.png" />
    <meta name="theme-color" content="#0b0f13" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.0/dist/purify.min.js"></script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: system-ui, Arial, sans-serif;
        color: #111;
        min-height: 100%;
        padding: 24px;
        position: relative;
        /* darker base underneath the pastel swirl */
        background: #0b0f13;
        overflow-x: hidden;
      }
      /* animated conic (swirl) background */
      body::before {
        content: "";
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        /* put the swirl above the page background but behind the UI */
        z-index: 0;
        /* wider, gentler color range for a slow, lush swirl */
        /* desaturated pastel palette, static (no animation) */
        background: conic-gradient(
          from 90deg at 50% 50%,
          #f2dfe7 0deg,
          #f7e5d0 60deg,
          #fff6c8 120deg,
          #d8eedd 180deg,
          #d9ecf8 240deg,
          #e6ddf6 300deg,
          #f3dbe3 360deg
        );
        filter: blur(64px) saturate(110%);
        opacity: 0.6;
        transform-origin: 50% 50%;
        /* static: no animation so the swirl does not move */
        animation: none;
      }
      body::after {
        content: "";
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        /* subtle radial highlight above the swirl */
        z-index: 1;
        pointer-events: none;
        /* much more subtle highlight so overall look stays darker */
        background: radial-gradient(
          circle at 50% 50%,
          rgba(255, 255, 255, 0.06) 0%,
          rgba(255, 255, 255, 0) 45%
        );
      }
      /* static background: keyframes and pulse animation removed */

      .app {
        max-width: 1200px;
        margin: 0 auto;
        /* slightly more transparent so the subtle pastel shows through */
        background: rgba(171, 171, 171, 0.92);
        border-radius: 8px;
        padding: 18px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
        /* ensure UI sits above the swirl layers */
        position: relative;
        z-index: 2;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      h1 {
        margin: 0;
        font-size: 1.4rem;
      }
      .muted {
        color: #666;
        font-size: 0.9rem;
      }
      nav {
        margin-top: 12px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      ul.entries {
        list-style: none;
        padding: 0;
        margin: 12px 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      ul.entries li {
        background: #eeeded;
        border: 1px solid #000000;
        padding: 8px 10px;
        border-radius: 6px;
      }
      /* special styling for links that point to .html pages (static exports) */
      ul.entries li a.html-link {
        background: linear-gradient(180deg, #fff7e6, #fff0d1);
        color: #7a3b00;
        padding: 6px 8px;
        border-radius: 4px;
        text-decoration: underline;
      }
      /* small external icon after html links and tooltip support */
      ul.entries li a.html-link::after {
        content: " \2197"; /* north east arrow ↗ */
        font-size: 0.85em;
        margin-left: 6px;
        opacity: 0.9;
      }
      ul.entries li a.html-link[title] {
        cursor: pointer;
      }
      .md-container {
        margin-top: 18px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .markdown-file {
        border: 1px solid #e6e6e6;
        background: #c3c3c3;
        padding: 12px;
        border-radius: 6px;
      }
      /* Make markdown-rendered tables show clear cell borders in previews */
      .markdown-file table {
        border-collapse: collapse;
        width: 100%;
        margin: 8px 0;
        background: white;
      }
      .markdown-file table,
      .markdown-file table th,
      .markdown-file table td {
        border: 1px solid #999;
      }
      .markdown-file table th,
      .markdown-file table td {
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
      }
      .markdown-file table th {
        background: #ececec;
        font-weight: 600;
      }
      /* cells slightly darker than the markdown card background */
      .markdown-file table td {
        background: #bfbfbf;
      }
      .file-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .file-meta {
        color: #777;
        font-size: 0.85rem;
      }
      #notif-area {
        position: fixed;
        right: 18px;
        top: 18px;
        z-index: 9999;
        pointer-events: none;
      }
      /* Persistent right-edge event log */
      /* minimized by default: show a compact strip with last message and control */
      #event-log {
        position: fixed;
        right: 12px;
        bottom: 12px;
        height: 56px;
        width: 320px;
        max-width: 40vw;
        background: linear-gradient(
          180deg,
          rgba(245, 240, 255, 0.98),
          rgba(240, 250, 244, 0.98)
        );
        border: 1px solid rgba(120, 120, 130, 0.12);
        box-shadow: 0 10px 30px rgba(8, 10, 14, 0.16);
        z-index: 100000;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px;
        font-size: 13px;
        transition: all 220ms ease;
        border-radius: 12px;
        overflow: hidden;
      }
      #event-log.expanded {
        right: 0;
        top: 0;
        bottom: 0;
        height: 100%;
        width: 360px;
        max-width: 40vw;
        border-left: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 0;
      }
      @media (max-width: 760px) {
        #event-log {
          width: 220px;
        }
        #event-log.expanded {
          width: 100%;
          left: 0;
          right: 0;
        }
      }
      #event-log .log-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      #event-log .log-body {
        overflow: auto;
        flex: 1;
        padding-right: 6px;
      }
      #event-log .compact {
        display: flex;
        align-items: center;
        gap: 8px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #event-log .compact .compact-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 220px;
      }
      #event-log .event-entry {
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 10px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.96),
          rgba(250, 248, 252, 0.98)
        );
        box-shadow: 0 8px 20px rgba(10, 12, 18, 0.08);
      }
      #event-log .event-entry .ts {
        color: #4a5568; /* darker muted */
        font-size: 11px;
        margin-bottom: 6px;
      }
      /* darker pastel tones */
      #event-log .event-entry.info {
        border-left: 6px solid #7fb3ff; /* pastel blue */
        background: linear-gradient(
          180deg,
          rgba(243, 249, 255, 0.98),
          rgba(235, 244, 255, 0.98)
        );
      }
      #event-log .event-entry.warn {
        border-left: 6px solid #f4c36b; /* pastel amber */
        background: linear-gradient(
          180deg,
          rgba(255, 250, 242, 0.98),
          rgba(255, 245, 232, 0.98)
        );
      }
      #event-log .event-entry.error {
        border-left: 6px solid #f28fa1; /* pastel rose */
        background: linear-gradient(
          180deg,
          rgba(255, 243, 245, 0.98),
          rgba(255, 238, 241, 0.98)
        );
      }
      #event-log .compact .compact-text {
        color: #2f3a44;
      }
      #event-log .event-actions {
        display: flex;
        gap: 6px;
      }
      #event-log button {
        cursor: pointer;
      }
      /* Mobile-friendly edits */
      @media (max-width: 640px) {
        .markdown-file textarea {
          font-size: 18px;
          line-height: 1.5;
          padding: 12px;
        }
        .markdown-file .file-title button {
          font-size: 15px;
          padding: 8px 10px;
        }
        .app {
          padding: 12px;
        }
      }

      /* Fullscreen editor state */
      .markdown-file.is-fullscreen {
        position: fixed;
        inset: 0;
        z-index: 99990;
        margin: 0;
        border-radius: 0;
        padding: 12px;
        background: #fff;
        display: flex;
        flex-direction: column;
      }
      .markdown-file.is-fullscreen #file-title-name {
        font-size: 1.1rem;
      }
      .markdown-file.is-fullscreen textarea {
        position: absolute;
        top: 56px;
        left: 12px;
        right: 12px;
        bottom: 12px;
        width: auto;
        height: auto;
        border-radius: 6px;
        font-size: 18px;
      }
      .markdown-file.is-fullscreen #preview {
        display: none;
      }
      .fullscreen-close {
        display: inline-block;
        margin-left: 8px;
      }
      /* Busy overlay shown while long-running operations execute (e.g., Wikigraphs) */
      #busy-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 100001;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
      }
      #busy-overlay .busy-card {
        background: rgba(255, 255, 255, 0.98);
        color: #000;
        padding: 18px 22px;
        border-radius: 10px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        display: flex;
        gap: 12px;
        align-items: center;
      }
      /* simple spinner */
      .spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 4px solid rgba(0, 0, 0, 0.08);
        border-top-color: #4a86d6; /* pastel blue */
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Log line styling inside the busy overlay */
      #generator-log .log-line {
        display: block;
        white-space: pre-wrap;
      }
      #generator-log .log-info {
        color: #111;
      }
      #generator-log .log-error {
        color: #d45a6b; /* pastel rose */
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="app" class="app">
      <header>
        <div style="display: flex; align-items: center; gap: 12px">
          <!-- Repository logo: uses the file at Mycelium/Mycelium Logo.png (URL-encoded) -->
          <img
            id="repo-logo"
            src="/Mycelium/Mycelium Logo.png"
            alt="Mycelium"
            onerror="(function(img){img.onerror=null;var tries=['/Mycelium/Mycelium Logo.png','/Mycelium%20Logo.png','/Mycelium/Logo.png','/Logo.png'];for(var i=0;i<tries.length;i++){try{var u=tries[i];if(img.src.indexOf(u)===-1){img.src=u;return}}catch(e){}}})(this)"
            style="
              width: 40px;
              height: 40px;
              border-radius: 6px;
              object-fit: cover;
              border: 1px solid rgba(0, 0, 0, 0.06);
            "
          />
          <div>
            <h1 style="margin: 0">Mycelium — Repo Browser</h1>
            <div class="muted" style="margin-top: 2px">
              &nbsp;&middot;&nbsp; Player Root
            </div>
          </div>
        </div>
      </header>

      <nav>
        <div class="back"><button id="up-btn" disabled>Up</button></div>
        <div><button id="deleted-btn">Deleted</button></div>
        <div>
          <button
            id="graphs-btn"
            title="Create or update wikigraph visualizations for this folder"
          >
            Create/Update graphs
          </button>
        </div>
        <div><button id="pin-btn">Pin</button></div>
        <div
          id="pinned-list"
          style="display: flex; gap: 6px; align-items: center"
        ></div>
        <div class="muted">Current: /<span id="curpath"></span></div>
      </nav>

      <!-- Search bar -->
      <div
        style="margin-top: 12px; display: flex; gap: 8px; align-items: center"
      >
        <input
          id="search-input"
          placeholder="Search files and contents... (type to search)"
          style="
            flex: 1;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
          "
        />
        <button id="search-clear">Clear</button>
      </div>

      <section id="search-results" style="margin-top: 12px; display: none">
        <!-- search results injected here -->
      </section>

      <!-- debug panel removed -->

      <section id="entries-wrap">
        <!-- entries list will be injected here -->
      </section>

      <div class="md-container" id="md-container">
        <!-- md previews / editors injected here -->
      </div>
    </div>

    <div id="notif-area"></div>
    <!-- Persistent right-edge event log (minimized by default) -->
    <div id="event-log" aria-live="polite" aria-atomic="false" class="">
      <div class="log-header">
        <strong>Event log</strong>
        <div style="display: flex; align-items: center; gap: 8px">
          <!-- Search/filters are only visible in expanded mode -->
          <div
            id="event-log-controls"
            style="display: none; align-items: center; gap: 8px"
          >
            <input
              id="event-log-search"
              placeholder="Search"
              style="
                padding: 6px;
                border-radius: 6px;
                border: 1px solid rgba(0, 0, 0, 0.06);
                font-size: 12px;
              "
            />
            <!-- Only a debug toggle is needed: everything that's not a top-level notification goes to the debug channel -->
            <label style="font-size: 12px"
              ><input type="checkbox" id="filter-debug" /> Debug</label
            >
            <div class="log-controls">
              <button id="clear-log">Clear</button>
            </div>
          </div>
          <div class="compact-controls">
            <button id="toggle-log" title="Expand log">▢</button>
          </div>
        </div>
      </div>
      <div
        class="compact"
        id="event-log-compact"
        style="display: flex; flex-direction: column; gap: 4px; margin-top: 4px"
      >
        <!-- compact will show the last two messages (title: first line) -->
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div
            class="compact-item"
            id="event-log-compact-item-0"
            style="font-size: 12px; color: #444"
          >
            No events
          </div>
          <div
            class="compact-item"
            id="event-log-compact-item-1"
            style="font-size: 12px; color: #666; opacity: 0.9"
          >
            &nbsp;
          </div>
        </div>
      </div>
      <div class="log-body" id="event-log-body" style="display: none"></div>
    </div>
    <!-- Busy overlay blocks UI during long-running operations -->
    <div id="busy-overlay" aria-hidden="true">
      <div class="busy-card">
        <div class="spinner" aria-hidden="true"></div>
        <div
          style="
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 360px;
            max-width: 80vw;
          "
        >
          <div style="display: flex; align-items: center; gap: 12px">
            <strong>Working</strong>
            <div class="muted">Running generator — please wait</div>
          </div>
          <div style="font-size: 13px; color: #333">
            <div style="margin-bottom: 6px"><strong>Live logs</strong></div>
            <pre
              id="generator-log"
              style="
                background: #f6f6f6;
                padding: 8px;
                border-radius: 6px;
                max-height: 240px;
                overflow: auto;
                white-space: pre-wrap;
                color: #000;
                margin: 0;
                font-size: 12px;
              "
            ></pre>
          </div>
        </div>
      </div>
    </div>
    <!-- error overlay (hidden until a runtime error occurs) -->
    <div
      id="error-overlay"
      style="
        display: none;
        position: fixed;
        inset: 12px;
        z-index: 100000;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 18px;
        border-radius: 8px;
        overflow: auto;
        max-height: 80%;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
      "
    >
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 12px;
          margin-bottom: 8px;
        "
      >
        <strong>Client error</strong>
        <button
          id="error-overlay-close"
          style="
            background: #fff;
            color: #000;
            border: 0;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
          "
        >
          Close
        </button>
      </div>
      <pre
        id="error-overlay-text"
        style="white-space: pre-wrap; color: #fff; margin: 0; font-size: 13px"
      ></pre>
    </div>

    <script>
      // If the page was loaded from the local server, use the same host:port for backend
      // prefer an explicit override, otherwise use the same origin that served the frontend
      const BASE = (
        window.MYCELIUM_BACKEND_BASE || `${location.protocol}//${location.host}`
      ).replace(/\/$/, "");

      // Configure marked for Obsidian-like markdown behaviour:
      // - enable GFM so common GitHub/Obsidian constructs are parsed
      // - treat single line breaks as hard breaks (Obsidian's "wrapping" behaviour)
      // - disable header id mangling so headings remain predictable
      // - disable automatic email/URL mangling which Obsidian doesn't do
      try {
        marked.setOptions({
          gfm: true,
          breaks: true,
          headerIds: false,
          mangle: false,
          smartLists: true,
          smartypants: false,
        });
      } catch (e) {
        console.warn("marked.setOptions failed", e);
      }

      // Small DOM helpers used across the script
      function create(tag, props) {
        const el = document.createElement(tag || "div");
        if (props && typeof props === "object") {
          for (const k of Object.keys(props)) {
            if (k === "style" && typeof props[k] === "string")
              el.style.cssText = props[k];
            else if (k === "dataset" && typeof props[k] === "object")
              Object.assign(el.dataset, props[k]);
            else if (k in el) el[k] = props[k];
            else el.setAttribute(k, props[k]);
          }
        }
        return el;
      }

      // Small $ helper: $('#id') -> element by id, $('[selector]') -> querySelector
      function $(sel) {
        if (!sel) return null;
        // If selector looks like an id (#foo) or a simple id without #, prefer getElementById
        try {
          if (typeof sel === "string") {
            if (sel[0] === "#") return document.getElementById(sel.slice(1));
            // bare identifier without spaces/slashes: treat as id
            if (!/[\s.#>~:\[\]]/.test(sel)) return document.getElementById(sel);
            return document.querySelector(sel);
          }
        } catch (e) {
          try {
            return document.querySelector(sel);
          } catch (e2) {
            return null;
          }
        }
        return null;
      }

      function escapeHtml(s) {
        if (s == null) return "";
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      // Async hash helper: returns a hex SHA-256 when possible, otherwise a deterministic fallback hex string.
      async function hashText(s) {
        s = String(s || "");
        try {
          if (window.crypto && crypto.subtle && crypto.subtle.digest) {
            const enc = new TextEncoder();
            const buf = await crypto.subtle.digest("SHA-256", enc.encode(s));
            return Array.from(new Uint8Array(buf))
              .map((b) => b.toString(16).padStart(2, "0"))
              .join("");
          }
        } catch (e) {
          console.warn("WebCrypto digest failed, falling back:", e);
        }
        // Fallback: simple non-crypto 32-bit rolling hash expanded to 64 hex chars
        let h = 0;
        for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
        const hex = ("00000000" + h.toString(16)).slice(-8);
        return hex.repeat(8);
      }

      // Centralized render helper so we can apply the same transformations
      // everywhere the preview is created. Returns sanitized HTML.
      function renderMarkdown(src) {
        const text = String(src || "");
        // Basic Obsidian-style wiki-link support: convert [[Name]] into an
        // inline anchor with a data-wikilink attribute so clicks can be
        // intercepted and routed inside the app rather than navigating.
        const withWikilinks = text.replace(/\[\[([^\]]+)\]\]/g, (m, name) => {
          const safe = String(name)
            .trim()
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
          return `<a href="#" class="wikilink" data-wikilink="${safe}">${safe}</a>`;
        });
        try {
          const html = marked.parse(withWikilinks || "");
          return DOMPurify.sanitize(html);
        } catch (e) {
          console.warn("renderMarkdown failed", e);
          // Fall back to returning escaped plain text sanitized by DOMPurify
          try {
            const esc = (text || "")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/\"/g, "&quot;")
              .replace(/'/g, "&#39;");
            return DOMPurify.sanitize(
              "<pre style='white-space:pre-wrap;'>" + esc + "</pre>"
            );
          } catch (e2) {
            return "";
          }
        }
        // Fallback: compact pure-JS SHA-256 implementation
        function rightRotate(n, x) {
          return (x >>> n) | (x << (32 - n));
        }
        const K = [
          1116352408, 1899447441, 3049323471, 3921009573, 961987163, 1508970993,
          2453635748, 2870763221, 3624381080, 310598401, 607225278, 1426881987,
          1925078388, 2162078206, 2614888103, 3248222580, 3835390401,
          4022224774, 264347078, 604807628, 770255983, 1249150122, 1555081692,
          1996064986, 2554220882, 2821834349, 2952996808, 3210313671,
          3336571891, 3584528711, 113926993, 338241895, 666307205, 773529912,
          1294757372, 1396182291, 1695183700, 1986661051, 2177026350,
          2456956037, 2730485921, 2820302411, 3259730800, 3345764771,
          3516065817, 3600352804, 4094571909, 275423344, 430227734, 506948616,
          659060556, 883997877, 958139571, 1322822218, 1537002063, 1747873779,
          1955562222, 2024104815, 2227730452, 2361852424, 2428436474,
          2756734187, 3204031479, 3329325298,
        ];
        // convert to bytes (ASCII only safe); use UTF-8 encoding by converting code points
        const msg = unescape(encodeURIComponent(text));
        const ml = msg.length * 8;
        const words = [];
        for (let i = 0; i < msg.length; i++) {
          const c = msg.charCodeAt(i);
          const wordIndex = i >> 2;
          words[wordIndex] =
            (words[wordIndex] || 0) | (c << ((3 - (i % 4)) * 8));
        }
        // append padding
        const bitLenHi = Math.floor(ml / 0x100000000);
        const bitLenLo = ml >>> 0;
        // append 0x80 byte
        const idx = msg.length;
        const wi = idx >> 2;
        words[wi] = (words[wi] || 0) | (0x80 << ((3 - (idx % 4)) * 8));
        // pad with zeros until length ≡ 56 mod 64
        const totalWords = (((idx + 8) >> 6) + 1) * 16;
        words.length = totalWords;
        words[totalWords - 2] = bitLenHi;
        words[totalWords - 1] = bitLenLo;

        let H = [
          1779033703, 3144134277, 1013904242, 2773480762, 1359893119,
          2600822924, 528734635, 1541459225,
        ];

        for (let j = 0; j < words.length; j += 16) {
          const W = new Array(64);
          for (let t = 0; t < 16; t++) W[t] = words[j + t] >>> 0;
          for (let t = 16; t < 64; t++) {
            const s0 =
              (rightRotate(7, W[t - 15]) ^
                rightRotate(18, W[t - 15]) ^
                (W[t - 15] >>> 3)) >>>
              0;
            const s1 =
              (rightRotate(17, W[t - 2]) ^
                rightRotate(19, W[t - 2]) ^
                (W[t - 2] >>> 10)) >>>
              0;
            W[t] = (W[t - 16] + s0 + W[t - 7] + s1) >>> 0;
          }
          let a = H[0],
            b = H[1],
            c = H[2],
            d = H[3],
            e = H[4],
            f = H[5],
            g = H[6],
            h = H[7];
          for (let t = 0; t < 64; t++) {
            const S1 =
              (rightRotate(6, e) ^ rightRotate(11, e) ^ rightRotate(25, e)) >>>
              0;
            const ch = ((e & f) ^ (~e & g)) >>> 0;

              (rightRotate(2, a) ^ rightRotate(13, a) ^ rightRotate(22, a)) >>>

            g = f;
            f = e;
            e = (d + temp1) >>> 0;
            d = c;
            c = b;
            b = a;
            a = (temp1 + temp2) >>> 0;

          H[1] = (H[1] + b) >>> 0;
          H[2] = (H[2] + c) >>> 0;
          H[3] = (H[3] + d) >>> 0;
          H[4] = (H[4] + e) >>> 0;
          H[5] = (H[5] + f) >>> 0;
          H[6] = (H[6] + g) >>> 0;

      // Generate a consistent, pastel HSL color for a repo node (path or id)
      // so UI elements can share the same colouring logic as the graph nodes.
      // Input: any string (path, name, id). Output: CSS HSL color string.
      function nodeColorForKey(key) {
        key = key || "";
        // Use the same hash helper to produce a hex sha256 string (fast JS fallback)
        // Prefer the WebCrypto-based hashText above when available.
        // Note: hashText returns a hex string.
        const make = async (k) => {
          try {
            const h = await hashText(k);
            return h || "";
          } catch (e) {
            // fallback: simple JS hash
            let h = 0;
            for (let i = 0; i < k.length; i++)
              h = (h * 31 + k.charCodeAt(i)) >>> 0;
            return ("00000000" + (h >>> 0).toString(16)).slice(-8) + "00000000";
          }
        };

        // synchronous wrapper that returns a computed HSL immediately by hashing
        // via a small non-blocking trick (we call hashText but don't await in some
        // faster code paths). For deterministic synchronous color we fall back to
        // a simple JS hash if hashText isn't available synchronously.
        // Here we'll generate a synchronous color from the string directly
        // (so callers can use it immediately). This mirrors the same distribution
        // as the sha-based approach well enough for UI colouring.
        let syncHash = 0;
        for (let i = 0; i < key.length; i++)
          syncHash = (syncHash * 31 + key.charCodeAt(i)) >>> 0;
        const h = syncHash % 360;
        // pick a pleasant pastel saturation/lightness tuned for backgrounds
        const s = 38 + ((syncHash >> 8) % 10); // 38-47%
        const l = 90 - ((syncHash >> 16) % 6); // 90-85%
        return `hsl(${h} ${s}% ${l}%)`;
      }

      // Adjust HSL lightness in strings like 'hsl(H S% L%)'. delta is in percent points.
      function adjustHslLightness(hslStr, delta) {
        if (!hslStr || typeof hslStr !== "string") return hslStr;
        const m = hslStr.match(
          /hsl\s*\(\s*([0-9.]+)\s+([0-9.]+)%\s+([0-9.]+)%\s*\)/i
        );
        if (!m) return hslStr;
        const h = m[1];
        const s = m[2];
        let l = parseFloat(m[3]);
        l = Math.max(0, Math.min(100, l + delta));
        return `hsl(${h} ${s}% ${l}%)`;
      }
