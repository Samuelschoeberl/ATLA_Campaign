<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mycelium — Repo Browser</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.0/dist/purify.min.js"></script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: system-ui, Arial, sans-serif;
        color: #111;
        min-height: 100%;
        padding: 24px;
        position: relative;
        /* darker base underneath the pastel swirl */
        background: #0b0f13;
        overflow-x: hidden;
      }
      /* animated conic (swirl) background */
      body::before {
        content: "";
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        /* put the swirl above the page background but behind the UI */
        z-index: 0;
        /* wider, gentler color range for a slow, lush swirl */
        /* desaturated pastel palette, static (no animation) */
        background: conic-gradient(
          from 90deg at 50% 50%,
          #f2dfe7 0deg,
          #f7e5d0 60deg,
          #fff6c8 120deg,
          #d8eedd 180deg,
          #d9ecf8 240deg,
          #e6ddf6 300deg,
          #f3dbe3 360deg
        );
        filter: blur(64px) saturate(110%);
        opacity: 0.6;
        transform-origin: 50% 50%;
        /* static: no animation so the swirl does not move */
        animation: none;
      }
      body::after {
        content: "";
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        /* subtle radial highlight above the swirl */
        z-index: 1;
        pointer-events: none;
        /* much more subtle highlight so overall look stays darker */
        background: radial-gradient(
          circle at 50% 50%,
          rgba(255, 255, 255, 0.06) 0%,
          rgba(255, 255, 255, 0) 45%
        );
      }
      /* static background: keyframes and pulse animation removed */

      .app {
        max-width: 1200px;
        margin: 0 auto;
        /* slightly more transparent so the subtle pastel shows through */
        background: rgba(171, 171, 171, 0.92);
        border-radius: 8px;
        padding: 18px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
        /* ensure UI sits above the swirl layers */
        position: relative;
        z-index: 2;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      h1 {
        margin: 0;
        font-size: 1.4rem;
      }
      .muted {
        color: #666;
        font-size: 0.9rem;
      }
      nav {
        margin-top: 12px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      ul.entries {
        list-style: none;
        padding: 0;
        margin: 12px 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      ul.entries li {
        background: #eeeded;
        border: 1px solid #000000;
        padding: 8px 10px;
        border-radius: 6px;
      }
      /* special styling for links that point to .html pages (static exports) */
      ul.entries li a.html-link {
        background: linear-gradient(180deg, #fff7e6, #fff0d1);
        color: #7a3b00;
        padding: 6px 8px;
        border-radius: 4px;
        text-decoration: underline;
      }
      /* small external icon after html links and tooltip support */
      ul.entries li a.html-link::after {
        content: " \2197"; /* north east arrow ↗ */
        font-size: 0.85em;
        margin-left: 6px;
        opacity: 0.9;
      }
      ul.entries li a.html-link[title] {
        cursor: pointer;
      }
      .md-container {
        margin-top: 18px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .markdown-file {
        border: 1px solid #e6e6e6;
        background: #c3c3c3;
        padding: 12px;
        border-radius: 6px;
      }
      /* Make markdown-rendered tables show clear cell borders in previews */
      .markdown-file table {
        border-collapse: collapse;
        width: 100%;
        margin: 8px 0;
        background: white;
      }
      .markdown-file table,
      .markdown-file table th,
      .markdown-file table td {
        border: 1px solid #999;
      }
      .markdown-file table th,
      .markdown-file table td {
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
      }
      .markdown-file table th {
        background: #ececec;
        font-weight: 600;
      }
      /* cells slightly darker than the markdown card background */
      .markdown-file table td {
        background: #bfbfbf;
      }
      .file-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .file-meta {
        color: #777;
        font-size: 0.85rem;
      }
      #notif-area {
        position: fixed;
        right: 18px;
        top: 18px;
        z-index: 9999;
        pointer-events: none;
      }
      /* Mobile-friendly edits */
      @media (max-width: 640px) {
        .markdown-file textarea {
          font-size: 18px;
          line-height: 1.5;
          padding: 12px;
        }
        .markdown-file .file-title button {
          font-size: 15px;
          padding: 8px 10px;
        }
        .app {
          padding: 12px;
        }
      }

      /* Fullscreen editor state */
      .markdown-file.is-fullscreen {
        position: fixed;
        inset: 0;
        z-index: 99990;
        margin: 0;
        border-radius: 0;
        padding: 12px;
        background: #fff;
        display: flex;
        flex-direction: column;
      }
      .markdown-file.is-fullscreen #file-title-name {
        font-size: 1.1rem;
      }
      .markdown-file.is-fullscreen textarea {
        position: absolute;
        top: 56px;
        left: 12px;
        right: 12px;
        bottom: 12px;
        width: auto;
        height: auto;
        border-radius: 6px;
        font-size: 18px;
      }
      .markdown-file.is-fullscreen #preview {
        display: none;
      }
      .fullscreen-close {
        display: inline-block;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <div id="app" class="app">
      <header>
        <h1>Mycelium — Repo Browser</h1>
        <div class="muted">&nbsp;&middot;&nbsp; Player Root</div>
      </header>

      <nav>
        <div class="back"><button id="up-btn" disabled>Up</button></div>
        <div><button id="deleted-btn">Deleted</button></div>
        <div class="muted">Current: /<span id="curpath"></span></div>
      </nav>

      <!-- debug panel removed -->

      <section id="entries-wrap">
        <!-- entries list will be injected here -->
      </section>

      <div class="md-container" id="md-container">
        <!-- md previews / editors injected here -->
      </div>
    </div>

    <div id="notif-area"></div>
    <!-- error overlay (hidden until a runtime error occurs) -->
    <div
      id="error-overlay"
      style="
        display: none;
        position: fixed;
        inset: 12px;
        z-index: 100000;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 18px;
        border-radius: 8px;
        overflow: auto;
        max-height: 80%;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
      "
    >
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 12px;
          margin-bottom: 8px;
        "
      >
        <strong>Client error</strong>
        <button
          id="error-overlay-close"
          style="
            background: #fff;
            color: #000;
            border: 0;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
          "
        >
          Close
        </button>
      </div>
      <pre
        id="error-overlay-text"
        style="white-space: pre-wrap; color: #fff; margin: 0; font-size: 13px"
      ></pre>
    </div>

    <script>
      // If the page was loaded from the local server, use the same host:port for backend
      // prefer an explicit override, otherwise use the same origin that served the frontend
      const BASE = (
        window.MYCELIUM_BACKEND_BASE || `${location.protocol}//${location.host}`
      ).replace(/\/$/, "");

      // Configure marked for Obsidian-like markdown behaviour:
      // - enable GFM so common GitHub/Obsidian constructs are parsed
      // - treat single line breaks as hard breaks (Obsidian's "wrapping" behaviour)
      // - disable header id mangling so headings remain predictable
      // - disable automatic email/URL mangling which Obsidian doesn't do
      try {
        marked.setOptions({
          gfm: true,
          breaks: true,
          headerIds: false,
          mangle: false,
          smartLists: true,
          smartypants: false,
        });
      } catch (e) {
        console.warn("marked.setOptions failed", e);
      }

      // Centralized render helper so we can apply the same transformations
      // everywhere the preview is created. Returns sanitized HTML.
      function renderMarkdown(src) {
        const text = String(src || "");
        // Basic Obsidian-style wiki-link support: convert [[Name]] into an
        // inline anchor with a data-wikilink attribute so clicks can be
        // intercepted and routed inside the app rather than navigating.
        const withWikilinks = text.replace(/\[\[([^\]]+)\]\]/g, (m, name) => {
          const safe = String(name)
            .trim()
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
          return `<a href="#" class="wikilink" data-wikilink="${safe}">${safe}</a>`;
        });
        try {
          const html = marked.parse(withWikilinks || "");
          return DOMPurify.sanitize(html);
        } catch (e) {
          console.warn("renderMarkdown failed", e);
          return DOMPurify.sanitize(escapeHtml(withWikilinks));
        }
      }

      // Minimal fallback escape for the unlikely sanitize branch above
      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function encodeSegments(p) {
        if (!p) return "";
        return p
          .split("/")
          .map((s) => encodeURIComponent(s))
          .join("/");
      }
      // Ensure a path is repo-root-relative by prefixing with "Player Root/"
      // when the server exposes files under that top-level directory.
      function ensurePlayerRoot(p) {
        if (!p) return p;
        if (/^Player Root\//i.test(p)) return p;
        return "Player Root/" + p;
      }
      const $ = (sel, root = document) => root.querySelector(sel);
      const create = (t, props = {}) => {
        const el = document.createElement(t);
        Object.assign(el, props);
        return el;
      };

      // Create a new .md file on the server. folderPath may be a display path
      // (e.g. "Player Root/some/dir") or a repo-relative path. The backend
      // accepts either; normalize here to include the Player Root prefix
      async function createMdFile(folderPath, filename) {
        if (!filename || !filename.toLowerCase().endsWith(".md")) {
          showNotif("Error", "Filename must end with .md");
          return false;
        }
        // basic filename validation (no slashes/traversal)
        if (/[\/\\]/.test(filename) || filename.includes("..")) {
          showNotif("Error", "Invalid filename");
          return false;
        }

        const PLAYER_ROOT_PREFIX = "Player Root/";
        let folder = (folderPath || "").trim();
        if (folder && !folder.startsWith(PLAYER_ROOT_PREFIX)) {
          // if frontend uses repo-relative, prefix to match backend expectations
          folder = PLAYER_ROOT_PREFIX + folder.replace(/^\/+/, "");
        }

        try {
          const res = await fetch(`${BASE}/api/create-md-file`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ folderPath: folder, filename }),
          });
          const j = await res.json().catch(() => ({}));
          if (!res.ok) {
            showNotif("Error", j.error || "Failed to create file");
            return false;
          }
          showNotif("Created", filename);
          // Refresh the current directory view. If folderPath was provided it
          // may include the "Player Root/" prefix; strip that before calling
          // renderDir which expects a repo-relative path.
          try {
            let p = "";
            if (folderPath) {
              p = String(folderPath)
                .replace(/^Player Root\//i, "")
                .replace(/^\/+/, "");
            } else if (typeof stack !== "undefined" && stack.length) {
              p = stack[stack.length - 1] || "";
            }
            if (typeof renderDir === "function") renderDir(p || "");
          } catch (e) {
            console.warn("refresh after create failed", e);
          }
          return true;
        } catch (err) {
          showNotif("Error", err.message || "Network error");
          return false;
        }
      }

      // Delegate clicks on "new .md file" UI elements. Any button that should
      // trigger creation can have data-create-md and optional data-folder.
      document.addEventListener("click", async (ev) => {
        const btn = ev.target.closest && ev.target.closest("[data-create-md]");
        if (!btn) return;
        // If the UI already rendered an inline input nearby, let that handle creation
        const nearbyInput =
          btn.parentElement && btn.parentElement.querySelector("input");
        if (nearbyInput) return; // inline UI handles the action
        ev.preventDefault();
        // legacy fallback: prefer explicit data-folder, fallback to current stack path if available
        const folder =
          btn.getAttribute("data-folder") ||
          (typeof curpathEl !== "undefined" &&
            curpathEl &&
            curpathEl.textContent) ||
          "";
        const name = prompt("New filename (include .md):", "new-file.md");
        if (!name) return;
        const ok = await createMdFile(folder, name.trim());
        if (ok) {
          if (typeof renderDir === "function") {
            const p = stack && stack.length ? stack[stack.length - 1] : folder;
            renderDir(p || "");
          } else {
            location.reload();
          }
        }
      });

      // small utilities
      async function hashText(text) {
        text = text || "";
        // Prefer WebCrypto when available
        if (
          window.crypto &&
          window.crypto.subtle &&
          typeof crypto.subtle.digest === "function"
        ) {
          try {
            const enc = new TextEncoder().encode(text);
            const buf = await crypto.subtle.digest("SHA-256", enc);
            return Array.from(new Uint8Array(buf))
              .map((b) => b.toString(16).padStart(2, "0"))
              .join("");
          } catch (e) {
            /* fallthrough to JS fallback */
          }
        }
        // Fallback: compact pure-JS SHA-256 implementation
        function rightRotate(n, x) {
          return (x >>> n) | (x << (32 - n));
        }
        const K = [
          1116352408, 1899447441, 3049323471, 3921009573, 961987163, 1508970993,
          2453635748, 2870763221, 3624381080, 310598401, 607225278, 1426881987,
          1925078388, 2162078206, 2614888103, 3248222580, 3835390401,
          4022224774, 264347078, 604807628, 770255983, 1249150122, 1555081692,
          1996064986, 2554220882, 2821834349, 2952996808, 3210313671,
          3336571891, 3584528711, 113926993, 338241895, 666307205, 773529912,
          1294757372, 1396182291, 1695183700, 1986661051, 2177026350,
          2456956037, 2730485921, 2820302411, 3259730800, 3345764771,
          3516065817, 3600352804, 4094571909, 275423344, 430227734, 506948616,
          659060556, 883997877, 958139571, 1322822218, 1537002063, 1747873779,
          1955562222, 2024104815, 2227730452, 2361852424, 2428436474,
          2756734187, 3204031479, 3329325298,
        ];
        // convert to bytes (ASCII only safe); use UTF-8 encoding by converting code points
        const msg = unescape(encodeURIComponent(text));
        const ml = msg.length * 8;
        const words = [];
        for (let i = 0; i < msg.length; i++) {
          const c = msg.charCodeAt(i);
          const wordIndex = i >> 2;
          words[wordIndex] =
            (words[wordIndex] || 0) | (c << ((3 - (i % 4)) * 8));
        }
        // append padding
        const bitLenHi = Math.floor(ml / 0x100000000);
        const bitLenLo = ml >>> 0;
        // append 0x80 byte
        const idx = msg.length;
        const wi = idx >> 2;
        words[wi] = (words[wi] || 0) | (0x80 << ((3 - (idx % 4)) * 8));
        // pad with zeros until length ≡ 56 mod 64
        const totalWords = (((idx + 8) >> 6) + 1) * 16;
        words.length = totalWords;
        words[totalWords - 2] = bitLenHi;
        words[totalWords - 1] = bitLenLo;

        let H = [
          1779033703, 3144134277, 1013904242, 2773480762, 1359893119,
          2600822924, 528734635, 1541459225,
        ];

        for (let j = 0; j < words.length; j += 16) {
          const W = new Array(64);
          for (let t = 0; t < 16; t++) W[t] = words[j + t] >>> 0;
          for (let t = 16; t < 64; t++) {
            const s0 =
              (rightRotate(7, W[t - 15]) ^
                rightRotate(18, W[t - 15]) ^
                (W[t - 15] >>> 3)) >>>
              0;
            const s1 =
              (rightRotate(17, W[t - 2]) ^
                rightRotate(19, W[t - 2]) ^
                (W[t - 2] >>> 10)) >>>
              0;
            W[t] = (W[t - 16] + s0 + W[t - 7] + s1) >>> 0;
          }
          let a = H[0],
            b = H[1],
            c = H[2],
            d = H[3],
            e = H[4],
            f = H[5],
            g = H[6],
            h = H[7];
          for (let t = 0; t < 64; t++) {
            const S1 =
              (rightRotate(6, e) ^ rightRotate(11, e) ^ rightRotate(25, e)) >>>
              0;
            const ch = ((e & f) ^ (~e & g)) >>> 0;
            const temp1 = (h + S1 + ch + K[t] + W[t]) >>> 0;
            const S0 =
              (rightRotate(2, a) ^ rightRotate(13, a) ^ rightRotate(22, a)) >>>
              0;
            const maj = ((a & b) ^ (a & c) ^ (b & c)) >>> 0;
            const temp2 = (S0 + maj) >>> 0;
            h = g;
            g = f;
            f = e;
            e = (d + temp1) >>> 0;
            d = c;
            c = b;
            b = a;
            a = (temp1 + temp2) >>> 0;
          }
          H[0] = (H[0] + a) >>> 0;
          H[1] = (H[1] + b) >>> 0;
          H[2] = (H[2] + c) >>> 0;
          H[3] = (H[3] + d) >>> 0;
          H[4] = (H[4] + e) >>> 0;
          H[5] = (H[5] + f) >>> 0;
          H[6] = (H[6] + g) >>> 0;
          H[7] = (H[7] + h) >>> 0;
        }
        return H.map((x) =>
          ("00000000" + (x >>> 0).toString(16)).slice(-8)
        ).join("");
      }

      // Generate a consistent, pastel HSL color for a repo node (path or id)
      // so UI elements can share the same colouring logic as the graph nodes.
      // Input: any string (path, name, id). Output: CSS HSL color string.
      function nodeColorForKey(key) {
        key = key || "";
        // Use the same hash helper to produce a hex sha256 string (fast JS fallback)
        // Prefer the WebCrypto-based hashText above when available.
        // Note: hashText returns a hex string.
        const make = async (k) => {
          try {
            const h = await hashText(k);
            return h || "";
          } catch (e) {
            // fallback: simple JS hash
            let h = 0;
            for (let i = 0; i < k.length; i++)
              h = (h * 31 + k.charCodeAt(i)) >>> 0;
            return ("00000000" + (h >>> 0).toString(16)).slice(-8) + "00000000";
          }
        };

        // synchronous wrapper that returns a computed HSL immediately by hashing
        // via a small non-blocking trick (we call hashText but don't await in some
        // faster code paths). For deterministic synchronous color we fall back to
        // a simple JS hash if hashText isn't available synchronously.
        // Here we'll generate a synchronous color from the string directly
        // (so callers can use it immediately). This mirrors the same distribution
        // as the sha-based approach well enough for UI colouring.
        let syncHash = 0;
        for (let i = 0; i < key.length; i++)
          syncHash = (syncHash * 31 + key.charCodeAt(i)) >>> 0;
        const h = syncHash % 360;
        // pick a pleasant pastel saturation/lightness tuned for backgrounds
        const s = 38 + ((syncHash >> 8) % 10); // 38-47%
        const l = 90 - ((syncHash >> 16) % 6); // 90-85%
        return `hsl(${h} ${s}% ${l}%)`;
      }

      // Adjust HSL lightness in strings like 'hsl(H S% L%)'. delta is in percent points.
      function adjustHslLightness(hslStr, delta) {
        if (!hslStr || typeof hslStr !== "string") return hslStr;
        const m = hslStr.match(
          /hsl\s*\(\s*([0-9.]+)\s+([0-9.]+)%\s+([0-9.]+)%\s*\)/i
        );
        if (!m) return hslStr;
        const h = m[1];
        const s = m[2];
        let l = parseFloat(m[3]);
        l = Math.max(0, Math.min(100, l + delta));
        return `hsl(${h} ${s}% ${l}%)`;
      }

      // Style table cells inside a rendered preview element so their background
      // is a slightly darker variant of the surrounding node background.
      function stylePreviewTables(previewEl, nodeBg) {
        try {
          if (!previewEl) return;
          // compute a slightly darker cell bg and slightly lighter header bg
          const cellBg = adjustHslLightness(nodeBg, -6);
          const headerBg = adjustHslLightness(nodeBg, 6);
          const tables = previewEl.querySelectorAll("table");
          tables.forEach((tbl) => {
            // fallback: keep table background white unless nodeBg is parseable
            if (tbl.style) tbl.style.background = "transparent";
            const ths = tbl.querySelectorAll("th");
            ths.forEach((th) => {
              th.style.background = headerBg;
            });
            const tds = tbl.querySelectorAll("td");
            tds.forEach((td) => {
              td.style.background = cellBg;
            });
          });
        } catch (e) {
          console.warn("stylePreviewTables failed", e);
        }
      }

      // Global error overlay wiring
      function showErrorOverlay(msg) {
        const overlay = document.getElementById("error-overlay");
        const text = document.getElementById("error-overlay-text");
        if (!overlay || !text) return;
        text.textContent = msg;
        overlay.style.display = "block";
      }

      window.addEventListener("error", (e) => {
        try {
          showErrorOverlay(
            e.message + "\n" + (e.error && e.error.stack ? e.error.stack : "")
          );
        } catch (err) {
          console.error(err);
        }
      });
      window.addEventListener("unhandledrejection", (e) => {
        try {
          showErrorOverlay(
            "Unhandled promise rejection:\n" +
              (e.reason && e.reason.stack
                ? e.reason.stack
                : JSON.stringify(e.reason))
          );
        } catch (err) {
          console.error(err);
        }
      });

      document.addEventListener("DOMContentLoaded", () => {
        const closeBtn = document.getElementById("error-overlay-close");
        if (closeBtn)
          closeBtn.addEventListener("click", () => {
            const overlay = document.getElementById("error-overlay");
            if (overlay) overlay.style.display = "none";
          });
      });
      function debugLog(msg) {
        try {
          const el = document.getElementById("debug-log");
          if (!el) return;
          const ts = new Date()
            .toISOString()
            .replace(/.*T/, "")
            .replace(/Z$/, "");
          el.textContent = ts + " " + msg + "\n" + el.textContent;
        } catch (e) {}
      }
      // showNotif now accepts optional actions: [{label: 'Undo', cb: ()=>{}}]
      function showNotif(title, text, ttl = 4000, actions = []) {
        try {
          const area = document.getElementById("notif-area");
          const n = document.createElement("div");
          n.style.pointerEvents = "auto";
          n.style.background = "rgba(0,0,0,0.75)";
          n.style.color = "white";
          n.style.padding = "8px 12px";
          n.style.borderRadius = "8px";
          n.style.boxShadow = "0 6px 18px rgba(0,0,0,0.2)";
          n.style.marginTop = "8px";
          n.style.fontSize = "13px";
          const inner = document.createElement("div");
          inner.innerHTML = `<strong>${title}</strong><div style="margin-top:6px">${text}</div>`;
          n.appendChild(inner);
          if (actions && actions.length) {
            const actionWrap = document.createElement("div");
            actionWrap.style.marginTop = "8px";
            for (const a of actions) {
              const btn = document.createElement("button");
              btn.textContent = a.label;
              btn.style.marginRight = "8px";
              btn.style.padding = "6px 8px";
              btn.style.borderRadius = "6px";
              btn.style.border = "none";
              btn.style.cursor = "pointer";
              btn.addEventListener("click", (ev) => {
                try {
                  a.cb(ev);
                } catch (e) {
                  console.error(e);
                }
                // remove the notification immediately when action clicked
                if (n.parentElement) n.parentElement.removeChild(n);
              });
              actionWrap.appendChild(btn);
            }
            n.appendChild(actionWrap);
          }
          area.appendChild(n);
          setTimeout(() => {
            try {
              n.style.transition = "opacity 0.25s";
              n.style.opacity = "0";
              setTimeout(() => area.removeChild(n), 300);
            } catch (e) {}
          }, ttl);
        } catch (e) {
          console.warn(e);
        }
      }
      function pulseOnce() {
        document.body.classList.add("pulse");
        setTimeout(() => document.body.classList.remove("pulse"), 900);
      }

      // app state
      const entriesWrap = document.getElementById("entries-wrap");
      const mdContainer = document.getElementById("md-container");
      const curpathEl = document.getElementById("curpath");
      const upBtn = document.getElementById("up-btn");
      let stack = [""];
      let openPath = null,
        openFileName = null;
      let ws = null;
      const cachedHash = Object.create(null);
      const locks = Object.create(null);
      const clientId = Math.random().toString(36).slice(2, 9);

      async function fetchPath(p) {
        const seg = encodeSegments(p);
        const res = await fetch(
          BASE + "/player_root" + (seg ? "/" + seg : ""),
          { cache: "no-store" }
        );
        if (!res.ok) return null;
        return res.json();
      }
      async function fetchPathWithHash(p) {
        const seg = encodeSegments(p);
        const res = await fetch(
          BASE + "/player_root" + (seg ? "/" + seg : ""),
          { cache: "no-store" }
        );
        if (!res.ok) return null;
        const j = await res.json();
        let h = null;
        // Prefer server-provided hash (ETag/hash field). Fall back to client-side hashing when missing.
        if (j && j.hash) {
          h = j.hash;
          cachedHash[p] = h;
        } else {
          try {
            h = await hashText(j.content || "");
            cachedHash[p] = h;
          } catch (err) {
            // hashText may fail on older browsers; continue without hash
            console.warn("hashText failed, skipping hash:", err);
            h = null;
          }
        }
        return { json: j, hash: h };
      }

      async function renderDir(p = "") {
        debugLog("renderDir(" + p + ") called");
        const j = await fetchPath(p);
        debugLog(
          "fetchPath returned " +
            (j
              ? Array.isArray(j.entries)
                ? j.entries.length
                : "has_entries?"
              : "null")
        );
        entriesWrap.innerHTML = "";
        mdContainer.innerHTML = "";
        curpathEl.textContent = p;
        upBtn.disabled = stack.length <= 1;
        if (!j) return;
        const ul = create("ul", { className: "entries" });
        const entries = j.entries || [];
        for (const e of entries) {
          const li = create("li");
          // For HTML file entries, set the anchor href to the static server's
          // /vault URL and target _blank so left-click opens a new tab. For
          // non-HTML files keep a hash href and handle opening in-app.
          let href = "#";
          const isHtmlFile =
            e.type === "file" && e.name.toLowerCase().endsWith(".html");
          if (isHtmlFile) {
            const full = ensurePlayerRoot(e.path);
            href = `${location.origin}/vault/${encodeSegments(full)}`;
          }
          const a = create("a", {
            href,
            textContent: e.name,
            ...(isHtmlFile ? { target: "_blank", rel: "noopener" } : {}),
          });
          // mark links that point to .html files so they can be styled differently
          if (isHtmlFile) {
            a.classList.add("html-link");
            // give a clear tooltip so users know this opens externally
            a.title = "Opens in new tab (external)";
          }
          a.addEventListener("click", (ev) => {
            // allow modified clicks (ctrl/cmd/shift/alt) and middle-click to open
            // the href in a new tab/window via the browser default behavior
            const isModified =
              ev.metaKey ||
              ev.ctrlKey ||
              ev.shiftKey ||
              ev.altKey ||
              ev.button === 1 ||
              ev.which === 2;
            if (e.type === "dir") {
              ev.preventDefault();
              stack.push(e.path);
              renderDir(e.path);
            } else {
              // HTML files: let the browser open the /vault href in a new tab
              // when clicked (target=_blank). Non-HTML files should open in-app.
              if (isHtmlFile) {
                // allow default navigation (will open in new tab due to target)
                return;
              }
              if (isModified) {
                // modified clicks on non-html files should still let the browser
                // handle (though href is '#', so fall back to opening in-app)
                return;
              }
              ev.preventDefault();
              openFile(e.path, e.name);
            }
          });
          li.appendChild(a);
          li.appendChild(
            create("div", { className: "muted", textContent: e.type })
          );
          // If we're viewing the deleted folder, show a Restore button for files
          const viewingDeleted = (p || "").replace(/^Player Root\//i, "") === "deleted" || (j && j.path && j.path.replace(/^Player Root\//i, "") === "deleted");
          if (viewingDeleted && e.type === "file") {
            const restoreBtn = create("button", { textContent: "Restore" });
            restoreBtn.style.marginLeft = "8px";
            restoreBtn.addEventListener("click", async (ev) => {
              ev.preventDefault();
              const defaultDst = prompt(
                "Restore to (path under Player Root, e.g. PCs/Anju):",
                "PCs/"
              );
              if (!defaultDst) return;
              // build destination path: ensure folder + original filename
              const dstFolder = defaultDst.replace(/^\/+|\/+$/g, "");
              const dstFull = ensurePlayerRoot(dstFolder + "/" + e.name);
              const srcFull = ensurePlayerRoot("deleted/" + e.name);
              try {
                const r = await fetch(BASE + "/player_root/move", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ src: srcFull, dst: dstFull }),
                });
                if (!r.ok) {
                  const txt = await r.text();
                  showNotif("Restore failed", txt || String(r.status));
                  return;
                }
                showNotif("Restored", e.name);
                // refresh deleted view
                renderDir("deleted");
              } catch (err) {
                showNotif("Restore error", String(err));
              }
            });
            li.appendChild(restoreBtn);
          }
          ul.appendChild(li);
        }
        // Add an inline "New .md file" input when viewing a directory
        try {
          const newMdDiv = create("div", {
            style: "margin:12px 0;display:flex;gap:8px;align-items:center",
          });
          const input = create("input", {
            placeholder: "new-file.md",
            style: "flex:1;padding:6px;border-radius:4px;border:1px solid #ddd",
          });
          const newMdBtn = create("button", { textContent: "Create" });
          // supply the current folder via dataset so handlers can access it
          newMdBtn.dataset.folder = j.path || p || "";
          // wire create action directly (lightweight, no modal)
          newMdBtn.addEventListener("click", async (ev) => {
            ev.preventDefault();
            const name =
              (input.value || "").trim() || input.placeholder || "new-file.md";
            if (!name) return;
            const ok = await createMdFile(newMdBtn.dataset.folder, name);
            if (ok) {
              // clear input and refresh current directory view
              input.value = "";
              if (typeof renderDir === "function") {
                const ptop =
                  stack && stack.length
                    ? stack[stack.length - 1]
                    : j.path || p || "";
                renderDir(ptop || "");
              } else {
                location.reload();
              }
            }
          });
          newMdDiv.appendChild(input);
          newMdDiv.appendChild(newMdBtn);
          entriesWrap.appendChild(newMdDiv);
        } catch (e) {
          console.warn("failed to render new file input", e);
        }

        entriesWrap.appendChild(ul);
        // show md previews
        const mds = entries.filter(
          (e) => e.type === "file" && e.name.toLowerCase().endsWith(".md")
        );
        for (const f of mds) {
          const box = create("div", { className: "markdown-file" });
          // apply node colouring to the preview background so it matches graph nodes
          try {
            box.style.background = nodeColorForKey(f.path || f.name);
          } catch (e) {}
          const title = create("div", { className: "file-title" });
          title.innerHTML = `<div><strong>${
            f.name
          }</strong><div class="file-meta">/${f.path.replace(
            /^Player Root\//i,
            ""
          )}</div></div>`;
          const openBtn = create("button", { textContent: "Open" });
          openBtn.addEventListener("click", () => openFile(f.path, f.name));
          title.appendChild(openBtn);
          box.appendChild(title);
          const preview = create("div");
          preview.textContent = "Loading...";
          box.appendChild(preview);
          mdContainer.appendChild(box);
          (async () => {
            const seg = encodeSegments(f.path.replace(/^Player Root\//i, ""));
            const res = await fetch(BASE + "/player_root/" + seg);
            if (!res.ok) {
              preview.textContent = "error";
              return;
            }
            const j = await res.json();
            preview.innerHTML = renderMarkdown(j.content || "");
            try {
              // style tables to use a variant of the node background
              const nodeBg =
                box.style.background || nodeColorForKey(f.path || f.name);
              stylePreviewTables(preview, nodeBg);
            } catch (e) {}
          })();
        }
      }

      async function openFile(path, name) {
        openPath = path;
        openFileName = name;
        // If this is an HTML file, open it directly in a new tab (vault URL) and return.
        if (name.toLowerCase().endsWith(".html")) {
          try {
            // Build vault URL using ensurePlayerRoot so files under folders are
            // addressed correctly by the static server's /vault symlink.
            const seg = encodeSegments(ensurePlayerRoot(path));
            const url = `${location.origin}/vault/${seg}`;
            try {
              window.open(url, "_blank");
            } catch (e) {
              // fallback to same-tab navigation
              location.href = url;
            }
          } catch (e) {
            console.warn("failed to open html file in new tab", e);
          }
          return;
        }
        mdContainer.innerHTML = "";
        const contentPane = create("div", { className: "markdown-file" });
        // apply node colouring to the opened file pane background
        try {
          contentPane.style.background = nodeColorForKey(path || name);
        } catch (e) {}
        // For non-HTML files we show the editor/preview
        // Previously HTML files were embedded; now HTML files are opened in a new tab instead.

        contentPane.innerHTML = `<div class="file-title"><div><strong id="file-title-name">${name}</strong><div id="file-lock" class="file-meta"></div><div class="file-meta">/${path.replace(
          /^Player Root\//i,
          ""
        )}</div></div><div><button id="fullscreen-btn">Full screen</button> <button id="refresh-btn" style="margin-left:8px">Refresh</button></div></div><div style="margin-top:8px"><textarea id="file-ta" style="width:100%;min-height:320px" placeholder="Loading..."></textarea></div><div style="margin-top:8px"><button id="save-btn">Save</button> <button id="delete-btn" style="margin-left:8px;background:#ffefef;border:1px solid #cc9999">Delete</button> <button id="retry-btn" style="margin-left:8px;display:none">Retry</button> <button id="open-raw" style="margin-left:8px;display:none">Open raw</button> <span id="status" class="muted"></span></div><h3>Preview</h3><div id="preview" style="background:#fff;padding:8px;border-radius:6px;min-height:120px"></div>`;
        mdContainer.appendChild(contentPane);

        const ta = $("#file-ta");
        const statusEl = $("#status");
        const retryBtn = $("#retry-btn");
        const openRawBtn = $("#open-raw");

        async function loadContent() {
          if (statusEl) statusEl.textContent = "loading...";
          try {
            // For HTML files we don't fetch content via the backend; instead
            // set iframe src to the static server 'vault' path and return early.
            if (name.toLowerCase().endsWith(".html")) {
              const iframe = $("#file-iframe");
              // Build vault URL using full path so files under "Player Root/" resolve.
              const encoded = encodeSegments(ensurePlayerRoot(path));
              // The frontend static server exposes the project root at /vault/
              const src = `${location.origin}/vault/${encoded}`;
              if (iframe) iframe.src = src;
              // Show the Open Raw button so the client can open the page in a new tab
              if (openRawBtn) openRawBtn.style.display = "";
              if (retryBtn) retryBtn.style.display = "none";
              if (statusEl) statusEl.textContent = "";
              updateLockUI(path);
              return { json: { content: null }, hash: null };
            }
            const resObj = await fetchPathWithHash(path);
            if (!resObj) {
              // show a helpful placeholder rather than an empty box
              if (ta)
                ta.value =
                  "// Failed to load content from backend.\n// Tap Retry to attempt again, or Open raw to view via backend URL.";
              const prevEl = $("#preview");
              if (prevEl) prevEl.textContent = "";
              if (statusEl) statusEl.textContent = "failed to load";
              if (retryBtn) retryBtn.style.display = "";
              if (openRawBtn) openRawBtn.style.display = "";
              return null;
            }
            const j = resObj.json;
            ta.value = j.content || "";
            $("#preview").innerHTML = DOMPurify.sanitize(
              renderMarkdown(j.content || "")
            );
            try {
              const nodeBg =
                contentPane.style.background || nodeColorForKey(path || name);
              stylePreviewTables($("#preview"), nodeBg);
            } catch (e) {}
            statusEl.textContent = "";
            retryBtn.style.display = "none";
            openRawBtn.style.display = "none";
            updateLockUI(path);
            return resObj;
          } catch (e) {
            if (ta)
              ta.value =
                "// Error loading content: " + String(e) + "\n// Tap Retry";
            const prevEl = $("#preview");
            if (prevEl) prevEl.textContent = "";
            if (statusEl) statusEl.textContent = "error";
            if (retryBtn) retryBtn.style.display = "";
            if (openRawBtn) openRawBtn.style.display = "";
            return null;
          }
        }

        // initial load
        await loadContent();

        // Refresh button - manually reload current file from server
        const refreshBtn = $("#refresh-btn");
        if (refreshBtn) {
          refreshBtn.addEventListener("click", async () => {
            if (statusEl) statusEl.textContent = "refreshing...";
            await loadContent();
            if (statusEl) statusEl.textContent = "";
            showNotif("Refreshed", path.replace(/^Player Root\//i, ""));
          });
        }

        if (ta) {
          ta.addEventListener("input", () => {
            const prev = $("#preview");
            if (prev)
              prev.innerHTML = DOMPurify.sanitize(
                renderMarkdown(ta.value || "")
              );
            if (statusEl) statusEl.textContent = "";
            sendLock(path);
          });
        }

        if (retryBtn) {
          retryBtn.addEventListener("click", async () => {
            if (statusEl) statusEl.textContent = "retrying...";
            await loadContent();
          });
        }

        if (openRawBtn) {
          openRawBtn.addEventListener("click", () => {
            const seg = encodeSegments(ensurePlayerRoot(path));
            if (name.toLowerCase().endsWith(".html")) {
              const url = `${location.origin}/vault/${seg}`;
              try {
                window.open(url, "_blank");
              } catch (e) {
                location.href = url;
              }
            } else {
              const url = BASE + "/player_root/" + seg;
              try {
                window.open(url, "_blank");
              } catch (e) {
                location.href = url;
              }
            }
          });
        }

        // Fullscreen toggle
        const fsBtn = $("#fullscreen-btn");
        let isFs = false;
        function enterFs() {
          contentPane.classList.add("is-fullscreen");
          fsBtn.textContent = "Close";
          isFs = true;
        }
        function exitFs() {
          contentPane.classList.remove("is-fullscreen");
          fsBtn.textContent = "Full screen";
          isFs = false;
        }
        fsBtn.addEventListener("click", () => {
          if (!isFs) enterFs();
          else exitFs();
        });

        const saveBtn = $("#save-btn");
        if (saveBtn) {
          saveBtn.addEventListener("click", async () => {
            const content = ta.value;
            const remote = await fetchPathWithHash(path);
            const remoteHash = remote ? remote.hash : null;
            const baseHash = cachedHash[path];
            if (remoteHash && baseHash && remoteHash !== baseHash) {
              showConflictModal(
                path,
                ta.value,
                remote.json.content,
                async (action) => {
                  if (action === "overwrite") {
                    await doSave(path, content, true);
                  } else if (action === "accept_remote") {
                    ta.value = remote.json.content || "";
                    $("#preview").innerHTML = renderMarkdown(ta.value || "");
                    cachedHash[path] = await hashText(ta.value || "");
                  } else if (action === "merge") {
                    showNotif("Conflict", "Edit merged content and press Save");
                  }
                }
              );
              return;
            }
            await doSave(path, content, false);
          });
        }

        // Delete button: move file to Player Root/deleted/deleted_<originalname>
        const deleteBtn = $("#delete-btn");
        if (deleteBtn) {
          deleteBtn.addEventListener("click", async () => {
            const confirmDelete = confirm(
              `Are you sure you want to delete ${name}? This will move it to Player Root/deleted/deleted_${name}.`
            );
            if (!confirmDelete) return;
            try {
              const taVal = ta ? ta.value : "";

              // Ensure destination folder path (without Player Root prefix) for the API call
              const deletedFolderRel = "deleted"; // under Player Root
              const dstName = `deleted_${name}`;

              // Perform atomic server-side move via POST /player_root/move
              try {
                const moveUrl = BASE + "/player_root/move";
                const srcFull = ensurePlayerRoot(path);
                const dstFull = ensurePlayerRoot(deletedFolderRel + "/" + dstName);
                const moveRes = await fetch(moveUrl, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ src: srcFull, dst: dstFull }),
                });
                if (!moveRes.ok) {
                  const txt = await moveRes.text();
                  showNotif("Delete failed", `move failed: ${moveRes.status} ${txt}`);
                  return;
                }
              } catch (e) {
                showNotif("Delete failed", String(e));
                return;
              }

              showNotif("Deleted", `${name} moved to Player Root/deleted/${dstName}`, 8000, [
                {
                  label: "Undo",
                  cb: async () => {
                    try {
                      const moveUrl = BASE + "/player_root/move";
                      const srcFull = ensurePlayerRoot(deletedFolderRel + "/" + dstName);
                      const dstFull = ensurePlayerRoot(path);
                      const r = await fetch(moveUrl, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ src: srcFull, dst: dstFull }),
                      });
                      if (!r.ok) {
                        const txt = await r.text();
                        showNotif("Undo failed", txt || String(r.status));
                        return;
                      }
                      showNotif("Restored", name);
                      // refresh current dir view
                      renderDir(stack[stack.length - 1]);
                    } catch (err) {
                      console.error("undo move err", err);
                      showNotif("Undo error", String(err));
                    }
                  },
                },
              ]);
              // close editor and refresh view
              openPath = null;
              openFileName = null;
              mdContainer.innerHTML = "";
              renderDir(stack[stack.length - 1]);
            } catch (err) {
              console.error("delete error", err);
              showNotif("Delete error", String(err));
            }
          });
        }
      }

      async function doSave(path, content, forceOverwrite) {
        // Determine whether to route this save through the special
        // `/update_sheet/<Name>` wrapper. Only do that for files that are
        // clearly a character sheet. Previously we routed any file under
        // `Player Root/PCs/<Name>/...` which caused unrelated files like
        // `<Name>_variables.md` to be written into the character sheet.
        let saveUrl = null;
        try {
          const decoded = path.replace(/^Player Root\//i, "");
          const parts = decoded.split("/").filter(Boolean);
          if (parts.length >= 2 && parts[0].toLowerCase() === "pcs") {
            const fileName = parts.slice(2).join("/") || ""; // path inside the PC folder
            const baseFile = parts.slice(-1)[0] || "";
            const pcName = parts[1];
            // Normalize and detect common character-sheet patterns.
            const n = baseFile.toLowerCase();
            const isCharacterSheet =
              n.includes("character sheet") || // explicit pattern
              n === (pcName + " character sheet.md").toLowerCase() ||
              n === (pcName + "_character_sheet.md").toLowerCase() ||
              // some files use just '<Name>.md' as the canonical sheet
              n === (pcName + ".md").toLowerCase();
            if (isCharacterSheet) {
              saveUrl = BASE + "/update_sheet/" + encodeURIComponent(pcName);
            }
          }
        } catch (e) {}
        try {
          const url = saveUrl
            ? saveUrl
            : BASE +
              "/player_root/" +
              encodeSegments(path.replace(/^Player Root\//i, ""));
          const body = saveUrl ? { content, propagate: true } : { content };
          if (forceOverwrite) body.force = true;
          const r = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!r.ok) {
            $("#status").textContent = "save failed";
            showNotif("Save", "Failed to save");
            return;
          }
          $("#status").textContent = "saved";
          const newHash = await hashText(content || "");
          cachedHash[path] = newHash;
          try {
            if (ws && ws.readyState === WebSocket.OPEN)
              ws.send(JSON.stringify({ event: "saved", path, clientId }));
          } catch (e) {}
          showNotif("Saved", path.replace(/^Player Root\//i, ""));
          // Reload the file from server to ensure the editor shows the
          // canonical saved content (avoids stale or empty previews).
          try {
            if (typeof openFile === "function")
              openFile(path, openFileName || path.split("/").pop());
          } catch (e) {
            console.warn("failed to re-open file after save", e);
          }
        } catch (err) {
          $("#status").textContent = "error";
          showNotif("Save error", String(err));
        }
        releaseLock(path);
      }

      function showConflictModal(path, local, remote, cb) {
        const modal = create("div");
        modal.style.position = "fixed";
        modal.style.left = "50%";
        modal.style.top = "50%";
        modal.style.transform = "translate(-50%,-50%)";
        modal.style.background = "#fff";
        modal.style.padding = "18px";
        modal.style.zIndex = 99999;
        modal.style.boxShadow = "0 8px 32px rgba(0,0,0,0.25)";
        modal.innerHTML = `<h3>Conflict</h3><p>Remote version changed since you opened the file.</p>`;
        const remoteBtn = create("button", { textContent: "Accept remote" });
        const overwriteBtn = create("button", {
          textContent: "Overwrite remote",
          style: "margin-left:8px",
        });
        const mergeBtn = create("button", {
          textContent: "Open merge editor",
          style: "margin-left:8px",
        });
        modal.appendChild(remoteBtn);
        modal.appendChild(overwriteBtn);
        modal.appendChild(mergeBtn);
        document.body.appendChild(modal);
        remoteBtn.addEventListener("click", () => {
          document.body.removeChild(modal);
          cb("accept_remote");
        });
        overwriteBtn.addEventListener("click", () => {
          document.body.removeChild(modal);
          cb("overwrite");
        });
        mergeBtn.addEventListener("click", () => {
          document.body.removeChild(modal);
          cb("merge");
        });
      }

      function sendLock(path) {
        try {
          if (ws && ws.readyState === WebSocket.OPEN)
            ws.send(JSON.stringify({ cmd: "lock", path, clientId }));
        } catch (e) {}
      }
      function releaseLock(path) {
        try {
          if (ws && ws.readyState === WebSocket.OPEN)
            ws.send(JSON.stringify({ cmd: "unlock", path, clientId }));
        } catch (e) {}
      }
      function updateLockUI(path) {
        const el = document.getElementById("file-lock");
        if (!el) return;
        const locker = locks[path];
        if (locker && locker !== clientId)
          el.textContent = `Editing by ${locker}`;
        else el.textContent = "";
      }

      // SSE
      try {
        const es = new EventSource(BASE + "/events");
        es.addEventListener("propagated", (ev) => {
          try {
            const payload = JSON.parse(ev.data);
            const updated = payload.updated || [];
            if (
              openPath &&
              updated.some(
                (u) =>
                  u.replace(/^Player Root\//i, "") ===
                  openPath.replace(/^Player Root\//i, "")
              )
            ) {
              openFile(openPath, openFileName);
              const s = $("#status");
              if (s) s.textContent = "Updated by server";
            }
            pulseOnce();
            showNotif(
              "Propagated",
              (payload.pc || "") + " updated " + updated.join(", ")
            );
          } catch (e) {
            console.warn("bad sse", e);
          }
        });
        es.onerror = (e) => {
          console.warn("SSE error", e);
        };
      } catch (e) {
        console.warn("SSE not available", e);
      }

      // WebSocket
      try {
        const wsUrl = BASE.replace(/^http/, "ws") + "/ws";
        ws = new WebSocket(wsUrl);
        ws.addEventListener("open", () => {
          console.log("ws open");
          try {
            ws.send(JSON.stringify({ cmd: "hello", clientId }));
          } catch (e) {}
        });
        ws.addEventListener("message", (ev) => {
          try {
            const obj = JSON.parse(ev.data);
            if (obj.cmd === "lock" || obj.event === "lock") {
              locks[obj.path] = obj.clientId || obj.by || "unknown";
              updateLockUI(obj.path);
            } else if (obj.cmd === "unlock" || obj.event === "unlock") {
              delete locks[obj.path];
              updateLockUI(obj.path);
            } else if (obj.event === "saved" || obj.cmd === "saved") {
              if (obj.path && openPath && obj.path === openPath) {
                openFile(openPath, openFileName);
                showNotif("Saved by peer", obj.clientId || "peer");
              }
            } else if (obj.event === "propagated") {
              pulseOnce();
              showNotif(
                "Propagated",
                JSON.stringify(obj.updated || obj.files || "")
              );
            }
          } catch (e) {
            console.warn("ws parse", e);
          }
        });
        ws.addEventListener("error", () => console.warn("ws err"));
        window.addEventListener("beforeunload", () => {
          if (openPath) releaseLock(openPath);
        });
      } catch (e) {
        console.warn("ws not available", e);
      }

      // Delegated click handler for wiki-links rendered in previews: open the PC folder.
      // This performs a case-insensitive match against folders in `Player Root/PCs`.
      document.addEventListener("click", async (ev) => {
        try {
          const a = ev.target.closest && ev.target.closest(".wikilink");
          if (!a) return;
          ev.preventDefault();
          let name = (
            a.getAttribute("data-wikilink") ||
            a.textContent ||
            ""
          ).trim();
          if (!name) return;
          // Normalize whitespace
          name = name.replace(/\s+/g, " ");

          // Try to find a case-insensitive match in Player Root/PCs
          try {
            const seg = encodeSegments("PCs");
            const res = await fetch(BASE + "/player_root/" + seg, {
              cache: "no-store",
            });
            if (res && res.ok) {
              const j = await res.json();
              const entries = j.entries || [];
              // Look for directory entries whose name matches case-insensitively
              const lower = name.toLowerCase();
              const match = entries.find(
                (e) =>
                  e.type === "dir" &&
                  String(e.name || "").toLowerCase() === lower
              );
              if (match) {
                const pcPath = "PCs/" + match.name;
                stack.push(pcPath);
                renderDir(pcPath);
                return;
              }
            }
          } catch (e) {
            // If fetching PCs failed, fall back to direct navigation
            console.warn("failed to fetch PCs for case-insensitive match", e);
          }

          // Fallback: navigate using the provided name as-is
          const pcPath = `PCs/${encodeURIComponent(name)}`;
          stack.push(pcPath);
          renderDir(pcPath);
        } catch (e) {
          console.warn("wikilink handler error", e);
        }
      });

      upBtn.addEventListener("click", () => {
        if (stack.length <= 1) return;
        stack.pop();
        renderDir(stack[stack.length - 1]);
      });
      const deletedBtn = document.getElementById("deleted-btn");
      if (deletedBtn) {
        deletedBtn.addEventListener("click", () => {
          // navigate to Player Root/deleted
          stack.push("deleted");
          renderDir("deleted");
        });
      }
      renderDir("");
    </script>
  </body>
</html>
