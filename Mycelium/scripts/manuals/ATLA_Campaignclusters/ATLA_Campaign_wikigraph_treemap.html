        <script charset="utf-8" src="https://cdn.plot.ly/plotly-3.1.0.min.js" integrity="sha256-Ei4740bWZhaUTQuD6q9yQlgVCMPBz6CZWhevDYPv93A=" crossorigin="anonymous"></script>                <div id="1f6543c4-74b1-437b-938f-a3b6459672e7" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script type="text/javascript">                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("1f6543c4-74b1-437b-938f-a3b6459672e7")) {                    Plotly.newPlot(                        "1f6543c4-74b1-437b-938f-a3b6459672e7",                        [{"branchvalues":"total","hovertemplate":"%{label}\u003cbr\u003e%{hovertext}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eMycelium scripts \u2014 quick manual\u003cbr\u003e!alttext\u003cbr\u003e...\u003c\u002fspan\u003e","","","","does saving still work?","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eTABLE:\u003cbr\u003e+-------------+-------+-------+-------+-------+-------+-------+---------+---------+-------+--------+----------+----------------------+--------------+\u003cbr\u003e...\u003c\u002fspan\u003e","","","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eWater\u003cbr\u003eEarth\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSuppress warnings for character sheet generator\u003cbr\u003eList of variable names (stems and display names) that should be exempted from\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eName: Anju\u003cbr\u003eCore Stats\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eType: Air Nomad Offshoot\u003cbr\u003eLocation: Cliffside plateaus bordering the Great Si Wong Desert\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLocation and Culture:\u003cbr\u003eNestled at the edge of the Si Wong Desert\u2019s shifting dunes, the Village of Mahzeen stands as a rare bastion of life in the arid wilderness. The settlement lies just a half-day\u2019s journey from an ancient Earthbending Temple, its sandstone spires visible on the distant horizon. Though not large, Mahzeen is renowned for its skilled Sandbenders, who have perfected a unique defensive technique that harnesses the versatile power of sand.\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDMPCs\u003cbr\u003eLotus\u003cbr\u003e...\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- Session 1 The Spirit Within\u003cbr\u003e- The Lotus Fractures\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- The Spirit Gauge\u2019s Purpose\u003cbr\u003e- Betrayals and Deceptions\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- The Avatar\u2019s Legacy\u003cbr\u003e- The Final Confrontation\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eTitle: Shattered Spirit, Rising Lotus\u003cbr\u003e- The Ceremony of the Lotus\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe Lotus\u003cbr\u003e- Home of the ceremony and spiritual hub.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAct 1: Unveiling the Threat\u003cbr\u003e- PCs discover they hold fragmented aspects of the Avatar Spirit.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e1. Balance vs. Independence:\u003cbr\u003eExplores centralized power vs. collective leadership.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eScene Setting:\u003cbr\u003eThe campaign begins at the serene Temple of the The Lotus, where benders from across the world gather for the annual Ceremony of the Lotus.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eStory\u003cbr\u003eLinks:\u003cbr\u003e...\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOrganisations\u003cbr\u003eOverview:\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eStat Overview\u003cbr\u003eGlobal environmental variables\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e\u00a71 This is all fun and games.\u003cbr\u003e\u00a71.1 For many people (including the author :D) a big part of the fun is the improv theater roleplaying in TTRPGs.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDefensive:\u003cbr\u003eMostly like DnD but Armor class is now called evasion and there is an Armor  for every kind of Damage (Damage Resistance) that reduces the damage taken per instance.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eHow hard it is to hit you\u003cbr\u003eBase Evasion: 10 + Dex + Airbending Level\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThese are attacks you only have under specific limited conditions or have to study from a master to learn.\u003cbr\u003ePlayer Root\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile\u003cbr\u003ePROBABLY NEEDS REBALANCING ON THE GO ALL THE TIME\u003cbr\u003e...\u003c\u002fspan\u003e","","Space to write down your puzzles and story connections","","inventory","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eEnvironmental\u003cbr\u003ename: testtrigger\u003cbr\u003e...\u003c\u002fspan\u003e","","markdown","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eWater\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eGlacial Temple\u003cbr\u003ePurpose: Spiritual sanctuary and waterbender training ground\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eProperties:\u003cbr\u003eThe water is infused with natural and spiritual properties, accelerating healing, soothing pain, and purging spiritual corruption. However, overuse or removal of too much water causes the spring to become turbulent and the Jellytee Spirit to grow agitated.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eForm: A luminescent, ethereal fusion of jellyfish and manatee. It drifts through the spring, emitting soft pulses of bioluminescence and humming vibrations.\u003cbr\u003eNature: Benevolent but sensitive to imbalance and greed. When pleased, it radiates a mist that calms the mind and heals minor ailments. When disturbed, the mist becomes turbulent and can induce hallucinations or intense emotional episodes.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLocation: Southern Water Tribe tundra, near the Glacial Temple\u003cbr\u003ePopulation: 150 permanent residents, swelling with visitors year-round\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eType: Water Tribe Island Village\u003cbr\u003eLocation: Remote island far from the Northern Water Tribe ice shelves\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe shimmering goldfish poop, once dismissed, is now reacting \u2014 humming faintly, vibrating when close to sacred texts or old chanting bowls in the temple. A monk, once skeptical, nervously confesses:\u003cbr\u003e&gt; \"There was\u2026 someone who always believed. The High Priest. Master Anzu.\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e\ud83c\udf49Glassfruit Watermelonsteamer\u003cbr\u003eMust be innitiated by a Earth or Waterbender and needs at least one level from each Elements Level. You can use Levels from up to two different Elements.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLocation: Glassline canyon near Omashu\u2019s lower shell district \u2013 jagged cliffs, semi-wild Glassfruit groves, and an unstable spiritual resonance.\u003cbr\u003eSituation:\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eBaezu \u2013 Earthbender Master of Resonance\u003cbr\u003eRole: Boss \u2013 Controller, Support, Spiritual Conduit\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOmashu \u2014 Glassfruit Terraces\u003cbr\u003eOn the outer cliffs and terraced slopes around Omashu grow the rare Glassfruit Trees. The city has long cultivated these trees as part of a local craft tradition that blends earth-working, horticulture, and elemental bending into a coordinated guild practice.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eHere\u2019s a structured quest write-up you can drop straight into your vault:\u003cbr\u003e---\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePlothook\u003cbr\u003eLocation: Omashu\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCity of Murmura\u003cbr\u003eTags: #PatolaMountainRange #Murmura #Airbending #Monastery\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCity of Zephyros\u003cbr\u003eTags: #PatolaMountainRange #Zephyros #Airbending #Monastery\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eEarmur\u003cbr\u003eTags: #PatolaMountainRange #Fauna #Soundbending\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview:\u003cbr\u003eTwin siblings from Sekan\u2019to whose seamless coordination has turned their unique dual-element fusion into an art form. They\u2019re local legends among younger benders and are being watched closely by the Crystalfire Circle.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e\ud83e\udded Hook Summary:\u003cbr\u003eWhile traveling the harsh Si Wong Desert, the heroes spot a mysterious gleam atop a sandstone spire\u2014a rhythmic flash of white light that appears unnatural, almost like a signal. Locals mention an ancient legend of a \u201cstar-serpent\u201d and a tribe of light-forgers hidden within the rock. The party must brave scorching winds, treacherous slopes, and possibly spiritual interference to uncover the truth.\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDC 17\u003cbr\u003eType: Greater Spirit\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e\ud83d\udcc4\u003cbr\u003eOverview:\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eElemental Roots: Firebending + Crystal-focused Earthbending\u003cbr\u003eNickname: Crystalfire Flash or Gleam-bending\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e\ud83c\udf0d Setting: Village of Sekan'to (Si Wong Desert)\u003cbr\u003e- Hidden within a towering mesa in the Si Wong Desert, Sekan'to is carved into rich quartz veins deep in the desert\u2019s sandstone spires.\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDescription\u003cbr\u003e- Appearance: A colossal peaceful and good spirit creature that is a hybrid between a toad and an elephant. It has thick, webbed feet, long elephant tusks, and a bloated, amphibian-like body with slick moist skin. Its texture resembles that of a toads \u2014 moist, clothed in simple silk robes. On its back is a disturbing cyst-like growth shaped like a smaller toad's face, with a trunk for a tongue hanging limply. The creature is ancient and wise, embodying Earth and Water, and is surrounded by a shimmering aura of mist.\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview\u003cbr\u003e- Location: Hidden beneath Si Wong Rock , central Si Wong Desert.\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eI maybe want an arc there between metalbender and airbender characters to find ways to woek together.\u003cbr\u003eType: Spirit Beast\u003cbr\u003e...\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eName: Kaedo\u003cbr\u003eAge: Mid-twenties\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA Dark humnaoid Cat like Spirit that has a large shard of Vaatu and was therefore corrupted early. He supresses the dark as good as he cans but the dark spirit also gives him the gifts to be an elite assasin. He only uses a little bit of airbending and is mostly waepon and archery based.\u003cbr\u003eRace\u002fType: Dark Humanoid Cat-like Spirit\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLinks:\u003cbr\u003e- Kaedo, the Young Sandbender Guide\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe Last Avatar\u003cbr\u003eFather of Kaedo\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLinks:\u003cbr\u003e- Stonewarden Garon\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLinks:\u003cbr\u003e- Rin Kotak\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eContext:\u003cbr\u003eImmediately after the group's victory over a corrupted spirit. Mahogany, the group's only spirit, has absorbed the entity\u2019s negative energy and purified it from within through a spiritual contest.\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe village of the Spidermonkeys\u003cbr\u003eAdventure:\u003cbr\u003e...\u003c\u002fspan\u003e","","","Overview of Earth Kingdom adventures, including themes like resilience, strength, and the challenges of navigating a vast and diverse region. Includes guidelines for integrating these modules with the larger campaign.","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview:\u003cbr\u003eThe Avatar spirit, the bridge between the physical and spiritual realms, is in a precarious state. During the final moments of the last Avatar\u2019s life, a catastrophic event caused the spirit\u2019s essence to splinter, disrupting the cycle of reincarnation and weakening its connection to the Spirit World.\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview of the purpose of the #Modules folder, including guidelines on how to scale the modules based on the party's power level and integrate them into the main campaign.\u003cbr\u003eModules\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eHere\u2019s a structured quest write-up you can drop straight into your vault:\u003cbr\u003e---\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSetup\u003cbr\u003eAfter examining the hedgehogkoala (\u201cSpikeberry\u201d), the Air Nomad family reveals they once heard of an Earthbender village a day\u2019s journey off the main road: Stonegrove. The people there cultivate Spiritberries, a crystalline glassfruit that glows faintly at night. These rare fruits are said to nourish both body and spirit, healing those who eat them and soothing spirit-beasts.\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCore Stats\u003cbr\u003eTABLE:\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCore Stats\u003cbr\u003eTABLE:\u003cbr\u003e...\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCore Stats\u003cbr\u003eTABLE:\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCharacter\u003cbr\u003e- Name: Ula\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eRin Kotak.png\u003cbr\u003ehe\u002fhim\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- Physical Description:\u003cbr\u003eA striking woman in her early forties with jet-black hair styled into an intricate braid that cascades down her back. Her pale blue eyes seem to pierce through her opponents, reflecting a sharp intellect and unshakable resolve. Her high cheekbones and angular features give her an almost regal appearance. She wears an ornate, high-collared cloak adorned with faintly glowing charms.\u003cbr\u003e...\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePlayer Root\u003cbr\u003eplayerroot\u nding Moves\u002f","Player Root\u002fPCs\u002fTiebeediy\u002fBending Rules - Tiebeediy\u002fSpirit\u002fSpiritbending Moves\u002fLevel 1\u002f","Player Root\u002fPCs\u002fTiebeediy\u002fBending Rules - Tiebeediy\u002fSpirit\u002fSpiritbending Moves\u002fLevel 1\u002f","Player Root\u002fPCs\u002fTiebeediy\u002fBending Rules - Tiebeediy\u002fSpirit\u002fSpiritbending Moves\u002fLevel 1\u002f","Player Root\u002fPCs\u002fTiebeediy\u002fBending Rules - Tiebeediy\u002fSpirit\u002fSpiritbending Moves\u002fLevel 1\u002f","Player Root\u002fPCs\u002fTiebeediy\u002fBending Rules - Tiebeediy\u002fSpirit\u002fSpiritbending Moves\u002f","Player Root\u002fPCs\u002fTiebeediy\u002fBending Rules - Tiebeediy\u002fSpirit\u002fSpiritbending Moves\u002fLevel 2\u002f","Player Root\u002fPCs\u002fTiebeediy\u002fBending Rules - Tiebeediy\u002fSpirit\u002fSpiritbending Moves\u002fLevel 2\u002f","Player Root\u002fPCs\u002fTiebeediy\u002fBending Rules - Tiebeediy\u002fSpirit\u002fSpiritbending Moves\u002fLevel 2\u002f"],"text":["\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eMycelium scripts \u2014 quick manual\u003cbr\u003e\u003cbr\u003e!alttext\u003cbr\u003eThis README explains the Mycelium\u002fscripts utilities in this repository, how they interact with the Player Root folder, and quick workflows for a DM or a Player.\u003cbr\u003e\u003cbr\u003eWhat these scripts do\u003cbr\u003e\u003cbr\u003e- Mycelium\u002fscripts\u002fappendbacklinks.py \u2014 scans markdown files for wikilink tokens and (dry-run by default) produces a ## Backlinks section listing incoming links; use --apply to write changes.\u003cbr\u003e- Mycelium\u002fscripts\u002fbuildtagbacklinks.py \u2014 scans for hashtag-style tags (e.g. #NightBloom) and writes per-tag summary files under an output dir (dry-run by default; --apply to write).\u003cbr\u003e- Mycelium\u002fscripts\u002fanimatepagerank.py \u2014 builds a self-contained HTML animation from timestamped snapshot files named like &lt;timestamp&gt;&lt;root&gt;.md (parses JSON blocks or markdown tables).\u003cbr\u003e- Mycelium\u002fscripts\u002fgrowmushroom.py \u2014 a proxy that delegates to the Python implementation under Mycelium\u002fscripts\u002fPython if present.\u003cbr\u003e\u003cbr\u003eHow they relate to Player Root\u003cbr\u003e\u003cbr\u003e- The scripts scan the repository for .md files (including files under Player Root\u002fPCs, Player Root\u002fNPCs, Player Root\u002fRules, Player Root\u002fOrganisations, Player Root\u002fvariable, etc.).\u003cbr\u003e- appendbacklinks.py will add Obsidian-style links relative\u002fpath\u002fto\u002ffile into target files so you can see where a PC, NPC or location is referenced.\u003cbr\u003e- buildtagbacklinks.py aggregates tag usage into TagSummaries\u002f (by default), giving a quick index of all files mentioning a tag.\u003cbr\u003e- animatepagerank.py reads snapshot files (eg 20250915Player Root.md) and produces an HTML animation useful for visualising changing prominence of PCs\u002fNPCs\u002flocations over time.\u003cbr\u003e\u003cbr\u003eQuick commands (run from repo root)\u003cbr\u003e\u003cbr\u003e- Dry-run backlink scan:\u003cbr\u003e  python3 Mycelium\u002fscripts\u002fappendbacklinks.py --root .\u003cbr\u003e- Apply backlinks (writes files):\u003cbr\u003e  python3 Mycelium\u002fscripts\u002fappendbacklinks.py --root . --apply\u003cbr\u003e- Build tag summaries (dry-run):\u003cbr\u003e  python3 Mycelium\u002fscripts\u002fbuildtagbacklinks.py --root . --outdir TagSummaries\u003cbr\u003e- Write tag summaries:\u003cbr\u003e  python3 Mycelium\u002fscripts\u002fbuildtagbacklinks.py --root . --outdir TagSummaries --apply\u003cbr\u003e- Create PageRank animation from snapshots in Player Root:\u003cbr\u003e  python3 Mycelium\u002fscripts\u002fanimatepagerank.py --dir \"Player Root\" --out \"Player Root\u002fmyceliumanimation.html\" doesn't work yet\u003cbr\u003e\u003cbr\u003eDM recommended workflow\u003cbr\u003e\u003cbr\u003ewrite your Dms notes into a folder that you list in .gitgnore like Dms Root\u003cbr\u003e\u003cbr\u003e1. Commit or copy the repo as a backup.\u003cbr\u003e2. Run backlink dry-run and inspect the preview:\u003cbr\u003e   python3 Mycelium\u002fscripts\u002fappendbacklinks.py --root .\u003cbr\u003e3. If satisfied, apply backlinks:\u003cbr\u003e   python3 Mycelium\u002fscripts\u002fappendbacklinks.py --root . --apply\u003cbr\u003e4. Build tag summaries for session prep:\u003cbr\u003e   python3 Mycelium\u002fscripts\u002fbuildtagbacklinks.py --root . --apply\u003cbr\u003e5. If you maintain periodic snapshots, generate an animation and open the HTML to visualise story prominence.\u003cbr\u003e\u003cbr\u003ePlayer quick usage \u2014 where to find everything about your character\u003cbr\u003e\u003cbr\u003ePlayers: most of the information about a character is stored in the PCs folder. Look in Player Root\u002fPCs\u002f (player-facing area) depending on your group's workflow. Or edit general information about the world or npc in files on the whole Player Root with your content. Feel free to write create files for bending moves just tag them with #playercreatedrule to clarify its not yet been cleared officially yet or it still needs work.\u003cbr\u003e\u003cbr\u003eWhat to look for:\u003cbr\u003e\u003cbr\u003e- Character sheet file (usually &lt;Name&gt; character sheet.md) \u2014 canonical stats\u003cbr\u003e- Session notes and encounters \u2014 files whose titles describe an event; these contain context and references to the PC.\u003cbr\u003e- Images and media \u2014 look for PNG\u002fJPG files in the same folder (some characters have portraits next to their MD file).\u003cbr\u003e- Backups \u2014 files ending in .bak are safe copies made previously.\u003cbr\u003e\u003cbr\u003eBacklinks and tags (how to find cross-references):\u003cbr\u003e\u003cbr\u003e- After the DM runs the repo tools (recommended), each character file will include a ## Backlinks section listing files that refer to that PC. Open your PC file and scroll to ## Backlinks to see where you've been mentioned.\u003cbr\u003e- The DM may also generate TagSummaries\u002f (e.g. TagSummaries\u002fNightBloom\u002fNightBloom.md) which collects all files using a particular #tag (useful for themes, factions, or story hooks).\u003cbr\u003e\u003cbr\u003eIf you want to preview changes locally (read-only):\u003cbr\u003e\u003cbr\u003epython3 Mycelium\u002fscripts\u002fappendbacklinks.py --root .\u003cbr\u003epython3 Mycelium\u002fscripts\u002fbuildtagbacklinks.py --root .\u003cbr\u003e\u003cbr\u003eThese run in dry-run mode by default and will print previews; do not run --apply unless you are coordinating with the DM.\u003cbr\u003e\u003cbr\u003eSafety &amp; tips\u003cbr\u003e\u003cbr\u003e- Both backlink and tag scripts default to dry-run; always preview before --apply.\u003cbr\u003e- Back up or commit before running --apply.\u003cbr\u003e- appendbacklinks.py will include PageRank info if Mycelium\u002fpagerank.json exists.\u003cbr\u003e- Snapshot files must match the pattern ^\\d+.\\.md$ for animatepagerank.py to detect them.\u003cbr\u003e\u003cbr\u003eWant automation?\u003cbr\u003e\u003cbr\u003eIf you want, create a small wrapper script that commits first, runs the scans with --apply, and exports the animation\u2014I'll help create it.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eGenerated: concise usage guide for Mycelium scripts and Player Root integration.\u003c\u002fspan\u003e","","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003edoes saving still work?\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eTABLE:\u003cbr\u003e+-------------+-------+-------+-------+-------+-------+-------+---------+---------+-------+--------+----------+----------------------+--------------+\u003cbr\u003e| Name        | STR   | DEX   | CON   | INT   | WIS   | RIZ   | Water   | Earth   | Air   | Fire   | Spirit   | Manually Rolled HP   | Run Update   |\u003cbr\u003e+-      | 95      |\u003cbr\u003e| current hp   | 95      |\u003cbr\u003e+--------------+---------+\u003cbr\u003eDefensive\u003cbr\u003eTABLE:\u003cbr\u003e+-----------------+--------+---------+\u003cbr\u003e| key             | Base   | Bonus   |\u003cbr\u003e+-----------------+--------+---------+\u003cbr\u003e| Evasion         | 11     | 0       |\u003cbr\u003e| General Armor   | 1      | 0       |\u003cbr\u003e+-----------------+--------+---------+\u003cbr\u003e\u003cbr\u003eBending Slots\u003cbr\u003eTABLE:\u003cbr\u003e+----------------------+----------+\u003cbr\u003e| Slot                 | Amount   |\u003cbr\u003e+----------------------+----------+\u003cbr\u003e| Waterbottle charge   | 4        |\u003cbr\u003e| Earthbending slot    | 2        |\u003cbr\u003e+----------------------+----------+\u003cbr\u003e\u003cbr\u003eenvironmentalvariables\u003cbr\u003eTABLE:\u003cbr\u003e+------------------------------+---------+\u003cbr\u003e| Environmental Variable       | value   |\u003cbr\u003e+------------------------------+---------+\u003cbr\u003e| environmental water charge   | 83      |\u003cbr\u003e|                              |         |\u003cbr\u003e+------------------------------+---------+\u003cbr\u003e\u003cbr\u003eAnju #CharacterSheet\u003cbr\u003e\u003cbr\u003e&gt; WARNING: The following character stats could not be placed by context and were appended:\u003cbr\u003eTABLE:\u003cbr\u003e+-------------------------------+------+\u003cbr\u003e| environmental water charges   | 20   |\u003cbr\u003e+-------------------------------+------+\u003cbr\u003e| Water charge                  | 24   |\u003cbr\u003e+-------------------------------+------+\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eType: Air Nomad Offshoot  \u003cbr\u003eLocation: Cliffside plateaus bordering the Great Si Wong Desert  \u003cbr\u003eRole: High-speed messengers, scouts, and storm-chasers of the desert  \u003cbr\u003eSpecialized Style: Thermal Riding\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003e\u003cbr\u003eThe Crimson Sails are a unique, nomadic sect of Air Nomads adapted to life on the edge of the Si Wong Desert. They do not dwell in temples or static sanctuaries, but aboard elegant skiffs and gliders designed to harness the fierce thermal currents that rise from the sun-scorched sand. Painted in brilliant reds and ochres, their vessels shimmer like embers in the sky.\u003cbr\u003e\u003cbr\u003eBound by the winds and the rhythms of the desert heat, the Crimson Sails are expert couriers, capable of crossing vast expanses far faster than beasts or traditional caravans. However, their airbending is heavily dependent on the desert\u2019s thermal conditions; at night, without the rising heat, they become grounded or slow-moving.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCulture\u003cbr\u003e\u003cbr\u003e- Daybound Nomadism: Their society revolves around daylight. At night, the flotilla anchors to cliff alcoves or ruins. Festivals, meals, and gatherings are nocturnal, while travel and work occur during the heat of the day.\u003cbr\u003e    \u003cbr\u003e- Messenger Guild: The Crimson Sails operate an informal courier and intelligence network across the Earth Kingdom desert frontier. They are trusted by traders, desert clans, and outposts to deliver messages, maps, and even small goods.\u003cbr\u003e    \u003cbr\u003e- Spiritual Traditions: Though descended from the Air Nomad monastic line, the Crimson Sails follow a more animistic interpretation of airbending\u2014viewing the desert winds as living spirits that must be listened to, not commanded.\u003cbr\u003e    \u003cbr\u003e- Cliff Shrines: Instead of temples, they maintain wind shrines at high cliffs where they meditate and commune with the desert wind spirits.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAirbending Style: Thermal Riding\u003cbr\u003e\u003cbr\u003eA fast, acrobatic form of airbending that specializes in using heat-induced updrafts. Unlike traditional circular airbending, Thermal Riding involves linear acceleration, vertical climbs, and divebomb maneuvers.\u003cbr\u003e\u003cbr\u003eKey Techniques\u003cbr\u003e\u003cbr\u003e- Updraft Spear: Used for rapid vertical ascents or launching allies over obstacles.\u003cbr\u003e    \u003cbr\u003e- Searing Glide: Gliders skim hot surfaces to catch lift or create sudden evasions.\u003cbr\u003e    \u003cbr\u003e- Cyclone Lance: A spiraling dive technique combining momentum and pressure for duels.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eKey Figures\u003cbr\u003e\u003cbr\u003e- Sister Nhari: Elder wind-priestess and navigator. Keeper of the Flame Charts\u2014ancient wind maps burned into silk.\u003cbr\u003e    \u003cbr\u003e- Korran of the Lances: Champion aerial jouster and defense leader of the flotilla.\u003cbr\u003e    \u003cbr\u003e- Tama Reed-Singer: Renowned messenger known for solo crossings of the Empty Expanse.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eConflicts &amp; Hooks\u003cbr\u003e\u003cbr\u003e- A Night-Time Ambush: Without thermal lift, the Crimson Sails are vulnerable after dark. A rival faction may exploit this to sabotage a key courier mission.\u003cbr\u003e    \u003cbr\u003e- Desert Spirits Stirring: Strange wind patterns and dust devils are interfering with their gliding. Is it natural\u2014or something darker awakening beneath the sands?\u003cbr\u003e    \u003cbr\u003e- A Lost Shrine: A sandstorm uncovers an ancient Air Nomad relic near a long-buried cliff shrine. The Crimson Sails must recover it before sandbenders do.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eConnections\u003cbr\u003e\u003cbr\u003e- Allies of the Si Wong Water Raiders for mutual desert survival.\u003cbr\u003e    \u003cbr\u003e- Sometimes in conflict with Sandbender Tribes who view them as sky-interlopers.\u003cbr\u003e    \u003cbr\u003e- Rumored to ferry secrets for the White Lotus across desert borders.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLocation and Culture:\u003cbr\u003e\u003cbr\u003eNestled at the edge of the Si Wong Desert\u2019s shifting dunes, the Village of Mahzeen stands as a rare bastion of life in the arid wilderness. The settlement lies just a half-day\u2019s journey from an ancient Earthbending Temple, its sandstone spires visible on the distant horizon. Though not large, Mahzeen is renowned for its skilled Sandbenders, who have perfected a unique defensive technique that harnesses the versatile power of sand.\u003cbr\u003e\u003cbr\u003eThe villagers live in dome-shaped tents woven from desert fibers, arranged around a central oasis fed by a hidden spring. Worn banners and intricate stone carvings display their heritage: guardians of the desert\u2019s secrets, proud custodians of a bending style that focuses on defense, endurance, and cunning ambush tactics. These Sandbenders follow a strict code of balance, taught to them by the temple monks long ago.\u003cbr\u003e\u003cbr\u003eThe Sandbending Technique: \u201cSpiked Sand Sphere\u201d\u003cbr\u003e\u003cbr\u003eThe hallmark ability of Mahzeen\u2019s Sandbenders is the creation of a swirling sphere of sand that hardens into a protective shell adorned with razor-like spikes of hardened silica. Both a shield and a weapon, it reflects their philosophy\u2014protection first, then retribution.\u003cbr\u003e\u003cbr\u003eMechanics:\u003cbr\u003e\u003cbr\u003e- Cost: 3 Earth (or Sand) Charges\u003cbr\u003e    \u003cbr\u003e- Type: Action\u003cbr\u003e    \u003cbr\u003e- Range: Self\u003cbr\u003e    \u003cbr\u003e- Effect:  \u003cbr\u003e    The Sandbender calls upon the shifting dunes, pulling grains of sand from the ground and condensing them into a floating sphere around their body. The sphere grants temporary hit points and can lash out with sharp spikes.\u003cbr\u003e    \u003cbr\u003e    - Temporary Hit Points (THP): Gain THP equal to 3 times your level (or a number appropriate for your system) when you form the Spiked Sand Sphere.\u003cbr\u003e    - Defensive Bonus: While the sphere is active, you gain +1 to your Evasion Score and +2 to your AR (or equivalent defensive bonus in your ruleset).\u003cbr\u003e    - Duration: Concentration, up to 1 minute, or until the THP are depleted.\u003cbr\u003e\u003cbr\u003eAttacking with the Sphere:\u003cbr\u003e\u003cbr\u003e- As a Bonus Action (or Reaction when hit by a melee attack), you can command the spikes to strike out at a foe within 5 ft.\u003cbr\u003e- Attack Roll: Strength + Proficiency vs. Target\u2019s Evasion Score.\u003cbr\u003e- Damage: 1d8 + Strength modifier piercing damage.\u003cbr\u003e- Scaling Damage: The damage die increases by 1 step (e.g., from 1d8 to 1d10) for every 5 remaining THP in the sphere. For example:\u003cbr\u003e    - 15+ THP: 1d10 damage\u003cbr\u003e    - 10+ THP: 1d8 damage\u003cbr\u003e    - 5+ THP: 1d6 damage\u003cbr\u003e    - &lt;5 THP: 1d4 damage\u003cbr\u003e\u003cbr\u003eAs the THP are chipped away by enemy strikes and your own attacks, the sphere\u2019s integrity diminishes. Fewer remaining THP means smaller, less potent spikes. Skilled Sandbenders learn how to maintain their focus, refortify the sand with additional Charges, or time their attacks at the peak of the sphere\u2019s resilience.\u003cbr\u003e\u003cbr\u003eIn-World Significance:\u003cbr\u003e\u003cbr\u003e- Training and Tradition:  \u003cbr\u003e    Mahzeen\u2019s Sandbenders perfect the Spiked Sand Sphere technique through years of practice in the harsh desert climate. Initiates spend countless hours balancing water gourds atop columns of shifting sand, refining their focus to keep the sphere stable under pressure.\u003cbr\u003e    \u003cbr\u003e- Trade and Diplomacy:  \u003cbr\u003e    Adventurers and scholars traveling to the nearby Earth Temple often stop at Mahzeen to hire guides or seek instruction. Monks from the temple once taught the villagers about spiritual discipline and fortitude, and in return, the Sandbenders offer them their protective services against raiders and feral spirits that prowl the dunes.\u003cbr\u003e    \u003cbr\u003e- Rites of Passage:  \u003cbr\u003e    Young Sandbenders earn their place in Mahzeen\u2019s society by successfully conjuring and maintaining a Spiked Sand Sphere under trial conditions\u2014fending off controlled attacks from elders. Only then may they wear the village\u2019s distinctive sand-silk armbands, signifying their mastery of this unique technique.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eIn this way, the Spiked Sand Sphere embodies the village\u2019s identity: resilience in adversity, measured strength, and harmony with the unforgiving desert world they call home.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Proficiency\u003cbr\u003e- Strength\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDMPCs\u003cbr\u003eLotus\u003cbr\u003eNight Bloom\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- Session 1 The Spirit Within\u003cbr\u003e- The Lotus Fractures\u003cbr\u003e- Building Alliances\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Session 1 The Spirit Within\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- The Spirit Gauge\u2019s Purpose\u003cbr\u003e- Betrayals and Deceptions\u003cbr\u003e- The Shadowed Spirits\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- The Avatar\u2019s Legacy\u003cbr\u003e- The Final Confrontation\u003cbr\u003e- The Avatar Reborn\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eTitle: Shattered Spirit, Rising Lotus\u003cbr\u003e\u003cbr\u003e- The Ceremony of the Lotus\u003cbr\u003e- Main Story Arc A Shattered Avatar Spirit\u003cbr\u003e- Recurring Themes and Player Agency\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Recurring Themes and Player Agency\u003cbr\u003e- The Lotus\u003cbr\u003e- The Ceremony of the Lotus\u003cbr\u003e- Main Story Arc A Shattered Avatar Spirit\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe Lotus\u003cbr\u003e\u003cbr\u003e- Home of the ceremony and spiritual hub.\u003cbr\u003e\u003cbr\u003eCeremony of the Resonance\u003cbr\u003e\u003cbr\u003e- Celebration of unity, balance, and bending mastery.\u003cbr\u003e\u003cbr\u003eNight Bloom\u003cbr\u003e\u003cbr\u003e- Radical faction opposing the Avatar\u2019s central role.\u003cbr\u003e\u003cbr\u003eResonance Jade\u003cbr\u003e\u003cbr\u003e- Artifact measuring spiritual energy.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAct 1: Unveiling the Threat\u003cbr\u003e\u003cbr\u003e- PCs discover they hold fragmented aspects of the Avatar Spirit.\u003cbr\u003e- Internal conflict: heightened bending abilities without unity.\u003cbr\u003e- Night Bloom\u2019s origins tied to a Lotus Fracture.\u003cbr\u003e\u003cbr\u003eAct 2: The Rise of the Night Bloom\u003cbr\u003e\u003cbr\u003e- Spirit Gauge\u2019s potential to destabilize balance.\u003cbr\u003e- Betrayals within the White Lotus.\u003cbr\u003e- Growing attacks from corrupted spirits.\u003cbr\u003e\u003cbr\u003eAct 3: The Broken Avatar\u003cbr\u003e\u003cbr\u003e- Truth of the Avatar\u2019s death and shattered spirit.\u003cbr\u003e- Final confrontation: Combine spirits to reform Avatar or share the essence among the group.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e1. Balance vs. Independence:  \u003cbr\u003e    Explores centralized power vs. collective leadership.\u003cbr\u003e    \u003cbr\u003e2. Personal Growth:  \u003cbr\u003e    Each PC\u2019s arc reflects their fragment of the Avatar Spirit.\u003cbr\u003e    \u003cbr\u003e3. Moral Dilemmas:  \u003cbr\u003e    The Night Bloom\u2019s ideals resonate with many; their morality isn\u2019t black and white.\u003cbr\u003e    \u003cbr\u003e4. Worldbuilding:  \u003cbr\u003e    Encourage player input for designing clans, bending styles, and spiritual entities.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eScene Setting:\u003cbr\u003e\u003cbr\u003eThe campaign begins at the serene Temple of the The Lotus, where benders from across the world gather for the annual Ceremony of the Lotus.\u003cbr\u003e\u003cbr\u003e- PCs arrive as prodigies of their respective arts.\u003cbr\u003e- Subtle unease: elders whisper of spiritual disturbances.\u003cbr\u003e- PCs feel a fleeting resonance, but there\u2019s no spiritual response\u2014an ill omen.\u003cbr\u003e\u003cbr\u003eThe Attack on the Ceremony:\u003cbr\u003e\u003cbr\u003e- Smokebomb and the Voice:  \u003cbr\u003e    A black mist explosion (orchestrated by Isai Trekal) disrupts the ceremony.  \u003cbr\u003e    Voice: \u201cThe age of bending submission is over...\u201d\u003cbr\u003e    \u003cbr\u003e- Artifact Theft:  \u003cbr\u003e    The Order of the Night Bloom steals the Resonance Jade.\u003cbr\u003e    \u003cbr\u003e- Rogue Spirit Attack:  \u003cbr\u003e    PCs fend off a corrupted spirit, feeling faint resonance from the ritual during combat.\u003cbr\u003e    \u003cbr\u003e- Aftermath:  \u003cbr\u003e    The artifact is gone, and the PCs are tasked with investigating the theft.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Night Bloom\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eStory\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Act 2 The Rise of the Night Bloom\u003cbr\u003e- Campaign Overview\u003cbr\u003e- Act 1 Unveiling the Threat\u003cbr\u003e- The Ceremony of the Lotus\u003cbr\u003e- Key Groups and Concepts\u003cbr\u003e- Recurring Themes and Player Agency\u003cbr\u003e- Main Story Arc A Shattered Avatar Spirit\u003cbr\u003e- Session 1 The Spirit Within\u003cbr\u003e- Act 3 The Broken Avatar\u003cbr\u003e- Modules\u003cbr\u003e- \u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOrganisations\u003cbr\u003eOverview:\u003cbr\u003e\u003cbr\u003eThe Lotus is a venerable organization dedicated to the balance of the world, acting as spiritual guides and protectors of harmony. They host the annual Ceremony of the Resonance, symbolizing their commitment to unity among benders.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eUniform Design:\u003cbr\u003e\u003cbr\u003e- Colors:  \u003cbr\u003e    White and gold, symbolizing purity and enlightenment, with accents of light blue to represent spiritual connection.\u003cbr\u003e    \u003cbr\u003e- Style:\u003cbr\u003e    \u003cbr\u003e    - Flowing robes for spiritual leaders, with a lotus emblem embroidered on the chest.\u003cbr\u003e    - Soldiers wear sturdy uniforms with plated armor on shoulders and bracers, designed for mobility and defense.\u003cbr\u003e- Details:\u003cbr\u003e    \u003cbr\u003e    - A sash or belt with a lotus motif, denoting rank.\u003cbr\u003e    - Masks for combat troops, styled after serene and neutral faces, emphasizing their role as impartial protectors.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Mistress Akira Meiyu\u003cbr\u003e- Armor definition\u003cbr\u003e- Strength\u003cbr\u003e- Stonewarden Garon\u003cbr\u003e- Wisdom\u003cbr\u003e- Grandmaster Iroh Tanaka\u003cbr\u003e- The Lotus\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eFirebending\u003cbr\u003eWaterbending\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eStat Overview\u003cbr\u003e\u003cbr\u003eGlobal environmental variables\u003cbr\u003eTABLE:\u003cbr\u003e+----------------------------+---------+--------------------------------------------------------------+------------------------------------------------------------------+\u003cbr\u003e| Name                       | Value   | Tags                                                         | File                                                             |\u003cbr\u003e+----------------------------+---------+--------------------------------------------------------------+------------------------------------------------------------------+\u003cbr\u003e| environmentalwatercharge   | 11      | #variable #secondarystat #template #environmentalvariables   | Player Root\u002fvariable\u002fenvironmental\u002fenvironmentalwatercharge.md   |\u003cbr\u003e+----------------------------+---------+--------------------------------------------------------------+------------------------------------------------------------------+\u003cbr\u003e\u003cbr\u003ePer-PC extracted stats\u003cbr\u003e\u003cbr\u003eAnju\u003cbr\u003eTABLE:\u003cbr\u003e+-----------------+---------+------------------------------------------------+\u003cbr\u003e| Key             | Value   | Source File                                    |\u003cbr\u003e+-----------------+---------+------------------------------------------------+\u003cbr\u003e| maxhp           | 95      | Player Root\u002fPCs\u002fAnju\u002fAnjuvariables.md          |\u003cbr\u003e| \u003cbr\u003e+-----------------+---------+---------------------------------------------------+\u003cbr\u003e\u003cbr\u003eLast generated by Mycelium\u002fscripts\u002fPython\u002fgeneratestatoverview.py\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e\u00a71 This is all fun and games.\u003cbr\u003e\t\u00a71.1 For many people (including the author :D) a big part of the fun is the improv theater roleplaying in TTRPGs. \u003cbr\u003e\tSome people like the Characterbuilding and creating a personality and fleshed out character how they imagine it. Both are valid but it needs to be communicated that i want to keep it generally in a very \"yes and...\" kind of style but always accept a \"no id rather have it like...\".\u003cbr\u003e\t\t1.1.1 That being said this also applies to world building and lore so feel free to worldbuild yourself a bit either spontanously during roleplay or planned out for bigger worldbuilding projects (e.g. \"I had an idea for a watertribe that uses plantbending algae as boats for their lake\"(and discussed with the GM)).\u003cbr\u003e\u003cbr\u003e\u00a72 I will try my best to nerve and buff bending moves how i think fits best. \u003cbr\u003e\t2.1 This may also include giving them more roleplaying opportunities to find bending teachers or similar to acquire new skills and bending Moves.\u003cbr\u003e\u003cbr\u003e\u00a73 I'm trying some more experimental mechanics that may be fun for me but not so fun for others. So always accept constructive feedback and \u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDefensive:\u003cbr\u003e\tMostly like DnD but Armor class is now called evasion and there is an Armor  for every kind of Damage (Damage Resistance) that reduces the damage taken per instance.\u003cbr\u003e\tThe Damage types will be the same as in Dnd\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Armor definition\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eHow hard it is to hit you\u003cbr\u003eBase Evasion: 10 + Dex + Airbending Level\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThese are attacks you only have under specific limited conditions or have to study from a master to learn.\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003ePROBABLY NEEDS REBALANCING ON THE GO ALL THE TIME\u003cbr\u003eJoining Moves:  \u003cbr\u003eBenders can combine their abilities to create more powerful or creative effects, guided by the \"rule of cool.\" This allows for dynamic and collaborative gameplay that rewards teamwork.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eConditions to Join:\u003cbr\u003e\u003cbr\u003e- Proximity: You must be within 10 feet of the ally initiating the Move.\u003cbr\u003e- Action Type: Joining the Move requires using your Reaction.\u003cbr\u003e- Move Compatibility: The same Move does not need to be performed at the same Level Slot as the initiating Bender.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEffect:  \u003cbr\u003eCombining Moves enhances their overall power or effect. For example, if an ally uses Fireburst, and you join in, the resulting effect could be strong enough to burst through a stone wall.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOptional Variant:  \u003cbr\u003eYou can also combine different Moves if you can explain how they interact. For instance:\u003cbr\u003e\u003cbr\u003e- A Mud Wall created by an Earthbender could be reinforced with an Ice Wall from a Waterbender, resulting in a sturdier barrier with sharp ice spike defenses.  \u003cbr\u003e    This opens opportunities for creative problem-solving and innovative combinations, adding depth to gameplay.\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Teamwork Moves --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u003cbr\u003e\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSpace to write down your puzzles and story connections\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003einventory\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eEnvironmental\u003cbr\u003ename: testtrigger\u003cbr\u003evalue: 123\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eWater\u003cbr\u003eEarth\u003cbr\u003eFire\u003cbr\u003eAir\u003cbr\u003eSpirit\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eGlacial Temple\u003cbr\u003e\u003cbr\u003ePurpose: Spiritual sanctuary and waterbender training ground  \u003cbr\u003eArchitecture: A glimmering structure partially embedded in ice, with prayer flags fluttering around open, steam-warmed courtyards.\u003cbr\u003e\u003cbr\u003eLore:  \u003cbr\u003eBuilt above the Healing Spring of Akara, the Glacial Temple is both a spiritual hub and defensive bastion. It\u2019s home to the Order of the Veiled Mist, a sect of waterbenders trained in Players Part\u002fRules\u002fBending Rules\u002fWater\u002fWaterbending Moves\u002fCantrips\u002fMistbending \u2014 a sacred technique taught only to those deemed spiritually attuned by the Jellytee Spirit.\u003cbr\u003e\u003cbr\u003eAccess to the temple is restricted. Pilgrims may offer prayers at the base, but only those with permission from the High Acolyte may enter the inner sanctum or take water directly from the spring.\u003cbr\u003e\u003cbr\u003eTemple Customs:\u003cbr\u003e\u003cbr\u003e- No artificial fire within the inner sanctum.\u003cbr\u003e    \u003cbr\u003e- Offerings must include a piece of handwoven fabric dipped in the spring.\u003cbr\u003e    \u003cbr\u003e- All initiates take a vow of vapor \u2014 a month-long silence.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eProperties:  \u003cbr\u003eThe water is infused with natural and spiritual properties, accelerating healing, soothing pain, and purging spiritual corruption. However, overuse or removal of too much water causes the spring to become turbulent and the Jellytee Spirit to grow agitated.\u003cbr\u003e\u003cbr\u003eLimits:\u003cbr\u003e\u003cbr\u003e- Only a limited volume can be extracted per day.\u003cbr\u003e    \u003cbr\u003e- Excessive exposure can dull pain but doesn\u2019t cure deeper ailments unless sanctioned by the temple.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eForm: A luminescent, ethereal fusion of jellyfish and manatee. It drifts through the spring, emitting soft pulses of bioluminescence and humming vibrations.  \u003cbr\u003eNature: Benevolent but sensitive to imbalance and greed. When pleased, it radiates a mist that calms the mind and heals minor ailments. When disturbed, the mist becomes turbulent and can induce hallucinations or intense emotional episodes.\u003cbr\u003e\u003cbr\u003eVery emotionally unstable and the waterbenders have to be super careful not to disturb the water as the manatee starts to cry and throw a tantrum when they do.\u003cbr\u003e\u003cbr\u003e---\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLocation: Southern Water Tribe tundra, near the Glacial Temple  \u003cbr\u003ePopulation: 150 permanent residents, swelling with visitors year-round  \u003cbr\u003eNotable Feature: The Healing Spring of Akara, which emits a continuous healing mist due to the presence of the Jellytee Spirit\u003cbr\u003e\u003cbr\u003eDescription:  \u003cbr\u003eAkara is a quiet, snow-dusted village nestled against a glacial ridge. Built in concentric circles around the Healing Spring of Akara, the town's layout reflects the cultural importance of balance and flow. Small wooden homes carved with oceanic motifs cluster closer to the spring, with larger communal and guest housing further out.\u003cbr\u003e\u003cbr\u003eThe village has become a sacred pilgrimage site for the chronically ill, terminally afflicted, and spirit-touched. While the Healing Spring of Akara's waters are said to be miraculous, the villagers are extremely cautious in how much water they allow to be drawn, in reverence to the Jellytee Spirit.\u003cbr\u003e\u003cbr\u003eKey NPCs:\u003cbr\u003e\u003cbr\u003e- High Acolyte Siva: Stoic leader of the temple, acts as intermediary between villagers and the Jellytee Spirit.\u003cbr\u003e    \u003cbr\u003e- Healer Rokan: Master of the Players Part\u002fRules\u002fBending Rules\u002fWater\u002fWaterbending Moves\u002fCantrips\u002fMistbending technique, teaches selected apprentices.\u003cbr\u003e    \u003cbr\u003e- Elder Tumaq: Village elder, keeper of oral history and taboos.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWould you like to expand this into a quest hook, adventure arc, or introduce tensions like outsiders exploiting the spring?\u003cbr\u003e\u003cbr\u003eYou said:\u003cbr\u003e\u003cbr\u003egreat now also add a little monplogue of the jellytee spirit. It is super whinie and moody and cries when water gets removed\u003cbr\u003e\u003cbr\u003eChatGPT said:\u003cbr\u003e\u003cbr\u003ePerfect! Here\u2019s a whimsical and moody monologue from the Jellytee Spirit, capturing its overly emotional, whiny personality. This could be delivered during a vision in the mist or heard echoing through the spring when someone tries to take more than their share of water:\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMonologue of the Jellytee Spirit\u003cbr\u003e\u003cbr\u003e&gt; The mist thickens. Light pulses softly from below the water. A voice, melodious yet dripping with exaggerated sorrow, rings out through the temple\u2019s chamber...\u003cbr\u003e\u003cbr\u003e\"Oooohhh noooo... not agaaaain... why must you always take? I just got the spring balanced. My nerves\u2014my poor, fluttery nerves! You don\u2019t understand how hard it is to keep the mist pretty and shimmery when you\u2019re all down here sloshing and scooping like hungry pelicans!\"\u003cbr\u003e\u003cbr\u003e\"Do you know what it\u2019s like to live in a sacred spring? It\u2019s cold, it's bright, and people are always touching stuff. I\u2014we\u2014me! I need peace! And you\u2014you greedy water-sucking little surface-crawlers\u2014never think about me!\"\u003cbr\u003e\u003cbr\u003e(sniffs dramatically, bubble trails forming in the water)\u003cbr\u003e\u003cbr\u003e\"Fine. Take a few drops, go ahead. It\u2019s not like I matter. Just the ancient sacred spirit who lives in this place. That\u2019s fine. That\u2019s totally fine.\"\u003cbr\u003e\u003cbr\u003e(beat)\u003cbr\u003e\u003cbr\u003e\"...But if you take more than one flask I will emotionally devastate you.\"\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eType: Water Tribe Island Village  \u003cbr\u003eLocation: Remote island far from the Northern Water Tribe ice shelves  \u003cbr\u003eAffinity: Waterbending, Spirits\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003e\u003cbr\u003eKugluktup is a secretive and remote waterbending village located on a rugged island surrounded by turbulent seas. It lies several days' journey south of the Northern Water Tribe's territories. Due to its isolation and history of raids by pirates and foreign explorers, the villagers are notoriously wary and openly hostile to outsiders. Their waterbending traditions have diverged significantly from the mainstream Northern Tribe practices, adapting to a more self-sufficient, ocean-based survival.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eUnique Features\u003cbr\u003e\u003cbr\u003eOceanwater Desalination Technique\u003cbr\u003e\u003cbr\u003eKugluktup's greatest innovation is their sacred Desalination Ritual, used to convert seawater into fresh water. This process is spiritual as much as it is practical and is central to village survival. It involves collaboration with the village's guardian spirit, the Eelstar.\u003cbr\u003e\u003cbr\u003eThe Eelstar\u003cbr\u003e\u003cbr\u003eA hybrid spirit beast, the Eelstar resembles five long eels fused at the tail to form a living starfish-like body. It is an ancient spirit bound to the island, often dwelling in underwater caverns accessible only through intricate coral tunnels.\u003cbr\u003e\u003cbr\u003e- Elemental Power: Uniquely, the Eelstar can breathe fire (a rare trait among ocean spirits), which it uses to heat seawater to boiling during the desalination ceremony. Waterbenders then condense and harvest the purified steam into fresh water.\u003cbr\u003e    \u003cbr\u003e- Temperament: Benevolent but alien in its thinking, the Eelstar respects tradition and punishes disrespect. It chooses one acolyte per generation to serve as its interpreter and medium: the Boilkeeper.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCulture\u003cbr\u003e\u003cbr\u003e- Isolationist Ethos: Kugluktup culture is insular. Children are taught caution and mistrust of outsiders from birth. Stories of invaders stealing knowledge or corrupting the Eelstar are retold often.\u003cbr\u003e    \u003cbr\u003e- Spiritual Bond: The villagers see themselves as stewards of both the sea and the Eelstar. Every household contributes to tending coral beds, cleaning beaches, and preserving balance with the spirit.\u003cbr\u003e    \u003cbr\u003e- Tattoos of the Tides: Adult waterbenders earn blue-green tattoos patterned after ocean currents. Each wave line signifies a milestone in mastery of their local bending techniques.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWaterbending Style\u003cbr\u003e\u003cbr\u003eKugluktup's bending style is:\u003cbr\u003e\u003cbr\u003e- Flowing and Sudden: Movements mimic sudden waves, surges, and sharp contractions like jellyfish pulses.\u003cbr\u003e    \u003cbr\u003e- Saltwater Versatility: Benders here specialize in manipulating saltwater directly, with subtle techniques to shift salinity and temperature. Many learn to pull fog from the sea for concealment.\u003cbr\u003e    \u003cbr\u003e- Condensation Arts: A unique branch of waterbending that involves evaporating and condensing water in minute amounts, especially during the desalination rituals.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eKey Figures\u003cbr\u003e\u003cbr\u003eNaqqi the Boilkeeper\u003cbr\u003e\u003cbr\u003e- Role: Spiritual leader and medium for the Eelstar\u003cbr\u003e    \u003cbr\u003e- Traits: Stern, enigmatic, speaks rarely and often in parables\u003cbr\u003e    \u003cbr\u003e- Skills: Master of condensation arts, communicates directly with the spirit in dreams and trance\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eTuliq the Tideguard\u003cbr\u003e\u003cbr\u003e- Role: Military captain and protector of the shores\u003cbr\u003e    \u003cbr\u003e- Traits: Fierce, pragmatic, believes in pre-emptive defense\u003cbr\u003e    \u003cbr\u003e- Skills: Skilled warrior and waterbender with techniques that use high-pressure saltwater jets\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003ePana the Listener\u003cbr\u003e\u003cbr\u003e- Role: One of the few curious about the outside world\u003cbr\u003e    \u003cbr\u003e- Traits: Quiet, observant, secretly collects maps and foreign items\u003cbr\u003e    \u003cbr\u003e- Potential Hook: Might secretly assist travelers if convinced they mean no harm\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAdventure Hooks\u003cbr\u003e\u003cbr\u003e- A drought weakens the Eelstar, and Kugluktup's hostility intensifies. The players must convince the villagers to let them help.\u003cbr\u003e    \u003cbr\u003e- A rogue spirit has infected one of the Eel limbs, twisting it into an aggressive form. The Boilkeeper calls for aid.\u003cbr\u003e    \u003cbr\u003e- Pirates are seeking the secret of the Desalination Ritual. The players must decide whether to defend Kugluktup or broker peace.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLinks\u003cbr\u003e\u003cbr\u003e- Waterbending\u003cbr\u003e    \u003cbr\u003e- Spirits\u003cbr\u003e    \u003cbr\u003e- Eelstar\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe shimmering goldfish poop, once dismissed, is now reacting \u2014 humming faintly, vibrating when close to sacred texts or old chanting bowls in the temple. A monk, once skeptical, nervously confesses:\u003cbr\u003e\u003cbr\u003e&gt; \"There was\u2026 someone who always believed. The High Priest. Master Anzu.  \u003cbr\u003e&gt; He was banished to the temple archives after\u2026 well, too many sermons about invisible fish.\"\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udfdb\ufe0f Act I: Finding Master Anzu\u003cbr\u003e\u003cbr\u003eThe party must explore the forbidden lower sanctum of the temple \u2014 a quiet, echoing archive of moldy scrolls, broken water clocks, and fish-shaped relics. Deep within, they find Master Anzu:\u003cbr\u003e\u003cbr\u003e- A thin, ancient man with big watery eyes, speaking in half-poetry and full riddles\u003cbr\u003e    \u003cbr\u003e- Surrounded by aquariums full of no fish \u2014 only reflections and bubbles\u003cbr\u003e    \u003cbr\u003e- He talks to the goldfish regularly, but admits \u201cShe\u2019s shy. She only appears when you aren\u2019t looking.\u201d\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdd Act II: The Limerick\u003cbr\u003e\u003cbr\u003eAmong the scrolls, Anzu recites an ancient limerick he once found inscribed on a scale made of gold-leafed spiritglass:\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdc The Goldfish Limerick\u003cbr\u003e\u003cbr\u003e&gt; In stillest of ponds where no ripples are seen,  \u003cbr\u003e&gt; She darts through the veil where no spirit has been.  \u003cbr\u003e&gt; She poops like a comet, unseen in her wake,  \u003cbr\u003e&gt; And sleeps in the world where dreams do not break.  \u003cbr\u003e&gt; To find her, dear seeker, don't look but just feel\u2014  \u003cbr\u003e&gt; For goldfish are truth, and their silence is real.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udde9 Interpretation (What Anzu Knows)\u003cbr\u003e\u003cbr\u003e- The Goldfish fazes between the Spirit World and the Material based on emotional triggers \u2014 fear, serenity, hunger, embarrassment.\u003cbr\u003e    \u003cbr\u003e- She is drawn to stillness, reflection, and honest curiosity.\u003cbr\u003e    \u003cbr\u003e- Her poop only appears when she phases improperly \u2014 a symptom of imbalance between the realms.\u003cbr\u003e    \u003cbr\u003e- She once had a mirror-lake shrine, far from the temple, where the veil was thin and she could swim freely.\u003cbr\u003e    \u003cbr\u003e- Anzu believes the party can recreate the conditions to lure her back temporarily.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udc3e Next Steps \u002f Quest Objectives\u003cbr\u003e\u003cbr\u003e1. Recreate the Still Pond:\u003cbr\u003e    \u003cbr\u003e    - Find or build a water basin with perfect stillness (no wind, noise, light)\u003cbr\u003e        \u003cbr\u003e    - Must be placed in a high-spirit resonance area (Anzu knows of one \u2014 the Mirror Hollow)\u003cbr\u003e        \u003cbr\u003e2. Use the Poop (yes, really):\u003cbr\u003e    \u003cbr\u003e    - The poop fragment is a spiritual scent marker \u2014 burn it as incense during the ritual to open the veil\u003cbr\u003e        \u003cbr\u003e3. Avoid looking directly at the fish \u2014 this causes her to retreat. Players must instead perceive her via reflections, ripples, or through mirrors held backwards.\u003cbr\u003e    \u003cbr\u003e4. If successful, the fish may:\u003cbr\u003e    \u003cbr\u003e    - Grant a blessing (invisibility, silent movement, spirit-sight)\u003cbr\u003e        \u003cbr\u003e    - Reveal the location of a hidden artifact (maybe another Resonance Stone?)\u003cbr\u003e        \u003cbr\u003e    - Simply leave behind another poop\u2026 but now it\u2019s glowing with spiritual energy and can be used to track spirit movements like a compass\u003cbr\u003e    - \u003cbr\u003e\ud83d\udc1f Still Ear, Truth Clear\u003cbr\u003e\u003cbr\u003eAdvanced Spiritual Airbending Technique  \u003cbr\u003ePrerequisite: Training in Airbending (even basic level), spiritual sensitivity, and a connection to the Invisible Goldfish Spirit  \u003cbr\u003eLearned from: Master Anzu\u2019s teachings and meditation upon the Limerick\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\u2728 Description:\u003cbr\u003e\u003cbr\u003eBy entering a state of deep meditation and tuning out all worldly sound, the Goldfish Priest reaches a state of resonant stillness. In this space, she poses questions not with voice, but with thoughts shaped like ripples \u2014 gentle vibrations of intent across the boundary between worlds.\u003cbr\u003e\u003cbr\u003eIn response, the Invisible Goldfish Spirit answers not with words, but with the presence or absence of a single \"blub\" in the ear of the priest. No one else can hear it.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\uddd8\u200d\u2640\ufe0f Mechanics:\u003cbr\u003e\u003cbr\u003eAction Type: Special Ritual Action (requires 1 uninterrupted minute of focus)\u003cbr\u003e\u003cbr\u003eCheck: Roll a Religion (or Spirit) check, DC = 12 + number of times used today\u003cbr\u003e\u003cbr\u003e- You may only ask 1 question per successful check\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eRules for Questions:\u003cbr\u003e\u003cbr\u003e- Must be phrased in a Yes\u002fNo format\u003cbr\u003e    \u003cbr\u003e- Must be genuinely introspective or spiritually oriented (not \"What\u2019s 2+2?\")\u003cbr\u003e    \u003cbr\u003e- The answer comes as a sensation, not a sound:\u003cbr\u003e    \u003cbr\u003e    - No Blub = YES\u003cbr\u003e        \u003cbr\u003e    - Blub = NO\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e&gt; (The GM determines the answer truthfully, according to what the goldfish would know spiritually.)\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf00 Enhancements \u002f Level Ups\u003cbr\u003e\u003cbr\u003eAs the Goldfish Priest deepens their connection, the ability can evolve:\u003cbr\u003e\u003cbr\u003e\ud83c\udf2c\ufe0f Level 2 \u2013 Ripple Reading\u003cbr\u003e\u003cbr\u003eOn a successful check, the priest can ask 2 yes\u002fno questions in a single ritual.\u003cbr\u003e\u003cbr\u003e\ud83c\udf0a Level 3 \u2013 Spirit Echo Clarity\u003cbr\u003e\u003cbr\u003eOnce per day, the priest can automatically succeed on the check and get a brief vision or emotional impression along with the blub\u002fno-blub (GM\u2019s choice).\u003cbr\u003e\u003cbr\u003e\ud83c\udf90 Level 4 \u2013 Silent Chorus\u003cbr\u003e\u003cbr\u003eWhile meditating in a naturally silent location (e.g. Mirror Hollow), the priest can allow one other person to share the ritual and ask a question as well \u2014 but only the priest will \u201chear\u201d the answer.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udde9 Narrative Uses:\u003cbr\u003e\u003cbr\u003e- Discover hidden spiritual truths (\"Is there a spirit watching us?\")\u003cbr\u003e    \u003cbr\u003e- Test moral\u002fspiritual judgments (\"Did we choose the right path?\")\u003cbr\u003e    \u003cbr\u003e- Detect lies from other spirit beings (\"Is this spirit telling the truth?\")\u003cbr\u003e    \u003cbr\u003e- Feel for portals, veils, or corrupted energies (\"Is the balance broken here?\")\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdc Limerick #1 \u2013 \u201cThe Golden Scent\u201d\u003cbr\u003e\u003cbr\u003e&gt; A shimmer, a scent in the air,  \u003cbr\u003e&gt; From a gift left behind with great care.  \u003cbr\u003e&gt; Though humble its form,  \u003cbr\u003e&gt; It shifts spirit and norm,  \u003cbr\u003e&gt; And opens the veil with a prayer.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdc Limerick #2 \u2013 \u201cBlaze of the Blub\u201d\u003cbr\u003e\u003cbr\u003e&gt; When silence and stillness align,  \u003cbr\u003e&gt; And poop becomes truly divine,  \u003cbr\u003e&gt; Then burneth the gold,  \u003cbr\u003e&gt; For the pathways unfold,  \u003cbr\u003e&gt; And spirit and seeker entwine.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdc Limerick #3 \u2013 \u201cBurn, O Holy Pellet\u201d\u003cbr\u003e\u003cbr\u003e&gt; Burn, O holy pellet so faint,  \u003cbr\u003e&gt; Though most would dismiss with complaint,  \u003cbr\u003e&gt; It draws back the tide,  \u003cbr\u003e&gt; Where the shy fish doth hide,  \u003cbr\u003e&gt; In places the bold dare not paint.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdc Limerick #4 \u2013 \u201cThe Temple Fume\u201d\u003cbr\u003e\u003cbr\u003e&gt; When the fish leaves a mark on the floor,  \u003cbr\u003e&gt; Do not clean \u2014 it\u2019s a key to the door.  \u003cbr\u003e&gt; Light incense with care,  \u003cbr\u003e&gt; Let the spirit draw near,  \u003cbr\u003e&gt; And you'll swim where the world touches more.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udfad Usage in Game:\u003cbr\u003e\u003cbr\u003e- These can be used as ritual verses the character must recite while performing the incense ceremony.\u003cbr\u003e    \u003cbr\u003e- Master Anzu may only remember part of the limerick, and the players must recover missing lines.\u003cbr\u003e    \u003cbr\u003e- One limerick might be written in the margins of a water-damaged scroll, adding to the mystery.\u003cbr\u003e\u003cbr\u003eScene: before sunrise, smoky ruins of a cactus juice distillery. \u003cbr\u003e\u003cbr\u003eThe air is thick with dew, ash, and just a hint of fermented regret. Master Anzu, eyes wide and glistening, kneels over charred stone, holding up a soot-smudged scroll as the sunrise reflects in his watery eyes.\u003cbr\u003e\"...Do you smell that? Not the smoke. Not the fermented sin still clinging to the sand.  \u003cbr\u003eNo... it's the scent of secrets.  \u003cbr\u003e(he raises the scroll gently, reverently)  \u003cbr\u003eBuried beneath a vat of distilled foolishness... lay the truth.\u003cbr\u003e\u003cbr\u003e(clears throat)  \u003cbr\u003e'When the moon reflects with no moon to see,  \u003cbr\u003eAnd silence moves where sound should be,  \u003cbr\u003eThe swimmer glides in sacred hush\u2014  \u003cbr\u003eA ripple born from temple\u2019s blush.'\u003cbr\u003e\u003cbr\u003e(he pauses, the scroll trembles in his hands)  \u003cbr\u003eIt speaks of her. The One Between Currents.  \u003cbr\u003eNot just fable, not just fish.  \u003cbr\u003eThis text\u2014this... Scripture of the Silted Gills\u2014it was lost when the archives collapsed in the Flood of Tea. They said it was nonsense. Poetry.\u003cbr\u003e\u003cbr\u003eBut now\u2026 NOW\u2026!  \u003cbr\u003eBy the blessed bladder of the Desert Carp!  \u003cbr\u003eThis explosion\u2014this blessed, bubbling, bone-shaking boom\u2014has unearthed what no scholar would dare admit:\u003cbr\u003e\u003cbr\u003eThe goldfish was never gone. She was only waiting... for the distillery to ignite.\u003cbr\u003e\u003cbr\u003e(he looks around dramatically)  \u003cbr\u003eCall it fate. Call it fermentation.  \u003cbr\u003eBut this\u2026 this is providence.\"\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e\ud83c\udf49Glassfruit Watermelonsteamer\u003cbr\u003eMust be innitiated by a Earth or Waterbender and needs at least one level from each Elements Level. You can use Levels from up to two different Elements. \u003cbr\u003e\u003cbr\u003e&gt; A watermelon seed that needs to be watered to grow into a sphere of X meter radius that pushes everyone away and creates a Heavy sphere with X(Earthebending slot count double) Hitpoints. The watermelon is then quickly heated and the steam cooled down to heal every creature in a 5  X Meters cone from the watermelon with the steam 3  X Hitpoints \u003cbr\u003e- Effects: \u003cbr\u003e- Wall : \u003cbr\u003e\t- X(Earthebending slot count double) Hitpoints\u003cbr\u003e- Healing\u003cbr\u003e\t- 5  X Meters cone from the watermelon\u003cbr\u003e\t- 2  X(Water Counts double) Hitpoints Healing\u003cbr\u003e\t-\u003cbr\u003e\ud83c\udf4b Sunburst Nectarfield (Lemonseed)\u003cbr\u003e\u003cbr\u003eMust be initiated by a Fire or Water. Requires at least one Level from Fire and Air.  \u003cbr\u003eYou may use Levels from up to two Elements. Fire counts double.\u003cbr\u003e\u003cbr\u003e&gt; A lemon-shaped crystal is launched skyward, where it refracts the sunlight into a radiant bloom before one side sprays out hot liquid glassand one side shines a cleansing light. After a delay of 1 round, it explodes in midair with a flash that burns spirits and cleanses mortal ailments.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\u003cbr\u003e- Flashburst AoE\u003cbr\u003e    \u003cbr\u003e    - All enemies within X \u00d7 4 meters radius must succeed on INT Save (DC = 10 + X)\u003cbr\u003e        \u003cbr\u003e    - On fail: Blinded (1 round) + take Xd8 radiant damage\u003cbr\u003e        \u003cbr\u003e    - On success: Half damage, no blind\u003cbr\u003e        \u003cbr\u003e- Healing Burst (Allies only)\u003cbr\u003e    \u003cbr\u003e    - All allies in X \u00d7 5 meters are cured of one condition (blinded, frightened, charmed, etc.)\u003cbr\u003e        \u003cbr\u003e- X = Fire Slot \u00d7 Air Slot\u003cbr\u003e    \u003cbr\u003e    - Fire counts double\u003cbr\u003e        \u003cbr\u003e    - Max slots: 6 from Fire (counted as 12), 3 from Air\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf47 Cactusfruit  Bulb (Brambleseed)\u003cbr\u003e\u003cbr\u003eMust be initiated by an Earth or Fire. Requires at least one Level from Earth and Fire.  \u003cbr\u003eYou may use Levels from up to two Elements, but Earth counts double.\u003cbr\u003e\u003cbr\u003e&gt; A Cactusfruit-shaped glassfruit seed is planted in the ground and rapidly grows into a colossal crystalline maze that coils and shifts like a sentient trap.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\u003cbr\u003e- Create a Trap: \u003cbr\u003e    \u003cbr\u003e    - Radius: X \u00d7 2 meters\u003cbr\u003e        \u003cbr\u003e    - Duration: X rounds\u003cbr\u003e        \u003cbr\u003e    - Any enemy who enters or exits takes Xd6 slashing damage A the \u003cbr\u003e        \u003cbr\u003e    - Moving inside costs double movement\u003cbr\u003e        \u003cbr\u003e- Binding Roots:\u003cbr\u003e    \u003cbr\u003e    - 1 enemy of choice each round must succeed STR Save (DC = 10 + X) or be restrained by vine-arms from the wall\u003cbr\u003e        \u003cbr\u003e- X = Earth Slot \u00d7 Water Slot\u003cbr\u003e    \u003cbr\u003e    - Earth counts double\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd2e Prism Bloom Reflection Field (Clear Soulseed + Flashcore)\u003cbr\u003e\u003cbr\u003eMust be initiated by an Air or Firebender. Requires at least one Level from Spirit and Fire.  \u003cbr\u003eYou may use Levels from up to two Elements, but Spirit counts double.\u003cbr\u003e\u003cbr\u003e&gt; A flower of soul-glass blooms and begins refracting incoming energy \u2014 redirecting harmful bending and reflecting light into a calming aura.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\u003cbr\u003e- Mirror Ward (Ward HP = X \u00d7 8)\u003cbr\u003e    \u003cbr\u003e    - All elemental attacks against allies within X \u00d7 3 meters are redirected to the prism instead of their original target\u003cbr\u003e        \u003cbr\u003e    - Prism absorbs the damage until depleted\u003cbr\u003e        \u003cbr\u003e- Reflection Surge (1\u002fshort rest)\u003cbr\u003e    \u003cbr\u003e    - When Prism Bloom is destroyed, it releases a cone of refracted energy\u003cbr\u003e        \u003cbr\u003e    - All enemies in a 6 \u00d7 X meter cone take Xd10 radiant or bending-type damage, matching the last element absorbed\u003cbr\u003e        \u003cbr\u003e- X = Spirit Slot \u00d7 Fire or Air Slot\u003cbr\u003e    \u003cbr\u003e    - Spirit counts double\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf49 Watermelon Bastion Bomb (Updated Version)\u003cbr\u003e\u003cbr\u003eMust be initiated by an Earth or Waterbender. Needs at least one Level from each.  \u003cbr\u003eYou may use Levels from up to two Elements.\u003cbr\u003e\u003cbr\u003e- Earth counts double for the wall HP\u003cbr\u003e    \u003cbr\u003e- Water counts double for the healing effect\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\u003cbr\u003e- Push Sphere:\u003cbr\u003e    \u003cbr\u003e    - Grows into a crystal watermelon with a radius of X meters\u003cbr\u003e        \u003cbr\u003e    - All creatures within range must succeed on STR Save (DC = 10 + X
