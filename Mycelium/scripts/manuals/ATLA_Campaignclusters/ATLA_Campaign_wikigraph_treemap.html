sn\u2019t satisfied with rote facts or common tourist spots. Instead, he brings guests straight to the village\u2019s heart.\u003cbr\u003e\u003cbr\u003e- Children:  \u003cbr\u003e    Kaedo delights in entertaining the youngest villagers. He uses sandbending to animate little figures\u2014dancing scorpions, squawking birds, tiny versions of the temple\u2019s guardians\u2014to amuse the children. Once they\u2019re giggling and comfortable, he encourages them to share their favorite games, songs, and stories. Through their laughter and unfiltered truth, travelers glimpse the village\u2019s values and hopes. The children\u2019s chatter reveals what they love, fear, and aspire to, painting a genuine portrait of life in Mahzeen.\u003cbr\u003e    \u003cbr\u003e- Elders:  \u003cbr\u003e    Kaedo also knows that while children carry the future, the elders hold the past. He\u2019ll approach an elderly woman sitting in the shade of a tent, bow respectfully, and compliment the intricate pattern on her scarf. With a wink and a light-hearted quip, he\u2019ll offer his arm to her, and before long, she\u2019s laughing at his jokes. Soon, she\u2019s recalling how the village came to its current home, how the temple was restored after a mighty sandstorm, and what old rituals were once practiced under starlit skies. By flirting gently and listening attentively, Kaedo coaxes out precious histories and personal anecdotes that no dusty archive could ever match.\u003cbr\u003e    \u003cbr\u003e- Putting it Together:  \u003cbr\u003e    After a day spent making children shriek with glee and coaxing secret histories from grinning grandmothers, Kaedo leads his guests to the village\u2019s central fire. There, he weaves these fragments into a tapestry of Mahzeen\u2019s story\u2014its traditions, struggles, and evolution. His method of cultural exploration ensures visitors don\u2019t just see the village; they feel it, through laughter, memories, and honest conversation.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eKaedo settles into a comfortable crouch at the edge of Mahzeen\u2019s central oasis, a small circle of curious children gathered around him. The late afternoon sun casts long shadows across the sandy ground, and his fingers gently sift through warm, golden grains, coaxing them upward into shape. With a subtle flourish of sandbending, he begins to form a figure\u2014taller than the usual tiny animals or playful shapes he makes to make them giggle.\u003cbr\u003e\u003cbr\u003e\"Come on now,\" Kaedo says in a teasing whisper, arching an eyebrow at the smallest child, Ila, who\u2019s perched with knees drawn up to her chest. \"Tell me what you see. Who is this?\"\u003cbr\u003e\u003cbr\u003eThe children lean in, wide-eyed. The figure is a man carved of compressed sand\u2014lean, strong, yet kind-eyed. Around him, Kaedo sculpts waves and spirals of shifting textures, subtle hints of other elements.\u003cbr\u003e\u003cbr\u003e\"It\u2019s... it\u2019s Atash the Avatar, isn\u2019t it?\" Ila ventures, her voice barely above the hush of desert wind. A murmur of excitement passes through the group.\u003cbr\u003e\u003cbr\u003e\"Yes!\" squeaks a boy, clutching a polished stone he keeps in his pocket. \"That\u2019s the one we always hear about!\"\u003cbr\u003e\u003cbr\u003eKaedo nods slowly, encouraging them with a gentle smile. He lifts his palm, and a swirl of sand forms a towering shape behind the Avatar. The grains drift and billow, forming something immense, with a broad head and elongated limbs.\u003cbr\u003e\u003cbr\u003eThe children\u2019s eyes grow round. \"The Giant Air Spirit!\" one of them whispers, voice trembling in mock fear.\u003cbr\u003e\u003cbr\u003e\"The Giant Air Spirit that came from beyond the seas,\" Ila adds more confidently. Her tone becomes reverent as she recounts the legend they all know by heart. \"They say it swept in on a storm of salt and cloud, tearing at our tents and scattering our herds. Its roar shook the dunes. It tried to swallow the desert\u2019s life.\"\u003cbr\u003e\u003cbr\u003eKaedo\u2019s jaw tightens slightly, but he keeps sculpting, guiding their narrative. As they speak, he slowly pulls sand upward around the Avatar figure\u2019s feet, showing him standing firm against the monstrous shape.\u003cbr\u003e\u003cbr\u003e\"And what did the Avatar do?\" Kaedo prompts softly.\u003cbr\u003e\u003cbr\u003e\"He fought it!\" Jin says, chest puffing with pride. \"He used earth and sand and stone. He raised great walls of rock that the spirit could not pass. He guided rivers of sand to blind it. He drew strength from the dunes and did not flee.\"\u003cbr\u003e\u003cbr\u003eThe smallest girl, Tala, her voice trembling a bit, adds: \"But the spirit was so strong. It howled and twisted the wind. The Avatar pushed it back, but at a terrible cost.\" Her eyes lower, and the other children\u2019s shoulders droop. They know the ending, and it stings every time.\u003cbr\u003e\u003cbr\u003e\"He won,\" Ila finishes quietly, looking Kaedo in the eye. \"The Avatar stopped the spirit and sent it away for good. But he... he died in the last strike, didn\u2019t he?\"\u003cbr\u003e\u003cbr\u003eKaedo nods, his smile gentle, though his heart tugs painfully. He refines the details of the sandy figure\u2019s face\u2014his strong jaw, determined eyes, and kind smile, even in battle. It is a face that resembles Kaedo more than he\u2019d ever admit to the children. The final sculpture shows the Avatar standing tall, the monstrous spirit recoiling, and a burst of sand suggesting the final, heroic blow.\u003cbr\u003e\u003cbr\u003e\"Yes,\" Kaedo says softly, \"he gave his life for the tribe. For all of us.\"\u003cbr\u003e\u003cbr\u003eThe children fall silent for a moment, the hush of the desert wrapping around them. They understand the sacrifice now, through their own telling. Kaedo looks at them and musters a bright, warm grin. \"You told the story well. I\u2019m proud of you.\"\u003cbr\u003e\u003cbr\u003eAnd as he smooths the last grains of sand, Kaedo feels the bittersweet weight of lineage: the story of the last Avatar, their tribe\u2019s leader, who was his father. The children never say those words directly\u2014it\u2019s a truth known but unspoken, carried in their eyes and in Kaedo\u2019s gentle silence.\u003cbr\u003e\u003cbr\u003e\t\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Wisdom\u003cbr\u003e- Strength\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA Dark humnaoid Cat like Spirit that has a large shard of Vaatu and was therefore corrupted early. He supresses the dark as good as he cans but the dark spirit also gives him the gifts to be an elite assasin. He only uses a little bit of airbending and is mostly waepon and archery based.\u003cbr\u003e\u003cbr\u003eRace\u002fType: Dark Humanoid Cat-like Spirit  \u003cbr\u003eAffiliation: Independent (Potentially allied with the Party and later Night Bloom?)  \u003cbr\u003eRole: Elite Assassin, Tracker, and Protector\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003e\u003cbr\u003eSilent Song is a shadowy feline humanoid spirit with sleek, dark fur and piercing silver eyes. His form is lithe and agile, blending the traits of a predator with the intelligence of a humanoid. A shard of Vaatu, the spirit of chaos and darkness, embedded itself in Silent Song. This corruption taints him, but Silent Song works tirelessly to suppress its influence.\u003cbr\u003e\u003cbr\u003eThe dark shard grants him supernatural abilities, enhancing his combat prowess and sensory skills but constantly tempts him toward chaos. He channels his darkness into his role as an elite assassin, using his gifts for precision and stealth to survive and protect others.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAbilities\u003cbr\u003e\u003cbr\u003e- Shadow Infusion:\u003cbr\u003e    \u003cbr\u003e    - Enhanced Stealth: Silent Song can meld into the shadows almost seamlessly, making him nearly invisible in darkness.\u003cbr\u003e    - Spirit Step: A short-range teleportation ability, moving from one shadow to another within his line of sight.\u003cbr\u003e    - Sense Chaos: He can detect nearby spirits or individuals tainted by chaotic energy.\u003cbr\u003e- Limited Airbending:  \u003cbr\u003e    While not a master, Silent Song wields airbending with precision, using it primarily for utility and agility:\u003cbr\u003e    \u003cbr\u003e    - Wind-Assisted Leaps: Propel himself higher or farther.\u003cbr\u003e    - Silent Movement: Dampen sound waves to move noiselessly.\u003cbr\u003e    - Projectile Diversion: Slightly redirect arrows or small projectiles mid-flight.\u003cbr\u003e- Weapons Mastery:\u003cbr\u003e    \u003cbr\u003e    - Proficient in dual blades, daggers, and a custom recurved bow.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003ePersonality\u003cbr\u003e\u003cbr\u003eSilent Song is introspective and reserved, with a constant inner battle against the corruption inside him. He fears losing himself to the shard of Vaatu and, as a result, avoids attachments. However, he harbors a strong moral compass and a sense of duty, especially toward protecting the balance between the physical and spirit worlds.\u003cbr\u003e\u003cbr\u003eHis sense of humor is dry, and his voice carries a low, rumbling purr when he speaks. He avoids direct leadership roles but often acts as a quiet protector and advisor.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMotivations\u003cbr\u003e\u003cbr\u003e1. Suppressing the Corruption: Silent Song constantly seeks ways to either remove or control the shard of Vaatu.\u003cbr\u003e2. Protecting the Balance: Despite his dark powers, Silent Song believes in balance and works to ensure neither light nor dark dominates.\u003cbr\u003e3. Redemption: He struggles to prove that he is more than the darkness within him, seeking to atone for the acts he committed under its influence.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003ePotential Plot Hooks\u003cbr\u003e\u003cbr\u003e- Temptation of Vaatu: The party encounters a scenario where the shard within Silent Song reacts to a surge of dark spirit energy, forcing him to either resist or succumb to Vaatu's will.\u003cbr\u003e- The Assassin's Creed: Silent Song is sent to eliminate a high-ranking figure but learns that their death would tip the balance toward chaos. He must decide whether to follow orders or defect.\u003cbr\u003e- A Cure for the Darkness: The party hears of a lost technique or artifact that might sever Silent Song's link to Vaatu's shard.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eSuggested Connections\u003cbr\u003e\u003cbr\u003e- [Vaatu's Influence]: Details the lingering effects of Vaatu's corruption.\u003cbr\u003e- [The Spirit World]: Context for Silent Song\u2019s origin and the battle where he was tainted.\u003cbr\u003e- [The Assassin's Guild]: Silent Song's possible former allies or enemies.\u003cbr\u003e- [The Party]: How Silent Song integrates into the group.\u003cbr\u003e\u003cbr\u003eWould you like this detailed further or tied into a specific campaign event?\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLinks:\u003cbr\u003e- Kaedo, the Young Sandbender Guide\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe Last Avatar\u003cbr\u003eFather of Kaedo\u003cbr\u003e\u003cbr\u003eWrite a dreamsequence Monologue for the players. The narrator is Salla. She was the avatar before Atash (the last avatar). She perfected Foambending and is showing a vision in the foam of the ocean waves in the wind. Describe her as standing and almost dancing on top of the water in a wind swept sea as she uses air and waterbending to control the storm around her and create visions in the foam. She taught Atash to use Sandbending to create stories. She explains that now that the avatar spirit is splintered there are many that are born with a part of it. The light and dark parts are not distributed evently and as it grows exponentially it is important too nourish the light energy early on. In the second dream she explains that by showing kindness and bringing joy to the world you can nourish your light energy. She also says that she can feel Atashs spirit still being trapped and the avatar spirit being sucked out of him slowly and potentially painfully. She shows that in a thunderstorm\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLinks:\u003cbr\u003e- Stonewarden Garon\u003cbr\u003e- Mistress Akira Meiyu\u003cbr\u003e- Grandmaster Iroh Tanaka\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eLinks:\u003cbr\u003e- Rin Kotak\u003cbr\u003e- Isay Trekal\u003cbr\u003e- Hanal Koga\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eContext:  \u003cbr\u003eImmediately after the group's victory over a corrupted spirit. Mahogany, the group's only spirit, has absorbed the entity\u2019s negative energy and purified it from within through a spiritual contest.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udfaf Mechanics\u003cbr\u003e\u003cbr\u003e- Trigger: Mahogany completes the spirit cleansing.\u003cbr\u003e    \u003cbr\u003e- Airbenders in the group must make a Perception check (DC 12, with advantage).\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eOn Success:  \u003cbr\u003eThey sense a brief, unnatural shift in air pressure\u2014a swirl or pulse like a door opening to a hidden chamber, but they are high on a mountain with nothing around. It vanishes after two seconds.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf00 Mahogany's Vision\u003cbr\u003e\u003cbr\u003e&gt; (Private: The player can request the others to leave the room for this scene.)\u003cbr\u003e\u003cbr\u003e&gt; As the spiritual remnants fade, Mahogany feels a tingle in the air\u2014not hostile, but watchful.  \u003cbr\u003e&gt; Then, a soft voice, cold as distant wind, whispers directly into her ear:\u003cbr\u003e\u003cbr\u003e\"Now... who are you?\"\u003cbr\u003e\u003cbr\u003eMahogany may make a History or Insight check (DC 17) to identify the speaker.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd0d On Success: Recognizing Rin Kotak\u003cbr\u003e\u003cbr\u003eMahogany realizes the voice belongs to Rin Kotak, the elusive Spiritualist of the Night Bloom, a radical airbender known for manipulating sound and blending with wind to near invisibility. He is feared not just for his bending, but for how he weaves ideology into every breath.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udde3\ufe0f Dialogue (If Mahogany responds)\u003cbr\u003e\u003cbr\u003eIf she speaks\u2014aloud or in thought\u2014a ripple of wind answers. On a distant cliff edge, so far that no human voice should carry, a tall, black-robed figure appears, seated cross-legged, barely more than a wraith in the wind. And yet... his voice is inside her again:\u003cbr\u003e\u003cbr\u003e&gt; \u201cYou bent the spirit. Purified it. Took its pain into your own.  \u003cbr\u003e&gt; You\u2019re not like them\u2014not just flesh. Not just bound by the old rules.  \u003cbr\u003e&gt; Intriguing.\u201d\u003cbr\u003e\u003cbr\u003e&gt; \u201cYou stand on a peak, but don\u2019t you feel the cage around you still?  \u003cbr\u003e&gt; The cycle. The Avatar. All of it\u2014wheels within wheels, spinning us endlessly toward the same fate.\u201d\u003cbr\u003e\u003cbr\u003e&gt; \u201cThey call me traitor. But I only want what you just proved is possible\u2014freedom from what was. You and I, Mahogany... we could speak again. When the wind is right.\u201d\u003cbr\u003e\u003cbr\u003eThe wind sighs. A blink later, the figure is gone. The cliff is bare again.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\uddc2\ufe0f Linked Files\u003cbr\u003e\u003cbr\u003e- Rin Kotak\u003cbr\u003e    \u003cbr\u003e- Night Bloom\u003cbr\u003e    \u003cbr\u003e- Isay Trekal\u003cbr\u003e    \u003cbr\u003e- Hanal Koga\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWould you like me to now generate or clean up the Obsidian files for Rin Kotak or Night Bloom based on your inputs? I can help you integrate this directly into your vault.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe village of the Spidermonkeys\u003cbr\u003eAdventure: \u003cbr\u003e\u003cbr\u003eSetting: The Floating Island of the Nomadic Airbenders\u003cbr\u003e\u003cbr\u003eThe players find themselves in a dense forest, where an entire floating island has landed momentarily. This island belongs to a nomadic airbending tribe that has perfected a unique bending style called Silkbending, inspired by their deep bond with the Spiderlemurs.\u003cbr\u003e\u003cbr\u003eThe Spiderlemurs\u003cbr\u003e\u003cbr\u003eA rare species found only in this part of the world, Spiderlemurs have the body of a lemur but with four arms, four legs, and a long prehensile tail. Their heads resemble spiders, complete with multiple eyes and small mandibles. They produce powerful silk from each of their appendages, which they use to glide alongside the airbenders, creating parachutes they manipulate through airbending. Their silk is also essential for the tribe, used for clothing, rope, and even structural supports for their floating homes.\u003cbr\u003e\u003cbr\u003eThe Spiderlemurs assist in keeping the floating island airborne. By gripping the island with their mandibles and spinning silk into large wind-catching sails, they create natural updrafts, allowing the airbenders to maintain their high-altitude lifestyle.\u003cbr\u003e\u003cbr\u003eThe Floating Island Tribe\u003cbr\u003e\u003cbr\u003eThis nomadic tribe typically resides in a hidden valley where a natural updraft allows them to sustain their floating home. They only descend when necessary, usually for trade or in emergencies. Their culture revolves around Silkbending, a refined form of airbending that incorporates Spiderlemur silk into their movements.\u003cbr\u003e\u003cbr\u003eCulture &amp; Traditions\u003cbr\u003e\u003cbr\u003e- Silkbending: A technique unique to this tribe, combining airbending with the manipulation of Spiderlemur silk. Masters can use it to create silk whips, nets, and even glider-like wings.\u003cbr\u003e    \u003cbr\u003e- Self-Sufficiency: The tribe cultivates special crops adapted to high-altitude life. Their clothing is woven from Spiderlemur silk, making it lightweight yet incredibly durable.\u003cbr\u003e    \u003cbr\u003e- Ceremonial Bonding: Each child of the tribe bonds with a Spiderlemur from birth, forming a lifelong partnership.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eThe Threat: The Corrupted Spiderlemur Spirit\u003cbr\u003e\u003cbr\u003eA young Spiderlemur has been corrupted by dark spiritual energy, transforming into a monstrous creature with a grotesquely large monkey-like head filled with razor-sharp teeth. Its body is now entirely that of a spider, with long, sharp legs and a bloated abdomen leaking dark silk.\u003cbr\u003e\u003cbr\u003eCorrupted Spiderlemur (Dark Spirit)\u003cbr\u003e\u003cbr\u003eType: Dark Spirit Creature (Corrupted Beast)\u003cbr\u003e\u003cbr\u003eHP: High  \u003cbr\u003eArmor: Medium (Silk-reinforced exoskeleton)\u003cbr\u003e\u003cbr\u003eAbilities:\u003cbr\u003e\u003cbr\u003e- Silk Barrage: Fires multiple strands of razor-sharp silk at enemies, restraining and cutting them.\u003cbr\u003e    \u003cbr\u003e- Parasitic Weave: Can attach dark silk to a target, slowly draining their energy while strengthening itself.\u003cbr\u003e    \u003cbr\u003e- Silk Puppet Master: Uses tendrils of silk to control other Spiderlemurs, forcing them to fight against the players.\u003cbr\u003e    \u003cbr\u003e- Shadowed Updraft: Manipulates air currents and silk parachutes to move unpredictably, making it hard to hit.\u003cbr\u003e    \u003cbr\u003e- Venomous Bite: Delivers a spirit-poison that clouds the mind, causing hallucinations and fear.\u003cbr\u003e    \u003cbr\u003e- Dark Ascension: If weakened, the spirit attempts to retreat into the spirit world, requiring the players to perform a purification ritual to prevent its return.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eAdventure Goals\u003cbr\u003e\u003cbr\u003e- Discover the Floating Island: The players must navigate the forest and befriend the nomadic tribe.\u003cbr\u003e    \u003cbr\u003e- Understand Silkbending: Learning about the Spiderlemurs and the tribe's unique abilities may grant temporary Silkbending techniques.\u003cbr\u003e    \u003cbr\u003e- Fight the Corrupted Spiderlemur: The players must defeat or purify the creature before it corrupts the other Spiderlemurs and endangers the island.\u003cbr\u003e    \u003cbr\u003e- Protect the Floating Island: The battle could disrupt the delicate updraft balance, forcing players to use creative airbending or Silkbending to keep the island afloat.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003ePossible Rewards\u003cbr\u003e\u003cbr\u003e- Silkbender\u2019s Cloak: A lightweight but durable cloak woven from Spiderlemur silk, enhancing agility and stealth.\u003cbr\u003e    \u003cbr\u003e- Silkglider Bracers: Wristbands that generate small silk wings, allowing for short bursts of controlled gliding.\u003cbr\u003e    \u003cbr\u003e- Spiderlemur Ally: If the players handle the situation well, they may gain a Spiderlemur companion or a future alliance with the tribe.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eThis adventure introduces a unique airbending culture, a powerful corrupted foe, and creative bending techniques, encouraging both combat and problem-solving elements in the game.\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview of Earth Kingdom adventures, including themes like resilience, strength, and the challenges of navigating a vast and diverse region. Includes guidelines for integrating these modules with the larger campaign.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview:\u003cbr\u003e\u003cbr\u003eThe Avatar spirit, the bridge between the physical and spiritual realms, is in a precarious state. During the final moments of the last Avatar\u2019s life, a catastrophic event caused the spirit\u2019s essence to splinter, disrupting the cycle of reincarnation and weakening its connection to the Spirit World.\u003cbr\u003e\u003cbr\u003eEvent of Fracture:\u003cbr\u003e\u003cbr\u003eThe fracture occurred during a climactic battle against a monstrous corrupted spirit, commanded by the rogue Spiritbender. The Avatar sacrificed themselves to contain the spirit\u2019s power, but the Spiritbender\u2019s mist disrupted the Avatar\u2019s spiritual essence, leaving it fragmented and vulnerable.\u003cbr\u003e\u003cbr\u003eEffects of the Fracture:\u003cbr\u003e\u003cbr\u003e1. Weakened Avatar State: The current Avatar cannot fully access the power of their predecessors, making their connection to past lives erratic and unreliable.\u003cbr\u003e    \u003cbr\u003e2. Disturbed Spirit World: The fracture has caused chaos in the Spirit World, with dark spirits manifesting more frequently in the physical realm.\u003cbr\u003e    \u003cbr\u003e3. Cycle in Jeopardy: The reincarnation cycle is unstable. If the fracture is not healed, the Avatar may not reincarnate after their current life ends.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eClues to Restoration:\u003cbr\u003e\u003cbr\u003e- Shards of Essence: Fragments of the Avatar spirit linger in sacred locations across the world. By visiting these sites and performing rituals, the group can begin to mend the fractures.\u003cbr\u003e    \u003cbr\u003e- Guidance from Spirits: Certain spirits, such as Shifting Sands or the elusive Bright Flame, may provide insight into restoring the balance.\u003cbr\u003e    \u003cbr\u003e- Confronting the Spiritbender: The rogue Airbender holds knowledge about the fracture and must be confronted to uncover the full truth.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eMechanics:\u003cbr\u003e\u003cbr\u003e- Fractured Avatar State:\u003cbr\u003e    \u003cbr\u003e    - When the Avatar attempts to enter the Avatar State, they must succeed on a Spirit check (DC 18). Failure results in a partial manifestation, granting a single bending style enhancement instead of full power.\u003cbr\u003e        \u003cbr\u003e    - Past Avatar advice requires a concentration check (DC 15) to establish communication.\u003cbr\u003e        \u003cbr\u003e- Restoration Sites:\u003cbr\u003e    \u003cbr\u003e    - Each sacred location restores a portion of the Avatar spirit, reducing the DCs for Avatar State checks by 2. Fully visiting all sites removes these penalties entirely.\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003eEncounters:\u003cbr\u003e\u003cbr\u003e- The First Shard: The group travels to a secluded temple where the shard is guarded by a territorial spirit. They must earn the spirit\u2019s trust or defeat it to claim the shard.\u003cbr\u003e    \u003cbr\u003e- Spiritual Consequences: An encounter with a corrupted spirit shows the group the real-world effects of the fractured Avatar spirit, emphasizing the urgency of their quest.\u003cbr\u003e    \u003cbr\u003e- The Spiritbender\u2019s Challenge: A climactic battle against the Spiritbender offers an opportunity to learn how the fracture occurred and hints at their larger agenda.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eImplications for the Campaign:\u003cbr\u003e\u003cbr\u003eHealing the Avatar spirit becomes a central goal, tying together themes of balance, sacrifice, and teamwork. The fracture also provides opportunities for moral dilemmas, as the group navigates the complex relationships between humans and spirits.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOverview of the purpose of the #Modules folder, including guidelines on how to scale the modules based on the party's power level and integrate them into the main campaign.\u003cbr\u003e\u003cbr\u003eModules\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eHere\u2019s a structured quest write-up you can drop straight into your vault:\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003esidequest #story #prep #roleplay\u003cbr\u003e\u003cbr\u003eHook\u003cbr\u003e\u003cbr\u003eOn the way to Omashu, the party encounters a small Air Nomad family caravan. They travel lightly with gliders strapped to their backs, but one thing stands out: a hedgehogkoala, a gentle spirit-beast companion. Its fur is soft and koala-like, but its back bristles with soft quills tipped with berry clusters. Normally, the berries are sweet and nourishing, but lately they have grown bitter. The creature also appears lethargic.\u003cbr\u003e\u003cbr\u003eThe party first meets the family under duress: two local hunters have the hedgehogkoala and refuse to hand it back, insisting it's a wild specimen or offering a reward. The group must intervene\u2014through negotiation, stealth, or force\u2014to rescue the pet and earn the family's trust.\u003cbr\u003e\u003cbr\u003eThe family explains they are traveling to Omashu to find a healer who might know what is wrong.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eKey NPCs\u003cbr\u003e\u003cbr\u003e- Tashi (Father, calm and kind) \u2013 wants to remain optimistic but is worried for the creature.\u003cbr\u003e- Mila (Mother, practical) \u2013 thinks the hedgehogkoala\u2019s diet might be \u201cspirit sick\u201d from traveling near corrupted land.\u003cbr\u003e- Rin (Youngest child, mischievous) \u2013 sneaks into the party\u2019s camp at night and tries to steal food\u002fsupplies to \u201chelp Spikeberry\u201d (the pet).\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eConflict &amp; Choices\u003cbr\u003e\u003cbr\u003e- Theft in the Night: Rin sneaks into camp. The group may:\u003cbr\u003e  - Catch Rin and confront him.\u003cbr\u003e  - Let him steal, and later discover food is missing.\u003cbr\u003e  - Gently follow him and find he is feeding the hedgehogkoala.\u003cbr\u003e- Healing the Spirit Pet:  \u003cbr\u003e   Investigation reveals the hedgehogkoala\u2019s berries soured because it absorbed tainted energy while grazing near a patch of corrupted vines (link to Spiritual Corruption).\u003cbr\u003e  - Earth\u002fWaterbenders can try cleansing rituals.\u003cbr\u003e  - Airbenders or spiritual characters can meditate with the creature to calm it.\u003cbr\u003e  - Herbal knowledge might help create a temporary tonic.\u003cbr\u003e- Outcome:\u003cbr\u003e  - If healed, the berries return to being sweet and nourishing. The family gratefully gifts the party a pouch of dried \u201cspikeberries\u201d (restore fatigue or minor healing).\u003cbr\u003e  - If left unresolved, the hedgehogkoala slowly worsens. The family thanks the group for their company but continues to seek help in Omashu.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eRewards\u003cbr\u003e\u003cbr\u003e- Spikeberry Pouch: 1d4 uses, eaten as an action \u2192 heals minor HP or grants +1 General Armor until next rest.\u003cbr\u003e- Roleplay reward: trust and friendship with a family who may reappear later in Omashu as allies or quest givers.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eThemes &amp; Mood\u003cbr\u003e\u003cbr\u003e- Compassion vs. suspicion (how do they handle Rin\u2019s theft?)\u003cbr\u003e- Connection to spirits and the land\u2019s corruption\u003cbr\u003e- Small but heartfelt stakes that foreshadow larger spiritual imbalances in the world\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eScene: Shaken Paths to Stonegrove\u003cbr\u003e\u003cbr\u003eSetup\u003cbr\u003e\u003cbr\u003eThe party approaches Stonegrove Village, led by the Air Nomad family. Just as the terraced orchards come into view, the ground rumbles. A violent earthquake tears through the valley:\u003cbr\u003e\u003cbr\u003e- The upper half of the mountain village slides away from the lower terraces.\u003cbr\u003e- The Spiritberry Groves (on the lower terraces) are now cut off by a deep fissure.\u003cbr\u003e- The Air Nomad child Rin is stranded on the opposite side with other villagers.\u003cbr\u003e\u003cbr\u003eDust clouds rise, the air fills with panic, and the valley hums with unstable resonance.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eComplication 1 \u2013 Separation\u003cbr\u003e\u003cbr\u003e- The group must decide whether to climb down and around the mountain, cross unstable bridges, or try bending-assisted solutions to reunite the family.\u003cbr\u003e- Non-bending solutions: ropework, teamwork, or navigating cliffside paths.\u003cbr\u003e- Bending solutions: Earthbenders may stabilize rock, Waterbenders freeze temporary paths, Airbenders glide or ferry.\u003cbr\u003e\u003cbr\u003eFailing checks doesn\u2019t necessarily drop PCs but causes minor harm or delays, making them vulnerable to what comes next\u2026\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eComplication 2 \u2013 Spirit Encounter\u003cbr\u003e\u003cbr\u003eAs they make their way toward the grove, the fissure oozes with corrupted water. From it rises a strange hybrid spirit:\u003cbr\u003e\u003cbr\u003eSpirit: Burrowfang\u003cbr\u003e\u003cbr\u003e- Appearance: A towering bear-sized rabbit with a broad muzzle and long ears, covered in dripping mossy fur. Its claws drip mud and it shifts between watery fluidity and rocky density.\u003cbr\u003e- Abilities:\u003cbr\u003e  - Earth Claws: slams the ground, causing spikes of stone.\u003cbr\u003e  - Water Wash: surges forward in a wave, knocking characters back.\u003cbr\u003e  - Spirit Rage: grows more chaotic if the players harm the land around it.\u003cbr\u003e- Weakness: Calms when shown restoration of balance (cleansing corrupted vines, feeding it Spiritberry, bending in harmony).\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBurrowfang \u2013 Earth-Water Spirit\u003cbr\u003e\u003cbr\u003eA spirit born of mud, stone, and river runoff. Normally a gentle guardian of mountain springs, but corrupted quakes have filled it with restless rage.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcca Stat Block\u003cbr\u003e\u003cbr\u003e- Type: Large Spirit Beast (Corrupted)\u003cbr\u003e- HP: 60\u003cbr\u003e- Armor: 3 General Armor\u003cbr\u003e- Speed: Slow on land, Fast when flowing through fissures (burrow\u002fswim).\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf00 Abilities\u003cbr\u003e\u003cbr\u003e\ud83c\udf0a Water Wash\u003cbr\u003e\u003cbr\u003e- Action: Sends a crashing wave of muddy water in a 15 ft cone.\u003cbr\u003e- Effect: All creatures must make a Defense or Athletics check (DC 14).\u003cbr\u003e  - Success \u2192 Take half damage (1d8).\u003cbr\u003e  - Fail \u2192 Take full damage (2d8) and are knocked prone\u002fslid back 10 ft.\u003cbr\u003e\u003cbr\u003e\ud83e\udea8 Earth Claws\u003cbr\u003e\u003cbr\u003e- Action: Swipes with stone-encrusted claws.\u003cbr\u003e- Attack: +6 to hit, 2 attacks per turn.\u003cbr\u003e- Damage: 2d6 + Strength (earthbending energy) each.\u003cbr\u003e\u003cbr\u003e\ud83c\udf11 Spirit Rage (Corruption Aura)\u003cbr\u003e\u003cbr\u003e- Passive: When struck, loose stones and muddy water lash out.\u003cbr\u003e- Anyone within 5 ft of Burrowfang when they deal melee damage must succeed on a Reflex check (DC 13) or take 1d6 damage from shards\u002fsplash.\u003cbr\u003e\u003cbr\u003e\ud83c\udf3f Spirit Shift\u003cbr\u003e\u003cbr\u003e- Bonus Action (2x per fight): Transforms partially into water or stone.\u003cbr\u003e  - Water Form: Resistance to physical damage, vulnerable to freezing\u002fcontainment.\u003cbr\u003e  - Stone Form: Resistance to bending damage, but speed halved.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udfaf Weaknesses\u003cbr\u003e\u003cbr\u003e- Feeding it a Spiritberry or cleansing corrupted vines with bending reduces its HP by 10 instantly (it calms).\u003cbr\u003e- Combined bending (Earth + Water or Air + Water harmony) can weaken its Spirit Rage.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udfad Behavior\u003cbr\u003e\u003cbr\u003e- Opens by Water Wash to separate intruders.\u003cbr\u003e- Switches forms depending on damage received.\u003cbr\u003e- Targets anyone attacking the land or Spiritberry vines most aggressively.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udfc6 Rewards\u003cbr\u003e\u003cbr\u003e- If Defeated (non-lethal): The land around the fissure heals slightly. Path to the Spiritberry Grove stabilizes.\u003cbr\u003e- If Appeased: Grants the group Burrowfang\u2019s Blessing \u2192 +1 forward on checks with earth\u002fwater spirits.\u003cbr\u003e- Success: The Burrowfang retreats, leaving behind fertile ground that opens a safer path to the Spiritberry Grove.\u003cbr\u003e- Failure: The party reaches the grove but strained and injured, consuming more resources.\u003cbr\u003e\u003cbr\u003eAt last, they reach the separated Spiritberry terraces, where they can gather the healing fruit. The family is reunited after the ordeal, grateful not only for healing their pet but also for saving them during the quake.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eRewards\u003cbr\u003e\u003cbr\u003e- Spiritberry Cluster: (3 berries)\u003cbr\u003e  - Eat \u2192 Heal moderate HP and cleanse corruption\u002ffatigue.\u003cbr\u003e  - Feed to spirit-animal \u2192 Restores vitality, calms agitation or illness.\u003cbr\u003e- Air Nomad pendant gift for remembrance.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSetup\u003cbr\u003e\u003cbr\u003eAfter examining the hedgehogkoala (\u201cSpikeberry\u201d), the Air Nomad family reveals they once heard of an Earthbender village a day\u2019s journey off the main road: Stonegrove. The people there cultivate Spiritberries, a crystalline glassfruit that glows faintly at night. These rare fruits are said to nourish both body and spirit, healing those who eat them and soothing spirit-beasts.\u003cbr\u003e\u003cbr\u003eThe family begs the group to travel with them to Stonegrove, hoping that the Spiritberry may heal Spikeberry\u2019s ailment.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eArrival at Stonegrove\u003cbr\u003e\u003cbr\u003e- Setting: A terraced valley carved into stone, where crystalline vines hang from shaped rock arches. The berries look like translucent grapes with faintly shifting colors inside.\u003cbr\u003e    \u003cbr\u003e- Atmosphere: Hum of resonance from the stone, soft windchimes hung between earthen homes. The people here are warm but cautious of outsiders.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eNPCs\u003cbr\u003e\u003cbr\u003e- Elder Baezu\u2019s Kin (Caretaker of the Spiritberry Orchard) \u2013 a stern Earthbender who ensures the berries are never misused.\u003cbr\u003e    \u003cbr\u003e- Apprentice Growers \u2013 young Earthbenders learning to coax vines from stone with rhythmic stomps and gestures.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eConflict\u003cbr\u003e\u003cbr\u003eThe villagers are reluctant to share Spiritberries, as each fruit takes months to form and is meant to aid their sick and elderly. To convince them, the party must either:\u003cbr\u003e\u003cbr\u003e1. Skill Challenge \u2013 Show good intent by helping the orchard:\u003cbr\u003e    \u003cbr\u003e    - Earthbending: resonate the vines into bloom.\u003cbr\u003e        \u003cbr\u003e    - Waterbending: cleanse the roots with pure water.\u003cbr\u003e        \u003cbr\u003e    - Airbending: circulate the valley\u2019s chi with glider-winds.\u003cbr\u003e        \u003cbr\u003e    - Non-benders: assist with care, labor, or persuasion.\u003cbr\u003e        \u003cbr\u003e2. Persuasion\u002fNegotiation \u2013 Convince the caretaker that the hedgehogkoala\u2019s illness is tied to greater spirit corruption, and that aiding it is for the good of all.\u003cbr\u003e    \u003cbr\u003e3. Alternative Quest \u2013 The caretaker says:  \u003cbr\u003e    \u201cBring proof of your compassion. A corrupted vine spreads on the far cliffside. If you can cleanse it, I\u2019ll grant you a Spiritberry.\u201d\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOutcome\u003cbr\u003e\u003cbr\u003e- If successful, the party receives 1 Spiritberry Cluster (3 berries).\u003cbr\u003e    \u003cbr\u003e- Feeding them to Spikeberry restores its health, sweetness, and cheer. Its berries are once again nourishing.\u003cbr\u003e    \u003cbr\u003e- The Air Nomad family gifts the party a small carved airbender pendant: \u201cSo you\u2019ll remember us when the winds shift paths again.\u201d\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eRewards\u003cbr\u003e\u003cbr\u003e- Spiritberry (Consumable):\u003cbr\u003e    \u003cbr\u003e    - Eat \u2192 Heal moderate HP + remove one level of spiritual corruption\u002ffatigue.\u003cbr\u003e        \u003cbr\u003e    - Feed to spirit-animal \u2192 Revitalizes it, calming agitation or illness.\u003cbr\u003e        \u003cbr\u003e- Reputation with Stonegrove \u2192 The group may return later for training in resonance-based earthbending.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCore Stats\u003cbr\u003eTABLE:\u003cbr\u003e+----------------+---------+--------+-------------------------+\u003cbr\u003e| Stat           | Value   | note   | Automatically updated   |\u003cbr\u003e+----------------+---------+--------+-------------------------+\u003cbr\u003e| Strength       | 4       |        | N                       |\u003cbr\u003e| Dexterity      | 2       |        | N                       |\u003cbr\u003e| Constitution   | 4       |        | N                       |\u003cbr\u003e| Intelligence   | 2       |        | N                       |\u003cbr\u003e| Wisdom         | 8       |        | N                       |\u003cbr\u003e| Charisma       | 5       |        | N                       |\u003cbr\u003e+----------------+---------+--------+-------------------------+\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eVital Stats (auto)\u003cbr\u003eTABLE:\u003cbr\u003e+------------------+---------+--------+-------------------------+\u003cbr\u003e| Attribute        | Value   | note   | Automatically updated   |\u003cbr\u003e+------------------+---------+--------+-------------------------+\u003cbr\u003e| Max Hit Points   |         |        | Y                       |\u003cbr\u003e| Evasion          |         |        | Y                       |\u003cbr\u003e| Armor            |         |        | Y                       |\u003cbr\u003e+------------------+---------+--------+-------------------------+\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBending Levels\u003cbr\u003eTABLE:\u003cbr\u003e+-----------------------+---------+--------------------------+----+\u003cbr\u003e| Element               | Level   | Notes                    |    |\u003cbr\u003e+-----------------------+---------+--------------------------+----+\u003cbr\u003e| Airbending Level      | 0       |                          |    |\u003cbr\u003e| Waterbending Level    | 0       |                          |    |\u003cbr\u003e| Earthbending Level    | 0       |                          |    |\u003cbr\u003e| Firebending Level     | 15      |                          |    |\u003cbr\u003e| Spiritbending Level   | 3       | (Avatar Spirit Bridge)   |    |\u003cbr\u003e+-----------------------+---------+--------------------------+----+\u003cbr\u003e\u003cbr\u003eBending Slots\u003cbr\u003e\u003cbr\u003e- (auto-generated table will be created by scripts)\u003cbr\u003e\u003cbr\u003e- Physical Description:  \u003cbr\u003e   A tall, lean man in his early sixties with silver-streaked black hair tied into a high topknot. His sharp amber eyes radiate wisdom and authority, while his lightly weathered skin reflects years of spiritual practice. He has a composed, almost regal posture, wearing a perpetual calm smile that hides the fire of his immense power.\u003cbr\u003e  - Bending Style:  \u003cbr\u003e     Firebending infused with advanced spiritual techniques, emphasizing control and harmony over raw power. Known for producing green flame as a sign of his mastery.\u003cbr\u003e  - Role:  \u003cbr\u003e     Oversees the organization\u2019s spiritual and physical balance, emphasizing diplomacy and tradition.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e\u003cbr\u003e- Wisdom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eFirebending\u003cbr\u003e\u003cbr\u003eDear Iroh Tanaka,\u003cbr\u003eWe hope this letter finds you well, we from team anju the avatar make our way Omashu. We think the bad guys (and girls and enbis) want to go to that village. Greeting from christopher. anyways that village has a chrystal that we think that might be the next target of the evil people.\u003cbr\u003emfg  \u003cbr\u003eTeam Anju\u003cbr\u003eTHIS GOT EATEN BY ALEXANDER\u003cbr\u003eNPC\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCore Stats\u003cbr\u003eTABLE:\u003cbr\u003e+----------------+---------+--------+-------------------------+\u003cbr\u003e| Stat           | Value   | note   | Automatically updated   |\u003cbr\u003e+--------- 03e    \u003cbr\u003e    - Determined, resourceful, and reverent toward the spirit.\u003cbr\u003e    - Nervous about interacting with the outside world.\u003cbr\u003e- Role:\u003cbr\u003e    \u003cbr\u003e    - Tasked with seeking a Spirit Bender to save Ch\u00e1nch\u00fa .\u003cbr\u003e    - Acts as the guide for the party to the Undersands Village .\u003cbr\u003e\u003cbr\u003eEquipment:\u003cbr\u003e\u003cbr\u003e- Crystals for lighting caves.\u003cbr\u003e- Hydration stones for water control and protection.\u003cbr\u003e\u003cbr\u003eLinks to Other Notes:\u003cbr\u003e\u003cbr\u003e- Ch\u00e1nch\u00fa \u003cbr\u003e- Undersands Village \u003cbr\u003e- Spirit Benders \u003cbr\u003e- Mushroom Leather Techniques \u003cbr\u003eNPC\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eRin Kotak.png\u003cbr\u003ehe\u002fhim\u003cbr\u003ePhysical Description:  \u003cbr\u003e        A tall, gaunt man with alabaster skin and wispy, shoulder-length white hair that seems to shift like mist in the wind. His gray eyes are perpetually half-lidded, giving him a detached, eerie demeanor. His flowing black robes ripple unnaturally, as if caught in a constant breeze. His soft-spoken voice carries an unsettling intensity.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Airbending with a dark twist\u2014manipulating sound waves to confuse and disorient enemies and bending the air around him to make him almost invisible.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAirbending\u003cbr\u003e\u003cbr\u003e\u201cThey call it balance. They say the Avatar brings peace. But I ask you\u2014what peace is built upon the whims of a single soul? One person, plucked from the cycle, anointed by spirits, wielding the fury of all four elements like a god among mortals. We kneel to them. We trust them. We fear them. We wait for them to fix what we cannot. But what happens when the Avatar fails? When they vanish? When they turn tyrant? No one should bear such power. And no one should have to live under it. Balance cannot come from a single hand\u2014it must rise from all of us, together. End the cycle. Let the world breathe free for once, without its so-called savior.\u201d\u003cbr\u003e\u003cbr\u003eInit:\u003cbr\u003ephot 21 \u003cbr\u003eRin Xolai 20 \u003cbr\u003eTapi 19\u003cbr\u003ePui 15\u003cbr\u003eIroh Tanaka 15\u003cbr\u003e\u003cbr\u003eRiu 14\u003cbr\u003eIsay Treksal 12\u003cbr\u003eStie 12\u003cbr\u003eAnju 12\u003cbr\u003eJin koga\u003cbr\u003eAkira Meiyu\u003cbr\u003e\u003cbr\u003eDAMAGE\u003cbr\u003e9\u003cbr\u003e\u003cbr\u003eNPC\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e- Physical Description:  \u003cbr\u003e    A striking woman in her early forties with jet-black hair styled into an intricate braid that cascades down her back. Her pale blue eyes seem to pierce through her opponents, reflecting a sharp intellect and unshakable resolve. Her high cheekbones and angular features give her an almost regal appearance. She wears an ornate, high-collared cloak adorned with faintly glowing charms.\u003cbr\u003e- Bending Style:  \u003cbr\u003e    Waterbending focused on offensive techniques, including the manipulation of black mist\u2014a mixture of water vapor and fine particles, creating disorienting smoke.\u003cbr\u003e- Role:  \u003cbr\u003e    Charismatic leader and visionary behind the rebellion. Isay is a master tactician and inspiring orator.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003eNPC\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOrganisations\u003cbr\u003eOverview:\u003cbr\u003e\u003cbr\u003eThe Night Bloom is a radical faction seeking to overthrow the Avatar\u2019s influence, advocating for a world ruled collectively by elite benders. They view the Avatar as a relic of oppression and seek to reshape the spiritual and physical realms.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLeadership:\u003cbr\u003e\u003cbr\u003e1. Isay Trekal (she\u002fher) (Faction Leader)\u003cbr\u003e    \u003cbr\u003e    - Physical Description:  \u003cbr\u003e        A striking woman in her early forties with jet-black hair styled into an intricate braid that cascades down her back. Her pale blue eyes seem to pierce through her opponents, reflecting a sharp intellect and unshakable resolve. Her high cheekbones and angular features give her an almost regal appearance. She wears an ornate, high-collared cloak adorned with faintly glowing charms.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Waterbending focused on offensive techniques, including the manipulation of black mist\u2014a mixture of water vapor and fine particles, creating disorienting smoke.\u003cbr\u003e    - Role:  \u003cbr\u003e        Charismatic leader and visionary behind the rebellion. Isay is a master tactician and inspiring orator.\u003cbr\u003e2. Hanal Koga(she\u002fher) (Second-in-Command)\u003cbr\u003e    \u003cbr\u003e    - Physical Description:  \u003cbr\u003e        A sturdy woman with sun-kissed skin and short, spiky hair the color of sandy blonde. She has a confident, swaggering gait, often adorned with sand-crusted boots and bracers. Her lightweight armor is covered with fine grains of sand that move subtly as she walks.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Earthbending with a specialization in sand manipulation.\u003cbr\u003e    - Role:  \u003cbr\u003e        Oversees the Night Bloom\u2019s military operations, crafting strategies for their attacks.\u003cbr\u003e3. Rin Kotak(he\u002fhim) (Spiritualist)\u003cbr\u003e    \u003cbr\u003e    - Physical Description:  \u003cbr\u003e        A tall, gaunt man with alabaster skin and wispy, shoulder-length white hair that seems to shift like mist in the wind. His gray eyes are perpetually half-lidded, giving him a detached, eerie demeanor. His flowing black robes ripple unnaturally, as if caught in a constant breeze. His soft-spoken voice carries an unsettling intensity.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Airbending with a dark twist\u2014manipulating sound waves to confuse and disorient enemies and bending the air around him to make him almost invisible.\u003cbr\u003e    - Role:  \u003cbr\u003e        Spirit guide of the Night Bloom, responsible for forging alliances with rogue spirits.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eUniform Design:\u003cbr\u003e\u003cbr\u003e- Colors:  \u003cbr\u003e    Black and deep purple, representing secrecy and defiance, with accents of crimson to signify rebellion.\u003cbr\u003e    \u003cbr\u003e- Style:\u003cbr\u003e    \u003cbr\u003e    - Sleek and utilitarian clothing designed for agility.\u003cbr\u003e    - Leaders wear flowing cloaks with jagged, petal-like edges to resemble blooming flowers in the dark.\u003cbr\u003e- Details:\u003cbr\u003e    \u003cbr\u003e    - Masks covering the lower face, often stylized with floral patterns or fanged motifs.\u003cbr\u003e    - Small spirit-charms integrated into their outfits, glowing faintly with corrupted energy during rituals or battles.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Armor definition\u003cbr\u003e- Isay Trekal\u003cbr\u003e- Rin Kotak\u003cbr\u003e- Night Bloom\u003cbr\u003e- Hanal Koga\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eWaterbending\u003cbr\u003eAirbending\u003cbr\u003eAvatar\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\" e&lt;!-- END-AUTO-COLLECTION --&gt;\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eTake a break and rest for an Hour.\u003cbr\u003e\u003cbr\u003eYou Have a pool of Your Hitpoints and \u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSession 5 Transcript\u003cbr\u003e\u003cbr\u003eSpirit Snake Scale:\u003cbr\u003e\u003cbr\u003eParty found a spirit snake scale on the ground.\u003cbr\u003e\u003cbr\u003eIt can be used as a reaction to flash and impose disadvantage.\u003cbr\u003e\u003cbr\u003eMilking Antics:\u003cbr\u003e\u003cbr\u003eThe group tried to milk desert oxen to mix with cactus juice for cocktails.\u003cbr\u003e\u003cbr\u003eMultiple failed Nature checks led to confusion over whether the ox was male or female (\u201cAm I holding a penis?!\u201d).\u003cbr\u003e\u003cbr\u003eThey eventually gave up on proper milking but still mixed cactus juice with mystery milk for later.\u003cbr\u003e\u003cbr\u003eJourney to Tapi\u2019s Village:\u003cbr\u003e\u003cbr\u003eParty headed toward Tapi\u2019s home village near an oasis.\u003cbr\u003e\u003cbr\u003eTraversed a rocky descent, using Earthbending to create steps and platforms (some attempts failed hilariously).\u003cbr\u003e\u003cbr\u003eCaravan &amp; Hyena Falcon Encounter:\u003cbr\u003e\u003cbr\u003eThey spotted a merchant caravan (camels carrying barrels of cactus juice).\u003cbr\u003e\u003cbr\u003eThe caravan seemed fleeing something but let the group catch up.\u003cbr\u003e\u003cbr\u003eHyena falcons attacked.\u003cbr\u003e\u003cbr\u003eThe party used creative bending \u2014 including launching a flaming barrel \u2014 to drive the falcons off.\u003cbr\u003e\u003cbr\u003eArrival at Tapi\u2019s Village:\u003cbr\u003e\u003cbr\u003eThey arrived at Tapi\u2019s tourist-friendly oasis village, known for its premium cactus juice.\u003cbr\u003e\u003cbr\u003eTapi\u2019s house: described as bohemian and cluttered, filled with shiny decorations, bottles, and jars.\u003cbr\u003e\u003cbr\u003eThey met Tapi\u2019s mom (a warm, hippie-like woman). She mentioned that Tapi\u2019s dad was out on the cactus farm.\u003cbr\u003e\u003cbr\u003eThe Oasis &amp; Temple:\u003cbr\u003e\u003cbr\u003eThe group visited the oasis temple, which had:\u003cbr\u003e\u003cbr\u003eDrawings and statues of a fish spirit \u2014 but none of them looked the same.\u003cbr\u003e\u003cbr\u003ePriestess Ban Ban, who explained:\u003cbr\u003e\u003cbr\u003eThe fish spirit disappeared a few days ago.\u003cbr\u003e\u003cbr\u003eIt used to communicate with her via bubbles.\u003cbr\u003e\u003cbr\u003eShe has drunk the holy water herself.\u003cbr\u003e\u003cbr\u003eMahogany dove into the pool, searching for signs of the spirit.\u003cbr\u003e\u003cbr\u003eShe felt faint traces of spiritual energy, but nothing alive.\u003cbr\u003e\u003cbr\u003eInstead, she found poop, which she proudly brought up for examination.\u003cbr\u003e\u003cbr\u003eThe group speculated:\u003cbr\u003e\u003cbr\u003eThe spirit may have been taken, changed form, or left through an unseen passage.\u003cbr\u003e\u003cbr\u003eSome PCs (esp. Puy) rehashed the ongoing argument about reselling cactus juice as \u201choly juice.\u201d\u003cbr\u003e\u003cbr\u003eEvening at Tapi\u2019s Home:\u003cbr\u003e\u003cbr\u003eTapi\u2019s mom suddenly burst in dramatically announcing Tapi\u2019s dad had an accident.\u003cbr\u003e\u003cbr\u003eTurns out he had just fallen into a cactus.\u003cbr\u003e\u003cbr\u003eAnju helped him, and he was fine.\u003cbr\u003e\u003cbr\u003eThey then relaxed, enjoying:\u003cbr\u003e\u003cbr\u003eCucumber sandwiches and watermelon-quinoa salad.\u003cbr\u003e\u003cbr\u003eCactus-milk cocktails (surprisingly good, rated 9\u002f10).\u003cbr\u003e\u003cbr\u003eCactus juice \u2014 some PCs got drunk after failing Con saves.\u003cbr\u003e\u003cbr\u003eCliffhanger:\u003cbr\u003e\u003cbr\u003eJust as everyone was comfortably drunk and chilling, they heard strange noises outside near the farm \u2014 something is happening.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eSession Summary:\u003cbr\u003e\u003cbr\u003eThe group picked up a spirit snake scale and concocted a strange but tasty cactus-milk cocktail after a chaotic ox-milking attempt. On their way to Tapi\u2019s home village, they helped a merchant caravan fend off hyena falcons with creative bending (including a flaming barrel).\u003cbr\u003e\u003cbr\u003eAt the oasis temple, they learned from priestess Ban Ban that the fish spirit who once communicated through bubbles had disappeared. Mahogany dove into the pool, sensing faint spiritual energy but finding only poop \u2014 perhaps a remnant of the missing spirit.\u003cbr\u003e\u003cbr\u003eReturning to Tapi\u2019s house, the party met his dramatic mother, who announced his father\u2019s \u201cterrible accident\u201d (which turned out to be just a cactus fall). After Anju helped him, they spent the evening enjoying cocktails, food, and cactus juice \u2014 some drinking heavily.\u003cbr\u003e\u003cbr\u003eThe night ended with a cliffhanger: suspicious noises outside near the cactus farm.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSession transkript:\u003cbr\u003eAvatar TTRPG \u2014 Session 6\u003cbr\u003eWhere we left off\u003cbr\u003e\u003cbr\u003eParty is in Misty Palms Oasis investigating the exploded distillery and a newly exposed basement chamber full of ancient fish-pictograph scrolls about D\u012bnu, the oasis\u2019s invisible goldfish spirit (appears only when you aren\u2019t looking).\u003cbr\u003e\u003cbr\u003eA dropped potion formed a watery portal. A hand reached through; the party pulled back Ash, who\u2019d been on a long spirit-world journey (felt like 45 years to Ash).\u003cbr\u003e\u003cbr\u003eKey events\u003cbr\u003e\u003cbr\u003eHidden archive: Scrolls describe D\u012bnu phasing between Spirit and Material Worlds; only D\u012bnu\u2019s poop manifests materially. Verses hint you must bring all four elements into harmony to contact D\u012bnu.\u003cbr\u003e\u003cbr\u003eFire-pets &amp; zodiac quest: The muscular young firebender continues bonding with animals (fire cat, Woofie the fire dog, Cuckoo the fire rooster) and wants connections to all 12 zodiac animals (today\u2019s attempt at a fire rat ended\u2026 poorly).\u003cbr\u003e\u003cbr\u003eCat chaos: The fire cat singed some scrolls before being dismissed.\u003cbr\u003e\u003cbr\u003eStabilizing the chamber: A richly dressed, highly skilled earthbender arrives\u2014revealed as the King of Omashu. Using a resonant glass pomegranate technique, he and the party stabilize the collapsing room (massive group healing\u002fsoothing resonance).\u003cbr\u003e\u003cbr\u003eOmashu hook: The king, an acquaintance of Vin Kotak (the tense airbender from earlier sessions), invites the party to Omashu to learn more about resonance stones and how the party uniquely uses them.\u003cbr\u003e\u003cbr\u003eSpirit contact via poop ritual: The group combined five poop pellets with the four elements (watered, frozen, sand-encapsulated, burned, air-swirled).\u003cbr\u003e\u003cbr\u003eResult: a thick, spiritually potent smoke.\u003cbr\u003e\u003cbr\u003eAsh, using a spirit-sight technique (\u201cSi U Li\u201d), saw and heard D\u012bnu emerge and briefly speak; others only heard a faint \u201cblub.\u201d D\u012bnu then faded; the smoke dissipated and the pellets were consumed.\u003cbr\u003e\u003cbr\u003eWrap-up: Bath at the oasis; plans made to travel north to Omashu next session, following the king\u2019s lead and the party\u2019s prior tip that a resonance stone lies there.\u003cbr\u003e\u003cbr\u003eCharacters (quick refresher)\u003cbr\u003e\u003cbr\u003eAsh (returned): Spirit-touched; can see spirit effects; has a dragon companion; newly improved airbending via resonance.\u003cbr\u003e\u003cbr\u003eMuscular young firebender (19): Open leather vest, big scar, long hair; animal-bonding focus; current companions: fire cat, Woofie (fire dog), Cuckoo (fire rooster); pursuing 12-zodiac bonds.\u003cbr\u003e\u003cbr\u003eSandbender (southern tribe): Ceremonial paint, desert-tough; pragmatic.\u003cbr\u003e\u003cbr\u003eRio (Northern Water Tribe): Calm, tired look; waterbender; tea-making; helped with stabilization.\u003cbr\u003e\u003cbr\u003eTemple Master\u002fScholar (NPC): Obsessed with decoding the fish-script scrolls; stays behind to study.\u003cbr\u003e\u003cbr\u003eKing of Omashu (NPC): Powerful, courteous earthbender; demonstrates resonance technique; offers mentorship\u002finvitation.\u003cbr\u003e\u003cbr\u003eWhat we learned\u003cbr\u003e\u003cbr\u003eD\u012bnu\u2019s nature: Invisible by choice; only poop is material; contact likely requires balanced multi-element ritual.\u003cbr\u003e\u003cbr\u003eResonance stones: Can imbue\u002fawaken secondary elements (party has experienced this). The king can teach more in Omashu.\u003cbr\u003e\u003cbr\u003eSpirit access: Spirit-sight lets mortals perceive otherwise invisible spirit effects, at least briefly.\u003cbr\u003e\u003cbr\u003eOpen threads &amp; to-dos\u003cbr\u003e\u003cbr\u003eTravel to Omashu; meet the king; research resonance stones and their safe use.\u003cbr\u003e\u003cbr\u003eContinue decoding fish-pictograph scrolls (master is on it).\u003cbr\u003e\u003cbr\u003eRefine the elemental ritual to reliably contact D\u012bnu (now out of pellets\u2014need new material manifestation).\u003cbr\u003e\u003cbr\u003ePursue the zodiac-bond quest (next up: fire rat\u2014bring gloves).\u003cbr\u003e\u003cbr\u003eKeep an eye on Vin Kotak and Lotus connections.\u003cbr\u003e\u003cbr\u003eSession end state\u003cbr\u003e\u003cbr\u003eLocation: Misty Palms \u2192 setting out across the desert toward Omashu.\u003cbr\u003e\u003cbr\u003eResources: No poop pellets left; one resonant glass pomegranate (king\u2019s, not the party\u2019s).\u003cbr\u003e\u003cbr\u003eParty status: Stable, cleaned up, motivated; Ash rejoined.\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e11\u003cbr\u003e\u003cbr\u003evariable #secondarystat #template #environmentalvariables\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCharisma\u003cbr\u003e\u003cbr\u003eprimarystat #variable #characterstat\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eConstitution\u003cbr\u003e\u003cbr\u003eprimarystat #variable #characterstat\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDexterity\u003cbr\u003e\u003cbr\u003eprimarystat #variable #characterstat\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eIntelligence\u003cbr\u003e\u003cbr\u003eprimarystat #variable #characterstat\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eStrength\u003cbr\u003e\u003cbr\u003eprimarystat #variable #characterstat\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eWisdom\u003cbr\u003e\u003cbr\u003eprimarystat #variable #characterstat\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAir\u003cbr\u003e\u003cbr\u003eprimarystat #variable #characterstat\u003cbr\u003e\u003cbr\u003e0\u003cbr\u003e\u003cbr\u003eprimarystat #variable #characterstat\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eEarth\u003cbr\u003e\u003cbr\u003eprimarystat #variable #characterstat\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eFire\u003cbr\u003e\u003cbr\u003eprimarystat #variable #characterstat\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eprimarystat #variable #characterstat\u003cb e\u003cbr\u003esecondarystat #variable #currentvariable #showiffirege1\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eAshen Steppes\u003cbr\u003e\u003cbr\u003eEnvironment:\u00a0Volcanic plains and hardened lava flows  \u003cbr\u003eSpecialized Style:\u00a0Magma Pulse Bending  \u003cbr\u003eDescription:  \u003cbr\u003eBuilt on a cooled lava plateau, Ashen Steppes is a hardy settlement that thrives amidst ash and fire. Their benders have developed\u00a0Magma Pulse Bending, a high-heat technique that focuses on heating and liquifying stone momentarily to create bursts of molten rock or steam-based propulsion. It\u2019s more aggressive and volatile than traditional earthbending, with a focus on explosive, short-range attacks and reshaping brittle volcanic stone mid-combat.\u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Lava Flare:\u00a0Melts a small patch of ground into a geyser of magma.\u003cbr\u003e    \u003cbr\u003e- Obsidian Shardstorm:\u00a0Shatters cooled lava into razor-sharp fragments hurled at foes.\u003cbr\u003e    \u003cbr\u003e- Ash Drift:\u00a0Uses heated air and ash for sudden propulsion or smokescreen escapes.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWhispering Mesa\u003cbr\u003e\u003cbr\u003eEnvironment:\u00a0Wind-carved sandstone cliffs and canyons  \u003cbr\u003eSpecialized Style:\u00a0Echoform Bending  \u003cbr\u003eDescription:  \u003cbr\u003ePerched atop labyrinthine mesas where the wind never stops howling, Whispering Mesa is home to benders who\u2019ve mastered\u00a0Echoform Bending\u2014a refined technique that utilizes sound vibrations and seismic pulses through brittle stone. They focus on precision, using thin slices, tremor sense, and harmonic resonance to create unstable conditions underfoot or launch sonic-reinforced projectiles.\u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Resonant Blade:\u00a0Vibrates stone into a cutting edge capable of slicing metal.\u003cbr\u003e    \u003cbr\u003e- Tremor Veil:\u00a0Distorts local vibrations to confuse tremor-sensing enemies.\u003cbr\u003e    \u003cbr\u003e- Echo Step:\u00a0Propels the user forward using a precisely timed ground pulse.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWould you like me to create adventure hooks or NPCs tied to these villages?\u003cbr\u003e\u003cbr\u003eYou said:\u003cbr\u003e\u003cbr\u003egreat now do the same for airbender villages\u003cbr\u003e\u003cbr\u003eChatGPT said:\u003cbr\u003e\u003cbr\u003eHere are three distinct\u00a0Airbender villages, each shaped by their unique environments and showcasing specialized Airbending styles that reflect their culture and surroundings:\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eZephyr\u2019s Climb\u003cbr\u003e\u003cbr\u003eEnvironment:\u00a0High-altitude glacier peak  \u003cbr\u003eSpecialized Style:\u00a0Stillwind Bending  \u003cbr\u003eDescription:  \u003cbr\u003eZephyr\u2019s Climb is nestled in the razor-thin air of a mountain range\u2019s highest glacier, where silence and stillness are paramount for survival. The airbenders here have developed\u00a0Stillwind Bending, a meditative form that emphasizes control of minute air currents and micro-movements. This precision-based style allows benders to manipulate even the most stagnant air to create silence zones, control breath patterns, and maintain balance on windswept peaks.\u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Silent Gale:\u00a0Dampens all nearby sound by stabilizing air pressure and movement.\u003cbr\u003e    \u003cbr\u003e- Breath Cloak:\u00a0Controls respiration and surface-level air to become undetectable to heat or motion sensors.\u003cbr\u003e    \u003cbr\u003e- Frozen Drift:\u00a0Uses fine gusts to levitate lightly over snow without leaving prints or triggering avalanches.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eHollow Reeds\u003cbr\u003e\u003cbr\u003eEnvironment:\u00a0Floating reed islands in a vast foggy marsh  \u003cbr\u003eSpecialized Style:\u00a0Reedflow Bending  \u003cbr\u003eDescription:  \u003cbr\u003eHollow Reeds is a nomadic, waterbound community drifting through an enormous marsh where visibility is low and navigation is based on air and scent. The benders here created\u00a0Reedflow Bending, a fluid, serpentine style that emulates the winding patterns of wind through wetland reeds. This style excels at low-altitude flight, air scent-tracking, and creating confusing, humid mirages using moisture-laden gusts.\u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Mist Spiral:\u00a0Twists warm air and fog into a smothering vortex that obscures vision and sound.\u003cbr\u003e    \u003cbr\u003e- Scent Echo:\u00a0Carries specific smells on wind currents for tracking or signaling.\u003cbr\u003e    \u003cbr\u003e- Whispering Drift:\u00a0Glides just above water without causing ripples, ideal for stealth and scouting.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCrimson Sails\u003cbr\u003e\u003cbr\u003eEnvironment:\u00a0Roaming cliffside windships on desert thermals  \u003cbr\u003eSpecialized Style:\u00a0Thermal Riding  \u003cbr\u003eDescription:  \u003cbr\u003eCrimson Sails is not a stationary village but a mobile flotilla of wind-powered skiffs and gliders that ride the desert\u2019s fierce thermals between cliff plateaus. The benders here specialize in\u00a0Thermal Riding, an acrobatic and speed-focused airbending style that manipulates vertical drafts and uses heat differentials to soar at high speeds. Their combat relies on divebomb maneuvers, sudden bursts of updrafts, and redirecting hot air from desert stones.\u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Updraft Spear:\u00a0Condenses a vertical wind column to launch people or objects skyward.\u003cbr\u003e    \u003cbr\u003e- Searing Glide:\u00a0Uses heat rising off hot stone to gain lift or deflect projectile attacks.\u003cbr\u003e    \u003cbr\u003e- Cyclone Lance:\u00a0A spinning, high-speed dive with piercing air pressure, used in aerial jousts.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eStonevine Hollow\u003cbr\u003eEnvironment: \u003cbr\u003eSubterranean jungle cave system\u003cbr\u003eSpecialized Style: \u003cbr\u003eVinegrasp BendingDescription:\u003cbr\u003eStonevine Hollow is hidden deep beneath the surface in a lush cave network where glowing fungi and creeping vines dominate the stone landscape. The villagers have developed Vinegrasp Bending, a technique that integrates earthbending with plant interaction. Benders here can manipulate soil and roots in tandem, weaving vines through stone or using soil nutrients to rapidly grow roots as whips, restraints, or bridges. They value patience and symbiosis, with their bending resembling a slow but overwhelming encroachment.Key Techniques:Root Snare: Erupts tangled roots from the soil to bind enemies.Fungal Bloom: Encourages explosive growth of bioluminescent fungi to blind foes or light paths.Symbiotic Armor: Covers the bender in flexible bark-like plating drawn from surrounding flora.\u003cbr\u003e\u003cbr\u003eAshen Steppes\u003cbr\u003eEnvironment: \u003cbr\u003eVolcanic plains and hardened lava flowsSpecialized Style: Magma Pulse BendingDescription:\u003cbr\u003eBuilt on a cooled lava plateau, Ashen Steppes is a hardy settlement that thrives amidst ash and fire. Their benders have developed Magma Pulse Bending, a high-heat technique that focuses on heating and liquifying stone momentarily to create bursts of molten rock or steam-based propulsion. It\u2019s more aggressive and volatile than traditional earthbending, with a focus on explosive, short-range attacks and reshaping brittle volcanic stone mid-combat.\u003cbr\u003eKey Techniques:\u003cbr\u003eLava Flare:\u003cbr\u003eMelts a small patch of ground into a geyser of magma.\u003cbr\u003eObsidianShardstorm: \u003cbr\u003eShatters cooled lava into razor-sharp fragments hurled at foes.\u003cbr\u003eAsh Drift: \u003cbr\u003eUses heated air and ash for sudden propulsion or smokescreen escapes.\u003cbr\u003e\u003cbr\u003eWhispering Mesa\u003cbr\u003eEnvironment: \u003cbr\u003eWind-carved sandstone cliffs and canyons\u003cbr\u003eSpecialized Style:\u003cbr\u003eEchoform Bending Description:\u003cbr\u003ePerched atop labyrinthine mesas where the wind never stops howling, Whispering Mesa is home to benders who\u2019ve mastered Echoform Bending\u2014a refined technique that utilizes sound vibrations and seismic pulses through brittle stone. They focus on precision, using thin slices, tremor sense, and harmonic resonance to create unstable conditions underfoot or launch sonic-reinforced projectiles.\u003cbr\u003eKey Techniques:\u003cbr\u003eResonant Blade: Vibrates stone into a cutting edge capable of slicing metal.\u003cbr\u003eTremor Veil: Distorts local vibrations to confuse tremor-sensing enemies.\u003cbr\u003eEcho Step: Propels the user forward using a precisely timed ground pulse.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eTABLE:\u003cbr\u003e+--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------+----------------------+----------------------+----------------------+----------------------+---------------------+\u003cbr\u003e| ee in darkness as if it were bright light, and is able to discern colors in darkness.&lt;br&gt;&lt;br&gt;Shadow Stealth.\u00a0While in dim light or darkness, the bobakik can take the Hide Action as a Bonus Action.&lt;br&gt;&lt;br&gt;Sunlight Weakness.\u00a0While in sunlight, the bobakik has disadvantage on attack rolls, ability checks, and saving throws.&lt;br&gt;&lt;br&gt;True Artisan.\u00a0The bobakik has proficiency with all artisans tools, as well as navigator's tools and thieves' tools.   |                      |                      |                      |                      |                     |\u003cbr\u003e| actionS                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                |                      |                      |                      |                      |                     |\u003cbr\u003e| Multiattack.\u00a0The bobakik makes two scratch or tool toss attacks. If it is targeting the master of its house, it instead makes three attacks.&lt;br&gt;&lt;br&gt;Scratch.\u00a0Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 5 (1d6 + 2) slashing damage.&lt;br&gt;&lt;br&gt;Tool Toss.\u00a0Ranged Weapon Attack: +4 to hit, range 15\u002f30 ft., one target. Hit: 4 (1d4 + 2) piercing damage.                                                                                                                              |                      |                      |                      |                      |                     |\u003cbr\u003e+-------------------------------------------------------------------------------------------
