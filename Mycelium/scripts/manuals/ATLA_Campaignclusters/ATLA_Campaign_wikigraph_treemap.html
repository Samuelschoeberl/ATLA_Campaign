--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------+----------------------+----------------------+----------------------+----------------------+----------------------+\u003cbr\u003e|                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      |                      |                      |                      |                      |                      |\u003cbr\u003e+--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------+----------------------+----------------------+----------------------+----------------------+----------------------+\u003cbr\u003e| # FROSTLING PUPPETEER  &lt;br&gt;Small fey, lawful evil                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    |                      |                      |                      |                      |                      |\u003cbr\u003e| Armor Class\u00a014&lt;br&gt;&lt;br&gt;Hit Points\u00a044 (8d6 + 16)&lt;br&gt;&lt;br&gt;Speed\u00a030 ft.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   |                      |                      |                      |                      |                      |\u003cbr\u003e| STR&lt;br&gt;&lt;br&gt;9 (-1)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    | DEX&lt;br&gt;&lt;br&gt;18 (+4)   | CON&lt;br&gt;&lt;br&gt;14 (+2)   | INT&lt;br&gt;&lt;br&gt;10 (+0)   | WIS&lt;br&gt;&lt;br&gt;12 (+1)   | CHA&lt;br&gt;&lt;br&gt;17 (+3)   |\u003cbr\u003e| Skills\u00a0Acrobatics +6, Deception +5&lt;br&gt;&lt;br&gt;Condition Immunities\u00a0charmedSenses\u00a0darkvision 60 ft., passive Perception 11&lt;br&gt;&lt;br&gt;Languages\u00a0Common, Sylvan&lt;br&gt;&lt;br&gt;Challenge\u00a03 (700 XP) \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0Proficiency Bonus\u00a0+2                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                |                      |                      |                      |                      |                      |\u003cbr\u003e| Frostling Puppet.\u00a0The frostling puppeteer\u2019s magical puppet has AC 14, 10 hit points, and resistance to non-magical bludgeoning, piercing, and slashing damage. If the puppet is destroyed, the Puppeteer can no longer use its Puppet Binding ability. It takes 24 hours for the Frostling Puppeteer to craft a new puppet.&lt;br&gt;&lt;br&gt;Magic Resistance.\u00a0The frostling puppeteer has advantage on saving throws against spells and other magical effects.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                |                      |                      |                      |                      |                      |\u003cbr\u003e| actionS                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              |                      |                      |                      |                      |                      |\u003cbr\u003e| Naughty, Naughty.\u00a0The frostling puppeteer targets one creature it can see within 30 feet with a harsh scolding. The target must succeed on a DC 13 Wisdom saving throw. On a failed save, the creature takes 14 (2d10 + 3) psychic damage and is frightened until the end of its next turn. On a successful save, the creature takes half as much and is not frightened.&lt;br&gt;&lt;br&gt;Puppet Binding.\u00a0The frostling puppeteer targets one creature it can see within 30 feet. The target must succeed on a DC 13 Wisdom saving throw or be bound by magical strings for up to 24 hours (if a child) or until the end of its next turn (if an adult). While bound, the target is controlled by the frostling puppeteer. The binding ends if the puppet is destroyed or the frostling puppeteer binds a new creature.&lt;br&gt;&lt;br&gt;Pull the Strings.\u00a0The frostling puppeteer commands a bound creature to move up to its full movement and take two of the following attacks:&lt;br&gt;&lt;br&gt;1. Feral Bite:\u00a0Melee Weapon Attack:\u00a0+6 to hit, reach 5 ft., one target.\u00a0Hit:\u00a011 (2d6 + 4) piercing damage.&lt;br&gt;2. Meltdown.\u00a0The bound creature lets out a petulant scream. All other creatures within 30 feet that can hear it must succeed a DC 13 Constitution saving throw or take 10 (3d6) Psychic damage.&lt;br&gt;3. Strangle.\u00a0The bound creature attempts to choke the target with the magical strings that bind it.\u00a0Melee Weapon Attack:\u00a0+6 to hit, reach 5 ft., one Medium or smaller creature.\u00a0Hit:\u00a0The creature is grappled (escape DC 13). Until this grapple ends, the target is restrained and at risk of suffocating, and the bound creature can\u2019t strangle another target. In addition, at the start of each of the target's turns, the target takes 7 (2d6) bludgeoning damage.&lt;br&gt;&lt;br&gt;\u00a0reactionS   |                      |                      |                      |                      |                      |\u003cbr\u003e| Ventriloquist's Dodge (3\u002fday).\u00a0When the frostling puppeteer is targeted by an attack, it can use its Reaction to magically swap places with a bound creature within 30 feet, causing the attack to target the bound creature instead.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                |                      |                      |                      |                      |                      |\u003cbr\u003e+--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------                                                                                                                                                                                                                                                                                                                                                  |                            |         |                             |                                                                                                                                                                                                                                                                                              |                              |    |    |    |    |    |    |\u003cbr\u003e| Damage Resistances\u00a0acid, fire, lightning, thunder; bludgeoning, piercing, and slashing from nonmagical attacks&lt;br&gt;&lt;br&gt;Damage Immunities\u00a0cold, necrotic, poison&lt;br&gt;&lt;br&gt;Condition Immunities\u00a0exhaustion, grappled, paralyzed, petrified, poisoned, prone, restrainedSenses\u00a0darkvision 60 ft., passive Perception 13&lt;br&gt;&lt;br&gt;Languages\u00a0Common&lt;br&gt;&lt;br&gt;Challenge\u00a05 (1,800 XP) \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0Proficiency Bonus\u00a0+3                                                                                                                                                                                                                                              |                      |                      |                     |                      |                      |        |        |         |          |           |                        |         |            |  space as narrow as 1 inch wide without squeezing.&lt;br&gt;&lt;br&gt;Spirit Siphon.\u00a0The Holiday Spirit draws power from festivities and collective emotion. The nature of any given festivity reflects the energy the creature is able to drain, determining its unique traits. The GM chooses from one of the traits from the table below, selecting one that best reflects the celebrations that have drawn the spirit\u2019s attention.&lt;br&gt;&lt;br&gt;Spirit Siphon Table&lt;br&gt;&lt;br&gt;\\                                     | \\                    | \\                    | \\                   | &lt;br&gt;\\                | ---\\                 | ---\\   | ---\\   | &lt;br&gt;\\   | Trait\\   | Effect\\   | Suggested Festivity\\   | &lt;br&gt;\\   | Present\\   | The first time the spirit deals damage to a creature on its turn, it rolls\u00a02d8. That creature takes additional cold damage equal to the result. If the result on both dice are the same, the target instead gains Temporary Hit Points equal to the result, and resists all damage dealt by the spirit until the start of the spirit\u2019s next turn.\\   | christmas, wedding, eid al-fitr\\   | &lt;br&gt;\\   | Regeneration\\   | The spirit regains 3 hit points at the start of its turn. This trait does not trigger if it took damage from a critical hit since the end of its last turn.\\   | easter, funeral\\   | &lt;br&gt;\\   | Big Day Beatdown\\   | The spirit aggressively targets the focus of the festivity. It has advantage on attack rolls against the creature(s) who are the subject of the current celebration, and the first time it deals damage to such a creature on its turn, it gains 1d10 Temporary Hit Points and can use its Reaction to move up to 30 feet.\\   | birthday, bar mitzvah, graduation, quincea\u00f1era\\   | &lt;br&gt;\\   | Drunken Merriment\\   | The spirit is one with flowing champagne and neat spirits. The first time it deals damage to a creature each turn, that creature must succeed on a DC14 Constitution saving throw or become poisoned for the next minute. A creature poisoned in this way is also intoxicated. It has disadvantage on Dexterity saving throws and Dexterity-based Attack Rolls, and speaks with slurred speech. A creature can repeat this save at the end of its turns, ending the effect on a success.\\   | new year, rosh hashanah\\   | &lt;br&gt;\\   | Dead Party. (Recharge 6)\\   | The Spirit knows the spell Animate Dead, and can use its Action to cast it without components. When it does so, it can choose the carcasses of beasts (such as carved chicken, suckling pig, etc.) to animate as zombies or skeletons, in addition to the bones and corpses of humanoids.\\   | d\u00eda de muertos, halloween\\   |    |    |    |    |    |    |\u003cbr\u003e| actionS                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  |                      |                      |                     |                      |                      |        |        |         |          |           |                        |         |            |                                                                                                                                                                                                                                                                                                                                                      |                                    |         |                 |                                                                                                                                                                |                    |         |                     |                                                                                                                                                                                                                                                                                                                               |                                                   |         |                      |                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             |                            |         |                             |                                                                                                                                                                                                                                                                                              |                              |    |    |    |    |    |    |\u003cbr\u003e| Multiattack.\u00a0The Holiday Spirit makes two Sapping Touch attacks.&lt;br&gt;&lt;br&gt;Sapping Touch.\u00a0Melee Weapon Attack:\u00a0+6 to hit, reach 5 ft., one target.\u00a0Hit:\u00a013 (2d8 + 4) necrotic damage, and the target feels a wave of apathy wash over them. They have a -1 penalty to the next attack roll or saving throw they make before the end of their next turn.&lt;br&gt;&lt;br&gt;Fluid Fling.\u00a0The Spirit hurls a fragment of its fluid body at a point it can see within 60 feet. Creatures within 10 feet of that point must succeed on a Dexterity saving throw, taking 4d10 poison damage and falling prone on a failed save. On a successful save, they take half as much damage and do not fall prone.   |                      |                      |                     |                      |                      |        |        |         |          |           |                        |         |            |                                                                                                                                                                                                                                                                                                                                                      |                                    |         |                 |                                                                                                                                                                |                    |         |                     |                                                                                                                                                                                                                                                                                                                               |                                                   |         |                      |                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             |                            |         |                             |                                                                                                                                                                                                                                                                                              |                              |    |    |    |    |    |    |\u003cbr\u003e+------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------+----------------------+----------------------+---------------------+----------------------+----------------------+--------+--------+---------+----------+-----------+------------------------+---------+------------+------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------+------------------------------------+---------+-----------------+----------------------------------------------------------------------------------------------------------------------------------------------------------------+--------------------+---------+---------------------+-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------+---------------------------------------------------+---------+----------------------+---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------+----------------------------+---------+-----------------------------+----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------+------------------------------+----+----+----+----+----+----+\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ehttps:\u002f\u002fdocs.google.com\u002fdocument\u002fd\u002fe\u002f2PACX-1vS6lUZOVfTes0fREKrjtLjDXrZ-oZkxG3jeoAdIFJErzhnTc82UnTnXKRTlWVBrhxy9c3bBBdj8Nkh0\u002fpub\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA vibrant Earth Kingdom festival, featuring opportunities for roleplay, games, and uncovering local rumors.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe players meet a famous Earth Kingdom sculptor who uses Earthbending to create works of art. Potential for puzzles or a heist story.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA challenge requiring precise Earthbending control, such as moving a delicate object or navigating a collapsing cave.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePlayers defend or breach a fortress using Earthbending tactics. Includes scalable mechanics for different player levels.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA sprawling network of caves hiding bandits, lost treasures, or ancient Earth Kingdom artifacts.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe players uncover a smuggling ring operating beneath a major Earth Kingdom city.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eHidden agendas during a local festival, such as smuggling or political rivalries.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe party must infiltrate or attack a bandit camp causing problems for a nearby town. Scalable combat and stealth options.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA session where the party is ambushed by bandits. Includes a scalable encounter table and potential motivations for the bandits.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe party must find a lost Air Nomad relic. Options for clues, red herrings, and NPCs involved.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eDetailed mechanics for a combat scenario with bandits, including scalable stats and optional objectives.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA beast attack on a village, with rules for scaling the beast\u2019s strength and integrating environmental hazards.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA reusable template for creating scalable combat challenges.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA reusable template for crafting social or dialogue-heavy scenarios.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA reusable template for creating Earthbending-based puzzles and challenges.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA reusable template for designing political intrigue scenarios.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eClues uncovered in a marketplace dispute that lead to a larger conspiracy.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA scavenger hunt for an ancient artifact, with puzzles and conflicting NPC objectives.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eOptions for resolving a bandit encounter through dialogue, including persuasion challenges and NPC personality traits.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe party witnesses a dispute in a busy marketplace and can choose to mediate, escalate, or exploit the situation.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eSkybison Polo Festival Extravaganza\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003eThe Skybison Polo Festival is an annual event held in the Air Nomad territories, combining thrilling competitions, festive games, and a cultural celebration of the bond between Air Nomads and their beloved skybison. This module introduces the players to the festival, offering opportunities for interaction, skill challenges, and intrigue.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eKey Locations\u003cbr\u003eThe Festival Grounds\u003cbr\u003e- A large, open area with colorful tents, food stalls, and stages for musical performances.\u003cbr\u003e- Games and activities like skybison rides, airbending obstacle courses, and market stalls selling unique wares.\u003cbr\u003e\u003cbr\u003eThe Polo Arena\u003cbr\u003e- The centerpiece of the festival, with a massive circular arena designed for skybison polo.\u003cbr\u003e- Spectators sit in tiered seating, cheering loudly as teams compete.\u003cbr\u003e\u003cbr\u003eThe Betting Tent\u003cbr\u003e- A lively hub where festival-goers can place bets on their favorite teams or players.\u003cbr\u003e- Operated by a charismatic Air Nomad known as Garo the Gamester.\u003cbr\u003e\u003cbr\u003eThe Stables\u003cbr\u003e- A quieter area where the competing skybison are cared for.\u003cbr\u003e- Players might meet the skybison caretakers or sneak around to uncover secrets.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eKey NPCs\u003cbr\u003eMaster Tenzho\u003cbr\u003e- An elder Air Nomad and referee of the polo matches. Wise but with a mischievous sense of humor.\u003cbr\u003e- Knows much about the history of skybison polo.\u003cbr\u003e\u003cbr\u003eGaro the Gamester\u003cbr\u003e- A charming and slightly shady Air Nomad who runs the betting tent.\u003cbr\u003e- Always looking for a way to turn a profit, possibly at the expense of honesty.\u003cbr\u003e\u003cbr\u003eTeam Azure Wings\u003cbr\u003e- A team of young, brash Air Nomads eager to prove their skills.\u003cbr\u003e- Might invite the players to join their team if they need extra members.\u003cbr\u003e\u003cbr\u003eTeam Sky Soarers\u003cbr\u003e- The reigning champions, led by the confident Kani Windstride.\u003cbr\u003e- They are skilled but harbor a secret\u2014they may be cheating to maintain their streak.\u003cbr\u003e\u003cbr\u003eRavi the Snack Vendor\u003cbr\u003e- A jovial vendor selling skybison-themed snacks.\u003cbr\u003e- Often hears interesting gossip from festival-goers.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eModule Hooks\u003cbr\u003e- An Invitation to Compete: A friendly Air Nomad approaches the players and invites them to join Team Azure Wings, either as players or strategists.\u003cbr\u003e- Suspicious Activity: Players overhear rumors of Team Sky Soarers cheating. They can investigate by talking to NPCs, sneaking into the stables, or tracking unusual behavior.\u003cbr\u003e- High-Stakes Betting: Garo the Gamester offers the players a deal to rig a match or uncover potential rigging by others.\u003cbr\u003e- Festival Trouble: A rogue skybison causes chaos, giving players a chance to save festival-goers and show their skills.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eKey Activities and Challenges\u003cbr\u003eSkybison Polo Match\u003cbr\u003e- A dynamic game where players use bending abilities or athletic prowess to assist their team in scoring goals.\u003cbr\u003e- Structured as a series of skill challenges, with opportunities for creativity and teamwork.\u003cbr\u003e\u003cbr\u003eBetting and Investigation\u003cbr\u003e- Players can place bets, investigate odds, or catch cheaters in the act.\u003cbr\u003e- Success depends on Insight, Persuasion, and Stealth rolls.\u003cbr\u003e\u003cbr\u003eFestival Games\u003cbr\u003e- Airbending obstacle courses, pie-eating contests, and skybison riding challenges offer chances for fun and minor rewards.\u003cbr\u003e\u003cbr\u003eThe Final Match\u003cbr\u003e- If the players participate in or interfere with the final match, it\u2019s a climactic scene with high stakes.\u003cbr\u003e- The outcome affects the players' reputation among the Air Nomads.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eComplications and Twists\u003cbr\u003e- Cheating Exposed: If the players expose Team Sky Soarers\u2019 cheating, the festival becomes tense, and the players must help restore fairness.\u003cbr\u003e- Skybison Stampede: Midway through the festival, a group of frightened skybison rampages through the grounds, requiring quick Action to protect the crowd.\u003cbr\u003e- A Mysterious Stranger: An enigmatic figure offers the players a chance to sabotage the match for a hefty reward, creating a moral dilemma.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eRewards\u003cbr\u003e- Air Nomad Artifacts: Unique trinkets and gear, such as a Skybison Whistle or a Windcatcher Cloak.\u003cbr\u003e- Favor of the Air Nomads: Unlock access to future Air Nomad storylines or resources.\u003cbr\u003e- Reputation and Renown: Gain prestige among festival-goers or uncover secrets tied to the Air Nomads\u2019 history.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eExploring an Air Nomad temple with traps, lore, and possible combat encounters.\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eRandom encounter tables for traveling through uncharted wilderness.\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eshe her\u003cbr\u003ePhysical Description:  \u003cbr\u003e        A sturdy woman with sun-kissed skin and short, spiky hair the color of sandy blonde. She has a confident, swaggering gait, often adorned with sand-crusted boots and bracers. Her lightweight armor is covered with fine grains of sand that move subtly as she walks.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Earthbending with a specialization in sand manipulation.\u003cbr\u003e    - Role:  \u003cbr\u003e        Oversees the Night Bloom\u2019s military operations, crafting strategies for their attacks.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Armor definition\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eNPC\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","","","","","","","","","","","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003emarkdown\u003cbr\u003eCollectionfile\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:Team-up Moves --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u251c\u2500\u2500 Earth\u003cbr\u003e                  \u2514\u2500\u2500 Earthbending Moves\u003cbr\u003e                      \u2514\u2500\u2500 glass fruit bending\u003cbr\u003e                          \u251c\u2500\u2500 FlashLemon Refractor Beam\u003cbr\u003e                          \u251c\u2500\u2500 Glassfruit Seed Mechanics\u003cbr\u003e                          \u251c\u2500\u2500 Inferno Bloom (Red Flamegrape)\u003cbr\u003e                          \u251c\u2500\u2500 Resonant Collapse (Blue Soundbanana)\u003cbr\u003e                          \u2514\u2500\u2500 Soulseed Harmonic Seal\u003cbr\u003e              \u251c\u2500\u2500 Spirit\u003cbr\u003e                  \u2514\u2500\u2500 Mechanics\u003cbr\u003e                      \u2514\u2500\u2500 Spiritbending\u003cbr\u003e              \u2514\u2500\u2500 Team-up Moves\u003cbr\u003e                  \u251c\u2500\u2500 Air-Earth\u003cbr\u003e                      \u2514\u2500\u2500 Sandstream\u003cbr\u003e                  \u2514\u2500\u2500 Water-Water\u003cbr\u003e                      \u251c\u2500\u2500 Freeze Projectiles\u003cbr\u003e                      \u2514\u2500\u2500 Frozen Aegis\u003cbr\u003e\u003cbr\u003e&lt;!-- END-AUTO-COLLECTION --&gt;\u003cbr\u003e\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eCollectionfile\u003cbr\u003eplayerroot\u003cbr\u003eteamup\u003c\u002fspan\u003e","","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eChi Blocking Rules\u003cbr\u003e\u003cbr\u003eChi Blocking is a specialized combat style that relies on targeting an opponent's pressure points to immobilize them or impede their bending abilities. \u003cbr\u003eChi Blockers are adept at neutralizing threats without requiring bending.\u003cbr\u003e\u003cbr\u003eCore Features\u003cbr\u003e- Pressure Point Strikes: Disable bending or other abilities temporarily.\u003cbr\u003e- Energy Points: Manage energy to execute powerful moves.\u003cbr\u003e- Evasion and Defense: Increased agility and defensive techniques.\u003cbr\u003e\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eThe creature can not move or be moved by force. Depending what causes Immobilisation you can save against it as an Action or can remove it with your bending more efficiently.\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eParalysis Mechanics\u003cbr\u003e\u003cbr\u003eCertain Chi Blocking moves cause paralysis, preventing the target from taking actions or bending for a specified duration.\u003cbr\u003e\u003cbr\u003eKey Moves\u003cbr\u003e- Pressure Point Strike\u003cbr\u003e- Nerve Strike\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eA slowed creatures Movement Speed is halved and it can not use any #Bonusactions or #reactions. ( #Action is allowed)\u003cbr\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003ePlayer Root\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eGrants Damage reduction. \u003cbr\u003eBase armor:\u003cbr\u003e\u003cbr\u003eGeneral Armor Definition reduces all Damage Types in addition to their specific type Armor (other than spiritual). \u003cbr\u003e\u003cbr\u003ePhysical Armor reduces all Piercing Slashing and bludgeoning Damage.\u003cbr\u003e\u003cbr\u003eBarrier Armor definintion Whenever you suffer unblocked damage Barrier Armor halves\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003e= Element Level - Stress Level\u003cbr\u003e\u003cbr\u003evariable\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eBarrier Armor definintion Whenever you suffer unblocked damage Barrier Armor halves (rounded down)\u003cbr\u003e\u003cbr\u003eFor example when you have 15 Barrier Armor and suffer 18 damage you suffer 3 Damage and Barrier Armour halves to 7.\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eReduces All Damage Types other than Spiritual Damage.\u003cbr\u003ebase general armor:\u003cbr\u003eEarthbending Level\u003cbr\u003e\u003cbr\u003eplayerroot\u003c\u002fspan\u003e","\u003cspan style=\"font-family:monospace;white-space:pre;\"\u003eCollectionfile \u003cbr\u003eHitpoints\u003cbr\u003eWhen your HP reach 0 you are unconscious and bleeding out. \u003cbr\u003e\u003cbr\u003eOn your Turn you have to roll a death saving throw. \u003cbr\u003eIf you have 3 Successes you become stable and don't have to roll anymore.\u003cbr\u003eIf you have 3 Failures you die.\u003cbr\u003e&lt;!-- BEGIN-AUTO-COLLECTION:HP --&gt;\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u251c\u2500\u2500 createnpc.py\u003cbr\u003e  \u251c\u2500\u2500 createpc.py\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 PCs\u003cbr\u003e          \u251c\u2500\u2500 Airwatterbendertest\u003cbr\u003e              \u2514\u2500\u2500 Airwatterbendertest Character Sheet.md\u003cbr\u003e          \u251c\u2500\u2500 Anju\u003cbr\u003e              \u2514\u2500\u2500 Player Root\u002fPCs\u002fAnju\u002fAnju Character Sheet\u003cbr\u003e          \u251c\u2500\u2500 Spirittest\u003cbr\u003e              \u2514\u2500\u2500 Spirittest Charact
